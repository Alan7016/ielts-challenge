<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Dashboard — IELTS Marathon</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="content" style="display:none;">

  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo">IELTS <span>MARATHON</span></div>
      <div style="display:flex; align-items:center; gap:14px; font-family:var(--mono); font-size:0.82rem; color:var(--muted);">
        <span>Hi, <span id="user-greeting" style="color:var(--ink); font-weight:600;">…</span></span>
        <button class="ghost" id="logout-btn" style="padding:7px 14px;">Log out</button>
      </div>
    </div>
  </header>

  <section class="hero" style="padding-top:64px; padding-bottom:8px;">
    <div class="wrap">
      <div class="eyebrow">Teacher view</div>
      <h1 id="page-title">Pick a day</h1>
      <p class="tag" id="page-sub">Choose a day, then one of your groups, to see how your students are doing.</p>
    </div>
  </section>

  <section>
    <div class="wrap" id="dashboard-root">
      <p style="color:var(--muted); font-family:var(--mono); font-size:0.85rem;">Loading…</p>
    </div>
  </section>

</div>

<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
<script>
  const TASKS_PER_DAY = 9;
  let liveDays = [];

  let myGroups = [];
  let selectedDay = null;
  let selectedGroup = null;

  requireAuth(async function (profile, user) {
    if (profile.role !== 'teacher') {
      window.location.href = 'index.html';
      return;
    }

    const sb = getSupabaseClient();
    const { data: assignments } = await sb.from('group_teachers').select('group_id').eq('teacher_id', user.id);
    const groupIds = (assignments || []).map(a => a.group_id);
    let groups = [];
    if (groupIds.length > 0) {
      const { data } = await sb.from('groups').select('id, name, challenge, level').in('id', groupIds).order('id');
      groups = data || [];
    }
    myGroups = groups;
    liveDays = await getLiveDays();

    showDayPicker();
  });

  // ---------- Screen 1: day grid ----------
  function showDayPicker() {
    selectedDay = null;
    selectedGroup = null;
    document.getElementById('page-title').textContent = 'Pick a day';
    document.getElementById('page-sub').textContent = 'Choose a day, then one of your groups, to see how your students are doing.';

    let html = '<div class="track-grid">';
    for (let d = 1; d <= 30; d++) {
      const isOpen = liveDays.includes(d);
      const isMock = MOCK_DAYS.includes(d);
      if (isMock && isOpen) {
        html += `<a href="mock-results.html?day=${d}" class="day-chip staff open mock">
          <span class="num">${String(d).padStart(2, '0')}</span>
          <span class="lbl">🎯 Mock Exam</span>
        </a>`;
      } else if (isOpen) {
        html += `<a href="#" class="day-chip staff open" data-day="${d}">
          <span class="num">${String(d).padStart(2, '0')}</span>
          <span class="lbl">Day ${d}</span>
        </a>`;
      } else {
        html += `<div class="day-chip staff locked${isMock ? ' mock' : ''}" title="Not live yet">
          <span class="num">${String(d).padStart(2, '0')}</span>
          <span class="lbl">${isMock ? '🎯 Mock Exam' : 'Day ' + d}</span>
        </div>`;
      }
    }
    html += '</div>';
    document.getElementById('dashboard-root').innerHTML = html;

    document.querySelectorAll('.day-chip.open[data-day]').forEach(chip => {
      chip.addEventListener('click', (e) => {
        e.preventDefault();
        selectedDay = +chip.dataset.day;
        showGroupPicker();
      });
    });
  }

  // ---------- Screen 2: group buttons ----------
  function showGroupPicker() {
    document.getElementById('page-title').textContent = `Day ${selectedDay} — pick a group`;
    document.getElementById('page-sub').textContent = '';

    if (myGroups.length === 0) {
      document.getElementById('dashboard-root').innerHTML = `
        <a href="#" class="back-link" id="back-to-days">← Back to days</a>
        <p style="color:var(--muted);">No groups assigned to your account yet.</p>
      `;
    } else {
      document.getElementById('dashboard-root').innerHTML = `
        <a href="#" class="back-link" id="back-to-days">← Back to days</a>
        ${renderGroupSections(myGroups, g => `
          <button class="group-btn" data-group="${g.id}">
            <span class="g-name">${g.name}</span>
            <span class="g-meta">View students →</span>
          </button>
        `)}
      `;
    }

    document.getElementById('back-to-days').addEventListener('click', (e) => { e.preventDefault(); showDayPicker(); });
    document.querySelectorAll('.group-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedGroup = myGroups.find(g => g.id === +btn.dataset.group);
        showStudentList();
      });
    });
  }

  // ---------- Screen 3: student list for this day + group ----------
  async function showStudentList() {
    document.getElementById('page-title').textContent = `${selectedGroup.name} — Day ${selectedDay}`;
    document.getElementById('page-sub').textContent = '';
    const root = document.getElementById('dashboard-root');
    root.innerHTML = `<a href="#" class="back-link" id="back-to-groups">← Back to groups</a><p style="color:var(--muted); font-family:var(--mono); font-size:0.85rem;">Loading students…</p>`;
    document.getElementById('back-to-groups').addEventListener('click', (e) => { e.preventDefault(); showGroupPicker(); });

    const sb = getSupabaseClient();
    const { data: students } = await sb.from('profiles').select('id, full_name, avatar_url, challenge, level').eq('group_id', selectedGroup.id).eq('role', 'student').order('full_name');

    if (!students || students.length === 0) {
      root.innerHTML = `<a href="#" class="back-link" id="back-to-groups">← Back to groups</a><p style="color:var(--muted);">No students registered in this group yet.</p>`;
      document.getElementById('back-to-groups').addEventListener('click', (e) => { e.preventDefault(); showGroupPicker(); });
      return;
    }

    const studentIds = students.map(s => s.id);
    const [{ data: progress }, { data: writings }, { data: speaking }, { data: points }] = await Promise.all([
      sb.from('progress').select('student_id, task, completed').eq('day', selectedDay).in('student_id', studentIds),
      sb.from('answers').select('student_id, value').eq('day', selectedDay).eq('field_id', 'task1-response').in('student_id', studentIds),
      sb.from('answers').select('student_id, field_id, value').eq('day', selectedDay).like('field_id', 'speaking-%').in('student_id', studentIds),
      sb.from('points').select('student_id, category, points, comment').eq('day', selectedDay).in('student_id', studentIds)
    ]);

    const writingScoreByStudent = {};
    (points || []).forEach(pt => {
      if (pt.category === 'writing') writingScoreByStudent[pt.student_id] = pt.points;
    });

    const doneByStudent = {};
    (progress || []).forEach(p => {
      doneByStudent[p.student_id] = doneByStudent[p.student_id] || new Set();
      if (p.completed) doneByStudent[p.student_id].add(p.task);
    });
    const writingByStudent = {};
    (writings || []).forEach(w => { writingByStudent[w.student_id] = w.value; });

    const speakingByStudent = {};
    (speaking || []).forEach(sp => {
      speakingByStudent[sp.student_id] = speakingByStudent[sp.student_id] || [];
      speakingByStudent[sp.student_id].push(sp);
    });
    const signedUrlByPath = {};
    await Promise.all((speaking || []).map(async (sp) => {
      const { data, error } = await sb.storage.from('speaking-recordings').createSignedUrl(sp.value, 3600);
      if (error) console.error('Signed URL failed for', sp.value, error);
      if (data) signedUrlByPath[sp.value] = data.signedUrl;
    }));

    function renderTicks(studentId) {
      const done = doneByStudent[studentId] || new Set();
      return Array.from({ length: TASKS_PER_DAY }, (_, i) =>
        `<span class="tick ${done.has(i + 1) ? 'done' : ''}"></span>`
      ).join('');
    }

    function renderWriting(studentId) {
      const value = writingByStudent[studentId];
      if (!value || !value.trim()) return '<p class="no-writing">No writing submitted yet.</p>';
      const wordCount = value.trim().split(/\s+/).length;
      return `
        <button class="writing-toggle" data-target="writing-${studentId}">Show writing (${wordCount} words) ▾</button>
        <div class="writing-box" id="writing-${studentId}">${value.replace(/</g, '&lt;')}</div>
      `;
    }

    function renderSpeaking(studentId) {
      const items = speakingByStudent[studentId] || [];
      if (items.length === 0) {
        return `<button class="writing-toggle" data-target="speak-${studentId}">Show speaking (0 recordings) ▾</button>
          <div class="writing-box" id="speak-${studentId}"><p class="no-writing">No recordings yet.</p></div>`;
      }
      const recordings = items.map(i => {
        const url = signedUrlByPath[i.value];
        const label = speakingLabel(i.field_id);
        return `<div style="margin-bottom:10px;">
          <span style="font-family:var(--mono); font-size:0.8rem; color:var(--muted);">${label}</span>
          ${url ? `<audio controls src="${url}" style="width:100%; margin-top:4px;"></audio>` : '<p class="no-writing">Playback unavailable</p>'}
        </div>`;
      }).join('');
      return `
        <button class="writing-toggle" data-target="speak-${studentId}">Show speaking (${items.length} recording${items.length === 1 ? '' : 's'}) ▾</button>
        <div class="writing-box" id="speak-${studentId}">${recordings}</div>
      `;
    }

    function renderTrackLabel(s) {
      const isC2 = s.challenge === '2.0';
      return `
        <div class="track-row" data-student="${s.id}" style="margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
          <label style="font-size:0.82rem; font-weight:600;">Track:</label>
          <select class="track-challenge-select" style="padding:4px 8px; border:1px solid var(--border); border-radius:6px;">
            <option value="1.0" ${!isC2 ? 'selected' : ''}>Challenge 1.0</option>
            <option value="2.0" ${isC2 ? 'selected' : ''}>Challenge 2.0</option>
          </select>
          <select class="track-level-select" style="padding:4px 8px; border:1px solid var(--border); border-radius:6px; ${isC2 ? '' : 'display:none;'}">
            <option value="standard" ${s.level === 'standard' ? 'selected' : ''}>Standard</option>
            <option value="advanced" ${s.level === 'advanced' ? 'selected' : ''}>Advanced</option>
            <option value="expert" ${s.level === 'expert' ? 'selected' : ''}>Expert</option>
          </select>
          <button class="ghost save-track" style="padding:4px 12px; font-size:0.8rem;">Save</button>
          <span class="save-status-track" style="font-size:0.8rem; color:var(--muted);"></span>
        </div>
      `;
    }

    function renderWritingScore(studentId) {
      const saved = writingScoreByStudent[studentId];
      return `
        <div class="points-row" data-student="${studentId}" style="margin-top:10px; padding-top:10px; border-top:1px dashed var(--border);">
          <label style="font-size:0.82rem; font-weight:600;">Writing score (0–5):</label>
          <input type="number" class="writing-score-input" min="0" max="5" step="0.5" value="${saved !== undefined ? saved : ''}" style="width:70px; margin:0 10px;">
          <label style="font-size:0.82rem;"><input type="checkbox" class="writing-ai-flag"> AI-generated (forces 0)</label>
          <button class="ghost save-writing-score" style="margin-left:12px; padding:4px 12px; font-size:0.8rem;">Save</button>
          <span class="save-status" style="font-size:0.8rem; color:var(--muted); margin-left:8px;"></span>
        </div>
      `;
    }

    root.innerHTML = `
      <a href="#" class="back-link" id="back-to-groups">← Back to groups</a>
      ${students.map(s => `
        <div class="student-row">
          <div class="student-row-top">
            <span class="student-name" style="display:flex; align-items:center; gap:10px;">
              ${s.avatar_url ? `<span class="avatar-circle" style="width:28px;height:28px;font-size:0.72rem;"><img src="${s.avatar_url}" alt="" onerror="this.parentElement.textContent='${initialsFor(s.full_name)}'"></span>` : `<span class="avatar-circle" style="width:28px;height:28px;font-size:0.72rem;">${initialsFor(s.full_name)}</span>`}
              ${s.full_name}
            </span>
            <div class="student-ticks"><div class="day-ticks">${renderTicks(s.id)}</div></div>
          </div>
          ${renderWriting(s.id)}
          ${renderSpeaking(s.id)}
          ${renderTrackLabel(s)}
          ${renderWritingScore(s.id)}
        </div>
      `).join('')}
    `;

    document.getElementById('back-to-groups').addEventListener('click', (e) => { e.preventDefault(); showGroupPicker(); });
    root.querySelectorAll('.track-row').forEach(row => {
      const studentId = row.dataset.student;
      const challengeSel = row.querySelector('.track-challenge-select');
      const levelSel = row.querySelector('.track-level-select');
      challengeSel.addEventListener('change', () => {
        levelSel.style.display = challengeSel.value === '2.0' ? 'inline-block' : 'none';
      });
      row.querySelector('.save-track').addEventListener('click', async () => {
        const status = row.querySelector('.save-status-track');
        status.textContent = 'Saving…';
        const newChallenge = challengeSel.value;
        const newLevel = newChallenge === '2.0' ? levelSel.value : null;
        const res = await sb.rpc('set_student_challenge_level', {
          target_student: studentId, new_challenge: newChallenge, new_level: newLevel
        });
        status.textContent = res.error ? '⚠️ Failed to save' : '✓ Saved';
        if (res.error) console.error(res.error);
      });
    });
    root.querySelectorAll('.writing-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const box = document.getElementById(btn.dataset.target);
        const nowShown = box.classList.toggle('show');
        btn.textContent = btn.textContent.replace(nowShown ? '▾' : '▴', nowShown ? '▴' : '▾');
      });
    });

    root.querySelectorAll('.points-row').forEach(row => {
      const scoreInput = row.querySelector('.writing-score-input');
      const aiFlag = row.querySelector('.writing-ai-flag');
      aiFlag.addEventListener('change', () => {
        if (aiFlag.checked) { scoreInput.value = '0'; scoreInput.disabled = true; }
        else { scoreInput.disabled = false; }
      });
      row.querySelector('.save-writing-score').addEventListener('click', async () => {
        const studentId = row.dataset.student;
        let val = parseFloat(scoreInput.value);
        if (isNaN(val)) val = 0;
        val = Math.max(0, Math.min(5, val));
        const status = row.querySelector('.save-status');
        status.textContent = 'Saving…';
        const res = await sb.from('points').upsert({
          student_id: studentId, day: selectedDay, category: 'writing',
          points: val, max_points: 5, awarded_by: 'teacher', updated_at: new Date().toISOString()
        }, { onConflict: 'student_id,day,category' });
        status.textContent = res.error ? '⚠️ Failed to save' : '✓ Saved';
        if (res.error) console.error(res.error);
      });
    });
  }
</script>
</body>
</html>
