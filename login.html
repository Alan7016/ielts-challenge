<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — IELTS Marathon</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="gate">
  <div class="gate-card">
    <div class="eyebrow">Welcome back</div>
    <h1>Log in</h1>
    <p>Enter your username and password to continue.</p>

    <form id="login-form">
      <input type="email" id="email" placeholder="Email" autocomplete="off" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Log in</button>
      <div class="gate-error" id="form-error"></div>
    </form>

    <p style="margin-top:18px; font-size:0.88rem;">New here? <a href="register.html">Create an account</a></p>
  </div>
</div>

<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('form-error');
    errorEl.textContent = '';

    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;

    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      console.error('Login error:', error);
      errorEl.textContent = error.message || 'Login failed — check the console for details.';
      return;
    }

    // Look up the account's role to send them to the right place.
    const { data: profile } = await sb.from('profiles').select('role').eq('id', data.user.id).single();
    const role = profile ? profile.role : 'student';

    const params = new URLSearchParams(window.location.search);
    const returnTo = params.get('returnTo');
    if (role === 'teacher') {
      window.location.href = 'teacher-dashboard.html';
    } else if (role === 'checker') {
      window.location.href = 'checker-dashboard.html';
    } else if (returnTo) {
      window.location.href = decodeURIComponent(returnTo);
    } else {
      window.location.href = 'index.html'; // students
    }
  });
</script>
</body>
</html>
