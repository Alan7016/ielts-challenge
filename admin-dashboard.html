<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — IELTS Marathon</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="content" style="display:none;">

  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo">IELTS <span>MARATHON</span></div>
      <div style="display:flex; align-items:center; gap:14px; font-family:var(--mono); font-size:0.82rem; color:var(--muted);">
        <span>Hi, <span id="user-greeting" style="color:var(--ink); font-weight:600;">…</span></span>
        <button class="ghost" id="logout-btn" style="padding:7px 14px;">Log out</button>
      </div>
    </div>
  </header>

  <section class="hero" style="padding-top:48px; padding-bottom:8px;">
    <div class="wrap">
      <div class="eyebrow">Admin view</div>
      <h1 id="page-title">Overview</h1>
      <div class="tab-toggle" id="top-tabs" style="margin-top:18px;">
        <button data-tab="overview" class="active">Overview</button>
        <button data-tab="groups">Groups</button>
      </div>
    </div>
  </section>

  <section>
    <div class="wrap" id="dashboard-root">
      <p style="color:var(--muted); font-family:var(--mono); font-size:0.85rem;">Loading…</p>
    </div>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
<script>
  const TASKS_PER_DAY = 9;
  let liveDays = [];
  let allGroups = [];
  let selectedDay = null;
  let selectedGroup = null;

  // Actual total-task count per day, read from the live files — some days
  // drop reading or listening, so this isn't a flat constant. Falls back to
  // 9 for any day not listed here (new days built after this was written).
  const DAY_TOTAL_TASKS = { 1: 9, 2: 9, 3: 9, 5: 9, 6: 9, 7: 9, 8: 8, 9: 8, 10: 8, 12: 8, 13: 8, 14: 8, 15: 8, 16: 8 };
  function totalTasksFor(day) { return DAY_TOTAL_TASKS[day] || 9; }

  requireAuth(async function (profile, user) {
    if (profile.role !== 'admin') {
      window.location.href = 'index.html';
      return;
    }

    const sb = getSupabaseClient();
    const { data: groups } = await sb.from('groups').select('id, name').order('id');
    allGroups = groups || [];
    liveDays = await getLiveDays();

    document.getElementById('top-tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('button'); if (!btn) return;
      document.querySelectorAll('#top-tabs button').forEach(b => b.classList.toggle('active', b === btn));
      if (btn.dataset.tab === 'overview') showOverview();
      else showGroupPicker();
    });

    showOverview();
  });

  // ---------- TAB 1: Overview ----------
  let dayChart = null, groupChart = null;

  function animateCount(el, target, opts) {
    opts = opts || {};
    const suffix = opts.suffix || '';
    const decimals = opts.decimals || 0;
    const duration = 900;
    const start = performance.now();
    function step(now) {
      const p = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = (target * eased).toFixed(decimals) + suffix;
      if (p < 1) requestAnimationFrame(step);
      else el.textContent = target.toFixed(decimals) + suffix;
    }
    requestAnimationFrame(step);
  }

  async function showOverview() {
    document.getElementById('page-title').textContent = 'Overview';
    const root = document.getElementById('dashboard-root');
    root.innerHTML = `<p style="color:var(--muted); font-family:var(--mono); font-size:0.85rem;">Loading…</p>`;
    if (dayChart) { dayChart.destroy(); dayChart = null; }
    if (groupChart) { groupChart.destroy(); groupChart = null; }

    const sb = getSupabaseClient();
    const nonMockDays = liveDays.filter(d => !MOCK_DAYS.includes(d)).sort((a, b) => a - b);
    const mockDaysLive = liveDays.filter(d => MOCK_DAYS.includes(d));

    // Supabase caps a single response at 1000 rows — with 16+ days of
    // progress rows across every student, that limit gets hit easily, and
    // silently truncates to whichever rows happened to come back first
    // (which looked like "only Day 1 has any data"). Page through in full.
    async function fetchAllRows(buildQuery) {
      const pageSize = 1000;
      let from = 0;
      let all = [];
      while (true) {
        const { data, error } = await buildQuery().range(from, from + pageSize - 1);
        if (error) { console.error(error); break; }
        all = all.concat(data || []);
        if (!data || data.length < pageSize) break;
        from += pageSize;
      }
      return all;
    }

    const [{ data: students }, progressRows, { data: staff }, { data: pointsRows }, { count: speakingCount }, { count: writingCount }] = await Promise.all([
      sb.from('profiles').select('id, group_id').eq('role', 'student'),
      nonMockDays.length > 0
        ? fetchAllRows(() => sb.from('progress').select('day, task, student_id').eq('completed', true).in('day', nonMockDays))
        : Promise.resolve([]),
      sb.from('profiles').select('role').in('role', ['teacher', 'checker']),
      sb.from('points').select('points'),
      sb.from('answers').select('*', { count: 'exact', head: true }).like('field_id', 'speaking-%'),
      sb.from('answers').select('*', { count: 'exact', head: true }).eq('field_id', 'task1-response')
    ]);

    const totalStudents = (students || []).length;
    const studentsByGroup = {};
    (students || []).forEach(s => {
      if (!s.group_id) return;
      studentsByGroup[s.group_id] = (studentsByGroup[s.group_id] || 0) + 1;
    });

    const teacherCount = (staff || []).filter(s => s.role === 'teacher').length;
    const checkerCount = (staff || []).filter(s => s.role === 'checker').length;
    const totalPoints = (pointsRows || []).reduce((sum, p) => sum + Number(p.points), 0);

    // completedCountByDay[day][studentId] = number of tasks that student completed that day
    const completedCountByDay = {};
    (progressRows || []).forEach(p => {
      completedCountByDay[p.day] = completedCountByDay[p.day] || {};
      completedCountByDay[p.day][p.student_id] = (completedCountByDay[p.day][p.student_id] || 0) + 1;
    });

    const dayPct = [];
    nonMockDays.forEach(day => {
      const need = totalTasksFor(day);
      const perStudent = completedCountByDay[day] || {};
      const finishedCount = Object.values(perStudent).filter(c => c >= need).length;
      const pct = totalStudents > 0 ? Math.round((finishedCount / totalStudents) * 100) : 0;
      dayPct.push({ day, pct, finishedCount });
    });

    // "Completed every single day" — a student counts only if they finished
    // ALL tasks on EVERY live day so far, not just on average.
    let perfectStudents = 0;
    if (totalStudents > 0 && nonMockDays.length > 0) {
      (students || []).forEach(s => {
        const allDone = nonMockDays.every(day => {
          const c = (completedCountByDay[day] || {})[s.id] || 0;
          return c >= totalTasksFor(day);
        });
        if (allDone) perfectStudents++;
      });
    }
    const perfectPct = totalStudents > 0 ? (perfectStudents / totalStudents * 100) : 0;

    const bestDay = dayPct.length ? dayPct.reduce((a, b) => (b.pct > a.pct ? b : a)) : null;
    const worstDay = dayPct.length ? dayPct.reduce((a, b) => (b.pct < a.pct ? b : a)) : null;

    let mockRow = '';
    if (mockDaysLive.length > 0) {
      mockRow = `<p style="margin-top:16px;"><a href="mock-results.html?day=${mockDaysLive[0]}" class="ghost" style="display:inline-block; padding:8px 16px; border-radius:8px; text-decoration:none;">🎯 View Mock Exam results (Day ${mockDaysLive.join(', ')}) →</a></p>`;
    }

    root.innerHTML = `
      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px; margin-bottom:14px;">
        <div class="stat-card" style="animation-delay:0.02s;"><div class="stat-num" id="c-students">0</div><div class="stat-label">Total students</div></div>
        <div class="stat-card" style="animation-delay:0.08s;"><div class="stat-num" id="c-groups">0</div><div class="stat-label">Groups</div></div>
        <div class="stat-card" style="animation-delay:0.14s;"><div class="stat-num" id="c-days">0</div><div class="stat-label">Live days</div></div>
        <div class="stat-card" style="animation-delay:0.20s;"><div class="stat-num" id="c-perfect">0%</div><div class="stat-label">Completed every day</div></div>
      </div>
      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px; margin-bottom:32px;">
        <div class="stat-card" style="animation-delay:0.26s;"><div class="stat-num" id="c-points">0</div><div class="stat-label">Points awarded</div></div>
        <div class="stat-card" style="animation-delay:0.32s;"><div class="stat-num" id="c-recordings">0</div><div class="stat-label">Speaking recordings</div></div>
        <div class="stat-card" style="animation-delay:0.38s;"><div class="stat-num" id="c-essays">0</div><div class="stat-label">Essays submitted</div></div>
        <div class="stat-card" style="animation-delay:0.44s;"><div class="stat-num" id="c-staff">0</div><div class="stat-label">Teachers + checkers</div></div>
      </div>

      <div style="display:grid; grid-template-columns:1.4fr 1fr; gap:16px; align-items:start;" id="chart-grid">
        <div class="chart-card" style="animation-delay:0.3s;">
          <h2 style="margin:0 0 4px;">Completion by day</h2>
          <p style="color:var(--muted); font-size:0.85rem; margin:0 0 14px;">
            ${bestDay ? `Best: <strong style="color:var(--ink);">Day ${bestDay.day}</strong> (${bestDay.pct}%)` : ''}
            ${worstDay && worstDay.day !== (bestDay && bestDay.day) ? ` · Lowest: <strong style="color:var(--ink);">Day ${worstDay.day}</strong> (${worstDay.pct}%)` : ''}
          </p>
          <canvas id="dayChart" height="220"></canvas>
        </div>
        <div class="chart-card" style="animation-delay:0.4s;">
          <h2 style="margin:0 0 14px;">Students per group</h2>
          <canvas id="groupChart" height="220"></canvas>
        </div>
      </div>
      ${mockRow}
    `;

    // ---- Animated counters ----
    animateCount(document.getElementById('c-students'), totalStudents);
    animateCount(document.getElementById('c-groups'), allGroups.length);
    animateCount(document.getElementById('c-days'), nonMockDays.length);
    animateCount(document.getElementById('c-perfect'), perfectPct, { suffix: '%', decimals: 0 });
    animateCount(document.getElementById('c-points'), totalPoints, { decimals: 0 });
    animateCount(document.getElementById('c-recordings'), speakingCount || 0);
    animateCount(document.getElementById('c-essays'), writingCount || 0);
    animateCount(document.getElementById('c-staff'), teacherCount + checkerCount);

    // ---- Bar chart: completion % per day ----
    if (dayPct.length > 0) {
      const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#3457d5';
      dayChart = new Chart(document.getElementById('dayChart'), {
        type: 'bar',
        data: {
          labels: dayPct.map(d => 'Day ' + d.day),
          datasets: [{
            label: '% of students finished',
            data: dayPct.map(d => d.pct),
            backgroundColor: dayPct.map(d => d.day === (bestDay && bestDay.day) ? '#f2a623' : accentColor),
            borderRadius: 6,
            maxBarThickness: 34
          }]
        },
        options: {
          responsive: true,
          animation: { duration: 900, easing: 'easeOutCubic' },
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => `${ctx.parsed.y}% finished (${dayPct[ctx.dataIndex].finishedCount}/${totalStudents})` } } },
          scales: { y: { beginAtZero: true, max: 100, ticks: { callback: (v) => v + '%' } } }
        }
      });
    } else {
      document.getElementById('dayChart').replaceWith(Object.assign(document.createElement('p'), { textContent: 'No days live yet.', style: 'color:var(--muted);' }));
    }

    // ---- Doughnut chart: students per group ----
    if (allGroups.length > 0) {
      const palette = ['#3457d5', '#f2a623', '#1f9d55', '#d5490f', '#7c5cff', '#0aa3a3', '#e0457b', '#9a7b4f'];
      groupChart = new Chart(document.getElementById('groupChart'), {
        type: 'doughnut',
        data: {
          labels: allGroups.map(g => g.name),
          datasets: [{
            data: allGroups.map(g => studentsByGroup[g.id] || 0),
            backgroundColor: allGroups.map((g, i) => palette[i % palette.length]),
            borderWidth: 2,
            borderColor: getComputedStyle(document.documentElement).getPropertyValue('--surface').trim() || '#fff'
          }]
        },
        options: {
          responsive: true,
          animation: { duration: 900, easing: 'easeOutCubic' },
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } }
        }
      });
    } else {
      document.getElementById('groupChart').replaceWith(Object.assign(document.createElement('p'), { textContent: 'No groups yet.', style: 'color:var(--muted);' }));
    }
  }

  // ---------- TAB 2: Groups (no day pre-selection needed) ----------
  function showGroupPicker() {
    document.getElementById('page-title').textContent = 'Groups';
    selectedGroup = null;

    if (allGroups.length === 0) {
      document.getElementById('dashboard-root').innerHTML = `<p style="color:var(--muted);">No groups exist yet.</p>`;
      return;
    }
    document.getElementById('dashboard-root').innerHTML = `
      <div class="group-btn-grid">
        ${allGroups.map(g => `
          <button class="group-btn" data-group="${g.id}">
            <span class="g-name">${g.name}</span>
            <span class="g-meta">View students →</span>
          </button>
        `).join('')}
      </div>
    `;
    document.querySelectorAll('.group-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedGroup = allGroups.find(g => g.id === +btn.dataset.group);
        selectedDay = liveDays.filter(d => !MOCK_DAYS.includes(d)).sort((a, b) => b - a)[0] || null;
        showStudentList();
      });
    });
  }

  function dayDropdownHtml() {
    const options = liveDays.filter(d => !MOCK_DAYS.includes(d)).sort((a, b) => b - a)
      .map(d => `<option value="${d}" ${d === selectedDay ? 'selected' : ''}>Day ${d}</option>`).join('');
    return `<select id="day-select" style="padding:6px 10px; border:1px solid var(--border); border-radius:8px; font-family:var(--mono); font-size:0.85rem;">${options}</select>`;
  }

  // ---------- Screen: full-detail student list for selected group + day ----------
  async function showStudentList() {
    document.getElementById('page-title').textContent = selectedGroup.name;
    const root = document.getElementById('dashboard-root');
    root.innerHTML = `
      <a href="#" class="back-link" id="back-to-groups">← Back to groups</a>
      <div style="display:flex; align-items:center; gap:10px; margin:12px 0 20px;">
        <label style="font-size:0.85rem; font-weight:600;">Viewing:</label>
        ${dayDropdownHtml()}
      </div>
      <p style="color:var(--muted); font-family:var(--mono); font-size:0.85rem;">Loading students…</p>
    `;
    document.getElementById('back-to-groups').addEventListener('click', (e) => { e.preventDefault(); showGroupPicker(); });
    document.getElementById('day-select').addEventListener('change', (e) => {
      selectedDay = +e.target.value;
      showStudentList();
    });

    const sb = getSupabaseClient();
    const { data: students } = await sb.from('profiles').select('id, full_name, avatar_url').eq('group_id', selectedGroup.id).eq('role', 'student').order('full_name');

    if (!students || students.length === 0) {
      root.insertAdjacentHTML('beforeend', `<p style="color:var(--muted);">No students registered in this group yet.</p>`);
      return;
    }

    const studentIds = students.map(s => s.id);
    const [{ data: progress }, { data: answers }, { data: pointsRows }] = await Promise.all([
      sb.from('progress').select('student_id, task, completed').eq('day', selectedDay).in('student_id', studentIds),
      sb.from('answers').select('student_id, task, field_id, value, is_correct').eq('day', selectedDay).in('student_id', studentIds),
      sb.from('points').select('student_id, category, points, comment').eq('day', selectedDay).in('student_id', studentIds)
    ]);

    const writingScoreByStudent = {};
    const bonusByStudent = {};
    (pointsRows || []).forEach(pt => {
      if (pt.category === 'writing') writingScoreByStudent[pt.student_id] = pt.points;
      if (pt.category.startsWith('bonus_')) {
        bonusByStudent[pt.student_id] = bonusByStudent[pt.student_id] || {};
        bonusByStudent[pt.student_id][pt.category] = { points: pt.points, comment: pt.comment };
      }
    });

    const doneByStudent = {};
    (progress || []).forEach(p => {
      doneByStudent[p.student_id] = doneByStudent[p.student_id] || new Set();
      if (p.completed) doneByStudent[p.student_id].add(p.task);
    });

    const answersByStudent = {};
    (answers || []).forEach(a => {
      answersByStudent[a.student_id] = answersByStudent[a.student_id] || {};
      answersByStudent[a.student_id][a.task] = answersByStudent[a.student_id][a.task] || [];
      answersByStudent[a.student_id][a.task].push(a);
    });

    // Speaking answers store a storage path, not the actual audio — fetch a
    // temporary playable URL for each one before rendering.
    const speakingPaths = (answers || []).filter(a => a.field_id.startsWith('speaking-')).map(a => a.value);
    const signedUrlByPath = {};
    await Promise.all(speakingPaths.map(async (path) => {
      const { data, error } = await sb.storage.from('speaking-recordings').createSignedUrl(path, 3600);
      if (error) console.error('Signed URL failed for', path, error);
      if (data) signedUrlByPath[path] = data.signedUrl;
    }));

    function renderTicks(studentId) {
      const done = doneByStudent[studentId] || new Set();
      return Array.from({ length: TASKS_PER_DAY }, (_, i) =>
        `<span class="tick ${done.has(i + 1) ? 'done' : ''}"></span>`
      ).join('');
    }

    function renderTaskDetail(studentId) {
      const byTask = answersByStudent[studentId] || {};
      const taskNums = Object.keys(byTask).map(Number).sort((a, b) => a - b);
      if (taskNums.length === 0) return '<p class="no-writing">No answers submitted yet.</p>';

      return taskNums.map(taskNum => {
        const items = byTask[taskNum];
        const graded = items.filter(i => i.is_correct !== null);
        const correctCount = graded.filter(i => i.is_correct === true).length;
        const scoreLabel = graded.length > 0 ? ` — ${correctCount}/${graded.length} correct` : '';

        const essay = items.find(i => i.field_id === 'task1-response');
        if (essay) {
          const words = essay.value.trim() ? essay.value.trim().split(/\s+/).length : 0;
          return `<div style="margin-bottom:14px;"><strong>Task ${taskNum} (writing, ${words} words):</strong>
            <div class="writing-box show" style="margin-top:6px;">${essay.value.replace(/</g, '&lt;') || '<span class="no-writing">Empty</span>'}</div></div>`;
        }

        const speakingItems = items.filter(i => i.field_id.startsWith('speaking-'));
        if (speakingItems.length > 0) {
          const recordings = speakingItems.map(i => {
            const url = signedUrlByPath[i.value];
            const label = speakingLabel(i.field_id);
            return `<div style="margin-bottom:10px;">
              <span style="font-family:var(--mono); font-size:0.8rem; color:var(--muted);">${label}</span>
              ${url ? `<audio controls src="${url}" style="width:100%; margin-top:4px;"></audio>` : '<p class="no-writing">Playback unavailable</p>'}
            </div>`;
          }).join('');
          return `<div style="margin-bottom:14px;"><strong>Task ${taskNum} (speaking, ${speakingItems.length} recordings):</strong><div style="margin-top:8px;">${recordings}</div></div>`;
        }

        const rows = items.map(i => {
          const mark = i.is_correct === true ? '✓' : i.is_correct === false ? '✗' : '';
          const color = i.is_correct === true ? 'var(--good)' : i.is_correct === false ? 'var(--warn)' : 'var(--muted)';
          return `<div style="display:flex; justify-content:space-between; gap:10px; padding:3px 0; font-size:0.85rem;">
            <span style="color:var(--muted); font-family:var(--mono);">${i.field_id}</span>
            <span style="color:var(--ink);">${i.value} <span style="color:${color}; font-weight:700;">${mark}</span></span>
          </div>`;
        }).join('');

        return `<div style="margin-bottom:14px;"><strong>Task ${taskNum}${scoreLabel}:</strong><div style="margin-top:4px;">${rows}</div></div>`;
      }).join('');
    }

    const bonusFields = [
      { category: 'bonus_article', label: 'Article analysis', max: 2 },
      { category: 'bonus_video', label: 'Video analysis', max: 2 },
      { category: 'bonus_reading_listening', label: 'Reading/Listening analysis', max: 3 }
    ];

    function renderGrading(studentId) {
      const savedWriting = writingScoreByStudent[studentId];
      const savedBonus = bonusByStudent[studentId] || {};
      const bonusRows = bonusFields.map(f => {
        const s = savedBonus[f.category] || {};
        return `
          <div style="display:flex; align-items:flex-start; gap:10px; margin-bottom:8px; flex-wrap:wrap;">
            <label style="font-size:0.82rem; font-weight:600; min-width:180px;">${f.label} (0–${f.max}):</label>
            <input type="number" class="bonus-score-input" data-category="${f.category}" data-max="${f.max}" min="0" max="${f.max}" step="0.5" value="${s.points !== undefined ? s.points : ''}" style="width:60px;">
            <input type="text" class="bonus-comment-input" data-category="${f.category}" placeholder="Quick comment (optional)" value="${(s.comment || '').replace(/"/g, '&quot;')}" style="flex:1; min-width:160px; padding:4px 8px; border:1px solid var(--border); border-radius:6px;">
          </div>
        `;
      }).join('');
      return `
        <div class="points-row" data-student="${studentId}" style="margin-top:10px; padding-top:10px; border-top:1px dashed var(--border);">
          <label style="font-size:0.82rem; font-weight:600;">Writing score (0–5):</label>
          <input type="number" class="writing-score-input" min="0" max="5" step="0.5" value="${savedWriting !== undefined ? savedWriting : ''}" style="width:70px; margin:0 10px;">
          <label style="font-size:0.82rem;"><input type="checkbox" class="writing-ai-flag"> AI-generated (forces 0)</label>
          <button class="ghost save-writing-score" style="margin-left:12px; padding:4px 12px; font-size:0.8rem;">Save writing</button>
          <span class="save-status-writing" style="font-size:0.8rem; color:var(--muted); margin-left:8px;"></span>

          <p style="font-size:0.82rem; font-weight:600; margin:14px 0 8px;">Bonus points</p>
          ${bonusRows}
          <button class="ghost save-bonus-points" style="padding:4px 12px; font-size:0.8rem;">Save bonus points</button>
          <span class="save-status-bonus" style="font-size:0.8rem; color:var(--muted); margin-left:8px;"></span>
        </div>
      `;
    }

    const listHtml = `
      ${students.map(s => `
        <div class="student-row">
          <div class="student-row-top">
            <a href="profile.html?student=${s.id}" target="_blank" class="student-name" style="display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit;">
              ${s.avatar_url ? `<span class="avatar-circle" style="width:28px;height:28px;font-size:0.72rem;"><img src="${s.avatar_url}" alt="" onerror="this.parentElement.textContent='${initialsFor(s.full_name)}'"></span>` : `<span class="avatar-circle" style="width:28px;height:28px;font-size:0.72rem;">${initialsFor(s.full_name)}</span>`}
              ${s.full_name}
            </a>
            <div class="student-ticks"><div class="day-ticks">${renderTicks(s.id)}</div></div>
          </div>
          <button class="writing-toggle" data-target="detail-${s.id}">Show details ▾</button>
          <div class="writing-box" id="detail-${s.id}">${renderTaskDetail(s.id)}</div>
          ${renderGrading(s.id)}
        </div>
      `).join('')}
    `;
    // Replace only the "Loading students…" line, keep the back-link + day dropdown above it intact.
    root.querySelector('p').outerHTML = listHtml;


    document.getElementById('back-to-groups').addEventListener('click', (e) => { e.preventDefault(); showGroupPicker(); });
    root.querySelectorAll('.writing-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const box = document.getElementById(btn.dataset.target);
        const nowShown = box.classList.toggle('show');
        btn.textContent = btn.textContent.replace(nowShown ? '▾' : '▴', nowShown ? '▴' : '▾');
      });
    });

    root.querySelectorAll('.points-row').forEach(row => {
      const studentId = row.dataset.student;
      const scoreInput = row.querySelector('.writing-score-input');
      const aiFlag = row.querySelector('.writing-ai-flag');
      aiFlag.addEventListener('change', () => {
        if (aiFlag.checked) { scoreInput.value = '0'; scoreInput.disabled = true; }
        else { scoreInput.disabled = false; }
      });
      row.querySelector('.save-writing-score').addEventListener('click', async () => {
        let val = parseFloat(scoreInput.value);
        if (isNaN(val)) val = 0;
        val = Math.max(0, Math.min(5, val));
        const status = row.querySelector('.save-status-writing');
        status.textContent = 'Saving…';
        const res = await sb.from('points').upsert({
          student_id: studentId, day: selectedDay, category: 'writing',
          points: val, max_points: 5, awarded_by: 'teacher', updated_at: new Date().toISOString()
        }, { onConflict: 'student_id,day,category' });
        status.textContent = res.error ? '⚠️ Failed to save' : '✓ Saved';
        if (res.error) console.error(res.error);
      });

      row.querySelector('.save-bonus-points').addEventListener('click', async () => {
        const status = row.querySelector('.save-status-bonus');
        status.textContent = 'Saving…';
        const scoreInputs = row.querySelectorAll('.bonus-score-input');
        const commentInputs = {};
        row.querySelectorAll('.bonus-comment-input').forEach(c => { commentInputs[c.dataset.category] = c.value.trim(); });

        const upserts = Array.from(scoreInputs).map(inp => {
          const max = parseFloat(inp.dataset.max);
          let val = parseFloat(inp.value);
          if (isNaN(val)) val = 0;
          val = Math.max(0, Math.min(max, val));
          return {
            student_id: studentId, day: selectedDay, category: inp.dataset.category,
            points: val, max_points: max, comment: commentInputs[inp.dataset.category] || null,
            awarded_by: 'checker', updated_at: new Date().toISOString()
          };
        });

        const res = await sb.from('points').upsert(upserts, { onConflict: 'student_id,day,category' });
        status.textContent = res.error ? '⚠️ Failed to save' : '✓ Saved';
        if (res.error) console.error(res.error);
      });
    });
  }
</script>
</body>
</html>
