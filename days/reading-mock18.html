var DATA = {"passages": {"1": "<h1>How the first trans-Atlantic telegraph cable was laid</h1>\n<p>On August 16 1858, the first telegraphic message crossed the Atlantic Ocean. Travelling along a recently laid cable, the message from Britain's Queen Victoria to US President James Buchanan took just 16 hours. Prior to this, communication across the Atlantic would have been by ship — and taken around 10 days.</p>\n<p>People had been communicating via overland telegraph since 1844 and messages had been passing between Britain and France since 1850 when the first submarine cable was laid in the English Channel. But the attempt to span the Atlantic Ocean was the most daring attempt yet — and was the talk of the age, the 19th-century equivalent of the Apollo space mission. The idea that one could seemingly cheat time and space was inspiring and it changed the way people thought about the world and their place in it.</p>\n<p>The driving force behind the trans-Atlantic telegraph cable was an American businessman called Cyrus Field. In 1856, he and Englishmen John Watkins Brett and Charles Tilson Bright formed the Atlantic Telegraph company. They raised £350,000 mostly from businessmen in London, Liverpool, Manchester and Glasgow. They also secured £14,000 annually from the British government plus the loan of ships and a similar amount from the US government.</p>\n<p>Getting the cable made proved to be difficult. The distance between the west coast of Ireland and Newfoundland is over 3,700km, and Field was unable to find a company that was capable of supplying the required cable in the desired time frame. As a result, two companies were engaged to fulfil the order. The cable had a core of seven copper wires down which the signal would pass. These were insulated with several layers of gutta-percha (a natural plastic made from tree sap) and then armoured with iron wire. When it was complete, the weight of the cable proved too great for any single ship. It was therefore loaded onto two: the British ship, HMS Agamemnon and the American ship, USS Niagara.</p>\n<p>The first attempt to lay the cable began on August 5 1857 with both ships departing from the west coast of Ireland, near Ballycarbery Castle. The venture did not go according to plan. The cable snapped on the first day, but was recovered from the bottom and repaired. A few days later, mid-Atlantic, the cable snapped again, this time in water 3km deep. It was lost and the expedition abandoned.</p>\n<p>The next summer in 1858 they tried again. On this expedition, the two great ships met mid-Atlantic, each carrying half the cable. The two ends were joined together and the ships sailed away from each other. The cable broke three times and each time they were forced to start again. On July 29, with little hope of success, the cable was joined for the fourth time and the ships sailed for home. This time they succeeded. The cable was landed in Newfoundland on August 4 and in Ireland the following day. And a week or so later Queen Victoria sent that first trans-Atlantic message to President Buchanan.</p>\n<p>The celebrations were tremendous. One US newspaper proclaimed:</p>\n<p style=\"margin-left:24px;font-style:italic;\">New York has seldom seen a more complete holiday than that on September 1 1858, in celebration of the successful laying of the Atlantic cable. The enthusiasm of an entire nation was expressed in this jubilee of its metropolis, and the era of a closer connection with Europe was well ushered in by a day of genuine rejoicing and gaiety.</p>\n<p>Celebrations were, however, short-lived: the cable performed badly and failed after just three weeks. The project was put on hold, but the concept had been proved possible. By 1865, further research had been carried out into the problems which had plagued the earlier cables. In addition, cables had been successfully laid in the Mediterranean and in the Persian Gulf. The cables that were used were better engineered, with thicker cores and better insulation allowing faster transmission speeds.</p>\n<p>In 1865, Field incorporated a second company to raise enough funds to try again. He chartered the largest ship in the world at the time, the SS Great Eastern, which could carry the entire Atlantic cable. Huge salt-water tanks and other state-of-the-art machinery were fitted to ensure it remained in mint condition during its journey. All went well until, in heavy winds 1000km off the coast of Newfoundland, the cable rubbed on the side of the ship, snapped and plunged to the deep ocean floor.</p>\n<p>Not one to quit, Field vowed to return the following year. This final 1866 expedition proved to be successful and the cable was put into commercial service on July 28. One month later, the 1865 cable was brought to the surface and repaired, providing a second Atlantic telegraph link.</p>\n<p>The service had obvious and immediate impact. People in government were able to respond more swiftly to evolving situations. News travelled more quickly, which boosted trade on both sides of the Atlantic. It also had a profound effect on things such as family life and cultural ties. For example, it was no longer so difficult for immigrants in America to keep in touch with their families back home.</p>\n<p>The roller-coaster of cable-laying highs and lows between 1857 and 1866 caught the imaginations of a generation the way the space race did in the 20th century. There was immense public interest in the endeavour and in telegraphy more generally. At the time, telegraphic science was reported widely in the newspapers and the fortunes of the telegraph companies were followed closely. Discussions of the pitfalls and solutions to spanning the Atlantic with cable became everyday topics of conversation, and endless articles in the newspapers ensured that the project stayed in people's thoughts.</p>", "2": "<h1>Removing unwanted noise</h1>\n<div class=\"para\">A</div>\n<p>A noisy restaurant, a busy road, or a windy day are all situations that can be intensely frustrating for the hearing impaired when trying to understand what other people are saying. Some 10 million people in the UK suffer from hearing difficulties and, helpful as hearing aids are, those who wear them often complain that background noise continues to interfere with their understanding. But what if hearing aid wearers could choose to filter out all the troublesome sounds and focus just on the voices they want to hear?</p>\n<p>Engineer Dr Richard Turner believes that this is fast becoming a possibility. He is developing a system that identifies the distracting noise and 'rubs it out'. 'The poor performance in noise of current hearing devices is a major reason why six million people in the UK who would benefit from hearing aids do not use them,' he said. Moreover, as the population ages, a greater number of people will be hindered by the inability to hear clearly. In addition, hearing-impaired patients who have been fitted with cochlear implants — devices implanted to help those whose auditory hair cells have died — suffer from similar limitations.</p>\n<div class=\"para\">B</div>\n<p>The solution lies in the statistics of sound, as Turner explained: 'Many interfering noises are immediately recognisable. Raindrops patter on a surface, a fire crackles, talkers babble at a party and the wind howls. But what makes these different noises sound the way they do? No two rain sounds are identical because the precise arrangement of falling water droplets is never repeated. Nonetheless, there must be statistical similarities in the sounds of these raindrops compared with, say, the crackle of a fire.' He believes that for this reason, the brain may be able to group similar types of sounds together based on their specific characteristics.</p>\n<p>Turner and his colleagues have analysed this process mathematically and then developed algorithms that mimic what the brain is doing. The mathematical system that they have developed is capable of being 'trained' — a process that uses new methods from the field of machine learning — so that it can recognise new sounds. 'Rather surprisingly, it seems that a relatively small set of statistics is sufficient to describe a large number of sounds' he says. Crucially, the system that Turner and his team have come up with is capable of telling the difference between speech and other types of sound.</p>\n<div class=\"para\">C</div>\n<p>'What we can now do is to erase background noise and pass these cleaned-up sounds to a listener to improve their perception in difficult surroundings,' said Turner. The idea is that future devices will have several different modes in which they can operate. These might include a mode for travelling in a car or on a train, a mode for places like a noisy party or a busy restaurant, a mode that can be used outdoors in windy weather, and so on. The device might intelligently select an appropriate mode based on the characteristics of the incoming sound.</p>\n<div class=\"para\">D</div>\n<p>'In a sense we are developing the technology to underpin intelligent hearing devices,' said Turner. An additional possibility would be for users to override the selection made by the device and select a processing mode based upon what sorts of noise they wish to erase. They could even guide the processing on their device using an interface on a mobile phone through wireless communication. Turner anticipates that his team will need two more years of simulating the effect of modifications that clean up sound before they start to work with device specialists. 'If these preliminary tests go well, then we'll be looking to work with hearing device companies to try to adapt their processing in order to incorporate these machine learning techniques.'</p>\n<div class=\"para\">E</div>\n<p>Tinnitus sufferers, who are plagued by a constant ringing in their ears, could also benefit from the technology. At present, people with tinnitus sometimes use environmental sound generators as a distraction from the ringing in their ears. But such generators offer only a limited selection of sounds — a gently flowing stream, waves lapping on the seashore, or leaves rustling. With the new technology, individual patients could select the best sound to distract them from their tinnitus.</p>\n<div class=\"para\">F</div>\n<p>The technology not only holds promise for helping the hearing impaired, but it also has the potential to improve phone calls — anyone who has ever tried to hold a conversation with someone phoning from a crowded room will recognise the possible benefits of such a facility. Systems that can deal with unwanted audio content would also be welcomed by the increasing numbers of people using video-sharing websites. For example, a video containing a conversation that takes place by a busy roadside on a windy day could be made more intelligible by isolating the speech from the noises — users could even be offered the chance to de-noise their video during the upload process.</p>", "3": "<h1>The Bug Picture</h1>\n<p class=\"sub\">Lara Zanarini gives her view on insects</p>\n<p>How many other species do we share our planet with? The truth is that scientists don't have the slightest idea. Some early guesses of 30 million or even 100 million have been replaced in the last few years with more reliable ones of somewhere between five to ten million species. But despite this massive uncertainty there is one thing which is indisputable: the vast majority of Earth's inhabitants are invertebrate — without a backbone — and most of those are insects.</p>\n<p>It is therefore not very surprising that these creatures have a pre-eminent impact on the functioning of global ecosystems. Creatures like us — and I don't just mean primates (such as apes and monkeys), but all vertebrates (back-boned animals) — make up less than three percent of all species.</p>\n<p>Yet it is these very animals that most people hold dear, especially those with a passing resemblance to ourselves. I use a slide in my lectures which has images of all sorts of insects along with one face-on image of a female slender loris, a wide-eyed furry primate, with a baby on its back. No prizes for guessing the first, and probably the only, thing audiences look at. It seems we can't help ourselves. Appealing they may be, but in the great ecological scheme of things, they are fairly useless. If you really want to understand the world around you — you need to take a serious look at insects.</p>\n<p>Pollination, the process by which flying insects transfer grains of pollen from one plant to another and so aid their reproduction, is perhaps one of the most essential partnerships ever to have evolved. This plant-insect version of 'I'll scratch your back if you scratch mine', has been around for 100 million years and it has given the world a rich diversity, and not just of flowering plants. Twenty thousand species of bee are responsible for the continued survival of the angiosperms, which includes a very long list of fruit and vegetables from pumpkins, plums and peas to cherries, cucumbers and cocoa.</p>\n<p>What about herbivory and carnivory — plant- and meat-eating? Ecology really doesn't get much more basic than this. The light energy from the sun is converted to chemical energy and the plants — the producers — that carry out this astonishing transformation are fed on by primary consumers — the herbivores. They in turn are eaten by secondary consumers — the carnivores. But it may come as a surprise to many that all the herds of grazing ungulates — cows, goats and sheep — are entirely 'out-munched', perhaps by a factor of ten to one, by myriads of tiny insects. What about the meat-eaters? Again, insects consume many times more animal flesh than all vertebrate carnivores put together, and ants alone are the major carnivorous species in any habitat you could mention.</p>\n<p>If this sounds implausible, consider that although insects are individually small, there are an awful lot of them — an estimated ten million, million, million (10<sup>19</sup>) with an impressively large biomass*. Insects are also the major food source for countless species. Many trillions of creatures a year are eaten by insect-eating species of birds, bats and a multitude of other furry and feathery animals. Space prevents me from extolling the role of insects in global decomposition and nutrient recycling.</p>\n<p>But there is a problem looming — the first effects of which we are already feeling. Almost every study that has been done to date points to a steady decline in insect species' richness and abundance. The loss of natural habitat and the prodigious amounts of pesticides used in agriculture are taking their toll. The decreases seen in well-studied insect groups such as bees and butterflies are surely taking place in many other groups as well. At what point does the web of life become so frayed that it starts to disintegrate? We may find out sooner rather than later.</p>\n<p>It is thought that the world's tropical forests hold more than half of all extant species. If these complex habitats are being felled and degraded at even the slowest rate that has been suggested, it will still only be a matter of a few hundred years before they are lost. It is therefore an inescapable conclusion that our planet could lose more than half of all its living species in the time it takes for a tiny acorn to become a veteran oak tree.</p>\n<p>There's no doubt about it — we are the most intelligent and capable species yet to evolve on Earth. In a very short time after our appearance we covered the entire globe, establishing colonies wherever it was possible to survive. A few of us have walked on the surface of the Moon and visited the deepest abysses of the oceans. We spend vast sums of money to probe the very make-up of matter and remotely examine other parts of our solar system. We want to understand the science of everything from the infinitesimally small to the astronomically large. This truly is 'big' science and of course it's expensive. But do we have to do it right now? What about understanding the environment a bit better? Perhaps what we actually need is a bit more 'bug' science.</p>\n<p style=\"font-size:14px;color:#555;\">* biomass: the total quantity or weight of organisms in a certain area</p>"}, "answers": {"1": "TRUE", "2": "FALSE", "3": "NOT GIVEN", "4": "FALSE", "5": "TRUE", "6": "TRUE", "7": "copper", "8": "weight", "9": "insulation", "10": "funds", "11": "government", "12": "trade", "13": "immigrants", "14": "V", "15": "III", "16": "IX", "17": "IV", "18": "VII", "19": "II", "20": "repeated", "21": "algorithms", "22": "statistics", "23": "speech", "24": "B", "25": "A", "26": "A", "27": "YES", "28": "NO", "29": "NOT GIVEN", "30": "YES", "31": "NO", "32": "C", "33": "E", "34": "A", "35": "F", "36": "D", "37": "C", "38": "D", "39": "A", "40": "B"}, "alt": {}, "expl": {"1": {"loc": "Para 4", "text": "'Field was unable to find a company that was capable of supplying the required cable in the desired time frame' → TRUE."}, "2": {"loc": "Para 5", "text": "'both ships departing from the west coast of Ireland' — the same location, not different ones → FALSE."}, "3": {"loc": "Para 6", "text": "'The cable broke three times' — no reason (manufacturing fault) is given for the breaks → NOT GIVEN."}, "4": {"loc": "Para 7 (quoted newspaper)", "text": "The quote celebrates 'the enthusiasm of an entire nation' and 'genuine rejoicing' — approval, not disapproval → FALSE."}, "5": {"loc": "Final paragraph", "text": "'telegraphic science was reported widely in the newspapers' → TRUE."}, "6": {"loc": "Final paragraph", "text": "'Discussions of the pitfalls and solutions... became everyday topics of conversation' → TRUE."}, "7": {"loc": "Para 4", "text": "'The cable had a core of seven copper wires' → 'copper'."}, "8": {"loc": "Para 4", "text": "'the weight of the cable proved too great for any single ship' → 'weight'."}, "9": {"loc": "Para 8", "text": "'better engineered, with thicker cores and better insulation' → 'insulation'."}, "10": {"loc": "Para 9", "text": "'Field incorporated a second company to raise enough funds to try again' → 'funds'."}, "11": {"loc": "Final paragraph", "text": "'People in government were able to respond more swiftly to evolving situations' → 'government'."}, "12": {"loc": "Final paragraph", "text": "'News travelled more quickly, which boosted trade' → 'trade'."}, "13": {"loc": "Final paragraph", "text": "'it was no longer so difficult for immigrants in America to keep in touch with their families' → 'immigrants'."}, "14": {"loc": "Section A", "text": "Describes hearing aids' poor performance in background noise → heading V, 'A drawback in the help currently available to those with hearing problems'."}, "15": {"loc": "Section B", "text": "Turner's statistical/mathematical model of sound classification → heading III."}, "16": {"loc": "Section C", "text": "'future devices will have several different modes... intelligently select an appropriate mode' → heading IX, self-adjusting hearing aid."}, "17": {"loc": "Section D", "text": "'Turner anticipates that his team will need two more years' before working with device specialists → heading IV, developments needing further research."}, "18": {"loc": "Section E", "text": "Tinnitus distraction sounds being improved → heading VII, more effective way to distract from a hearing problem."}, "19": {"loc": "Section F", "text": "Applications for phone calls and video-sharing websites → heading II, uses in media and communications."}, "20": {"loc": "Section B", "text": "'No two rain sounds are identical because the precise arrangement... is never repeated' → 'repeated'."}, "21": {"loc": "Section B", "text": "'developed algorithms that mimic what the brain is doing' → 'algorithms'."}, "22": {"loc": "Section B", "text": "'a relatively small set of statistics is sufficient to describe a large number of sounds' → 'statistics'."}, "23": {"loc": "Section B", "text": "'capable of telling the difference between speech and other types of sound' → 'speech'."}, "24": {"loc": "Section C–D", "text": "Future devices will have 'several different modes' selected based on incoming sound → B, adapts to different background noise."}, "25": {"loc": "Section E", "text": "'people with tinnitus sometimes use environmental sound generators as a distraction' — describes current use → A."}, "26": {"loc": "Section F", "text": "'a video... could be made more intelligible by isolating the speech from the noises... offered the chance to de-noise their video' → A, noise erased from video recordings."}, "27": {"loc": "Para 1", "text": "Early guesses (30–100 million) have been 'replaced... with more reliable ones' of 5–10 million, implying they were too high → YES."}, "28": {"loc": "Para 2", "text": "Vertebrates/primates 'make up less than three percent of all species' while insects have the 'pre-eminent impact' → primates are NOT significant ecologically → NO."}, "29": {"loc": "Para 4", "text": "The passage describes pollination's importance but does not comment on how much more there is to learn about it → NOT GIVEN."}, "30": {"loc": "Para 5", "text": "'it may come as a surprise to many that all the herds of grazing ungulates... are entirely out-munched... by insects' → YES."}, "31": {"loc": "Para 7", "text": "'At what point does the web of life become so frayed...? We may find out sooner rather than later' — implies soon, not a long time → NO."}, "32": {"loc": "Para 1", "text": "'Some early guesses... have been replaced... with more reliable ones' of species numbers → C, revised views on how many species exist."}, "33": {"loc": "Para 1", "text": "'there is one thing which is indisputable: the vast majority of Earth's inhabitants are invertebrate' → E."}, "34": {"loc": "Para 7", "text": "'Almost every study that has been done to date points to a steady decline in insect species' richness and abundance' → A."}, "35": {"loc": "Para 7", "text": "'The decreases seen in well-studied insect groups such as bees and butterflies' → F."}, "36": {"loc": "Para 8", "text": "'it will still only be a matter of a few hundred years before they are lost... our planet could lose more than half of all its living species' → D."}, "37": {"loc": "Para 3", "text": "'No prizes for guessing the first... thing audiences look at' — our instinctive reaction to human-like animals → C."}, "38": {"loc": "Para 3", "text": "'Appealing they may be, but... they are fairly useless' refers back to the human-like primate images → D, creatures similar to humans."}, "39": {"loc": "Final paragraph", "text": "'But do we have to do it right now? What about understanding the environment a bit better?' → A, not our priority at the moment."}, "40": {"loc": "Whole passage", "text": "The passage argues insects have far greater ecological importance than most people recognise → B."}}};

function qhtml(p){
if(p===1)return '<div class="qgroup"><h3>Questions 1-6</h3><p><i>Do the following statements agree with the information given in the passage? Write <b>TRUE / FALSE / NOT GIVEN</b>.</i></p>'+tf(1,'Field failed to find a company that could produce all of the cable needed by the specified date.')+tf(2,'HMS Agamemnon and USS Niagara set sail from different locations on August 5, 1857.')+tf(3,'On the 1858 expedition, the cable broke three times because of a manufacturing fault.')+tf(4,'The newspaper quoted in the passage disapproved of the enthusiasm that met the 1858 expedition.')+tf(5,'Many articles appeared in the press between 1857 and 1866 about the science behind the telegraph.')+tf(6,'Between 1857 and 1866, people talked about the problems related to the telegraph project on a regular basis.')+'</div><div class="qgroup"><h3>Questions 7-13</h3><p><i>Complete the notes below. Choose <b>ONE WORD ONLY</b> from the text for each answer.</i></p><div class="notes"><h3>The history of the trans-Atlantic telegraph</h3><div class="note-row"><b>The first attempts to lay cable:</b></div><div class="note-row">&bull; the Atlantic Telegraph company was set up by Field, Brett and Bright in 1856</div><div class="note-row">&bull; the central wires of the cable were made of '+gap(7)+'</div><div class="note-row">&bull; the cable was put onto two ships due to its '+gap(8)+'</div><div class="note-row">&bull; the 1857 attempt failed</div><div class="note-row">&bull; the cable was successfully laid in 1858</div><div class="note-row"><b>Events between 1858 and 1866:</b></div><div class="note-row">&bull; celebrations were brief since problems emerged</div><div class="note-row">&bull; further research led to the cable’s thickness and '+gap(9)+' being improved</div><div class="note-row">&bull; Field set up another company to get the '+gap(10)+' for another attempt</div><div class="note-row">&bull; the strong winds experienced by the SS Great Eastern led to the cable being lost</div><div class="note-row">&bull; the 1866 expedition was successful</div><div class="note-row"><b>The changes the trans-Atlantic telegraph brought about:</b></div><div class="note-row">&bull; members of the '+gap(11)+'</div><div class="note-row">&bull; could react more quickly to events</div><div class="note-row">&bull; news could be relayed faster, thus improving '+gap(12)+'</div><div class="note-row">&bull; it became easier for US '+gap(13)+'</div><div class="note-row">&bull; to maintain contact with their families</div></div></div>';
if(p===2)return '<div class="qgroup"><h3>Questions 14-19</h3><p><i>Reading Passage 2 has six sections, A–F. Choose the correct heading for each section from the list of headings below.</i></p><div class="box"><b>i</b> How hearing loss may be caused by certain types of sounds<br><b>ii</b> Uses for Turner’s research in media and communications<br><b>iii</b> Creating a model for the classification of sounds<br><b>iv</b> Potential developments that still require further research<br><b>v</b> A drawback in the help currently available to those with hearing problems<br><b>vi</b> Providing the hearing-impaired with training in new technology<br><b>vii</b> A more effective way to take attention away from a hearing problem<br><b>viii</b> Analysing the sounds produced in the process of speaking<br><b>ix</b> The possibility of a hearing aid that can adjust itself to different environments</div>'+sel(14,'Section A',['i','ii','iii','iv','v','vi','vii','viii','ix'])+sel(15,'Section B',['i','ii','iii','iv','v','vi','vii','viii','ix'])+sel(16,'Section C',['i','ii','iii','iv','v','vi','vii','viii','ix'])+sel(17,'Section D',['i','ii','iii','iv','v','vi','vii','viii','ix'])+sel(18,'Section E',['i','ii','iii','iv','v','vi','vii','viii','ix'])+sel(19,'Section F',['i','ii','iii','iv','v','vi','vii','viii','ix'])+'</div><div class="qgroup"><h3>Questions 20-23</h3><p><i>Complete the summary below. Choose <b>NO MORE THAN TWO WORDS</b> from the passage for each answer.</i></p><p class="summary-text"><b>Improving the performance of hearing aids</b><br>At present, many people find their hearing aids do not work well when there is background noise. This also applies to people without hearing aids who have had implants fitted to help with hearing loss. Dr Richard Turner is looking for a solution to this problem. Although sounds are never '+gap(20)+', he believes they do share some similarities. He and his colleagues have worked on a mathematical system using '+gap(21)+' which replicate how we hear sounds. To allow this system to be ‘trained’, they have applied procedures used in machine learning and found that many different sounds can be described using a limited number of '+gap(22)+'. They have now developed a system that can distinguish '+gap(23)+' from other sounds.</p></div><div class="qgroup"><h3>Questions 24-26</h3><p>Choose the correct letter, A, B, C or D.</p>'+mcq(24,'Turner’s team are now planning a new development involving a device which could',['allow sound to be heard at a greater distance.','adapt itself to different kinds of background noise.','allow a user to remove all types of sound completely.','adapt itself to disorders involving other senses.'])+mcq(25,'In section E, a stream, waves and leaves are examples of the sounds that tinnitus sufferers',['can currently use to help their condition.','might choose to use if they were available.','hear in their ears as a result of their condition.','find to be the most natural solutions to their problem.'])+mcq(26,'The writer refers to ‘a busy roadside on a windy day’ in section F to illustrate that',['unwanted noise could be erased from video recordings.','some environments are difficult for the hearing-impaired.','when noises are combined in a video they are difficult to erase.','people must cooperate in order to learn how to apply the technology.'])+'</div>';
return '<div class="qgroup"><h3>Questions 27-31</h3><p><i>Do the following statements agree with the views of the writer? Write <b>YES / NO / NOT GIVEN</b>.</i></p>'+tf(27,'Early guesses probably greatly over-estimated the total number of species on Earth.',true)+tf(28,'Primates play a significant role in the ecology of our planet.',true)+tf(29,'We still have a great deal to learn about the importance of pollination.',true)+tf(30,'Some people may be unaware that the world’s insects consume more food overall than mammals.',true)+tf(31,'It will take a long time for us to learn the effects of habitat loss and extensive pesticide use.',true)+'</div><div class="qgroup"><h3>Questions 32-36</h3><p>Complete each sentence with the correct ending, A–F, below.</p><div class="box"><b>A</b> a fall in the total number and variety of insects in the world.<br><b>B</b> the number of plants that are pollinated by insects.<br><b>C</b> how many different animal species are currently in existence.<br><b>D</b> how long it will be before the Earth’s biodiversity is drastically reduced.<br><b>E</b> the predominance of invertebrates among the Earth’s species.<br><b>F</b> the declining numbers of bees and butterflies.</div>'+sel(32,'Scientists have recently revised their views regarding',['A','B','C','D','E','F'])+sel(33,'There is absolutely no doubt about',['A','B','C','D','E','F'])+sel(34,'Almost every study done so far has indicated',['A','B','C','D','E','F'])+sel(35,'A lot of research on insect groups has focused on',['A','B','C','D','E','F'])+sel(36,'The rate at which tropical forests are being lost can help us calculate',['A','B','C','D','E','F'])+'</div><div class="qgroup"><h3>Questions 37-40</h3><p>Choose the correct letter, A, B, C or D.</p>'+mcq(37,'In the third paragraph, the writer refers to a particular slide to emphasise',['the predominance of insects in the world.','a common misunderstanding about global biodiversity.','our instinctive reaction towards certain types of animals.','the main distinction between vertebrates and invertebrates.'])+mcq(38,'What does ‘they’ in the third paragraph refer to?',['lectures about animals given by the writer','audiences who attend events focused on insect life','images which depict various different types of species','creatures which appear comparatively similar to humans'])+mcq(39,'What does the writer imply about ‘big’ science in the final paragraph?',['It should not be our priority at the moment.','It serves no useful purpose in the long term.','It will cost an unreasonable amount in the future.','It results from our natural curiosity about the world.'])+mcq(40,'What point does the writer make overall about insects?',['Certain insect species are more at risk than others.','Insects are more important than many people realise.','There is an interdependence between different insect species.','The ecological role of insects is likely to change in the near future.'])+'</div>';
}

function render(){partTitle.textContent='Part '+active;var r=ranges[active];partSub.textContent='Read the text and answer questions '+r[0]+'-'+r[1]+'.';left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();drawFooter();left.scrollTop=right.scrollTop=0}
function val(n){var g=document.getElementById('gap'+n);if(g)return g.value;var s=document.getElementById('sel'+n);if(s)return s.value;var r=document.querySelector('input[name="q'+n+'"]:checked');return r?r.value:''}
function save(){for(var n=1;n<=40;n++){var v=val(n);if(v)state[n]=v}}
function restore(){for(var n=1;n<=40;n++){if(!state[n])continue;var g=document.getElementById('gap'+n);if(g)g.value=state[n];var s=document.getElementById('sel'+n);if(s)s.value=state[n];var r=document.querySelector('input[name="q'+n+'"][value="'+state[n]+'"]');if(r)r.checked=true}}
function answered(n){return !!state[n]||!!val(n)}
function count(p){var r=ranges[p],c=0;for(var i=r[0];i<=r[1];i++)if(answered(i))c++;return c}
function drawFooter(){save();var h='';[1,2,3].forEach(p=>{var r=ranges[p];h+='<div class="partnav"><button class="partlabel" data-part="'+p+'">Part '+p+'</button>';if(p===active){h+='<div class="tiles">';for(var n=r[0];n<=r[1];n++)h+='<button class="tile '+(answered(n)?'answered':'')+'" data-q="'+n+'">'+n+'</button>';h+='</div>'}else h+='<span class="count">'+count(p)+' of '+(r[1]-r[0]+1)+'</span>';h+='</div>'});h+='<button class="review" id="review">OK</button>';footer.innerHTML=h}
document.addEventListener('change',()=>{save();drawFooter()});document.addEventListener('input',()=>{save();drawFooter()});
var lastScore=null;
function renderActive(){left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();if(graded){regradeCurrent();right.insertAdjacentHTML('afterbegin','<div class="score">Your score: <b>'+lastScore+' / 40</b></div><p style="margin:-8px 0 18px;color:#555">Explanations with the exact location in the passage are shown below each answer. Switch Part 1/2/3 tabs to review the rest.</p>')}drawFooter();left.scrollTop=right.scrollTop=0}
footer.onclick=e=>{var p=e.target.closest('[data-part]');if(p){save();active=+p.dataset.part;renderActive();return}var q=e.target.closest('[data-q]');if(q){var n=+q.dataset.q;(document.getElementById('q'+n)||document.getElementById('gap'+n)||document.getElementById('sel'+n))?.scrollIntoView({behavior:'smooth',block:'center'});return}if(e.target.closest('#review'))review()};
function review(){save();var a=0;for(var n=1;n<=40;n++)if(answered(n))a++;subwrap.innerHTML='<p>You have answered <b>'+a+'</b> of 40 questions.</p><p><button class="ovrow submit" id="final">Submit test</button></p>';final.onclick=grade;submit.classList.add('show')}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function correct(n,v){return [answers[n]].concat(alt[n]||[]).some(a=>norm(a)===norm(v))}
function explHTML(n){var e=EXPL[n];if(!e)return '';return '<div class="expl"><b>Q'+n+' — correct answer: '+answers[n]+'</b> &nbsp;<span class="expl-loc">('+e.loc+')</span><br>'+e.text+'</div>'}
function markGap(n){var x=document.getElementById('gap'+n);if(!x)return;var ok=correct(n,x.value);x.disabled=true;x.classList.add(ok?'ok':'no');x.insertAdjacentHTML('afterend',(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>')+explHTML(n));return ok}
function markSel(n){var s=document.getElementById('sel'+n);if(!s)return;var ok=correct(n,s.value);s.disabled=true;s.classList.add(ok?'ok':'no');var row=document.getElementById('q'+n);row.insertAdjacentHTML('beforeend',(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>'));row.insertAdjacentHTML('afterend',explHTML(n));return ok}
function markRadio(n){var r=document.querySelector('input[name="q'+n+'"]:checked');var ok=r&&correct(n,r.value);document.querySelectorAll('input[name="q'+n+'"]').forEach(i=>i.disabled=true);var box=document.getElementById('q'+n);box.insertAdjacentHTML('beforeend',(ok?'<span class="tag ok">\u2713</span>':'<span class="tag no">\u2718 correct: '+answers[n]+'</span>'));box.insertAdjacentHTML('afterend',explHTML(n));return ok}
function regradeCurrent(){var r=ranges[active];for(var n=r[0];n<=r[1];n++){var g=document.getElementById('gap'+n),s=document.getElementById('sel'+n),rad=document.querySelector('input[name="q'+n+'"]');if(g)markGap(n);else if(s)markSel(n);else if(rad)markRadio(n)}}
function grade(){if(graded)return;save();var score=0;for(var n=1;n<=40;n++)if(correct(n,state[n]||''))score++;lastScore=score;graded=true;active=1;renderActive();submit.classList.remove('show')}
var drag=false;div.onmousedown=()=>{drag=true;document.body.style.userSelect='none'};window.onmouseup=()=>{drag=false;document.body.style.userSelect=''};window.onmousemove=e=>{if(!drag)return;var r=split.getBoundingClientRect();left.style.width=Math.max(220,Math.min(r.width-240,e.clientX-r.left))+'px'};
split.onmouseup=()=>setTimeout(()=>{var s=getSelection();if(!s||s.isCollapsed||!s.rangeCount){tools.style.display='none';return}var rg=s.getRangeAt(0);if(!split.contains(rg.commonAncestorContainer)){tools.style.display='none';return}var rc=rg.getBoundingClientRect();tools.style.display='flex';tools.style.left=(rc.left+scrollX)+'px';tools.style.top=Math.max(8,rc.top+scrollY-42)+'px'},1);
tools.onclick=e=>{var b=e.target.closest('button'),s=getSelection();if(!b||!s.rangeCount)return;var rg=s.getRangeAt(0);if(b.dataset.act==='hl'){try{var sp=document.createElement('span');sp.className='hl';rg.surroundContents(sp)}catch(_){document.execCommand('hiliteColor',false,'#ffe45c')}}else document.querySelectorAll('.hl').forEach(h=>h.replaceWith(document.createTextNode(h.textContent)));s.removeAllRanges();tools.style.display='none'};
render();
// ---- Bridge added for the mock exam orchestrator ----
// grade() and the underlying state are normally private to this IIFE.
// Exposing them lets the parent page force-grade this test and read the
// result when time runs out, without needing the student to click Submit.
window.__mockForceGrade = grade;
window.__mockGetResult = function () {
  if (!graded) return null;
  var answers = {}, key = {};
  for (var n = 1; n <= 40; n++) {
    answers[n] = state[n] || '';
    key[n] = DATA.answers[n];
  }
  return { score: lastScore, total: 40, answers: answers, key: key };
};
})();
</script></body></html>
