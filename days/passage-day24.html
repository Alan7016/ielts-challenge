var active=1,graded=false,state={},ranges={1:[1,13],2:[14,26],3:[27,40]};
var DATA = {"passages": {"1": "<h1>Feeding the World</h1>\n<p class=\"sub\">Feeding the world while nurturing the planet doesn't necessarily mean going back to nature, Andy Coghlan reports</p>\n<p>The world's population continues to climb and, despite the rise of high-tech agriculture, 800 million people don't get enough to eat. Admittedly, this is often due to lack of money since the world actually produces enough for everyone. However, by 2050, we will have 9 billion mouths to feed, 3 billion more than today. 'Agriculture must become the solution to environmental problems in 50 years. If we don't have systems that make the environment better — not just hold the fort — then we're in trouble,' says Kenneth Cassman, an agronomist at the University of Nebraska in America. That view was echoed by the Curry Report, a government panel that surveyed the future of farming in Britain.</p>\n<p>Concerned consumers are facing what appears to be an ever-widening ideological divide. In one corner are the techno-optimists, who put their faith in genetically modified crops and improved agro-chemicals; in the other are advocates of organic farming, who reject artificial chemicals and embrace back-to-nature techniques. Both sides cite plausible science to back their claims, leaving many people to believe we're faced with a stark choice between two mutually incompatible options.</p>\n<p>Not so. If you set ideology aside, and simply ask how the world can produce the food it needs with the least environmental cost, a new middle way opens. Like today's organic farming, the intelligent farming of the future should pay much more attention to the health of its soil and the ecosystem it is part of, as well as making shrewd and locally appropriate use of chemical fertilizers and pesticides. The most crucial ingredient in this new style of agriculture is not chemicals but information about what is happening in each field and how to respond.</p>\n<p>Organic farming sounds attractive since an approach that rejects synthetic chemicals surely runs no risk of poisoning land and water, and its emphasis on natural ecosystems seems to be good for everyone. Perhaps these easy assumptions explain why sales of organic food across Europe are increasing by at least 50% a year. Going organic sounds idyllic, but it is also naïve and has its own suite of environmental costs, which can be worse than those of conventional farming, especially if it were to become the world norm. Fundamentally, the organic versus chemical debate focuses on the wrong question. The issue is not what you put into a farm, but what you get out of it, both in terms of crop yields and pollutants.</p>\n<p>It is a fundamental belief of organic farming that chemical fertilizers are unwholesome, and plant nutrients must come from natural sources. But in effect, the main environmental damage done by chemical fertilizers, as opposed to any other kinds, is through the carbon dioxide from the fossil fuels used in their synthesis, and nitrogen oxides released by their degradation. Excess nitrogen from chemical fertilizers can pollute groundwater, but so can excess nitrogen from organic manures.</p>\n<p>Advocates of organic farming like to point out that fields organically managed can produce yields just as high as fields enhanced with synthetic fertilizers. For example, Bill Liebhardt, at the Rodale Institute in Pennsylvania, recently compiled the results of such comparisons for corn, wheat, soybeans, and tomatoes in the US and found that the organic fields averaged between 94 and 100 percent of the yields of nearby conventional crops.</p>\n<p>But this optimistic picture tells only half the story. Organic farmers can't reach this yield every year if they want to build soil nutrients without synthetic fertilizers. They need to alternate with soil-building crops, and this is the biggest cost of organic farming. Vaclav Smil, of the University of Manitoba in Winnipeg, estimates that if farmers worldwide gave up the 80 million tons of synthetic fertilizer they now use each year, total grain production would fall by at least half. Either farms would have to double the amount of land they cultivate — at catastrophic cost to natural habitats — or billions of people would starve.</p>\n<p>In short, the world needs chemical fertilizers, even though farmers in much of the temperate zone produce so much grain that they are hard-pressed to sell it at a profit. But if they were to cut back drastically on their fertilizer use, and harvests were to shrink, grain prices would go up, making poor people hungrier. Besides the obvious moral cost of this approach, nothing destroys ecosystems more surely than hungry people who cannot afford to think about tomorrow because they are desperate to feed their children today.</p>\n<p>Technologically advanced farmers can now monitor their yields and target their fertilizer to the parts of the field where it will do the most good, which, in turn, increases the yield. Eventually, farmers may incorporate long-term weather forecasts into their planning so they can cut back on fertilizer use when the weather is likely to make harvests poor anyway, says Ron Olson, an agronomist from Florida.</p>\n<p>The challenge in moving towards a new, more intelligent farming of the future is as much political as it is technological. We already know how to build better soils, how to keep pests in check, and how to recognize when synthetic chemicals can provide the decisive edge to maximize yields. What's missing is political will. The time has come to step past the tired battle lines drawn up between organics advocates and agribusiness and enter the zone in between, where the real solutions lie.</p>", "2": "<h1>Ideal Homes</h1>\n<p class=\"sub\">New ideas and some old ones</p>\n<div class=\"para\">A</div>\n<p>The traditional kampung houses of Malaysia do not need air-conditioning. Built on stilts and with steep roofs, they have year-round ventilation. The raised structure ensures a cooling breeze comes up through the floorboards, while the high roof acts as a chimney to release hot air. The airtight, concrete boxes of modern city construction, in contrast, are heat traps, says Muhammad Peter Davis of University Putra Malaysia. He has calculated that typical modern Malaysian houses are 5°C hotter than the air outside. The builders of kampung houses 'had no knowledge of modern science or engineering but they came up with the perfect design,' says Davis.</p>\n<div class=\"para\">B</div>\n<p>This story of ancient architectural sophistication and modern insanity is repeated around the world. In the name of modernism, people have thrown away architecture designed to cope with the environment in which they live, and adopted house designs originating from cold, northern environments, where the idea is to keep heat in.</p>\n<div class=\"para\">C</div>\n<p>Once, the aim of architectural modernists was to build structures that kept nature out and to replace it with air-conditioning. Now they are learning that they cannot do that effectively. Slowly, they are seeing the benefit of working with nature, rather than against it. In California, they probably use more power for air-conditioning than anywhere else on Earth. According to Arthur Rosenfeld from the University of California, what California needs is white paint. If Los Angeles painted its roofs white, planted trees to shade buildings, and chose lighter-colored paving, it could reduce city temperatures by 3°C and cut the annual air-conditioning bill by $US 170 million a year.</p>\n<div class=\"para\">D</div>\n<p>Modern buildings are greedy in their use of energy. Much is made of the contribution of transportation to global warming, through its emissions of greenhouse gases. But globally, transportation is responsible for just 22 per cent of carbon dioxide emissions. The building sector is responsible for 31 per cent, mostly the result of heating and air-conditioning systems. In developing countries, where demand for electricity for buildings is rising by 5 per cent a year, the biggest demand is for air-conditioning in modern buildings which are often designed to cope with every different climatic condition.</p>\n<div class=\"para\">E</div>\n<p>Before air-conditioning, much of the Arab world kept cool through thoughtful building design; many buildings were built according to the principles of the wind tower, a tall structure with vertical vents at the top that open in all directions to catch any passing breeze. Typically, these wind-tower buildings were made of local materials such as stone, mud brick, wood and palm-tree fronds. The buildings were inward-looking, which served the dual function of focusing attention on the courtyard, where family members spend time together, and protecting living areas from the rays of the sun.</p>\n<div class=\"para\">F</div>\n<p>Throughout the Middle East today, wind towers are often little more than museum pieces. But there are exceptions. Jordan has won awards for the architecture of a village on the shores of the Red Sea, which is designed to conserve energy. Made of rough, local stone in a traditional style, it combines the ventilation system of the wind towers for summer coolness with up-to-date heating and floor insulation to protect against the desert cold in winter.</p>\n<div class=\"para\">G</div>\n<p>Traditional building materials, like traditional building designs, are being rediscovered by those looking for low-energy solutions to the current construction needs. Clay is one such material. As the Dutch housing contractor R van der Ley has argued in promoting a series of clay housing projects in developing countries, clay has many benefits over its industrialized version, brick. Clay blocks cost only half as much as ordinary bricks. Clay also generates work because people can find it, mold it, bake it and work it themselves. Two hundred clay bricks can be made with the fuel oil that makes just one ordinary brick. Moreover, clay is an excellent insulator against both cold and heat outside, and can easily be recycled.</p>\n<div class=\"para\">H</div>\n<p>But although traditional methods and materials can be revived in appropriate settings, new green, low-energy technologies are needed, especially in urban environments. The thermal insulation of homes in cold countries is an example. In 1983, Sweden adopted a national standard, requiring the country's homes to lose no more than 60 kilowatt-hours per square meter over the year. To meet that standard, windows were double glazed, and walls and roofs insulated. Every home became a fortress against the cold air outside. Unfortunately, the rest of Europe has not followed the lead.</p>\n<div class=\"para\">I</div>\n<p>In the United States, Amory Lovins has promoted a range of low-energy technologies: 'super-windows', for example, which let in invisible light but can be 'tuned' to either allow in, or reflect away, infrared solar radiation — the stuff that heats. Buildings with large expanses of window (and big energy bills) can be designed to achieve optimum temperatures.</p>\n<div class=\"para\">J</div>\n<p>As well as more efficient use of energy, the world also needs new sources of renewable power. Solar energy is being tried out in the developing world, in villages often far from electricity grids. The world's biggest solar power installation got underway in the Philippines, in 2001, where a project commenced to install solar panels for 400,000 people in 150 villages. Such projects are demonstrating that countries, whether developing or developed, no longer need huge national grids to supply electricity. Every home can do its own thing with the help of a solar panel and a storage battery.</p>\n<div class=\"para\">K</div>\n<p>Houses, of course, are more than machines for living in. They are social and psychological spaces, too. Future houses may not look exactly like kampungs or wind towers or any other traditional models. But to work for us and for our environment, they will have to suit us as well as these traditional forms did.</p>", "3": "<h1>Game theory</h1>\n<p class=\"sub\">Computer software that models human behavior can make forecasts, outsmart rivals and transform negotiations</p>\n<p>According to game theory, our chances of success in negotiations are based on the choices of others. Computer models have been developed to work out how events will unfold as people and organizations act in what they perceive to be their own best interests. Numerical values are placed on the goals, motivations, and influence of players, and likely options are considered. Game theory software then evaluates the ability of each of those players to influence others, and hence predicts the course of events.</p>\n<p>Although many individuals would feel uncomfortable having a computer make decisions for them, many organizations run such computer simulations for law firms, companies, and governments. But feeding software with accurate data on all the players involved is especially tricky for political matters. Reinier van Oosten of Decide, a Dutch firm that models political negotiations, notes that predictions may become unreliable when people unexpectedly give in to 'non-rational emotions', such as hatred, rather than pursuing what is apparently in their best interests. However, sorting out people's motivations is much easier when making money is the main object. Accordingly, modeling behavior using game theory is proving especially useful when applied to economics.</p>\n<p>Using game theory software to model auctions can be very lucrative. Consulting firms are entering the market to help clients design profitable auctions, or to win them less expensively. In 2006, in the run-up to an online auction of radio-spectrum licenses by America's Federal Communications Commission, Dr. Paul Milgrom, a consultant and Stanford University professor in the United States, customized his game theory software to assist a consortium of bidders. He was apprehensive at first, but the result was a triumph. When the auction began, Milgrom's software tracked competitors' bids to estimate their budgets for the 1,132 licenses on offer. Crucially, the software estimated the secret values bidders placed on specific licenses, and determined that certain big licenses were being overvalued. Milgrom's clients were then directed to obtain a collection of smaller, less expensive licenses instead. Two of his clients paid about a third less than their competitors for an equivalent amount of spectrum, saving almost $1.2 billion. Such a saving makes one wonder why everyone isn't using game theory software. And, if they were, how would that affect the game?</p>\n<p>PA Consulting, a British firm, designs models for software based on game theory to help its clients solve specific problems in areas from pharmaceuticals to the production of television shows. British government agencies have asked PA Consulting to build models to test zoning rules that govern how many of a certain type of business should be allowed to operate in one area. To give a simple example: if two competing ice-cream sellers share a long beach, they will set up stalls back-to-back in the middle and stay put, explains Dr. Stephen Black, a modeler for PA. Unfortunately for potential customers at the far ends of the beach, each seller prevents the other from relocating — no other spot would be closer to more people. Introduce a third seller, however, and the stifling equilibrium is broken as relocations and pricing changes energize the market. By studying a chain of events such as this, software designers can assess the effect of change and see the patterns in possible outcomes that may occur. As a result, the use of modeling makes clients more inclined to look at future repercussions when making business decisions, Black says.</p>\n<p>Where is all this heading? Alongside the increasingly elaborate modeling software, there are also efforts to develop software that can assist in negotiation and mediation. Two decades ago, Dr. Clara Ponsati, a Spanish academic, came up with a clever idea. She accepted that, as negotiators everywhere know, the first side to disclose the maximum amount that it is willing to pay loses considerable bargaining power. Without leverage, it can be pushed backward in the bargaining process by a clever opponent. But if neither side reveals the concessions it is prepared to make, negotiations can become very slow or collapse. However, difficult negotiations can often be pushed along by neutral mediators, especially if they are entrusted with the secret bottom lines of all parties. Ponsati's idea was that if a human mediator was not trusted, affordable, or available, a computer could do the job instead. Negotiating parties would update the software with the confidential information on their bargaining positions after each round of talks. Once positions on both sides were no longer mutually exclusive, the software would be used to split the difference and propose an agreement. Ponsati, now head of the Institute of Economic Analysis at the Autonomous University of Barcelona in Spain, says such 'mediation machines' could be employed to push negotiations forward by unlocking information that would otherwise be withheld from an opponent.</p>\n<p>Could mediation which has been achieved using software based on game theory spread from auction bids and utility pricing to resolving political and military disputes? Today's game theory software is not yet sufficiently advanced to mediate between warring countries. But one day opponents on the brink of war might be tempted to use it to exchange information without having to engage in conflict. According to some game theorists, opponents could learn how a war would turn out, skip the fighting, and strike a deal. Over-optimistic, perhaps — but game theorists do have rather an impressive track record when it comes to predicting the future.</p>"}, "answers": {"1": "C", "2": "A", "3": "D", "4": "B", "5": "NO", "6": "YES", "7": "NOT GIVEN", "8": "YES", "9": "NO", "10": "farming", "11": "genetically modified", "12": "organic", "13": "chemical", "14": "G", "15": "E", "16": "A", "17": "J", "18": "C", "19": "D", "20": "G", "21": "A", "22": "E", "23": "FALSE", "24": "TRUE", "25": "FALSE", "26": "NOT GIVEN", "27": "C", "28": "D", "29": "D", "30": "A", "31": "B", "32": "YES", "33": "NO", "34": "NOT GIVEN", "35": "NOT GIVEN", "36": "E", "37": "A", "38": "D", "39": "C", "40": "B"}, "alt": {}, "expl": {"1": {"loc": "Para 7, Vaclav Smil", "text": "'if farmers worldwide gave up the 80 million tons of synthetic fertilizer... total grain production would fall by at least half... billions of people would starve' → C."}, "2": {"loc": "Para 1, Kenneth Cassman", "text": "'Agriculture must become the solution to environmental problems in 50 years' → A."}, "3": {"loc": "Para 9, Ron Olson", "text": "'farmers may incorporate long-term weather forecasts into their planning so they can cut back on fertilizer use when the weather is likely to make harvests poor' → D."}, "4": {"loc": "Para 6, Bill Liebhardt", "text": "'the organic fields averaged between 94 and 100 percent of the yields of nearby conventional crops' → B."}, "5": {"loc": "Para 3", "text": "'Not so.' — the writer directly rejects the idea of only two options, proposing 'a new middle way' → NO."}, "6": {"loc": "Para 3", "text": "'the most crucial ingredient in this new style of agriculture is not chemicals but information about what is happening in each field and how to respond' → YES."}, "7": {"loc": "Para 5", "text": "The passage discusses environmental damage from production (CO2, nitrogen oxides) but not the financial cost of production → NOT GIVEN."}, "8": {"loc": "Para 7", "text": "'They need to alternate with soil-building crops, and this is the biggest cost of organic farming' → YES."}, "9": {"loc": "Para 8", "text": "'farmers in much of the temperate zone produce so much grain that they are hard-pressed to sell it at a profit' — oversupply, not inability to meet demand → NO."}, "10": {"loc": "Para 1", "text": "'the Curry Report, a government panel that surveyed the future of farming in Britain' → 'farming'."}, "11": {"loc": "Para 2", "text": "'techno-optimists, who put their faith in genetically modified crops' → 'genetically modified'."}, "12": {"loc": "Para 2", "text": "'advocates of organic farming, who reject artificial chemicals and embrace back-to-nature techniques' → 'organic'."}, "13": {"loc": "Para 5", "text": "'the main environmental damage done by chemical fertilizers... Excess nitrogen from chemical fertilizers can pollute groundwater, but so can excess nitrogen from organic manures' → 'chemical'."}, "14": {"loc": "Paragraph G", "text": "Clay's benefits over brick (cheaper, generates work, better insulator, recyclable) → G."}, "15": {"loc": "Paragraph E", "text": "Wind-tower buildings 'focusing attention on the courtyard, where family members spend time together' → E."}, "16": {"loc": "Paragraph A", "text": "'The raised structure ensures a cooling breeze comes up through the floorboards' → A."}, "17": {"loc": "Paragraph J", "text": "'countries... no longer need huge national grids to supply electricity. Every home can do its own thing with the help of a solar panel' → J."}, "18": {"loc": "Paragraph C", "text": "'painted its roofs white, planted trees to shade buildings, and chose lighter-colored paving, it could reduce city temperatures by 3°C' → C."}, "19": {"loc": "Paragraph A, Davis", "text": "Kampung builders 'had no knowledge of modern science or engineering but they came up with the perfect design' → D."}, "20": {"loc": "Paragraph C, Rosenfeld", "text": "'what California needs is white paint' — a very simple solution → G."}, "21": {"loc": "Paragraph G, van der Ley", "text": "'Clay also generates work because people can find it, mold it, bake it and work it themselves' — socio-economic impact → A state Ponsati's opinion on their appropriateness there → NOT GIVEN."}, "35": {"loc": "Para 6", "text": "No mention of military organizations' views on the software → NOT GIVEN."}, "36": {"loc": "Para 2, van Oosten", "text": "'predictions may become unreliable when people unexpectedly give in to ‘non-rational emotions’' → E."}, "37": {"loc": "Para 3, Milgrom", "text": "'the software estimated the secret values bidders placed on specific licenses, and determined that certain big licenses were being overvalued' → A."}, "38": {"loc": "Para 4, Black", "text": "'the use of modeling makes clients more inclined to look at future repercussions when making business decisions' → D."}, "39": {"loc": "Para 5, Ponsati", "text": "'the first side to disclose the maximum amount that it is willing to pay loses considerable bargaining power' → C."}, "40": {"loc": "Para 5, Ponsati", "text": "'if neither side reveals the concessions it is prepared to make, negotiations can become very slow or collapse' — the machine helps in that scenario → B."}}};

function gap(n){return '<span class="qnum">'+n+'</span><input class="gap" id="gap'+n+'">'}
function sel(n,t,letters){return '<div class="row" id="q'+n+'"><span class="qnum">'+n+'</span><span class="txt">'+t+'</span><select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select></div>'}
function selInline(n,letters){return '<select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select>'}
function mcq(n,t,opts){return '<div class="mcq" id="q'+n+'"><div class="prompt"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="choice-options">'+opts.map((o,i)=>'<label class="choice-option"><input type="radio" name="q'+n+'" value="'+'ABCD'[i]+'"> <b>'+'ABCD'[i]+'</b> '+o+'</label>').join('')+'</div></div>'}
function qhtml(p){
if(p===1)return '<div class="qgroup"><h3>Questions 1-4</h3><p>Match each opinion with the correct person.</p><div class="box"><b>A</b> Kenneth Cassman<br><b>B</b> Bill Liebhardt<br><b>C</b> Vaclav Smil<br><b>D</b> Ron Olson</div>'+sel(1,'Without the use of synthetic fertilizers, large numbers of people would die of hunger.',['A','B','C','D'])+sel(2,'We need agricultural methods that work for the environment.',['A','B','C','D'])+sel(3,'In the future, the quantity of fertilizer used will be linked to predicted harvests.',['A','B','C','D'])+sel(4,'The output from organic soils is very nearly equal to that from fields treated with chemical fertilizers.',['A','B','C','D'])+'</div><div class="qgroup"><h3>Questions 5-9</h3><p><i>Do the following statements agree with the views of the writer? Write <b>YES / NO / NOT GIVEN</b>.</i></p>'+tf(5,'There are only two real farming options worth considering.',true)+tf(6,'Farmers need to act on locally relevant information.',true)+tf(7,'Chemical fertilizers are expensive to produce.',true)+tf(8,'Successful organic farming requires crop rotation.',true)+tf(9,'Farmers are unable to meet demand for grain in temperate zones.',true)+'</div><div class="qgroup"><h3>Questions 10-13</h3><p><i>Complete the summary below. Choose <b>NO MORE THAN TWO WORDS</b> from the passage for each answer.</i></p><p class="summary-text">A leading American agronomist is concerned that unless we improve our approach to food production, the world will face serious shortages by the year 2050. A government team which looked ahead at British '+gap(10)+' came up with a similar prediction. The pro-technology lobby believes in using crops which are '+gap(11)+' as well as relying heavily on agro-chemicals. On the other hand, '+gap(12)+' farmers believe passionately in natural techniques. The real problem is, however, that both natural and '+gap(13)+' fertilizers damage the ecosystem. The move towards a more sensible approach to farming is being hampered by a lack of political will. We need to steer a middle course if we are to solve the world’s food problems.</p></div>';
if(p===2)return '<div class="qgroup"><h3>Questions 14-18</h3><p><i>Reading Passage 2 has eleven paragraphs, A–K. Which paragraph contains the following information?</i></p>'+sel(14,'reasons why a particular construction material is advantageous',['A','B','C','D','E','F','G','H','I','J','K'])+sel(15,'an example of a construction design which benefits domestic interaction',['A','B','C','D','E','F','G','H','I','J','K'])+sel(16,'a description of a house that is ventilated from below',['A','B','C','D','E','F','G','H','I','J','K'])+sel(17,'an example of self-sufficient energy supply',['A','B','C','D','E','F','G','H','I','J','K'])+sel(18,'suggested methods of reducing temperatures in a city',['A','B','C','D','E','F','G','H','I','J','K'])+'</div><div class="qgroup"><h3>Questions 19-22</h3><p>Look at the following people and the list of ideas below. Match each person with the correct idea.</p><div class="box"><b>A</b> The choice of a certain construction material can have a socio-economic impact<br><b>B</b> Throughout the world, people are rejecting traditional housing design in order to appear modern.<br><b>C</b> Houses should not only meet people’s physical needs but also their social and psychological needs.<br><b>D</b> Traditional knowledge can be superior to modern knowledge.<br><b>E</b> There is an innovation that can save costs on both air-conditioning and heating.<br><b>F</b> Solar energy can meet the energy needs of people living in villages in developing countries.<br><b>G</b> There is a very simple solution that can save on the cost of air-conditioning</div>'+sel(19,'Muhammad Peter Davis',['A','B','C','D','E','F','G'])+sel(20,'Arthur Rosenfeld',['A','B','C','D','E','F','G'])+sel(21,'R van der Ley',['A','B','C','D','E','F','G'])+sel(22,'Amory Lovins',['A','B','C','D','E','F','G'])+'</div><div class="qgroup"><h3>Questions 23-26</h3><p><i>Do the following statements agree with the information given in the passage? Write <b>TRUE / FALSE / NOT GIVEN</b>.</i></p>'+tf(23,'The air temperature in modern Malaysian houses is lower than the air temperature outside.')+tf(24,'The construction industry is more to blame than transport for global warming.')+tf(25,'The use of wind towers for cooling is widespread in the Middle East today.')+tf(26,'The ‘super-windows’ promoted by Amory Lovins can be installed at low cost.')+'</div>';
return '<div class="qgroup"><h3>Questions 27-31</h3><p>Choose the correct letter, A, B, C or D.</p>'+mcq(27,'What does the writer suggest about game theory software in the first paragraph?',['Traditional negotiating practices should be used to supplement the software.','Success of the software depends on the accuracy of the assigned values.','This software anticipates the outcome of future events.','Future business negotiations will be dominated by this software.'])+mcq(28,'Reinier van Oosten says predicting what people will do works best if',['participants are honest about how they feel.','there is a good understanding of the client’s culture.','people strongly dislike the other party.','profit is the primary motivator.'])+mcq(29,'After using game theory software in 2006, Dr. Milgrom instructed his clients to',['buy big licenses.','negotiate with the other parties directly.','make one big offer at the end of the auction.','purchase a mix of licenses.'])+mcq(30,'The writer refers to Stephen Black’s ice-cream seller example in order to',['show the impact new competitors have on business.','highlight the importance of location on business success.','demonstrate that businesses must follow a strategy.','clarify how pricing affects sales.'])+mcq(31,'Ponsati believes business negotiations are more likely to progress if',['a solution is proposed by one of the interested parties.','mediators or computers take over the bargaining process.','both parties follow the rules of negotiating.','sufficient time is allowed for the bargaining process.'])+'</div><div class="qgroup"><h3>Questions 32-35</h3><p><i>Do the following statements agree with the claims of the writer? Write <b>YES / NO / NOT GIVEN</b>.</i></p>'+tf(32,'Game theory software may be unhelpful when dealing with political issues.',true)+tf(33,'Dr. Milgrom was confident about applying his software to an auction in 2006.',true)+tf(34,'Dr. Ponsati believes ‘mediation machines’ are an inappropriate method of negotiation in areas other than business.',true)+tf(35,'Military organizations refuse to accept that software based on game theory could prevent wars.',true)+'</div><div class="qgroup"><h3>Questions 36-40</h3><p>Complete each sentence with the correct ending, A–F, below.</p><div class="box"><b>A</b> something is thought to be worth more than it really is.<br><b>B</b> discussions between the parties begin to break down.<br><b>C</b> too much information is given to the other parties early on.<br><b>D</b> businesses consider possible future developments.<br><b>E</b> people allow their feelings to influence decisions.<br><b>F</b> a solution requires face-to-face negotiation.</div>'+sel(36,'According to Reinier van Oosten, game theory software fails when...',['A','B','C','D','E','F'])+sel(37,'Dr. Milgrom’s software is successful in detecting if...',['A','B','C','D','E','F'])+sel(38,'Dr. Black’s game theory software is a helpful tool when...',['A','B','C','D','E','F'])+sel(39,'According to Dr. Ponsati, negotiators fall behind if...',['A','B','C','D','E','F'])+sel(40,'Dr. Ponsati’s mediation machine is useful when...',['A','B','C','D','E','F'])+'</div>';
}

function render(){partTitle.textContent='Part '+active;var r=ranges[active];partSub.textContent='Read the text and answer questions '+r[0]+'-'+r[1]+'.';left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();drawFooter();left.scrollTop=right.scrollTop=0}
function val(n){var g=document.getElementById('gap'+n);if(g)return g.value;var s=document.getElementById('sel'+n);if(s)return s.value;var r=document.querySelector('input[name="q'+n+'"]:checked');return r?r.value:''}
function save(){for(var n=1;n<=40;n++){var v=val(n);if(v)state[n]=v}}
function restore(){for(var n=1;n<=40;n++){if(!state[n])continue;var g=document.getElementById('gap'+n);if(g)g.value=state[n];var s=document.getElementById('sel'+n);if(s)s.value=state[n];var r=document.querySelector('input[name="q'+n+'"][value="'+state[n]+'"]');if(r)r.checked=true}}
function answered(n){return !!state[n]||!!val(n)}
function count(p){var r=ranges[p],c=0;for(var i=r[0];i<=r[1];i++)if(answered(i))c++;return c}
function drawFooter(){save();var h='';[1,2,3].forEach(p=>{var r=ranges[p];h+='<div class="partnav"><button class="partlabel" data-part="'+p+'">Part '+p+'</button>';if(p===active){h+='<div class="tiles">';for(var n=r[0];n<=r[1];n++)h+='<button class="tile '+(answered(n)?'answered':'')+'" data-q="'+n+'">'+n+'</button>';h+='</div>'}else h+='<span class="count">'+count(p)+' of '+(r[1]-r[0]+1)+'</span>';h+='</div>'});h+='<button class="review" id="review">OK</button>';footer.innerHTML=h}
document.addEventListener('change',()=>{save();drawFooter()});document.addEventListener('input',()=>{save();drawFooter()});
var lastScore=null;
function renderActive(){left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();if(graded){regradeCurrent();right.insertAdjacentHTML('afterbegin','<div class="score">Your score: <b>'+lastScore+' / 40</b></div><p style="margin:-8px 0 18px;color:#555">Explanations with the exact location in the passage are shown below each answer. Switch Part 1/2/3 tabs to review the rest.</p>')}drawFooter();left.scrollTop=right.scrollTop=0}
footer.onclick=e=>{var p=e.target.closest('[data-part]');if(p){save();active=+p.dataset.part;renderActive();return}var q=e.target.closest('[data-q]');if(q){var n=+q.dataset.q;(document.getElementById('q'+n)||document.getElementById('gap'+n)||document.getElementById('sel'+n))?.scrollIntoView({behavior:'smooth',block:'center'});return}if(e.target.closest('#review'))review()};
function review(){save();var a=0;for(var n=1;n<=40;n++)if(answered(n))a++;subwrap.innerHTML='<p>You have answered <b>'+a+'</b> of 40 questions.</p><p><button class="ovrow submit" id="final">Submit test</button></p>';final.onclick=grade;submit.classList.add('show')}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function correct(n,v){return [answers[n]].concat(alt[n]||[]).some(a=>norm(a)===norm(v))}
function explHTML(n){var e=EXPL[n];if(!e)return '';return '<div class="expl"><b>Q'+n+' — correct answer: '+answers[n]+'</b> &nbsp;<span class="expl-loc">('+e.loc+')</span><br>'+e.text+'</div>'}
function markGap(n){var x=document.getElementById('gap'+n);if(!x)return;var ok=correct(n,x.value);x.disabled=true;x.classList.add(ok?'ok':'no');x.insertAdjacentHTML('afterend',(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>')+explHTML(n));return ok}
function markSel(n){var s=document.getElementById('sel'+n);if(!s)return;var ok=correct(n,s.value);s.disabled=true;s.classList.add(ok?'ok':'no');var row=document.getElementById('q'+n);var tag=(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>');if(row){row.insertAdjacentHTML('beforeend',tag);row.insertAdjacentHTML('afterend',explHTML(n))}else{s.insertAdjacentHTML('afterend',tag);var host=s.closest('p')||s;host.insertAdjacentHTML('afterend',explHTML(n))}return ok}
function markRadio(n){var r=document.querySelector('input[name="q'+n+'"]:checked');var ok=r&&correct(n,r.value);document.querySelectorAll('input[name="q'+n+'"]').forEach(i=>i.disabled=true);var box=document.getElementById('q'+n);box.insertAdjacentHTML('beforeend',(ok?'<span class="tag ok">\u2713</span>':'<span class="tag no">\u2718 correct: '+answers[n]+'</span>'));box.insertAdjacentHTML('afterend',explHTML(n));return ok}
function regradeCurrent(){var r=ranges[active];for(var n=r[0];n<=r[1];n++){var g=document.getElementById('gap'+n),s=document.getElementById('sel'+n),rad=document.querySelector('input[name="q'+n+'"]');if(g)markGap(n);else if(s)markSel(n);else if(rad)markRadio(n)}}
function grade(){if(graded)return;save();var score=0;for(var n=1;n<=40;n++)if(correct(n,state[n]||''))score++;lastScore=score;graded=true;active=1;renderActive();submit.classList.remove('show')}
var drag=false;div.onmousedown=()=>{drag=true;document.body.style.userSelect='none'};window.onmouseup=()=>{drag=false;document.body.style.userSelect=''};window.onmousemove=e=>{if(!drag)return;var r=split.getBoundingClientRect();left.style.width=Math.max(220,Math.min(r.width-240,e.clientX-r.left))+'px'};
split.onmouseup=()=>setTimeout(()=>{var s=getSelection();if(!s||s.isCollapsed||!s.rangeCount){tools.style.display='none';return}var rg=s.getRangeAt(0);if(!split.contains(rg.commonAncestorContainer)){tools.style.display='none';return}var rc=rg.getBoundingClientRect();tools.style.display='flex';tools.style.left=(rc.left+scrollX)+'px';tools.style.top=Math.max(8,rc.top+scrollY-42)+'px'},1);
tools.onclick=e=>{var b=e.target.closest('button'),s=getSelection();if(!b||!s.rangeCount)return;var rg=s.getRangeAt(0);if(b.dataset.act==='hl'){try{var sp=document.createElement('span');sp.className='hl';rg.surroundContents(sp)}catch(_){document.execCommand('hiliteColor',false,'#ffe45c')}}else document.querySelectorAll('.hl').forEach(h=>h.replaceWith(document.createTextNode(h.textContent)));s.removeAllRanges();tools.style.display='none'};
render();
})();
</script></body></html>
