var DATA = {"passages": {"1": "<h1>The Father of English Geology</h1>\n<p>William Smith, 1769–1839, has been called the 'Father of English Geology'. His pioneering map of 1815, depicting the geology of England, Wales and part of Scotland, helped to shape the economic and scientific development of Britain, just as the country was experiencing the Industrial Revolution.</p>\n<p>William Smith was born in rural Oxfordshire in 1769. The son of the village blacksmith, Smith was the eldest of five children. After elementary education at the village school, where he developed a liking for geometry and drawing, he decided to teach himself the skills of surveying, possibly because there were an increasing number of openings for that profession. At the age of 18 he was employed by Edward Webb, a surveyor in a nearby town, and subsequently, in 1791, he set up in business on his own.</p>\n<p>As a boy, Smith had developed an interest in the exposures of rock and the fossils which were to be found locally. As an adult, his surveys of land that would be suitable for building canals, and for sources of building stone and coal in other parts of England, led to a great increase in his knowledge and awareness of various geological features.</p>\n<p>As he travelled, he found the strata* that he was familiar with in the south of England were repeated in other areas, with some outcrops — the rocks emerging above ground — stretching right across the country. Coal miners were already aware of the occurrences of regular successions of workable coal seams. But on a larger scale, Smith began to recognise that sedimentary rocks could be identified by the fossils they contained, and that these rocks were always arranged in the same order. Smith's discovery that beds of rocks can be distinguished by the fossils found in them was a concept virtually unrecognised by geologists of that period.</p>\n<p>Working on this principle, Smith was able to draw up a table of successive strata which could be applied in any other locality — an early version of the geological column.</p>\n<p>By 1799, Smith was using both his skills as a surveyor and the knowledge gained from his observations in the field to draw up a geological map. This first map was circular in form, covered the area around the city of Bath, and was exhibited at the Bath Agricultural Society. At the same time, Smith continued to plan the publication of a treatise describing his discoveries, but financial support proved difficult to find. In 1801, Smith produced a small geological map of England and Wales which illustrated the outcrops of seven geological formations.</p>\n<p>Other maps were produced for exhibition at various meetings, but it was not until 1815 that, with input from the enterprising map publisher John Cary, Smith's first major map actually appeared. It was called 'A delineation of the Strata of England and Wales with part of Scotland; exhibiting the Collieries and Mines, the Marshes and Fen Lands originally overflowed by the Sea, and the varieties of soil according to the variations in the substrata, illustrated by the most descriptive names'.</p>\n<p>Based on Cary's new topographical map at the scale of five miles to the inch, Smith's map showed the outcrops of some twenty formations. Other publications on stratigraphy followed, including his major mapping publication 'Geological Atlas', comprising maps of 21 counties. Published between 1819 and 1824, these maps represent a first attempt at systematic sheet mapping of England and Wales.</p>\n<p>Despite the importance of his ideas and publications, Smith continued to find recognition elusive and it was not until 1831, when the Geological Society awarded him the first Wollaston Medal, that the importance of his achievements was finally acknowledged. In his citation, the geologist Adam Sedgwick called Smith the 'Founder of English Geology'.</p>\n<p>From time to time Smith's expertise continued to be drawn upon for major projects. In 1838 he was commissioned to accompany Henry De la Beche and Sir Charles Barry on a tour of the principal stone quarries to recommend the stone to be used in the rebuilding of the Houses of Parliament, which had been destroyed by fire in 1835. The practical nature of the commission provides a link between Smith's work and that of De la Beche and his newly founded Geological Survey.</p>\n<p>The main focus of Smith's work was to apply his observations and ideas to the everyday needs of the canal builders, quarry- and mine-owners, landowners and agriculturists who were underpinning the Industrial Revolution. His understanding of geology enabled him to predict where coal or different types of stone could be found, which was very useful for mining companies. He talked at meetings about geology and its valuable contribution to the national economy.</p>\n<p>The methods involved in map production have developed and the ways in which people access maps have altered radically since Smith's time. However, his conviction that geological mapping is of vital importance at many levels and in many areas of the nation's society, science, and industry is as true today as it was two centuries ago, when he conceived his original geological map. It is as vital for today's industries to be provided with accurate geological map data as it was in Smith's time.</p>\n<p style=\"font-size:14px;color:#555;\">* Strata: layers of rock in the ground</p>", "2": "<h1>WHAT'S HAPPENING TO OUR FOOD?</h1>\n<p class=\"sub\">Is the way we produce and process food making it less nourishing than in our grandparents' day?</p>\n<div class=\"para\">A</div>\n<p>We now know a lot about what food does to the body and the importance of a healthy diet. But what if modern intensive farming methods have affected the mineral and vitamin content of what we eat? Donald Davis, at the University of Texas, has found notable declines in nutrients in crops including tomatoes, eggplants and squash. Davis blames agricultural practices that emphasise quantity over quality. High-yielding crops produce more food, more rapidly, but they can't make or absorb nutrients at the same pace, so the nutrition is diluted. 'It's like taking a glass of orange juice and adding water to it. If you do that, the concentration of nutrients that was in the original juice drops,' he says. But the idea that modern farming produces less nourishing crops remains controversial, since nutrient levels can vary widely according to the variety of plant, the year of harvest and the time of harvest.</p>\n<div class=\"para\">B</div>\n<p>But intensive farming has also led to a huge increase in food supply, which has undoubtedly had a positive effect on our diet and health. 'Evidence suggests that some nutrients have fallen, particularly trace elements such as copper in vegetables,' says Paul Finglas, at the Institute of Food Research in Norwich. 'Foods are now bred for yield, and not necessarily nutritional composition. But I don't think that is a problem, because we eat a wider range of foods today than we did 10 years ago, let alone 40 years ago'. Eric Decker, professor of food science at the University of Massachusetts in Amherst, agrees. If nutrients are declining, the losses are insignificant, he says. 'Over the last century, lifespans have got longer, people are bigger and stronger, and a lot of that has to do with the food supply being better.' Even Davis agrees that any differences in nutrient levels are relatively small. 'Despite their declines, fruit and vegetables are still our richest source of many nutrients, and you can make up for it by eating more,' he says. 'But we know that many people don't get the recommended amounts of nutrients such as iron, magnesium, and calcium. They aren't overt deficiencies in the usual sense, but they increase susceptibility to lots of different problems.'</p>\n<div class=\"para\">C</div>\n<p>In addition to changes in its production, food is being transported for ever-increasing distances. Fruit and vegetables in supermarkets might look shiny and fresh, but often they were picked several days earlier. Some nutrients, particularly vitamin C and folic acid, begin to deteriorate as soon as picking happens, but manufacturers can take action to minimise this. 'Lots of these reactions are driven by enzymes,' says Carol Wagstaff, from the University of Reading, UK, who points out that chilling is the best way of slowing down such reactions. That said, if you are choosing between organic fruit or vegetables from a distant country or locally grown, non-organic ones, always opt for home-grown, she says. 'From a nutritional standpoint, go for the shortest possible supply chain rather than the production method.'</p>\n<p>Many kinds of mass-produced fruit and veg — most famously tomatoes — are harvested unripe before being transported to supermarkets. Wagstaff agrees that this may cause some loss of flavor, compared with a tomato that you have grown at home, and left on the plant until it's absolutely ready to eat. 'But there's no way you could do that at a commercial level, because of the bruising and other types of damage that would occur if ripe fruits were transported through a typical supply chain,' she says. In addition, each method of shipping and storing foods has different effects on the compounds they contain. Vitamin C, for example, breaks down in the dark, whereas glucosinolates — found in vegetables like cabbage — deplete in the light.</p>\n<div class=\"para\">D</div>\n<p>Surprisingly, frozen fruit and vegetables are often nutritionally better than fresh. 'Frozen peas are much more nutritious than those you buy ready to shell,' says Catherine Collins, principal dietician at St George's Hospital in London. What's more, frozen foods often have fewer additives. 'Freezing is a preservative,' she says. Similarly, processing has become a maligned word in the context of food, but there are some cases where it enhances a food's health benefits. For example, lycopene — a compound tomatoes are rich in, and which has been shown to protect against certain diseases — is much more readily absorbed by humans from tomato paste than fresh tomatoes. A recent trend is the sale of 'fresh-cut' fruit and vegetables — peeled potatoes, ready chopped carrots and bagged salads. One in five adults in the UK regularly buys fruit and vegetables in this form every week, according to market research firm Mintel. Surely this cutting and peeling speeds up the degradation of nutrients? 'There is a chance that ready prepared vegetables may have a lower content of some vitamins,' says Judy Buttriss, of the British Nutrition Foundation in London. 'But if their availability means that such vegetables are consumed in greater quantities, then the net effect is beneficial.'</p>\n<div class=\"para\">E</div>\n<p>The bottom line is that although aspects of today's food production, processing and storage might make what we eat a bit less nutritious, they are also making foods more available — and this is far more important. 'The most important thing you can do is eat more fruits, vegetables and wholegrains, and cut down on highly refined, processed foods, vegetable oils and added sugars,' says Davis. He believes this will make a far greater difference to us than worrying about growing methods and transportation.</p>", "3": "<h1>REWILDING</h1>\n<p class=\"sub\">Ecologist Derek Gow looks at the challenges of 'rewilding' — restoring areas of land to the wild and reintroducing their original animal species</p>\n<p>In Holland they have developed a creative landscape philosophy called 'New Nature', and the most iconic illustration of this is the site called the Oostvaardersplassen, near Amsterdam. Here, throughout 6,000 enclosed hectares, feral Heck bulls excavate amphibian ponds with their hooves and horns, while stags and stallions battle fiercely for possession of herds of females. These creatures present a living vision that many 'rewilders' adore. Although this project may present a primeval impression, in reality it is a completely artificial though courageous creation, limited by fences, budgets, an adjacent main railway line, surrounding land users and fickle political support. Less than a lifetime ago the landscape these 'wild' herbivores now occupy was the bed of the North Sea.</p>\n<p>Despite the contention that surrounds such projects, the Oostvaardersplassen has produced some inspirational results. Spoonbills have returned to breed in ever increasing numbers, creating a surplus population which has overlapped back into Britain. Sea eagles have raised their first nestlings in centuries, nourished by the ample supply of deer that the site affords. Projects of this type, which restore key species or re-engineer landscapes to allow natural processes such as seasonal flooding or forest fires to reoccur, have demonstrated that when nature is given free rein, the results which arise can be truly spectacular. Are we, however, prepared to live in landscapes where these processes, even if appropriately modified, become part of our own experience?</p>\n<p>While space is without a doubt one of the biggest obstacles facing rewilders, a range of structural, social and cultural issues can also conspire to hinder change. As an example, I have been involved with the restoration of the Eurasian beaver — a large rodent that builds complex structures from wood, stones and mud across rivers — in Britain since the early 1990s. Although they once had a world range which extended from Britain to China and numbered tens of millions, beavers were hunted virtually to extinction by humans as a result of an insatiable demand for their fur, scent glands and meat. They have been widely reintroduced throughout much of their former European range as an awareness of their critical function in the creation of wetland habitats has developed. Beaver-generated landscapes also play a significant part in the retention and purification of water.</p>\n<p>There is an abundance of entirely suitable beaver habitat available in Britain, and despite the fact that occasional conflicts will arise between beavers' engineering activities and human land use, European experience again demonstrates quite ably that these conflicts are manageable. Despite this well-established knowledge, the restoration of beavers in Britain has proven to be a pitifully slow process. Political apathy and indifference have coupled with the total lack of knowledge of opponents who simply want no change to the status quo. The official trials in Scotland and England have focused on the creation of tiny populations which remain extremely fragile.</p>\n<p>If a species as benevolent as the beaver presents a significant challenge, then how much more difficult will it be to restore predators? While science and experience may dictate that wolves pose no significant threat to humans, their tentative re-colonisation of many western European countries over the course of the last few decades has often evoked a primal response. Farmers' groups have trapped them in pits in France and burnt them to death; hunters have poisoned them for killing 'their' deer; kindergarten teachers have implored forest authorities to remove them from the landscape to ensure that this medieval menace does not lurk in the dark when their tiny children go to school on a winter's morning. Attitude change, it would seem, is a slow and painful process, one not easily turned round by knowledge.</p>\n<p>Any start to rewilding is therefore likely to be humble. Despite a measured approach, it is probable that fishermen and their strident support groups may not welcome the addition of the pelican, a 15kg water bird, to the large number of predators which they already detest. The scientific community may dislike the pragmatism required on a semi-industrial scale to restore small species to remake the base of essential food chains if newly available habitats emerge. Many farmers, despite the sums they would be paid, will not wish to see their once-drained bogs rehydrated, their dead animals consumed by sea eagles or their pastures revert to scrub.</p>\n<p>In the end it comes down to changing patterns. We have moulded the landscapes of the world as a species to suit our own passing needs, predilections and pleasures. While change is commonly opposed on whatever basis arises, change is nevertheless a constant in life. It is likely that 'rewilding' or 'New Nature' — call it what you will — could become a base movement which affords a fresh opportunity to approach nature conservation in a fashion which will, over time, be all the more rewarding for the surprises it presents.</p>"}, "answers": {"1": "TRUE", "2": "FALSE", "3": "NOT GIVEN", "4": "TRUE", "5": "FALSE", "6": "NOT GIVEN", "7": "discoveries", "8": "publisher", "9": "counties", "10": "recognition", "11": "stone", "12": "economy", "13": "importance", "14": "C", "15": "B", "16": "A", "17": "C", "18": "D", "19": "A", "20": "F", "21": "C", "22": "B", "23": "enzymes", "24": "bruising", "25": "light", "26": "peas", "27": "C", "28": "A", "29": "B", "30": "A", "31": "D", "32": "H", "33": "B", "34": "F", "35": "G", "36": "C", "37": "NO", "38": "NOT GIVEN", "39": "NO", "40": "YES"}, "alt": {}, "expl": {"1": {"loc": "Para 2", "text": "'he decided to teach himself the skills of surveying, possibly because there were an increasing number of openings for that profession' → TRUE."}, "2": {"loc": "Para 2", "text": "'At the age of 18 he was employed by Edward Webb, a surveyor' — employed, not a partner → FALSE."}, "3": {"loc": "Para 3", "text": "'As a boy, Smith had developed an interest in the exposures of rock and the fossils' — no mention of the school encouraging this specifically → NOT GIVEN."}, "4": {"loc": "Para 4", "text": "'he found the strata that he was familiar with in the south of England were repeated in other areas... stretching right across the country' → TRUE."}, "5": {"loc": "Para 4", "text": function qhtml(p){
if(p===1)return '<div class="qgroup"><h3>Questions 1-6</h3><p><i>Do the following statements agree with the information given in the text? Write <b>TRUE / FALSE / NOT GIVEN</b>.</i></p>'+tf(1,'At the time when Smith left school, there was a growing demand for surveyors.')+tf(2,'When Smith was 18, he formed a partnership with another surveyor.')+tf(3,'Smith’s interest in rocks and fossils was encouraged by his school.')+tf(4,'Smith noticed that the same types of rocks were visible in a number of places.')+tf(5,'Smith believed that the order of strata in the ground varied from locality to locality.')+tf(6,'Smith’s map of Bath was commissioned by the Bath Agricultural Society.')+'</div><div class="qgroup"><h3>Questions 7-13</h3><p><i>Complete the sentences below. Choose <b>ONE WORD ONLY</b> from the text for each answer.</i></p><p class="summary-text"><span class="qnum">7</span>Around 1799, Smith struggled to raise money for a publication about his '+gap(7)+'.</p><p class="summary-text"><span class="qnum">8</span>Unlike other maps, Smith’s 1815 map was produced with help from a '+gap(8)+'.</p><p class="summary-text"><span class="qnum">9</span>Smith’s ‘Geological Atlas’ contained maps of a number of the '+gap(9)+' of England and Wales.</p><p class="summary-text"><span class="qnum">10</span>Smith did not receive '+gap(10)+' for his work until 1831.</p><p class="summary-text"><span class="qnum">11</span>In 1838 Smith advised on the most suitable '+gap(11)+' for rebuilding the Houses of Parliament.</p><p class="summary-text"><span class="qnum">12</span>Smith made speeches about how the country’s '+gap(12)+' benefited from geology.</p><p class="summary-text"><span class="qnum">13</span>Nowadays, geological maps still have the '+gap(13)+' that Smith believed they had.</p></div>';
if(p===2)return '<div class="qgroup"><h3>Questions 14-18</h3><p><i>Reading Passage 2 has 5 sections, A–E. Which section contains the following information?</i></p><p><b><i>NB</i></b> <i>You may use any letter more than once.</i></p>'+sel(14,'an admission that if one type of food is harvested too soon, its taste may be affected',['A','B','C','D','E'])+sel(15,'the view that there is not a great difference between the quantity of nutrients in our food now and in the past',['A','B','C','D','E'])+sel(16,'a comparison which illustrates why developments in agriculture may reduce the amounts of nutrients in foods',['A','B','C','D','E'])+sel(17,'a warning that customers could be deceived by the attractive appearance of a fruit or vegetable',['A','B','C','D','E'])+sel(18,'evidence of the popularity of a new development in food processing which aims to save customers trouble',['A','B','C','D','E'])+'</div><div class="qgroup"><h3>Questions 19-22</h3><p>Look at the following statements and the list of people below. Match each statement with the correct person.</p><div class="box"><b>A</b> Donald Davis<br><b>B</b> Paul Finglas<br><b>C</b> Eric Decker<br><b>D</b> Carol Wagstaff<br><b>E</b> Catherine Collins<br><b>F</b> Judy Buttriss</div>'+sel(19,'People are more likely to become ill if they have low levels of some nutrients.',['A','B','C','D','E','F'])+sel(20,'Making healthy foods easy to cook may be more important than their vitamin content.',['A','B','C','D','E','F'])+sel(21,'An improved diet has made people nowadays live longer and be healthier than in the past.',['A','B','C','D','E','F'])+sel(22,'People’s diets are more varied now than they were in the past.',['A','B','C','D','E','F'])+'</div><div class="qgroup"><h3>Questions 23-26</h3><p><i>Complete the summary below. Choose <b>ONE WORD ONLY</b> from the text for each answer.</i></p><p class="summary-text"><b>Food transportation</b><br>In order to prevent loss of nutrients when transporting fruit and vegetables, chilling is used to slow down the effect that '+gap(23)+' have on them. Some foods, such as tomatoes, must be picked before they are ripe to avoid problems such as '+gap(24)+' during transportation. Other foods, such as cabbage, lose nutrients when kept in the '+gap(25)+'. Vegetables such as '+gap(26)+', which are picked fresh and transported to the supermarket, may be less nutritious than those which are frozen.</p></div>';
return '<div class="qgroup"><h3>Questions 27-31</h3><p>Choose the correct letter, A, B, C or D.</p>'+mcq(27,'What does the writer say about the Oostvaardersplassen in the first paragraph?',['It is not a typical example of a successful rewilding project.','It is not an ecologically sustainable project in the long term.','It is not a true reconstruction of how the area originally was.','It is not faithful to the principles of its underlying philosophy.'])+mcq(28,'What is the writer’s attitude towards the Oostvaardersplassen?',['admiration for what it has achieved','disappointment over its inevitable limitations','optimism that the project will be imitated elsewhere','concern about the choice of species introduced there'])+mcq(29,'What point about beavers is emphasised in the third paragraph?',['Their numbers are falling dramatically.','They play a key role within local ecosystems.','They require a very specific kind of habitat in order to survive.','There are environmental problems associated with their reintroduction.'])+mcq(30,'The writer refers to beavers in the fourth paragraph in order to provide an',['indication of the likely resistance to the reintroduction of other species.','illustration of a species that urgently needs to be restored to its habitat.','example of some lessons learnt about how not to try to reintroduce species.','example of a species whose restoration has faced more problems than most.'])+mcq(31,'By putting inverted commas ‘ ’ around the word ‘their’ in line 49, the writer suggests that',['he has some sympathy for the hunters’ situation.','there is some doubt as to who the deer belong to.','restoration of wolves caused harm to local wildlife.','the hunters have no right to claim ownership of the deer.'])+'</div><div class="qgroup"><h3>Questions 32-36</h3><p>Complete the summary using the list of words, A–H, below.</p><div class="box"><b>A</b> advice &nbsp; <b>B</b> ignorance &nbsp; <b>C</b> danger &nbsp; <b>D</b> wildlife<br><b>E</b> damage &nbsp; <b>F</b> prejudice &nbsp; <b>G</b> evidence &nbsp; <b>H</b> disinterest</div><p class="summary-text"><b>Problems of Rewilding Projects</b><br>Rewilding projects have to deal with numerous challenges. For example, the reintroduction of beavers to Britain has faced '+selInline(32,['A','B','C','D','E','F','G','H'])+' from government ministers together with '+selInline(33,['A','B','C','D','E','F','G','H'])+' on the part of opponents to the scheme. Where wolves have been reintroduced in western Europe, there has been widespread '+selInline(34,['A','B','C','D','E','F','G','H'])+' against these animals among local people, despite clear '+selInline(35,['A','B','C','D','E','F','G','H'])+' that the species poses virtually no '+selInline(36,['A','B','C','D','E','F','G','H'])+' to them.</p></div><div class="qgroup"><h3>Questions 37-40</h3><p><i>Do the following statements agree with the claims of the writer? Write <b>YES / NO / NOT GIVEN</b>.</i></p>'+tf(37,'Beaver restoration in Britain is being held back by a lack of appropriate land.',true)+tf(38,'Scientists have tried to persuade local residents of the benefits of restoring wolves.',true)+tf(39,'Financial incentives will encourage most farmers to welcome rewilding on their land.',true)+tf(40,'The results of rewilding will be unpredictable.',true)+'</div>';
}

function render(){partTitle.textContent='Part '+active;var r=ranges[active];partSub.textContent='Read the text and answer questions '+r[0]+'-'+r[1]+'.';left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();drawFooter();left.scrollTop=right.scrollTop=0}
function val(n){var g=document.getElementById('gap'+n);if(g)return g.value;var s=document.getElementById('sel'+n);if(s)return s.value;var r=document.querySelector('input[name="q'+n+'"]:checked');return r?r.value:''}
function save(){for(var n=1;n<=40;n++){var v=val(n);if(v)state[n]=v}}
function restore(){for(var n=1;n<=40;n++){if(!state[n])continue;var g=document.getElementById('gap'+n);if(g)g.value=state[n];var s=document.getElementById('sel'+n);if(s)s.value=state[n];var r=document.querySelector('input[name="q'+n+'"][value="'+state[n]+'"]');if(r)r.checked=true}}
function answered(n){return !!state[n]||!!val(n)}
function count(p){var r=ranges[p],c=0;for(var i=r[0];i<=r[1];i++)if(answered(i))c++;return c}
function drawFooter(){save();var h='';[1,2,3].forEach(p=>{var r=ranges[p];h+='<div class="partnav"><button class="partlabel" data-part="'+p+'">Part '+p+'</button>';if(p===active){h+='<div class="tiles">';for(var n=r[0];n<=r[1];n++)h+='<button class="tile '+(answered(n)?'answered':'')+'" data-q="'+n+'">'+n+'</button>';h+='</div>'}else h+='<span class="count">'+count(p)+' of '+(r[1]-r[0]+1)+'</span>';h+='</div>'});h+='<button class="review" id="review">OK</button>';footer.innerHTML=h}
document.addEventListener('change',()=>{save();drawFooter()});document.addEventListener('input',()=>{save();drawFooter()});
var lastScore=null;
function renderActive(){left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();if(graded){regradeCurrent();right.insertAdjacentHTML('afterbegin','<div class="score">Your score: <b>'+lastScore+' / 40</b></div><p style="margin:-8px 0 18px;color:#555">Explanations with the exact location in the passage are shown below each answer. Switch Part 1/2/3 tabs to review the rest.</p>')}drawFooter();left.scrollTop=right.scrollTop=0}
footer.onclick=e=>{var p=e.target.closest('[data-part]');if(p){save();active=+p.dataset.part;renderActive();return}var q=e.target.closest('[data-q]');if(q){var n=+q.dataset.q;(document.getElementById('q'+n)||document.getElementById('gap'+n)||document.getElementById('sel'+n))?.scrollIntoView({behavior:'smooth',block:'center'});return}if(e.target.closest('#review'))review()};
function review(){save();var a=0;for(var n=1;n<=40;n++)if(answered(n))a++;subwrap.innerHTML='<p>You have answered <b>'+a+'</b> of 40 questions.</p><p><button class="ovrow submit" id="final">Submit test</button></p>';final.onclick=grade;submit.classList.add('show')}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function correct(n,v){return [answers[n]].concat(alt[n]||[]).some(a=>norm(a)===norm(v))}
function explHTML(n){var e=EXPL[n];if(!e)return '';return '<div class="expl"><b>Q'+n+' — correct answer: '+answers[n]+'</b> &nbsp;<span class="expl-loc">('+e.loc+')</span><br>'+e.text+'</div>'}
function markGap(n){var x=document.getElementById('gap'+n);if(!x)return;var ok=correct(n,x.value);x.disabled=true;x.classList.add(ok?'ok':'no');x.insertAdjacentHTML('afterend',(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>')+explHTML(n));return ok}
function markSel(n){var s=document.getElementById('sel'+n);if(!s)return;var ok=correct(n,s.value);s.disabled=true;s.classList.add(ok?'ok':'no');var row=document.getElementById('q'+n);var tag=(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>');if(row){row.insertAdjacentHTML('beforeend',tag);row.insertAdjacentHTML('afterend',explHTML(n))}else{s.insertAdjacentHTML('afterend',tag);var host=s.closest('p')||s;host.insertAdjacentHTML('afterend',explHTML(n))}return ok}
function markRadio(n){var r=document.querySelector('input[name="q'+n+'"]:checked');var ok=r&&correct(n,r.value);document.querySelectorAll('input[name="q'+n+'"]').forEach(i=>i.disabled=true);var box=document.getElementById('q'+n);box.insertAdjacentHTML('beforeend',(ok?'<span class="tag ok">\u2713</span>':'<span class="tag no">\u2718 correct: '+answers[n]+'</span>'));box.insertAdjacentHTML('afterend',explHTML(n));return ok}
function regradeCurrent(){var r=ranges[active];for(var n=r[0];n<=r[1];n++){var g=document.getElementById('gap'+n),s=document.getElementById('sel'+n),rad=document.querySelector('input[name="q'+n+'"]');if(g)markGap(n);else if(s)markSel(n);else if(rad)markRadio(n)}}
function grade(){if(graded)return;save();var score=0;for(var n=1;n<=40;n++)if(correct(n,state[n]||''))score++;lastScore=score;graded=true;active=1;renderActive();submit.classList.remove('show')}
var drag=false;div.onmousedown=()=>{drag=true;document.body.style.userSelect='none'};window.onmouseup=()=>{drag=false;document.body.style.userSelect=''};window.onmousemove=e=>{if(!drag)return;var r=split.getBoundingClientRect();left.style.width=Math.max(220,Math.min(r.width-240,e.clientX-r.left))+'px'};
split.onmouseup=()=>setTimeout(()=>{var s=getSelection();if(!s||s.isCollapsed||!s.rangeCount){tools.style.display='none';return}var rg=s.getRangeAt(0);if(!split.contains(rg.commonAncestorContainer)){tools.style.display='none';return}var rc=rg.getBoundingClientRect();tools.style.display='flex';tools.style.left=(rc.left+scrollX)+'px';tools.style.top=Math.max(8,rc.top+scrollY-42)+'px'},1);
tools.onclick=e=>{var b=e.target.closest('button'),s=getSelection();if(!b||!s.rangeCount)return;var rg=s.getRangeAt(0);if(b.dataset.act==='hl'){try{var sp=document.createElement('span');sp.className='hl';rg.surroundContents(sp)}catch(_){document.execCommand('hiliteColor',false,'#ffe45c')}}else document.querySelectorAll('.hl').forEach(h=>h.replaceWith(document.createTextNode(h.textContent)));s.removeAllRanges();tools.style.display='none'};
render();
// ---- Bridge added for the mock exam orchestrator ----
window.__mockForceGrade = grade;
window.__mockGetResult = function () {
  if (!graded) return null;
  var answers = {}, key = {};
  for (var n = 1; n <= 40; n++) {
    answers[n] = state[n] || '';
    key[n] = DATA.answers[n];
  }
  return { score: lastScore, total: 40, answers: answers, key: key };
};
})();
</script></body></html>
