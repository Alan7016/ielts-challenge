var DATA = {"passages": {"1": "<h1>The media literacy of children: a review of research literature</h1>\n<p>This document provides a review of the academic literature relating to children's media literacy. It focuses primarily on television, radio, the internet and mobile telephony, and specifically addresses the various barriers to, and enablers of media literacy in the UK. The document begins by exploring the development of the three dimensions contained in Ofcom's* definition of media literacy: 'the ability to access, understand and create communications in a variety of contexts'.</p>\n<p>In terms of access, the literature suggests that most children, even at quite a young age, already possess the competencies needed to gain access to media content: they are quite skilled at using the available technologies and are also able to use the associated software. As they become older, they become more aware of regulatory mechanisms, and take these into account in seeking to make their own decisions. The large majority of children show some awareness of risks relating to giving personal information, such as contact details, on the internet, although they are less aware of financial dangers such as those relating to credit card use or communication of banking details.</p>\n<p>In terms of understanding, most of the research literature relates to the development of children's understanding of television, rather than of other media such as the internet. This literature suggests that children's awareness of areas such as the difference between representation and reality, and the persuasive role of advertising, develops both as a function of their increasing knowledge of the world, and as a result of their broader cognitive development. Children also learn to cope with potentially unwanted or upsetting emotional responses, and to form critical judgments about areas such as television violence, by employing forms of media literacy.</p>\n<p>By contrast, when it comes to creativity, there has been less academic research relating to the 'older' media such as video and analogue radio than to the new media. Research here suggests that there is considerable potential for media to be used as a means of self-expression, not least by socially disadvantaged groups; that creative involvement in media production (particularly in the context of education) can make an important contribution to the development of critical understanding; and that new media such as online gaming and mobile telephony provide possibilities for new forms of interaction.</p>\n<p>Among the barriers to media literacy are several inter-related factors, of which social class and economic status are the most well-established. In the UK, these barriers limit children's access to the internet, although not to established media such as radio or television. Less is known about other potential barriers such as disability, or about the role of individual dispositions or motivations. It is important to recognize that such barriers may affect the quality of media use as well as the quantity - for example, in terms of the available functionality of the technology, the location or level of support for use.</p>\n<p>Potential enablers of media literacy include parents, teachers and other agencies such as broadcasters. Research suggests that parental mediation can play an important role in developing younger children's media literacy, for example in understanding the relationships between representation and reality. However, the role of parents depends upon broader beliefs about child-rearing, and many parents do not play as great a role as they like to suggest. Meanwhile, education about the media has a long history, at least in secondary schools in the UK, although it remains a marginal aspect of the compulsory curriculum, and is rarely found in primary schools. There is also a growing body of evidence concerning the effectiveness of particular teaching strategies in developing media literacy.</p>\n<p>The review provides an indication of several important gaps in the literature. These include specific media, such as radio, mobile phones and online gaming, and particular population groups, such as younger children, those with disabilities, and ethnic minority groups. There is a particular need for research about children's ability to evaluate internet content, and about their awareness of new commercial strategies in the media. Of the three areas in Ofcom's definition, 'creativity' is by far the least well-researched. New technologies and media forms will also pose new challenges and demands in terms of media literacy, so it is important that research in this field is regularly updated.</p>\n<p>In terms of methodology, the review finds that a great deal of research in the field is based on self-reporting, and recommends that there should be more observational studies that explore how media literacy is used in everyday life. In relation to education, there is a need to develop new approaches to assessing the effectiveness of media education in influencing media use outside the classroom.</p>\n<p>Finally, the review reminds us that media literacy is multi-dimensional. The nature and extent of the media literacy that individuals develop depends very much on the purposes for which they use the media in the first place. Different social groups may also develop and require different forms of media literacy in line with their motivations and preferences in media use. As such, we need to beware of adopting an over-simplistic approach to assessing levels of media literacy among the population at large.</p>", "2": "<h1>The attraction of video games</h1>\n<p class=\"sub\">The world's love of video games has much to do with people's desires and motives.</p>\n<div class=\"para\">A</div>\n<p>Video games, it is often claimed, are about wasting time. It is a misunderstanding that players and game makers have been trying to correct for many years. While movies and television are endlessly analysed in the media, games are often dismissed as irresponsible, unimportant by-products of the broader digital revolution.</p>\n<p>But a growing number of experts disagree. This is, after all, an entertainment medium that worldwide makes $50bn a year. Using ideas from psychology and sociology, theorists and designers suggest that our love of video games may actually have important things to tell us about our most basic desires and motivations.</p>\n<p>Game design has become big business and has led to the creation of a multitude of companies. \"The industry attitude toward training has changed radically,\" says prominent game researcher Jesper Juul. \"I recall hearing professionals claim that game design was a strange and unteachable art, but now this attitude has mostly faded.\" Designing video games is increasingly recognised as a valid field of university study throughout the world.</p>\n<div class=\"para\">B</div>\n<p>Central to an understanding of games is the theory that games are fun because they teach us in a way that our brains prefer, that is, through systems and puzzles. Raph Koster, designer of multiplayer fantasy games, points out that an effective learning environment is one in which failure is acceptable, even welcomed. Accordingly, Koster says that in games, the player enters into a situation where the rules of the real world don't apply - and typically being judged on success and failure is part of the real world. When gaming, people feel free to try things and to learn, and not worry about what might happen.</p>\n<p>Consistently, Koster says, the best games are the ones that provide us with interesting tools such as weapons or magic, and allow us to experiment with them. For example, in one early game, players are given the ability to jump, and can practise this for as long as they like, but to get to the next stage they need to master this ability so they can leap over an enemy and onto a platform. \"Games allow us to create these little systems where learning is controlled really brilliantly,\" says Margaret Robertson, director at a London-based game design company. \"Something we don't talk about is that, actually, one of the strengths of games is the vague sense of disapproval that still surrounds them - they feel like something that's forbidden!\" And that can, of course, be very exciting.</p>\n<div class=\"para\">C</div>\n<p>Another important element in the popularity of games is the player's ability to determine what happens. Games tap into our need to have direction; this is very obvious in games where we shape the lives of virtual humans, but it's becoming a vital element of action adventures too.</p>\n<p>\"Games are increasingly complex systems,\" says Dan Pinchbeck, an experimental game designer. \"There's an emphasis on the pleasure of choosing and planning. We've moved quite dramatically away from the very first video games. These games mostly involved the player merely reacting to events. But games then became more about approaching a situation and making a plan depending on your preferred play style.\"</p>\n<div class=\"para\">D</div>\n<p>Many studios design their games around reward systems. \"A good game will have progression at the end of each level, but it will also provide surprise rewards halfway through,\" says Ben Weedon, a games studio consultant. \"In a game, you're essentially pressing the same buttons and doing the same things over and over again, so you need those occasional surprises to stay motivated.\"</p>\n<div class=\"para\">E</div>\n<p>Games have constantly evolved over the years and continue to do so right up to the present. Now, incorporating a narrative structure into a game is becoming increasingly important. Many games have adopted Hollywood's three-act structure, which is designed to maintain our loyalty to a particular game. As in many films, a short final act is often used to give a sense of acceleration towards a preferably startling climax. Opening levels of games are also short, because this flatters us into thinking we're making good progress, whereas the middle levels are more extensive.</p>\n<div class=\"para\">F</div>\n<p>Games even tap into our friendships. The rise of multiplayer gaming means that gaming increasingly involves social interaction. And other businesses are taking notice and using this as an element in advertising their brands. Then there's the new concept of \"gamification\", in which websites and smartphone apps are being designed like games, with high scores and achievement points to keep customers entertained. Research estimates that businesses spent more than $100m worldwide on gamification projects last year, a figure predicted to rise to $1.6bn in the next four years.</p>\n<p>So, in fact, games aren't just an insignificant fad, as some people might suggest. They fulfil intrinsic human needs, whether we are conscious of it or not. The loop of learning, control and rewards is at the heart of something very important, and very attractive.</p>", "3": "<h1>The hazards of multitasking</h1>\n<p class=\"sub\">Doing more than one thing at once - is it always a good idea?</p>\n<p>You arrive at the office, review your to-do list and start to feel a headache coming on. You resolve to tackle the items as quickly as possible. While you return calls, you sort email and other letters. You begin keying in slides for tomorrow's presentation. Then your manager comes in wanting an immediate update on sales figures. You have just opened the spreadsheet when a very important customer calls. With the receiver held between your shoulder and your ear, you continue adding up the sales totals until, 15 minutes later, you finally manage, politely, to get rid of the client. You've been multitasking again.</p>\n<p>You may believe that anyone who wants to get ahead today should master the art of multitasking. However, a recent study by the Families and Work Institute in New York City has found that 45 per cent of US workers believe that they are asked or expected to work on too many tasks at once. Managers may be surprised to learn that they are actually wasting their workers' time. As it turns out, the human brain cannot really master the computer's art of crunching data in the background while moving between process windows. Instead, a growing number of studies show that trying to juggle jobs rather than completing them sequentially can take longer, and leave workers with a reduced ability to perform each task. In addition, the stress associated with multitasking may contribute to short-term memory difficulties. The combination results in inefficiency, careless thinking and mistakes - not to mention the possible dangers of divided attention for drivers, air traffic controllers, and others who handle machinery.</p>\n<p>How can a time management strategy that has become part of the common wisdom actually be so wrong? Exploring that question requires a closer look at an area of consciousness research that examines how the brain focuses attention. One of the modern foundations of current knowledge of multitasking was laid in 1935, when the American psychologist John Ridley Stroop reported that processing information from one task could cause interference with another. Stroop noticed that when study participants were asked to name the color of a word - such as 'green' - printed in a different color - red, for example - they experienced difficulty saying the name of the color. This phenomenon is thought to occur when two tasks get tangled: the brain must suppress one that has been learned so well that it has become automatic (reading), to attend to a second task that requires concentration (naming the color).</p>\n<p>During the past couple of decades, psychologists have probed more deeply into the nature and limitations of multitasking. Psychologist and brain researcher Ernst Poppel, of the Ludwig Maximilian University in Munich, believes that it is impossible to carry out two or three different tasks simultaneously with the same degree of concentration. He says that seemingly simultaneous awareness and processing of information actually takes place in 'three-second windows'. In these three-second segments, the brain takes in, as a block, all the data about the environment streaming in from the sensory systems; subsequent events are processed in the next window. So, a person can concentrate on a conversation for three seconds, then for three seconds on a crying child, and three seconds on a computer screen. While one subject at a time occupies the foreground of consciousness, the others stay in the background until they, in turn, are given access to the central processor.</p>\n<p>Another experiment by psychologist David E Meyer, of the University of Michigan, quantified just how much time we can lose when we shuttle between tasks. The researchers asked test participants to write a report and check their email at the same time. Those individuals who constantly jumped back and forth between the two tasks took about one and a half times as long to finish as those who completed one job before turning to the other. Each switchover from one task to another meant rethinking, and thus involved additional neural resources. In effect, the brain needs time to switch off the rules for one task and to turn on the rules for another. \"Multitasking saves time only when it is a matter of relaxed, routine tasks,\" Meyer says. It also takes the brain longer to adapt when switching rapidly back to an interrupted task, rather than waiting longer before switching back.</p>\n<p>By its nature multitasking is stressful, and the area in the brain most involved with multitasking is also most affected by the resulting stress. Located behind the forehead, the prefrontal cortex, which neuroscientists call the 'executive' part of the brain, helps us to assess tasks, prioritise them and assign mental resources. It also 'marks' the spot at which a task has been interrupted, so that we can return to it later. This stress can also affect brain cells in another region, the hippocampus, which is important for forming new memories; damage in that area also makes it difficult for a person to acquire new skills.</p>\n<p>Psychiatrists Edward Halliwell and John Ratey, of Harvard University, say that multitasking can bring about a brain condition that causes sufferers to constantly seek new information while having difficulties concentrating on its content. All in all, it may be wise to let the email wait while you work on your presentation. You will save time and perform each task better.</p>"}, "answers": {"1": "access", "2": "financial", "3": "television", "4": "cognitive development", "5": "critical judgments", "6": "new media", "7": "interaction", "8": "FALSE", "9": "TRUE", "10": "NOT GIVEN", "11": "TRUE", "12": "FALSE", "13": "TRUE", "14": "vi", "15": "i", "16": "vii", "17": "iii", "18": "ii", "19": "iv", "20": "D", "21": "E", "22": "A", "23": "D", "24": "failure", "25": "disapproval", "26": "short", "27": "B", "28": "C", "29": "A", "30": "B", "31": "D", "32": "B", "33": "D", "34": "C", "35": "forehead", "36": "mental resources", "37": "brain cells", "38": "new memories", "39": "new skills", "40": "B"}, "alt": {"5": ["critical judgements"], "36": ["mental resource"], "38": ["memories"], "39": ["skills"]}, "expl": {"1": {"loc": "Introduction, para 1", "text": "Ofcom's definition is quoted directly: ‘the ability to access, understand and create communications...’ — the first dimension is 'access'."}, "2": {"loc": "Para 2 (Access)", "text": "'...they are less aware of financial dangers such as those relating to credit card use or communication of banking details.'"}, "3": {"loc": "Para 3 (Understanding)", "text": "'...most of the research literature relates to the development of children’s understanding of television, rather than of other media...'"}, "4": {"loc": "Para 3 (Understanding)", "text": "'...develops both as a function of their increasing knowledge of the world, and as a result of their broader cognitive development.'"}, "5": {"loc": "Para 3 (Understanding)", "text": "'...to form critical judgments about areas such as television violence, by employing forms of media literacy.'"}, "6": {"loc": "Para 4 (Creativity)", "text": "'...there has been less academic research relating to the ‘older’ media... than to the new media' — so most research is on new media."}, "7": {"loc": "Para 4 (Creativity)", "text": "'...new media such as online gaming and mobile telephony provide possibilities for new forms of interaction.'"}, "8": {"loc": "Para 5 (Barriers)", "text": "'Less is known about other potential barriers such as disability' — the opposite of considerable research, so FALSE."}, "9": {"loc": "Para 5 (Barriers)", "text": "'...such barriers may affect the quality of media use as well as the quantity – for example... the location or level of support for use.'"}, "10": {"loc": "Whole passage", "text": "No specific claim is made about young children being badly affected by mobile phones — NOT GIVEN."}, "11": {"loc": "Para 6 (Gaps)", "text": "'Of the three areas in Ofcom’s definition, ‘creativity’ is by far the least well-researched' implies understanding has more literature — TRUE."}, "12": {"loc": "Para 7 (Methodology)", "text": "'...recommends that there should be more observational studies' means there are currently too few, not too many — FALSE."}, "13": {"loc": "Final paragraph", "text": "'The nature and extent of the media literacy... depends very much on the purposes for which they use the media...' — TRUE."}, "14": {"loc": "Section A", "text": "Discusses game design becoming an accepted academic field ('this attitude has mostly faded') → heading vi."}, "15": {"loc": "Section B", "text": "Koster: 'the player enters into a situation where the rules of the real world don’t apply' and can try things without worry → heading i."}, "16": {"loc": "Section C", "text": "'the player’s ability to function qhtml(p){
if(p===1)return '<div class="qgroup"><h3>Questions 1-7</h3><p><i>Complete the notes below. Choose <b>NO MORE THAN TWO WORDS</b> from the passage for each answer.</i></p><div class="notes"><h3>Media Literacy</h3><div class="note-row">Media literacy involves:<br>a. having '+gap(1)+' to communications</div><div class="note-row">Research suggests that:</div><div class="note-row">&bull; most children can use technology and software to locate media content</div><div class="note-row">&bull; older children consider regulatory mechanisms when making decisions</div><div class="note-row">&bull; many children do not recognise the '+gap(2)+' risks related to internet use</div><div class="note-row">b. understanding communications<br>Most research has been done on children and '+gap(3)+', and not on alternative forms of communication.</div><div class="note-row">It suggests that:</div><div class="note-row">&bull; children\’s awareness grows with their knowledge of the world and their '+gap(4)+'</div><div class="note-row">&bull; children can use media literacy to make '+gap(5)+' and to cope with negative responses</div><div class="note-row">c. creating communications<br>Most research has focused on the '+gap(6)+', indicating their use for:</div><div class="note-row">&bull; self-expression</div><div class="note-row">&bull; the development of understanding</div><div class="note-row">&bull; different types of '+gap(7)+'</div></div></div><div class="qgroup"><h3>Questions 8-13</h3><p><i>Do the following statements agree with the information given in the passage? Write <b>TRUE / FALSE / NOT GIVEN</b>.</i></p>'+tf(8,'When studying barriers to media literacy, considerable research has been done on the effects of disability.')+tf(9,'The amount of support given by parents may affect the quality of a child\’s media use.')+tf(10,'Young children may be badly affected by use of specific media such as mobile phones.')+tf(11,'More research literature is available on understanding the media than on creativity.')+tf(12,'Too many observational studies have been conducted recently into media literacy.')+tf(13,'The reason a person has for using the media will affect his or her media literacy.')+'</div>';
if(p===2)return '<div class="qgroup"><h3>Questions 14-19</h3><p><i>Reading Passage 2 has six sections, A\–F. Choose the correct heading for each section from the list of headings below.</i></p><div class="box"><b>i</b> Being able to experiment without consequences<br><b>ii</b> Why stories are included in games<br><b>iii</b> The key role of the unexpected for game players<br><b>iv</b> Transferring features of games to other types of products<br><b>v</b> The age group that games most appeal to<br><b>vi</b> The development of the video game design industry<br><b>vii</b> Players\’ ability to control what occurs in games</div>'+sel(14,'Section A',['i','ii','iii','iv','v','vi','vii'])+sel(15,'Section B',['i','ii','iii','iv','v','vi','vii'])+sel(16,'Section C',['i','ii','iii','iv','v','vi','vii'])+sel(17,'Section D',['i','ii','iii','iv','v','vi','vii'])+sel(18,'Section E',['i','ii','iii','iv','v','vi','vii'])+sel(19,'Section F',['i','ii','iii','iv','v','vi','vii'])+'</div><div class="qgroup"><h3>Questions 20-23</h3><p>Look at the following statements and the list of experts below. Match each statement with the correct expert.</p><p><b><i>NB</i></b> <i>You may use any letter more than once.</i></p><div class="box"><b>A</b> Jesper Juul<br><b>B</b> Raph Koster<br><b>C</b> Margaret Robertson<br><b>D</b> Dan Pinchbeck<br><b>E</b> Ben Weedon</div>'+sel(20,'Players\’ involvement in games often includes thinking ahead.',['A','B','C','D','E'])+sel(21,'The inclusion of unanticipated elements keeps players interested.',['A','B','C','D','E'])+sel(22,'It\’s now accepted that creating video games is a skill that can be learned.',['A','B','C','D','E'])+sel(23,'Early games were much simpler than more recent ones.',['A','B','C','D','E'])+'</div><div class="qgroup"><h3>Questions 24-26</h3><p><i>Complete the sentences below. Choose <b>ONE WORD ONLY</b> from the passage for each answer.</i></p><p class="summary-text"><span class="qnum">24</span>Koster believes that games remove people\’s fear of '+gap(24)+'.</p><p class="summary-text"><span class="qnum">25</span>Robertson\’s view is that games feel exciting partly because of the '+gap(25)+' that is associated with them.</p><p class="summary-text"><span class="qnum">26</span>Narrative games are often structured so that the first and last part are both '+gap(26)+'.</p></div>';
return '<div class="qgroup"><h3>Questions 27-31</h3><p>Look at the following theories and the list of people below. Match each theory with the correct person or people.</p><p><b><i>NB</i></b> <i>You may use any letter more than once.</i></p><div class="box"><b>A</b> John Ridley Stroop<br><b>B</b> Ernst P\öppel<br><b>C</b> David E Meyer<br><b>D</b> Edward Halliwell &amp; John Ratey</div>'+sel(27,'Less attention will be paid to each task when more than one task is attempted at the same time.',['A','B','C','D'])+sel(28,'Repeated changes of task mean that the brain will take a while to adjust.',['A','B','C','D'])+sel(29,'Using the skills required for one task may make performing another one more difficult.',['A','B','C','D'])+sel(30,'When multitasking, the brain can only focus on single tasks for very short periods.',['A','B','C','D'])+sel(31,'Multitasking can lead to a medical problem.',['A','B','C','D'])+'</div><div class="qgroup"><h3>Questions 32-34</h3><p>Choose the correct letter, A, B, C or D.</p>'+mcq(32,'What is suggested about the worker in the opening paragraph?',['Anxiety deprived him of sleep the previous night.','He feels overwhelmed by his workload.','His manager has expressed disapproval.','He finds his work dull and uninteresting.'])+mcq(33,'Drivers and air traffic controllers are mentioned in the passage because they',['need to perform several tasks at once.','are unable to maintain concentration.','use their time efficiently.','cannot afford to make mistakes.'])+mcq(34,'In John Ridley Stroop\’s experiment, participants found it difficult to',['tell one color from another.','match up pairs of similar colors.','read out the name of one color printed in another color.','decide what color looks most appropriate for a particular word.'])+'</div><div class="qgroup"><h3>Questions 35-39</h3><p><i>Complete the summary below. Choose <b>NO MORE THAN TWO WORDS</b> from the passage for each answer.</i></p><p class="summary-text"><b>Multitasking and its effects on the brain</b><br>The stressful nature of multitasking has been shown to affect parts of the brain. The area most affected is the prefrontal cortex, which is found to the rear of the '+gap(35)+'. It is the part of the brain which judges tasks, then puts them in order of importance and allocates '+gap(36)+'; it also enables a worker to resume a task which has been put to one side. A second area, the hippocampus, may also be affected by the stress of multitasking. If any '+gap(37)+' in the hippocampus are affected, people may have problems with storing '+gap(38)+', as well as learning '+gap(39)+'.</p></div><div class="qgroup"><h3>Question 40</h3><p>Choose the correct letter, A, B, C or D.</p>'+mcq(40,'The main aim of this passage is to',['describe areas where multitasking is useful.','challenge widely held opinions on multitasking.','show the physical damage that multitasking can cause.','call for better psychological experiments on multitasking.'])+'</div>';
}
function render(){partTitle.textContent='Part '+active;var r=ranges[active];partSub.textContent='Read the text and answer questions '+r[0]+'-'+r[1]+'.';left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();drawFooter();left.scrollTop=right.scrollTop=0}
function val(n){var g=document.getElementById('gap'+n);if(g)return g.value;var s=document.getElementById('sel'+n);if(s)return s.value;var r=document.querySelector('input[name="q'+n+'"]:checked');return r?r.value:''}
function save(){for(var n=1;n<=40;n++){var v=val(n);if(v)state[n]=v}}
function restore(){for(var n=1;n<=40;n++){if(!state[n])continue;var g=document.getElementById('gap'+n);if(g)g.value=state[n];var s=document.getElementById('sel'+n);if(s)s.value=state[n];var r=document.querySelector('input[name="q'+n+'"][value="'+state[n]+'"]');if(r)r.checked=true}}
function answered(n){return !!state[n]||!!val(n)}
function count(p){var r=ranges[p],c=0;for(var i=r[0];i<=r[1];i++)if(answered(i))c++;return c}
function drawFooter(){save();var h='';[1,2,3].forEach(p=>{var r=ranges[p];h+='<div class="partnav"><button class="partlabel" data-part="'+p+'">Part '+p+'</button>';if(p===active){h+='<div class="tiles">';for(var n=r[0];n<=r[1];n++)h+='<button class="tile '+(answered(n)?'answered':'')+'" data-q="'+n+'">'+n+'</button>';h+='</div>'}else h+='<span class="count">'+count(p)+' of '+(r[1]-r[0]+1)+'</span>';h+='</div>'});h+='<button class="review" id="review">OK</button>';footer.innerHTML=h}
document.addEventListener('change',()=>{save();drawFooter()});document.addEventListener('input',()=>{save();drawFooter()});
var lastScore=null;
function renderActive(){left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();if(graded){regradeCurrent();right.insertAdjacentHTML('afterbegin','<div class="score">Your score: <b>'+lastScore+' / 40</b></div><p style="margin:-8px 0 18px;color:#555">Explanations with the exact location in the passage are shown below each answer. Switch Part 1/2/3 tabs to review the rest.</p>')}drawFooter();left.scrollTop=right.scrollTop=0}
footer.onclick=e=>{var p=e.target.closest('[data-part]');if(p){save();active=+p.dataset.part;renderActive();return}var q=e.target.closest('[data-q]');if(q){var n=+q.dataset.q;(document.getElementById('q'+n)||document.getElementById('gap'+n)||document.getElementById('sel'+n))?.scrollIntoView({behavior:'smooth',block:'center'});return}if(e.target.closest('#review'))review()};
function review(){save();var a=0;for(var n=1;n<=40;n++)if(answered(n))a++;subwrap.innerHTML='<p>You have answered <b>'+a+'</b> of 40 questions.</p><p><button class="ovrow submit" id="final">Submit test</button></p>';final.onclick=grade;submit.classList.add('show')}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function correct(n,v){return [answers[n]].concat(alt[n]||[]).some(a=>norm(a)===norm(v))}
function explHTML(n){var e=EXPL[n];if(!e)return '';return '<div class="expl"><b>Q'+n+' — correct answer: '+answers[n]+'</b> &nbsp;<span class="expl-loc">('+e.loc+')</span><br>'+e.text+'</div>'}
function markGap(n){var x=document.getElementById('gap'+n);if(!x)return;var ok=correct(n,x.value);x.disabled=true;x.classList.add(ok?'ok':'no');x.insertAdjacentHTML('afterend',(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>')+explHTML(n));return ok}
function markSel(n){var s=document.getElementById('sel'+n);if(!s)return;var ok=correct(n,s.value);s.disabled=true;s.classList.add(ok?'ok':'no');var row=document.getElementById('q'+n);row.insertAdjacentHTML('beforeend',(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>'));row.insertAdjacentHTML('afterend',explHTML(n));return ok}
function markRadio(n){var r=document.querySelector('input[name="q'+n+'"]:checked');var ok=r&&correct(n,r.value);document.querySelectorAll('input[name="q'+n+'"]').forEach(i=>i.disabled=true);var box=document.getElementById('q'+n);box.insertAdjacentHTML('beforeend',(ok?'<span class="tag ok">\u2713</span>':'<span class="tag no">\u2718 correct: '+answers[n]+'</span>'));box.insertAdjacentHTML('afterend',explHTML(n));return ok}
function regradeCurrent(){var r=ranges[active];for(var n=r[0];n<=r[1];n++){var g=document.getElementById('gap'+n),s=document.getElementById('sel'+n),rad=document.querySelector('input[name="q'+n+'"]');if(g)markGap(n);else if(s)markSel(n);else if(rad)markRadio(n)}}
function grade(){if(graded)return;save();var score=0;for(var n=1;n<=40;n++)if(correct(n,state[n]||''))score++;lastScore=score;graded=true;active=1;renderActive();submit.classList.remove('show')}
var drag=false;div.onmousedown=()=>{drag=true;document.body.style.userSelect='none'};window.onmouseup=()=>{drag=false;document.body.style.userSelect=''};window.onmousemove=e=>{if(!drag)return;var r=split.getBoundingClientRect();left.style.width=Math.max(220,Math.min(r.width-240,e.clientX-r.left))+'px'};
split.onmouseup=()=>setTimeout(()=>{var s=getSelection();if(!s||s.isCollapsed||!s.rangeCount){tools.style.display='none';return}var rg=s.getRangeAt(0);if(!split.contains(rg.commonAncestorContainer)){tools.style.display='none';return}var rc=rg.getBoundingClientRect();tools.style.display='flex';tools.style.left=(rc.left+scrollX)+'px';tools.style.top=Math.max(8,rc.top+scrollY-42)+'px'},1);
tools.onclick=e=>{var b=e.target.closest('button'),s=getSelection();if(!b||!s.rangeCount)return;var rg=s.getRangeAt(0);if(b.dataset.act==='hl'){try{var sp=document.createElement('span');sp.className='hl';rg.surroundContents(sp)}catch(_){document.execCommand('hiliteColor',false,'#ffe45c')}}else document.querySelectorAll('.hl').forEach(h=>h.replaceWith(document.createTextNode(h.textContent)));s.removeAllRanges();tools.style.display='none'};
render();
})();
</script></body></html>
