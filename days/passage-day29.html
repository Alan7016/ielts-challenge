var DATA = {"passages": {"1": "<h1>How to find your way out of a food desert</h1>\n<p class=\"sub\">Ordinary citizens have been using the internet to draw attention to the lack of healthy eating options in inner cities.</p>\n<p>Over the last few months, a survey has been carried out of over 200 greengrocers and convenience stores in Crown Heights, a neighborhood in Brooklyn, New York. As researchers from the Brooklyn Food Association enter the details, colorful dots appear on their online map, which display the specific location of each of the food stores in a handful of central Brooklyn neighborhoods. Clicking on a dot will show you the store's name and whether it carries fresh fruit and vegetables, wholegrain bread, low-fat dairy and other healthy options.</p>\n<p>The researchers plan eventually to survey the entire borough of Brooklyn. 'We want to get to a more specific and detailed description of what that looks like', says Jeffrey Heehs, who leads the project. He hopes it will help residents find fresh food in urban areas where the stores sell mostly packaged snacks or fast food, areas otherwise known as food deserts. The aim of the project is also to assist government officials in assessing food availability, and in forming future policies about what kind of food should be sold and where.</p>\n<p>In fact, the Brooklyn project represents the intersection of two growing trends: mapping fresh food markets in US cities, and private citizens creating online maps of local neighborhood features. According to Michael Goodchild, a geographer at the University of California at Santa Barbara, citizen map makers may make maps because there is no good government map, or to record problems such as burned-out traffic lights.</p>\n<p>According to recent studies, people at higher risk of chronic disease and who receive minimal incomes for the work they do, frequently live in neighborhoods located in food deserts. But how did these food deserts arise? Linda Alwitt and Thomas Donley, marketing researchers at DePaul University in Chicago, found that supermarkets often can't afford the amount of land required for their stores in cities. City planning researcher Cliff Guy and colleagues at the University of Leeds in the UK found in 2004 that smaller urban groceries tend to close due to competition from suburban supermarkets.</p>\n<p>As fresh food stores leave a neighborhood, residents find it harder to eat well and stay healthy. Food deserts are linked with lower local health outcomes, and they may be a driving force in the health disparities between lower-income and affluent people in the US. Until recently, the issue attracted little national attention, and received no ongoing funding for research.</p>\n<p>Now, more US cities are becoming aware of their food landscapes. Last year, the United States Department of Agriculture launched a map of where food stores are located in all the US counties. Mari Gallagher, who runs a private consulting firm, says her researchers have mapped food stores and related them to health statistics for the cities of Detroit, Chicago, Cincinnati and Washington, DC. These maps help cities identify where food deserts are and, occasionally, have documented that people living in food deserts have higher rates of diet-related diseases.</p>\n<p>The Brooklyn project differs in that it's run by a local core of five volunteers who have worked on the project for the past year, rather than trained, academic researchers. To gather data, they simply go to individual stores with pre-printed surveys in hand, and once the storekeeper's permission has been obtained, check off boxes on their list against the products for sale in the store. Their approach to data collection and research has been made possible by technologies such as mapping software and GPS-related smart phones, Google Maps and OpenStreetMap, an open-source online map with a history of involvement in social issues. Like Brooklyn Food Association volunteers, many citizen online map makers use maps to bring local problems to official attention, Goodchild says. Heehs, the mapping project leader, says that after his group gathers more data, it will compare neighborhoods, come up with solutions to address local needs, and then present them to New York City officials. Their website hasn't caught them much local or official attention yet, however. It was launched only recently, but its creators haven't yet set up systems to see who's looking at it.</p>\n<p>Experts who visited the Brooklyn group's site were optimistic but cautious. 'This kind of detailed information could be very useful' says Michele Ver Ploeg, an economist for the Department of Agriculture. To make the map more helpful to both residents and policy makers, she would like to see price data for healthy products, too. Karen Ansel, a registered dietician and a spokesperson for the American Dietetic Association, found the site confusing to navigate. 'That said, with this information in place the group has the tools to build a more user-friendly site that could be ... very helpful to consumers', she says. 'The group also should ensure their map is available to those who don't have internet access at home', she adds. In fact, a significant proportion of Brooklyn residents don't have internet access at home and 8 percent rely on dial-up service, instead of high-speed internet access, according to Gretchen Maneval, director of Brooklyn College's Center for the Study of Brooklyn. 'It's still very much a work in progress', Heehs says of the online map. They'll start advertising it online and by email to other community groups, such as urban food garden associations, next month. He also hopes warmer days in the spring will draw out fresh volunteers to spread awareness and to finish surveying, as they have about two-thirds of Brooklyn left to cover.</p>", "2": "<h1>The dingo debate</h1>\n<p class=\"sub\">Graziers see them as pests, and poisoning is common, but some biologists think Australia's dingoes are the best weapon in a war against imported cats and foxes.</p>\n<div class=\"para\">A</div>\n<p>A plane flies a slow pattern over Carlton Hill station, a 3,600 square kilometre ranch in the Kimberley region in northwest Australia. As the plane circles, those aboard drop 1,000 small pieces of meat, one by one, onto the scrubland below, each piece laced with poison; this practice is known as baiting.</p>\n<p>Besides 50,000 head of cattle, Carlton Hill is home to the dingo, Australia's largest mammalian predator and the bane of a grazier's (cattle farmer's) life. Stuart McKechnie, manager of Carlton Hill, complains that graziers' livelihoods are threatened when dingoes prey on cattle. But one man wants the baiting to end, and for dingoes to once again roam Australia's wide-open spaces. According to Chris Johnson of James Cook University, 'Australia needs more dingoes to protect our biodiversity.'</p>\n<div class=\"para\">B</div>\n<p>About 4,000 years ago, Asian sailors introduced dingoes to Australia. Throughout the ensuing millennia, these descendants of the wolf spread across the continent and, as the Tasmanian tiger disappeared completely from Australia, dingoes became Australia's top predators. As agricultural development took place, the European settlers found that they could not safely keep their livestock where dingoes roamed. So began one of the most sustained efforts at pest control in Australia's history. Over the last 150 years, dingoes have been shot and poisoned, and fences have been used in an attempt to keep them away from livestock. But at the same time, as the European settlers tried to eliminate one native pest from Australia, they introduced more of their own.</p>\n<div class=\"para\">C</div>\n<p>In 1860, the rabbit was unleashed on Australia by a wealthy landowner and by 1980 rabbits had covered most of the mainland. Rabbits provide a huge prey base for two other introduced species: the feral (wild) cat and the red fox.</p>\n<p>The interaction between foxes, cats and rabbits is a huge problem for native mammals. In good years, rabbit numbers increase dramatically, and fox and cat populations grow quickly in response to the abundance of this prey. When bad seasons follow, rabbit numbers are significantly reduced - and the dwindling but still large fox and cat populations are left with little to eat besides native mammals.</p>\n<div class=\"para\">D</div>\n<p>Australian mammals generally reproduce much more slowly than rabbits, cats and foxes - an adaptation to prevent overpopulation in the arid environment, where food can be scarce and unreliable - and populations decline because they can't grow fast enough to replace animals killed by the predators. Johnson says dingoes are the solution to this problem because they keep cat and fox populations under control. Besides regularly eating the smaller predators, dingoes will kill them simply to lessen competition.</p>\n<p>Dingo packs live in large, stable territories and generally have only one fertile female, which limits their rate of increase. In the 4,000 years that dingoes have been in Australia, they have contributed to few, if any, extinctions, Johnson says.</p>\n<div class=\"para\">E</div>\n<p>Reaching out from a desolate spot where three states meet, for 2,500 km in either direction, is the world's longest fence, two metres high and stretching from the coast in Queensland to the Great Australian Bight in South Australia; it is there to keep dingoes out of the southeast. The fence separates the main types of livestock found in Australia. To the northwest of the fence, cattle predominate; to the southeast, sheep fill the landscape. In fact, Australia is a land dominated by these animals - 25 million cattle, 100 million sheep and just over 20 million people.</p>\n<div class=\"para\">F</div>\n<p>While there is no argument that dingoes will prey on sheep if given the chance, they don't hunt cattle once the calves are much past two or three weeks old, according to McKechnie. And a study in Queensland suggests that dingoes don't even prey heavily on the newborn calves unless their staple prey disappears due to deteriorating conditions like drought.</p>\n<p>This study, co-authored by Lee Allen of the Robert Wicks Research Centre in Queensland, suggests that the aggressive baiting programs used against dingoes may actually be counter-productive for graziers. When dingoes are removed from an area by baiting, the area is recolonized by younger, more solitary dingoes. These animals aren't capable of going after large prey like kangaroos, so they turn to calves. In their study, some of the highest rates of calf predation occurred in areas that had been baited.</p>\n<div class=\"para\">G</div>\n<p>Mark Clifford, general manager of a firm that manages over 200,000 head of cattle, is not convinced by Allen's assertion. Clifford says, 'It's obvious if we drop or loosen control on dingoes, we are going to lose more calves.' He doesn't believe that dingoes will go after kangaroos when calves are around. Nor is he persuaded of dingoes' supposed ecological benefits, saying he is not convinced that they manage to catch cats that often, believing they are more likely to catch small native animals instead.</p>\n<div class=\"para\">H</div>\n<p>McKechnie agrees that dingoes kill the wallabies (small native animals) that compete with his cattle for food, but points out that in parts of Western Australia, there are no foxes, and not very many cats. He doesn't see how relaxing controls on dingoes in his area will improve the ecological balance.</p>\n<p>Johnson sees a need for a change in philosophy on the part of graziers. 'There might be a number of different ways of thinking through dingo management in cattle country,' he says. 'At the moment, though, that hasn't got through to graziers. There's still just one prescription, and that is to bait as widely as possible.'</p>", "3": "<h1>Pacific navigation and voyaging</h1>\n<p class=\"sub\">How people migrated to the Pacific islands</p>\n<p>The many tiny islands of the Pacific Ocean had no human population until ancestors of today's islanders sailed from Southeast Asia in ocean-going canoes approximately 2,000 years ago. At the present time, the debate continues about exactly how they migrated such vast distances across the ocean, without any of the modern technologies we take for granted.</p>\n<p>Although the romantic vision of some early twentieth-century writers of fleets of heroic navigators simultaneously setting sail had come to be considered by later investigators to be exaggerated, no considered assessment of Pacific voyaging was forthcoming until 1956 when the American historian Andrew Sharp published his research. Sharp challenged the 'heroic vision' by asserting that the expertise of the navigators was limited, and that the settlement of the islands was not systematic, being more dependent on good fortune by drifting canoes. Sharp's theory was widely challenged, and deservedly so. If nothing else, however, it did spark renewed interest in the topic and precipitated valuable new research.</p>\n<p>Since the 1960s a wealth of investigations has been conducted, and most of them, thankfully, have been of the 'non-armchair' variety. While it would be wrong to denigrate all 'armchair' research - that based on an examination of available published materials - it has turned out that so little progress had been made in the area of Pacific voyaging because most writers relied on the same old sources - travelers' journals or missionary narratives compiled by unskilled observers. After Sharp, this began to change, and researchers conducted most of their investigations not in libraries, but in the field.</p>\n<p>In 1965, David Lewis, a physician and experienced yachtsman, set to work using his own unique philosophy: he took the yacht he had owned for many years and navigated through the islands in order to contact those men who still find their way at sea using traditional methods. He then accompanied these men, in their traditional canoes, on test voyages from which all modern instruments were banished from sight, though Lewis secretly used them to confirm the navigator's calculations. His most famous such voyage was a return trip of around 1,000 nautical miles between two islands in midocean. Far from drifting, as proposed by Sharp, Lewis found that ancient navigators would have known which course to steer by memorizing which stars rose and set in certain positions along the horizon and this gave them fixed directions by which to steer their boats.</p>\n<p>The geographer Edwin Doran followed a quite different approach. He was interested in obtaining exact data on canoe sailing performance, and to that end employed the latest electronic instrumentation. Doran traveled on board traditional sailing canoes in some of the most remote parts of the Pacific, all the while using his instruments to record canoe speeds in different wind strengths - from gales to calms - the angle canoes could sail relative to the wind. In the process, he provided the first really precise attributes of traditional sailing canoes.</p>\n<p>A further contribution was made by Steven Horvath. As a physiologist, Horvath's interest was not in navigation techniques or in canoes, but in the physical capabilities of the men themselves. By adapting standard physiological techniques, Horvath was able to calculate the energy expenditure required to paddle canoes of this sort at times when there was no wind to fill the sails, or when the wind was contrary. He concluded that paddles, or perhaps long oars, could indeed have propelled for long distances what were primarily sailing vessels.</p>\n<p>Finally, a team led by P Wall Garrard conducted important research, in this case by making investigations while remaining safely in the laboratory. Wall Garrard's unusual method was to use the findings of linguists who had studied the languages of the Pacific islands, many of which are remarkably similar although the islands where they are spoken are sometimes thousands of kilometres apart. Clever adaptation of computer simulation techniques pioneered in other disciplines allowed him to produce convincing models suggesting the migrations were indeed systematic, but not simultaneous. Wall Garrard proposed the migrations should be seen not as a single journey made by a massed fleet of canoes, but as a series of ever more ambitious voyages, each pushing further into the unknown ocean.</p>\n<p>What do we learn about Pacific navigation and voyaging from this research? Quite correctly, none of the researchers tried to use their findings to prove one theory or another; experiments such as these cannot categorically confirm or negate a hypothesis. The strength of this research lay in the range of methodologies employed. When we splice together these findings we can propose that traditional navigators used a variety of canoe types, sources of water and navigation techniques, and it was this adaptability which was their greatest accomplishment. These navigators observed the conditions prevailing at sea at the time a voyage was made and altered their techniques accordingly. Furthermore, the canoes of the navigators were not drifting helplessly at sea but were most likely part of a systematic migration; as such, the Pacific peoples were able to view the ocean as an avenue, not a barrier, to communication before any other race on Earth. Finally, one unexpected but most welcome consequence of this research has been a renaissance in the practice of traditional voyaging. In some groups of islands in the Pacific today young people are resurrecting the skills of their ancestors, when a few decades ago it seemed they would be lost forever.</p>"}, "answers": {"1": "availability", "2": "policies", "3": "government", "4": "incomes", "5": "land", "6": "competition", "7": "FALSE", "8": "FALSE", "9": "NOT GIVEN", "10": "FALSE", "11": vironment' → 'overpopulation'."}, "27": {"loc": "Para 1", "text": "'had no human population until ancestors of today's islanders sailed from Southeast Asia' → YES."}, "28": {"loc": "Para 2", "text": "'the romantic vision of some early twentieth-century writers' predates Sharp's 1956 publication → NO."}, "29": {"loc": "Para 2", "text": "'Sharp challenged the ‘heroic vision’ by asserting that the expertise of the navigators was limited... more dependent on good fortune by drifting canoes' → YES."}, "30": {"loc": "Para 2", "text": "'it did spark renewed interest in the topic and precipitated valuable new research' → YES."}, "31": {"loc": "Para 5", "text": "Doran 'followed a quite different approach' — no mention of disagreement with Lewis → NOT GIVEN."}, "32": {"loc": "Para 4", "text": "'test voyages from which all modern instruments were banished from sight' → C."}, "33": {"loc": "Para 4", "text": "'this gave them fixed directions by which to steer their boats' → C, they knew which direction they were sailing."}, "34": {"loc": "Para 5", "text": "'employed the latest electronic instrumentation... using his instruments to record canoe speeds' → B."}, "35": {"loc": "Para 6", "text": "'paddles, or perhaps long oars, could indeed have propelled for long distances what were primarily sailing vessels' → D."}, "36": {"loc": "Para 7", "text": "'Clever adaptation of computer simulation techniques pioneered in other disciplines allowed him to produce convincing models' → B."}, "37": {"loc": "Final paragraph", "text": "'none of the researchers tried to use their findings to prove one theory or another; experiments such as these cannot categorically confirm or negate a hypothesis' → C."}, "38": {"loc": "Final paragraph", "text": "'The strength of this research lay in the range of methodologies employed' → A."}, "39": {"loc": "Final paragraph", "text": "'it was this adaptability which was their greatest accomplishment... altered their techniques accordingly' → D."}, "40": {"loc": " function sel(n,t,letters){return '<div class="row" id="q'+n+'"><span class="qnum">'+n+'</span><span class="txt">'+t+'</span><select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select></div>'}

function mcq(n,t,opts){return '<div class="mcq" id="q'+n+'"><div class="prompt"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="choice-options">'+opts.map((o,i)=>'<label class="choice-option"><input type="radio" name="q'+n+'" value="'+'ABCD'[i]+'"> <b>'+'ABCD'[i]+'</b> '+o+'</label>').join('')+'</div></div>'}
var multiGroups={}, groupQNums={};
function multiSel(qA,qB,promptText,options){var name='g'+qA+'_'+qB;multiGroups[qA]=name;multiGroups[qB]=name;groupQNums[name]=[qA,qB];return '<div id="q_'+name+'" class="tf-row"><div class="statement"><span class="qnum">'+qA+', '+qB+'</span><span>'+promptText+'</span></div><div class="options">'+options.map(o=>'<label><input type="checkbox" name="'+name+'" value="'+o.letter+'"> <b>'+o.letter+'</b> '+o.text+'</label>').join('')+'</div></div>'}

function qhtml(p){
if(p===1)return '<div class="qgroup"><h3>Questions 1-6</h3><p><i>Complete the notes below. Choose <b>ONE WORD ONLY</b> from the passage for each answer.</i></p><div class="notes"><h3>Data on food deserts and their effects on health</h3><div class="note-row"><b>The Brooklyn Food Association</b></div><div class="note-row">&bull; The online map provides users with a store’s name, '+gap(1)+' of its produce</div><div class="note-row">&bull; One goal of the mapping project is to help develop new '+gap(2)+'</div><div class="note-row">&bull; Citizen maps are sometimes made when '+gap(3)+' maps are unsatisfactory</div><div class="note-row"><b>Reasons for the development of food deserts</b></div><div class="note-row">&bull; New research suggests that people living in food deserts often have low '+gap(4)+'</div><div class="note-row">&bull; Some supermarkets are unable to buy enough '+gap(5)+' inside cities for their stores</div><div class="note-row">&bull; Small grocery stores in cities often cannot cope with supermarket '+gap(6)+'</div></div></div><div class="qgroup"><h3>Questions 7-13</h3><p><i>Do the following statements agree with the information given in the passage? Write <b>TRUE / FALSE / NOT GIVEN</b>.</i></p>'+tf(7,'A group of professional researchers are in charge of the Brooklyn project.')+tf(8,'The Brooklyn project team carries out their assessment of stores without the owner’s knowledge.')+tf(9,'The Brooklyn project has experienced technical difficulties setting up the website.')+tf(10,'The city government has taken a considerable interest in the Brooklyn project website.')+tf(11,'Michele Ver Ploeg believes the Brooklyn project website should contain additional information.')+tf(12,'The rate of internet use in Brooklyn is unlikely to increase in the near future.')+tf(13,'Jeffrey Heehs would like more people to assist with the Brooklyn project research.')+'</div>';
if(p===2)return '<div class="qgroup"><h3>Questions 14-20</h3><p><i>Reading Passage 2 has eight sections, A–H. Which section contains the following information?</i></p><p><b><i>NB</i></b> <i>You may use any letter more than once.</i></p>'+sel(14,'a description of a barrier designed to stop dingoes, which also divides two kinds of non-native animals',['A','B','C','D','E','F','G','H'])+sel(15,'how dingoes ensure that rival species do not dominate',['A','B','C','D','E','F','G','H'])+sel(16,'a reference to a widespread non-native species that other animals feed on',['A','B','C','D','E','F','G','H'])+sel(17,'a mention of the dingo’s arrival in Australia',['A','B','C','D','E','F','G','H'])+sel(18,'research which has proved that dingoes have resorted to eating young livestock',['A','B','C','D','E','F','G','H'])+sel(19,'a description of a method used to kill dingoes',['A','B','C','D','E','F','G','H'])+sel(20,'the way that the structure of dingo groups affects how quickly their numbers grow',['A','B','C','D','E','F','G','H'])+'</div><div class="qgroup"><h3>Questions 21-23</h3><p>Look at the following statements and the list of people below. Match each statement with the correct person.</p><div class="box"><b>A</b> Stuart McKechnie<br><b>B</b> Chris Johnson<br><b>C</b> Lee Allen<br><b>D</b> Mark Clifford</div>'+sel(21,'Dingoes tend to hunt native animals rather than hunting other non-native predators.',['A','B','C','D'])+sel(22,'The presence of dingoes puts the income of some people at risk.',['A','B','C','D'])+sel(23,'Dingoes have had little impact on the dying out of animal species in Australia.',['A','B','C','D'])+'</div><div class="qgroup"><h3>Questions 24-26</h3><p><i>Complete the sentences below. Choose <b>NO MORE THAN TWO WORDS</b> from the passage for each answer.</i></p><p class="summary-text"><span class="qnum">24</span>The dingo replaced the '+gap(24)+' as the main predatory animal in Australia.</p><p class="summary-text"><span class="qnum">25</span>Foxes and cats are more likely to hunt native animals when there are fewer '+gap(25)+'.</p><p class="summary-text"><span class="qnum">26</span>Australian animals reproduce at a slow rate as a natural way of avoiding '+gap(26)+'.</p></div>';
return '<div class="qgroup"><h3>Questions 27-31</h3><p><i>Do the following statements agree with the claims of the writer? Write <b>YES / NO / NOT GIVEN</b>.</i></p>'+tf(27,'The Pacific islands were uninhabited when migrants arrived by sea from Southeast Asia.',true)+tf(28,'Andrew Sharp was the first person to write about the migration to the islands.',true)+tf(29,'Andrew Sharp believed migratory voyages were based more on luck than skill.',true)+tf(30,'Despite being controversial, Andrew Sharp’s research had positive results.',true)+tf(31,'Edwin Doran disagreed with the findings of Lewis’s research.',true)+'</div><div class="qgroup"><h3>Questions 32-36</h3><p>Choose the correct letter, A, B, C or D.</p>'+mcq(32,'David Lewis’s research was different because',['he observed traditional navigators at work.','he conducted test voyages using his own yacht.','he carried no modern instruments on test voyages.','he spoke the same language as the islanders he sailed with.'])+mcq(33,'What did David Lewis’s research discover about traditional navigators?',['They used the sun and moon to find their position.','They could not sail further than about 1,000 nautical miles.','They knew which direction they were sailing in.','They were able to drift for long distances.'])+mcq(34,'What are we told about Edwin Doran’s research?',['Data were collected after the canoes had returned to land.','Canoe characteristics were recorded using modern instruments.','Research was conducted in the most densely populated regions.','Navigators were not allowed to see the instruments Doran used.'])+mcq(35,'Which of the following did Steven Horvath discover during his research?',['Canoe design was less important than human strength.','New research methods had to be developed for use in canoes.','Navigators became very tired on the longest voyages.','Human energy may have been used to assist sailing canoes.'])+mcq(36,'What is the writer’s opinion of P Wall Garrard’s research?',['He is disappointed it was conducted in the laboratory.','He is impressed by the originality of the techniques used.','He is surprised it was used to help linguists with their research.','He is concerned that the islands studied are long distances apart.'])+'</div><div class="qgroup"><h3>Questions 37-40</h3><p>Complete each sentence with the correct ending, A–F, below.</p><div class="box"><b>A</b> was the variety of experimental techniques used<br><b>B</b> was not of interest to young islanders today<br><b>C</b> was not conclusive evidence in support of a single theory<br><b>D</b> was being able to change their practices when necessary<br><b>E</b> was the first time humans intentionally crossed an ocean<br><b>F</b> was the speed with which it was conducted</div>'+sel(37,'One limitation in the information produced by all of this research is that it',['A','B','C','D','E','F'])+sel(38,'The best thing about this type of research',['A','B','C','D','E','F'])+sel(39,'The most important achievement of traditional navigators',['A','B','C','D','E','F'])+sel(40,'The migration of people from Asia to the Pacific',['A','B','C','D','E','F'])+'</div>';
}

function render(){partTitle.textContent='Part '+active;var r=ranges[active];partSub.textContent='Read the text and answer questions '+r[0]+'-'+r[1]+'.';left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();drawFooter();left.scrollTop=right.scrollTop=0}
function val(n){if(multiGroups[n]){var boxes=document.querySelectorAll('input[name="'+multiGroups[n]+'"]:checked');return Array.from(boxes).map(b=>b.value).join(',')}var g=document.getElementById('gap'+n);if(g)return g.value;var s=document.getElementById('sel'+n);if(s)return s.value;var r=document.querySelector('input[name="q'+n+'"]:checked');return r?r.value:''}
function save(){for(var n=1;n<=40;n++){var v=val(n);if(v)state[n]=v}}
function restore(){for(var n=1;n<=40;n++){if(!state[n])continue;if(multiGroups[n]){var vals=state[n].split(',');vals.forEach(function(v){var cb=document.querySelector('input[name="'+multiGroups[n]+'"][value="'+v+'"]');if(cb)cb.checked=true});continue}var g=document.getElementById('gap'+n);if(g)g.value=state[n];var s=document.getElementById('sel'+n);if(s)s.value=state[n];var r=document.querySelector('input[name="q'+n+'"][value="'+state[n]+'"]');if(r)r.checked=true}}
function answered(n){return !!state[n]||!!val(n)}
function count(p){var r=ranges[p],c=0;for(var i=r[0];i<=r[1];i++)if(answered(i))c++;return c}
function drawFooter(){save();var h='';[1,2,3].forEach(p=>{var r=ranges[p];h+='<div class="partnav"><button class="partlabel" data-part="'+p+'">Part '+p+'</button>';if(p===active){h+='<div class="tiles">';for(var n=r[0];n<=r[1];n++)h+='<button class="tile '+(answered(n)?'answered':'')+'" data-q="'+n+'">'+n+'</button>';h+='</div>'}else h+='<span class="count">'+count(p)+' of '+(r[1]-r[0]+1)+'</span>';h+='</div>'});h+='<button class="review" id="review">OK</button>';footer.innerHTML=h}
document.addEventListener('change',()=>{save();drawFooter()});document.addEventListener('input',()=>{save();drawFooter()});
var lastScore=null;
function renderActive(){left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();if(graded){regradeCurrent();right.insertAdjacentHTML('afterbegin','<div class="score">Your score: <b>'+lastScore+' / 40</b></div><p style="margin:-8px 0 18px;color:#555">Explanations with the exact location in the passage are shown below each answer. Switch Part 1/2/3 tabs to review the rest.</p>')}drawFooter();left.scrollTop=right.scrollTop=0}
footer.onclick=e=>{var p=e.target.closest('[data-part]');if(p){save();active=+p.dataset.part;renderActive();return}var q=e.target.closest('[data-q]');if(q){var n=+q.dataset.q;(document.getElementById('q'+n)||document.getElementById('gap'+n)||document.getElementById('sel'+n))?.scrollIntoView({behavior:'smooth',block:'center'});return}if(e.target.closest('#review'))review()};
function review(){save();var a=0;for(var n=1;n<=40;n++)if(answered(n))a++;subwrap.innerHTML='<p>You have answered <b>'+a+'</b> of 40 questions.</p><p><button class="ovrow submit" id="final">Submit test</button></p>';final.onclick=grade;submit.classList.add('show')}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function correct(n,v){if(multiGroups[n]){var parts=(v||'').split(',').map(norm).filter(Boolean);return parts.includes(norm(answers[n]))}return [answers[n]].concat(alt[n]||[]).some(a=>norm(a)===norm(v))}
function explHTML(n){var e=EXPL[n];if(!e)return '';return '<div class="expl"><b>Q'+n+' — correct answer: '+answers[n]+'</b> &nbsp;<span class="expl-loc">('+e.loc+')</span><br>'+e.text+'</div>'}
function markGap(n){var x=document.getElementById('gap'+n);if(!x)return;var ok=correct(n,x.value);x.disabled=true;x.classList.add(ok?'ok':'no');x.insertAdjacentHTML('afterend',(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>')+explHTML(n));return ok}
function markSel(n){var s=document.getElementById('sel'+n);if(!s)return;var ok=correct(n,s.value);s.disabled=true;s.classList.add(ok?'ok':'no');var row=document.getElementById('q'+n);var tag=(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>');if(row){row.insertAdjacentHTML('beforeend',tag);row.insertAdjacentHTML('afterend',explHTML(n))}else{s.insertAdjacentHTML('afterend',tag);var host=s.closest('p')||s;host.insertAdjacentHTML('afterend',explHTML(n))}return ok}
function markRadio(n){var r=document.querySelector('input[name="q'+n+'"]:checked');var ok=r&&correct(n,r.value);document.querySelectorAll('input[name="q'+n+'"]').forEach(i=>i.disabled=true);var box=document.getElementById('q'+n);box.insertAdjacentHTML('beforeend',(ok?'<span class="tag ok">\u2713</span>':'<span class="tag no">\u2718 correct: '+answers[n]+'</span>'));box.insertAdjacentHTML('afterend',explHTML(n));return ok}
function markMulti(group){var qNums=groupQNums[group];var boxes=document.querySelectorAll('input[name="'+group+'"]');var checkedVals=Array.from(boxes).filter(function(b){return b.checked}).map(function(b){return b.value});boxes.forEach(function(b){b.disabled=true});var container=document.getElementById('q_'+group);var tagHtml='';qNums.forEach(function(qn){var ok=checkedVals.includes(answers[qn]);tagHtml+=' '+(ok?'<span class="tag ok">Q'+qn+' \u2713</span>':'<span class="tag no">Q'+qn+' \u2718 correct: '+answers[qn]+'</span>')});container.insertAdjacentHTML('beforeend','<div style="margin-top:8px;">'+tagHtml+'</div>');var explAll='';qNums.forEach(function(qn){explAll+=explHTML(qn)});container.insertAdjacentHTML('afterend',explAll)}
function regradeCurrent(){var r=ranges[active];var doneGroups={};for(var n=r[0];n<=r[1];n++){if(multiGroups[n]){if(!doneGroups[multiGroups[n]]){markMulti(multiGroups[n]);doneGroups[multiGroups[n]]=true}continue}var g=document.getElementById('gap'+n),s=document.getElementById('sel'+n),rad=document.querySelector('input[name="q'+n+'"]');if(g)markGap(n);else if(s)markSel(n);else if(rad)markRadio(n)}}
function grade(){if(graded)return;save();var score=0;for(var n=1;n<=40;n++)if(correct(n,state[n]||''))score++;lastScore=score;graded=true;active=1;renderActive();submit.classList.remove('show')}
var drag=false;div.onmousedown=()=>{drag=true;document.body.style.userSelect='none'};window.onmouseup=()=>{drag=false;document.body.style.userSelect=''};window.onmousemove=e=>{if(!drag)return;var r=split.getBoundingClientRect();left.style.width=Math.max(220,Math.min(r.width-240,e.clientX-r.left))+'px'};
split.onmouseup=()=>setTimeout(()=>{var s=getSelection();if(!s||s.isCollapsed||!s.rangeCount){tools.style.display='none';return}var rg=s.getRangeAt(0);if(!split.contains(rg.commonAncestorContainer)){tools.style.display='none';return}var rc=rg.getBoundingClientRect();tools.style.display='flex';tools.style.left=(rc.left+scrollX)+'px';tools.style.top=Math.max(8,rc.top+scrollY-42)+'px'},1);
tools.onclick=e=>{var b=e.target.closest('button'),s=getSelection();if(!b||!s.rangeCount)return;var rg=s.getRangeAt(0);if(b.dataset.act==='hl'){try{var sp=document.createElement('span');sp.className='hl';rg.surroundContents(sp)}catch(_){document.execCommand('hiliteColor',false,'#ffe45c')}}else document.querySelectorAll('.hl').forEach(h=>h.replaceWith(document.createTextNode(h.textContent)));s.removeAllRanges();tools.style.display='none'};
render();
})();
</script></body></html>
