var DATA = {"passages": {"1": "<h1>Mungo Lady and Mungo Man</h1>\n<p class=\"sub\">Controversies in Australian Prehistory</p>\n<p>Fifty thousand years ago, a lush landscape greeted the first Australians moving towards the south-east of the continent. Temperatures were cooler than now. Megafauna – giant prehistoric animals such as marsupial lions and the rhinoceros-sized diprotodon – were abundant. Freshwater lakes in areas of western New South Wales (NSW) were brimming with fish. But change was coming. By 40,000 years ago, water levels had started to drop.</p>\n<p>A study of the sediments and graves of Lake Mungo, a dry lake bed in western NSW, has uncovered the muddy layers deposited as the lake began to dry up. Forty thousand years ago, families took refuge at the lake from the encroaching desert, leaving artefacts such as stone tools, which researchers used to determine that the first wanderers came to the area between 46,000 and 50,000 years ago. By 20,000 years ago, the lake had become the dry, dusty hole it is today. This area was first examined by the University of Melbourne geologist Professor Jim Bowler in 1969. He was searching for ancient lakes and came across the remains of a woman who had been buried with some ceremony; she was given the name 'Mungo Lady'. In 1974, he found a second set of remains, Mungo Man, buried 300 meters away. Bowler's comprehensive study of different sediment layers has concluded that both graves are 40,000 years old.</p>\n<p>This is much younger than the 62,000 years Mungo Man was attributed with in 1999 by a team led by Professor Alan Thorne, of the Australian National University. Thorne is the country's leading opponent of the 'Out of Africa' theory – that modern humans spread around the globe from Africa about 100,000 years ago. The revision of Mungo Man's age has refocused attention on academic disputes about mankind's origins.</p>\n<p>The arrival date of these early Australians is linked to another vexed question: the reason for the disappearance of the megafauna. Dr Tim Flannery, a proponent of the controversial theory that these animals were wiped out by the extreme hunting practices of humans, claims that the new Mungo dates support this view. For Bowler, however, these debates are speculative distractions. At 40,000 years old, he argues, Mungo Man and Mungo Lady remain Australia's oldest human burials and the earliest evidence on Earth of cultural sophistication. 'At Lake Mungo, we have a cameo of people reacting to environmental change. It is one of the great stories of the people of the world.'</p>\n<p>Two rival groups of researchers have each attacked the techniques used by the other to ascertain the date of Mungo Man. In the 1999 study, Thorne's team used three techniques to date Mungo Man – bone, tooth enamel and sand. Bowler has strongly challenged the results ever since. Dating human bones is 'notoriously unreliable', he says. In addition, the sand sample used by Thorne's group was taken hundreds of meters from the burial site. Bowler has stated that it is not difficult 'to realize that the age of sand is not the same as the age of the grave'. He says his team's results are based on careful fieldwork, crosschecked between four laboratories, while Thorne's team misinterpreted the evidence, 'locked in a laboratory in Canberra'. Thorne counters that Bowler's team used one dating technique, while his used three. Best practice is to have at least two methods producing the same result. A Thorne team member, Professor Rainer Grün, says the fact that the latest results were consistent between laboratories doesn't mean they are correct. 'We now have two data sets that are contradictory. I do not have a plausible explanation.'</p>\n<p>Thorne recently made headlines with a study of Mungo Man's DNA, which he claimed supported his idea that modern humans developed from archaic humans in several places around the world, rather than emerging from Africa a relatively short time ago. Now, however, Thorne says the age of Mungo Man is irrelevant. Recent fossil finds show that modern humans were in China 110,000 years ago. 'So, he has a long time to arrive in Australia. It doesn't matter if he is 40,000 or 60,000 years old.'</p>\n<p>In 2001, a member of Bowler's team, Dr Richard Roberts of Wollongong University, along with Flannery, Director of the South Australian Museum, published research on the extinction of the megafauna. They dated 28 sites across the continent, arguing that their analysis showed that the megafauna died out suddenly 46,600 years ago. This conclusion has been challenged by other scientists, including Dr Judith Field of the University of Sydney and Dr Richard Fullager of the Australian Museum, who point to the presence of megafauna fossils at the 36,000-year-old Cuddie Springs site in NSW.</p>\n<p>Flannery praises the Bowler team's research as thorough and rigorous. He says the finding that humans arrived at Lake Mungo between 46,000 and 50,000 years ago supports the idea that that was a critical time in Australia's history. There is no evidence of a dramatic climate change at that time, he says. 'It's my view that humans arrived and megafauna extinction took place in almost the same geological instant.' Bowler, however, is sceptical of Flannery's theory about the disappearance of the giant animals. He argues that climate change 40,000 years ago was more intense than has been previously realized and could have played an important role in their extinction.</p>", "2": "<h1>Achieving a Work–life Balance</h1>\n<p class=\"sub\">Research suggests that working fewer hours may be beneficial</p>\n<div class=\"para\">A</div>\n<p>Anthropologists calculate that in the Stone Age, approximately one to two million years ago, the ancestors of modern humans worked on average two or three hours a day hunting and gathering food. This amount of labor was all that was necessary for survival. Today, it's not uncommon to work 50–60 hours a week, and sometimes more. At the same time, there is a substantial body of international research showing that levels of work-related stress have never been higher. However, psychologist Dr Gina McDowell argues that the problem of stress caused by working too many hours still doesn't receive sufficient recognition and ought to be addressed with greater commitment by executives, employees and academics. Dr McDowell is one of many calling for a better work–life balance: spending an appropriate amount of time at work, but leaving sufficient hours in the day to enjoy family, friends and recreations.</p>\n<div class=\"para\">B</div>\n<p>Perhaps leading the search for work–life balance are technology companies, who frequently allow employees greater flexibility in everything from working hours and dress code to office design. Global tech giant MEdia operates what it calls the '20% scheme': its engineers are free to use 20% of their working week (one full day) in any way they want. Ryan Schmidt, the director of human resources at MEdia, says that 'Productivity in the economy generally has increased significantly over the last 50 years but there's a common perception in the workforce that standards of living have not kept pace. Our company intends to turn that around.' Business analyst Carla Deng has made a study of MEdia's 20% scheme and says the results are overwhelmingly positive, says Deng. 'Our research found that when employees have greater individual choice and responsibility for their work time, they still devote some of those \"free\" hours to fulfilling their normal working roles. And they also feel a lot happier.'</p>\n<div class=\"para\">C</div>\n<p>An alternative approach taken by some other American companies is the four-day week. Ordinarily, Americans work eight hours a day, five days a week, making 40 hours in total. In a four-day week, they work four 10-hour days instead, still completing 40 hours in total but having three days off. In general, several studies have shown benefits, including reduced stress, increased productivity and more fulfilled employees. However, there may also be downsides, according to Dean Hazel, a professor of economics. For example, customers may expect a certain employee to be present five days a week and feel disappointed when they are not available. 'The truth is that such a four-day week has many attractions but it will not be appropriate in every instance,' says Professor Hazel. 'It depends very much on the company concerned, its size, internal structure and the nature of its relationships with customers, partners and suppliers.'</p>\n<div class=\"para\">D</div>\n<p>Indeed, some commentators question the very idea of work–life balance. Faisal Hadi, a lecturer in sociology, argues that the term work–life balance implies that the two represent distinct aspects of life that are easily separable. But in fact, for many of us 'work' and 'life' intrude on each other all the time and trying to 'balance' them precisely represents a goal that can never be achieved. 'This term work–life balance has become a cliché,' says Hadi. 'In reality, life is an intricate mix of work and leisure and the relationship between the two has so many strands that they cannot be neatly divided. The idea of work–life balance as it is often understood has limited value.'</p>\n<div class=\"para\">E</div>\n<p>However, a recent experiment has certainly challenged this idea. Employees at the New Zealand company involved worked four eight-hour days a week, but were paid for five. The experiment was conducted at Certified Life, a firm which has sold insurance for more than six decades. At the end of the experiment, 78% of employees felt they were able to manage their work–life balance, up from 54%, when working a standard 40-hour week. The 240 employees at Certified Life completed surveys at the beginning and end of the experiment to provide information for the study. The employees themselves worked out how all the necessary tasks could be completed within deadlines while working fewer hours, and were then responsible for implementing those decisions. Lead researcher Dr Hannah Graham says that the experiment produced such positive results partly because employees were given a role in decision-making throughout it.</p>\n<div class=\"para\">F</div>\n<p>The New Zealand experiment also showed a 7% drop in stress levels when working fewer hours, without any drop in productivity. The chief executive of Certified Life, Tane Robinson, says that the four-day week boosted the firm's reputation and made it easier to retain staff who might otherwise have moved on. Furthermore, cooperation between employees was seen to improve significantly when working shorter hours and team cohesion was significantly enhanced, according to the supervisors. Quite apart from the benefits at Certified Life, Dr Graham also suggests that such schemes might also address the issue of congestion in major cities by restricting the numbers going to work each day. Roland Gillespie, workplace relations minister in the New Zealand government, described the findings as 'enormously encouraging' and said that he was keen to see businesses experiment with similar new and improved work models. Meanwhile, Certified Life has plans to see the four-day week implemented long term. It may become an initiative that is replicated in other companies.</p>", "3": "<h1>The lost animals of Australia</h1>\n<p>The history of Australia's animals over the past 50,000 years has been largely one of extinction. The time has been too short for new species of large animals to evolve and, over this period, nearly one-third of Australia's mammal species have become extinct, along with nearly all the large reptiles and many of the flightless birds. The cause of these extinctions is still hotly debated. One school of thought suggests that humans caused the extinctions, and another that they were due to changes in climate. The greatest problem in evaluating these theories is that we do not know exactly when these animals became extinct. Fossils from a number of well-dated cave and lakeside sites suggest that all the now-extinct species had already vanished 35,000 years ago, but a few other sites suggest that giant marsupials might have survived until 25,000 years ago, or even as late as 6,000 years ago.</p>\n<p>One certainty is that Australia's climate has changed greatly over the past 40,000 years. Between 25,000 and 15,000 years ago, the sea level dropped by more than 100 meters and the continent experienced an extremely arid phase. Clearly, the timing of the extinctions is of critical importance. If they can be shown to coincide with the arrival of humans, about 50,000 years ago, then circumstantial evidence would point to humans as the cause. If, however, the giant marsupials survived until 25,000 years ago, the increased aridity would seem to be the more likely cause.</p>\n<p>Before these extinctions, Australia was a very different place. Naturally occurring fires were probably less frequent than they are now, because large marsupial herbivores (of which there were about forty species) reduced the standing crop of vegetation.</p>\n<p>Rainforest plants were widespread in the parts of Australia which are now very dry. The largest marsupial species was the diprotodon, which, like other Australian marsupial giants, was about one-third the weight of its ecological equivalent elsewhere. It probably weighed between 1,000 and 2,000 kilograms, while the elephant of Afro-Asia weighed about 5,000 kilograms. The relatively small size of the Australian marsupial giants has been attributed to Australia's extraordinarily poor soils and erratic climate, both factors which typically limit plant growth.</p>\n<p>Judging by the teeth of extinct species, there were many specialist grazers and browsers, paralleling the great mammal communities of Africa today. But the Australian carnivores were very different to their African equivalents. For example, the Australian marsupial lion was only about the size of a leopard; there was no equivalent of the large group of cat and dog-like carnivores of Africa. The marsupial lion was Australia's only cat-like species; there was one dog-like species, the thylacine, which vanished from mainland Australia about 3,000 years ago, but seems to have survived on the Australian island of Tasmania until the 1930s, and one scavenger/carnivore, the Tasmanian devil. The larger Australian carnivores were all reptiles. The largest of these, the gigantic snakes of the genus Wonambi were more than 8 meters long, and together with the 7-meter goanna and the 3-metre land crocodile, were the main predators. There were never vast numbers of most species. Large, warm-blooded creatures were at a disadvantage, their prey being limited by the nature of the soil and the climate. The cold-blooded reptilian carnivores, which required less energy, were therefore able to dominate.</p>\n<p>There is strong evidence to support the theory that humans were responsible for the decline of large animals in Australia. In their Afro-Eurasian homeland, humans were medium-sized members of a very large community of carnivores and omnivores. But by 40,000 years ago, they were taking a very broad range of prey, including mammals much larger than themselves. Studies have shown that when humans or other predators arrive in areas where there have previously been no ecologically equivalent species, they invariably have a profound impact. For example, over the past 1,000 years Polynesians in Hawaii have destroyed more than 70% of the bird species, and during the 1800s, hunters on islands close to Antarctica severely depleted many seal species.</p>\n<p>Australian animals were particularly vulnerable to the impact of humans. Marsupial herbivores were adapted only to avoiding predation by large but relatively unintelligent reptiles, while humans are the most efficient predators that have ever existed. From the mountain rainforests to the desert center, extinctions emptied landscape after landscape, until finally the largest surviving mammals were humans themselves. Medium-sized animal species weighing between 10 and 100 kilograms either also became extinct or became smaller over thousands of years. Grey kangaroos are now only half the size they once were, while koalas and Tasmanian devils weigh, on average, one-third less than they once did.</p>\n<p>In general, in Australia, the larger the species, the more it has reduced in size, with the exception of humans and wombats; the latter may have been protected by their burrowing habits. This shrinking may also be attributable to human hunting practices. If hunters claimed the largest individuals of these species, fast-maturing small specimens would have been more likely to survive to maturity. Increasingly, they would have produced smaller offspring. Only the smallest mammals, those weighing less than 10 kilograms, survived unaltered, although some may have been restricted to a smaller number of areas. This extinction pattern changed with the arrival of Europeans towards the end of the 18th century. As a result of this, a large number of smaller species also became extinct over the course of the following century, together with 21 medium-seed mammals and one large mammal species.</p>"}, "answers": {"1": "B", "2": "E", "3": "C", "4": "D", "5": "B", "6": "F", "7": "A", "8": "A", "9": "TRUE", "10": "NOT GIVEN", "11": "FALSE", "12": "TRUE", "13": "TRUE", "14": "C", "15": "A", "16": "F", "17": "B", "18": "D", "19": "F", "20": "B", "21": "A", "22": "E", "23": "insurance", "24": "surveys", "25": "supervisors", "26": "congestion", "27": "C", "28": "A", "29": "C", "30": "C", "31": "A", "32": "C", "33": "A", "34": "F", "35": "E", "36": "D", "37": "NO", "38": "NOT GIVEN", "39": "YES", "40": "YES"}, "alt": {}, "expl": {"1": {"loc": "Para 6 (Thorne's DNA study)", "text": "Thorne 'claimed supported his idea that modern humans developed from archaic humans in several places around the world' → B, Alan Thorne."}, "2": {"loc": "Para 7 (Roberts & Flannery, 2001)", "text": "'their analysis showed that the megafauna died out suddenly 46,600 years ago' → E, Richard Roberts and Tim Flannery."}, "3": {"loc": "Para 4", "text": "'Dr Tim Flannery, a proponent of the controversial theory that these animals were wiped out by the extreme hunting practices of humans' → C, Tim Flannery."}, "4": {"loc": "Para 5 (Rainer Grün)", "text": "'the fact that the latest results were consistent between laboratories doesn't mean they are correct' → D, Rainer Grün."}, "5": {"loc": "Para 6", "text": "'Thorne says the age of Mungo Man is irrelevant... It doesn't matter if he is 40,000 or 60,000 years old' → B, Alan Thorne."}, "6": {"loc": "Para 7", "text": "Field and Fullager 'point to the presence of megafauna fossils at the 36,000-year-old Cuddie Springs site' — challenging the sudden-extinction claim → F."}, "7": {"loc": "Final paragraph", "text": "Bowler 'argues that climate change 40,000 years ago was more intense than has been previously realized' → A, Jim Bowler."}, "8": {"loc": "Para 4", "text": "Bowler: Mungo Man and Lady are 'the earliest evidence on Earth of cultural sophistication' → A, Jim Bowler."}, "9": {"loc": "Para 2", "text": "'leaving artefacts such as stone tools, which researchers used to determine that the first wanderers came to the area' → TRUE."}, "10": {"loc": "Para 2", "text": "Only 'stone tools' are mentioned, not weapons specifically → NOT GIVEN."}, "11": {"loc": "Para 3 & 5", "text": "Bowler dates the graves at 40,000 years; Thorne's 1999 study attributed 62,000 years — clear disagreement → FALSE."}, "12": {"loc": "Para 5", "text": "'Thorne's team used three techniques to date Mungo Man – bone, tooth enamel and sand' → TRUE."}, "13": {"loc": "Para 5", "text": "'Bowler has strongly challenged the results ever since. Dating human bones is “notoriously unreliable”, he says' → TRUE."}, "14": {"loc": "Paragraph C", "text": "Professor Hazel: 'it will not be appropriate in every instance... depends very much on the company concerned' → C."}, "15": {"loc": "Paragraph A", "text": "'ancestors of modern humans worked on average two or three hours a day' → A."}, "16": {"loc": "Paragraph F", "text": "'Roland Gillespie, workplace relations minister... keen to see businesses experiment with similar new and improved work models' → F."}, "17": {"loc": "Paragraph B", "text": "Ryan Schmidt: 'Productivity... has increased significantly... but... standards of living have not kept pace' → B."}, "18": {"loc": "Paragraph D, Faisal Hadi", "text": "'This term work–life balance has become a cliché... cannot be neatly divided' → D."}, "19": {"loc": "Paragraph F, Tane Robinson", "text": "'the four-day week boosted the firm's reputation and made it easier to retain staff' → F."}, "20": {"loc": "Paragraph B, Carla Deng", "text": "'when employees have greater individual choice... they still devote some of those “free” hours to fulfilling their normal working roles' → B."}, "21": {"loc": "Paragraph A, Dr Gina McDowell", "text": "'the problem of stress caused by working too many hours still doesn't receive sufficient recognition and ought to be addressed with greater commitment' → A."}, "22": {"loc": "Paragraph E, Dr Hannah Graham", "text": "'the experiment produced such positive results partly because employees were given a role in decision-making throughout it' → E."}, "23": {"loc": "Paragraph E", "text": "'Certified Life, a firm which has sold insurance for more than six decades' → 'insurance'."}, "24": {"loc": "Paragraph E", "text": "'employees at Certified Life completed surveys at the beginning and end of the experiment' → 'surveys'."}, "25": {"loc": "Paragraph F", "text": "'team cohesion was significantly enhanced, according to the supervisors' → 'supervisors'."}, "26": {"loc": "Paragraph F", "text": "'such schemes might also address the issue of congestion in major cities' → 'congestion'."}, "27": {"loc": "Para 1", "text": "Fossil evidence gives conflicting extinction dates (35,000 / 25,000 / 6,000 years ago) → C, the evidence is somewhat contradictory."}, "28": {"loc": "Para 4", "text": "'attributed to Australia's extraordinarily poor soils and erratic climate, both factors which typically limit plant growth' → A, insufficient food supply."}, "29": {"loc": "Para 5", "text": "'The cold-blooded reptilian carnivores, which required less energy, were therefore able to dominate' → C, reptiles more suited to the environment."}, "30": {"loc": "Para 7", "text": "'Marsupial herbivores were adapted only to avoiding predation by large but relatively unintelligent reptiles, while humans are the most efficient predators that have ever existed' → C."}, "31": {"loc": "Para 8", "text": "'the larger the species, the more it has reduced in size, with the exception of humans and wombats' → A, size has remained the same."}, "32": {"loc": "Para 8", "text": "'If hunters claimed the largest individuals of these species... they would have produced smaller offspring' → C, bigger examples were killed."}, "33": {"loc": "Para 1", "text": "'The time has been too short for new species of large animals to evolve' → A."}, "34": {"loc": "Para 1–2", "text": "'the timing of the extinctions is of critical importance' yet remains debated → F, a crucial factor yet to be resolved."}, "35": {"loc": "Para 3", "text": "'Naturally occurring fires were probably less frequent... because large marsupial herbivores... reduced the standing crop of vegetation' → E."}, "36": {"loc": "Para 6", "text": "'when humans or other predators arrive in areas where there have previously been no ecologically equivalent species, they invariably have a profound impact' → D."}, "37": {"loc": "Para 1", "text": "Extinctions included 'nearly all the large reptiles and many of the flightless birds' too, not just giant mammals → NO."}, "38": {"loc": "Para 1–2", "text": "The passage discusses an arid phase and sea-level drop 25,000–15,000 years ago, but does not mention cooling specifically 50,000 years ago → NOT GIVEN."}, "39": {"loc": "Para 5", "text": "'The larger Australian carnivores were all reptiles. The largest of these, the gigantic snakes of the genus Wonambi were more than 8 metres long' → YES."}, "40": {"loc": "Final paragraph", "text": "'a large number of smaller species also became extinct over the course of the following century' after Europeans arrived → YES."}}};

function tf(n,t,yn){var opts=yn?['YES','NO','NOT GIVEN']:['TRUE','FALSE','NOT GIVEN'];return '<div class="tf-row" id="q'+n+'"><div class="statement"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="options">'+opts.map(o=>'<label><input type="radio" name="q'+n+'" value="'+o+'"> '+o+'</label>').join('')+'</div></div>'}
function gap(n){return '<span class="qnum">'+n+'</span><input class="gap" id="gap'+n+'">'}
function sel(n,t,letters){return '<div class="row" id="q'+n+'"><span class="qnum">'+n+'</span><span class="txt">'+t+'</span><select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select></div>'}
function mcq(n,t,opts){return '<div class="mcq" id="q'+n+'"><div class="prompt"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="choice-options">'+opts.map((o,i)=>'<label class="choice-option"><input type="radio" name="q'+n+'" value="'+'ABCD'[i]+'"> <b>'+'ABCD'[i]+'</b> '+o+'</label>').join('')+'</div></div>'}
function qhtml(p){
if(p===1)return '<div class="qgroup"><h3>Questions 1-8</h3><p>Look at the following theories and the list of researchers below. Match each theory with the correct researcher(s).</p><p><b><i>NB</i></b> <i>You may use any letter more than once.</i></p><div class="box"><b>A</b> Jim Bowler<br><b>B</b> Alan Thorne<br><b>C</b> Tim Flannery<br><b>D</b> Rainer Grün<br><b>E</b> Richard Roberts and Tim Flannery<br><b>F</b> Judith Field and Richard Fullager</div>'+sel(1,'Our human ancestors did not originate in only one area.',['A','B','C','D','E','F'])+sel(2,'The extinction of the megafauna happened within a brief period.',['A','B','C','D','E','F'])+sel(3,'The megafauna died out as a result of human activity.',['A','B','C','D','E','F'])+sel(4,'The similarity of results does not always guarantee their validity.',['A','B','C','D','E','F'])+sel(5,'How old Mungo Man is, is unimportant.',['A','B','C','D','E','F'])+sel(6,'There is evidence to disprove the theory of mass megafauna extinction.',['A','B','C','D','E','F'])+sel(7,'An extreme environmental change occurred at the time that humans first moved into the Lake Mungo area.',['A','B','C','D','E','F'])+sel(8,'The earliest evidence of advanced human culture is found in Australia.',['A','B','C','D','E','F'])+'</div><div class="qgroup"><h3>Questions 9-13</h3><p><i>Do the following statements agree with the information given in the passage? Write <b>TRUE / FALSE / NOT GIVEN</b>.</i></p>'+tf(9,'Objects found in the Lake Mungo area were used to date the arrival of humans.')+tf(10,'Ancient weapons were found in the Lake Mungo area.')+tf(11,'Scientists agree about the age of Mungo Man.')+tf(12,'Thorne’s research involved analyzing more than one material.')+tf(13,'Bowler has criticized the research methods used by Thorne.')+'</div>';
if(p===2)return '<div class="qgroup"><h3>Questions 14-17</h3><p>The text has six paragraphs, A–F. Which paragraph contains the following information?</p>'+sel(14,'The claim that one workplace initiative may not be suitable for all businesses.',['A','B','C','D','E','F'])+sel(15,'An estimate of how much time ancient humans spent working.',['A','B','C','D','E','F'])+sel(16,'A reference to a politician who is interested in changing the way people’s working lives are organized.',['A','B','C','D','E','F'])+sel(17,'The claim that today people are working harder but feel that their lives have not improved.',['A','B','C','D','E','F'])+'</div><div class="qgroup"><h3>Questions 18-22</h3><p>Choose the correct person for each statement.</p><div class="box"><b>A</b> Dr Gina McDowell<br><b>B</b> Carla Deng<br><b>C</b> Ryan Schmidt<br><b>D</b> Faisal Hadi<br><b>E</b> Dr Hannah Graham<br><b>F</b> Tane Robinson</div>'+sel(18,'One expression that is commonly used today may not be helpful because it oversimplifies a complicated situation.',['A','B','C','D','E','F'])+sel(19,'After the experiment people had a higher opinion of the business and staff were happy to continue working for us.',['A','B','C','D','E','F'])+sel(20,'Evidence shows that workers who are given more personal time actually spend some of that time on activities that benefit the company.',['A','B','C','D','E','F'])+sel(21,'Over-working is a more significant issue than is sometimes realized and should be taken more seriously by those involved.',['A','B','C','D','E','F'])+sel(22,'Involving staff at every stage of organizing the trial was one of the reasons for its success.',['A','B','C','D','E','F'])+'</div><div class="qgroup"><h3>Questions 23-26</h3><p><i>Answer the questions. Write <b>ONE WORD ONLY</b> from the text in each gap.</i></p><p class="summary-text"><span class="qnum">23</span>What service was provided by the company in the New Zealand experiment? '+gap(23)+'</p><p class="summary-text"><span class="qnum">24</span>What research method was used to gather data in the New Zealand experiment? '+gap(24)+'</p><p class="summary-text"><span class="qnum">25</span>Which group of people reported that staff worked together more closely during the New Zealand experiment? '+gap(25)+'</p><p class="summary-text"><span class="qnum">26</span>According to Dr Graham, what problem outside the workplace might be addressed by working shorter hours? '+gap(26)+'</p></div>';
return '<div class="qgroup"><h3>Questions 27-32</h3><p>Choose the correct letter, A, B, C or D.</p>'+mcq(27,'The writer states that it is difficult to decide why prehistoric Australian animals became extinct because',['relevant fossils are scarce.','fossil evidence has been destroyed.','the evidence is somewhat contradictory.','there has not been enough time to carry out research.'])+mcq(28,'The writer suggests that Australia’s larger mammals were smaller than those of Africa and Asia because',['there was an insufficient supply of food.','the country was covered with thick forest.','smaller animals escaped predators more easily.','they had difficulty digesting the available food.'])+mcq(29,'According to the writer, large Australian carnivores were mostly reptiles because',['mammals were less skillful at hunting.','reptiles had faster breeding rates.','reptiles were more suited to the environment.','mammals had to compete for territory.'])+mcq(30,'According to the writer, the effect of the first humans in Australia was particularly great because Australian animals',['were slow and awkward.','had skins that could be used for several purposes.','had little experience in escaping from such skillful hunters.','were attracted towards human settlements because of the food available there.'])+mcq(31,'What, according to the writer, does the wombat have in common with humans?',['Its size has remained the same.','Its diet was similar to the human diet.','It made shelters to protect itself.','It was able to evade reptiles easily.'])+mcq(32,'The writer suggests that Australian mammals have become smaller because',['they were able to live underground.','they were vulnerable to human diseases.','bigger examples of the species were killed.','their territories expanded in size.'])+'</div><div class="qgroup"><h3>Questions 33-36</h3><p>Complete each sentence with the correct ending, A–F, below.</p><div class="box"><b>A</b> is due to the fact that not enough time has passed.<br><b>B</b> is evidenced by the remains of their teeth.<br><b>C</b> is responsible for the disappearance of habitat.<br><b>D</b> is often responsible for a significant number of extinctions.<br><b>E</b> is theoretically based on a large herbivore population.<br><b>F</b> is a crucial factor that has yet to be resolved.</div>'+sel(33,'The failure of a new species of large mammals to evolve',['A','B','C','D','E','F'])+sel(34,'The extinction date of the large Australian animals',['A','B','C','D','E','F'])+sel(35,'A reduction in the number of forest fires',['A','B','C','D','E','F'])+sel(36,'The arrival of humans in a previously uninhabited area',['A','B','C','D','E','F'])+'</div><div class="qgroup"><h3>Questions 37-40</h3><p><i>Do the following statements agree with the claims of the writer? Write <b>YES / NO / NOT GIVEN</b>.</i></p>'+tf(37,'Mass extinction in Australia was limited to giant mammals.',true)+tf(38,'Australia’s climate became cooler about 50,000 years ago.',true)+tf(39,'The wonambi snake was the biggest Australian carnivore.',true)+tf(40,'Europeans caused the extinction of some smaller Australian mammals.',true)+'</div>';
}

function render(){partTitle.textContent='Part '+active;var r=ranges[active];partSub.textContent='Read the text and answer questions '+r[0]+'-'+r[1]+'.';left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();drawFooter();left.scrollTop=right.scrollTop=0}
function val(n){var g=document.getElementById('gap'+n);if(g)return g.value;var s=document.getElementById('sel'+n);if(s)return s.value;var r=document.querySelector('input[name="q'+n+'"]:checked');return r?r.value:''}
function save(){for(var n=1;n<=40;n++){var v=val(n);if(v)state[n]=v}}
function restore(){for(var n=1;n<=40;n++){if(!state[n])continue;var g=document.getElementById('gap'+n);if(g)g.value=state[n];var s=document.getElementById('sel'+n);if(s)s.value=state[n];var r=document.querySelector('input[name="q'+n+'"][value="'+state[n]+'"]');if(r)r.checked=true}}
function answered(n){return !!state[n]||!!val(n)}
function count(p){var r=ranges[p],c=0;for(var i=r[0];i<=r[1];i++)if(answered(i))c++;return c}
function drawFooter(){save();var h='';[1,2,3].forEach(p=>{var r=ranges[p];h+='<div class="partnav"><button class="partlabel" data-part="'+p+'">Part '+p+'</button>';if(p===active){h+='<div class="tiles">';for(var n=r[0];n<=r[1];n++)h+='<button class="tile '+(answered(n)?'answered':'')+'" data-q="'+n+'">'+n+'</button>';h+='</div>'}else h+='<span class="count">'+count(p)+' of '+(r[1]-r[0]+1)+'</span>';h+='</div>'});h+='<button class="review" id="review">OK</button>';footer.innerHTML=h}
document.addEventListener('change',()=>{save();drawFooter()});document.addEventListener('input',()=>{save();drawFooter()});
var lastScore=null;
function renderActive(){left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();if(graded){regradeCurrent();right.insertAdjacentHTML('afterbegin','<div class="score">Your score: <b>'+lastScore+' / 40</b></div><p style="margin:-8px 0 18px;color:#555">Explanations with the exact location in the passage are shown below each answer. Switch Part 1/2/3 tabs to review the rest.</p>')}drawFooter();left.scrollTop=right.scrollTop=0}
footer.onclick=e=>{var p=e.target.closest('[data-part]');if(p){save();active=+p.dataset.part;renderActive();return}var q=e.target.closest('[data-q]');if(q){var n=+q.dataset.q;(document.getElementById('q'+n)||document.getElementById('gap'+n)||document.getElementById('sel'+n))?.scrollIntoView({behavior:'smooth',block:'center'});return}if(e.target.closest('#review'))review()};
function review(){save();var a=0;for(var n=1;n<=40;n++)if(answered(n))a++;subwrap.innerHTML='<p>You have answered <b>'+a+'</b> of 40 questions.</p><p><button class="ovrow submit" id="final">Submit test</button></p>';final.onclick=grade;submit.classList.add('show')}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function correct(n,v){return [answers[n]].concat(alt[n]||[]).some(a=>norm(a)===norm(v))}
function explHTML(n){var e=EXPL[n];if(!e)return '';return '<div class="expl"><b>Q'+n+' — correct answer: '+answers[n]+'</b> &nbsp;<span class="expl-loc">('+e.loc+')</span><br>'+e.text+'</div>'}
function markGap(n){var x=document.getElementById('gap'+n);if(!x)return;var ok=correct(n,x.value);x.disabled=true;x.classList.add(ok?'ok':'no');x.insertAdjacentHTML('afterend',(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>')+explHTML(n));return ok}
function markSel(n){var s=document.getElementById('sel'+n);if(!s)return;var ok=correct(n,s.value);s.disabled=true;s.classList.add(ok?'ok':'no');var row=document.getElementById('q'+n);row.insertAdjacentHTML('beforeend',(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>'));row.insertAdjacentHTML('afterend',explHTML(n));return ok}
function markRadio(n){var r=document.querySelector('input[name="q'+n+'"]:checked');var ok=r&&correct(n,r.value);document.querySelectorAll('input[name="q'+n+'"]').forEach(i=>i.disabled=true);var box=document.getElementById('q'+n);box.insertAdjacentHTML('beforeend',(ok?'<span class="tag ok">\u2713</span>':'<span class="tag no">\u2718 correct: '+answers[n]+'</span>'));box.insertAdjacentHTML('afterend',explHTML(n));return ok}
function regradeCurrent(){var r=ranges[active];for(var n=r[0];n<=r[1];n++){var g=document.getElementById('gap'+n),s=document.getElementById('sel'+n),rad=document.querySelector('input[name="q'+n+'"]');if(g)markGap(n);else if(s)markSel(n);else if(rad)markRadio(n)}}
function grade(){if(graded)return;save();var score=0;for(var n=1;n<=40;n++)if(correct(n,state[n]||''))score++;lastScore=score;graded=true;active=1;renderActive();submit.classList.remove('show')}
var drag=false;div.onmousedown=()=>{drag=true;document.body.style.userSelect='none'};window.onmouseup=()=>{drag=false;document.body.style.userSelect=''};window.onmousemove=e=>{if(!drag)return;var r=split.getBoundingClientRect();left.style.width=Math.max(220,Math.min(r.width-240,e.clientX-r.left))+'px'};
split.onmouseup=()=>setTimeout(()=>{var s=getSelection();if(!s||s.isCollapsed||!s.rangeCount){tools.style.display='none';return}var rg=s.getRangeAt(0);if(!split.contains(rg.commonAncestorContainer)){tools.style.display='none';return}var rc=rg.getBoundingClientRect();tools.style.display='flex';tools.style.left=(rc.left+scrollX)+'px';tools.style.top=Math.max(8,rc.top+scrollY-42)+'px'},1);
tools.onclick=e=>{var b=e.target.closest('button'),s=getSelection();if(!b||!s.rangeCount)return;var rg=s.getRangeAt(0);if(b.dataset.act==='hl'){try{var sp=document.createElement('span');sp.className='hl';rg.surroundContents(sp)}catch(_){document.execCommand('hiliteColor',false,'#ffe45c')}}else document.querySelectorAll('.hl').forEach(h=>h.replaceWith(document.createTextNode(h.textContent)));s.removeAllRanges();tools.style.display='none'};
render();
})();
</script></body></html>
