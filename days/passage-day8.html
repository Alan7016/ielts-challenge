t:inherit;border:1px solid #999;border-radius:4px;background:#fff;padding:5px 8px;width:175px;text-align:center;margin:0 5px}.notes{font-size:17px;line-height:1.75}.note-row{margin:10px 0}.box{background:#f2f3f4;border:1px solid #ddd;border-radius:6px;padding:14px 18px;line-height:1.7;font-size:17px;margin:14px 0}.row{display:flex;gap:12px;align-items:flex-start;margin:16px 0}.txt{flex:1;font-size:17px;line-height:1.45}.select{font:inherit;border:1px solid #cfcfcf;border-radius:7px;background:#f7f8f9;padding:8px 28px 8px 14px;min-width:86px}.drop-slot{height:43px;border:1px dashed #cfd4db;border-radius:5px;background:#f7f8f9;display:flex;align-items:center;padding:0 12px;margin:16px 0;font-weight:700;gap:12px}.drop-slot.active{outline:2px solid #2563a8;background:#eef6ff}.drop-slot.filled{border-style:solid;background:#fff}.headings{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin:14px 0 24px}.heading-pill{border:1px solid #d7d7d7;border-radius:8px;background:#fff;color:#111;font:inherit;font-weight:700;padding:6px 14px;box-shadow:0 1px 2px #0002;cursor:grab}.heading-pill.selected{outline:3px solid #222}.tools{position:absolute;z-index:50;display:none;background:#222;border-radius:6px;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.2)}.tools button{background:none;border:0;color:#fff;padding:6px 10px;font:inherit}.hl{background:#ffe45c}.bar{height:59px;border-top:1px solid #ddd;display:flex;align-items:center;gap:28px;padding:8px 18px;background:#fff;overflow-x:auto}.partnav{display:flex;align-items:center;gap:8px;white-space:nowrap}.partlabel{font-weight:700;border:0;background:#fff;font:inherit;cursor:pointer}.count{color:#555;font-size:14px}.tiles{display:flex;gap:4px}.tile{min-width:32px;height:32px;border:1px solid #bbb;background:#fff;border-radius:2px;cursor:pointer}.tile.answered{background:#2b2b2b;color:#fff}.review{margin-left:auto;min-width:42px;height:34px;background:#ddd;border:0;border-radius:4px;font-weight:700}.overlay{position var passages={"1": "<h1>The unsung sense</h1>\n<p class=\"sub\">New research reassesses the nature and importance of smell</p>\n<p>Traditionally, smell has not been at the forefront of sensory research, pushed aside in favor of the seemingly more vital senses of vision and hearing. There has been a strong belief that people, especially compared to other mammals, are not that influenced by smells.</p>\n<p>One of the first to assert the relative unimportance of the human sense of smell was Pierre Paul Broca, an influential 19th-century anatomist. After comparing the proportion of the brain devoted to smell in different animals, he suggested that mammals can be classed into two broad groups: macrosmatic mammals, such as dogs, have a finely tuned sense of smell which they rely on to perceive the world, while marine mammals and primates, including humans, are microsmatic \u2013 the organ with which they smell is small and functionally redundant.</p>\n<p>That idea seemed to fit with more recent studies in genetics, which found that the majority of mammals have about one thousand different types of smell receptor. Most of these aren\u2019t present in humans, who only possess four hundred or so different types.</p>\n<p>Yet these findings may have been misleading. Brain scans show that more of the human brain is devoted to smell processing than Broca\u2019s anatomical studies suggested. And although we may have fewer types of receptors than other mammals, research has shown that the human nose and brain are unusually well connected, with each group of receptors linking to many more neural regions than is the case in other animals. That should give us a good ability to process incoming scents.</p>\n<p>Once researchers began looking, they found the nose to be far more sensitive than its reputation suggested. One study, for example, found that we can pick out a particular substance even when heavily diluted. In fact, a person can smell just one drop of a chemical in a large swimming-pool.</p>\n<p>What\u2019s more, with the latest findings it is becoming clear that the brain\u2019s \u2018smelling centers\u2019 are intimately linked to its system for controlling emotion, fear and memory. That suggests a link between smell and the way we think. One Dutch academic, for example, found that when the smell of orange, seawater or peppermint was pumped through a nightclub, those inside partied harder \u2013 they danced more, laughed more, and even thought the music was better than when there was no added scent.</p>\n<p>Other work has found that scent can influence our cognitive skills. A study found that when men were subjected to a novel smell \u2013 either good or bad \u2013 during a task used to test decision-making skills, they performed significantly worse than normal. The researchers concluded the scent stimulated brain areas connected with emotion, making their decisions emotional rather than rational.</p>\n<p>The surprising thing about such studies is that up to 95% of subjects altered their behaviour, despite only 5% of them being aware of the introduced smells that they were facing. The question, then, is why do we pay so little conscious attention to our noses unless we smell something really strong?</p>\n<p>One vital factor is that our noses just aren\u2019t equipped to locate the source of an odour. This makes the sense of smell fundamentally different to vision or hearing, which are built to identify sights and sounds with precision. Apparently, we become aware of something when the brain focuses on a single location, after which it picks out the details, like a familiar face, from the scene. With smell, though, the brain does not focus in the same way, and so is not able to make us aware of the details relating to one particular area. It\u2019s for this reason that we can only ever pick out around four smells from a complex mixture.</p>\n<p>Nevertheless, we all have the capacity to train our sense of smell, but it needs to be worked at. Master perfumers, for instance, learn to recognize, name and imagine an extraordinary range of smells through years of practice. This is accompanied by a significant reorganization of the olfactory areas in the brain that helps them to process the scents more efficiently.</p>\n<p>Smells are also especially good memory evokers, but it\u2019s actually a myth that odors trigger more complete memories than other stimuli. These memories are neither more accurate nor more detailed, but they are unique in that they are more emotional. This isn\u2019t surprising when you consider that both emotion and smell are processed by the same areas of the brain, and there is a strong link between emotion and memory.</p>\n<p>That said, not all smell memories are equal. The link between a memory and a smell is stronger if the smell is an unpleasant rather than a pleasant one, which makes sense from an evolutionary perspective. In addition, the very first time we associate a smell with an object, it evokes a much greater response in our brains than for any encounter with the smell or object in later life, laying down stronger foundations for the memory. That doesn\u2019t happen with any other sense. Since most first encounters with a smell happen at a young age, this might explain why smells often carry us back to our childhood.</p>", "2": "<h1>A great leap forward</h1>\n<p class=\"sub\">If research proves that New Zealand's Maud Island frogs can coexist with mice, their future will be a lot brighter.</p>\n<p>If research proves that New Zealand\u2019s Maud Island frogs can coexist with mice, their future will be a lot brighter, say those who are trying to save the rare species from extinction</p>\n<p>A New Zealand\u2019s native frogs are among the most primitive on the planet \u2013 virtually unchanged since the late Jurassic period, 140\u2013160 million years ago. Back then, New Zealand was part of the seabed and all the continents as we know them today were joined together as one land mass. However, New Zealand came to the surface just in time to provide a lifeboat for the prehistoric frogs to avoid the fate of the relatives they left behind. In other words, New Zealand\u2019s native frogs did not disappear due to environmental conditions they could not survive. New Zealand\u2019s primal forest floor was once crawling with them and tens of thousands of their bones, from at least seven different species, have been found all over the country.</p>\n<p>B Today, in the moonless dark of a forest night, Kerri Lukis, a post-graduate researcher from Victoria University, shines her torch into the undergrowth and quickly reaches towards a moldy brown leaf. When she opens her hand, I see that this \u2018leaf\u2019 \u2013 perhaps 40 millimeters long \u2013 has tiny, almost birdlike feet, a pair of onyx-black eyes and appears to have been sprinkled with glitter. These are not the kind of frogs that most New Zealanders have seen in their gardens. The glossy lime-green frogs that can be heard croaking to one another from farm ponds and rivers are in fact Australian imports; New Zealand native frogs are a very different creature. To begin with, people will certainly not hear one. They are silent, and consequently, in the evolutionary process, they have lost their eardrums as well, therefore making it easier for researchers like Lukis to trap them. Another behavior that is unusual for frogs is that the Maud Island species avoid water, so their tiny feet have no webs between their toes, which would normally make swimming and movement in the water more effective.</p>\n<p>C Since a tadpole cannot move or survive on dry land, this stage is absent in Maud Island frogs and they go straight from gelatinous eggs (incubated by the males) to \u2018froglets\u2019, which spend their first few weeks of life as passengers on the back of a male. Before the first humans arrived, the frogs\u2019 enemies were predators that hunted by sight \u2013 native birds such as weka, morepork and perhaps pukeko \u2013 so they developed a simple but effective defense: they kept very still. Unfortunately, freezing proved a pitifully inadequate defense against the keen-nosed pests that humans brought here. Rats, mice, and other four-legged enemies such as stoats and weasels all but wiped out the frogs.</p>\n<p>D Maud Island frogs or pakeka, one of just four surviving species of native New Zealand frog, once lived throughout New Zealand, but for the past 150 years have been confined to predator-free Maud Island, 900 meters from the rocky coast of the Marlborough Sounds. In 1997, however, the Department of Conservation moved 300 to Motuara Island, then another 100 to Long Island in 2005. Early this year the frogs were finally returned to the mainland, when 30 were brought back to the Karori Wildlife Sanctuary, just a short ride from the central business district in the capital city of Wellington.</p>\n<p>E The sanctuary is protected by a high-tech fence designed to keep rare native species in and hordes of introduced predators out \u2013 and mostly it does. But nobody counted on the dexterity \u2013 or determination \u2013 of baby mice, which, it turns out, can squeeze through a six-millimeter gap. Kerri Lukis is turning that setback into a golden opportunity: \u2018It\u2019s given us a chance to look at how mice impact on native frogs. There\u2019s very little known about their effects on New Zealand wildlife,\u2019 she says, but Karori Sanctuary \u2013 one of just a few protected places in the country where mice are the only introduced predators \u2013 provides the perfect study area.</p>\n<p>F A goal of frog conservation is to establish new populations as insurance against catastrophe: predators finally managing the swim to Maud Island, or fire raging through their forest stronghold. If Lukis can prove that the frogs can cope with mice, it would make more islands available to wildlife managers looking for extra homes for them. Lukis aims to answer some long-pondered questions: Do mice impact frogs directly through predation? If so, do they attack the adults, the juveniles or the eggs? Are males more vulnerable because they sit on the eggs? And if the males are unable to search freely for food, does their condition become weakened so that they won\u2019t breed?</p>\n<p>G Back in the forest, Lukis weighs and measures the tiny frog, notes with satisfaction that it might be carrying eggs, then takes a photo of the animal\u2019s flank and jaw. Her shot reveals patterns and coloration unique to each frog, so that she can identify them without resorting to invasive alternatives like toe-clipping. Then it\u2019s gently returned to its special mouse-proof enclosure. There are enough tiny insects crawling about in the leaf litter to sustain 30 captive frogs, but sanctuary staff supplement the frogs\u2019 diet with live moths. In early October, another 30 frogs were brought here from Maud Island and placed in a separate enclosure where they were tested for the lethal chytrid fungus, first found in New Zealand in two introduced Australian species, the green frog and the bell frog, in 1999. Once the scientists are sure they are free from disease and are not a danger to other frogs, the Maud Island frogs will be introduced to those already resident at Karori, then subdivided into two groups with roughly equal gender ratios. One group will go on living an isolated life in the enclosure; the other, left to see how they survive the intrusion of the sanctuary\u2019s mice. This will hopefully give Lukis the answers she needs.</p>", "3": "<h1>The tuatara - past and future</h1>\n<p>The New Zealand species of lizard, the tuatara, is firmly embedded in the national psyche: an icon for today which dates from the age of dinosaurs; an ancient reptile commemorated on the back of the five-cent coin. New Zealanders feel an affinity with the tuatara, and accept that active conservation management is required to ensure it will be among the legacies left to future generations. When European explorers reached New Zealand in 1769 they found two large islands, which together they called the \u2018mainland\u2019, and many tiny offshore islands around the coast. The naturalists who came with the explorers disregarded the tuatara, though it is improbable none were seen. Only several decades later did a tuatara specimen reach the British Museum, where it was eventually classified as just another type of lizard. One of the first scientists who realized that aspects of tuatara anatomy were odd \u2013 unchanged for tens of thousands of years \u2013 was Albert Gunther in 1876. Gunther believed the tuatara was one of the most valuable objects in zoological anatomical collections, and also noted, in passing, the reptile was likely to become extinct. From today\u2019s perspective, it is striking that Gunther expressed no concern about the probable demise of the tuatara. He and his contemporaries were products of their age, strongly influenced by Charles Darwin\u2019s theory, which had only recently been published. Their views were something like this: \u2018Extinction is a natural process. It is sad that species disappear, but that is part of nature.\u2019 There is a second important aspect of Gunther\u2019s work. He recorded, correctly, that some of the mammals introduced by Europeans were predators of the tuatara \u2013 particularly rats. But what he did not realize was that New Zealand has two species of rat, both introduced, both with an appetite for tuatara: the ship\u2019s rat came with European explorers and settlers; but the kiore rat had already been in the country for hundreds of years, brought by Polynesians from the Pacific Islands. Gunther failed to recognize the distinction, believing all rats to be a relatively recent introduction. Little further research was conducted until Ian Crook of the NZ Wildlife Service published his findings in 1973, which can be summarized as follows. Tuatara thrive on offshore islands with no rats. Tuatara never survived on islands with ship\u2019s rats. On a few islands, small and declining populations of tuatara occur with the kiore. This should not be seen, however, as evidence that tuatara and kiore can coexist. Rather, Crook proposed, kiore probably only arrived recently on such islands, and thus the small populations represent extinctions in progress. Throughout the 1990s, Richard Holdaway and his colleagues at Victoria University in Wellington documented the surprising discovery that aloes probably arrived about 1800 years ago, although the human population of New Zealand is thought to be no older than 800 years. How is this possible? Presumably, Holdaway argued, the kiore were brought by Polynesian explorers who visited the country but did not settle. Thereafter, the rats were agents of ecological warfare, exterminating perhaps 1000-3000 species. Thus, tuatara and many other species were already rare or extinct when permanent human inhabitants \u2013 the Maori \u2013 arrived around 1300. This hypothesis is still being debated, but the evidence continues to accumulate in its favor. Conservation practice has changed dramatically since Crook\u2019s findings were published in 1973. Eradication of rats from any given environment was believed to be virtually impossible until about 1980, but since then has become routine. Enormous conservation benefits are accruing as newly rat-free offshore islands are providing sanctuaries for the country\u2019s rarest species. In 1995, for example, Nicola Nelson of the Department of Conservation established 68 tuatara on Titi Island. Since then, four more populations of tuatara have been established elsewhere under similar conditions. Today, numbers of tuatara are still a fraction of what they once were, but for the first time in 1800 years the decline has been reversed. While the recovery of rare species is itself a good thing, the truly significant outcome of this research is that it liberates the imagination. If we can remove predatory introduced mammals from islands, why not from the mainland too? Perhaps the questions we ask should demonstrate even more visionary ambition. Can non-mammalian pests also be removed from the mainland? Our rivers, for example, are full of surrogate rats, in the form of introduced species of fish called trout. Someday, more people will understand that trout have replaced a whole native fauna in our waterways, just as rats replaced tuatara on the mainland. Will such knowledge lead to the creation of mainland \u2018aquatic islands\u2019 where we can once again establish those species of indigenous fish that used to live in our rivers? Similarly, can bellbirds and tuis replace birds like starlings and mynahs? The answers to such questions are uncertain, and opposing sides will doubtless be fiercely debated. But the role of scientific knowledge in illuminating the past will be crucial. Just as we now no longer tolerate extinction, in the future we may no longer accept a mainland devoid of the biological wonders of our past such as tuatara. Conservation is thus not primarily about the past but about imagining and then creating the future we wish for our children and ourselves. For 80 million years until humans arrived, tuatara occurred throughout New Zealand \u2013 might they do so again?</p>"},answers={"1": "primates", "2": "four hundred", "3": "drop", "4": "nightclub", "5": "music", "6": "95%", "7": "TRUE", "8": "TRUE", "9": "FALSE", "10": "FALSE", "11": "FALSE", "12": "NOT GIVEN", "13": "TRUE", "14": "40 millimeters", "15": "croaking", "16": "eardrums", "17": "webs", "18": "tadpole", "19": "males", "20": "G", "21": "D", "22": "A", "23": "B", "24": "F", "25": "A", "26": "D", "27": "C", "28": "B", "29": "B", "30": "D", "31": "D", "32": "YES", "33": "YES", "34": "NOT GIVEN", "35": "NO", "36": "B", "37": "D", "38": "G", "39": "F", "40": "H"},alt={"2": ["400"], "6": ["95 percent"], "14": ["40 mm", "40 millimetres"], "25": ["D"], "26": ["A"], "32": ["TRUE"], "33": ["TRUE"], "35": ["FALSE"]};
function tf(n,t,yn){var opts=yn?['YES','NO','NOT GIVEN']:['TRUE','FALSE','NOT GIVEN'];return '<div class="tf-row" id="q'+n+'"><div class="statement"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="options">'+opts.map(o=>'<label><input type="radio" name="q'+n+'" value="'+o+'"> '+o+'</label>').join('')+'</div></div>'}
function gap(n){return '<span class="qnum">'+n+'</span><input class="gap" id="gap'+n+'">'}
function sel(n,t,letters){return '<div class="row" id="q'+n+'"><span class="qnum">'+n+'</span><span class="txt">'+t+'</span><select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select></div>'}
function mcq(n,t,opts){return '<div class="mcq" id="q'+n+'"><div class="prompt"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="choice-options">'+opts.map((o,i)=>'<label class="choice-option"><input type="radio" name="q'+n+'" value="'+'ABCD'[i]+'"> <b>'+'ABCD'[i]+'</b> '+o+'</label>').join('')+'</div></div>'}
function grid(start,letters,items){return '<div class="match-wrap"><table class="match"><thead><tr><th></th>'+letters.map(l=>'<th>'+l+'</th>').join('')+'</tr></thead><tbody>'+items.map((t,i)=>{var n=start+i;return '<tr id="q'+n+'"><td><div class="qcell"><b>'+n+'.</b><span>'+t+'</span></div></td>'+letters.map(l=>'<td><input type="radio" name="q'+n+'" value="'+l+'"></td>').join('')+'</tr>'}).join('')+'</tbody></table></div>'}
function qhtml(p){if(p===1)return '<div class="qgroup"><h3>Questions 1-6</h3><p><i>Complete the notes. Choose <b>ONE WORD AND/OR A NUMBER</b>.</i></p><div class="notes"><h3>Research on smell</h3><div class="note-row">Broca categorized humans with other '+gap(1)+' and sea mammals.</div><div class="note-row">Humans have about '+gap(2)+' kinds of smell receptor.</div><div class="note-row">Humans can detect a single '+gap(3)+' of some substances in a huge quantity of liquid.</div><div class="note-row">Certain aromas were introduced into a '+gap(4)+'.</div><div class="note-row">Smells altered the way party-goers felt about the '+gap(5)+'.</div><div class="note-row">As many as '+gap(6)+' of people reacted to introduced smells.</div></div></div><div class="qgroup"><h3>Questions 7-13</h3>'+tf(7,'Human vision and hearing are designed to locate exactly where data is coming from.')+tf(8,'Even when complex multiple smells are present, most humans can identify only a few individual odors.')+tf(9,'Professional help is needed when a person is developing their sense of smell.')+tf(10,'Smells stimulate more precise memories than sights or sounds do.')+tf(11,'A pleasant smell creates the strongest memories.')+tf(12,'Sensitivity to new smells declines in adulthood.')+tf(13,'Smell-related memories can frequently evoke childhood experiences.')+'</div>';
if(p===2)return '<div class="qgroup"><h3>Questions 14-19</h3><p><i>Complete the summary. Choose <b>ONE WORD AND/OR A NUMBER</b>.</i></p><p>The Maud Island frog, roughly '+gap(14)+' in length, is silent rather than making a '+gap(15)+' noise. For this reason, they no longer possess '+gap(16)+'. They do not need '+gap(17)+' on their feet. They miss out the usual '+gap(18)+' stage. The froglets are carried by the '+gap(19)+' of the species.</p></div><div class="qgroup"><h3>Questions 20-24</h3><p>Which paragraph contains the following information?</p>'+grid(20,['A','B','C','D','E','F','G'],['methods scientists use to distinguish individual frogs within a species','the stages involved in the relocation of Maud Island frogs','an explanation of how some ancient frogs escaped extinction','a comparison between different species of frogs','the range of information research into mice may uncover'])+'</div><div class="qgroup"><h3>Questions 25-26</h3><p>Choose <b>TWO</b> letters, A-E.</p><div class="box"><b>A</b> wild animals<br><b>B</b> the unusual climate<br><b>C</b> domestic animals kept by people<br><b>D</b> disease<br><b>E</b> non-native species of birds</div>'+sel(25,'Threat 1',['A','B','C','D','E'])+sel(26,'Threat 2',['A','B','C','D','E'])+'</div>';
return '<div class="qgroup"><h3>Questions 27-31</h3>'+mcq(27,'What are we told about the Europeans who arrived in 1769?',['They thought there was only one large island.','They had not come to study natural history.','They had no interest in the tuatara.','They sent a tuatara to the British Museum.'])+mcq(28,'What does the author say about Albert Gunther?',['He believed the tuatara could fetch a high price.','He was typical of his generation of scientists.','He disagreed with Charles Darwin.','He wanted to stop the tuatara becoming extinct.'])+mcq(29,'What did Albert Gunther think about the rats in New Zealand?',['They did not eat the tuatara.','There was one species of rat.','There had always been rats in New Zealand.','They were killed by Polynesians.'])+mcq(30,'What did Ian Crook conclude from his research?',['Tuatara are safe on small islands.','Ship rats kill more tuatara than kiore.','Kiore cannot swim to offshore islands.','Rats and tuatara cannot live together.'])+mcq(31,'What were the findings of Richard Holdaway research?',['Maori settled more recently than previously thought.','The first Polynesian explorers formed permanent settlements.','Ship rats are the oldest rat species.','Rats caused extinctions before any humans settled.'])+'</div><div class="qgroup"><h3>Questions 32-35</h3>'+tf(32,'The available research supports Holdaway theory but it has not been proved.',true)+tf(33,'Nowadays, it is possible to totally destroy a population of rats on a small island.',true)+tf(34,'Crook was the first person to recognize the potential of offshore islands as sanctuaries.',true)+tf(35,'Tuatara numbers are continuing to fall.',true)+'</div><div class="qgroup"><h3>Questions 36-40</h3><p>Complete the summary using the list of words.</p><div class="box"><b>A</b> natural evolution<br><b>B</b> creative thought<br><b>C</b> indigenous plants<br><b>D</b> trout<br><b>E</b> pollution<br><b>F</b> restoration<br><b>G</b> native fish<br><b>H</b> extinction</div>'+sel(36,'The mos function render(){partTitle.textContent='Part '+active;var r=ranges[active];partSub.textContent='Read the text and answer questions '+r[0]+'-'+r[1]+'.';left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();drawFooter();left.scrollTop=right.scrollTop=0}
function val(n){var g=document.getElementById('gap'+n);if(g)return g.value;var s=document.getElementById('sel'+n);if(s)return s.value;var r=document.querySelector('input[name="q'+n+'"]:checked');return r?r.value:''}
function save(){for(var n=1;n<=40;n++){var v=val(n);if(v)state[n]=v}}function restore(){for(var n=1;n<=40;n++){if(!state[n])continue;var g=document.getElementById('gap'+n);if(g)g.value=state[n];var s=document.getElementById('sel'+n);if(s)s.value=state[n];var r=document.querySelector('input[name="q'+n+'"][value="'+state[n]+'"]');if(r)r.checked=true}}
function answered(n){return !!state[n]||!!val(n)}function count(p){var r=ranges[p],c=0;for(var i=r[0];i<=r[1];i++)if(answered(i))c++;return c}
function drawFooter(){save();var h='';[1,2,3].forEach(p=>{var r=ranges[p];h+='<div class="partnav"><button class="partlabel" data-part="'+p+'">Part '+p+'</button>';if(p===active){h+='<div class="tiles">';for(var n=r[0];n<=r[1];n++)h+='<button class="tile '+(answered(n)?'answered':'')+'" data-q="'+n+'">'+n+'</button>';h+='</div>'}else h+='<span class="count">'+count(p)+' of '+(r[1]-r[0]+1)+'</span>';h+='</div>'});h+='<button class="review" id="review">OK</button>';footer.innerHTML=h}
document.addEventListener('change',()=>{save();drawFooter()});document.addEventListener('input',()=>{save();drawFooter()});footer.onclick=e=>{var p=e.target.closest('[data-part]');if(p){save();active=+p.dataset.part;render();return}var q=e.target.closest('[data-q]');if(q){var n=+q.dataset.q;(document.getElementById('q'+n)||document.getElementById('gap'+n)||document.getElementById('sel'+n))?.scrollIntoView({behavior:'smooth',block:'center'});return}if(e.target.closest('#review'))review()};function review(){save();var a=0;for(var n=1;n<=40;n++)if(answered(n))a++;subwrap.innerHTML='<p>You have answered <b>'+a+'</b> of 40 questions.</p><p><button class="ovrow submit" id="final">Submit test</button></p>';final.onclick=grade;submit.classList.add('show')}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}function correct(n,v){return [answers[n]].concat(alt[n]||[]).some(a=>norm(a)===norm(v))}function grade(){if(graded)return;graded=true;save();var score=0;for(var n=1;n<=40;n++)if(correct(n,state[n]||''))score++;subwrap.innerHTML='<div class="score">Your score: <b>'+score+' / 40</b></div><p>Correct answers are built into this test. Reopen the file to take it again from a clean state.</p>';render()}
