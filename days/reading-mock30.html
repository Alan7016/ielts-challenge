var DATA = {"passages": {"1": "<h1>Discovering Purple</h1>\n<p>For thousands of years, dyes used to colour textiles and other materials were made from only natural sources. Historically, coloured dyes were made from the roots and leaves of plants, and from certain animals. Among the most precious of the animal-based dyes was the purple colour extracted from snails. This dye was very difficult to obtain and was therefore outrageously expensive. What was more, colours from natural dyes tended to be quite dull, and they faded when exposed to sunlight. But all this changed in 1856, when a London teenager made an important discovery.</p>\n<p>William Perkin was born on March 12, 1838, in London, England. His father was a builder, and the family lived in fairly prosperous circumstances in an otherwise rather disreputable neighbourhood in the city's East End. As a boy, Perkin's curiosity prompted early interests in the arts, sciences, photography, and engineering. But then one day, when he was exploring his late grandfather's home, he happened to come across a run-down, yet functional, laboratory, and this solidified his passion for chemistry.</p>\n<p>As a student at the City of London School, Perkin became immersed in the study of chemistry. His teacher, Thomas Hall, encouraged him to attend a series of lectures given by eminent scientist Michael Faraday at the Royal Institution. Those speeches fired the young chemist's enthusiasm further, and he became determined to attend the Royal College of Chemistry. Perkin's father hoped to convince his bright young son to follow in his older brother's footsteps into the more respectable field of architecture, so he tried to prevent this at first. But pressure from Hall and the wishes of his son won out, and Perkin entered the Royal College of Chemistry in 1853, at the age of 15. At the time of Perkin's enrolment, the college was headed by noted German chemist August Wilhelm Hofmann. Perkin's scientific gifts soon caught Hofmann's attention, and within two years, he became Hofmann's youngest assistant. Not long after that, Perkin made the discovery that would make him both famous and wealthy.</p>\n<p>In 1856, the only viable medical treatment for the deadly disease malaria was quinine, derived from the bark of the cinchona tree native to South America. Demand for this drug was surpassing the available supply. Thus, when Hofmann made some passing comments about the desirability of a synthetic substitute for quinine, it is unsurprising that his star pupil was moved to take up the challenge.</p>\n<p>During his spring school holidays that year, Perkin spent his time at home attempting to manufacture the drug from aniline, a by-product from the manufacture of the gas that lit London's streets. Despite his best efforts, however, he did not end up with quinine. Instead, he produced a mysterious dark sludge. Luckily, Perkin's scientific training and nature prompted him to investigate the substance further. Incorporating potassium dichromate and alcohol into the aniline at various stages of the experimental process, he finally happened upon a deep purple solution. Perkin quickly grasped that his purple solution could be used to colour fabric, thus making it the world's first synthetic dye.</p>\n<p>Perkin asked advice of Scottish dye works owner Robert Pullar, who convinced him that manufacturing the dye would be well worth it if the colour remained fast and the cost was not prohibitive. Thus reassured, he decided to pursue his commercial plans. Over the fierce objections of his mentor Hofmann, Perkin left college to give birth to the modern chemical industry. He was still only eighteen years old.</p>\n<p>With the help of his father and brother, Perkin set up a factory on a site near the Grand Union Canal in Greenford Green, not far from London. Utilising the cheap and almost unlimited supply of aniline available in the city, it began producing the world's first synthetic dye in 1857. Perkin originally called his dye 'Tyrian Purple' or 'aniline purple', but then decided to call it 'mauve', after the French word for the mallow plant used to make the colour violet. This was the name he fixed on in 1859, and is the name still in use to this day.</p>\n<p>The company received an unexpected commercial boost from the Empress Eugenie of France when she decided the new colour flattered her, and it soon became the must-have shade for all the fashionable ladies of France. Not to be outdone, England's Queen Victoria also appeared in public wearing a gown of the same hue, thus making it all the rage in England as well. The dye was bold and fast, and the public wanted more. So Perkin went back to the drawing board, and between 1859 and 1864 he developed several more synthetic dye colours.</p>\n<p>It is important to note that Perkin's synthetic dye discoveries had effects far beyond the merely decorative. The dyes also became vital to medical research in many ways. For instance, they were used to stain previously invisible microbes and bacteria, allowing researchers to identify such bacilli as tuberculosis, cholera, and anthrax.</p>", "2": "<h1>Beachcombing for early humans in Africa</h1>\n<p class=\"sub\">From the earliest modern humans to the present day, our species has evolved dramatically in both biological and behavioural terms. What forces prompted these momentous changes?</p>\n<div class=\"para\">A</div>\n<p>Kenya has long been known as the 'cradle of mankind' following the discovery of fossils thought to be of the first members of the human family, which arose in Africa around 6-7 million years ago. Various distinct species evolved from these ancestors over millions of years, including our own – Homo sapiens – around 250,000 years ago. 'A lot of the research on the origins of modern humans has focused on defining their point of origin, then understanding why humans left Africa about 60,000 years ago to colonise the rest of the world,' says anthropologist Dr Marta Mirazón Lahr of Cambridge University. 'But we have no idea what happened between 200,000 years and 60,000 years ago. We also have very little information on what occurred inside Africa after 60,000 years, when the different population groups and languages we see today evolved. The genetics suggest that the expansion out of Africa is just the tip of a massive population expansion inside the continent.'</p>\n<div class=\"para\">B</div>\n<p>Along with fellow Cambridge anthropologist Professor Robert Foley, Mirazón Lahr is investigating the evolutionary history of modern human populations. 'The challenge is to find the sites where evidence of these early people can be recovered – their stone tools, the animals they hunted, their ornaments and, ultimately, the fossils of the people themselves,' she says. She has chosen to focus on East Africa based on the theory that its past environment was suitable for sustained occupation over time. But the region is huge, and finding the right place to look is absolutely crucial. 'In the past there were periods of enormous rainfall in the tropics,' she says. 'The lakes were much higher and their margins were wider. We are looking at where the ancient lake margins would have been when the lakes were last high, and that's where we look.'</p>\n<div class=\"para\">C</div>\n<p>Some of their most spectacular finds have been on the ancient Turkana beaches in Kenya's Rift Valley. 'Ten thousand years ago, this area was wetter, with animals such as gazelles, hippos and lions, and the beaches are still there, even though the lake is long gone. We've found a great many shells on the surface, and a small number of harpoons the people fished with. A lot has already been exposed by the wind, and occasionally we find sites where things are buried, and then we dig,' she says. 'We're looking at the stone tools and how these relate to times of particularly high water levels. Then we're looking at the fauna and, if we're lucky, we find actual human fossils. The oldest fossil ever found that looks like a modern human is 200,000 years old, and comes from the Turkana Basin. We're trying to find the fossils that mark the origin of Homo sapiens.'</p>\n<div class=\"para\">D</div>\n<p>The primitive technologies that our early ancestors left behind gradually evolve, and comparing finds dated to different times can advance understanding of our own evolutionary trajectory. 'We think the evolution to modern humans is associated with changes in behaviour and in technology, for example in their tool use. We've already found evidence that they started using animal bones to make tools, which was rare in earlier populations,' says Mirazón Lahr. 'The people who lived around here 10,000 years ago used microliths – a form of miniaturised stone tool technology,' adds her colleague Foley. 'Instead of producing one or two big flakes like the earliest modern humans, they produced lots of very small flakes to make composite tools. We've also found a beach in the Turkana Basin from about 200,000 years ago and that has its own very different fossilised fauna, and very different stone tools. The technology and the people changed a lot during the past 200,000 years.'</p>\n<div class=\"para\">E</div>\n<p>Mirazón Lahr emphasises that geography and climate played a critical role in the origins and diversification of modern humans. 'The times when the lakes were high were periods of plenty in East Africa,' she says. 'When it was very wet there were lots of animals to hunt, the vegetation could grow, and you can imagine that the people would have thrived.' East Africa had a unique mosaic environment with lake basins, highlands and plains that provided alternative niches for foraging populations over this period. 'We think that early modern humans could live in the region throughout these long periods, even if they had to move between basins.' With a network of habitable zones, human populations survived by expanding, contracting and shifting ranges according to the state of the environment at any given time.</p>\n<div class=\"para\">F</div>\n<p>By comparing the fossil records from different basins over time, Mirazón Lahr is trying to establish a spatial and temporal image of human occupation over the past 200,000 years. She believes that the way to find novel insights is to consider each problem from various angles. Drawing on her wide-ranging interests from molecular genetics to prehistory, and combining genetic, fossil, archaeological and palaeoclimatic information, she hopes to form an accurate and complete picture of our early ancestors' lives and the external forces that shaped their evolution, both biological and behavioural.</p>", "3": "<h1>Rewards for scientific achievement</h1>\n<p>While the Nobel Prizes are over 115 years old, rewards for scientific achievement have been around much longer. As early as the 17th century, at the very origins of modern experimental science, promoters of science realized the need for some system of recognition and reward that would provide incentive for advances in the field.</p>\n<p>Before the prize, it was the gift that dominated in science. Precursors to modern scientists – the early astronomers, philosophers, physicians, alchemists and engineers – offered wonderful discoveries, inventions and works of literature or art as gifts to powerful patrons, often royalty. Many scientists prefaced their publications with extravagant letters of dedication; they might, or they might not, be rewarded with a gift in return. Eventually, different kinds of incentives, including prizes and awards, as well as new, salaried academic positions, became more common and the favor of particular wealthy patrons diminished in importance. But at the height of the Renaissance, early scientists relied on gifts from powerful princes to compensate and advertise their efforts.</p>\n<p>With courtiers all vying for a patron's attention, scientific gifts had to be presented with drama and flair. The astronomer Galileo Galilei (1564–1642) presented his newly discovered moons of Jupiter to the Medici dukes of Italy as a 'gift' that was literally out of this world. In return, the Medici family 'ennobled' Galileo with the title and position of court philosopher and mathematician. If a gift succeeded, the gift-giver might, like Galileo in this case, be fortunate enough to receive a gift in return. Gift-givers could not, however, predict what form a patron's gift would take, and they might find themselves burdened with offers they couldn't refuse. Tycho Brahe (1546–1601), the great Danish Renaissance astronomer, received everything from exotic animals to chemical secrets in return for his discoveries.</p>\n<p>By the early-17th century, scientific promoters realized that gift-giving was ill-suited to encouraging experimental science. Experimentation required many individuals to collect data in many places across long periods of time. Gifts emphasized competitive individualism at a time when scientific collaboration and the often humdrum work of empirical observation were paramount.</p>\n<p>While it was accepted that some competitive rivalry helped to inspire and advance science, scientific reformers believed that too much led to the ostentation that too often plagued courtly gift-giving. Most of all, reformers feared an individual would not tackle a problem that couldn't be finished and presented to a patron in his or her lifetime – or even if they did, their findings might die with them.</p>\n<p>For these reasons, promoters of experimental science saw the reform of rewards as integral to radical changes in the pace and scale of scientific discovery. For example, Sir Francis Bacon (1561–1626), lord chancellor of England and an influential booster of experimental science, emphasized the importance even of 'approximations' or unfinished attempts at reaching a particular goal. Instead of dissipating their efforts attempting to appease patrons, many researchers, he hoped, could be stimulated to work toward the same ends via a well-publicized research wish list. Bacon coined the term 'desiderata', still used by researchers today to denote widespread research goals. He also suggested many ingenious ways to advance discovery by stimulating the human hunger for fame; a row of statues celebrating famous inventors of the past, for example, could be paired with a row of empty plinths upon which researchers might imagine their own busts one day resting.</p>\n<p>Bacon's techniques inspired one of his chief admirers, the reformer Samuel Hartlib (circa 1600–1662) to collect many schemes for reforming the system of recognition. One proposed that rewards should go not only 'to such as exactly hit the marke, but even to those that probably misse it', because their errors would stimulate others and make 'active braines to beate about for New Inventions'. Hartlib planned a centralized office systematizing rewards for those who 'expect Rewards for Services done to the King or State, and know not where to pitch and what to desire'.</p>\n<p>Collaborative scientific societies, beginning in the mid-17th century, distanced rewards from the whims and demands of individual patrons. The periodicals that many new scientific societies started publishing offered a new medium that allowed authors to tackle ambitious research problems that might not individually produce a complete publication pleasing to a dedicatee. The societies saw their periodicals as a means to entice discovery by offering credit. Today's Leopoldina, the German national scientific society, founded its publication in 1670. According to its bylaws, those who might not otherwise publish their findings could see them 'exhibited to the world ... with the praiseworthy mention of their name' – an important step on the way to standardizing scientific citation.</p>\n<p>States might also offer rewards for solutions to problems, most famously in the case of the prize offered by the British government in 1714 for figuring out how to determine longitude at sea. Some in the 17th century likened this long-sought discovery to the philosopher's stone. The idea of using a prize to highlight a specific problem is alive and well today. In fact, some contemporary scientific prizes, such as the Simons Foundation's 'Cracking the Glass Problem', set forth specific questions that still need to be resolved.</p>\n<p>The shift from gift-giving to prize-giving completely transformed the rules of engagement in scientific discovery. Of course, the need for monetary support hasn't gone away. Obtaining financial support can still be a sizable part of what it takes to get science done today. Succeeding in grant competitions might seem mystifying, and winning a career-changing Nobel might come as a bolt out of the blue. But researchers can take comfort that they no longer have to present their innovations on bended knee as wondrous gifts that will appeal to the whims of individual patrons.</p>"}, "answers": {"1": "snails", "2": "expensive", "3": "laboratory", "4": "quinine", "5": "chemical", "6": "factory", "7": "mauve", "8": "TRUE", "9": "NOT GIVEN", "10": "FALSE", "11": "NOT GIVEN", "12": "TRUE", "13": "TRUE", "14": "iii", "15": "vii", "16": "v", "17": "vi", "18": "i", "19": "iv", "20": "animals", "21": "lake", "22": "shells", "23": "harpoons", "24": "fossils", "25": "A", "26": "D", "27": "YES", "28": "NO", "29": "NOT GIVEN", "30": "YES", "31": "D", "32": "D", "33": "C", "34": "B", "35": "A", "36": "G", "37": "C", "38": "F", "39": "D", "40": "J"}, "alt": {}, "expl": {"1": {"loc": "Para 1", "text": "'the purple colour extracted from snails' → 'snails'."}, "2": {"loc": "Para 1", "text": "'This dye was very difficult to obtain and was therefore outrageously expensive' → 'expensive'."}, "3": {"loc": "Para 2", "text": "'he happened to come across a run-down, yet functional, laboratory' → 'laboratory'."}, "4": {"loc": "Para 4", "text": "'the only viable medical treatment for the deadly disease function mcq(n,t,opts){return '<div class="mcq" id="q'+n+'"><div class="prompt"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="choice-options">'+opts.map((o,i)=>'<label class="choice-option"><input type="radio" name="q'+n+'" value="'+'ABCD'[i]+'"> <b>'+'ABCD'[i]+'</b> '+o+'</label>').join('')+'</div></div>'}
var multiGroups={}, groupQNums={};
function multiSel(qA,qB,promptText,options){var name='g'+qA+'_'+qB;multiGroups[qA]=name;multiGroups[qB]=name;groupQNums[name]=[qA,qB];return '<div id="q_'+name+'" class="tf-row"><div class="statement"><span class="qnum">'+qA+', '+qB+'</span><span>'+promptText+'</span></div><div class="options">'+options.map(o=>'<label><input type="checkbox" name="'+name+'" value="'+o.letter+'"> <b>'+o.letter+'</b> '+o.text+'</label>').join('')+'</div></div>'}

function qhtml(p){
if(p===1)return '<div class="qgroup"><h3>Questions 1-7</h3><p><i>Complete the notes below. Choose <b>ONE WORD ONLY</b> from the passage for each answer.</i></p><div class="notes"><h3>The first synthetic dye</h3><div class="note-row"><b>Traditional dyes:</b></div><div class="note-row">&bull; made from plants, or animals e.g. '+gap(1)+'</div><div class="note-row">&bull; purple dye was hard to obtain and extremely '+gap(2)+'</div><div class="note-row"><b>William Perkin:</b></div><div class="note-row">&bull; found an old '+gap(3)+' in grandfather’s house and decided to study chemistry</div><div class="note-row">&bull; 1856: was trying to find a way to make the drug called '+gap(4)+'</div><div class="note-row">&bull; created a purple solution from aniline, a by-product of the '+gap(5)+' industry</div><div class="note-row">&bull; 1857: began manufacturing dye in his '+gap(6)+' near London</div><div class="note-row">&bull; 1859: called his dye '+gap(7)+'</div></div></div><div class="qgroup"><h3>Questions 8-13</h3><p><i>Do the following statements agree with the information given in the text? Write <b>TRUE / FALSE / NOT GIVEN</b>.</i></p>'+tf(8,'Hofmann noticed that Perkin had a talent for chemistry.')+tf(9,'Hofmann asked Perkin to do some experiments at home during the holidays.')+tf(10,'Perkin faced challenges obtaining the raw material needed to produce his dye.')+tf(11,'Perkin personally sent his new colour directly to the Empress Eugenie.')+tf(12,'The popularity of Perkin’s product at home and abroad led to demand for additional colours.')+tf(13,'Perkin’s dyes enabled scientists to see certain microbes and bacteria for the first time.')+'</div>';
if(p===2)return '<div class="qgroup"><h3>Questions 14-19</h3><p><i>The text has six paragraphs, A–F. Choose the correct heading for each paragraph from the list of headings below.</i></p><div class="box"><b>i</b> How weather affected human evolution<br><b>ii</b> A disappointing find<br><b>iii</b> Two gaps in our knowledge<br><b>iv</b> A multi-disciplinary approach<br><b>v</b> Evidence of an earlier landscape<br><b>vi</b> Developments in artefacts over time<br><b>vii</b> Difficulties identifying where to focus research</div>'+sel(14,'Paragraph A',['i','ii','iii','iv','v','vi','vii'])+sel(15,'Paragraph B',['i','ii','iii','iv','v','vi','vii'])+sel(16,'Paragraph C',['i','ii','iii','iv','v','vi','vii'])+sel(17,'Paragraph D',['i','ii','iii','iv','v','vi','vii'])+sel(18,'Paragraph E',['i','ii','iii','iv','v','vi','vii'])+sel(19,'Paragraph F',['i','ii','iii','iv','v','vi','vii'])+'</div><div class="qgroup"><h3>Questions 20-24</h3><p><i>Complete the summary below. Choose <b>ONE WORD ONLY</b> from the passage for each answer.</i></p><p class="summary-text"><b>The ancient Turkana beaches</b><br>Ten thousand years ago, a wide range of '+gap(20)+' lived in this area. The '+gap(21)+' which was in the basin disappeared a long time ago, but its beaches remain. A lot of '+gap(22)+' have been discovered on the ground, along with a few '+gap(23)+' which ancient humans used for fishing. The wind has uncovered many interesting objects, and others have been found by digging. Sometimes human remains are found in the form of '+gap(24)+'.</p></div><div class="qgroup"><h3>Questions 25 and 26</h3><p>Choose <b>TWO</b> letters, A–E. Which <b>TWO</b> aspects of early humans does Mirazón Lahr and Foley’s research focus on?</p>'+multiSel(25,26,'',[{letter:'A',text:'the type of artefacts they created'},{letter:'B',text:'the way they interacted with other populations'},{letter:'C',text:'the kind of societies they lived in'},{letter:'D',text:'the regions they inhabited'},{letter:'E',text:'the form of language they used'}])+'</div>';
return '<div class="qgroup"><h3>Questions 27-30</h3><p><i>Do the following statements agree with the views of the writer? Write <b>YES / NO / NOT GIVEN</b>.</i></p>'+tf(27,'The belief that progress depended on scientists benefiting from their work dates from the 17th century.',true)+tf(28,'Early scientists could be confident of receiving patronage if they dedicated their work appropriately.',true)+tf(29,'Galileo considered his discovery of the moons of Jupiter to be one of his most important contributions to science.',true)+tf(30,'Some gifts bestowed by patrons were more welcome than others.',true)+'</div><div class="qgroup"><h3>Questions 31-35</h3><p>Choose the correct letter, A, B, C or D.</p>'+mcq(31,'What did promoters of science begin to understand by the early-17th century?',['the benefits of making science more appealing','the importance of up-to-date scientific equipment','the impact of inaccurate data on scientific research','the need for scientists to share their work with one another'])+mcq(32,'What was scientific reformers’ greatest concern about the patronage system?',['It was often restricted to royal courts.','It led to unhealthy competition for resources.','It resulted in scientists’ work not always being judged on its merits.','It encouraged scientists to avoid research that took many years to complete.'])+mcq(33,'Why does the writer refer to a row of statues?',['to propose how research goals should evolve','to compare the achievements of different scientists','to illustrate how a desire for recognition could be exploited','to provide examples of important scientists from the past'])+mcq(34,'It was accepted under one of Samuel Hartlib’s schemes that',['inspiration was hard to achieve.','failure could bring about positive results.','scientists needed assistance in record keeping.','scientific research should be given a higher status.'])+mcq(35,'What is the writer doing in the eighth paragraph?',['explaining how journals contributed to scientific progress','describing how research projects became more ambitious','indicating how scientific societies expanded their membership','suggesting how nations attracted the best scientific researchers'])+'</div><div class="qgroup"><h3>Questions 36-40</h3><p>Complete the summary using the list of words, A–J, below.</p><div class="box"><b>A</b> inventions &nbsp; <b>B</b> strategy &nbsp; <b>C</b> investigation &nbsp; <b>D</b> likelihood &nbsp; <b>E</b> facilities<br><b>F</b> funding &nbsp; <b>G</b> navigation &nbsp; <b>H</b> ambitions &nbsp; <b>I</b> collaboration &nbsp; <b>J</b> interests</div><p class="summary-text"><b>Offering rewards for solutions to problems</b><br>Scientific progress has long been encouraged through prizes. A famous case was that of the reward offered in 1714 by the British government to resolve the problem of maritime '+selInline(36,['A','B','C','D','E','F','G','H','I','J'])+'. The practice of prize-giving persists today, and in some cases, for example the Simons Foundation’s ‘Cracking the Glass Problem’, details are provided on the particular areas of '+selInline(37,['A','B','C','D','E','F','G','H','I','J'])+' that should be focused on. Prize-giving changed the way in which people engaged in scientific discovery. Scientists today may still have to secure '+selInline(38,['A','B','C','D','E','F','G','H','I','J'])+' for their research. But they should reassure themselves with the fact that although there might be little '+selInline(39,['A','B','C','D','E','F','G','H','I','J'])+' of them winning a Nobel Prize, at least they no longer have to satisfy the arbitrary '+selInline(40,['A','B','C','D','E','F','G','H','I','J'])+' of individual patrons.</p></div>';
}

function render(){partTitle.textContent='Part '+active;var r=ranges[active];partSub.textContent='Read the text and answer questions '+r[0]+'-'+r[1]+'.';left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();drawFooter();left.scrollTop=right.scrollTop=0}
function val(n){if(multiGroups[n]){var boxes=document.querySelectorAll('input[name="'+multiGroups[n]+'"]:checked');return Array.from(boxes).map(b=>b.value).join(',')}var g=document.getElementById('gap'+n);if(g)return g.value;var s=document.getElementById('sel'+n);if(s)return s.value;var r=document.querySelector('input[name="q'+n+'"]:checked');return r?r.value:''}
function save(){for(var n=1;n<=40;n++){var v=val(n);if(v)state[n]=v}}
function restore(){for(var n=1;n<=40;n++){if(!state[n])continue;if(multiGroups[n]){var vals=state[n].split(',');vals.forEach(function(v){var cb=document.querySelector('input[name="'+multiGroups[n]+'"][value="'+v+'"]');if(cb)cb.checked=true});continue}var g=document.getElementById('gap'+n);if(g)g.value=state[n];var s=document.getElementById('sel'+n);if(s)s.value=state[n];var r=document.querySelector('input[name="q'+n+'"][value="'+state[n]+'"]');if(r)r.checked=true}}
function answered(n){return !!state[n]||!!val(n)}
function count(p){var r=ranges[p],c=0;for(var i=r[0];i<=r[1];i++)if(answered(i))c++;return c}
function drawFooter(){save();var h='';[1,2,3].forEach(p=>{var r=ranges[p];h+='<div class="partnav"><button class="partlabel" data-part="'+p+'">Part '+p+'</button>';if(p===active){h+='<div class="tiles">';for(var n=r[0];n<=r[1];n++)h+='<button class="tile '+(answered(n)?'answered':'')+'" data-q="'+n+'">'+n+'</button>';h+='</div>'}else h+='<span class="count">'+count(p)+' of '+(r[1]-r[0]+1)+'</span>';h+='</div>'});h+='<button class="review" id="review">OK</button>';footer.innerHTML=h}
document.addEventListener('change',()=>{save();drawFooter()});document.addEventListener('input',()=>{save();drawFooter()});
var lastScore=null;
function renderActive(){left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();if(graded){regradeCurrent();right.insertAdjacentHTML('afterbegin','<div class="score">Your score: <b>'+lastScore+' / 40</b></div><p style="margin:-8px 0 18px;color:#555">Explanations with the exact location in the passage are shown below each answer. Switch Part 1/2/3 tabs to review the rest.</p>')}drawFooter();left.scrollTop=right.scrollTop=0}
footer.onclick=e=>{var p=e.target.closest('[data-part]');if(p){save();active=+p.dataset.part;renderActive();return}var q=e.target.closest('[data-q]');if(q){var n=+q.dataset.q;(document.getElementById('q'+n)||document.getElementById('gap'+n)||document.getElementById('sel'+n))?.scrollIntoView({behavior:'smooth',block:'center'});return}if(e.target.closest('#review'))review()};
function review(){save();var a=0;for(var n=1;n<=40;n++)if(answered(n))a++;subwrap.innerHTML='<p>You have answered <b>'+a+'</b> of 40 questions.</p><p><button class="ovrow submit" id="final">Submit test</button></p>';final.onclick=grade;submit.classList.add('show')}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function correct(n,v){if(multiGroups[n]){var parts=(v||'').split(',').map(norm).filter(Boolean);return parts.includes(norm(answers[n]))}return [answers[n]].concat(alt[n]||[]).some(a=>norm(a)===norm(v))}
function explHTML(n){var e=EXPL[n];if(!e)return '';return '<div class="expl"><b>Q'+n+' — correct answer: '+answers[n]+'</b> &nbsp;<span class="expl-loc">('+e.loc+')</span><br>'+e.text+'</div>'}
function markGap(n){var x=document.getElementById('gap'+n);if(!x)return;var ok=correct(n,x.value);x.disabled=true;x.classList.add(ok?'ok':'no');x.insertAdjacentHTML('afterend',(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>')+explHTML(n));return ok}
function markSel(n){var s=document.getElementById('sel'+n);if(!s)return;var ok=correct(n,s.value);s.disabled=true;s.classList.add(ok?'ok':'no');var row=document.getElementById('q'+n);var tag=(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>');if(row){row.insertAdjacentHTML('beforeend',tag);row.insertAdjacentHTML('afterend',explHTML(n))}else{s.insertAdjacentHTML('afterend',tag);var host=s.closest('p')||s;host.insertAdjacentHTML('afterend',explHTML(n))}return ok}
function markRadio(n){var r=document.querySelector('input[name="q'+n+'"]:checked');var ok=r&&correct(n,r.value);document.querySelectorAll('input[name="q'+n+'"]').forEach(i=>i.disabled=true);var box=document.getElementById('q'+n);box.insertAdjacentHTML('beforeend',(ok?'<span class="tag ok">\u2713</span>':'<span class="tag no">\u2718 correct: '+answers[n]+'</span>'));box.insertAdjacentHTML('afterend',explHTML(n));return ok}
function markMulti(group){var qNums=groupQNums[group];var boxes=document.querySelectorAll('input[name="'+group+'"]');var checkedVals=Array.from(boxes).filter(function(b){return b.checked}).map(function(b){return b.value});boxes.forEach(function(b){b.disabled=true});var container=document.getElementById('q_'+group);var tagHtml='';qNums.forEach(function(qn){var ok=checkedVals.includes(answers[qn]);tagHtml+=' '+(ok?'<span class="tag ok">Q'+qn+' \u2713</span>':'<span class="tag no">Q'+qn+' \u2718 correct: '+answers[qn]+'</span>')});container.insertAdjacentHTML('beforeend','<div style="margin-top:8px;">'+tagHtml+'</div>');var explAll='';qNums.forEach(function(qn){explAll+=explHTML(qn)});container.insertAdjacentHTML('afterend',explAll)}
function regradeCurrent(){var r=ranges[active];var doneGroups={};for(var n=r[0];n<=r[1];n++){if(multiGroups[n]){if(!doneGroups[multiGroups[n]]){markMulti(multiGroups[n]);doneGroups[multiGroups[n]]=true}continue}var g=document.getElementById('gap'+n),s=document.getElementById('sel'+n),rad=document.querySelector('input[name="q'+n+'"]');if(g)markGap(n);else if(s)markSel(n);else if(rad)markRadio(n)}}
function grade(){if(graded)return;save();var score=0;for(var n=1;n<=40;n++)if(correct(n,state[n]||''))score++;lastScore=score;graded=true;active=1;renderActive();submit.classList.remove('show')}
var drag=false;div.onmousedown=()=>{drag=true;document.body.style.userSelect='none'};window.onmouseup=()=>{drag=false;document.body.style.userSelect=''};window.onmousemove=e=>{if(!drag)return;var r=split.getBoundingClientRect();left.style.width=Math.max(220,Math.min(r.width-240,e.clientX-r.left))+'px'};
split.onmouseup=()=>setTimeout(()=>{var s=getSelection();if(!s||s.isCollapsed||!s.rangeCount){tools.style.display='none';return}var rg=s.getRangeAt(0);if(!split.contains(rg.commonAncestorContainer)){tools.style.display='none';return}var rc=rg.getBoundingClientRect();tools.style.display='flex';tools.style.left=(rc.left+scrollX)+'px';tools.style.top=Math.max(8,rc.top+scrollY-42)+'px'},1);
tools.onclick=e=>{var b=e.target.closest('button'),s=getSelection();if(!b||!s.rangeCount)return;var rg=s.getRangeAt(0);if(b.dataset.act==='hl'){try{var sp=document.createElement('span');sp.className='hl';rg.surroundContents(sp)}catch(_){document.execCommand('hiliteColor',false,'#ffe45c')}}else document.querySelectorAll('.hl').forEach(h=>h.replaceWith(document.createTextNode(h.textContent)));s.removeAllRanges();tools.style.display='none'};
render();
// ---- Bridge added for the mock exam orchestrator ----
window.__mockForceGrade = grade;
window.__mockGetResult = function () {
  if (!graded) return null;
  var answers = {}, key = {};
  for (var n = 1; n <= 40; n++) {
    answers[n] = state[n] || '';
    key[n] = DATA.answers[n];
  }
  return { score: lastScore, total: 40, answers: answers, key: key };
};
})();
</script></body></html>
