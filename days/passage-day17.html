var DATA = {"passages": {"1": "<h1>The importance of Business Cards</h1>\n<p class=\"sub\">The exchanging of business cards is as close to a universal ritual as you can find in the business world.</p>\n<p>The ritual may be universal, but the details of business cards and how they are swapped vary across countries. Americans throw their cards casually across a table; the Japanese make the exchange of cards a formal ceremony. While there are cards that are discreet and understandable, others are crammed full of details and titles. Some businesspeople hand out 24-carat gold cards, and there are kindergarten children who have cards with not only their own contact details, but also with the job descriptions of their parents and even grandparents. This practice has become so common in parts of New York, for example, that the use of such cards is now prohibited by some of these institutions.</p>\n<p>Cards have been around a long time in one form or another. The Chinese invented calling cards in the 15th century to give people notice that they intended to pay them a visit, but these were for social purposes only. Then, in the 17th century, European businesspeople invented a new type of card to act as miniature advertisements, signaling the advent of the business card. In today's world, business cards can cause people to have strong emotional reactions. According to one experienced company director, very few things can provoke more heated discussion at a board meeting than the composition of the company's business cards.</p>\n<p>Lots of companies try to promote themselves. One famous toy company give out little plastic figures with their contact details stamped on them. One fast food company has business cards which are shaped like a portion of French fries. A Canadian divorce lawyer once gave out cards that could be torn in two — one half for each of the spouses. For many business commentators, such gimmicky business cards prove that the use of a physical business card is nearly at an end. After all, why bother exchanging bits of thick paper at all when you can simply swap electronic versions by smartphone.</p>\n<p>However, one can just as well argue the opposite: that business cards are here to stay, and in a business world full of meetings and correspondence, it is more important than ever that your card is unique. Attempts to reinvent business cards for the digital age have not been successful. Even at the latest technology conferences, people still greet each other by handing out little rectangles made from paper rather than using a digital alternative.</p>\n<p>To understand business cards, it is necessary to understand how business works. The fact that business cards are thriving in a digital age is a forceful reminder that there is much about business that is timeless. According to Kate Jones, a business lecturer, there is one eternal and inescapable issue. Her 2006 study of more than 200 business executives in North America found that trust was the key element for running a successful business. It is vital to be able to look someone in the eye and decide what sort of person they are. In this way, you can transform acquaintanceships into relationships. A good proportion of business life will always be about building social connections — having dinner or playing sport with clients and colleagues — and while computers can deal with administrative tasks, it is still human beings that have to focus on the emotional.</p>\n<p>The rapid advance of globalization means that this relationship building process is becoming ever more demanding. Managers have to put more effort in when dealing with international counterparts, especially when there is not a common language, which is so often the case these days. A recent UK survey showed that chief executives of global organizations now routinely spend three out of every four weeks on international travel. It is in these situations that business cards are doubly useful, as they are a quick way of establishing connections. Cards can also remind you that you have actually met someone in a face-to-face meeting rather than just searched for them on the internet. Looking through piles of different cards can enhance your memory in ways that simply looking through uniform electronic lists would never do.</p>\n<p>Janet McIntyre is a leading expert on business cards in today's world. She maintains that as companies become more complex, cards are essential in determining the exact status of every contact you meet in multinational corporations. Janet also explains how exchanging business cards can be an effective way of initiating a conversation, because it gives people a ritual to follow when they first meet a new business contact.</p>\n<p>The business world is obsessed with the idea of creating and inventing new things that will change the way we do everything, and this does lead to progress. But there are lots of things that do not need to be changed and in Janet McIntyre's view, tradition also has an equally valuable role to play. Therefore, the practice of exchanging business cards is likely to continue in the business world.</p>", "2": "<h1>Antarctic research</h1>\n<p class=\"sub\">Thirteen nations took part in the recent International Polar Year</p>\n<div class=\"para\">A</div>\n<p>New Zealand's contribution to International Polar Year was a 52-day voyage by the ship Tangaroa in order to conduct research in Antarctica's Ross Sea. Lead scientist Mary Livingston emphasizes just what a multi-faceted expedition this was, bringing together zoologists, oceanographers, meteorologists and other scientists from the Ministry of Fisheries, the National Institute for Water and Atmospheric Research, the National Museum and various universities, to study life beneath the seas of Antarctica. Competition for berths – the ship can carry 44 people, including 13 crew – was fierce. Voyage leader Stu Hanchet says, 'We could have filled the science positions four times over … we had so many people requesting a berth … We ended up with a really strong team.'</p>\n<div class=\"para\">B</div>\n<p>It would be hard to overstate how hostile the Antarctic environment is for scientists. The Tangaroa's captain, Graham Leachman, explains that the Ross Sea is subject to katabatic winds* that sweep down off the Antarctic continent to create rough seas. Another danger is the possibility of the ship colliding with floating ice. 'Even though the ship's officers use all sorts of high-tech equipment … none of it can tell you how thick the ice is,' says Leachman, 'and you still can't beat looking out of the window.' In the dark, he says, you can't tell how thick ice is, but if you can see its color, it's possible to estimate. This is why he prefers sailing in summer, when the hours of daylight in these high latitudes are longest, even though this plays tricks with his passengers' body clocks.</p>\n<div class=\"para\">C</div>\n<p>Analysis of what the expedition found continues, but it's likely that several new species have been discovered and numerous other secrets revealed of life 3000 meters below the surface. 'We have collected huge worms and strange crustaceans,' says Livingston, 'but most impressive of all were the starfish that measured more than half a meter across – that's most abnormal for creatures belonging to this species.' This phenomenon of Antarctic seas is called 'gigantism' – the fact that some species grow to unusually large sizes. Livingston suggests various possible causes for gigantism including the extreme cold, few predators and high levels of oxygen in the sea water, but as yet no final determination can be made. Another interesting discovery was that in some places every inch of the sea floor was covered with life, whereas elsewhere icebergs have scoured out deep scars and ravines in the sea floor as they go by.</p>\n<div class=\"para\">D</div>\n<p>By using deep-sea trawl nets, high-definition cameras and water samplers, the team has revealed that many of the creatures that live at extreme depths have a bizarre appearance. Among them were spotted tunicates, plankton-eating animals that are slender structures that appear to be fashioned from glass. The most fearsome-looking fish was the south ocean daggertooth, a species that is 'monocyclic', meaning the fish die after the first spawning. They are also unusual for being capable of shedding their teeth and growing a new set. Another predatory fish brought to the surface was the stareater, an extraordinary species that has an appendage like a piece of cord hanging from its chin. In these deep, dark waters, this glows red and attracts prey to swim within striking distance. Just as impressive and much more beautiful were the basket stars, a species related to starfish that lives on the seabed. The basket stars' five arms branch out numerous times to form a spectacular fan-like structure which they turn to face into the current so that food is brought into their embrace.</p>\n<div class=\"para\">E</div>\n<p>But whatever exciting discoveries were made, everyday life onboard ship in the Ross Sea is unrelenting. Most people share a cabin with one other person – they're allocated so that as one person begins their 12 hours off duty, the other occupant is starting work on deck. The fresh food runs out in a few days and after that most provisions are frozen, canned or dried. Expedition general manager Fred Smits recognizes that the cook has an essential role in ensuring the well-being of those onboard. 'When you are at sea for so long,' he says, 'you think a lot about your next meal.'</p>\n<div class=\"para\">F</div>\n<p>Perhaps most controversially, one of the precious berths on the Tangaroa was taken up by cameraman Max Quinn, who filmed a documentary about the voyage. Quinn's inclusion wasn't welcomed at first. 'Scientists by nature,' Livingston says, 'tend to be camera-shy and quiet. They're not into having cameras there, so it was difficult getting everyone's permission and agreement.' But in the end Quinn fitted in very well. 'The trick,' he says, 'is to mostly film the scientists at work, in their professional roles … rather than eating their breakfast.' He knows when not to intrude. The documentary is a window on a trip few people get to make and also a peek into what research really looks like. 'Science,' says Livingston, 'is intrepid, more so than people realize. It's not necessarily examining dry samples in the laboratory, but can also mean braving the elements on deck. That's what the documentary captures, the sense of real people with real lives.'</p>", "3": "<h1>Is artificial intelligence a threat?</h1>\n<p class=\"sub\">Science correspondent Gary Marcus gives his views on whether we should be concerned about the future development of artificial intelligence</p>\n<p>If the latest reports are accurate, artificial intelligence (AI) is moving so fast it seems almost 'magical.' Self-driving cars have arrived; computers can listen to your voice and find the nearest movie theatre for you; there may soon be computers training medical students, and eventually helping diagnose patients. Scarcely a month goes by without the announcement of a new AI product or technique. Yet, it may be too soon to express such enthusiasm: we still haven't produced machines with common sense, natural language processing, or the ability to create other machines. Our efforts at directly simulating human brains remain primitive.</p>\n<p>However, the only real difference between enthusiasts and sceptics is the time frame. The futurist and inventor Ray Kurzweil thinks true, human-level AI will arrive in less than two decades. I'd predict that it will be at least double that, given how the challenges in building AI, especially at the software level, are much greater than Kurzweil admits. But in the future, nobody will care about how long it took, only what happened next. It's likely that machines will be smarter than us at almost everything in a century from now. There might be a few jobs left for entertainers, writers, and other creative types, but computers will eventually be able to program themselves and reason in ways that we can only dimly imagine. And they will be able to do it every second of every day, without sleep or coffee breaks.</p>\n<p>For many, this vision of the future is inspiring. Ray Kurzweil has written about the point when AI becomes more intelligent than humans and speculated that we may then replace our brains with computers and modify our bodies with robotic enhancements; scientist and entrepreneur Peter Diamandis has argued that advances in AI will bring in a new era of 'abundance,' with enough food, water, and consumer gadgets for all. However, even if you put aside the worries about what super-advanced AI might do to the labor market, there's another concern: that powerful AI might ultimately battle us for the control of resources. Most people dismiss such fears, believing them to be the result of the over-influence of science-fiction movies. To the extent that people plan for the medium-term future, they worry about asteroids, the decline of fossil fuels, and global warming, not robots taking over the world.</p>\n<p>But a new book by writer and documentary filmmaker James Barrat argues we should be at least slightly worried. Barrat's core argument is that the drive for self-preservation and resource acquisition may be inherent in all goal-driven systems with a certain degree of intelligence. A purely rational artificial intelligence might expand 'its idea of self-preservation to include proactive attacks on future threats', including, presumably, people who might be unwilling to surrender their assets to the machine. Barrat worries that without precise and detailed instructions, AI might go to extremes we'd consider ridiculous to fulfil its goals, perhaps taking control of all the world's energy supplies in order to maximize whatever calculation it was interested in.</p>\n<p>Of course, one could try to ban super-intelligent computers altogether. But the competitive advantage of every advance in automation is so strong that many share my suspicion that passing laws forbidding such things will guarantee that someone else develops the technology in secret or in another country.</p>\n<p>If machines eventually overtake us, as virtually everyone in the AI field believes they will, the key question is about values: how we instil them in machines, and how we negotiate with machines if their values differ greatly from our own. Some argue it would be wrong to assume that a super-intelligent machine will share the values we typically associate with human beings, such as kindness and empathy. Research might one day show that constructing a super-intelligence that has certain of these attitudes is possible, but the replication of the full range of human attributes seems unlikely – it is certainly technically easier to build a machine that is solely concerned with numbers and data. The cyberneticist Kevin Warwick was also right to ask how we can understand AI when its 'thinking' will occur in dimensions humans cannot conceive of.</p>\n<p>It is important to realize that the machines' objectives may well alter as they get smarter. Once computers can effectively reprogram themselves, and therefore constantly develop themselves, the risk of machines outwitting humans in battles for resources cannot be dismissed. AI entrepreneur Danny Hillis believes we are close to one of the greatest transitions in the history of biological evolution, and that we are not fully aware of the capabilities of what we are in the process of creating. Already, advances in AI have created risks that we never dreamt of. Thanks to the internet, a huge amount of data is being collected about us and being fed to algorithms to make predictions about our behavior as consumers, for example. Worryingly, people don't always know what information is being gathered or even that it is accurate. Although this subject now sparks a great deal of argument and is a cause for concern, few people thought about it seriously until recently. So, what other risks lie ahead? Nobody really knows.</p>"}, "answers": {"1": "TRUE", "2": "FALSE", "3": "TRUE", "4": "NOT GIVEN", "5": "TRUE", "6": "trust", "7": "computers", "8": "language", "9": "travel", "10": "memory", "11": "status", "12": "conversation", "13": "tradition", "14": "D", "15": "B", "16": "A", "17": "F", "18": "starfish", "19": "predators", "20": "icebergs", "21": "glass", "22": "teeth", "23": "chin", "24": "F", "25": "G", "26": "B", "30": "A", "31": "C", "32": "C", "33": "D", "34": "D", "35": "YES", "36": "NO", "37": "NOT GIVEN", "38": "NO", "39": "NOT GIVEN", "40": "YES", "41": "E", "42": "G", "43": "C", "44": "A", "45": "H"}, "alt": {"10": ["memories"]}, "expl": {"1": {"loc": "Para 2", "text": "'This practice has become so common in parts of New York... that the use of such cards is now prohibited by some of these institutions' refers back to kindergarten children's cards → TRUE."}, "2": {"loc": "Para 3", "text": "The Chinese calling cards 'were for social purposes only'; it was 17th-century Europeans who invented the card 'signaling the advent of the business card' → FALSE."}, "3": {"loc": "Para 3", "text": "'very few things can provoke more heated discussion at a board meeting than the composition of the company’s business cards' → TRUE."}, "4": {"loc": "Para 4", "text": "The toy company example is given, but no sales figures or increase is mentioned → NOT GIVEN."}, "5": {"loc": "Para 4", "text": "'such gimmicky business cards prove that the use of a physical business card is nearly at an end' → TRUE."}, "6": {"loc": "Para 6, Kate Jones", "text": "'trust was the key element for running a successful business' → 'trust'."}, "7": {"loc": "Para 6", "text": "'while computers can deal with administrative tasks, it is still human beings that have to focus on the emotional' → 'computers'."}, "8": {"loc" function mcq(n,t,opts){return '<div class="mcq" id="q'+n+'"><div class="prompt"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="choice-options">'+opts.map((o,i)=>'<label class="choice-option"><input type="radio" name="q'+n+'" value="'+'ABCD'[i]+'"> <b>'+'ABCD'[i]+'</b> '+o+'</label>').join('')+'</div></div>'}
function qhtml(p){
if(p===1)return '<div class="qgroup"><h3>Questions 1-5</h3><p><i>Do the following statements agree with the information given in the passage? Write <b>TRUE / FALSE / NOT GIVEN</b>.</i></p>'+tf(1,'Children’s business cards have been banned in some kindergartens.')+tf(2,'It was the Chinese who first began the practice of using business cards.')+tf(3,'Designing business cards can be a controversial process for some companies.')+tf(4,'A famous toy company has boosted their sales by using one type of unusual card.')+tf(5,'Some business commentators predict a decline in the use of paper business cards.')+'</div><div class="qgroup"><h3>Questions 6-13</h3><p><i>Complete the notes below. Choose <b>ONE WORD ONLY</b> from the passage for each answer.</i></p><div class="notes"><h3>How business works</h3><div class="note-row"><b>Kate Jones’s research</b></div><div class="note-row">&bull; The most important aspect of business is having '+gap(6)+' in others.</div><div class="note-row">&bull; '+gap(7)+' do not have the ability to establish the good relationships essential to business.</div><div class="note-row"><b>Business and globalization</b></div><div class="note-row">&bull; Managers must work harder when they don’t share the same '+gap(8)+' with their contacts.</div><div class="note-row">&bull; A UK survey indicates that '+gap(9)+' takes up the largest part of business leaders’ time.</div><div class="note-row">&bull; A business person’s '+gap(10)+' of a meeting can be improved by looking at business cards.</div><div class="note-row"><b>Janet McIntyre</b></div><div class="note-row">&bull; Business cards clearly show the '+gap(11)+' of each person in a large company.</div><div class="note-row">&bull; The ritual of swapping business cards is a good way of starting a '+gap(12)+' at the beginning of a business relationship.</div><div class="note-row">&bull; Janet feels that in the business world, '+gap(13)+' is just as important as innovation.</div></div></div>';
if(p===2)return '<div class="qgroup"><h3>Questions 14-17</h3><p><i>Reading Passage 2 has six paragraphs, A–F. Which paragraph contains the following information?</i></p>'+sel(14,'details of some equipment used by the scientists',['A','B','C','D','E','F'])+sel(15,'a description of the challenging sailing conditions in Antarctica',['A','B','C','D','E','F'])+sel(16,'information about the composition of the scientific group',['A','B','C','D','E','F'])+sel(17,'the identity of a potentially unpopular person on the ship',['A','B','C','D','E','F'])+'</div><div class="qgroup"><h3>Questions 18-23</h3><p><i>Complete the summary below. Choose <b>ONE WORD ONLY</b> from the passage for each answer.</i></p><p class="summary-text"><b>The expedition’s findings</b><br>Analysis continues of the expedition’s remarkable discoveries, including a '+gap(18)+', very notable for its unusual width. The reasons why creatures grow so large at great depths in Antarctica may include the highly oxygenated water, the temperature, or the small number of '+gap(19)+'. A further fascinating finding was the existence of canyons in the seabed caused by passing '+gap(20)+'. Many creatures living at great depth look very strange, such as tunicates, which seem to be made of '+gap(21)+'. One frightening-looking fish species is characterized by loss of its '+gap(22)+' and the fact that it spawns only once. Another fish has something like a length of string attached to its '+gap(23)+' that assists with hunting.</p></div><div class="qgroup"><h3>Questions 24-26</h3><p>Look at the following people and the list of opinions below. Match each person with the correct opinion.</p><div class="box"><b>A</b> The repetitive food was one of the hardships of the voyage.<br><b>B</b> Respecting your subjects’ privacy gets the best results.<br><b>C</b> The summer is the best time to sail these waters.<br><b>D</b> The kitchen is one of the most important parts of the ship.<br><b>E</b> Being separated from family was difficult.<br><b>F</b> The nature of scientific work may surprise some people.<br><b>G</b> More applications to join the group were received than there were places.</div>'+sel(24,'Mary Livingston',['A','B','C','D','E','F','G'])+sel(25,'Stu Hanchet',['A','B','C','D','E','F','G'])+sel(26,'Max Quinn',['A','B','C','D','E','F','G'])+'</div>';
return '<div class="qgroup"><h3>Questions 30-34</h3><p>Choose the correct letter, A, B, C or D.</p>'+mcq(30,'What does the writer suggest about the excitement surrounding AI?',['It stems from assumptions that are premature.','It may soon be replaced by widespread anxiety.','It is the result of computers having unforeseen capabilities.','It is unlikely to continue if the speed of change slows down.'])+mcq(31,'What does the writer say about Ray Kurzweil?',['He has revised his predictions about AI on reconsidering them.','He has convinced people critical of AI to reconsider their views.','He has underestimated the technical difficulties in developing AI.','He has reassessed his view about the length of time AI takes to develop.'])+mcq(32,'The writer thinks that in a hundred years’ time,',['even those in creative professions will be replaced by AI.','people will have lost interest in trying to develop ever-better AI.','AI will have capabilities which are almost impossible to predict.','people will continue to be nervous about progress in AI development.'])+mcq(33,'What is the writer doing in the third paragraph?',['describing how AI will improve the quality of life in the future','explaining why some experts’ fears about AI currently seem unnecessary','warning that a focus on AI distracts us from more important issues','suggesting that the public do not consider conflict with AI a serious possibility'])+mcq(34,'Barrat takes the view that, in the future, AI will',['be increasingly unlikely to obey instructions.','be incapable of setting realistic goals for itself.','struggle to solve problems independently of humans.','have a tendency to seek to gain control of resources.'])+'</div><div class="qgroup"><h3>Questions 35-40</h3><p><i>Do the following statements agree with the views of the writer? Write <b>YES / NO / NOT GIVEN</b>.</i></p>'+tf(35,'There is almost complete agreement among AI experts about the potential of AI to outperform humans.',true)+tf(36,'Restricting the further development of super-intelligent computers is an idea that should be considered.',true)+tf(37,'Too little research has been done on how to give machines human values.',true)+tf(38,'It is reasonable to think that a super-intelligent machine could have the same characteristics as a human.',true)+tf(39,'Scientists should focus on constructing machines that process numbers and data in completely new ways.',true)+tf(40,'In the future, humans are unlikely to be able to comprehend the cognitive processes of AI.',true)+'</div><div class="qgroup"><h3>Questions 41-45</h3><p><i>Complete the summary using the list of words, A–I, below.</i></p><div class="box"><b>A</b> data collection &nbsp; <b>B</b> opportunities &nbsp; <b>C</b> biological evolution &nbsp; <b>D</b> technological challenge &nbsp; <b>E</b> goals<br><b>F</b> abilities &nbsp; <b>G</b> self-improvement &nbsp; <b>H</b> controversial issue &nbsp; <b>I</b> scientific solution</div><p class="summary-text"><b>Unknown dangers?</b><br>As artificial intelligence becomes more sophisticated, its '+selInline(41,['A','B','C','D','E','F','G','H','I'])+' are likely to change. When it reaches the point at which limitless '+selInline(42,['A','B','C','D','E','F','G','H','I'])+' is possible, it may start to challenge humans for resources. Humans may face a major turning point in their '+selInline(43,['A','B','C','D','E','F','G','H','I'])+' and have very little idea about the potential AI has, and so underestimate the risks. A useful comparison can be made with '+selInline(44,['A','B','C','D','E','F','G','H','I'])+' – when the internet was first launched, nobody thought this would become a '+selInline(45,['A','B','C','D','E','F','G','H','I'])+'.</p></div>';
}

function render(){partTitle.textContent='Part '+active;var r=ranges[active];partSub.textContent='Read the text and answer questions '+r[0]+'-'+r[1]+'.';left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();drawFooter();left.scrollTop=right.scrollTop=0}
function val(n){var g=document.getElementById('gap'+n);if(g)return g.value;var s=document.getElementById('sel'+n);if(s)return s.value;var r=document.querySelector('input[name="q'+n+'"]:checked');return r?r.value:''}
function save(){for(var n=1;n<=40;n++){var v=val(n);if(v)state[n]=v}}
function restore(){for(var n=1;n<=40;n++){if(!state[n])continue;var g=document.getElementById('gap'+n);if(g)g.value=state[n];var s=document.getElementById('sel'+n);if(s)s.value=state[n];var r=document.querySelector('input[name="q'+n+'"][value="'+state[n]+'"]');if(r)r.checked=true}}
function answered(n){return !!state[n]||!!val(n)}
function count(p){var r=ranges[p],c=0;for(var i=r[0];i<=r[1];i++)if(answered(i))c++;return c}
function drawFooter(){save();var h='';[1,2,3].forEach(p=>{var r=ranges[p];h+='<div class="partnav"><button class="partlabel" data-part="'+p+'">Part '+p+'</button>';if(p===active){h+='<div class="tiles">';for(var n=r[0];n<=r[1];n++)h+='<button class="tile '+(answered(n)?'answered':'')+'" data-q="'+n+'">'+n+'</button>';h+='</div>'}else h+='<span class="count">'+count(p)+' of '+(r[1]-r[0]+1)+'</span>';h+='</div>'});h+='<button class="review" id="review">OK</button>';footer.innerHTML=h}
document.addEventListener('change',()=>{save();drawFooter()});document.addEventListener('input',()=>{save();drawFooter()});
var lastScore=null;
function renderActive(){left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();if(graded){regradeCurrent();right.insertAdjacentHTML('afterbegin','<div class="score">Your score: <b>'+lastScore+' / 40</b></div><p style="margin:-8px 0 18px;color:#555">Explanations with the exact location in the passage are shown below each answer. Switch Part 1/2/3 tabs to review the rest.</p>')}drawFooter();left.scrollTop=right.scrollTop=0}
footer.onclick=e=>{var p=e.target.closest('[data-part]');if(p){save();active=+p.dataset.part;renderActive();return}var q=e.target.closest('[data-q]');if(q){var n=+q.dataset.q;(document.getElementById('q'+n)||document.getElementById('gap'+n)||document.getElementById('sel'+n))?.scrollIntoView({behavior:'smooth',block:'center'});return}if(e.target.closest('#review'))review()};
function review(){save();var a=0;for(var n=1;n<=40;n++)if(answered(n))a++;subwrap.innerHTML='<p>You have answered <b>'+a+'</b> of 40 questions.</p><p><button class="ovrow submit" id="final">Submit test</button></p>';final.onclick=grade;submit.classList.add('show')}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function correct(n,v){return [answers[n]].concat(alt[n]||[]).some(a=>norm(a)===norm(v))}
function explHTML(n){var e=EXPL[n];if(!e)return '';return '<div class="expl"><b>Q'+n+' — correct answer: '+answers[n]+'</b> &nbsp;<span class="expl-loc">('+e.loc+')</span><br>'+e.text+'</div>'}
function markGap(n){var x=document.getElementById('gap'+n);if(!x)return;var ok=correct(n,x.value);x.disabled=true;x.classList.add(ok?'ok':'no');x.insertAdjacentHTML('afterend',(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>')+explHTML(n));return ok}
function markSel(n){var s=document.getElementById('sel'+n);if(!s)return;var ok=correct(n,s.value);s.disabled=true;s.classList.add(ok?'ok':'no');var row=document.getElementById('q'+n);var tag=(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>');if(row){row.insertAdjacentHTML('beforeend',tag);row.insertAdjacentHTML('afterend',explHTML(n))}else{s.insertAdjacentHTML('afterend',tag);var host=s.closest('p')||s;host.insertAdjacentHTML('afterend',explHTML(n))}return ok}
function markRadio(n){var r=document.querySelector('input[name="q'+n+'"]:checked');var ok=r&&correct(n,r.value);document.querySelectorAll('input[name="q'+n+'"]').forEach(i=>i.disabled=true);var box=document.getElementById('q'+n);box.insertAdjacentHTML('beforeend',(ok?'<span class="tag ok">\u2713</span>':'<span class="tag no">\u2718 correct: '+answers[n]+'</span>'));box.insertAdjacentHTML('afterend',explHTML(n));return ok}
function regradeCurrent(){var r=ranges[active];for(var n=r[0];n<=r[1];n++){var g=document.getElementById('gap'+n),s=document.getElementById('sel'+n),rad=document.querySelector('input[name="q'+n+'"]');if(g)markGap(n);else if(s)markSel(n);else if(rad)markRadio(n)}}
function grade(){if(graded)return;save();var score=0;for(var n=1;n<=40;n++)if(correct(n,state[n]||''))score++;lastScore=score;graded=true;active=1;renderActive();submit.classList.remove('show')}
var drag=false;div.onmousedown=()=>{drag=true;document.body.style.userSelect='none'};window.onmouseup=()=>{drag=false;document.body.style.userSelect=''};window.onmousemove=e=>{if(!drag)return;var r=split.getBoundingClientRect();left.style.width=Math.max(220,Math.min(r.width-240,e.clientX-r.left))+'px'};
split.onmouseup=()=>setTimeout(()=>{var s=getSelection();if(!s||s.isCollapsed||!s.rangeCount){tools.style.display='none';return}var rg=s.getRangeAt(0);if(!split.contains(rg.commonAncestorContainer)){tools.style.display='none';return}var rc=rg.getBoundingClientRect();tools.style.display='flex';tools.style.left=(rc.left+scrollX)+'px';tools.style.top=Math.max(8,rc.top+scrollY-42)+'px'},1);
tools.onclick=e=>{var b=e.target.closest('button'),s=getSelection();if(!b||!s.rangeCount)return;var rg=s.getRangeAt(0);if(b.dataset.act==='hl'){try{var sp=document.createElement('span');sp.className='hl';rg.surroundContents(sp)}catch(_){document.execCommand('hiliteColor',false,'#ffe45c')}}else document.querySelectorAll('.hl').forEach(h=>h.replaceWith(document.createTextNode(h.textContent)));s.removeAllRanges();tools.style.display='none'};
render();
})();
</script></body></html>
