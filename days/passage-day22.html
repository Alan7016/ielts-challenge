var DATA = {"passages": {"1": "<h1>The Development of Exploration and Scientific Research in Antarctica</h1>\n<p>The modern scientific age in Antarctica really began with the introduction of aircraft in the 1920s. Aircraft transformed the possibilities of exploring the frozen continent around the South Pole, because before that Antarctic travel had been limited to the use of dog teams pulling sledges. A plane could survey thousands of square kilometers an hour, equivalent to a whole summer's work using previous techniques. However, the first planes in Antarctica, such as the Lockheed Vega and the Ford Trimotor, were unreliable in freezing conditions. This made polar flying particularly hazardous, since there was little chance of rescue if a plane was forced down in a remote region.</p>\n<p>It was in 1928 that Herbert Wilkins hoped to make the first flight in Antarctica, attempting to cross the continent. A further attempt in 1930 was also unsuccessful, but Wilkins' aerial photographs seemed to show that the Antarctic Peninsula was in fact an island, not part of the continent as had previously been thought. This new theory caused some excitement among geographers and cartographers. However, the British Grahamland Expedition of 1934-37 proved conclusively that the Antarctic Peninsula was attached to the rest of the continent.</p>\n<p>In 1929, the famous American pilot Richard Byrd flew over the South Pole, and another American, Lincoln Ellsworth, made a successful Antarctic flight in 1935. Although Ellsworth claimed a sector of the continent for the USA, the American government did not follow it up. In 1938, the German explorer, Alfred Ritscher, led an expedition south across the sea. Once Antarctica was reached, the aircraft that had been stored in pieces on the ship's deck was reconstructed. The aeroplane was then launched and used to stake a claim to one section of Antarctica by dropping thousands of tiny flags from the air.</p>\n<p>A significant motivation behind many Antarctic expeditions right up to the 1940s was simply the spirit of adventure. Many of these expeditions had a large measure of private funding, and often the subsequent book about the expedition was a means of clearing debts incurred. The vast majority of Antarctic expeditions since 1940 have been funded by governments, usually for political reasons and scientific research.</p>\n<p>The setting up of the Research and Development Committee in Britain was a significant development in the history of science in the Antarctic. The Committee's report, published in 1920, focused particularly on the sea that circles the Antarctic continent. The report proposed detailed scientific investigations of the physiology and behavior of the whales inhabiting the region. As a result, a shore station at Grytviken on the island of South Georgia near Antarctica was occupied by scientists for six years. In addition, three research ships were commissioned. They travelled through the Southern Ocean all year, searching physical and chemical oceanography. The high quality of the specimens and data collected by scientists produced nearly 40 large volumes of reports. This entire project came to be known as the Discovery Investigations. The costs of the Discovery Investigations were completely covered by the proceeds of a tax that was placed on whaling businesses operating in the area.</p>\n<p>It was in 1875 that the idea of international scientific collaboration at the poles was first proposed, with the aim of collecting valuable data. The result was the first Polar Year in 1882-83. A second Polar Year was organized 50 years later, involving 44 nations and scientific bodies. Both of these Polar Years had been timed to coincide with a period when the sun was at its lowest level of activity, in order to monitor the impact this had. So much interest was aroused by this process that a third Polar Year was organized 25 years later. In 1951 it was decided that this scientific program should be expanded to cover the globe. This new project was renamed the International Geophysical Year (IGY). Antarctica was chosen as an area for particular attention because of its important influence on global weather. Throughout this period, politics were kept firmly in the background.</p>\n<p>The IGY took place in 1957-58 and it was during this period that the last great Antarctic journey was accomplished. Dr Vivian Fuchs' privately-funded Trans Antarctic Expedition finally achieved what the explorer Ernest Shackleton had first set out to do in 1914. Driving modified tractors, Fuchs' team traversed Antarctica from coast to coast in 99 days and covered 2,180 miles or roughly 3,500 kilometers. But there were scientific objectives as well. Because the expedition's measurements allowed the first estimates to be made of the volume of ice that existed across the whole continent. So successful was the IGY that it was extended for a further year in order to promote Antarctic science. It also led directly to the signing of a treaty by members of the international community to regulate human conduct in Antarctica over the years ahead.</p>", "2": "<h1>How to be Happy</h1>\n<p class=\"sub\">Some recent developments in the science of happiness</p>\n<div class=\"para\">A</div>\n<p>Psychiatrist Tony Fernando was walking down the street when he saw a group of young homeless men sitting on the footpath. As Fernando handed out gifts of food, he tried to video the men's reactions in his mind, recording how their gratitude lifted him in return. 'I felt warm, content, meaningful,' he says. Fernando believes the brain can be trained to make us happy and that his 'video' method is one way to achieve this. In fact, a growing body of scientific research internationally is showing how we can learn happiness in the same way we can learn to play the piano. In the soft tissue that forms the brain, there are approximately ten trillion synapses connecting roughly a hundred billion neurons. Active synapses become more sensitive, less active synapses die but new ones grow quickly. This is relatively new thinking – just 30 years ago, neuroscientists believed that adult brain cells couldn't regenerate. One of the pioneers in this field is University of Wisconsin professor Richard Davidson. He studied Buddhist monks using brain scans in his research facility, and found that those trained in meditation had higher levels of activity in the left prefrontal cortex – the area associated with happiness. Davidson believes that the trained brain is physically different from the untrained one.</p>\n<div class=\"para\">B</div>\n<p>The idea that we can train our brains to find more happiness has been called 'mindfulness' by neuropsychologist Rick Hanson, author of Hardwiring Happiness. It was in college that Hanson, quite unintentionally, first recognized the importance of something that would become his life's work. As an unconfident teenager, he discovered he could turn a small event, 'a young woman smiling at me', into a good feeling he could hold on to. To do this, Hanson employs exactly the same imaginary 'video method' as psychiatrist Tony Fernando. 'The brain takes its shape from what the mind rests upon,' says Hanson. If you keep resting your mind on self-criticism and worries, he argues, your brain will be shaped by that. Hanson explains that resting it on pleasant feelings and the things you have accomplished means that over time your brain will take on a different shape, with strength and optimism hardwired into it.</p>\n<div class=\"para\">C</div>\n<p>In New Zealand, the Mental Health Foundation runs mindfulness programs in 14 schools. Foundation CEO Judi Clements says 'it's a valuable approach because children are told to pay attention, but aren't told how to pay attention.' Preliminary results on the outcomes found that children had sustained increases in well-being. The Foundation recognizes five pathways to happiness – being active, connecting with others, taking notice, learning and giving. And, says Clements, 'We're detecting a hunger for it from different organizations and professions as well, so the Foundation is soon going to pilot an online 'well-being game' in several workplaces. The project leader is psychologist Carsten Grimm, who is interested in whether some pathways to happiness are more effective than others. In a study, Grimm recorded the activities and corresponding happiness scores of 173 people. What he found was that people who used several pathways to happiness achieved the best results, suggesting it's better to have a balance than concentrate on the single pathway you most identify with.</p>\n<div class=\"para\">D</div>\n<p>However, Associate Professor of Psychological Medicine Nathan Consedine greets our relentless search for the secrets to happiness with a tired sigh. 'The more you chase it, the less you get it,' he says, quoting studies showing those who value contentment and well-being are, in fact, less happy. The big question, he says, is whether there's any benefit in actively seeking happiness. He cites a study, for example, which showed that people who were happier were less inclined to show sympathy. Consedine says that's probably because happy people are strongly motivated to stay happy, but engaging sympathetically with others typically involves engaging with their distress, and that's going to reduce their own happiness. Consedine's not disagreeing with the theory of mindfulness, but believes there's more work to be done.</p>\n<div class=\"para\">E</div>\n<p>Some of that work is being conducted at Auckland University's Centre for Brain Research. Associate Professor Johanna Montgomery has been studying Hanson's theory – that altering our brain activity at a synaptic level affects our behavior. She accepts that it's a logical explanation based on studies from animals, but we haven't yet got the technology to prove it scientifically in humans. It's true that MRI scans certainly do indicate an increased flow of blood to different areas of the brain which are experiencing positive stimuli. However, she warns that this is a long way from confirming that the brain itself is developing or strengthening.</p>\n<div class=\"para\">F</div>\n<p>Nonetheless, Montgomery believes she is making progress. In the laboratory, when scientists want to experiment with synaptic connections, they stimulate the brain with electricity, as this copies the high-frequency firings that happen normally in the brain every second. Using this technique, Montgomery has made a number of findings. For example, the hormones that are released routinely in response to good or bad situations – such as adrenaline – act to regulate the brain, in the same way that weather has a regulating effect on human activity more generally. But scientists understand some of these stimuli better than others. More is known about the impact on brain activity of prolonged periods of fear than the effects of 'happiness' hormones that are released by positive events in life. This is one potentially important area that she hopes to investigate further in future.</p>", "3": "<h1>Research into the effects of different teaching styles</h1>\n<div class=\"para\">A</div>\n<p>Prior to 1960, most inquiries into pupils' learning skills explored the relationship between factors such as children's social background, personality or measured intelligence and their achievement in various school subjects. Studies of teachers were largely a quest for criteria of effectiveness, and numerous investigations sought links between personality or attitude and 'success' at teaching. By 1950, Domas and Tiedeman were able to survey 672 such studies of teacher effectiveness. Yet there was widespread disappointment with such research, partly because so little of value seemed to emerge. First of all, there was little agreement about what constituted 'good' teaching or who the good teachers were. Secondly, there were numerous conflicting and contradictory findings. No sooner had one investigator found a relationship which appeared to be significant, than another discovered the opposite effect.</p>\n<div class=\"para\">B</div>\n<p>For example, in 1945, two American researchers, Rostker and Rolfe, both using standardized testing techniques and broad samples of teachers, reached exactly opposite conclusions. Rostker concluded that the intelligence of the teacher is the most important single factor conditioning teaching ability, and that there is no significant relationship between personality and teaching ability. Rolfe, however, found no correlation between intelligence and teaching efficiency: he claimed that the teacher's personality was what produced good teaching. Another American writer, Barr (1961), summarized a massive amount of American research and underlined the chaos in the research literature on effectiveness: 'Some teachers were preferred by administrators, some were liked by the pupils, and some taught in classes where there were substantial pupil gains, and generally speaking these were not the same teachers.'</p>\n<div class=\"para\">C</div>\n<p>One of the earliest pieces of research dates from 1912, when Stevens made 100 random observations of lessons in a variety of subject areas, in order to analyze the number and nature of questions being asked by teachers. Stevens's overall total was 64% teacher talk and 36% pupil talk, figures which are remarkably similar to a number of findings half a century later.</p>\n<div class=\"para\">D</div>\n<p>For many years in the first half of the 20th century, so-called 'formal' teaching was the norm. Teachers taught their classes as a whole group, gave out information, asked questions which predominantly required factual recall, and frequently set a common written task for the children to complete in a prescribed period of time. It was hardly surprising, therefore, that one focus of classroom interaction research in the decades following Stevens's inquiry was on the phenomenon of 'attentiveness'. A number of studies in the 1920s and 1930s, by Morrison and others, sought relationships between the degree of attention being paid by children and the amount they subsequently appeared to have learnt. Such research was usually based on observing teachers at work, a technique which was also employed extensively by United States administrators in the 1920s and 1930s, in order to assess teachers' competence and allocate merit payments to so-called 'superior' teachers.</p>\n<div class=\"para\">E</div>\n<p>As the 1930s came to an end, it was partly the emergence of totalitarian regimes in Europe which led to a shift in interest in the United States away from attentiveness, with its emphasis on the authority of the teacher, and towards a scrutiny of authoritarianism itself. A number of people began to feel that if dictatorship were to be avoided, children must learn in school how to handle democracy. Several investigators examined the processes taking place within small discussion groups, and tried to establish superiority for discussion groups over lecture classes, but with conflicting results. The movement towards what was becoming known as child-centered education was gathering momentum, and as interest in child development increased, investigators began to discover the usefulness of direct observation and the categorization of child behavior.</p>\n<div class=\"para\">F</div>\n<p>This was when systematic observation of teacher-pupil interaction began in earnest. Anderson (1939) studied what he called 'domination' and 'integration' amongst kindergarten children. Dominative acts by children included blaming and snatching toys, and such acts by teachers included restricting children's activities; while children's integrative acts included sharing facilities and playing harmoniously, and those of teachers included expanding opportunities for self-direction and co-operation. Anderson then attempted to measure what is now commonly called 'classroom climate'.</p>\n<div class=\"para\">G</div>\n<p>Lewin, Lippitt and White (1939 and 1943) studied the effects of different teaching styles. They arranged for three groups of five boys each to be taught in very different ways: these were labelled 'authoritarian', 'democratic' and 'laissez-faire'. The first two of these were similar to Anderson's concept of dominative and integrative teachers.</p>\n<div class=\"para\">H</div>\n<p>Beginning with Withall's work in 1949, there was much greater interest in interaction within the classroom. Withall used the term 'social-emotional climate' to describe the emotional tone created as a result of face-to-face interaction in groups, and, like many who followed him, concentrated his analysis of this climate on the study of teachers' verbal behavior. Withall also made efforts towards increasing the reliability of analyses, and this important pioneering work in the development of classroom observation methodology was followed by many others during the 1950s.</p>\n<div class=\"para\">I</div>\n<p>Partly because of the disappointing results of the teacher-effectiveness research, and partly because of the general neglect in earlier work of the variables of actual classroom behavior, the decade 1960-70 produced a large number of studies of classroom processes, based on observation of teachers at work.</p>"}, "answers": {"1": "TRUE", "2": "TRUE", "3": "FALSE", "4": "NOT GIVEN", "5": "FALSE", "6": "TRUE", "7": "ships", "8": "tax", "9": "sun", "10": "weather", "11": "tractors", "12": "ice", "13": "treaty", "14": "B", "15": "A", "16": "A", "17": "C", "18": "E", "19": "C", "20": "F", "21": "D", "22": "animals", "23": "blood", "24": "electricity", "25": "weather", "26": "fear", "27": "D", "28": "B", "29": "A", "30": "G", "31": "J", "32": "H", "33": "E", "34": "B", "35": "G", "36": "E", "37": "C", "38": "E", "39": "F", "40": "D"}, "alt": {}, "expl": {"1": {"loc": "Para 1", "text": "'before that Antarctic travel had been limi function qhtml(p){
if(p===1)return '<div class="qgroup"><h3>Questions 1-6</h3><p><i>Do the following statements agree with the information given in the passage? Write <b>TRUE / FALSE / NOT GIVEN</b>.</i></p>'+tf(1,'Until the 1920s, humans relied on animals to explore Antarctica.')+tf(2,'Herbert Wilkins failed to fly across the Antarctic continent in 1928.')+tf(3,'The expedition of 1934-37 confirmed a new theory about the Antarctic Peninsula.')+tf(4,'Lincoln Ellsworth was influenced by the flight of Richard Byrd.')+tf(5,'The government of the USA claimed part of Antarctica in 1935.')+tf(6,'After 1940, nations rather than individuals paid for most Antarctic expeditions.')+'</div><div class="qgroup"><h3>Questions 7-13</h3><p><i>Complete the notes below. Choose <b>ONE WORD ONLY</b> from the passage for each answer.</i></p><div class="notes"><h3>Scientific Research</h3><div class="note-row">&bull; a 1920 report called for research into the whales in the sea around Antarctica</div><div class="note-row">&bull; researchers worked from the station at Grytviken and also from several '+gap(7)+'</div><div class="note-row">&bull; local companies paid a '+gap(8)+' which funded the Discovery Investigations</div><div class="note-row">&bull; the first two Polar Years researched the effects of the '+gap(9)+'</div><div class="note-row">&bull; Antarctica affects the world’s '+gap(10)+' so it was a focus for the IGY</div><div class="note-row">&bull; Vivian Fuchs’ expedition crossed Antarctica using special '+gap(11)+'</div><div class="note-row">&bull; the total amount of '+gap(12)+' in Antarctica was calculated by Fuchs’ expedition</div><div class="note-row">&bull; one result of the IGY was the establishment of a '+gap(13)+' to control aspects of Antarctica’s future</div></div></div>';
if(p===2)return '<div class="qgroup"><h3>Questions 14-17</h3><p><i>Reading Passage 2 has six paragraphs, A–F. Which paragraph contains the following information?</i></p><p><b><i>NB</i></b> <i>You may use any letter more than once.</i></p>'+sel(14,'a reference to a fact that two scientists use the same technique to promote their own happiness.',['A','B','C','D','E','F'])+sel(15,'the suggestion that scientific opinion about an aspect of brain function has changed over a given time period.',['A','B','C','D','E','F'])+sel(16,'an estimate of how numerous some brain components are.',['A','B','C','D','E','F'])+sel(17,'the reason why some educational courses were set up.',['A','B','C','D','E','F'])+'</div><div class="qgroup"><h3>Questions 18-21</h3><p>Look at the following statements and the list of people below. Match each statement with the correct person.</p><div class="box"><b>A</b> Tony Fernando<br><b>B</b> Richard Davidson<br><b>C</b> Rick Hanson<br><b>D</b> Judi Clements<br><b>E</b> Carsten Grimm<br><b>F</b> Nathan Consedine</div>'+sel(18,'It’s better to look for a variety of ways to increase happiness than focus on just one.',['A','B','C','D','E','F'])+sel(19,'Focusing on personal achievements rather than negative experiences will make people happier.',['A','B','C','D','E','F'])+sel(20,'Happy people might have a reason not to display one favorable characteristic.',['A','B','C','D','E','F'])+sel(21,'A range of groups are becoming more interested in learning techniques to improve happiness.',['A','B','C','D','E','F'])+'</div><div class="qgroup"><h3>Questions 22-26</h3><p><i>Complete the summary below. Choose <b>ONE WORD ONLY</b> from the passage for each answer.</i></p><p class="summary-text"><b>Auckland University’s Centre for Brain Research</b><br>Associate Professor Johanna Montgomery says that current research into brain activity and behavior only relates to '+gap(22)+' so Hanson’s theories have not been proved correct. While scans do show that positive stimuli result in more '+gap(23)+' reaching parts of the brain, this isn’t proof that the brain is getting stronger. But Montgomery is making progress. In laboratory experiments, scientists use '+gap(24)+' to initiate brain activity, because it’s similar to natural processes. One finding is that hormones can be compared to the '+gap(25)+' because both can change human behavior. But scientists understand some stimuli, such as '+gap(26)+', better than they understand more positive stimuli.</p></div>';
return '<div class="qgroup"><h3>Questions 27-33</h3><p>Read the list of words (A–J) below and complete the gaps in the following summary using the correct word.</p><div class="box"><b>A</b> authoritarianism &nbsp; <b>B</b> competence &nbsp; <b>C</b> emergence &nbsp; <b>D</b> learning &nbsp; <b>E</b> observation<br><b>F</b> personality &nbsp; <b>G</b> processes &nbsp; <b>H</b> reliability &nbsp; <b>I</b> training &nbsp; <b>J</b> verbal behavior</div><p class="summary-text"><b>Research into classroom interaction: 1920–1970</b><br><u>1920-1939</u> Research largely investigated the relationship between children’s attentiveness and their '+selInline(27,['A','B','C','D','E','F','G','H','I','J'])+'. In addition, attentiveness was used to measure the '+selInline(28,['A','B','C','D','E','F','G','H','I','J'])+' of the teachers.<br><u>1939-49</u> Research was influenced by a growing distrust of '+selInline(29,['A','B','C','D','E','F','G','H','I','J'])+'. The period saw the beginnings of systematic analysis of the '+selInline(30,['A','B','C','D','E','F','G','H','I','J'])+' which occur in lecture classes and in small group discussions.<br><u>1949-60</u> Classroom transactions were analyzed in more detail, often with a focus on the '+selInline(31,['A','B','C','D','E','F','G','H','I','J'])+' of teachers. Researchers aimed to improve the '+selInline(32,['A','B','C','D','E','F','G','H','I','J'])+' of their methods.<br><u>1960-70</u> The number of studies based on live '+selInline(33,['A','B','C','D','E','F','G','H','I','J'])+' greatly increased.</p></div><div class="qgroup"><h3>Questions 34-37</h3><p>Read the descriptions below and the list of researchers. Match each description with the correct researcher(s).</p><div class="box"><b>A</b> Domas and Tiedeman<br><b>B</b> Rostker<br><b>C</b> Rolfe<br><b>D</b> Barr<br><b>E</b> Stevens<br><b>F</b> Morrison<br><b>G</b> Lewin, Lippitt and White</div>'+sel(34,'claimed that the most important contribution to success in teaching is made by intelligence',['A','B','C','D','E','F','G'])+sel(35,'set up an experiment to discover how pupils responded to various types of teaching',['A','B','C','D','E','F','G'])+sel(36,'focused on the questions which teachers asked in the classroom',['A','B','C','D','E','F','G'])+sel(37,'discovered a connection between success in teaching and the personality of the teacher',['A','B','C','D','E','F','G'])+'</div><div class="qgroup"><h3>Questions 38-40</h3><p>Reading Passage 3 has nine paragraphs, A–I. Which paragraph contains the following information?</p>'+sel(38,'the influence of political events on research',['A','B','C','D','E','F','G','H','I'])+sel(39,'an example of how children’s behavior was categorized for research purposes',['A','B','C','D','E','F','G','H','I'])+sel(40,'a reason for research into children’s attention',['A','B','C','D','E','F','G','H','I'])+'</div>';
}

function render(){partTitle.textContent='Part '+active;var r=ranges[active];partSub.textContent='Read the text and answer questions '+r[0]+'-'+r[1]+'.';left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();drawFooter();left.scrollTop=right.scrollTop=0}
function val(n){var g=document.getElementById('gap'+n);if(g)return g.value;var s=document.getElementById('sel'+n);if(s)return s.value;var r=document.querySelector('input[name="q'+n+'"]:checked');return r?r.value:''}
function save(){for(var n=1;n<=40;n++){var v=val(n);if(v)state[n]=v}}
function restore(){for(var n=1;n<=40;n++){if(!state[n])continue;var g=document.getElementById('gap'+n);if(g)g.value=state[n];var s=document.getElementById('sel'+n);if(s)s.value=state[n];var r=document.querySelector('input[name="q'+n+'"][value="'+state[n]+'"]');if(r)r.checked=true}}
function answered(n){return !!state[n]||!!val(n)}
function count(p){var r=ranges[p],c=0;for(var i=r[0];i<=r[1];i++)if(answered(i))c++;return c}
function drawFooter(){save();var h='';[1,2,3].forEach(p=>{var r=ranges[p];h+='<div class="partnav"><button class="partlabel" data-part="'+p+'">Part '+p+'</button>';if(p===active){h+='<div class="tiles">';for(var n=r[0];n<=r[1];n++)h+='<button class="tile '+(answered(n)?'answered':'')+'" data-q="'+n+'">'+n+'</button>';h+='</div>'}else h+='<span class="count">'+count(p)+' of '+(r[1]-r[0]+1)+'</span>';h+='</div>'});h+='<button class="review" id="review">OK</button>';footer.innerHTML=h}
document.addEventListener('change',()=>{save();drawFooter()});document.addEventListener('input',()=>{save();drawFooter()});
var lastScore=null;
function renderActive(){left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();if(graded){regradeCurrent();right.insertAdjacentHTML('afterbegin','<div class="score">Your score: <b>'+lastScore+' / 40</b></div><p style="margin:-8px 0 18px;color:#555">Explanations with the exact location in the passage are shown below each answer. Switch Part 1/2/3 tabs to review the rest.</p>')}drawFooter();left.scrollTop=right.scrollTop=0}
footer.onclick=e=>{var p=e.target.closest('[data-part]');if(p){save();active=+p.dataset.part;renderActive();return}var q=e.target.closest('[data-q]');if(q){var n=+q.dataset.q;(document.getElementById('q'+n)||document.getElementById('gap'+n)||document.getElementById('sel'+n))?.scrollIntoView({behavior:'smooth',block:'center'});return}if(e.target.closest('#review'))review()};
function review(){save();var a=0;for(var n=1;n<=40;n++)if(answered(n))a++;subwrap.innerHTML='<p>You have answered <b>'+a+'</b> of 40 questions.</p><p><button class="ovrow submit" id="final">Submit test</button></p>';final.onclick=grade;submit.classList.add('show')}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function correct(n,v){return [answers[n]].concat(alt[n]||[]).some(a=>norm(a)===norm(v))}
function explHTML(n){var e=EXPL[n];if(!e)return '';return '<div class="expl"><b>Q'+n+' — correct answer: '+answers[n]+'</b> &nbsp;<span class="expl-loc">('+e.loc+')</span><br>'+e.text+'</div>'}
function markGap(n){var x=document.getElementById('gap'+n);if(!x)return;var ok=correct(n,x.value);x.disabled=true;x.classList.add(ok?'ok':'no');x.insertAdjacentHTML('afterend',(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>')+explHTML(n));return ok}
function markSel(n){var s=document.getElementById('sel'+n);if(!s)return;var ok=correct(n,s.value);s.disabled=true;s.classList.add(ok?'ok':'no');var row=document.getElementById('q'+n);var tag=(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>');if(row){row.insertAdjacentHTML('beforeend',tag);row.insertAdjacentHTML('afterend',explHTML(n))}else{s.insertAdjacentHTML('afterend',tag);var host=s.closest('p')||s;host.insertAdjacentHTML('afterend',explHTML(n))}return ok}
function markRadio(n){var r=document.querySelector('input[name="q'+n+'"]:checked');var ok=r&&correct(n,r.value);document.querySelectorAll('input[name="q'+n+'"]').forEach(i=>i.disabled=true);var box=document.getElementById('q'+n);box.insertAdjacentHTML('beforeend',(ok?'<span class="tag ok">\u2713</span>':'<span class="tag no">\u2718 correct: '+answers[n]+'</span>'));box.insertAdjacentHTML('afterend',explHTML(n));return ok}
function regradeCurrent(){var r=ranges[active];for(var n=r[0];n<=r[1];n++){var g=document.getElementById('gap'+n),s=document.getElementById('sel'+n),rad=document.querySelector('input[name="q'+n+'"]');if(g)markGap(n);else if(s)markSel(n);else if(rad)markRadio(n)}}
function grade(){if(graded)return;save();var score=0;for(var n=1;n<=40;n++)if(correct(n,state[n]||''))score++;lastScore=score;graded=true;active=1;renderActive();submit.classList.remove('show')}
var drag=false;div.onmousedown=()=>{drag=true;document.body.style.userSelect='none'};window.onmouseup=()=>{drag=false;document.body.style.userSelect=''};window.onmousemove=e=>{if(!drag)return;var r=split.getBoundingClientRect();left.style.width=Math.max(220,Math.min(r.width-240,e.clientX-r.left))+'px'};
split.onmouseup=()=>setTimeout(()=>{var s=getSelection();if(!s||s.isCollapsed||!s.rangeCount){tools.style.display='none';return}var rg=s.getRangeAt(0);if(!split.contains(rg.commonAncestorContainer)){tools.style.display='none';return}var rc=rg.getBoundingClientRect();tools.style.display='flex';tools.style.left=(rc.left+scrollX)+'px';tools.style.top=Math.max(8,rc.top+scrollY-42)+'px'},1);
tools.onclick=e=>{var b=e.target.closest('button'),s=getSelection();if(!b||!s.rangeCount)return;var rg=s.getRangeAt(0);if(b.dataset.act==='hl'){try{var sp=document.createElement('span');sp.className='hl';rg.surroundContents(sp)}catch(_){document.execCommand('hiliteColor',false,'#ffe45c')}}else document.querySelectorAll('.hl').forEach(h=>h.replaceWith(document.createTextNode(h.textContent)));s.removeAllRanges();tools.style.display='none'};
render();
})();
</script></body></html>
