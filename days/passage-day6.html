var passages={
1:`<h1>Sleep Study on Modern-Day Hunter-Gatherers Dispels Popular Notions</h1>
<p>The sleep troubles common in modern life have long been blamed on our industrial society, from the city lights, long work hours and commutes, to caffeine and the Internet. Sleep researchers often look back on a time when humans were able to get more rest by sleeping and waking to the rhythms of the sun. It turns out that may not be quite right. In fact, our ancestors may not have been getting the recommended eight hours of sleep, either.</p>
<p>In a recent study, researchers traveled all over the world to examine sleep in some of the world's last remaining hunter-gatherer societies - the Hadza of Tanzania, the San of Namibia, and the Tsimane of Bolivia. Cut off from media, electricity and other distractions, these pre-industrial societies are thought to sleep the way humans did more than 10,000 years ago. Traveling to where they lived, often in humid remote locations, researchers used medical devices to record the sleeping habits of 94 of these tribespeople and ended up collecting data representing 1,165 days.</p>
<p>They found very similar sleep patterns despite their geographic isolation. On average, all three groups sleep a little less than 6.5 hours a night, do not take naps, and don't go to sleep when it gets dark. Like many of us, the Hadza, San, and Tsimane spend more time in bed - from 6.9 to 8.5 hours - than they do actually sleeping. This adds up to a sleep efficiency that is very similar to today's industrial populations.</p>
<p>According to Jerome Siegel, director of the University of California's Center for Sleep Research, evidence suggests sleep habits may not be environmental or cultural, but central to the physical makeup of humans. These findings question the millions of dollars that have been spent on research that tries to explain why some sleepers get only about six hours of sleep a night. Also, such findings question whether lack of sleep is a cause of obesity, mood disorders, and other physical and mental illnesses which have become so common in recent decades. Scientists have documented that people's energy often falls in the mid-afternoon. Some have suggested that it's because we've managed to suppress a natural desire for a nap.</p>
<p>However, the new study provides evidence that this is unlikely, and that napping was actually rare in hunter-gatherer societies. The researchers estimated that naps may have occurred on up to 7 percent of winter days and 22 percent of summer days. They noted that their devices were only good at detecting longer naps, so it is possible that some of the study subjects took naps that were short, perhaps 15 minutes or less.</p>
<p>Another fascinating finding from the study had to do with the circadian rhythms, our daily activity cycles related to sunlight. Instead of going to sleep right at dusk, tribespeople were staying awake an average of between 2.5 and 4.4 hours after sunset. All three tribes had fires going, but the light itself was much lower than you might get from a light bulb. They did, however, have a tendency to wake up anywhere between an hour before and an hour after sunrise.</p>
<p>Siegel and his co-authors investigated this further by looking into the significance of temperature. They found that it also played a big role, though was somewhat less important than light in influencing sleep patterns. They wrote that "sleep in both the winter and summer usually occurred during the period of cooling and that waking times usually occurred near the height of the daily warming trend."</p>
<p>The tribespeople that were studied are different from people living in modern conditions in a number of respects. Importantly, almost none of them were troubled by sleeplessness. In interviews with the researchers conducted through interpreters, only 1.5 to 2.5 percent of the study subjects said they had severe difficulties sleeping more than once a year. This figure is far lower than the 10 to 30 percent recorded in many industrialized countries today. Siegel suggested that 'mimicking aspects of the natural environment' may therefore help treat some sleep disorders.</p>
<p>The tribespeople are also much healthier. Not a single one is overweight, indicating their overall higher levels of physical fitness. They also tended to have healthier hearts. Thus comes a critical question. If we can't blame our health problems on our lack of sleep, could it be that the reason we feel so unrested is because of poor health?</p>`,
2:`<h1>The purpose of facial expressions</h1><p class="sub">Do facial expressions reflect inner feelings? Or are they social devices for influencing others?</p>
<div class="para">A</div><p>The use of facial expressions for measuring people's emotions has dominated psychology since the late 1960s. This was when Paul Ekman of the University of California pioneered the idea that, by carefully measuring facial expression, he could evaluate people's true emotions. Ekman carried out experiments in which people were asked to label photos of basic facial expressions - such as a smile, frown or scowl - with words for emotions. He found, for example, that a smile represented joy and a scowl represented anger. In fact, since the 1970s Ekman has dominated the field of emotion research with his theory that when an emotion occurs, a large number of electrical impulses also occur, creating specific facial expressions and other physiological changes, such as increased or decreased heart rate or heightened blood pressure.</p>
<div class="para">B</div><p>Many took Ekman's work to imply that facial expressions precisely indicated people's feelings. However, this theory has been attacked by a number of psychologists, such as Alan Fridlund of the University of California, who claim that there is no one-to-one correspondence between facial expressions and emotions. Expressions evolved to set off certain behaviors in other people, says Fridlund. So, a smile may prompt people to approach, a scowl may warn them to stay away, and a look of sadness may elicit words of sympathy and reassurance. In other words, in Fridlund's view, facial expressions are inherently social - they involve not one, but two or more people. Even when people are alone, they are holding a dialog with another person internally, or imagining themselves in a social situation.</p>
<div class="para">C</div><p>Thus Fridlund thinks of facial expressions as tools for influencing social interactions, a view which, he claims, enables us to begin predicting when certain facial expressions will occur. This in turn will allow more precise theories about social interactions. His studies find that expressions occur most often during pivotal points, the turning points in social interactions - during greetings, social crises, or times of appeasement, for example. At these pivotal points there is an approach, or closeness, or more intimacy, and facial expressions, as well as gestures, open up the possibilities of various social interactions.</p>
<div class="para">D</div><p>Although much work on the emotions relies on a link between facial expression and emotions, psychologist James Russell, of the University of British Columbia, says there is very little evidence supporting such a connection. "There's some sense in which faces express emotion, but only in the sense that everything expresses emotion," says Russell, a long-time critic of the expression-emotion link. "Music does, posture does, words do, tone of voice does, your behavior does. The real question is, 'Is there anything special about faces?' And there we really do not know much." What is more likely, argues Russell, is that facial expressions tell others something about a person's overall mood and context, rather than provide details about specific emotions.</p>
<div class="para">E</div><p>Others, including Ekman, argue that the face can display information about emotions, but they admit that it is not reliable one hundred percent of the time. And those who only examine faces when trying to study emotion will jump to false conclusions. But according to Ekman, to say, as Fridlund does, that there is no connection at all between facial expressions and emotions is simply wrong. "There is a link between facial expression and emotion," agrees developmental psychologist Linda Camras of DePaul University, "but it's not a one-to-one kind of relationship as many once thought." She believes there are many situations where emotion is experienced, yet no basic facial expression is displayed. And there are times when a facial expression appears with no corresponding emotion.</p>
<div class="para">F</div><p>Ekman's theory states that if the emotion comes on slowly or is rather weak, the feeling might not be strong enough to trigger the expression. This would explain why there can sometimes be emotion without expression, he argues. In addition, cultural rules - which determine when and whether people of certain cultures display emotional expressions - can prevent this otherwise automatic process from being completed. Facial expressions evolved in humans as signals to others about how they feel, says Ekman. At times, though, it may be uncomfortable or inconvenient for us to let others know our emotions. But in the long run, over the course of evolution, it was useful to us as signalers: an angry look on someone's face may be a warning that they are preparing to behave in an angry fashion.</p>
<div class="para">G</div><p>Although Fridlund disagrees with Ekman on certain matters, the two basically share the opinion that facial expressions indicate people's future actions. The area of dispute between Fridlund and Ekman draws attention away from their major areas of agreement, says Joseph Campos of the University of California. Indeed, he says, "there is profound agreement that the face, along with the voice, body posture and hand gestures, forecasts to outside observers what people will do next." He goes on to say, "The face is a component [of emotion], but to make it the center of study of the human being experiencing an emotion is like saying the only thing you need to study in a car is the transmission. Not that the transmission is unimportant, but it's only part of an entire system."</p>`,
3:`<h1>The History of Chocolate</h1>
<div class="para">A</div><p>Chocolate is now perceived as a ubiquitous indulgence, whether consumed as confectionery or a beverage, readily accessible in global markets. However, it may come as a surprise that chocolate was once regarded as a commodity of extraordinary value. The discovery of the cocoa tree, the source of chocolate, occurred approximately 2,000 years ago in the lush tropical rain forests of the Americas. The evolution of the chocolate - from a regionally significant Mesoamerican drink to globally consumed confectionery - has been shaped through cross-continental cultural exchanges and the successive influences of multiple civilizations.</p>
<div class="para">B</div><p>Historians suggest that the ancient Maya pioneered cocoa tree cultivation in Mesoamerica, with evidence dating back approximately 2,000 years. They transplanted cocoa trees from the dense rain forest into their domesticated gardens, where cocoa beans were initially roasted and ground into a smooth paste. The paste was combined with spices and water to produce unsweetened chocolate beverages. The Maya also employed a distinctive technique of transferring the liquid back and forth between containers, generating a foamy layer on the drink's surface.</p>
<div class="para">C</div><p>Cocoa and chocolate were integral to Maya culture, commonly depicted in their architectural structures and artistic works. While the aristocracy, particularly the royal families, consumed chocolate during elaborate ceremonies, even less privileged groups occasionally savored the drink. Furthermore, cocoa beans served as a powerful emblem of marital union and were ritually exchanged during wedding ceremonies.</p>
<div class="para">D</div><p>The Aztec civilization in Mexico regarded chocolate as a prestigious commodity, despite being geographically unable to cultivate cocoa trees within their heartland. Accordingly, they sourced cocoa beans through extensive trade networks, even utilizing them as currency for tax payments. Chocolate held an exclusive function within Aztec imperial and religious ceremonies, where priests offered cocoa beans as divine offerings and prepared sacred chocolate drinks. Due to the scarcity of cocoa beans, consumption remained restricted to the societal elite, with historical accounts suggesting Emperor Montezuma consumed up to 50 cups daily. Linguists trace the term 'chocolate' to the Aztec Nahuatl word xocoatl, meaning 'bitter water' in the Nahuatl language, though some scholars argue that it has hybrid origins combining Maya and Nahuatl linguistic elements.</p>
<div class="para">E</div><p>In 1502, explorer Christopher Columbus introduced cocoa beans to Spain after voyaging to Mesoamerica, and later Spanish explorer Hernan Cortes quickly recognized the potential economic value of chocolate. Upon arriving in present-day Mexico in 1519, Cortes observed that chocolate beverages would appeal to the Spanish. After conquering the Aztec Empire, Spanish forces exported confiscated cocoa supplies to Spain. In response to the growing demand, Spain began cultivating cocoa trees in its American colonies. Spanish elite first developed a taste for sweetened chocolate drinks, but the beverage rapidly spread across Europe. England, the Netherlands, and France followed suit by establishing cocoa plantations in their own colonies. By the 18th century, chocolate remained primarily a luxury restricted to the affluent. However, the Industrial Revolution's technologies enabled mechanized production, dramatically reducing costs and making chocolate available to a broader population.</p>
<div class="para">F</div><p>Cocoa trees are cultivated across multiple countries in Africa, Mesoamerica, and South America, thriving in cool, shaded environments within equatorial zones. Despite widespread cultivation, cocoa farming remains labor-intensive, due to the trees' requirement for specific water thresholds, temperature ranges, soil compositions, and protection from environmental threats. Approximately five years after planting, cocoa trees begin to yield large, pod-shaped fruits that grow on the trunk. These pods contain the beans used in chocolate production. While several types of cocoa trees exist, the bulk of the chocolate is produced from the seeds of the most commonly cultivated varieties.</p><p>However, farmers opt to grow more specialized types, such as Criollo or Trinitario, valued for distinctive flavor profiles. Unexpectedly, cocoa trees grown on farms are more vulnerable to disease and pests than their wild counterparts. Cocoa cultivation presents a strenuous endeavor for farmers, who sell their harvests on futures markets, exposing their incomes to external market fluctuations.</p>
<div class="para">G</div><p>The process of chocolate production involves a series of steps, carried out in specialized factories where cocoa beans are meticulously processed. Workers first sort, clean, and roast the beans before extracting the outer shells, leaving only the inner nibs. These nibs are then ground into a dense paste known as chocolate liquor, which is subsequently separated into two components: cocoa solids and cocoa butter. Following standardized formulations, chocolate manufacturers blend the chocolate liquor with precise ratios of sugar, milk, and cocoa butter. The resulting mixture, often referred to as the 'crumb', undergoes fine grinding to create a smooth consistency. Finally, the mixture is then subjected to two additional processes - conching and tempering - before being placed into molds to create various forms, such as bars or other chocolate products.</p>
<div class="para">H</div><p>Chocolate holds significant global economic value, with the manufacturing industry generating over $5 billion annually from cocoa crops, and its reputation remains most prominent in Europe and the United States. For instance, US cocoa product imports reached $1.4 billion in 2005. On average, Americans consume over five kilograms of chocolate per person each year. In addition, upscale chocolate boutiques, which offer premium chocolates, have gained significant popularity. Many of these shops specialize in artisanal chocolates, crafted with unique flavor profiles. Renowned chocolate brands such as Cadbury, Godiva, Lindt, and Ferrero Rocher dominate the market. However, the cocoa and chocolate production sectors often face challenges related to fair trade, sustainable development, and environmental preservation. These issues are now being actively addressed by industry stakeholders, including officials, activists, and researchers, who are working closely with farmers to promote farming practices that foster sustainability and protect the environment.</p>`};
function tf(n,t){return `<div class="tf-row" id="q${n}"><div class="statement"><span class="qnum">${n}</span><span>${t}</span></div><div class="options"><label><input type="radio" name="q${n}" value="TRUE"> TRUE</label><label><input type="radio" name="q${n}" value="FALSE"> FALSE</label><label><input type="radio" name="q${n}" value="NOT GIVEN"> NOT GIVEN</label></div></div>`}
function gap(n){return `<span class="qnum">${n}</span><input class="gap" id="gap${n}" autocomplete="off" spellcheck="false">`}
function grid(start,end,letters,items){var h='<div class="match-wrap"><table class="match"><thead><tr><th></th>'+letters.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>';items.forEach((t,i)=>{var n=start+i;h+=`<tr id="q${n}"><td><div class="qcell"><b>${n}.</b><span>${t}</span></div></td>`+letters.map(l=>`<td><input type="radio" name="q${n}" value="${l}"></td>`).join('')+'</tr>'});return h+'</tbody></table></div>'}
function sel(n,t,letters){return `<div class="row" id="q${n}"><span class="qnum">${n}</span><span class="txt">${t}</span><select class="select" id="sel${n}"><option value="">${n}</option>${letters.map(l=>`<option>${l}</option>`).join('')}</select></div>`}
function renderQuestions(p){var h='';if(p===1){h+=`<div class="qgroup"><h3>Questions 1-4</h3><p>Do the following statements agree with the information given in Reading Passage 1?</p>${tf(1,'Scientists studied hunter-gatherer societies because their sleep patterns are assumed to be similar to those of humans more than 10,000 years ago.')}${tf(2,'The medical devices used in the research were especially designed for humid conditions.')}${tf(3,'Researchers found that tribespeople stayed longer in bed than inhabitants of industrialized regions.')}${tf(4,'Jerome Siegel believes that environment and culture have little effect on sleep patterns.')}</div><div class="qgroup"><h3>Questions 5-13</h3><p><i>Complete the notes below. Choose <b>ONE WORD ONLY</b> from the passage for each answer.</i></p><div class="notes"><h4>New Evidence on Sleep Patterns</h4><b>New ideas about napping</b><div class="note-row">- scientists have recorded an afternoon drop in ${gap(5)}</div><div class="note-row">- studies of hunter-gatherer societies show that napping was rare and occurred more often during the ${gap(6)}</div><div class="note-row">- the devices may not have detected ${gap(7)} naps</div><b>Daily activity cycles</b><div class="note-row">- even with ${gap(8)} there was little light</div><div class="note-row">- tribespeople usually woke up around ${gap(9)}</div><div class="note-row">- scientists found that ${gap(10)} had almost as much influence on sleep patterns as light</div><b>Differences between tribespeople and people in industrialized regions</b><div class="note-row">- ${gap(11)} is something that very few of the tribespeople suffered from</div><div class="note-row">- tribespeople were not ${gap(12)}</div><div class="note-row">- tribespeople also had stronger ${gap(13)}</div></div></div>`}
if(p===2){h+=`<div class="qgroup"><h3>Questions 14-18</h3><p>Reading Passage 2 has seven paragraphs, A-G. Which paragraph contains the following information?</p>${grid(14,18,['A','B','C','D','E','F','G'],['a recognition that facial expressions do not always provide a true guide to feelings',"examples of ways that a person's facial expression can affect someone else's actions",'a reference to reasons for hiding emotions','examples of times when facial expressions are used especially frequently','examples of changes inside the body when an emotion is felt'])}</div><div class="qgroup"><h3>Questions 19-23</h3><p>Match each statement with the correct researcher.</p><div class="box"><b>A</b> Paul Ekman<br><b>B</b> Alan Fridlund<br><b>C</b> James Russell<br><b>D</b> Linda Camras<br><b>E</b> Joseph Campos</div>${sel(19,'Focusing on the face in researching emotions is similar to researching a large structure by looking at just one small unit of it.',['A','B','C','D','E'])}${sel(20,'Facial expressions developed in order to encourage other people to react in particular ways.',['A','B','C','D','E'])}${sel(21,'Although certain researchers have different opinions about various points, they share some important ideas.',['A','B','C','D','E'])}${sel(22,'Both emotion and expression can exist independently of each other in certain circumstances.',['A','B','C','D','E'])}${sel(23,'It cannot be proved that there is a connection between facial expression and real emotion.',['A','B','C','D','E'])}</div><div class="qgroup"><h3>Questions 24-26</h3><p><i>Complete the sentences below. Choose <b>ONE WORD ONLY</b> from the passage for each answer.</i></p><p>In Fridlund's view ${gap(24)} on someone's face may be intended as an invitation to come nearer.</p><p>According to Fridlund, when we are by ourselves, we still use facial expressions because we are having a ${gap(25)} with someone in our minds.</p><p>Fridlund considers facial expressions to be ${gap(26)} that can affect our contact with other people.</p></div>`}
if(p===3){h+=`<div class="qgroup"><h3>Questions 27-31</h3><p>Reading Passage 3 has eight paragraphs, A-H. Which paragraph contains the following information?</p><p><b><i>NB</i></b> <i>You may use any letter more than once.</i></p>${grid(27,31,['A','B','C','D','E','F','G','H'],['the part of cocoa trees used for chocolate production','annual chocolate consumption per capita in the United States','the higher likelihood of cultivated cocoa trees being attacked by insects','a community which developed a preference for sweetened chocolate beverages','an approach by which ancient Mexicans could acquire cocoa beans'])}</div><div class="qgroup"><h3>Questions 32-36</h3>${tf(32,'The Mayan ruling class forbade the use of cocoa and chocolate in rituals.')}${tf(33,'The Spanish explorer Hernan Cortes had made an investment in chocolate and chocolate beverages.')}${tf(34,'Wild cocoa trees are more susceptible to infectious diseases than cultivated ones.')}${tf(35,'During chocolate production, some of the seeds are discarded.')}${tf(36,'Chocolate enjoys more prestige in Europe and the United States than in any other country.')}</div><div class="qgroup"><h3>Questions 37-40</h3><p><i>Complete the flow-chart below. Write <b>NO MORE THAN TWO WORDS</b> from the passage for each answer.</i></p><div class="flow"><h3>From Cocoa Beans to Chocolate Seeds</h3><div class="flow-box">classifying, cleaning, and roasting, stripping their ${gap(37)}</div><div class="arrow">↓</div><div class="flow-box">Nibs</div><div class="arrow">↓</div><div class="flow-box">Crushing<br>producing ${gap(38)}<br>mixing with measured quantities of substances such as sweeteners, liquid dairy, and ${gap(39)}</div><div class="arrow">↓</div><div class="flow-box">Crumb blending<br>crushing finely to obtain a smooth texture<br>manufacturing diverse shapes of chocolate in ${gap(40)}</div><div class="arrow">↓</div><div class="flow-box">Chocolate</div></div></div>`}
return h}
function render(){document.getElementById('partTitle').textContent='Part '+active;var r=ranges[active];document.getElementById('partSub').textContent='Read the text and answer questions '+r[0]+'-'+r[1]+'.';left.innerHTML=passages[active];right.innerHTML=renderQuestions(active);restore();footer();left.scrollTop=0;right.scrollTop=0}
function value(n){var g=document.getElementById('gap'+n);if(g)return g.value;var s=document.getElementById('sel'+n);if(s)return s.value;var r=document.querySelector('input[name="q'+n+'"]:checked');return r?r.value:''}
var state={};function save(){for(var n=1;n<=40;n++){var v=value(n);if(v)state[n]=v}}
function restore(){for(var n=1;n<=40;n++){if(!state[n])continue;var g=document.getElementById('gap'+n);if(g)g.value=state[n];var s=document.getElementById('sel'+n);if(s)s.value=state[n];var r=document.querySelector('input[name="q'+n+'"][value="'+state[n]+'"]');if(r)r.checked=true}}
function answered(n){return !!state[n]||!!value(n)}
function count(p){var r=ranges[p],c=0;for(var i=r[0];i<=r[1];i++)if(answered(i))c++;return c}
function footer(){save();var html='';[1,2,3].forEach(function(p){var r=ranges[p];html+='<div class="partnav"><button class="partlabel '+(p===active?'active':'')+'" data-part="'+p+'">Part '+p+'</button>';if(p===active){html+='<div class="tiles">';for(var n=r[0];n<=r[1];n++)html+='<button class="tile '+(answered(n)?'answered':'')+'" data-q="'+n+'">'+n+'</button>';html+='</div>'}else html+='<span class="count">'+count(p)+' of '+(r[1]-r[0]+1)+'</span>';html+='</div>'});html+='<button class="review" id="review">OK</button>';document.getElementById('footer').innerHTML=html}
document.addEventListener('change',function(){save();footer()});document.addEventListener('input',function(){save();footer()});document.getElementById('footer').onclick=function(e){var p=e.target.closest('[data-part]');if(p){save();active=+p.dataset.part;render();return}var q=e.target.closest('[data-q]');if(q){var n=+q.dataset.q;(document.getElementById('q'+n)||document.getElementById('gap'+n)||document.getElementById('sel'+n))?.scrollIntoView({behavior:'smooth',block:'center'});return}if(e.target.closest('#review'))review()};
function review(){save();var a=0;for(var n=1;n<=40;n++)if(answered(n))a++;subwrap.innerHTML='<p>You have answered <b>'+a+'</b> of 40 questions.</p><p><button class="ovrow submit" id="final">Submit test</button></p>';document.getElementById('final').onclick=grade;submit.classList.add('show')}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function correct(n,v){var list=[answers[n]].concat(alt[n]||[]);return list.some(a=>norm(a)===norm(v))}
function grade(){if(graded)return;graded=true;save();var score=0;for(var n=1;n<=40;n++)if(correct(n,state[n]||''))score++;subwrap.innerHTML='<div class="score">Your score: <b>'+score+' / 40</b></div><p>Correct answers are built into this test. Reopen the file to take it again from a clean state.</p>';render()}
var div=document.getElementById('div'),drag=false;div.onmousedown=function(){drag=true;document.body.style.userSelect='none'};window.onmouseup=function(){drag=false;document.body.style.userSelect=''};window.onmousemove=function(e){if(!drag)return;var r=split.getBoundingClientRect();left.style.width=Math.max(220,Math.min(r.width-240,e.clientX-r.left))+'px'};
split.onmouseup=function(){setTimeout(function(){var s=getSelection();if(!s||s.isCollapsed||!s.rangeCount){tools.style.display='none';return}var rg=s.getRangeAt(0);if(!split.contains(rg.commonAncestorContainer)){tools.style.display='none';return}var rc=rg.getBoundingClientRect();tools.style.display='flex';tools.style.left=(rc.left+scrollX)+'px';tools.style.top=Math.max(8,rc.top+scrollY-42)+'px'},1)};tools.onclick=function(e){var b=e.target.closest('button'),s=getSelection();if(!b||!s.rangeCount)return;var rg=s.getRangeAt(0);if(b.dataset.act==='hl'){try{var sp=document.createElement('span');sp.className='hl';rg.surroundContents(sp)}catch(_){document.execCommand('hiliteColor',false,'#ffe45c')}}else{document.querySelectorAll('.hl').forEach(h=>h.replaceWith(document.createTextNode(h.textContent)))}s.removeAllRanges();tools.style.display='none'};
render();
})();
