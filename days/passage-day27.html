var DATA = {"passages": {"1": "<h1>A Brief History of Humans and Food</h1>\n<p>During the journey from our hunter-gatherer ancestors to the present day there have been three seismic changes that have had an impact on the food we eat: the discovery of cooking, the emergence of agriculture and the invention of methods of preserving food.</p>\n<p>The 19th-century scientist Charles Darwin thought that cooking, after language, was the greatest discovery made by man. All of us eat some raw food, for instance fruit and vegetables, but the great majority of food we eat is cooked. Cooking can turn plants that are inedible into edible food by destroying toxic chemicals that plants often manufacture to protect themselves against attack by insects or other herbivorous animals. These toxic chemicals are referred to as 'plant secondary compounds', because they are not directly involved in the plant's normal growth, development and reproduction, and are produced purely as chemical defenses. They give many of the plants we consume, such as coffee or brussels sprouts their bitter taste.</p>\n<p>Cooked food is often more digestible, because heat breaks down tough cellulose cell walls in plants or tough connective tissue in animals. Chewing raw turnip, a plate of uncooked rice, or a raw leg of lamb is much harder work than eating the cooked equivalent. The energy expended in chewing to break down the tough material is replaced by energy from the fuel that is used in cooking the food, so the ratio of energy gained to energy expended by the body is greater when food is cooked.</p>\n<p>Until the development of agriculture, hunter-gatherers spent up to seven hours a day gathering food. This all began to change around 10,500 years ago with the advent of farming, which led to some dramatic changes in human societies. People began to create a variety of new tools to help with survival, and in turn populations increased in size. These changes led to the possibility of specialization of different tasks within society. It was around this time that writing became more sophisticated and allowed people to maintain records of the harvest and taxes. Eventually, formalized structures of government were established as people settled in one area.</p>\n<p>The arrival of agriculture meant that, for the first time, our ancestors had more food than they could eat immediately. This, combined with the seasonality of production, led them to discover methods of preserving food: smoking, drying, adding acid by fermentation or adding salt. These four methods all share one feature in common: they make the food a more hostile environment for bacteria that can cause it to spoil. They also tend to slow down any natural chemical reactions in the food that would cause decay.</p>\n<p>Although foods today are still preserved in the ancient ways, two more recent methods of preserving food have become more common: canning and freezing. Canning was invented by a Frenchman, Nicholas Appert, in the early-19th century. He sealed food in bottles fabricated from glass and then heated them in boiling water to cook the contents. Appert's method had great advantages over older methods of food preservation: it could be applied to a wide range of foods, and the flavor of the food as well as the texture were similar to the freshly cooked product. His idea was soon copied be Englishman, Peter Durand. Until this point containers had weighed too much to be widely used, but he produced the first ones which were light and resistant to damage. Two years later, in 1812, two Englishmen, Bryan Donkin and John Hall, started the commercial canning of food, although the real take-off in popularity of canning had to wait until the can opener was invented in 1855. Up to this time, cans were opened with a chisel which was used to break open the top when hit with a hammer. Canning is an extremely effective way of preserving food: one can which contained meat dating from 1824 was opened in 1939 and the contents were still in good condition.</p>\n<p>In the 21st century, the dominance of canning as a method of food preservation has been overtaken by another technology: freezing. Chilling food to keep it fresh is an old idea. The earliest mentions of icehouses, thick-walled buildings, half underground, date back to 1,700BC in northwest Iran. In early 16th-century Italy, water was mixed with chemicals to lower its freezing point to -18 degrees Celsius, and several centuries later frozen fish and other goods were transported by ship from Australia to England. But the modern frozen food industry was started in the 1920s by an American, Clarence Birdseye. While Birdseye was on a fishing trip with the Inuit in the Canadian Arctic, he observed that very rapid freezing creates smaller ice crystals and therefore causes less damage to food. This was something he had not expected. Nevertheless, the big growth in demand for frozen food came about with the arrival of freezers in the homes of ordinary people. The advantages of frozen over canned food include the fact that the flavor and consistency are often identical to the equivalent fresh product, and that freezing can be used to preserve a huge variety of foods.</p>", "2": "<h1>Why do we need the arts?</h1>\n<p class=\"sub\">Sometimes people question why we need 'the arts'; what functions do art, music, dance and literature serve?</p>\n<div class=\"para\">A</div>\n<p>Imagine a world in which people spend hours working in offices or factories, and then go home in the evening to sit down to dinner, after which they sleep until it's time to get up and work again. In this world, people do not read or watch TV, listen to music, play computer games or have pictures to decorate their homes. In fact, there are no pictures in this world — not even advertisements are illustrated, but all are words, and very plain ones at that, with no playfulness left in them. The buildings are completely functional without a single decorative feature anywhere, and there is no music to dance to and enjoy. Such a world is a world without the arts in any form.</p>\n<div class=\"para\">B</div>\n<p>To ask what the arts are good for is not exactly the same as asking what their purpose is. The arts do not have to have a purpose — they do not exist in order to teach, to make a moral point, to entertain, to distract, to amuse, to support a revolution, to disgust, to challenge, to stimulate or to cheer; they exist chiefly for their own sake. It is artists, not the arts as such, that may have an aim in mind, and their aim may be to do any of the things just listed. But equally, artists may just make a work of art because they feel compelled to. Because the work is its own justification, no aim or goal is necessarily required to explain or, still less, to justify its existence.</p>\n<div class=\"para\">C</div>\n<p>But to say that the arts do not have to serve an aim beyond themselves, even though they may sometimes do so, is not to say that they are good for nothing. On the contrary, as such an important part of human experience, they are good for many things. The distinction here lies between things that are instrumental and things that are ends in themselves. An instrument exists for something beyond itself — namely, for what it can be used to do. We know that pictures are used as instruments in advertising, and the objective is always to persuade us to buy something. Similarly, music can be written chiefly to accompany dancing, or as a soundtrack to a movie. A play can be written to point out to the theatre audience a social injustice or other problems that should be dealt with. But even though the arts can sometimes be instrumental, that fact is not essential to their nature. What the arts are 'good for' arises from their being an end in themselves, or more accurately, representing many different things that are valuable for their own sakes — such as, for instance, the creation of beauty.</p>\n<div class=\"para\">D</div>\n<p>The phrase 'the arts' includes painting, sculpture, music, literature, dance and theatre performance, and whatever else (to quote the famous US artist Andy Warhol) anyone can get away with in calling their creation a contribution to 'the arts'. But the generalization that the arts, whatever else they are, are always an end in themselves, applies to them all. The arts are one major form of response to the world. They are often an attempt to capture an aspect of the world, to draw attention to something about it to comment on it, to present a surprising or fresh angle on it, to represent it for the sake of exploring something about it, or enjoying or celebrating it. They can help people to focus on, for example, the color or shape of an object, its eccentricity or typicality, and the interest or perhaps disgust it provokes in them.</p>\n<div class=\"para\">E</div>\n<p>For a loose comparison, think of laughing at a joke. We do not laugh so that we can achieve a further goal — in order to be healthy or relaxed, say, even if we thereby succeed in being healthier or more relaxed — but simply because the joke has elicited that reaction. But although it is merely a reaction, laughing is, in fact, good for something nevertheless; it does make people feel better. The arts are a reaction in the same way. French artist Cézanne painted Mont Sainte-Victoire repeatedly because he was fascinated by it, not because he thought that painting it would say something about politics or society or human hopes. Being fascinated by something, attracted to it, repelled by it, keen to reveal an unusual aspect of it, are all responses to that thing; the making of the arts is one outstanding way of expressing such responses.</p>\n<div class=\"para\">F</div>\n<p>But the arts are a response not only to things in the world but also to experience of the world, which lies inside the artist himself. And they are also often an expression of what presses from within the artist without being elicited by externals. Music is a prime example. A symphony, unless it is devised to represent bird song, rain, the sea and the like, is an abstract expression of a composer's conception. We may be able to describe what the Russian composer Tchaikovsky is doing in his ballet music, but how can we describe what he is expressing in his piano concerto? Composers may experiment with melody and rhythm in very abstract, sometimes mathematical, ways.</p>\n<div class=\"para\">G</div>\n<p>When artists get to work responding to and expressing ideas, whether or not they also want to make a point, entertain, distract, support a revolution and the rest, they are producing something that someone else will react to in some way. They seek to connect with their audience and express an idea or emotion which has the capacity to enrich our experience of life itself.</p>", "3": "<h1>Some views on the use of headphones</h1>\n<p class=\"sub\">Whether wearing headphones at work, or in other areas of everyday life, is a good thing or a bad thing has generated a lot of research and opinion</p>\n<p>To visit a typical modern office today is to walk into a room with possibly a dozen songs playing simultaneously but to hear none of them. Up to half of younger workers listen to music on their headphones, and nearly all of them think it makes them better at their jobs. In survey after survey, people report with confidence that music makes them happier, better at concentrating, and more productive.</p>\n<p>Scientists do not share this belief, they maintain that listening to music hurts people's ability to recall other things they should be doing, and any pop song, loud or soft, reduces overall performance for both extroverts and introverts. A Taiwanese study linked music that has lyrics to lower marks on concentration tests for college students, and other research has shown music with lyrics scrambles our brains' verbal-processing skills. 'As silence has the best overall performance, it would still be advisable that people work in silence,' another reporter dryly concluded.</p>\n<p>The question is therefore: if headphones are so bad for productivity, why do so many people at work have them? One factor to consider is that countries like the USA have moved from a farming and manufacturing economy to a service economy, with an emphasis on jobs in offices that require higher levels of concentration, reflection and creativity. As an estimated 70 percent of office workers work in open-plan office spaces, it is more important to create one's own enclosing bubble of sound. Lending strength to the argument for headphones at work is evidence that music relaxes our muscles, improves our mood, and may even moderately reduce blood pressure, heart rate and anxiety.</p>\n<p>The story of headphones began in 1910, when the US Navy received an odd letter written in purple ink on blue-and-pink paper. The letter writer, an eccentric inventor and repairman named Nathaniel Baldwin, from the USA state of Utah, made what at the time was an astonishing claim: he had built, in his kitchen, a new kind of headset that could amplify sound. This was an opportune invention for the Navy, who asked for a sound test and then enthusiastically adopted the headsets, later called headphones, and used them in World War I for naval radio communication.</p>\n<p>The purpose of headphones is to concentrate a quiet and private sound in the ear of the listener, which is a radical departure from music's social purpose in history. 'Music, together with dance, co-evolved biologically and culturally to serve as a technology of social bonding,' Nills L Wallin and Bjorn Merker wrote in The Origins of Music. Songs don't leave behind fossils, but evidence of musical notation dates back to Sumeria, 35,000 years ago, and in 1995 archeologists discovered a bone flute in southern Europe estimated to be 44,000 years old. If music evolved as a social glue for the species, as a way to make groups and keep them together, headphones have done what writing and literacy did for language – they made music private.</p>\n<p>Author and columnist Stephen Marche wrote that separation from other people is one of the first things ordinary Americans spend their money achieving. It is 'a by-product of a long-standing national appetite for independence,' he said. Americans are not alone in their desire for personal independence and privacy. Marche is right; wealth can buy – and modern technology can deliver – personal independence, and it is this that people have always sought.</p>\n<p>Dr Michael Bull, an expert on personal music devices from the University of Sussex in the UK, has repeatedly made the larger point that personal music devices change how we relate to public spaces. Controlling our public spaces is more important now that more people are moving from the edges of cities to live in urban centers. 'With the urban space, the more it's inhabited, the safer you feel,' Bull says. 'You feel safe if you can feel people there, but you don't want to interact with them.' Headphones create shields for wearers, separating them from other people and their surroundings. Headphones have their own rules of good manners; they are like wearing a 'Do not disturb' sign. We assume that people wearing them are busy and we should respect their privacy, so now people wear them to appear busy. In fact, it is now becoming quite common for people not to listen to anything at all, but just to wear headphones.</p>\n<p>However, as pointed out at the beginning of this piece, although scientists have stated that headphones are bad for productivity, people still wear them at work. It is not just that headphones create privacy out of public areas, but also that music causes people to relax and reflect and pause. The outcome of relaxation, reflection and pausing at work won't be captured in minute-to-minute productivity metrics. What must be considered is that in moments of extreme focus, our attention radiates outward, toward the problem, rather than inward, on how to solve the problem. However, with music 'When our minds are at ease, we're more likely to direct the spotlight of attention inward,' Jonah Lehrer wrote in his book Imagine: How Creativity Works. 'The answers have been there all along. We just weren't listening.' In a crowded world, real estate is the ultimate scarce resource, and a headphone is a small invisible fence around our minds – making space, creating separation, and helping us listen to ourselves.</p>"}, "answers": {"1": "FALSE", "2": "TRUE", "3": "TRUE", "4": "NOT GIVEN", "5": "FALSE", "6": "populations", "7": "records", "8": "salt", "9": "glass", "10": "texture", "11": "light", "12": "chisel", "13": "meat", "14": "B", "15": "G", "16": "C", "17": "D", "18": "E", "19": "dancing", "20": "advertising", "21": "play", "22": "beauty", "23": "B", "24": "D", "25": "A", "26": "C", "27": "NOT GIVEN", "28": "YES", "29": "NOT GIVEN", "30": "NO", "31": "YES", "32": "A", "33": "C", "34": "D", "35": "B", "36": "A", "37": "B", "38": "E", "39": "G", "40": "A"}, "alt": {}, "expl": {"1": {"loc": "Para 2", "text": "'Charles Darwin thought that cooking, after language, was the greatest discovery' — cooking is ranked second, after language, not the single most significant development overall → FALSE."}, "2": {"loc": "Para 2", "text": "'Cooking can turn plants that are inedible into edible food by destroying toxic chemicals' → TRUE."}, "3": {"loc": "Para 3", "text": "'the ratio of energy gained to energy expended by the body is greater when food is cooked' → TRUE."}, "4": {"loc": "Final paragraph", "text": "No mention of Birdseye working in Australia — Australia is mentioned separately regarding shipping frozen fish → NOT GIVEN."}, "5": {"loc": "Final paragraph", "text": "'he observed that very rapid freezing creates smaller ice crystals... This was something he had not expected' → FALSE."}, "6": {"loc": "Para 4", "text": "'People began to create a variety of new tools to help with survival, and in turn populations increased in size' → 'populations'."}, "7": {"loc": "Para 4", "text": "'writing became more sophisticated and allowed people to maintain records of the harvest and taxes' → 'records'."}, "8": {"loc": "Para 5", "text": "'smoking, drying, adding acid by fermentation or adding salt' → 'salt'."}, "9": {"loc": "Para 6", "text": "'He sealed food in bottles fabricated from glass' → 'glass'."}, "10": {"loc": "Para 6", "text": "'the flavor of the food as well as the texture were similar to the freshly cooked product' → 'texture'."}, "11": {"loc": "Para 6", "text": "'he produced the first ones which were light and resistant to damage' → 'light'."}, "12": {"loc": "Para 6", "text": "'cans were opened with a chisel which was used to break open the top when hit with a hammer' → 'chisel'."}, "13": {"loc": "Para 6", "text": "'one can which contained meat dating from 1824 was opened in 1939' → 'meat'."}, "14": {"loc": "Paragraph B", "text": "'artists may just make a work of art because they feel compelled to... no aim or goal is necessarily required' → B."}, "15": {"loc": "Paragraph G", "text": "'They seek to connect with their audience and express an idea or emotion which has the capacity to enrich our experience of life' → G."}, "16": {"loc": "Paragraph C", "text": "'The distinction here lies between things that are instrumental and things that are ends in themselves' → C."}, "17": {"loc": "Paragraph D", "text": "'whatever else (to quote... Andy Warhol) anyone can get away with in calling their creation a contribution to ‘the arts’' → D."}, "18": {"loc": "Paragraph E", "text": "'We do not laugh so that we can achieve a further goal... Laughing is, in fact, good for something nevertheless' → E."}, "19": {"loc": "Paragraph C", "text": "'music can be written chiefly to accompany dancing' → 'dancing'."}, "20": {"loc": "Paragraph C", "text": "'pictures are used as instruments in advertising' → 'advertising'."}, "21": {"loc": "Paragraph C", "text": "'A play can be written to point out to the theatre audience a social injustice' → 'play'."}, "22": {"loc": "Paragraph C", "text": "'representing many different things that are valuable for their own sakes — such as, for instance, the creation of beauty' → 'beauty'."}, "23": {"loc": "Paragraph D", "text": "'to present a surprising or fresh angle on it' → B, seeing things from a different perspective."}, "24": {"loc": "Paragraph D", "text": "'the interest or perhaps disgust it provokes in them' → D, thinking about our reactions to things."}, "25": {"loc": "Paragraph F", "text": "'the arts are a response... to experience of the world, which lies inside the artist himself... an expression of what presses from within the artist' → A, springs from individual experience."}, "26": {"loc": "Paragraph F", "text": "'A symphony, unless it is devised to represent bird song, rain, the sea and the like, is an abstract expression' → C, can be unrelated to the natural world."}, "27": {"loc": "Para 1", "text": "The passage says workers themselves report confidence in music's benefits — it doesn't say they were persuaded BY the surveys (the surveys just record their existing belief) → NOT GIVEN."}, "28": {"loc": "Para 2", "text": "Multiple studies (Taiwanese study, other research, a reporter's conclusion) converge on the same view that silence is best → YES."}, "29": {"loc": "Para 3", "text": "The passage mentions health benefits of music generally, but not doctors specifically recommending headphones → NOT GIVEN."}, "30": {"loc": "Para 4", "text": "Baldwin is described as 'an eccentric inventor and repairman', not a government researcher → NO."}, "31": {"loc": "Para 5", "text": "'headphones have done what writing and literacy did for language – they made music private' → YES."}, "32": {"loc": "Para 3", "text": "'a service economy, with an emphasis on jobs in offices that require higher levels of concentration, reflection and creativity' → A."}, "33": {"loc": "Para 5", "text": "Citing musical notation and a 44,000-year-old bone flute supports 'music evolved as a social glue for the species' → C."}, "34": {"loc": "Para 5", "text": "'headphones have done what writing and literacy did for language – they made music private' — a departure from music's traditional social role → D."}, "35": {"loc": "Para 6", "text": "'wealth can buy – and modern technology can deliver – personal independence' → B."}, "36": {"loc": "Final paragraph", "text": "Lehrer's quote about minds at ease directing attention inward is used to back up the writer's argument that music's benefits go beyond productivity metrics → A."}, "37": {"loc": "Para 7", "text": "'personal music devices change how we relate to public spaces' → 'relationship' (B)."}, "38": {"loc": "Para 7", "text": "'more people are moving from the edges of cities to live in urban centers' — edges of cities = suburbs → 'suburbs' (E)."}, "39": {"loc": "Final paragraph", "text": "'a headphone is a small invisible fence around our minds' → 'barriers' (G)."}, "40": {"loc": "Para 7", "text": "'We assume that people wearing them are busy and we should respect their privacy' → 'courtesy' (A)."}}};

function mcq(n,t,opts){return '<div class="mcq" id="q'+n+'"><div class="prompt"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="choice-options">'+opts.map((o,i)=>'<label class="choice-option"><input type="radio" name="q'+n+'" value="'+'ABCD'[i]+'"> <b>'+'ABCD'[i]+'</b> '+o+'</label>').join('')+'</div></div>'}
var multiGroups={}, groupQNums={};
function multiSel(qA,qB,promptText,options){var name='g'+qA+'_'+qB;multiGroups[qA]=name;multiGroups[qB]=name;groupQNums[name]=[qA,qB];return '<div id="q_'+name+'" class="tf-row"><div class="statement"><span class="qnum">'+qA+', '+qB+'</span><span>'+promptText+'</span></div><div class="options">'+options.map(o=>'<label><input type="checkbox" name="'+name+'" value="'+o.letter+'"> <b>'+o.letter+'</b> '+o.text+'</label>').join('')+'</div></div>'}

function qhtml(p){
if(p===1)return '<div class="qgroup"><h3>Questions 1-5</h3><p><i>Do the following statements agree with the information given in the passage? Write <b>TRUE / FALSE / NOT GIVEN</b>.</i></p>'+tf(1,'According to Darwin, cooking was the most significant development in human history.')+tf(2,'The process of cooking gets rid of some plant poisons.')+tf(3,'Eating cooked food is more energy efficient than eating raw food.')+tf(4,'Clarence Birdseye had previously worked in the Australian food industry.')+tf(5,'Birdseye’s trip with the Inuit confirmed what he already believed about rapid freezing.')+'</div><div class="qgroup"><h3>Questions 6-13</h3><p><i>Complete the notes below. Choose <b>ONE WORD ONLY</b> from the passage for each answer.</i></p><div class="notes"><h3>The development of agriculture and food preservation</h3><div class="note-row"><b>The changes agriculture brought about were:</b></div><div class="note-row">&bull; the development of equipment and larger '+gap(6)+'</div><div class="note-row">&bull; the ability to keep '+gap(7)+' as writing developed</div><div class="note-row">&bull; the setting up of organized government</div><div class="note-row"><b>Food preservation</b></div><div class="note-row">&bull; early methods of food preservation included: smoking, drying and combining food with acid or '+gap(8)+'</div><div class="note-row">&bull; canning</div><div class="note-row" style="padding-left:20px;">- Nicholas Appert put food into containers made of '+gap(9)+'</div><div class="note-row" style="padding-left:20px;">- Appert’s method resulted in preserved food that had the same taste and '+gap(10)+' as fresh food</div><div class="note-row" style="padding-left:20px;">- Peter Durand introduced cans which had the advantage of being '+gap(11)+' and hard to break</div><div class="note-row" style="padding-left:20px;">- in 1855, the metal can opener replaced the '+gap(12)+' which had been used with a hammer to open cans</div><div class="note-row" style="padding-left:20px;">- some food was still found to be edible after more than a hundred years, e.g. an old can of '+gap(13)+'</div><div class="note-row">&bull; freezing</div></div></div>';
if(p===2)return '<div class="qgroup"><h3>Questions 14-18</h3><p><i>Reading Passage 2 has seven paragraphs, A–G. Which paragraph contains the following information?</i></p>'+sel(14,'a claim that artists may have no clear objective when creating a piece of art',['A','B','C','D','E','F','G'])+sel(15,'a description of how artists hope to benefit other people',['A','B','C','D','E','F','G'])+sel(16,'a comparison between the arts and things made to perform a particular function',['A','B','C','D','E','F','G'])+sel(17,'a claim that it’s possible to convince the world that anything you have made is a work of art',['A','B','C','D','E','F','G'])+sel(18,'an example of something that has an unintentional benefit for us',['A','B','C','D','E','F','G'])+'</div><div class="qgroup"><h3>Questions 19-22</h3><p><i>Complete the summary below. Choose <b>ONE WORD ONLY</b> from the passage for each answer.</i></p><p class="summary-text"><b>The arts and human experience</b><br>Some people may claim that the arts serve no useful purpose, that they achieve nothing measurable and help nobody. But there are many clear examples of their usefulness, such as the inter-dependent relationship between music and '+gap(19)+' or between the visual arts and the '+gap(20)+' business. A dramatist may use a '+gap(21)+' to draw our attention to various issues in society, for example some kind of injustice which needs correcting. Apart from these obvious practical benefits, there are other benefits that we gain from things, such as the '+gap(22)+' we find in an artist’s work.</p></div><div class="qgroup"><h3>Questions 23 and 24</h3><p>Choose <b>TWO</b> letters, A–E. In paragraph D, which <b>TWO</b> of the following effects does the writer say the arts can have?</p>'+multiSel(23,24,'',[{letter:'A',text:'They can interest people from all over the world.'},{letter:'B',text:'They can make us see things from a different perspective.'},{letter:'C',text:'They can inspire us to take up an artistic activity ourselves.'},{letter:'D',text:'They can encourage us to think about our reactions to things around us.'},{letter:'E',text:'They can draw our attention to serious global issues.'}])+'</div><div class="qgroup"><h3>Questions 25 and 26</h3><p>Choose <b>TWO</b> letters, A–E. Which <b>TWO</b> of the following statements about composers and music does the writer make?</p>'+multiSel(25,26,'',[{letter:'A',text:'Music tends to spring from the composer’s individual experiences.'},{letter:'B',text:'Composers need to structure music very carefully.'},{letter:'C',text:'Music can be quite unrelated to the natural world.'},{letter:'D',text:'Music finds its best expression in a symphony.'},{letter:'E',text:'Composers are good at depicting the world around us.'}])+'</div>';
return '<div class="qgroup"><h3>Questions 27-31</h3><p><i>Do the following statements agree with the claims of the writer? Write <b>YES / NO / NOT GIVEN</b>.</i></p>'+tf(27,'Young people are easily persuaded by surveys that listening to music is beneficial.',true)+tf(28,'Different studies share the same conclusions about the desirability of working in silence.',true)+tf(29,'Some doctors recommend wearing headphones to lower blood pressure.',true)+tf(30,'Nathaniel Baldwin was a respected government researcher.',true)+tf(31,'The effect of the invention of headphones is comparable to the effect of the invention of the writing.',true)+'</div><div class="qgroup"><h3>Questions 32-36</h3><p>Choose the correct letter, A, B, C or D.</p>'+mcq(32,'What does the writer suggest about a service economy?',['The work is mentally demanding','It provides employment for younger workers','It is a small part of a country’s economy','Workers have to live in urban centers'])+mcq(33,'When the writer mentions the historical evidence for early music, he is',['emphasizing the diversity of musical forms','expressing his frustration with the limited archaeological evidence uncovered','lending support to the view that music has been important in human history','creating a geographical map of the evolution of music'])+mcq(34,'What does the writer say about the social effects of listening to music through headphones?',['It has caused a reduction in the number of people who listen to music','It has increased people’s participation in music events','It has reduced the global variation of music styles','It has changed the traditional role of music in society'])+mcq(35,'What does the writer say about personal independence?',['Americans are unique in their desire for personal independence','Personal independence is something that can be purchased','Striving for personal independence is a recent phenomenon','Personal independence destroys social connections'])+mcq(36,'Why does the writer quote Jonah Lehrer in the last paragraph?',['to support the writer’s own view','to draw attention to an authoritative book about music','to raise awareness of people’s loss of listening skills','to illustrate how music brings people closer to each other'])+'</div><div class="qgroup"><h3>Questions 37-40</h3><p>Complete the summary using the list of words, A–I, below.</p><div class="box"><b>A</b> courtesy &nbsp; <b>B</b> relationship &nbsp; <b>C</b> difficulty &nbsp; <b>D</b> countryside &nbsp; <b>E</b> suburbs<br><b>F</b> language &nbsp; <b>G</b> barriers &nbsp; <b>H</b> obstacles &nbsp; <b>I</b> disapproval</div><p class="summary-text"><b>Headphones and city living</b><br>Dr Michael Bull believes that listening to music through headphones has changed the '+selInline(37,['A','B','C','D','E','F','G','H','I'])+' the wearers of headphones have with public spaces. Living in the center of cities is becoming popular, as people become less keen on living in the '+selInline(38,['A','B','C','D','E','F','G','H','I'])+'. In densely populated city centers, headphones form '+selInline(39,['A','B','C','D','E','F','G','H','I'])+' that isolate people from fellow citizens and from their environment. Wearers of headphones are treated with '+selInline(40,['A','B','C','D','E','F','G','H','I'])+' that other people do not receive. This is because if we see someone wearing headphones, we believe they must be occupied in some way and should not be interrupted.</p></div>';
}

function render(){partTitle.textContent='Part '+active;var r=ranges[active];partSub.textContent='Read the text and answer questions '+r[0]+'-'+r[1]+'.';left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();drawFooter();left.scrollTop=right.scrollTop=0}
function val(n){if(multiGroups[n]){var boxes=document.querySelectorAll('input[name="'+multiGroups[n]+'"]:checked');return Array.from(boxes).map(b=>b.value).join(',')}var g=document.getElementById('gap'+n);if(g)return g.value;var s=document.getElementById('sel'+n);if(s)return s.value;var r=document.querySelector('input[name="q'+n+'"]:checked');return r?r.value:''}
function save(){for(var n=1;n<=40;n++){var v=val(n);if(v)state[n]=v}}
function restore(){for(var n=1;n<=40;n++){if(!state[n])continue;if(multiGroups[n]){var vals=state[n].split(',');vals.forEach(function(v){var cb=document.querySelector('input[name="'+multiGroups[n]+'"][value="'+v+'"]');if(cb)cb.checked=true});continue}var g=document.getElementById('gap'+n);if(g)g.value=state[n];var s=document.getElementById('sel'+n);if(s)s.value=state[n];var r=document.querySelector('input[name="q'+n+'"][value="'+state[n]+'"]');if(r)r.checked=true}}
function answered(n){return !!state[n]||!!val(n)}
function count(p){var r=ranges[p],c=0;for(var i=r[0];i<=r[1];i++)if(answered(i))c++;return c}
function drawFooter(){save();var h='';[1,2,3].forEach(p=>{var r=ranges[p];h+='<div class="partnav"><button class="partlabel" data-part="'+p+'">Part '+p+'</button>';if(p===active){h+='<div class="tiles">';for(var n=r[0];n<=r[1];n++)h+='<button class="tile '+(answered(n)?'answered':'')+'" data-q="'+n+'">'+n+'</button>';h+='</div>'}else h+='<span class="count">'+count(p)+' of '+(r[1]-r[0]+1)+'</span>';h+='</div>'});h+='<button class="review" id="review">OK</button>';footer.innerHTML=h}
document.addEventListener('change',()=>{save();drawFooter()});document.addEventListener('input',()=>{save();drawFooter()});
var lastScore=null;
function renderActive(){left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();if(graded){regradeCurrent();right.insertAdjacentHTML('afterbegin','<div class="score">Your score: <b>'+lastScore+' / 40</b></div><p style="margin:-8px 0 18px;color:#555">Explanations with the exact location in the passage are shown below each answer. Switch Part 1/2/3 tabs to review the rest.</p>')}drawFooter();left.scrollTop=right.scrollTop=0}
footer.onclick=e=>{var p=e.target.closest('[data-part]');if(p){save();active=+p.dataset.part;renderActive();return}var q=e.target.closest('[data-q]');if(q){var n=+q.dataset.q;(document.getElementById('q'+n)||document.getElementById('gap'+n)||document.getElementById('sel'+n))?.scrollIntoView({behavior:'smooth',block:'center'});return}if(e.target.closest('#review'))review()};
function review(){save();var a=0;for(var n=1;n<=40;n++)if(answered(n))a++;subwrap.innerHTML='<p>You have answered <b>'+a+'</b> of 40 questions.</p><p><button class="ovrow submit" id="final">Submit test</button></p>';final.onclick=grade;submit.classList.add('show')}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function correct(n,v){if(multiGroups[n]){var parts=(v||'').split(',').map(norm).filter(Boolean);return parts.includes(norm(answers[n]))}return [answers[n]].concat(alt[n]||[]).some(a=>norm(a)===norm(v))}
function explHTML(n){var e=EXPL[n];if(!e)return '';return '<div class="expl"><b>Q'+n+' — correct answer: '+answers[n]+'</b> &nbsp;<span class="expl-loc">('+e.loc+')</span><br>'+e.text+'</div>'}
function markGap(n){var x=document.getElementById('gap'+n);if(!x)return;var ok=correct(n,x.value);x.disabled=true;x.classList.add(ok?'ok':'no');x.insertAdjacentHTML('afterend',(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>')+explHTML(n));return ok}
function markSel(n){var s=document.getElementById('sel'+n);if(!s)return;var ok=correct(n,s.value);s.disabled=true;s.classList.add(ok?'ok':'no');var row=document.getElementById('q'+n);var tag=(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>');if(row){row.insertAdjacentHTML('beforeend',tag);row.insertAdjacentHTML('afterend',explHTML(n))}else{s.insertAdjacentHTML('afterend',tag);var host=s.closest('p')||s;host.insertAdjacentHTML('afterend',explHTML(n))}return ok}
function markRadio(n){var r=document.querySelector('input[name="q'+n+'"]:checked');var ok=r&&correct(n,r.value);document.querySelectorAll('input[name="q'+n+'"]').forEach(i=>i.disabled=true);var box=document.getElementById('q'+n);box.insertAdjacentHTML('beforeend',(ok?'<span class="tag ok">\u2713</span>':'<span class="tag no">\u2718 correct: '+answers[n]+'</span>'));box.insertAdjacentHTML('afterend',explHTML(n));return ok}
function markMulti(group){var qNums=groupQNums[group];var boxes=document.querySelectorAll('input[name="'+group+'"]');var checkedVals=Array.from(boxes).filter(function(b){return b.checked}).map(function(b){return b.value});boxes.forEach(function(b){b.disabled=true});var container=document.getElementById('q_'+group);var tagHtml='';qNums.forEach(function(qn){var ok=checkedVals.includes(answers[qn]);tagHtml+=' '+(ok?'<span class="tag ok">Q'+qn+' \u2713</span>':'<span class="tag no">Q'+qn+' \u2718 correct: '+answers[qn]+'</span>')});container.insertAdjacentHTML('beforeend','<div style="margin-top:8px;">'+tagHtml+'</div>');var explAll='';qNums.forEach(function(qn){explAll+=explHTML(qn)});container.insertAdjacentHTML('afterend',explAll)}
function regradeCurrent(){var r=ranges[active];var doneGroups={};for(var n=r[0];n<=r[1];n++){if(multiGroups[n]){if(!doneGroups[multiGroups[n]]){markMulti(multiGroups[n]);doneGroups[multiGroups[n]]=true}continue}var g=document.getElementById('gap'+n),s=document.getElementById('sel'+n),rad=document.querySelector('input[name="q'+n+'"]');if(g)markGap(n);else if(s)markSel(n);else if(rad)markRadio(n)}}
function grade(){if(graded)return;save();var score=0;for(var n=1;n<=40;n++)if(correct(n,state[n]||''))score++;lastScore=score;graded=true;active=1;renderActive();submit.classList.remove('show')}
var drag=false;div.onmousedown=()=>{drag=true;document.body.style.userSelect='none'};window.onmouseup=()=>{drag=false;document.body.style.userSelect=''};window.onmousemove=e=>{if(!drag)return;var r=split.getBoundingClientRect();left.style.width=Math.max(220,Math.min(r.width-240,e.clientX-r.left))+'px'};
split.onmouseup=()=>setTimeout(()=>{var s=getSelection();if(!s||s.isCollapsed||!s.rangeCount){tools.style.display='none';return}var rg=s.getRangeAt(0);if(!split.contains(rg.commonAncestorContainer)){tools.style.display='none';return}var rc=rg.getBoundingClientRect();tools.style.display='flex';tools.style.left=(rc.left+scrollX)+'px';tools.style.top=Math.max(8,rc.top+scrollY-42)+'px'},1);
tools.onclick=e=>{var b=e.target.closest('button'),s=getSelection();if(!b||!s.rangeCount)return;var rg=s.getRangeAt(0);if(b.dataset.act==='hl'){try{var sp=document.createElement('span');sp.className='hl';rg.surroundContents(sp)}catch(_){document.execCommand('hiliteColor',false,'#ffe45c')}}else document.querySelectorAll('.hl').forEach(h=>h.replaceWith(document.createTextNode(h.textContent)));s.removeAllRanges();tools.style.display='none'};
render();
})();
</script></body></html>
