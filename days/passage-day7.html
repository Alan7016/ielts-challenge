t:inherit;border:1px solid #999;border-radius:4px;background:#fff;padding:5px 8px;width:175px;text-align:center;margin:0 5px}.notes{font-size:17px;line-height:1.75}.note-row{margin:10px 0}.box{background:#f2f3f4;border:1px solid #ddd;border-radius:6px;padding:14px 18px;line-height:1.7;font-size:17px;margin:14px 0}.row{display:flex;gap:12px;align-items:flex-start;margin:16px 0}.txt{flex:1;font-size:17px;line-height:1.45}.select{font:inherit;border:1px solid #cfcfcf;border-radius:7px;background:#f7f8f9;padding:8px 28px 8px 14px;min-width:86px}.drop-slot{height:43px;border:1px dashed #cfd4db;border-radius:5px;background:#f7f8f9;display:flex;align-items:center;padding:0 12px;margin:16px 0;font-weight:700;gap:12px}.drop-slot.active{outline:2px solid #2563a8;background:#eef6ff}.drop-slot.filled{border-style:solid;background:#fff}.headings{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin:14px 0 24px}.heading-pill{border:1px solid #d7d7d7;border-radius:8px;background:#fff;color:#111;font:inherit;font-weight:700;padding:6px 14px;box-shadow:0 1px 2px #0002;cursor:grab}.heading-pill.selected{outline:3px solid #222}.tools{position:absolute;z-index:50;display:none;background:#222;border-radius:6px;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.2)}.tools button{background:none;border:0;color:#fff;padding:6px 10px;font:inherit}.hl{background:#ffe45c}.bar{height:59px;border-top:1px solid #ddd;display:flex;align-items:center;gap:28px;padding:8px 18px;background:#fff;overflow-x:auto}.partnav{display:flex;align-items:center;gap:8px;white-space:nowrap}.partlabel{font-weight:700;border:0;background:#fff;font:inherit;cursor:pointer}.count{color:#555;font-size:14px}.tiles{display:flex;gap:4px}.tile{min-width:32px;height:32px;border:1px solid #bbb;background:#fff;border-radius:2px;cursor:pointer}.tile.answered{background:#2b2b2b;color:#fff}.review{margin-left:auto;min-width:42px;height:34px;background:#ddd;border:0;border-radius:4px;font-weight:700}.overlay{position var passages={"1": "<h1>The English canal system</h1>\n<p>The development of a large inland water-transport network of rivers and canals in England in the 18th century was a direct result of the industrial revolution, which needed the support of an effective transport system. The use of inland water transport in England, where rivers are not large compared to elsewhere in Europe, may seem unexpected because no location in England is further than about 150 kilometers from the sea. Thus, road transport would seem to have been more viable. However, the small size of rivers may have been an advantage. In the early 18th century, hydraulic technology was still in its infancy and the smaller scale of works necessary for canal and river navigations in England would certainly have made it easier for the engineers of the time to organize them and carry them out. Another factor in favor of the development of water transport in England is that the roads of the period were insufficient in number and badly maintained, particularly in the steep hills and valleys of the north, and in general they were incapable of carrying the vast quantities of heavy materials needed to supply the growing demands of industry. Merchants who owned factories or who sold the goods produced needed cheap transport for raw materials and for finished products. It was the English merchants who paid for the construction of the first highly successful English canals, unlike many of the European canals, which were financed by the aristocracy. By the second half of the 18th century, most of England\u2019s canal system had been completed. Civil engineering had improved, and a few early canals which had had long, winding routes were made more direct, thus reducing the overall length of the canal. An additional engineering task was the building of locks, which enabled canals to be built in areas where there were hills. Locks basically acted as steps or lifts to raise or lower a boat from one canal level to another. When a boat was in the central chamber and both sets of lock gates were shut no water could enter or escape through the gates as they were totally waterproof. However, water could enter or leave the lock through the sluice gates. Sluice gates were located below the lock gates and could be opened to allow water to flood into the lock to raise a boat or to flood out of the lock to lower a boat. When the water levels both inside and outside the lock were equal, the lock gates in front of the boat could be opened and it could continue on its journey. However, there were factors associated with the development of late-18th-century canals which were to cause continual problems for the entire system. To keep down costs, many canals and locks in industrial arena were constructed to small dimensions; often locks were as narrow as 2.15 meters wide. A consequence of this was that boats also had to be narrow. That there would be rapid growth in the amount of produce transported on canals was not appreciated by canal builders of the time. In contrast, canals leading to coastal rivers and ports were wider and had larger boats and locks (around 4.3 meters wide) than the canals in industrial areas. This lack of uniformity of size resulted in a fragmented transport system. Many of the new canals planned in the 1790s were looked upon just as a means of making money by speculators. These people were not involved with local industries and sometimes lived in other parts of the country. They expected that canals would continue to be successful irrespective of where they were built. However, only a few of them were profitable. Those that were, were usually wide canals in northern England, where they provided a vital link between industry and transport. Many canals of this period were built in agricultural regions, but canals depend on industry for their supply of cargo and so these canals barely repaid their construction costs. By the early 19th century, most were unable to compete with the new railways. To reduce competition, railway companies purchased many of the canals but did not maintain them properly, so several were abandoned. Inland water transport is no longer widely used in England, with most goods being carried by road. During the latter half of the 20th century, the GDI campaigned to increase national recognition of canals and the role they could play in recreation. It was a difficult task as many influential people in the community thought most canals were already virtually derelict and often parents tried to have them drained because they considered canals a danger to children. However, the increasing publicity which was being given to canals brought them to the attention of a wider and wider audience. Some people were interested in the historic aspects of canals. Because there had been so little investment in them, many canals had remained virtually unchanged from the days, 200 years previously, when they were built. Today, as a result of canal conservation and restoration, they are seen as places of both historical and environmental interest.</p>", "2": "<h1>The Myth of the Eight-hour Sleep</h1>\n<p>A We often worry about lying awake in the middle of the night - but it could be good for you. Indications from both science and history suggest that the eight-hour sleep may not be a natural or inborn pattern for humans. In the early 1990s, psychiatrist Thomas Wehr conducted research which implies just that. Wehr kept a group of people in a darkened room for 14 hours a day for a month. It took some time for their sleep to regulate, but by the fourth week the subjects had settled into a very distinct sleeping pattern. First, they slept for four hours, then woke for one or two hours before falling into a second four-hour sleep. Though sleep scientists were impressed by the implications of the study, the idea that we must sleep for eight consecutive hours persists amongst the general public.</p>\n<p>B In 2001, historian Roger Ekirch of Virginia Tech University in the US published a paper drawn from 16 years of research, revealing historical evidence that humans used to sleep in two distinct periods of time each night. Ekirch\u2019s research found more than 500 references to a segmented sleeping pattern - in diaries, court records, medical books and literature, from the ancient Greeks to tribes in Nigeria. Much like Wehr\u2019s findings, these references describe a first sleep which began not long following sunset. Then there was a waking period of one or two hours and after that a second sleep. During the waking period, people could be quite active. They sometimes got up and moved around the house, although most people stayed in bed, and perhaps read or wrote if they had enough money for candles. In many historic accounts, Ekirch found that people used the time that they were awake between periods of sleep to think about and attempt to analyze their dreams. In his book, Evening\u2019s Empire, historian Craig Koslofsky suggests an explanation for this divided sleep pattern in Europe. \u2018Associations with night before the 17th century were not good,\u2019 he writes. He goes on to explain that the streets of the cities and towns at night were often populated by thieves or worse. The streets at night consequently scared many people. Even the wealthy, who could afford to light their way, had better things to spend their nights on. C Ekirch found that references to the first and second sleep started to disappear during the late 17th century. The pattern began to alter first among the upper classes in northern Europe and, over the course of the next 200 years, began changing amongst the rest of Western society. By the 1920s, the idea a first and second sleep had receded entirely from our social consciousness. Ekirch attributes the initial shift to improvements in street and home lighting. As the night became a time for all kinds of activity, the length of time people sleep declined. In 1667, Paris became the first city in the world to light its streets, using wax candles in glass lamps. It was followed by another French city, Lille, in the same year and by Amsterdam in Holland two years later, where a much more efficient oil-powered lamp was developed. London didn't light its streets until 1684, but by the end of the 17th century, more than 50 of Europe's major towns and cities were lit at night. Coffee houses emerged as a fashionable phenomenon and many were open virtually around the clock. Going out at night became commonplace, and spending hours lying in bed was considered a waste of time. 'People were becoming increasingly time-conscious and sensitive to efficiency, certainly before the 19th century,' says Ekirch. 'But the Industrial Revolution intensified that attitude considerably.' Strong evidence of this shifting attitude is contained in a medical journal from 1829 which urged parents to force their children out of the pattern of first and second sleep. D Today, most people seem to have adapted quite well to the eight-hour sleep, but Ekirch believes many sleeping problems may have roots in the human body\u2019s natural preference for divided sleep, as well as in difficulties caused by extended exposure to artificial light in the modern world. This could be the cause of a condition called sleep maintenance insomnia, where people wake during the night and have trouble getting back to sleep. The condition first appears in literature at the end of the 19th century, at the same time as accounts of interrupted sleep disappear. E Sleep psychologist, Gregg Jacobs, says that the idea that we must sleep for an extended period of time could be damaging if it makes people who wake up in the night anxious, as this anxiety can itself discourage sleep and is likely to affect waking life too. Jacobs suggests that the waking period between sleeps, when people simply rested and relaxed, could have played an important part in the human capacity to regulate stress naturally. Russell Foster, a professor of circadian (body clock) neuroscience at Oxford University in the UK, shares this point of view. \u2018Over 30% of the medical problems that doctors are faced with stem directly or indirectly from sleep. But sleep has been ignored in medical training, and there are very few centers where sleep is studied,\u2019 Foster says. He feels this needs to change.</p>", "3": "<h1>Thinking for themselves</h1>\n<p>Some insights into animal intelligence In 1977 Irene Pepperberg brought Alex, a one-year-old African gray parrot, into her lab at Harvard University to teach him to reproduce the sounds of English. At that time most scientists considered animals mere machines, lacking the ability to think in a rational way or feel emotions as humans do. \u2018I wasn\u2019t trying to see if Alex could learn a human language,\u2019 said Pepperberg. \u2018My plan always was to use his imitative skills to get a better understanding of avian cognition.\u2019 Given that Alex\u2019s brain was the size of a walnut, most researchers thought Pepperberg\u2019s study would be futile. But by the time Alex died in 2007, he knew 150 words, could count, do simple arithmetic, and distinguish between objects according to shape, color, and material. Many of Alex\u2019s skills, such as his ability to understand the concepts of \u2018same\u2019 and \u2018different\u2019, are generally ascribed only to higher mammals. But parrots, like higher apes (and humans), live in complex societies, and need to monitor changing relationships and environments. \u2018They need to distinguish colors to know when a fruit is ripe or unripe,\u2019 Pepperberg noted. They need to categorize things - what\u2019s edible, what isn\u2019t - and to know the shapes of predators. And it helps to have a concept of numbers if you need to keep track of your flock. For a long-lived bird, you can\u2019t do all of this with instinct; cognition must be involved.\u2019 Just how easily mental skills can be acquired is perhaps best illustrated by dogs. For abstract thinking, humans employ symbols, letting one thing stand for another. And Juliane Kaminski, of the Max Planck Institute for Evolutionary Anthropology in Leipzig, believes that dogs can do this too. In 2008, Kaminski and her colleague Sebastian Tempelmann conducted an experiment with a border collie. The dog successfully selected and brought her owner toys which she had never seen before, prompted only by a picture of each toy. Creativity is another skill which seems to have evolved in humans and animals alike. \u2018People were initially surprised to discover that chimpanzees make tools,\u2019 says behavioral ecologist Alex Kacelnik. \u2018But then people thought, \u201cWell, they share our ancestry - of course they\u2019re smart.\u201d Now we\u2019re finding these kinds of exceptional behaviors in some species of birds.\u2019 New Caledonian crows, for example, use their beaks and claws to fashion tools to poke out grubs from palm trees. \u2018But the problem is we don\u2019t have a recently shared ancestry with birds - our last common ancestor was a reptile living over 300 million years ago.\u2019 Kacelnik and his researchers at Oxford University were particularly impressed with the ingenuity of one of the crows - Betty, a wild-caught female. In one experiment, Betty successfully selected a hook-shaped wire to get a piece of meat from a glass tube. Then, when another bird unexpectedly stole the hook, Betty took a straight piece of wire, shaped it into a hook, and retrieved the food. This was the first time Betty had seen a piece of wire like this, Kacelnik says, \u2018is a major kind of cognitive sophistication.\u2019 We are clearly not alone in our ability to invent or plan - or even to plot and lie. Studies show that western scrub jays can guess another bird\u2019s intentions and act on that knowledge. A jay knows that if another jay watches it hide a nut, there\u2019s a chance it will be stolen. So, the first jay will return to move the nut when the other jay is gone. \u2018It\u2019s some of the best evidence so far of experience projection in another species,\u2019 says Nicky Clayton of Cambridge University. What\u2019s more, the jays seem to know how long ago they hid a particular kind of food, and they manage to retrieve it before it spoils. Human cognitive psychologists call this ability \u2018episodic memory\u2019 and argue that it only exists in species that can mentally travel back in time. They believe that animals cannot distinguish among past, present, and future the way humans do. Such skepticism is a challenge for Clayton. \u2018We have good evidence that jays remember specific hiding events, which is the original definition of episodic memory. But now the goalposts have moved. Whenever we find a mental skill in a species that is reminiscent of human ability, the human cognition scientists change the definition.\u2019 Cognitive psychologist Louis Herman has spent decades studying bottlenose dolphins. These intelligent mammals are highly interactive, social and cosmopolitan, living in subpolar to tropical environments worldwide. Among the many skills exhibited by Herman\u2019s dolphins is the ability to imitate the motor behaviors of instructors. If a trainer bent backward and lifted a leg, the dolphin would turn on its back and lift its tail in the air. This requires the imitator to form a mental image of the other individual\u2019s body, then adjust its own body accordingly - actions that imply an awareness of one\u2019s self, an ability once seen as the sole preserve of humans. What Herman finds fascinating is that these aquatic creatures diverged from primates millions of years ago. That kind of cognitive convergence suggests there must be some similar pressures selecting for intellect. \u2018We don\u2019t share their biology or ecology, but do share the need to establish life-long bonds and alliances. This appears to be the likely common driving force.\u2019</p>"},answers={"1": "TRUE", "2": "NOT GIVEN", "3": "TRUE", "4": "TRUE", "5": "FALSE", "6": "hills", "7": "central chamber", "8": "sluice gates", "9": "equal", "10": "speculators", "11": "northern England", "12": "agricultural regions", "13": "railway companies", "14": "vii", "15": "v", "16": "i", "17": "vi", "18": "iii", "19": "C", "20": "E", "21": "B", "22": "B", "23": "D", "24": "sunset", "25": "dreams", "26": "thieves", "27": "G", "28": "D", "29": "F", "30": "B", "31": "A", "32": "C", "33": "A", "34": "B", "35": "D", "36": "YES", "37": "NO", "38": "NOT GIVEN", "39": "NOT GIVEN", "40": "NO"},alt={"25": ["dream"], "36": ["TRUE"], "37": ["FALSE"], "40": ["FALSE"]};
function tf(n,t,yn){var opts=yn?['YES','NO','NOT GIVEN']:['TRUE','FALSE','NOT GIVEN'];return '<div class="tf-row" id="q'+n+'"><div class="statement"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="options">'+opts.map(o=>'<label><input type="radio" name="q'+n+'" value="'+o+'"> '+o+'</label>').join('')+'</div></div>'}
function gap(n){return '<span class="qnum">'+n+'</span><input class="gap" id="gap'+n+'">'}
function sel(n,t,letters){return '<div class="row" id="q'+n+'"><span class="qnum">'+n+'</span><span class="txt">'+t+'</span><select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select></div>'}
function mcq(n,t,opts){return '<div class="mcq" id="q'+n+'"><div class="prompt"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="choice-options">'+opts.map((o,i)=>'<label class="choice-option"><input type="radio" name="q'+n+'" value="'+'ABCD'[i]+'"> <b>'+'ABCD'[i]+'</b> '+o+'</label>').join('')+'</div></div>'}
function headings(){return '<div class="headings">'+[['i','Historical reasons why interrupted sleep became uncommon'],['ii','Brain structures involved in sleep patterns'],['iii','Potential health issues related to sleep'],['iv','Famous cases in literature of sleep problems'],['v','An analysis of old documents to discover sleep patterns'],['vi','Biological and environmental factors preventing people from falling asleep again'],['vii','Scientific evidence that divided sleep is a natural phenomenon']].map(x=>'<button class="heading-pill" draggable="true" data-head="'+x[0]+'">'+x[0]+'. '+x[1]+'</button>').join('')+'</div>'}
function qhtml(p){if(p===1)return '<div class="qgroup"><h3>Questions 1-5</h3>'+tf(1,'Larger rivers would have made the work of 18th-century hydraulic engineers more difficult.')+tf(2,'Merchants refused to pay the high costs associated with road transport.')+tf(3,'18th-century European and English canals were funded differently.')+tf(4,'Canals were narrower in some places than in others.')+tf(5,'The GDI tried to get support for canal closures.')+'</div><div class="qgroup"><h3>Questions 6-9</h3><div class="notes"><h3>Canal locks</h3><div class="note-row">locks allowed canals to be built on '+gap(6)+'</div><div class="note-row">a boat is shut in the '+gap(7)+' of the lock</div><div class="note-row">'+gap(8)+' open or close to raise or lower the water level</div><div class="note-row">water levels have to be '+gap(9)+' before the boat can exit</div></div></div><div class="qgroup"><h3>Questions 10-13</h3><p>10. Which group saw canals as a way of getting rich? '+gap(10)+'</p><p>11. In which area did the canals make more money? '+gap(11)+'</p><p>12. What were the wrong areas to build profitable canals in? '+gap(12)+'</p><p>13. Who bought the unprofitable canals? '+gap(13)+'</p></div>';
if(p===2)return '<div class="qgroup"><h3>Questions 14-18</h3><p><i>Choose the correct heading for each section.</i></p>'+headings()+'</div>'+['A','B','C','D','E'].map((s,i)=>'<div class="drop-slot" data-q="'+(14+i)+'" id="q'+(14+i)+'"><span>'+(14+i)+' Section '+s+'</span><span class="slot-text"></span></div>').join('')+'<div class="qgroup"><h3>Questions 19-23</h3><div class="box"><b>A</b> Thomas Wehr<br><b>B</b> Roger Ekirch<br><b>C</b> Craig Koslofsky<br><b>D</b> Gregg Jacobs<br><b>E</b> Russell Foster</div>'+sel(19,'In certain historical periods, the threat of criminal danger led to segmented sleep.',['A','B','C','D','E'])+sel(20,'Physicians should learn more about treating people with sleeping difficulties.',['A','B','C','D','E'])+sel(21,'Historically, waking periods at night were used for different activities.',['A','B','C','D','E'])+sel(22,'Technological changes in Europe made people more likely to sleep through the night.',['A','B','C','D','E'])+sel(23,'The belief that humans should have a long continuous sleep can be psychologically harmful.',['A','B','C','D','E'])+'</div><div class="qgroup"><h3>Questions 24-26</h3><p>People went to bed soon after '+gap(24)+', then woke up to consider the meaning of their '+gap(25)+'. In 17th-century Europe, people stayed home because they feared '+gap(26)+' on unlit streets.</p></div>';
return '<div class="qgroup"><h3>Questions 27-30</h3><div class="box"><b>A</b> make their own tools.<br><b>B</b> copy a human\'s posture.<br><b>C</b> recognize their own images.<br><b>D</b> interpret visual representations of objects.<br><b>E</b> use language creatively.<br><b>F</b> predict another individual\'s actions.<br><b>G</b> learn basic number skills.</div>'+sel(27,'Irene Pepperberg has shown that parrots can',['A','B','C','D','E','F','G'])+sel(28,'Experiments have indicated that dogs know how to',['A','B','C','D','E','F','G'])+sel(29,'Research has revealed that scrub jays are able to',['A','B','C','D','E','F','G'])+sel(30,'Captive dolphins have been seen to',['A','B','C','D','E','F','G'])+'</div><div class="qgroup"><h3>Questions 31-35</h3>'+mcq(31,'What is Pepperberg doing in the third paragraph?',['justifying her belief in birds\' cognitive skills','explaining how cognition-based skills can be tested','detailing how birds acquire cognitive skills','describing differences between instinct and cognition'])+mcq(32,'According to Kacelnik, people doubt birds\' tool-making abilities because of the birds\'',['brain size.','physical limitations.','evolutionary history.','feeding requirements.'])+mcq(33,'What is most significant about Betty the crow\'s behavior?',['her ability to visualize the finished tool','her physical dexterity','her speed in solving problems','her understanding of wire flexibility'])+mcq(34,'What is Clayton\'s complaint about human cognition scientists?',['They use different criteria.','They alter the meanings of terms.','They fail to understand her aims.','They claim there are flaws.'])+mcq(35,'What factor matters in cognitive skills in humans and dolphins?',['communicative ability','brain capacity','range of habitat','social relationships'])+'</div><div class="qgroup"><h3>Questions 36-40</h3>'+tf(36,'In 1977, only a few scientists believed that birds were capable of logical thought.',true)+tf(37,'Pepperberg wanted to see if Alex could be trained to speak English fluently.',true)+tf(38,'Higher apes such as chimpanzees show an awareness of others\' intentions.',true)+tf(39,'Betty was the only crow in Kacelnik\'s study who made a tool out of wire.',true)+tf(40,'It is now widely accepted that animals understand about past events.',true)+'</div>'}
function render(){partTitle.textContent='Part '+active;var r=ranges[active];partSub.textContent='Read the text and answer questions '+r[0]+'-'+r[1]+'.';left.innerHTML=passages[active];right.innerHTML=qhtml(active);setupHeads();restore();drawFooter();left.scrollTop=right.scrollTop=0}
function setupHeads(){document.querySelectorAll('.heading-pill').forEach(b=>{b.ondragstart=e=>e.dataTransfer.setData('text/plain',b.dataset.head);b.onclick=()=>{selectedHead=selectedHead===b.dataset.head?null:b.dataset.head;document.querySelectorAll('.heading-pill').forEach(x=>x.classList.toggle('selected',selectedHead===x.dataset.head))}});document.querySelectorAll('.drop-slot').forEach(s=>{s.ondragover=e=>{e.preventDefault();s.classList.add('active')};s.ondragleave=()=>s.classList.remove('active');s.ondrop=e=>{e.preventDefault();s.classList.remove('active');setSlot(s,e.dataTransfer.getData('text/plain'))};s.onclick=()=>{if(selectedHead)setSlot(s,selectedHead)}})}
function setSlot(s,h){s.dataset.head=h;state[s.dataset.q]=h;var b=document.querySelector('.heading-pill[data-head="'+h+'"]');s.querySelector('.slot-text').textContent=b?b.textContent:'';s.classList.add('filled');drawFooter()}
function val(n){var d=document.querySelector('.drop-slot[data-q="'+n+'"]');if(d)return d.dataset.head||'';var g=document.getElementById('gap'+n);if(g)return g.value;var s=document.getElementById('sel'+n);if(s)return s.value;var r=document.querySelector('input[name="q'+n+'"]:checked');return r?r.value:''}
function save(){for(var n=1;n<=40;n++){var v=val(n);if(v)state[n]=v}}function restore(){for(var n=1;n<=40;n++){if(!state[n])continue;var d=document.querySelector('.drop-slot[data-q="'+n+'"]');if(d)setSlot(d,state[n]);var g=document.getElementById('gap'+n);if(g)g.value=state[n];var s=document.getElementById('sel'+n);if(s)s.value=state[n];var r=document.querySelector('input[name="q'+n+'"][value="'+state[n]+'"]');if(r)r.checked=true}}
function answered(n){return !!state[n]||!!val(n)}function count(p){var r=ranges[p],c=0;for(var i=r[0];i<=r[1];i++)if(answered(i))c++;return c}
function drawFooter(){save();var h='';[1,2,3].forEach(p=>{var r=ranges[p];h+='<div class="partnav"><button class="partlabel" data-part="'+p+'">Part '+p+'</button>';if(p===active){h+='<div class="tiles">';for(var n=r[0];n<=r[1];n++)h+='<button class="tile '+(answered(n)?'answered':'')+'" data-q="'+n+'">'+n+'</button>';h+='</div>'}else h+='<span class="count">'+count(p)+' of '+(r[1]-r[0]+1)+'</span>';h+='</div>'});h+='<button class="review" id="review">OK</button>';footer.innerHTML=h}
document.addEventListener('change',()=>{save();drawFooter()});document.addEventListener('input',()=>{save();drawFooter()});footer.onclick=e=>{var p=e.target.closest('[data-part]');if(p){save();active=+p.dataset.part;render();return}var q=e.target.closest('[data-q]');if(q){var n=+q.dataset.q;(document.getElementById('q'+n)||document.getElementById('gap'+n)||document.getElementById('sel'+n)||document.querySelector('.drop-slot[data-q="'+n+'"]'))?.scrollIntoView({behavior:'smooth',block:'center'});return}if(e.target.closest('#review'))review()};function review(){save();var a=0;for(var n=1;n<=40;n++)if(answered(n))a++;subwrap.innerHTML='<p>You have answered <b>'+a+'</b> of 40 questions.</p><p><button class="ovrow submit" id="final">Submit test</button></p>';final.onclick=grade;submit.classList.add('show')}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}function correct(n,v){return [answers[n]].concat(alt[n]||[]).some(a=>norm(a)===norm(v))}function grade(){if(graded)return;graded=true;save();var score=0;for(var n=1;n<=40;n++)if(correct(n,state[n]||''))score++;subwrap.innerHTML='<div class="score">Your score: <b>'+score+' / 40</b></div><p>Correct answers are built into this test. Reopen the file to take it again from a clean state.</p>';render()}
var drag=false;div.onmousedown=()=>{drag=true;document.body.style.userSelect='none'};window.onmouseup=()=>{drag=false;document.body.style.userSelect=''};window.onmousemove=e=>{if(!drag)return;var r=split.getBoundingClientRect();left.style.width=Math.max(220,Math.min(r.width-240,e.clientX-r.left))+'px'};split.onmouseup=()=>setTimeout(()=>{var s=getSelection();if(!s||s.isCollapsed||!s.rangeCount){tools.style.display='none';return}var rg=s.getRangeAt(0);if(!split.contains(rg.commonAncestorContainer)){tools.style.display='none';return}var rc=rg.getBoundingClientRect();tools.style.display='flex';tools.style.left=(rc.left+scrollX)+'px';tools.style.top=Math.max(8,rc.top+scrollY-42)+'px'},1);tools.onclick=e=>{var b=e.target.closest('button'),s=getSelection();if(!b||!s.rangeCount)return;var rg=s.getRangeAt(0);if(b.dataset.act==='hl'){try{var sp=document.createElement('span');sp.className='hl';rg.surroundContents(sp)}catch(_){document.execCommand('hiliteColor',false,'#ffe45c')}}else document.querySelectorAll('.hl').forEach(h=>h.replaceWith(document.createTextNode(h.textContent)));s.removeAllRanges();tools.style.display='none'};render();
})();
</script></body></html>
