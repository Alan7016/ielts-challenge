<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mentor Dashboard — IELTS Marathon</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="content" style="display:none;">

  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo">IELTS <span>MARATHON</span></div>
      <div style="display:flex; align-items:center; gap:14px;">
        <a href="group-chat.html" class="ghost" style="padding:7px 14px; font-size:0.82rem; text-decoration:none;">💬 Group Chat</a>
        <div class="profile-avatar-wrap" style="width:34px; height:34px;">
          <div class="avatar-circle" id="avatar-display" style="width:34px; height:34px; font-size:0.8rem; cursor:pointer;" title="Click to change your picture">…</div>
          <label class="avatar-camera-badge" id="avatar-camera-badge" style="width:16px; height:16px; font-size:0.6rem;">
            📷
            <input type="file" id="avatar-input" accept="image/png, image/jpeg, image/webp">
          </label>
        </div>
        <span style="font-family:var(--mono); font-size:0.82rem; color:var(--muted); display:flex; align-items:center; gap:6px;">
          Hi, <span id="user-greeting" style="color:var(--ink); font-weight:600;">…</span>
          <button class="ghost" id="edit-name-btn" style="padding:2px 8px; font-size:0.7rem;">Edit</button>
        </span>
        <button class="ghost" id="logout-btn" style="padding:7px 14px;">Log out</button>
      </div>
    </div>
  </header>
  <div class="wrap"><p id="avatar-status" style="font-size:0.78rem; color:var(--muted); margin:4px 0 0; text-align:right;"></p></div>

  <section class="hero" style="padding-top:56px; padding-bottom:8px;">
    <div class="wrap">
      <div class="eyebrow" id="page-eyebrow">Mentor view</div>
      <h1 id="page-title">Loading…</h1>
      <div id="day-picker-row" style="display:none; align-items:center; gap:10px; margin-top:16px;">
        <label style="font-size:0.85rem; font-weight:600;">Viewing:</label>
        <select id="day-select" style="padding:6px 10px; border:1px solid var(--border); border-radius:8px; font-family:var(--mono); font-size:0.85rem;"></select>
      </div>
    </div>
  </section>

  <section>
    <div class="wrap" id="dashboard-root">
      <p style="color:var(--muted); font-family:var(--mono); font-size:0.85rem;">Loading…</p>
    </div>
  </section>

</div>

<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
<script>
  // Mentors only ever work with Challenge 2.0 groups — one mentor, one
  // Total-tasks-per-day: delegates to the same shared TRACK_DAY_TOTAL_TASKS /
  // totalTasksForTrack in script.js that every other dashboard and the
  // student board itself already use — this used to be its own separate,
  // unmaintained copy (with no advanced/expert entries at all, silently
  // falling back to 9 for every single advanced/expert day), which made
  // fully-completed days look partially done here specifically. Now there's
  // exactly one place this number is ever defined.
  function totalTasksForDay(level, day) { return totalTasksForTrack('2.0-' + level, day); }

  function renderAvatar(url, fullName) {
    const el = document.getElementById('avatar-display');
    if (url) el.innerHTML = `<img src="${url}" alt="">`;
    else el.textContent = initialsFor(fullName);
  }

  let myGroup = null;
  let myUserId = null;
  let liveDays = [];
  let selectedDay = null;
  let allC2Groups = [];

  requireAuth(async function (profile, user) {
    if (profile.role !== 'mentor') {
      window.location.href = 'index.html';
      return;
    }
    myUserId = user.id;
    let myFullName = profile.full_name;

    renderAvatar(profile.avatar_url, myFullName);
    document.getElementById('avatar-input').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const status = document.getElementById('avatar-status');
      if (file.size > 3 * 1024 * 1024) {
        status.textContent = 'That image is over 3MB — please pick a smaller one.';
        status.style.color = 'var(--warn)';
        return;
      }
      status.textContent = 'Uploading…';
      status.style.color = 'var(--muted)';
      const { url, error } = await uploadAvatar(myUserId, file);
      if (error) {
        status.textContent = '⚠️ Upload failed — please try again.';
        status.style.color = 'var(--warn)';
        console.error(error);
        return;
      }
      renderAvatar(url, myFullName);
      status.textContent = '✓ Profile picture updated';
      status.style.color = 'var(--good)';
    });

    document.getElementById('edit-name-btn').addEventListener('click', async () => {
      const newName = prompt('What should students see as your name?', myFullName === 'Unnamed' ? '' : myFullName);
      if (!newName || !newName.trim()) return;
      const sb2 = getSupabaseClient();
      const { error } = await sb2.rpc('update_own_full_name', { new_name: newName.trim() });
      if (error) { alert('Failed to update name — please try again.'); console.error(error); return; }
      myFullName = newName.trim();
      document.getElementById('user-greeting').textContent = myFullName;
      renderAvatar(profile.avatar_url, myFullName);
    });

    const sb = getSupabaseClient();
    const { data: assignment } = await sb.from('group_mentors').select('group_id').eq('mentor_id', user.id).limit(1).maybeSingle();

    if (!assignment) {
      document.getElementById('page-title').textContent = 'No group assigned yet';
      document.getElementById('dashboard-root').innerHTML = `<p style="color:var(--muted);">Your account isn't linked to a group yet — ask the admin to assign one.</p>`;
      return;
    }

    const { data: group } = await sb.from('groups').select('id, name, challenge, level').eq('id', assignment.group_id).single();
    myGroup = group;

    const { data: c2Groups } = await sb.from('groups').select('id, name, level').eq('challenge', '2.0').order('level').order('id');
    allC2Groups = c2Groups || [];

    const level = myGroup.level || 'standard';
    const cfg = trackConfigFor(myGroup); // shared helper from script.js — reads .challenge/.level
    liveDays = await getLiveDays(cfg.folder, cfg.totalDays);

    document.getElementById('page-eyebrow').textContent = `Mentor view — Challenge 2.0 · ${level.charAt(0).toUpperCase() + level.slice(1)}`;
    document.getElementById('page-title').textContent = myGroup.name;

    const nonMockDays = liveDays.filter(d => !cfg.mockDays.includes(d)).sort((a, b) => b - a);
    const mockDaysLive = liveDays.filter(d => cfg.mockDays.includes(d));
    if (mockDaysLive.length > 0) {
      const resultsPage = myGroup.challenge === '1.0'
        ? 'mock-results.html'
        : `c2-mock-results.html?track=2.0-${level}`;
      const sep = resultsPage.includes('?') ? '&' : '?';
      const mockLinksHtml = mockDaysLive.map(d =>
        `<a href="${resultsPage}${sep}day=${d}" class="ghost" style="display:inline-block; padding:8px 16px; border-radius:8px; text-decoration:none; margin:0 8px 8px 0;">🎯 View Mock Exam results (Day ${d}) →</a>`
      ).join(' ');
      document.getElementById('day-picker-row').insertAdjacentHTML('beforebegin', `<div style="margin-bottom:16px;">${mockLinksHtml}</div>`);
    }
    if (nonMockDays.length === 0) {
      document.getElementById('dashboard-root').innerHTML = `<p style="color:var(--muted);">No non-mock days are live for this group yet.</p>`;
      return;
    }
    selectedDay = nonMockDays[0];

    const dayRow = document.getElementById('day-picker-row');
    const daySelect = document.getElementById('day-select');
    dayRow.style.display = 'flex';
    daySelect.innerHTML = nonMockDays.map(d => `<option value="${d}" ${d === selectedDay ? 'selected' : ''}>Day ${d}</option>`).join('');
    daySelect.addEventListener('change', (e) => {
      selectedDay = +e.target.value;
      showStudentList();
    });

    showStudentList();
  });

  // ---------- Full-detail student list for the mentor's one group + selected day ----------
  async function showStudentList() {
    const root = document.getElementById('dashboard-root');
    root.innerHTML = `<p style="color:var(--muted); font-family:var(--mono); font-size:0.85rem;">Loading students…</p>`;

    const sb = getSupabaseClient();
    const level = myGroup.level || 'standard';
    const need = totalTasksForDay(level, selectedDay);

    const { data: students } = await sb.from('profiles').select('id, full_name, avatar_url, approval_status').eq('group_id', myGroup.id).eq('role', 'student').eq('challenge', '2.0').eq('level', level).order('full_name');

    if (!students || students.length === 0) {
      root.innerHTML = `<p style="color:var(--muted);">No students registered in this group yet.</p>`;
      return;
    }

    const studentIds = students.map(s => s.id);
    const [{ data: progress }, { data: answers }, { data: commentRows }, { data: pointsRows }] = await Promise.all([
      sb.from('progress').select('student_id, task, completed').eq('day', selectedDay).in('student_id', studentIds),
      sb.from('answers').select('student_id, task, field_id, value, is_correct').eq('day', selectedDay).in('student_id', studentIds),
      sb.from('mentor_comments').select('student_id, task, field_id, comment').eq('day', selectedDay).in('student_id', studentIds),
      sb.from('points').select('student_id, category, points').eq('day', selectedDay).in('student_id', studentIds).like('category', 'field-%')
    ]);

    const commentByField = {};
    (commentRows || []).forEach(c => {
      commentByField[c.student_id] = commentByField[c.student_id] || {};
      commentByField[c.student_id][c.field_id] = c.comment || '';
    });
    const pointsByField = {};
    (pointsRows || []).forEach(p => {
      pointsByField[p.student_id] = pointsByField[p.student_id] || {};
      // category is 'field-<fieldId>' — strip the prefix to key by fieldId directly.
      pointsByField[p.student_id][p.category.replace(/^field-/, '')] = p.points;
    });

    const doneByStudent = {};
    (progress || []).forEach(p => {
      doneByStudent[p.student_id] = doneByStudent[p.student_id] || new Set();
      if (p.completed) doneByStudent[p.student_id].add(p.task);
    });

    const answersByStudent = {};
    (answers || []).forEach(a => {
      answersByStudent[a.student_id] = answersByStudent[a.student_id] || {};
      answersByStudent[a.student_id][a.task] = answersByStudent[a.student_id][a.task] || [];
      answersByStudent[a.student_id][a.task].push(a);
    });

    // Speaking answers store a storage path, not the actual audio — fetch a
    // temporary playable URL for each one before rendering.
    const speakingPaths = (answers || []).filter(a => a.field_id.startsWith('speaking-')).map(a => a.value);
    const signedUrlByPath = {};
    await Promise.all(speakingPaths.map(async (path) => {
      const { data, error } = await sb.storage.from('speaking-recordings').createSignedUrl(path, 3600);
      if (error) console.error('Signed URL failed for', path, error);
      if (data) signedUrlByPath[path] = data.signedUrl;
    }));

    function renderTicks(studentId) {
      const done = doneByStudent[studentId] || new Set();
      return Array.from({ length: need }, (_, i) =>
        `<span class="tick ${done.has(i + 1) ? 'done' : ''}"></span>`
      ).join('');
    }

    function commentRowHtml(studentId, task, fieldId, maxPoints) {
      const saved = (commentByField[studentId] || {})[fieldId] || '';
      const savedPts = (pointsByField[studentId] || {})[fieldId];
      const options = [];
      for (let p = 0; p <= maxPoints; p += 0.5) {
        options.push(`<option value="${p}" ${savedPts === p ? 'selected' : ''}>${p}</option>`);
      }
      return `
        <div class="mentor-comment-row" data-student="${studentId}" data-task="${task}" data-field="${fieldId}" data-max-points="${maxPoints}" style="margin-top:8px; padding-top:8px;">
          <textarea class="mentor-comment-input no-check" placeholder="Leave a comment for the student..." style="width:100%; min-height:50px; padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-family:var(--body); font-size:0.85rem;">${saved.replace(/</g, '&lt;')}</textarea>
          <div style="display:flex; align-items:center; gap:10px; margin-top:6px; flex-wrap:wrap;">
            <label style="font-size:0.78rem; color:var(--muted); display:flex; align-items:center; gap:6px;">
              Points:
              <select class="mentor-points-input" style="padding:3px 8px; border:1px solid var(--border); border-radius:6px; font-size:0.8rem;">
                <option value="" ${savedPts == null ? 'selected' : ''}>—</option>
                ${options.join('')}
              </select>
              / ${maxPoints}
            </label>
            <button class="ghost save-mentor-comment" style="padding:4px 12px; font-size:0.78rem;">Save</button>
            <span class="save-status" style="font-size:0.78rem; color:var(--muted);"></span>
          </div>
        </div>`;
    }

    function renderTaskDetail(studentId) {
      const byTask = answersByStudent[studentId] || {};
      const taskNums = Object.keys(byTask).map(Number).sort((a, b) => a - b);
      if (taskNums.length === 0) return '<p class="no-writing">No answers submitted yet.</p>';

      return taskNums.map(taskNum => {
        const items = byTask[taskNum];

        // Any open-ended (ungraded) text field gets its own comment box — not
        // just the two big "main essay" fields. is_correct is null for every
        // .no-check field, which is exactly what marks it as free-text writing
        // rather than an auto-graded answer.
        const speakingItems = items.filter(i => i.field_id.startsWith('speaking-'));
        const writingItems = items.filter(i => !i.field_id.startsWith('speaking-') && i.is_correct === null);
        const gradedItems = items.filter(i => i.is_correct !== null);
        const sections = [];

        if (writingItems.length > 0) {
          const blocks = writingItems.map(i => {
            const words = i.value.trim() ? i.value.trim().split(/\s+/).length : 0;
            // "mini-" prefixed fields are short mentor-graded questions (2pts);
            // everything else ungraded defaults to the larger writing scale (5pts).
            const maxPts = i.field_id.startsWith('mini-') ? 2 : 5;
            return `<div style="margin-bottom:14px;">
              <span class="recording-label">${i.field_id} — ${words} word${words === 1 ? '' : 's'}</span>
              <div class="writing-box show" style="margin-top:4px;">${i.value.replace(/</g, '&lt;') || '<span class="no-writing">Empty</span>'}</div>
              ${commentRowHtml(studentId, taskNum, i.field_id, maxPts)}
            </div>`;
          }).join('');
          sections.push(`<div class="task-detail-body">${blocks}</div>`);
        }

        if (speakingItems.length > 0) {
          const recordings = speakingItems.map(i => {
            const url = signedUrlByPath[i.value];
            const label = speakingLabel(i.field_id);
            return `<div class="recording-card">
              <span class="recording-label">${label}</span>
              ${url ? `<audio controls src="${url}"></audio>` : '<p class="no-writing">Playback unavailable</p>'}
              ${commentRowHtml(studentId, taskNum, i.field_id, 2)}
            </div>`;
          }).join('');
          sections.push(`<div class="task-detail-body recording-grid">${recordings}</div>`);
        }

        if (gradedItems.length > 0) {
          const correctCount = gradedItems.filter(i => i.is_correct === true).length;
          const rows = gradedItems.map(i => {
            const mark = i.is_correct === true ? '✓' : '✗';
            const color = i.is_correct === true ? 'var(--good)' : 'var(--warn)';
            return `<div class="graded-row">
              <span class="graded-field">${i.field_id}</span>
              <span>${i.value} <span style="color:${color}; font-weight:700;">${mark}</span></span>
            </div>`;
          }).join('');
          sections.push(`<div class="task-detail-body"><p style="margin:0 0 6px; font-family:var(--mono); font-size:0.78rem; color:var(--muted);">${correctCount}/${gradedItems.length} correct</p>${rows}</div>`);
        }

        let badge;
        if (writingItems.length > 0) badge = '<span class="task-detail-badge writing">✍️ Writing</span>';
        else if (speakingItems.length > 0) badge = '<span class="task-detail-badge speaking">🎙️ Speaking</span>';
        else badge = '<span class="task-detail-badge graded">✓ Auto-graded</span>';

        const metaParts = [
          writingItems.length > 0 ? `${writingItems.length} response${writingItems.length === 1 ? '' : 's'}` : '',
          speakingItems.length > 0 ? `${speakingItems.length} recording${speakingItems.length === 1 ? '' : 's'}` : '',
          gradedItems.length > 0 ? `${gradedItems.filter(i => i.is_correct === true).length}/${gradedItems.length} correct` : ''
        ].filter(Boolean).join(' · ');

        return `<details class="task-detail-block">
          <summary>${badge} Task ${taskNum} <span class="task-detail-meta">${metaParts}</span></summary>
          ${sections.join('')}
        </details>`;
      }).join('');
    }

    function groupMoveOptionsHtml(currentGroupId) {
      return allC2Groups.map(g => {
        const label = `${g.level.charAt(0).toUpperCase()}${g.level.slice(1)} — ${g.name}`;
        return `<option value="${g.id}" ${g.id === currentGroupId ? 'selected' : ''}>${label}</option>`;
      }).join('');
    }

    function statusBadgeHtml(status) {
      const s = status || 'pending';
      const colors = { pending: 'var(--warn)', approved: 'var(--good)', rejected: 'var(--muted)' };
      const labels = { pending: 'Pending', approved: 'Approved', rejected: 'Rejected' };
      return `<span style="font-family:var(--mono); font-size:0.72rem; font-weight:700; color:${colors[s]}; border:1px solid ${colors[s]}; border-radius:20px; padding:2px 10px;">${labels[s]}</span>`;
    }

    root.innerHTML = students.map(s => `
      <div class="student-row">
        <div class="student-row-top">
          <span class="student-name" style="display:flex; align-items:center; gap:10px;">
            ${s.avatar_url ? `<span class="avatar-circle" style="width:28px;height:28px;font-size:0.72rem;"><img src="${s.avatar_url}" alt="" onerror="this.parentElement.textContent='${initialsFor(s.full_name)}'"></span>` : `<span class="avatar-circle" style="width:28px;height:28px;font-size:0.72rem;">${initialsFor(s.full_name)}</span>`}
            ${s.full_name}
            ${statusBadgeHtml(s.approval_status)}
          </span>
          <div class="student-ticks"><div class="day-ticks">${renderTicks(s.id)}</div></div>
        </div>
        <div class="student-admin-row" data-student="${s.id}" style="display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:10px; padding-top:10px; border-top:1px dashed var(--border);">
          ${s.approval_status !== 'approved' ? `<button class="ghost approve-student" style="padding:4px 12px; font-size:0.78rem;">✓ Approve</button>` : ''}
          ${s.approval_status !== 'rejected' ? `<button class="ghost reject-student" style="padding:4px 12px; font-size:0.78rem; color:var(--warn); border-color:var(--warn);">✗ Reject &amp; remove from group</button>` : ''}
          <span style="font-size:0.78rem; color:var(--muted);">Move to:</span>
          <select class="move-group-select" style="padding:4px 8px; border:1px solid var(--border); border-radius:8px; font-size:0.78rem;">${groupMoveOptionsHtml(myGroup.id)}</select>
          <button class="ghost move-student" style="padding:4px 12px; font-size:0.78rem;">Move</button>
          <span class="admin-status" style="font-size:0.78rem; color:var(--muted);"></span>
        </div>
        <button class="writing-toggle" data-target="detail-${s.id}">Show details ▾</button>
        <div class="writing-box" id="detail-${s.id}">${renderTaskDetail(s.id)}</div>
      </div>
    `).join('');

    root.querySelectorAll('.writing-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const box = document.getElementById(btn.dataset.target);
        const nowShown = box.classList.toggle('show');
        btn.textContent = btn.textContent.replace(nowShown ? '▾' : '▴', nowShown ? '▴' : '▾');
      });
    });

    root.querySelectorAll('.approve-student').forEach(btn => {
      btn.addEventListener('click', async () => {
        const row = btn.closest('.student-admin-row');
        const status = row.querySelector('.admin-status');
        status.textContent = 'Saving…';
        const res = await sb.from('profiles').update({ approval_status: 'approved' }).eq('id', row.dataset.student);
        status.textContent = res.error ? '⚠️ Failed' : '✓ Approved';
        if (!res.error) setTimeout(showStudentList, 500);
      });
    });

    root.querySelectorAll('.reject-student').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('This removes the student from this group entirely. They will need to be reassigned to a group before they can be seen again. Continue?')) return;
        const row = btn.closest('.student-admin-row');
        const status = row.querySelector('.admin-status');
        status.textContent = 'Saving…';
        const res = await sb.from('profiles').update({ approval_status: 'rejected', group_id: null }).eq('id', row.dataset.student);
        status.textContent = res.error ? '⚠️ Failed' : '✓ Removed';
        if (!res.error) setTimeout(showStudentList, 500);
      });
    });

    root.querySelectorAll('.move-student').forEach(btn => {
      btn.addEventListener('click', async () => {
        const row = btn.closest('.student-admin-row');
        const status = row.querySelector('.admin-status');
        const newGroupId = +row.querySelector('.move-group-select').value;
        if (newGroupId === myGroup.id) { status.textContent = 'Already in this group'; return; }
        status.textContent = 'Moving…';
        const res = await sb.from('profiles').update({ group_id: newGroupId }).eq('id', row.dataset.student);
        status.textContent = res.error ? '⚠️ Failed' : '✓ Moved';
        if (!res.error) setTimeout(showStudentList, 500);
      });
    });

    root.querySelectorAll('.save-mentor-comment').forEach(btn => {
      btn.addEventListener('click', async () => {
        const row = btn.closest('.mentor-comment-row');
        const status = row.querySelector('.save-status');
        status.textContent = 'Saving…';
        const pointsVal = row.querySelector('.mentor-points-input').value;
        const [commentRes, pointsRes] = await Promise.all([
          sb.from('mentor_comments').upsert({
            student_id: row.dataset.student,
            day: selectedDay,
            task: +row.dataset.task,
            field_id: row.dataset.field,
            comment: row.querySelector('.mentor-comment-input').value.trim(),
            updated_by: myUserId,
            updated_at: new Date().toISOString()
          }, { onConflict: 'student_id,day,task,field_id' }),
          // Only writes a points row once the mentor has actually picked a
          // value — leaving it on "—" means nothing gets saved for points
          // yet, so an ungraded question doesn't silently score as 0.
          pointsVal === '' ? Promise.resolve({ error: null }) : sb.from('points').upsert({
            student_id: row.dataset.student,
            day: selectedDay,
            category: 'field-' + row.dataset.field,
            points: parseFloat(pointsVal),
            max_points: +row.dataset.maxPoints,
            awarded_by: myUserId,
            updated_at: new Date().toISOString()
          }, { onConflict: 'student_id,day,category' })
        ]);
        status.textContent = (commentRes.error || pointsRes.error) ? '⚠️ Failed to save' : '✓ Saved';
        if (commentRes.error) console.error(commentRes.error);
        if (pointsRes.error) console.error(pointsRes.error);
      });
    });
  }
</script>
</body>
</html>
