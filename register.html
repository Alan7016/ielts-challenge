<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — IELTS Marathon</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="gate">
  <div class="gate-card" style="max-width:440px;">
    <div class="eyebrow">Create your account</div>
    <h1>Join the Marathon</h1>
    <p>Pick a username, a password, and the group your teacher gave you.</p>

    <form id="register-form" style="text-align:left;">
      <label style="font-size:0.85rem; font-weight:600; color:var(--ink);">Full name
        <input type="text" id="full-name" required style="width:100%; margin-top:4px;">
      </label>
      <label style="font-size:0.85rem; font-weight:600; color:var(--ink); margin-top:12px; display:block;">Email
        <input type="email" id="email" required autocomplete="off" style="width:100%; margin-top:4px;">
      </label>
      <label style="font-size:0.85rem; font-weight:600; color:var(--ink); margin-top:12px; display:block;">Password
        <input type="password" id="password" required minlength="6" style="width:100%; margin-top:4px;">
      </label>
      <label style="font-size:0.85rem; font-weight:600; color:var(--ink); margin-top:12px; display:block;">Confirm password
        <input type="password" id="password-confirm" required minlength="6" style="width:100%; margin-top:4px;">
      </label>
      <label style="font-size:0.85rem; font-weight:600; color:var(--ink); margin-top:12px; display:block;">Which challenge?
        <select id="challenge-select" required style="width:100%; margin-top:4px;">
          <option value="1.0">Challenge 1.0</option>
          <option value="2.0">Challenge 2.0</option>
        </select>
      </label>
      <label id="level-row" style="font-size:0.85rem; font-weight:600; color:var(--ink); margin-top:12px; display:none;">Your level
        <select id="level-select" style="width:100%; margin-top:4px;">
          <option value="standard">Standard (band 4.5–5.0)</option>
          <option value="advanced">Advanced (band 5.5–6.0)</option>
          <option value="expert">Expert (band 6.5–7.0+)</option>
        </select>
        <span style="font-weight:400; color:var(--muted); font-size:0.78rem; display:block; margin-top:4px;">Not sure? Pick your closest current band — your teacher can adjust this later if needed.</span>
      </label>
      <label style="font-size:0.85rem; font-weight:600; color:var(--ink); margin-top:12px; display:block;">Your group
        <select id="group-select" required style="width:100%; margin-top:4px;">
          <option value="">— loading groups… —</option>
        </select>
      </label>

      <button type="submit" style="width:100%; margin-top:20px;">Create account</button>
      <div class="gate-error" id="form-error"></div>
      <div id="form-success" style="display:none; color:var(--good); font-family:var(--mono); font-size:0.85rem; margin-top:8px;"></div>
    </form>

    <p style="margin-top:18px; font-size:0.88rem;">Already registered? <a href="login.html">Log in</a></p>
  </div>
</div>

<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  const challengeSelect = document.getElementById('challenge-select');
  const levelRow = document.getElementById('level-row');
  const levelSelect = document.getElementById('level-select');

  function currentChallenge() { return challengeSelect.value; }
  function currentLevel() { return currentChallenge() === '2.0' ? levelSelect.value : null; }

  // Groups are scoped to a challenge (and, for 2.0, a level) — the dropdown
  // only ever shows groups that actually match what the student picked
  // above, so there's no way to end up in a group from the wrong track.
  async function loadGroups() {
    const select = document.getElementById('group-select');
    select.innerHTML = '<option value="">— loading groups… —</option>';
    let query = sb.from('groups').select('id, name').eq('challenge', currentChallenge()).order('id');
    if (currentChallenge() === '2.0') query = query.eq('level', currentLevel());
    const { data, error } = await query;
    if (error || !data) {
      select.innerHTML = '<option value="">— couldn\'t load groups —</option>';
      return;
    }
    if (data.length === 0) {
      select.innerHTML = '<option value="">— no groups open yet for this level —</option>';
      return;
    }
    select.innerHTML = '<option value="">— choose your group —</option>' +
      data.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
  }

  challengeSelect.addEventListener('change', () => {
    levelRow.style.display = currentChallenge() === '2.0' ? 'block' : 'none';
    loadGroups();
  });
  levelSelect.addEventListener('change', loadGroups);
  loadGroups();

  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('form-error');
    const successEl = document.getElementById('form-success');
    errorEl.textContent = '';
    successEl.style.display = 'none';

    const fullName = document.getElementById('full-name').value.trim();
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const passwordConfirm = document.getElementById('password-confirm').value;
    const groupId = document.getElementById('group-select').value;
    const challenge = currentChallenge();
    const level = currentLevel();

    if (password !== passwordConfirm) {
      errorEl.textContent = 'Passwords do not match.';
      return;
    }
    if (!groupId) {
      errorEl.textContent = 'Please choose your group.';
      return;
    }

    let result;
    try {
      result = await sb.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            full_name: fullName,
            role: 'student',
            group_id: parseInt(groupId, 10)
          }
        }
      });
    } catch (err) {
      console.error('Signup threw an exception:', err);
      errorEl.textContent = 'Network error — check your connection and try again.';
      return;
    }

    const { data, error } = result;

    if (error) {
      console.error('Signup returned an error:', error);
      if (error.message && error.message.includes('already registered')) {
        errorEl.textContent = 'That email is already registered.';
      } else {
        errorEl.textContent = error.message || `Registration failed (${error.status || 'unknown error'}). Check the browser console for details.`;
      }
      return;
    }

    // The account-creation trigger doesn't know about challenge/level yet,
    // so this sets it separately right after signup, while the student has
    // an active session. If this doesn't go through for any reason, the
    // account still works — a mentor or admin can set it manually later.
    if (data && data.session) {
      try {
        await sb.rpc('set_own_challenge_level', { new_challenge: challenge, new_level: level });
      } catch (rpcErr) {
        console.warn('Could not set challenge/level automatically:', rpcErr);
      }
    }

    successEl.textContent = 'Account created! Redirecting to login…';
    successEl.style.display = 'block';
    setTimeout(() => { window.location.href = 'login.html'; }, 1200);
  });
</script>
</body>
</html>
