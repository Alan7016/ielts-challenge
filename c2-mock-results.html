<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Mock Test Results — IELTS Marathon</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  body { background: var(--bg); }
  .page-wrap { max-width: 1100px; margin: 0 auto; padding: 32px 24px 60px; }
  .page-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
  .page-title { font-size: 1.5rem; font-weight: 800; margin: 0; }
  .page-sub { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
  .filter-bar { display: none; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
  .filter-bar select, .filter-bar input { padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; }
  .count-badge { font-family: var(--mono); color: var(--muted); font-size: 0.85rem; }
  .cohort-stats { display: none; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .cohort-chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  .cohort-chart-card h4 { margin: 0 0 8px; font-size: 0.85rem; color: var(--muted); }
  .cohort-chart-card canvas { max-height: 140px; }
  .student-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
  .student-card-header { display: flex; align-items: center; gap: 16px; padding: 16px 18px; cursor: pointer; flex-wrap: wrap; }
  .student-info { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 180px; }
  .student-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-soft, #e8e0ff); color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; }
  .student-name { font-weight: 700; }
  .student-meta { font-size: 0.78rem; color: var(--muted); }
  .score-squares { display: flex; gap: 6px; }
  .score-square { width: 40px; text-align: center; border-radius: 8px; padding: 4px 0; background: var(--surface-2); }
  .score-square.na { opacity: 0.4; }
  .score-square .sq-label { font-size: 0.65rem; color: var(--muted); font-weight: 700; }
  .score-square .sq-val { font-size: 0.85rem; font-weight: 800; }
  .score-square.o { background: #fdf0d5; }
  .pill { padding: 4px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; white-space: nowrap; }
  .pill.pending { background: var(--surface-2); color: var(--muted); }
  .expand-icon { transition: transform 0.2s; color: var(--muted); }
  .expand-icon.open { transform: rotate(180deg); }
  .student-detail { display: none; padding: 0 18px 20px; border-top: 1px solid var(--border); }
  .student-detail.show { display: block; }
  .score-overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin: 16px 0; }
  .score-box { border: 1px solid var(--border); border-radius: 10px; padding: 10px; text-align: center; }
  .score-box .label { font-size: 0.72rem; color: var(--muted); font-weight: 700; }
  .score-box .value { font-size: 1.3rem; font-weight: 800; margin: 2px 0; }
  .score-box .band { font-size: 0.7rem; color: var(--muted); }
  .detail-tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin-bottom: 16px; flex-wrap: wrap; }
  .detail-tab { padding: 8px 14px; font-size: 0.8rem; font-weight: 700; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .detail-tab.active { color: var(--warn); border-bottom-color: var(--warn); }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }
  .ans-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  .ans-table th, .ans-table td { padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: left; }
  .ans-correct { color: var(--good); font-weight: 700; }
  .ans-wrong { color: var(--warn); font-weight: 700; }
  .word-badge { display: inline-block; background: var(--surface-2); padding: 3px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; margin-bottom: 8px; }
  .essay-box { background: var(--surface-2); border-radius: 10px; padding: 14px; white-space: pre-wrap; font-size: 0.9rem; line-height: 1.6; max-height: 320px; overflow-y: auto; margin-bottom: 14px; }
  .feedback-label { display: block; font-size: 0.8rem; font-weight: 700; margin: 12px 0 6px; }
  .feedback-textarea { width: 100%; min-height: 90px; border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-family: var(--body); font-size: 0.9rem; box-sizing: border-box; }
  .band-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .band-select { padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; }
  .save-feedback-btn { background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
  .save-feedback-btn.saved { background: var(--good); }
  .no-key-notice { background: var(--surface-2); border-radius: 8px; padding: 12px 14px; font-size: 0.85rem; color: var(--muted); margin-bottom: 4px; }
  .empty-state, .loading-state, .error-state { text-align: center; padding: 60px 20px; color: var(--muted); }
</style>
</head>
<body>
<div class="page-wrap">
  <div class="page-header">
    <div>
      <h1 class="page-title">🎯 Mini Mock Test — Results &amp; Grading</h1>
      <p class="page-sub" id="pageSubTitle">Standard track — Day 6</p>
    </div>
    <a href="mentor-dashboard.html" style="font-size: 0.85rem; color: var(--muted); text-decoration: none;">← Back to dashboard</a>
  </div>

  <div class="loading-state" id="loadingState">Loading results…</div>
  <div class="error-state" id="errorState" style="display:none;"></div>
  <div class="empty-state" id="emptyState" style="display:none;">No students found in your groups yet.</div>

  <div class="filter-bar" id="filterBar">
    <select id="groupFilter" onchange="applyFilters()">
      <option value="">All groups</option>
    </select>
    <input type="text" id="searchInput" placeholder="Search by name…" oninput="applyFilters()">
    <span class="count-badge" id="countBadge"></span>
  </div>

  <div class="cohort-stats" id="cohortStats">
    <div class="cohort-chart-card"><h4>Overall band</h4><canvas id="overallChart"></canvas></div>
    <div class="cohort-chart-card"><h4>Listening</h4><canvas id="listeningChart"></canvas></div>
    <div class="cohort-chart-card"><h4>Reading</h4><canvas id="readingChart"></canvas></div>
    <div class="cohort-chart-card"><h4>Writing</h4><canvas id="writingChart"></canvas></div>
    <div class="cohort-chart-card"><h4>Speaking</h4><canvas id="speakingChart"></canvas></div>
  </div>

  <div id="studentsGrid"></div>
</div>

<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
<script>
var TRACK_KEY = new URLSearchParams(window.location.search).get('track') || '2.0-standard';
var MOCK_DAY = parseInt(new URLSearchParams(window.location.search).get('day'), 10) || 6;
var sb, myProfile, myUserId;
var cancelsByStudent = {};
var allStudents = {}, allExams = [], myStudentIds = [], groupMap = {};

function scoreToBand(r, maxQ){
  // Scale to the standard 40-question table when the test is shorter than
  // a full section (this mini-mock is 13 reading / 20 listening).
  var scaled = maxQ && maxQ !== 40 ? Math.round(r / maxQ * 40) : r;
  if(scaled >= 39) return 9; if(scaled >= 37) return 8.5; if(scaled >= 35) return 8; if(scaled >= 32) return 7.5;
  if(scaled >= 30) return 7; if(scaled >= 26) return 6.5; if(scaled >= 23) return 6; if(scaled >= 18) return 5.5;
  if(scaled >= 16) return 5; if(scaled >= 13) return 4.5; if(scaled >= 10) return 4; if(scaled >= 8) return 3.5;
  if(scaled >= 6) return 3; if(scaled >= 4) return 2.5; if(scaled >= 2) return 2; if(scaled === 1) return 1.5; return 0;
}
// ---------- answer normalization ----------
// IELTS accepts a range of equivalent ways to write the same answer:
// British vs American spelling, digits vs number words, "18th" vs "18",
// stray punctuation/spacing, and case. checkIsCorrect() now normalizes
// both sides the same way before comparing, instead of a bare exact
// string match — that was marking genuinely-correct answers wrong (e.g.
// "18th June" vs a key of "18 June").
var NUM_WORDS = { zero:0, one:1, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8, nine:9,
  ten:10, eleven:11, twelve:12, thirteen:13, fourteen:14, fifteen:15, sixteen:16, seventeen:17, eighteen:18, nineteen:19,
  twenty:20, thirty:30, forty:40, fifty:50, sixty:60, seventy:70, eighty:80, ninety:90, hundred:100 };
var ORD_WORDS = { zeroth:0, first:1, second:2, third:3, fourth:4, fifth:5, sixth:6, seventh:7, eighth:8, ninth:9,
  tenth:10, eleventh:11, twelfth:12, thirteenth:13, fourteenth:14, fifteenth:15, sixteenth:16, seventeenth:17, eighteenth:18, nineteenth:19,
  twentieth:20, thirtieth:30, fortieth:40, fiftieth:50, sixtieth:60, seventieth:70, eightieth:80, ninetieth:90, hundredth:100 };
// Common British/American spelling pairs likely to turn up as IELTS
// gap-fill or short-answer content. Both spellings map to the same
// canonical (American) token so either one matches the answer key.
var SPELLING_VARIANTS = {
  colour:'color', favour:'favor', favourite:'favorite', honour:'honor', honourable:'honorable',
  labour:'labor', neighbour:'neighbor', neighbourhood:'neighborhood', rumour:'rumor', humour:'humor',
  humorous:'humorous', behaviour:'behavior', behavioural:'behavioral', endeavour:'endeavor',
  organise:'organize', organised:'organized', organising:'organizing', organisation:'organization',
  organisations:'organizations', realise:'realize', realised:'realized', realising:'realizing',
  recognise:'recognize', recognised:'recognized', apologise:'apologize', apologised:'apologized',
  criticise:'criticize', criticised:'criticized', emphasise:'emphasize', emphasised:'emphasized',
  minimise:'minimize', maximise:'maximize', specialise:'specialize', specialised:'specialized',
  summarise:'summarize', summarised:'summarized', analyse:'analyze', analysed:'analyzed',
  analysing:'analyzing', characterise:'characterize', memorise:'memorize', familiarise:'familiarize',
  prioritise:'prioritize', customise:'customize', utilise:'utilize', utilised:'utilized',
  standardise:'standardize', modernise:'modernize', industrialise:'industrialize',
  globalisation:'globalization', civilisation:'civilization', civilisations:'civilizations',
  colonise:'colonize', colonised:'colonized', authorise:'authorize', authorised:'authorized',
  programme:'program', programmes:'programs', catalogue:'catalog', catalogues:'catalogs',
  dialogue:'dialog', dialogues:'dialogs', cheque:'check', cheques:'checks', grey:'gray',
  tyre:'tire', tyres:'tires', kerb:'curb', mould:'mold', aeroplane:'airplane',
  aluminium:'aluminum', jewellery:'jewelry', plough:'plow', sceptic:'skeptic', sceptical:'skeptical',
  defence:'defense', licence:'license', offence:'offense', pretence:'pretense',
  practise:'practice', practised:'practiced', practising:'practicing',
  enrol:'enroll', enrolment:'enrollment', fulfil:'fulfill', fulfilment:'fulfillment',
  skilful:'skillful', wilful:'willful', instalment:'installment', instalments:'installments',
  travelling:'traveling', travelled:'traveled', traveller:'traveler', travellers:'travelers',
  cancelled:'canceled', cancelling:'canceling', modelling:'modeling', modelled:'modeled',
  labelled:'labeled', labelling:'labeling', jewelled:'jeweled', counsellor:'counselor',
  marvellous:'marvelous', centre:'center', centres:'centers', theatre:'theater', theatres:'theaters',
  litre:'liter', litres:'liters', metre:'meter', metres:'meters', millimetre:'millimeter',
  centimetre:'centimeter', kilometre:'kilometer', fibre:'fiber'
};
function wordsToDigits(s){
  var tokens = s.replace(/-/g, ' ').split(' ');
  var out = [];
  for(var i=0; i<tokens.length; i++){
    var w = tokens[i];
    if(NUM_WORDS.hasOwnProperty(w)){
      var val = NUM_WORDS[w];
      if(val >= 20 && val <= 90 && i+1 < tokens.length){
        if(NUM_WORDS.hasOwnProperty(tokens[i+1]) && NUM_WORDS[tokens[i+1]] < 10){ val += NUM_WORDS[tokens[i+1]]; i++; }
        else if(ORD_WORDS.hasOwnProperty(tokens[i+1]) && ORD_WORDS[tokens[i+1]] < 10){ val += ORD_WORDS[tokens[i+1]]; i++; }
      }
      out.push(String(val));
    } else if(ORD_WORDS.hasOwnProperty(w)){
      out.push(String(ORD_WORDS[w]));
    } else {
      out.push(w);
    }
  }
  return out.join(' ');
}
function normalizeAnswer(raw){
  if(raw === undefined || raw === null) return '';
  var s = String(raw).trim().toLowerCase();
  if(!s) return '';
  s = s.replace(/\s+/g, ' ').replace(/^[\s.,;:'"()]+|[\s.,;:'"()]+$/g, '');
  // "18th" / "21st" / "3rd" -> "18" / "21" / "3"
  s = s.replace(/\b(\d+)(st|nd|rd|th)\b/g, '$1');
  s = wordsToDigits(s);
  s = s.split(' ').map(function(w){ return SPELLING_VARIANTS[w] || w; }).join(' ');
  // "3 000" / "3,000" -> "3000"
  s = s.replace(/\s*,\s*/g, ' ').replace(/(\d) (?=\d{3}\b)/g, '$1').replace(/(\d),(?=\d{3}\b)/g, '$1');
  // "May 11" / "11 May" / "11 of May" are the same date
  var t = s.split(' ').filter(function(x){ return x !== 'of' && x !== 'the'; });
  if(t.length === 2){
    if(MONTHS.indexOf(t[0]) >= 0 && /^\d+$/.test(t[1])) s = t[1] + ' ' + t[0];
    else if(MONTHS.indexOf(t[1]) >= 0 && /^\d+$/.test(t[0])) s = t[0] + ' ' + t[1];
  }
  return s;
}
var MONTHS = ['january','february','march','april','may','june','july','august','september','october','november','december'];
function checkIsCorrect(studentAns, correctAns){
  if(studentAns === undefined || studentAns === null || String(studentAns).trim()==='' || studentAns === 'No Answer') return null;
  var sa = normalizeAnswer(studentAns);
  if(Array.isArray(correctAns)) return correctAns.some(function(c){ return normalizeAnswer(c) === sa; });
  return normalizeAnswer(correctAns) === sa;
}
function esc(str){ return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function recomputeScoreAndBand(answers, key, total){
  answers = answers || {}; key = key || {};
  var keys = Object.keys(key);
  if(keys.length === 0) return { score: null, band: null };
  var correct = 0;
  keys.forEach(function(k){ if(checkIsCorrect(answers[k], key[k]) === true) correct++; });
  return { score: correct, band: scoreToBand(correct, total) };
}
function roundToIELTSBand(avg){
  var rem = avg % 1, base = Math.floor(avg);
  if(rem < 0.25) return base;
  if(rem < 0.75) return base + 0.5;
  return base + 1;
}
// Overall divides by all 4 skills, treating anything not yet graded as 0 —
// matches how a real exam would score an unattempted/ungraded section,
// rather than quietly averaging it away. This is the mentor's in-progress
// review view; the student never sees this — they only see their result
// once everything is graded and results_published is set.
// Whether this specific exam used the Task 1 + Task 2 writing layout or the
// single-essay layout. This used to be assumed from the track alone ("only
// Expert has two tasks"), which broke the moment Advanced's Day 13 mock was
// built with two tasks too — those submissions had real writing sitting in
// writing_t1_text/writing_t2_text that the page never looked at, so it
// showed as unsubmitted and never graded. Read from what the exam itself
// actually has; the track-based guess is only a fallback for a brand new,
// not-yet-attempted exam row.
function examIsFullMock(exam){
  if(exam.writing_t1_text != null || exam.writing_t2_text != null) return true;
  if(exam.essay_text != null) return false;
  return TRACK_KEY === '2.0-expert';
}
// Writing band: a full (two-task) mock grades Task 1 and Task 2 separately
// (T2 counted twice as heavily, matching real IELTS weighting) — a
// single-essay mock only ever has the one essay, so that's used directly.
function writingBandFor(exam){
  if(examIsFullMock(exam)){
    var t1 = (exam.t1_band!==null && exam.t1_band!==undefined && exam.t1_band!=='') ? parseFloat(exam.t1_band) : null;
    var t2 = (exam.t2_band!==null && exam.t2_band!==undefined && exam.t2_band!=='') ? parseFloat(exam.t2_band) : null;
    if(t1===null && t2===null) return null;
    if(t1!==null && t2!==null) return roundToIELTSBand((t1 + 2*t2)/3);
    return t2!==null ? t2 : t1;
  }
  return (exam.essay_band!==null && exam.essay_band!==undefined && exam.essay_band!=='') ? parseFloat(exam.essay_band) : null;
}
function computeBands(exam){
  var lr = recomputeScoreAndBand(exam.listening_answers, exam.listening_key_snapshot, exam.listening_total || 20);
  var rr = recomputeScoreAndBand(exam.reading_answers, exam.reading_key_snapshot, exam.reading_total || 13);
  var l = lr.band, r = rr.band;
  var w = writingBandFor(exam);
  var s = exam.speaking_band ? parseFloat(exam.speaking_band) : null;
  var sum = (l||0) + (r||0) + (w||0) + (s||0);
  var o = roundToIELTSBand(sum/4);
  return { l:l, r:r, w:w, s:s, o:o, listeningScore: lr.score, readingScore: rr.score };
}
function fmtBand(b){ return (b===null || b===undefined || isNaN(b)) ? 'NA' : Number(b).toFixed(1); }

requireAuth(function(profile, user){
  if(profile.role !== 'mentor' && profile.role !== 'admin'){
    showError('This page is for mentors and admins only.');
    return;
  }
  myProfile = profile; myUserId = user.id;
  sb = getSupabaseClient();
  loadAll();
});

async function loadAll(){
  try {
    var myGroupIds = [];
    var jRes = await sb.from('group_mentors').select('group_id').eq('mentor_id', myUserId);
    if(!jRes.error && jRes.data) myGroupIds = jRes.data.map(function(r){ return r.group_id; });

    var grpRes = await sb.from('groups').select('id, name');
    if(!grpRes.error && grpRes.data) grpRes.data.forEach(function(g){ groupMap[g.id] = g.name; });

    var levelFromTrack = TRACK_KEY.replace('2.0-', '');
    var studQuery = sb.from('profiles').select('id, full_name, group_id').eq('role', 'student');
    if (myProfile.role === 'admin') {
      // Admin has no group scope of their own here, so filter down to just
      // this track by level.
      studQuery = studQuery.eq('challenge', '2.0').eq('level', levelFromTrack);
    } else if (myGroupIds.length > 0) {
      // Mentors are scoped to their own group(s) directly — a group's level
      // is already fixed, so there's no need to also filter on the
      // student's own challenge/level columns. Those can drift out of sync
      // with group_id (e.g. after a group move) and used to silently hide a
      // student's mock exam results from their mentor entirely.
      studQuery = studQuery.in('group_id', myGroupIds);
    } else {
      // No group assigned yet — show nobody rather than falling through to
      // every student on the track.
      studQuery = studQuery.eq('id', '00000000-0000-0000-0000-000000000000');
    }
    var studRes = await studQuery;
    if(studRes.error) throw studRes.error;

    (studRes.data || []).forEach(function(s){
      allStudents[s.id] = { name: s.full_name || 'Student', group_id: s.group_id, group_name: groupMap[s.group_id] || 'Unassigned' };
      myStudentIds.push(s.id);
    });

    if(myStudentIds.length === 0){
      showEmpty('No Standard-track students are assigned to your groups yet.');
      return;
    }

    var examRes = await sb.from('c2_mock_exams').select('*').eq('track', TRACK_KEY).eq('mock_day', MOCK_DAY).in('student_id', myStudentIds).order('submitted_at', {ascending:false});
    if(examRes.error) throw examRes.error;
    allExams = examRes.data || [];
    // Cancelled attempts (left full screen / left the page / reloaded).
    cancelsByStudent = {};
    try {
      var cRes = await sb.from('c2_mock_cancellations').select('student_id, reason, created_at').eq('track', TRACK_KEY).eq('mock_day', MOCK_DAY).in('student_id', myStudentIds);
      (cRes.data || []).forEach(function(c){ (cancelsByStudent[c.student_id] = cancelsByStudent[c.student_id] || []).push(c); });
    } catch(e){ console.warn('Could not load cancellations', e); }

    populateGroupFilter();
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('filterBar').style.display = 'flex';
    applyFilters();

    var trackLabel = levelFromTrack.charAt(0).toUpperCase() + levelFromTrack.slice(1);
    document.getElementById('pageSubTitle').textContent =
      trackLabel + ' track — Day ' + MOCK_DAY + ' — ' + allExams.length + ' result' + (allExams.length!==1?'s':'') + ' — ' +
      Object.keys(allStudents).length + ' student' + (Object.keys(allStudents).length!==1?'s':'') + ' in your groups';
  } catch(err){
    console.error(err);
    showError('Error loading results: ' + (err.message || JSON.stringify(err)));
  }
}

function populateGroupFilter(){
  var sel = document.getElementById('groupFilter');
  var used = {};
  Object.values(allStudents).forEach(function(s){ if(s.group_id && !used[s.group_id]) used[s.group_id] = s.group_name; });
  Object.entries(used).forEach(function(kv){
    var opt = document.createElement('option'); opt.value = kv[0]; opt.textContent = kv[1]; sel.appendChild(opt);
  });
}

function applyFilters(){
  var groupFilter = document.getElementById('groupFilter').value;
  var search = document.getElementById('searchInput').value.toLowerCase().trim();

  var byStudent = {};
  allExams.forEach(function(exam){ if(!byStudent[exam.student_id]) byStudent[exam.student_id] = exam; });
  myStudentIds.forEach(function(sid){ if(!(sid in byStudent)) byStudent[sid] = null; });

  var filtered = Object.entries(byStudent).filter(function(kv){
    var info = allStudents[kv[0]] || {};
    if(groupFilter && info.group_id !== groupFilter) return false;
    if(search && !(info.name||'').toLowerCase().includes(search)) return false;
    return true;
  });

  filtered.sort(function(a,b){
    var aHas = a[1]!==null ? 1:0, bHas = b[1]!==null ? 1:0;
    if(bHas !== aHas) return bHas - aHas;
    return ((allStudents[a[0]]||{}).name||'').localeCompare((allStudents[b[0]]||{}).name||'');
  });

  document.getElementById('countBadge').textContent = filtered.length + ' students';
  var grid = document.getElementById('studentsGrid');
  grid.innerHTML = '';
  renderCohortStats(filtered.map(function(kv){ return kv[1]; }).filter(function(e){ return e !== null; }));
  if(filtered.length === 0){ showEmpty(); return; }
  document.getElementById('emptyState').style.display = 'none';
  filtered.forEach(function(kv){
    grid.appendChild(buildCard(kv[0], allStudents[kv[0]] || {name:'Student', group_name:''}, kv[1]));
  });
}

var BAND_LABELS = [];
for(var _b=4; _b<=9; _b+=0.5) BAND_LABELS.push(_b.toFixed(1));
function countByBand(values){
  var counts = {};
  BAND_LABELS.forEach(function(l){ counts[l]=0; });
  values.forEach(function(v){
    if(v===null || v===undefined) return;
    var key = Number(v).toFixed(1);
    if(!(key in counts)) counts[key] = 0;
    counts[key]++;
  });
  return BAND_LABELS.map(function(l){ return counts[l]; });
}
var cohortCharts = {};
function destroyChart(id){ if(cohortCharts[id]){ cohortCharts[id].destroy(); cohortCharts[id]=null; } }
function drawBarChart(canvasId, values, color, label){
  destroyChart(canvasId);
  var ctx = document.getElementById(canvasId);
  if(!ctx) return;
  cohortCharts[canvasId] = new Chart(ctx, {
    type: 'bar',
    data: { labels: BAND_LABELS, datasets: [{ label: label, data: countByBand(values), backgroundColor: color, borderRadius: 5, maxBarThickness: 36 }] },
    options: {
      responsive: true,
      animation: { duration: 700, easing: 'easeOutCubic' },
      plugins: { legend: { display: false }, tooltip: { callbacks: { title: function(items){ return 'Band ' + items[0].label; } } } },
      scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
    }
  });
}
function renderCohortStats(exams){
  var panel = document.getElementById('cohortStats');
  if(exams.length === 0){ panel.style.display = 'none'; return; }
  panel.style.display = 'grid';
  var bands = exams.map(computeBands);
  drawBarChart('overallChart', bands.map(function(b){return b.o;}), '#f2a623', 'Overall');
  drawBarChart('listeningChart', bands.map(function(b){return b.l;}), '#3457d5', 'Listening');
  drawBarChart('readingChart', bands.map(function(b){return b.r;}), '#1f9d55', 'Reading');
  drawBarChart('writingChart', bands.map(function(b){return b.w;}), '#d5490f', 'Writing');
  drawBarChart('speakingChart', bands.map(function(b){return b.s;}), '#7c5cff', 'Speaking');
}

function buildCard(sid, info, exam){
  var el = document.createElement('div');

      '<div class="score-squares">'+

        '<div class="score-square'+(bands.r===null?' na':'')+'"><div class="sq-label">R</div><div class="sq-val">'+fmtBand(bands.r)+'</div></div>'+
        '<div class="score-square'+(bands.w===null?' na':'')+'"><div class="sq-label">W</div><div class="sq-val">'+fmtBand(bands.w)+'</div></div>'+
        '<div class="score-square'+(bands.s===null?' na':'')+'"><div class="sq-label">S</div><div class="sq-val">'+fmtBand(bands.s)+'</div></div>'+
        '<div class="score-square o'+(bands.o===null?' na':'')+'"><div class="sq-label">O</div><div class="sq-val">'+fmtBand(bands.o)+'</div></div>'+
      '</div>'+
      sentBadge + '</div>';
  } else {
    pillsHtml = '<div><span class="pill pending">Not submitted</span></div>';
  }

  el.innerHTML =
    '<div class="student-card-header" onclick="toggleCard(\''+sid+'\')">'+
      '<div class="student-info">'+
        '<div class="student-avatar">'+initials+'</div>'+
        '<div><div class="student-name">'+esc(info.name)+'</div>'+
        '<div class="student-meta">'+esc(info.group_name)+(examDate?' &bull; '+examDate:' &bull; No exam yet')+'</div></div>'+
      '</div>'+
      pillsHtml+
      '<div class="expand-icon" id="icon-'+sid+'">▼</div>'+
    '</div>'+
    '<div class="student-detail" id="detail-'+sid+'">'+
      (exam ? buildDetail(sid, exam) : '<p style="color:var(--muted);padding:8px 0;">This student has not completed the mini mock test yet.</p>')+
    '</div>';
  return el;
}

function buildDetail(sid, exam){
  var bands = computeBands(exam);
  var liScore = bands.listeningScore !== null ? bands.listeningScore : '—';
  var rScore = bands.readingScore !== null ? bands.readingScore : '—';
  var isFullMock = examIsFullMock(exam);

  var overview = '<div class="score-overview">'+
    '<div class="score-box"><div class="label">Listening</div><div class="value">'+fmtBand(bands.l)+'</div>'+

    '<div class="score-box"><div class="label">Reading</div><div class="value">'+fmtBand(bands.r)+'</div>'+

    '<div class="band">'+(bands.s===null ? 'not graded yet' : '&nbsp;')+'</div></div>'+
    '<div class="score-box" style="border-color:var(--warn);"><div class="label" style="color:var(--warn);">Overall</div><div class="value" style="color:var(--warn);">'+fmtBand(bands.o)+'</div>'+
    '<div class="band">&nbsp;</div></div>'+
  '</div>';

  var writingTabsHtml = isFullMock
    ? '<div class="detail-tab" onclick="switchTab(\''+sid+'\',\'writing1\',this)">✏️ Writing T1</div>'+
      '<div class="detail-tab" onclick="switchTab(\''+sid+'\',\'writing2\',this)">✏️ Writing T2</div>'
    : '<div class="detail-tab" onclick="switchTab(\''+sid+'\',\'writing\',this)">✏️ Writing</div>';
  // Attempts that were cancelled for leaving full screen / the page (Day 20 on).
  var cancels = cancelsByStudent[exam.student_id] || [], integHtml = '';
  if(cancels.length){
    var why = { left_fullscreen: 'left full screen', left_tab: 'left the page', reloaded: 'reloaded the page' };
    var counts = {};
    cancels.forEach(function(c){ var w = why[c.reason] || c.reason; counts[w] = (counts[w] || 0) + 1; });
    integHtml = '<div style="background:#fff4e5;border:1px solid #f0c27a;border-radius:8px;padding:9px 14px;font-size:13px;color:#8a5300;margin-bottom:12px;">⚠️ This student had <strong>'+cancels.length+'</strong> cancelled attempt'+(cancels.length>1?'s':'')+' before this one ('+
      Object.keys(counts).map(function(k){ return k+(counts[k]>1?' ×'+counts[k]:''); }).join(', ')+').</div>';
  }
  var tabs = integHtml + '<div class="detail-tabs">'+
    '<div class="detail-tab active" onclick="switchTab(\''+sid+'\',\'listening\',this)">🎧 Listening</div>'+
    '<div class="detail-tab" onclick="switchTab(\''+sid+'\',\'reading\',this)">📖 Reading</div>'+
    writingTabsHtml+
    '<div class="detail-tab" onclick="switchTab(\''+sid+'\',\'speaking\',this)">🎤 Speaking</div>'+
  '</div>';

  var liPane = '<div class="tab-pane active" id="pane-'+sid+'-listening">'+buildAnswerPane(exam.listening_answers, exam.listening_key_snapshot, exam.listening_total||20)+'</div>';
  var rPane = '<div class="tab-pane" id="pane-'+sid+'-reading">'+buildAnswerPane(exam.reading_answers, exam.reading_key_snapshot, exam.reading_total||13)+'</div>';

  var examId = exam.id;
  var wPane;
  if(isFullMock){
    wPane = '<div class="tab-pane" id="pane-'+sid+'-writing1">'+
      '<span class="word-badge">'+(exam.writing_t1_words||0)+' words</span>'+
      '<div class="essay-box">'+esc(exam.writing_t1_text || '(not submitted)')+'</div>'+
      '<label class="feedback-label">Feedback for Task 1:</label>'+
      '<textarea class="feedback-textarea" id="fb-t1-'+sid+'" placeholder="Write your feedback here…">'+esc(exam.t1_feedback||'')+'</textarea>'+
      '<div class="band-row"><label style="font-size:13px;font-weight:700;">Band:</label>'+
      '<select class="band-select" id="band-t1-'+sid+'">'+bandOptions(exam.t1_band)+'</select>'+
      '<button class="save-feedback-btn" id="savebtn-t1-'+sid+'" onclick="saveFeedback(\''+examId+'\',\''+sid+'\',\'t1\')">Save Feedback</button></div>'+
    '</div>'+
    '<div class="tab-pane" id="pane-'+sid+'-writing2">'+
      '<span class="word-badge">'+(exam.writing_t2_words||0)+' words</span>'+
      '<div class="essay-box">'+esc(exam.writing_t2_text || '(not submitted)')+'</div>'+
      '<label class="feedback-label">Feedback for Task 2:</label>'+
      '<textarea class="feedback-textarea" id="fb-t2-'+sid+'" placeholder="Write your feedback here…">'+esc(exam.t2_feedback||'')+'</textarea>'+
      '<div class="band-row"><label style="font-size:13px;font-weight:700;">Band:</label>'+
      '<select class="band-select" id="band-t2-'+sid+'">'+bandOptions(exam.t2_band)+'</select>'+
      '<button class="save-feedback-btn" id="savebtn-t2-'+sid+'" onclick="saveFeedback(\''+examId+'\',\''+sid+'\',\'t2\')">Save Feedback</button></div>'+
    '</div>';
  } else {
    wPane = '<div class="tab-pane" id="pane-'+sid+'-writing">'+
      '<span class="word-badge">'+(exam.essay_words||0)+' words</span>'+
      '<div class="essay-box">'+esc(exam.essay_text || '(not submitted)')+'</div>'+
      '<label class="feedback-label">Feedback:</label>'+
      '<textarea class="feedback-textarea" id="fb-essay-'+sid+'" placeholder="Write your feedback here…">'+esc(exam.essay_feedback||'')+'</textarea>'+
      '<div class="band-row"><label style="font-size:13px;font-weight:700;">Band:</label>'+
      '<select class="band-select" id="band-essay-'+sid+'">'+bandOptions(exam.essay_band)+'</select>'+
      '<button class="save-feedback-btn" id="savebtn-essay-'+sid+'" onclick="saveFeedback(\''+examId+'\',\''+sid+'\',\'essay\')">Save Feedback</button></div>'+
    '</div>';
  }

  var sPane = '<div class="tab-pane" id="pane-'+sid+'-speaking">'+
    buildSpeakingAI(exam, sid)+
    '<label class="feedback-label" style="margin-top:0;">Feedback for Speaking:</label>'+
    '<textarea class="feedback-textarea" id="fb-speaking-'+sid+'" placeholder="Write your feedback here…">'+esc(exam.speaking_feedback||'')+'</textarea>'+
    '<div class="band-row"><label style="font-size:13px;font-weight:700;">Band:</label>'+
    '<select class="band-select" id="band-speaking-'+sid+'">'+bandOptions(exam.speaking_band)+'</select>'+
    '<button class="save-feedback-btn" id="savebtn-speaking-'+sid+'" onclick="saveFeedback(\''+examId+'\',\''+sid+'\',\'speaking\')">Save Feedback</button></div>'+
  '</div>';

  var isPublished = !!exam.results_published;
  var sendSection = '<div style="margin-top:24px;padding-top:20px;border-top:2px solid var(--border);">';
  if(isPublished){
    sendSection += '<div style="background:var(--good-soft);border:1px solid #1f9d5540;border-radius:8px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">'+
      '<span style="color:var(--good);font-weight:700;font-size:14px;">✓ Results sent to student</span>'+
      '<button class="save-feedback-btn" style="background:var(--surface);color:var(--warn);border:1px solid var(--warn);" onclick="sendResults(\''+examId+'\',\''+sid+'\')">Re-send / Update</button></div>';
  } else {
    sendSection += '<button class="save-feedback-btn" style="background:var(--good);padding:12px 24px;font-size:15px;" onclick="sendResults(\''+examId+'\',\''+sid+'\')">📤 Send Results to Student</button>'+
      '<p style="font-size:12.5px;color:var(--muted);margin-top:8px;">The student will not see any scores, essay feedback, or the speaking band until you click this.</p>';
  }
  sendSection += '</div>';

  return overview + tabs + liPane + rPane + wPane + sPane + sendSection;
}

function buildAnswerPane(answersRaw, keyRaw, total){
  var answers = answersRaw || {};
  var key = keyRaw || {};
  var rows = '';
  for(var i=1; i<=total; i++){
    var k = String(i);
    var raw = answers[k];
    var hasAns = raw !== undefined && raw !== null && String(raw).trim() !== '';
    var studentVal = hasAns ? String(raw) : 'N/A';
    var correct = key[k];
    var isCorrect = (hasAns && correct !== undefined) ? checkIsCorrect(raw, correct) : null;
    var cellClass = isCorrect === true ? 'ans-correct' : isCorrect === false ? 'ans-wrong' : '';
    rows += '<tr><td>'+i+'</td><td class="'+cellClass+'">'+esc(studentVal)+(isCorrect===true?' ✓':isCorrect===false?' ✗':'')+'</td><td>'+esc(Array.isArray(correct)?correct.join(' / '):(correct!==undefined?correct:'—'))+'</td></tr>';
  }
  return '<table class="ans-table"><tr><th>Q</th><th>Student answer</th><th>Correct answer</th></tr>'+rows+'</table>';
}

function bandOptions(selected){
  var bands = [''];
  for(var i=1;i<=9;i+=0.5) bands.push(i.toFixed(1));
  return bands.map(function(b){
    return '<option value="'+b+'"'+(b===String(selected||'')?' selected':'')+'>'+(b||'— Select band')+'</option>';
  }).join('');
}

function toggleCard(sid){
  var detail = document.getElementById('detail-'+sid);
  var icon = document.getElementById('icon-'+sid);
  if(!detail||!icon) return;
  var isOpen = detail.classList.contains('show');
  detail.classList.toggle('show', !isOpen);
  icon.classList.toggle('open', !isOpen);
}
window.toggleCard = toggleCard;

// ---------- AI speaking test (from Day 20 on) ----------
var CRIT_NAMES = { fc:'Fluency & Coherence', lr:'Lexical Resource', gra:'Grammar', pr:'Pronunciation*' };
function buildSpeakingAI(exam, sid){
  var st = exam.speaking_status, ai = exam.speaking_ai || {};
  if(!st){
    return '<div class="no-key-notice">ℹ️ Speaking isn\'t part of this mock test. Run the speaking test separately with this student, then enter their band and feedback below.</div>';
  }
  var rerun = '<button class="save-feedback-btn" style="background:var(--surface);color:var(--accent);border:1px solid var(--accent);margin-top:8px;" onclick="rerunSpeakingAI(\''+exam.id+'\',\''+sid+'\',this)">↻ Run AI marking again</button>';
  var html = '<div style="background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:16px;">';
  if(st === 'submitted' || st === 'grading'){
    html += '<div style="font-weight:700;">⏳ AI marking in progress…</div><div style="font-size:13px;color:var(--muted);">It usually takes 1–2 minutes. Refresh this page to see the result.</div>' + (st==='grading' ? '' : rerun);
  } else if(st === 'error'){
    html += '<div style="font-weight:700;color:var(--warn);">⚠️ AI marking failed</div><div style="font-size:12px;color:var(--muted);font-family:var(--mono);word-break:break-word;">'+esc(ai.error||'')+'</div>' + rerun;
  } else if(st === 'done' && ai.result){
    var r = ai.result;
    html += '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px;"><span style="font-weight:700;">🤖 AI estimate</span><span style="font-size:26px;font-weight:800;color:var(--accent);">'+r.overall+'</span><span style="font-size:12.5px;color:var(--muted);">'+(ai.stats?ai.stats.words+' words · '+Math.round((ai.stats.seconds||0)/60)+' min of speech':'')+'</span></div>';
    html += '<table class="ans-table" style="margin-bottom:10px;"><tbody>' + ['fc','lr','gra','pr'].map(function(k){
      return '<tr><td style="font-weight:700;white-space:nowrap;">'+CRIT_NAMES[k]+'</td><td style="font-weight:800;color:var(--accent);">'+r[k]+'</td><td style="font-size:13px;color:var(--ink-soft);">'+esc(r[k+'_note']||'')+'</td></tr>';
    }).join('') + '</tbody></table>';
    html += '<div style="font-size:12px;color:var(--muted);">*Pronunciation is estimated from the transcript — please listen to a couple of answers and adjust the band if needed. The band and feedback below were filled in by the AI; edit them before you send results.</div>';
  }
  html += '</div>';
  var recs = ai.recordings || [];
  if(recs.length){
    html += '<details style="margin-bottom:16px;"><summary style="cursor:pointer;font-weight:700;">🎧 Recordings & transcripts ('+recs.length+')</summary><div style="margin-top:10px;">';
    recs.forEach(function(rc){
      var label = rc.part === 0 ? 'Intro' : 'Part ' + rc.part;
      html += '<div style="border-bottom:1px solid var(--border);padding:10px 0;">'+
        '<div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;">'+label+(rc.duration?' · '+rc.duration+'s':'')+(rc.words!==undefined?' · '+rc.words+' words':'')+'</div>'+
        '<div style="font-size:13.5px;font-weight:600;margin:2px 0 6px;">'+esc(rc.question||'')+'</div>'+
        '<audio controls preload="none" data-path="'+esc(rc.path)+'" style="width:100%;height:36px;"></audio>'+
        (rc.text!==undefined ? '<div style="font-size:14px;line-height:1.6;margin-top:6px;background:var(--surface-2);border-radius:6px;padding:8px 10px;">'+(rc.text?esc(rc.text):'<em style="color:var(--muted);">(no answer / silence)</em>')+'</div>' : '')+
      '</div>';
    });
    html += '</div></details>';
  }
  return html;
}
async function loadSpeakingAudio(sid){
  var pane = document.getElementById('pane-'+sid+'-speaking');
  if(!pane || pane.dataset.audioLoaded) return;
  var els = Array.prototype.slice.call(pane.querySelectorAll('audio[data-path]'));
  if(!els.length) return;
  pane.dataset.audioLoaded = '1';
  try {
    var res = await sb.storage.from('speaking-recordings').createSignedUrls(els.map(function(a){ return a.dataset.path; }), 3600);
    (res.data || []).forEach(function(d, i){ if(d && d.signedUrl) els[i].src = d.signedUrl; });
  } catch(e){ console.warn('Could not load recordings', e); }
}
async function rerunSpeakingAI(examId, sid, btn){
  var exam = allExams.find(function(e){ return e.id === examId; });
  if(!exam) return;
  btn.disabled = true; btn.textContent = 'Starting…';
  try {
    var r = await sb.functions.invoke('mock-speaking', { body: { action:'grade', student_id: exam.student_id, track: TRACK_KEY, mock_day: MOCK_DAY, force: true } });
    if(r.error) throw r.error;
    btn.textContent = 'Started — refresh in 1–2 minutes';
  } catch(e){
    alert('Could not start AI marking: ' + (e.message || e));
    btn.disabled = false; btn.textContent = '↻ Run AI marking again';
  }
}
window.rerunSpeakingAI = rerunSpeakingAI;

function switchTab(sid, tabName, el){
  if(tabName === 'speaking') loadSpeakingAudio(sid);
  var card = el.closest('.student-card');
  card.querySelectorAll('.detail-tab').forEach(function(t){t.classList.remove('active');});
  card.querySelectorAll('.tab-pane').forEach(function(p){p.classList.remove('active');});
  el.classList.add('active');
  var pane = document.getElementById('pane-'+sid+'-'+tabName);
  if(pane) pane.classList.add('active');
}
window.switchTab = switchTab;

async function saveFeedback(examId, sid, task){
  var fbEl = document.getElementById('fb-'+task+'-'+sid);
  var bandEl = document.getElementById('band-'+task+'-'+sid);
  var btnEl = document.getElementById('savebtn-'+task+'-'+sid);
  if(!fbEl||!bandEl||!btnEl) return;
  var patch = {};
  patch[task+'_feedback'] = fbEl.value;
  patch[task+'_band'] = bandEl.value || null;
  btnEl.textContent = 'Saving…'; btnEl.disabled = true;
  try {
    var res = await sb.from('c2_mock_exams').update(patch).eq('id', examId);
    if(res.error) throw res.error;
    var idx = allExams.findIndex(function(e){return e.id===examId;});
    if(idx>=0) Object.assign(allExams[idx], patch);
    btnEl.textContent = 'Saved ✓'; btnEl.className = 'save-feedback-btn saved';
    setTimeout(function(){ btnEl.textContent='Save Feedback'; btnEl.className='save-feedback-btn'; btnEl.disabled=false; }, 2500);
  } catch(err){
    alert('Save failed: ' + (err.message || JSON.stringify(err)));
    btnEl.textContent = 'Save Feedback'; btnEl.disabled = false;
  }
}
window.saveFeedback = saveFeedback;

async function sendResults(examId, sid){
  var info = allStudents[sid] || {};
  if(!confirm('Send results to '+(info.name||'this student')+'? They will immediately be able to see their scores, essay, and your feedback.')) return;
  try {
    var res = await sb.from('c2_mock_exams').update({ results_published: true, reviewed_at: new Date().toISOString() }).eq('id', examId);
    if(res.error) throw res.error;
    var idx = allExams.findIndex(function(e){return e.id===examId;});
    if(idx>=0) allExams[idx].results_published = true;
    applyFilters();
    setTimeout(function(){
      var card = document.querySelector('.student-card[data-sid="'+sid+'"]');
      if(card){ toggleCard(sid); card.scrollIntoView({behavior:'smooth', block:'center'}); }
    }, 100);
  } catch(err){
    alert('Failed to send results: ' + (err.message || JSON.stringify(err)));
  }
}
window.sendResults = sendResults;

function showError(msg){
  document.getElementById('loadingState').style.display = 'none';
  var el = document.getElementById('errorState');
  el.textContent = msg; el.style.display = 'block';
}
function showEmpty(msg){
  document.getElementById('loadingState').style.display = 'none';
  var el = document.getElementById('emptyState');
  if(msg) el.textContent = msg;
  el.style.display = 'block';
}
