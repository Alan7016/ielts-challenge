<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Group Chat — IELTS Marathon</title>
<link rel="stylesheet" href="style.css">
<style>
  .chat-wrap { display: flex; flex-direction: column; height: calc(100vh - 210px); min-height: 420px; }
  .chat-scroll { flex: 1; overflow-y: auto; padding: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius) var(--radius) 0 0; box-shadow: var(--shadow); }
  .chat-msg { display: flex; gap: 10px; margin-bottom: 16px; }
  .chat-msg.mine { flex-direction: row-reverse; }
  .chat-bubble { max-width: 70%; padding: 10px 14px; border-radius: 14px; background: var(--surface-2); }
  .chat-msg.mine .chat-bubble { background: var(--accent); color: #fff; }
  .chat-msg.mentor .chat-bubble { background: var(--accent-soft); border: 1px solid var(--accent); }
  .chat-msg.mine.mentor .chat-bubble { background: var(--accent); border: none; }
  .chat-sender { font-size: 0.76rem; font-weight: 700; margin-bottom: 3px; color: var(--muted); }
  .chat-msg.mine .chat-sender { text-align: right; color: rgba(255,255,255,0.85); }
  .chat-msg.mentor:not(.mine) .chat-sender { color: var(--accent); }
  .chat-body { white-space: pre-wrap; word-break: break-word; font-size: 0.9rem; }
  .chat-time { font-size: 0.68rem; opacity: 0.7; margin-top: 4px; }
  .chat-compose { display: flex; gap: 10px; padding: 14px; background: var(--surface); border: 1px solid var(--border); border-top: none; border-radius: 0 0 var(--radius) var(--radius); }
  .chat-compose textarea { flex: 1; resize: none; min-height: 44px; max-height: 120px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; font-family: var(--body); font-size: 0.9rem; }
</style>
</head>
<body>

<div id="content" style="display:none;">

  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo">IELTS <span>MARATHON</span></div>
      <div style="display:flex; align-items:center; gap:14px;">
        <a href="#" id="back-link" style="font-family:var(--mono); font-size:0.82rem; font-weight:600; color:var(--accent); text-decoration:none;">← Back</a>
        <button class="ghost" id="logout-btn" style="padding:7px 14px;">Log out</button>
      </div>
    </div>
  </header>

  <section class="hero" style="padding-top:32px; padding-bottom:8px;">
    <div class="wrap">
      <div class="eyebrow">Group chat</div>
      <h1 id="page-title">Loading…</h1>
    </div>
  </section>

  <section>
    <div class="wrap chat-wrap">
      <div class="chat-scroll" id="chat-scroll">
        <p style="color:var(--muted); font-family:var(--mono); font-size:0.85rem;">Loading messages…</p>
      </div>
      <div class="chat-compose">
        <textarea id="chat-input" placeholder="Write a message to the group..."></textarea>
        <button id="chat-send">Send</button>
      </div>
    </div>
  </section>

</div>

<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
<script>
  let myUserId, myGroupId, myRole;

  requireAuth(async function (profile, user) {
    myUserId = user.id;
    myRole = profile.role;
    const sb = getSupabaseClient();

    document.getElementById('back-link').href = myRole === 'mentor' ? 'mentor-dashboard.html' : 'index.html';

    if (myRole === 'mentor') {
      const { data: assignment } = await sb.from('group_mentors').select('group_id').eq('mentor_id', user.id).limit(1).maybeSingle();
      if (!assignment) {
        document.getElementById('page-title').textContent = 'No group assigned yet';
        return;
      }
      myGroupId = assignment.group_id;
    } else {
      if (!profile.group_id) {
        document.getElementById('page-title').textContent = 'No group assigned yet';
        document.getElementById('chat-scroll').innerHTML = '<p style="color:var(--muted);">Ask your mentor to add you to a group first.</p>';
        return;
      }
      myGroupId = profile.group_id;
    }

    const { data: group } = await sb.from('groups').select('name').eq('id', myGroupId).single();
    document.getElementById('page-title').textContent = group ? group.name : 'Group chat';

    await loadMessages();
    subscribeToNewMessages();

    document.getElementById('chat-send').addEventListener('click', sendMessage);
    document.getElementById('chat-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
  });

  function formatTime(iso) {
    const d = new Date(iso);
    return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  function renderMessage(m) {
    const mine = m.sender_id === myUserId;
    const isMentor = m.sender_role === 'mentor';
    const scroll = document.getElementById('chat-scroll');
    const div = document.createElement('div');
    div.className = `chat-msg ${mine ? 'mine' : ''} ${isMentor ? 'mentor' : ''}`.trim();
    div.innerHTML = `
      <div class="chat-bubble">
        <div class="chat-sender">${(m.sender_name || 'Unknown').replace(/</g, '&lt;')}${isMentor ? ' · Mentor' : ''}</div>
        <div class="chat-body"></div>
        <div class="chat-time">${formatTime(m.created_at)}</div>
      </div>
    `;
    div.querySelector('.chat-body').textContent = m.body;
    scroll.appendChild(div);
  }

  async function loadMessages() {
    const sb = getSupabaseClient();
    const scroll = document.getElementById('chat-scroll');
    const { data, error } = await sb.from('group_messages').select('*').eq('group_id', myGroupId).order('created_at').limit(300);
    scroll.innerHTML = '';
    if (error) {
      scroll.innerHTML = '<p style="color:var(--warn);">Couldn\'t load messages — try refreshing.</p>';
      console.error(error);
      return;
    }
    if (!data || data.length === 0) {
      scroll.innerHTML = '<p style="color:var(--muted);">No messages yet — say hello!</p>';
      return;
    }
    data.forEach(renderMessage);
    scroll.scrollTop = scroll.scrollHeight;
  }

  function subscribeToNewMessages() {
    const sb = getSupabaseClient();
    sb.channel(`group-chat-${myGroupId}`)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'group_messages', filter: `group_id=eq.${myGroupId}` }, (payload) => {
        const scroll = document.getElementById('chat-scroll');
        const wasEmpty = scroll.querySelector('p');
        if (wasEmpty) scroll.innerHTML = '';
        renderMessage(payload.new);
        scroll.scrollTop = scroll.scrollHeight;
      })
      .subscribe();
  }

  async function sendMessage() {
    const input = document.getElementById('chat-input');
    const body = input.value.trim();
    if (!body) return;
    const sb = getSupabaseClient();
    input.value = '';
    const { error } = await sb.from('group_messages').insert({ group_id: myGroupId, body });
    if (error) {
      console.error(error);
      alert('Message failed to send — please try again.');
      input.value = body;
    }
  }
</script>
</body>
</html>
