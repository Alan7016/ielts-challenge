<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Marathon</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- CONTENT (hidden until requireAuth confirms a session) -->
<div id="content" style="display:none;">

  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo">IELTS <span>MARATHON</span></div>
      <div style="display:flex; align-items:center; gap:14px; font-family:var(--mono); font-size:0.82rem; color:var(--muted);">
        <span>Hi, <span id="user-greeting" style="color:var(--ink); font-weight:600;">…</span></span>
        <button class="ghost" id="logout-btn" style="padding:7px 14px;">Log out</button>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="wrap">
      <div class="eyebrow">30-day training block</div>
      <h1>Your Marathon Board</h1>
      <p class="tag">Nine tasks a day, thirty days straight. Pick a day below and run the full leg: article, vocab, reading, writing, speaking, video, listening.</p>

      <div class="progress-shell">
        <span class="label" id="progress-label">1 / 30 days live</span>
        <div class="bar-track"><div class="bar-fill" id="progress-fill" style="width:0%"></div></div>
      </div>
    </div>
  </section>

  <section style="padding-top:0;">
    <div class="wrap">
      <div id="track-grid" class="track-grid"></div>
    </div>
  </section>

  <div class="finish-line">— day 30 is the finish line —</div>
</div>

<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
<script>
  async function buildGrid() {
    const grid = document.getElementById('track-grid');
    grid.innerHTML = '<p style="color:var(--muted); font-family:var(--mono); font-size:0.85rem;">Loading days…</p>';
    const liveDays = await getLiveDays();

    document.getElementById('progress-label').textContent = `${liveDays.length} / 30 days live`;
    document.getElementById('progress-fill').style.width = `${(liveDays.length / 30) * 100}%`;

    let html = '';
    for (let d = 1; d <= 30; d++) {
      const isOpen = liveDays.includes(d);
      const isFinish = d === 30;
      const isMock = MOCK_DAYS.includes(d);
      if (isOpen) {
        html += `<a class="day-chip open${isFinish ? ' finish' : ''}${isMock ? ' mock' : ''}" href="days/day${d}.html">
          <span class="num">${String(d).padStart(2, '0')}</span>
          <span class="lbl">${isMock ? '🎯 Mock Exam' : 'Day ' + d}</span>
          <span class="meta">${isMock ? 'Full practice test' : '9 tasks'}</span>
        </a>`;
      } else {
        html += `<div class="day-chip locked${isFinish ? ' finish' : ''}${isMock ? ' mock' : ''}" title="Coming soon">
          <span class="num">${String(d).padStart(2, '0')}</span>
          <span class="lbl">${isMock ? '🎯 Mock Exam' : 'Day ' + d}</span>
          <span class="meta">${isFinish ? 'Finish' : 'Coming soon'}</span>
        </div>`;
      }
    }
    grid.innerHTML = html;
  }

  requireAuth(function (profile) {
    buildGrid();
  });
</script>
</body>
</html>
