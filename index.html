<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Marathon</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- CONTENT (hidden until requireAuth confirms a session) -->
<div id="content" style="display:none;">

  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo">IELTS <span>MARATHON</span></div>
      <div style="display:flex; align-items:center; gap:14px;">
        <div class="nav-links">
          <a href="index.html" class="active">Board</a>
          <a href="leaderboard.html">Leaderboard</a>
          <a href="profile.html">Profile</a>
          <a href="group-chat.html" id="chat-nav-link" style="display:none;">💬 Chat</a>
        </div>
        <span style="font-family:var(--mono); font-size:0.82rem; color:var(--muted);">Hi, <span id="user-greeting" style="color:var(--ink); font-weight:600;">…</span></span>
        <div class="notif-bell-wrap" id="notif-bell">
          <span class="notif-bell-icon" style="font-size:1.2rem;">🔔</span>
          <span class="notif-badge" id="notif-badge"></span>
          <div class="notif-dropdown" id="notif-dropdown"></div>
        </div>
        <button class="ghost" id="logout-btn" style="padding:7px 14px;">Log out</button>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="wrap">
      <div class="eyebrow" id="page-eyebrow">30-day training block</div>
      <h1 id="page-title">Your Marathon Board</h1>
      <p class="tag" id="page-tag">Nine tasks a day, thirty days straight. Pick a day below and run the full leg: article, vocab, reading, writing, speaking, video, listening.</p>

      <div class="progress-shell">
        <span class="label" id="progress-label">1 / 30 days live</span>
        <div class="bar-track"><div class="bar-fill" id="progress-fill" style="width:0%"></div></div>
      </div>
    </div>
  </section>

  <section style="padding-top:0;">
    <div class="wrap">
      <div id="weekly-winner-banner"></div>
      <div id="track-grid" class="track-grid"></div>
    </div>
  </section>

  <div class="finish-line" id="finish-line">— day 30 is the finish line —</div>
</div>

<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
<script>
  // Which folder and how many days a student sees depends entirely on their
  // challenge + level — Challenge 1.0 is untouched (folder "days", 30 days),
  // while each Challenge 2.0 level gets its own folder and a 45-day run.
  function trackConfigFor(profile) {
    if (profile.challenge === '2.0') {
      const level = profile.level || 'standard';
      const levelLabel = level.charAt(0).toUpperCase() + level.slice(1);
      const totalDays = 45;
      // Every 7th day is a mock, recurring for the whole course (Day 6,
      // 13, 20, 27, 34, 41) — same pattern for every level.
      const mockDays = [];
      for (let d = 6; d <= totalDays; d += 7) mockDays.push(d);
      return {
        folder: `challenge2/${level}`,
        totalDays: totalDays,
        eyebrow: `Challenge 2.0 — ${levelLabel}`,
        title: `Your ${levelLabel} Board`,
        tag: `Six weeks, one goal: a stronger band score. Pick a day below and run the full leg.`,
        finishLine: '— day 45 is the finish line —',
        mockDays: mockDays
      };
    }
    return {
      folder: 'days',
      totalDays: 30,
      eyebrow: '30-day training block',
      title: 'Your Marathon Board',
      tag: 'Nine tasks a day, thirty days straight. Pick a day below and run the full leg: article, vocab, reading, writing, speaking, video, listening.',
      finishLine: '— day 30 is the finish line —',
      mockDays: MOCK_DAYS
    };
  }

  async function renderWeeklyWinnerBanner(profile) {
    const el = document.getElementById('weekly-winner-banner');
    // This showcase only makes sense for Challenge 2.0's weekly points
    // system — Challenge 1.0 has no equivalent and no group_id/level to
    // scope a winner to.
    if (profile.challenge !== '2.0' || !profile.level) return;

    const sb = getSupabaseClient();
    const currentDay = await getCurrentDayNumberC2();
    const cfg = trackConfigFor(profile);
    const completed = getMostRecentCompletedWeek(currentDay, cfg.mockDays);
    if (!completed) return; // no week has finished yet — nothing to show

    const [dayFrom, dayTo] = completed;
    const { data: levelStudents } = await sb.from('profiles').select('id')
      .eq('role', 'student').eq('challenge', '2.0').eq('level', profile.level);
    const studentIds = (levelStudents || []).map(s => s.id);
    if (studentIds.length === 0) return;

    const { data: pointsRows } = await sb.from('points').select('student_id, points')
      .gte('day', dayFrom).lte('day', dayTo).in('student_id', studentIds);
    if (!pointsRows || pointsRows.length === 0) return;

    const totals = {};
    pointsRows.forEach(r => { totals[r.student_id] = (totals[r.student_id] || 0) + Number(r.points); });
    const winnerId = Object.keys(totals).sort((a, b) => totals[b] - totals[a])[0];
    const winnerPoints = Math.round(totals[winnerId] * 10) / 10;

    const { data: winnerProfile } = await sb.from('profiles').select('full_name').eq('id', winnerId).maybeSingle();
    if (!winnerProfile) return;

    const weekNum = Math.floor((dayFrom - 7) / 7) + 2; // Day 7-13 is week 2, per the fixed schedule
    el.innerHTML = `
      <div class="weekly-winner-banner">
        <span class="wwb-emoji">😎</span>
        <div class="wwb-text">
          <div class="wwb-title">🏆 Week ${weekNum} Champion</div>
          <div class="wwb-name">${winnerProfile.full_name}</div>
          <div class="wwb-points">${winnerPoints} points</div>
        </div>
      </div>
    `;
  }

  async function buildGrid(profile, userId) {
    const cfg = trackConfigFor(profile);
    document.getElementById('page-eyebrow').textContent = cfg.eyebrow;
    document.getElementById('page-title').textContent = cfg.title;
    document.getElementById('page-tag').textContent = cfg.tag;
    document.getElementById('finish-line').textContent = cfg.finishLine;

    const grid = document.getElementById('track-grid');
    grid.innerHTML = '<p style="color:var(--muted); font-family:var(--mono); font-size:0.85rem;">Loading days…</p>';
    const liveDays = await getLiveDays(cfg.folder, cfg.totalDays);
    const trackKey = profile.challenge === '2.0' ? `2.0-${profile.level || 'standard'}` : '1.0';
    const completedDays = await getCompletedDaysForStudent(userId, trackKey, cfg.totalDays);

    document.getElementById('progress-label').textContent = `${liveDays.length} / ${cfg.totalDays} days live`;
    document.getElementById('progress-fill').style.width = `${(liveDays.length / cfg.totalDays) * 100}%`;

    let html = '';
    for (let d = 1; d <= cfg.totalDays; d++) {
      const isPublished = liveDays.includes(d);
      const isMock = cfg.mockDays.includes(d);
      // Mock days are intentionally open regardless of the previous day's
      // completion — this first mock in particular has no such dependency.
      // A later mock could be made to depend on a specific day by adding
      // that logic here, but the default is open, not gated.
      // A day right after a mock is also never gated on that mock being
      // "complete" — mock exams save their own completion to a separate
      // table entirely, not the regular progress table completedDays is
      // built from, so that check would never actually pass and would
      // permanently lock the day after every mock for everyone.
      const isEarned = isMock || d === 1 || cfg.mockDays.includes(d - 1) || completedDays.has(d - 1);
      const isOpen = isPublished && isEarned;
      const isFinish = d === cfg.totalDays;
      if (isOpen) {
        html += `<a class="day-chip open${isFinish ? ' finish' : ''}${isMock ? ' mock' : ''}" href="${cfg.folder}/day${d}.html">
          <span class="num">${String(d).padStart(2, '0')}</span>
          <span class="lbl">${isMock ? '🎯 Mock Exam' : 'Day ' + d}</span>
          <span class="meta">${isMock ? 'Full practice test' : '9 tasks'}</span>
        </a>`;
      } else {
        const reason = !isPublished ? 'Coming soon' : `Finish Day ${d - 1} first`;
        html += `<div class="day-chip locked${isFinish ? ' finish' : ''}${isMock ? ' mock' : ''}" title="${reason}">
          <span class="num">${String(d).padStart(2, '0')}</span>
          <span class="lbl">${isMock ? '🎯 Mock Exam' : 'Day ' + d}</span>
          <span class="meta">${isFinish ? 'Finish' : reason}</span>
        </div>`;
      }
    }
    grid.innerHTML = html;
  }

  requireAuth(function (profile, user) {
    if (profile.role === 'admin') { window.location.href = 'admin-dashboard.html'; return; }
    if (profile.role === 'teacher') { window.location.href = 'teacher-dashboard.html'; return; }
    if (profile.role === 'checker') { window.location.href = 'checker-dashboard.html'; return; }
    if (profile.role === 'mentor') { window.location.href = 'mentor-dashboard.html'; return; }
    buildGrid(profile, user.id);
    renderWeeklyWinnerBanner(profile);
    if (profile.challenge === '2.0' && profile.group_id) {
      document.getElementById('chat-nav-link').style.display = '';
    }
    initNotificationBell(user.id, trackConfigFor(profile).folder);
  });
</script>
</body>
</html>
