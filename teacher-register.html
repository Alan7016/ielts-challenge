<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Registration — IELTS Marathon</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="gate">
  <div class="gate-card" style="max-width:460px;">
    <div class="eyebrow">Staff registration</div>
    <h1>Teacher sign-up</h1>
    <p>Enter your staff code, your details, and pick the two groups you've been assigned.</p>

    <form id="register-form" style="text-align:left;">
      <label style="font-size:0.85rem; font-weight:600; color:var(--ink);">Staff code
        <input type="text" id="staff-code" required autocomplete="off" style="width:100%; margin-top:4px;">
      </label>
      <label style="font-size:0.85rem; font-weight:600; color:var(--ink); margin-top:12px; display:block;">Full name
        <input type="text" id="full-name" required style="width:100%; margin-top:4px;">
      </label>
      <label style="font-size:0.85rem; font-weight:600; color:var(--ink); margin-top:12px; display:block;">Email
        <input type="email" id="email" required autocomplete="off" style="width:100%; margin-top:4px;">
      </label>
      <label style="font-size:0.85rem; font-weight:600; color:var(--ink); margin-top:12px; display:block;">Password
        <input type="password" id="password" required minlength="6" style="width:100%; margin-top:4px;">
      </label>
      <label style="font-size:0.85rem; font-weight:600; color:var(--ink); margin-top:12px; display:block;">Confirm password
        <input type="password" id="password-confirm" required minlength="6" style="width:100%; margin-top:4px;">
      </label>

      <label style="font-size:0.85rem; font-weight:600; color:var(--ink); margin-top:12px; display:block;">First group
        <select id="group-1" required style="width:100%; margin-top:4px;">
          <option value="">— loading available groups… —</option>
        </select>
      </label>
      <label style="font-size:0.85rem; font-weight:600; color:var(--ink); margin-top:12px; display:block;">Second group
        <select id="group-2" required style="width:100%; margin-top:4px;">
          <option value="">— loading available groups… —</option>
        </select>
      </label>

      <button type="submit" style="width:100%; margin-top:20px;">Create teacher account</button>
      <div class="gate-error" id="form-error"></div>
      <div id="form-success" style="display:none; color:var(--good); font-family:var(--mono); font-size:0.85rem; margin-top:8px;"></div>
    </form>

    <p style="margin-top:18px; font-size:0.88rem;">Already registered? <a href="login.html">Log in</a></p>
  </div>
</div>

<script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  let availableGroups = [];

  async function loadAvailableGroups() {
    const { data, error } = await sb.from('groups').select('id, name, teacher_id').is('teacher_id', null).order('id');
    const g1 = document.getElementById('group-1');
    const g2 = document.getElementById('group-2');
    if (error || !data || data.length === 0) {
      g1.innerHTML = '<option value="">— no unassigned groups left —</option>';
      g2.innerHTML = '<option value="">— no unassigned groups left —</option>';
      return;
    }
    availableGroups = data;
    const options = '<option value="">— choose —</option>' + data.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
    g1.innerHTML = options;
    g2.innerHTML = options;
  }
  loadAvailableGroups();

  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('form-error');
    const successEl = document.getElementById('form-success');
    errorEl.textContent = '';
    successEl.style.display = 'none';

    const staffCode = document.getElementById('staff-code').value.trim();
    const fullName = document.getElementById('full-name').value.trim();
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const passwordConfirm = document.getElementById('password-confirm').value;
    const group1 = document.getElementById('group-1').value;
    const group2 = document.getElementById('group-2').value;

    if (password !== passwordConfirm) {
      errorEl.textContent = 'Passwords do not match.';
      return;
    }
    if (!group1 || !group2) {
      errorEl.textContent = 'Please choose both groups.';
      return;
    }
    if (group1 === group2) {
      errorEl.textContent = 'Please choose two different groups.';
      return;
    }

    let result;
    try {
      result = await sb.auth.signUp({
        email,
        password,
        options: {
          data: { full_name: fullName, role: 'teacher', staff_code: staffCode }
        }
      });
    } catch (err) {
      console.error('Signup threw an exception:', err);
      errorEl.textContent = 'Network error — check your connection and try again.';
      return;
    }

    const { data, error } = result;
    if (error) {
      console.error('Signup returned an error:', error);
      errorEl.textContent = error.message || 'Registration failed — check the console for details.';
      return;
    }

    // Verify the staff code actually took effect (role really became 'teacher').
    // If it didn't, the account exists but as a student — the code was wrong.
    const { data: profile } = await sb.from('profiles').select('role').eq('id', data.user.id).single();
    if (!profile || profile.role !== 'teacher') {
      errorEl.textContent = 'Account created, but the staff code was incorrect — you were registered as a student. Contact the admin.';
      return;
    }

    // Claim the two chosen groups. If someone else grabbed one in the
    // last few seconds, this affects 0 rows instead of erroring — we
    // check for that explicitly.
    const claim1 = await sb.from('groups').update({ teacher_id: data.user.id }).eq('id', group1).is('teacher_id', null).select();
    const claim2 = await sb.from('groups').update({ teacher_id: data.user.id }).eq('id', group2).is('teacher_id', null).select();

    const failedClaims = [];
    if (!claim1.data || claim1.data.length === 0) failedClaims.push(group1);
    if (!claim2.data || claim2.data.length === 0) failedClaims.push(group2);

    if (failedClaims.length > 0) {
      errorEl.textContent = `Your account was created, but a group you picked was just taken by someone else. Please log in and contact the admin to sort out your groups.`;
      return;
    }

    successEl.textContent = 'Teacher account created! Redirecting to login…';
    successEl.style.display = 'block';
    setTimeout(() => { window.location.href = 'login.html'; }, 1200);
  });
</script>
</body>
</html>
