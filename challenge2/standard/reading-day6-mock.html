*{box-sizing:border-box}body{margin:0;height:100vh;font-family:Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden;color:#111;background:#fff}.top{height:52px;border-bottom:1px solid #ddd;display:flex;justify-content:flex-end;align-items:center;gap:14px;padding:0 18px}.top button{border:0;background:#fff;color:#333;font-size:18px;width:32px;height:32px;border-radius:4px}.banner{margin:14px 16px 0;padding:12px 18px;background:#f2f3f4;border:1px solid #ddd;border-radius:6px}.banner h2{margin:0 0 4px;font-size:18px}.banner p{margin:0}.split{flex:1;min-height:0;display:flex;margin:12px 16px 0;border-top:1px solid #ddd}.pane{overflow:auto;padding:18px 26px 70px;min-width:180px}.left{width:50%;flex:0 0 auto}.right{flex:1}.divider{width:12px;border-left:2px solid #999;cursor:col-resize;position:relative}.divider:after{content:"";position:absolute;top:50%;left:-10px;width:20px;height:32px;margin-top:-16px;border:1px solid #ccc;border-radius:12px;background:#fff}h1{font-size:25px;margin:0 0 8px;line-height:1.25}.sub{font-size:18px;line-height:1.45;margin-top:0}.para{font-weight:700;margin-top:24px;font-size:18px}p{line-height:1.58;font-size:17px}.qgroup{margin-bottom:34px}.qgroup h3{font-size:22px;margin:0 0 10px}.qnum{display:inline-flex;justify-content:center;align-items:center;min-width:30px;height:30px;border:1px solid #ddd;border-radius:5px;font-weight:700;background:#fff;margin-right:10px}.tf-row,.mcq{margin:22px 0 30px}.statement,.prompt{display:flex;gap:10px;align-items:flex-start;font-size:18px;line-height:1.4;margin-bottom:14px}.options,.choice-options{display:grid;gap:16px;margin-left:42px}.options label,.choice-option{display:flex;gap:12px;align-items:flex-start;font-size:17px;line-height:1.35}input[type=radio]{appearance:none;width:20px;height:20px;border:2px solid #d9d9d9;border-radius:50%;background:#fff;vertical-align:middle;flex:0 0 auto}input[type=radio]:checked{border-color:#c98292;box-shadow:inset 0 0 0 5px #fff;background:#c98292}.gap{font:inherit;border:1px solid #999;border-radius:4px;background:#fff;padding:5px 8px;width:175px;text-align:center;margin:0 5px}.notes{font-size:17px;line-height:1.75}.note-row{margin:10px 0}.box{background:#f2f3f4;border:1px solid #ddd;border-radius:6px;padding:14px 18px;line-height:1.7;font-size:17px;margin:14px 0}.row{display:flex;gap:12px;align-items:flex-start;margin:16px 0}.txt{flex:1;font-size:17px;line-height:1.45}.select{font:inherit;border:1px solid #cfcfcf;border-radius:7px;background:#f7f8f9;padding:8px 28px 8px 14px;min-width:86px}.tools{position:absolute;z-index:50;display:none;background:#222;border-radius:6px;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.2)}.tools button{background:none;border:0;color:#fff;padding:6px 10px;font:inherit}.hl{background:#ffe45c}.bar{height:59px;border-top:1px solid #ddd;display:flex;align-items:center;gap:28px;padding:8px 18px;background:#fff;overflow-x:auto}.partnav{display:flex;align-items:center;gap:8px;white-space:nowrap}.partlabel{font-weight:700;border:0;background:#fff;font:inherit;cursor:pointer}.count{color:#555;font-size:14px}.tiles{display:flex;gap:4px}.tile{min-width:32px;height:32px;border:1px solid #bbb;background:#fff;border-radius:2px;cursor:pointer}.tile.answered{background:#2b2b2b;color:#fff}.review{margin-left:auto;min-width:42px;height:34px;background:#ddd;border:0;border-radius:4px;font-weight:700}.overlay{position:fixed;inset:0;background:white;z-index:100;display:none;flex-direction:column;overflow:auto}.overlay.show{display:flex}.ovh{position:relative;padding:22px}.ovh h2{text-align:center;margin:0}.close{position:absolute;right:24px;top:18px;border:0;background:none;font-size:26px}.ovlist{max-width:880px;width:90%;margin:10px auto}.ovrow{width:100%;padding:18px 22px;border:1px solid #ddd;background:white;font:inherit;text-align:left}.submit{background:#cf3e45;color:white;border-color:#cf3e45;border-radius:6px;margin-bottom:18px;font-weight:700}.score{background:#f2f3f4;border:1px solid #ddd;border-radius:8px;padding:18px 22px;margin-bottom:18px}.score b{font-size:30px}

</style></head><body><header class="top"><button>|||</button><button>o</button><button>=</button></header><div class="banner"><h2 id="partTitle"></h2><p id="partSub"></p></div><div class="split" id="split"><section class="pane left" id="left"></section><div class="divider" id="div"></div><section class="pane right" id="right"></section></div><footer class="bar" id="footer"></footer><div class="tools" id="tools"><button data-act="hl">Highlight</button><button data-act="clear">Clear</button></div><div class="overlay" id="submit"><div class="ovh"><h2>Submission page</h2><button class="close" onclick="submit.classList.remove('show')">x</button></div><div class="ovlist" id="subwrap"></div></div><script>
(function(){
var active=1,graded=false,state={},ranges={1:[1,13]};
var DATA = {"passages": {"1": "<h1>William Kamkwamba</h1>\n<p class=\"sub\">At only 14 years old, William Kamkwamba built a series of windmills that could generate electricity in his African village, Masitala, in Malawi, south-eastern Africa.</p>\n<p>In 2002, William Kamkwamba had to drop out of school, as his father, a maize and tobacco farmer, could no longer afford his school fees. But despite this setback, William was determined to get his education. He began visiting a local library, where he discovered a science book. With only a rudimentary grasp of English, he taught himself basic physics – mainly by studying photos and diagrams. Another book he found there featured windmills on the cover and inspired him to try and build his own.</p>\n<p>He started by constructing a small model. Then, with the help of a cousin and friend, he spent many weeks searching scrap yards and found old tractor fans, shock absorbers, plastic pipe and bicycle parts, which he used to build the real thing.</p>\n<p>For windmill blades, William cut some bath pipe in two lengthwise, then heated the pieces over hot coals to press the curled edges flat. To bore holes into the blades, he stuck a nail through half a cocoa, heated it and twisted it through the blades. It took three hours to repeatedly heat the nail and bore the holes. He attached the blades using proper nuts and bolts and then to the back axle of a bicycle. Electricity was generated through the bicycle dynamo. When the wind blew the blades, the bike chain spun the bike wheel, which charged the dynamo and sent a current through wire to his house.</p>\n<p>What he had built was a crude machine that produced 12 volts of power for four lights. When it was all done, the windmill's wingspan measured more than eight feet and sat on top of a rickety tower 15 feet tall that swayed violently in strong gales. He eventually replaced the tower with a sturdier one that stands 39 feet, and built a second machine that watered a family garden.</p>\n<p>The windmill brought William Kamkwamba instant local fame, but despite his accomplishment, he was still unable to return to school. However, news of his magetsi a mphepo – electric wind – spread beyond Malawi, and eventually things began to change. An education official, who had heard news of the windmill, came to visit his village and was amazed to learn that William had been out of school for five years. He arranged for him to attend secondary school at the government's expense and brought journalists to the farm to see the windmill. Then a story published in the Malawi Daily Mail caught the attention of bloggers, which in turn caught the attention of organisers for the Technology Entertainment and Design conference.</p>\n<p>In 2007, William spoke at the TED Global conference in Tanzania and got a standing ovation. Businessmen stepped forward with offers to fund his education and projects, and with money donated by them, he was able to put his cousin and several friends back into school and pay for some medical needs of his family. With the donation, he also drilled a borehole for a well and water pump in his father's field and installed drip irrigation in his father's fields.</p>\n<p>The water pump has allowed his family to expand its crops. They have abandoned tobacco and now grow maize, beans, soybeans, potatoes and peanuts. The windmills have also brought big lifestyle and health changes to the other villagers. 'The village has changed a lot,' William says. 'Now, the time that they would have spent going to fetch water, they are using for doing other things. And also the water they are drinking is clean water, so there is less disease.' The villagers have also stopped using kerosene and can use the money previously spent on fuel to buy other things.</p>\n<p>William Kamkwamba's example has inspired other children in the village to pursue science. William says they now see that if they put their mind to something, they can achieve it. 'It has changed the way people think,' he says.</p>"}, "answers": {"1": "basic physics", "2": "small model", "3": "scrap yards", "4": "bath pipe", "5": "nuts and bolts", "6": "FALSE", "7": "FALSE", "8": "NOT GIVEN", "9": "TRUE", "10": "TRUE", "11": "39 feet", "12": "kerosene", "13": "science"}, "alt": {"1": ["physics"], "2": ["model"]}, "expl": {"1": {"loc": "Para 1", "text": "'he taught himself basic physics – mainly by studying photos and diagrams' → 'basic physics'."}, "2": {"loc": "Para 2", "text": "'He started by constructing a small model' → 'small model'."}, "3": {"loc": "Para 2", "text": "'with the help of a cousin and friend, he spent many weeks searching scrap yards' → 'scrap yards'."}, "4": {"loc": "Para 3", "text": "'William cut some bath pipe in two lengthwise' → 'bath pipe'."}, "5": {"loc": "Para 3", "text": "'He attached the blades using proper nuts and bolts and then to the back axle of a bicycle' → 'nuts and bolts'."}, "6": {"loc": "Para 4", "text": "The electricity powered 'four lights', not transport → FALSE."}, "7": {"loc": "Para 5", "text": "'The windmill brought William Kamkwamba instant local fame' — the opposite of being ignored → FALSE."}, "8": {"loc": "Para 5", "text": "'brought journalists to the farm to see the windmill' — their nationality isn't specified → NOT GIVEN."}, "9": {"loc": "Para 6", "text": "'he also drilled a borehole for a well and water pump in his father's field and installed drip irrigation' → TRUE."}, "10": {"loc": "Para 7", "text": "'the water they are drinking is clean water, so there is less disease' → TRUE."}, "11": {"loc": "Para 4", "text": "'He eventually replaced the tower with a sturdier one that stands 39 feet' → '39 feet'."}, "12": {"loc": "Para 7", "text": "'The villagers have also stopped using kerosene' → 'kerosene'."}, "13": {"loc": "Final paragraph", "text": "'William Kamkwamba's example has inspired other children in the village to pursue science' → 'science'."}}};
var passages=DATA.passages, answers=DATA.answers, alt=DATA.alt, EXPL=DATA.expl;
function tf(n,t,yn){var opts=yn?['YES','NO','NOT GIVEN']:['TRUE','FALSE','NOT GIVEN'];return '<div class="tf-row" id="q'+n+'"><div class="statement"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="options">'+opts.map(o=>'<label><input type="radio" name="q'+n+'" value="'+o+'"> '+o+'</label>').join('')+'</div></div>'}
function gap(n){return '<span class="qnum">'+n+'</span><input class="gap" id="gap'+n+'">'}
function sel(n,t,letters){return '<div class="row" id="q'+n+'"><span class="qnum">'+n+'</span><span class="txt">'+t+'</span><select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select></div>'}
function selInline(n,letters){return '<select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select>'}
function mcq(n,t,opts){return '<div class="mcq" id="q'+n+'"><div class="prompt"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="choice-options">'+opts.map((o,i)=>'<label class="choice-option"><input type="radio" name="q'+n+'" value="'+'ABCD'[i]+'"> <b>'+'ABCD'[i]+'</b> '+o+'</label>').join('')+'</div></div>'}
var multiGroups={}, groupQNums={};
function multiSel(qA,qB,promptText,options){var name='g'+qA+'_'+qB;multiGroups[qA]=name;multiGroups[qB]=name;groupQNums[name]=[qA,qB];return '<div id="q_'+name+'" class="tf-row"><div class="statement"><span class="qnum">'+qA+', '+qB+'</span><span>'+promptText+'</span></div><div class="options">'+options.map(o=>'<label><input type="checkbox" name="'+name+'" value="'+o.letter+'"> <b>'+o.letter+'</b> '+o.text+'</label>').join('')+'</div></div>'}

function qhtml(p){
return '<div class="qgroup"><h3>Questions 1-5</h3><p><i>Complete the flow chart below. Choose <b>NO MORE THAN TWO WORDS</b> from the passage for each answer.</i></p><div style="border:1px solid #ccc;border-radius:5px;padding:20px;background:#fafafa;"><p class="centered-title">BUILDING THE WINDMILL</p><div style="text-align:center;line-height:2.2;"><p>William learned some '+gap(1)+' from a library book.</p><p style="font-size:22px;margin:0;">&#8595;</p><p>First, he built a '+gap(2)+' of the windmill.</p><p style="font-size:22px;margin:0;">&#8595;</p><p>Then he collected materials from '+gap(3)+' with a relative.</p><p style="font-size:22px;margin:0;">&#8595;</p><p>He made the windmill blades from pieces of '+gap(4)+'.</p><p style="font-size:22px;margin:0;">&#8595;</p><p>He fixed the blades to a '+gap(5)+' and then to part of a bicycle.</p><p style="font-size:22px;margin:0;">&#8595;</p><p>He raised the blades on a tower.</p></div></div></div><div class="qgroup"><h3>Questions 6-10</h3><p><i>Do the following statements agree with the information given in Reading Passage 1? Write <b>TRUE / FALSE / NOT GIVEN</b>.</i></p>'+tf(6,'William used the electricity he created for village transport.')+tf(7,'At first, William’s achievement was ignored by local people.')+tf(8,'Journalists from other countries visited William’s farm.')+tf(9,'William used money he received to improve water supplies in his village.')+tf(10,'The health of the villagers has improved since the windmill was built.')+'</div><div class="qgroup"><h3>Questions 11-13</h3><p><i>Answer the questions below. Use <b>NO MORE THAN ONE WORD and/or A NUMBER</b> from the passage for each answer.</i></p><p class="summary-text"><span class="qnum">11</span>How tall was the final tower that William built? '+gap(11)+'</p><p class="summary-text"><span class="qnum">12</span>What did the villagers use for fuel before the windmill was built? '+gap(12)+'</p><p class="summary-text"><span class="qnum">13</span>What school subject has become more popular in William’s village? '+gap(13)+'</p></div>';
}

function render(){partTitle.textContent='Reading Passage 1';var r=ranges[active];partSub.textContent='Read the text and answer questions '+r[0]+'-'+r[1]+'.';left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();drawFooter();left.scrollTop=right.scrollTop=0}
function val(n){if(multiGroups[n]){var boxes=document.querySelectorAll('input[name="'+multiGroups[n]+'"]:checked');return Array.from(boxes).map(b=>b.value).join(',')}var g=document.getElementById('gap'+n);if(g)return g.value;var s=document.getElementById('sel'+n);if(s)return s.value;var r=document.querySelector('input[name="q'+n+'"]:checked');return r?r.value:''}
function save(){for(var n=1;n<=40;n++){var v=val(n);if(v)state[n]=v}}
function restore(){for(var n=1;n<=40;n++){if(!state[n])continue;if(multiGroups[n]){var vals=state[n].split(',');vals.forEach(function(v){var cb=document.querySelector('input[name="'+multiGroups[n]+'"][value="'+v+'"]');if(cb)cb.checked=true});continue}var g=document.getElementById('gap'+n);if(g)g.value=state[n];var s=document.getElementById('sel'+n);if(s)s.value=state[n];var r=document.querySelector('input[name="q'+n+'"][value="'+state[n]+'"]');if(r)r.checked=true}}
function answered(n){return !!state[n]||!!val(n)}
function count(p){var r=ranges[p],c=0;for(var i=r[0];i<=r[1];i++)if(answered(i))c++;return c}
function drawFooter(){save();var h='';[1].forEach(p=>{var r=ranges[p];h+='<div class="partnav"><button class="partlabel" data-part="'+p+'" disabled>Reading Passage 1</button>';if(p===active){h+='<div class="tiles">';for(var n=r[0];n<=r[1];n++)h+='<button class="tile '+(answered(n)?'answered':'')+'" data-q="'+n+'">'+n+'</button>';h+='</div>'}else h+='<span class="count">'+count(p)+' of '+(r[1]-r[0]+1)+'</span>';h+='</div>'});h+='<button class="review" id="review">OK</button>';footer.innerHTML=h}
document.addEventListener('change',()=>{save();drawFooter()});document.addEventListener('input',()=>{save();drawFooter()});
var lastScore=null;
function renderActive(){left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();if(graded){regradeCurrent();right.insertAdjacentHTML('afterbegin','<div class="score">Your score: <b>'+lastScore+' / 13</b></div><p style="margin:-8px 0 18px;color:#555">Explanations with the exact location in the passage are shown below each answer.</p>')}drawFooter();left.scrollTop=right.scrollTop=0}
footer.onclick=e=>{var p=e.target.closest('[data-part]');if(p){save();active=+p.dataset.part;renderActive();return}var q=e.target.closest('[data-q]');if(q){var n=+q.dataset.q;(document.getElementById('q'+n)||document.getElementById('gap'+n)||document.getElementById('sel'+n))?.scrollIntoView({behavior:'smooth',block:'center'});return}if(e.target.closest('#review'))review()};
function review(){save();var a=0;for(var n=1;n<=13;n++)if(answered(n))a++;subwrap.innerHTML='<p>You have answered <b>'+a+'</b> of 13 questions.</p><p><button class="ovrow submit" id="final">Submit test</button></p>';final.onclick=grade;submit.classList.add('show')}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function correct(n,v){if(multiGroups[n]){var parts=(v||'').split(',').map(norm).filter(Boolean);return parts.includes(norm(answers[n]))}return [answers[n]].concat(alt[n]||[]).some(a=>norm(a)===norm(v))}
function explHTML(n){var e=EXPL[n];if(!e)return '';return '<div class="expl"><b>Q'+n+' — correct answer: '+answers[n]+'</b> &nbsp;<span class="expl-loc">('+e.loc+')</span><br>'+e.text+'</div>'}
function markGap(n){var x=document.getElementById('gap'+n);if(!x)return;var ok=correct(n,x.value);x.disabled=true;x.classList.add(ok?'ok':'no');x.insertAdjacentHTML('afterend',(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>')+explHTML(n));return ok}
function markSel(n){var s=document.getElementById('sel'+n);if(!s)return;var ok=correct(n,s.value);s.disabled=true;s.classList.add(ok?'ok':'no');var row=document.getElementById('q'+n);var tag=(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>');if(row){row.insertAdjacentHTML('beforeend',tag);row.insertAdjacentHTML('afterend',explHTML(n))}else{s.insertAdjacentHTML('afterend',tag);var host=s.closest('p')||s;host.insertAdjacentHTML('afterend',explHTML(n))}return ok}
function markRadio(n){var r=document.querySelector('input[name="q'+n+'"]:checked');var ok=r&&correct(n,r.value);document.querySelectorAll('input[name="q'+n+'"]').forEach(i=>i.disabled=true);var box=document.getElementById('q'+n);box.insertAdjacentHTML('beforeend',(ok?'<span class="tag ok">\u2713</span>':'<span class="tag no">\u2718 correct: '+answers[n]+'</span>'));box.insertAdjacentHTML('afterend',explHTML(n));return ok}
function markMulti(group){var qNums=groupQNums[group];var boxes=document.querySelectorAll('input[name="'+group+'"]');var checkedVals=Array.from(boxes).filter(function(b){return b.checked}).map(function(b){return b.value});boxes.forEach(function(b){b.disabled=true});var container=document.getElementById('q_'+group);var tagHtml='';qNums.forEach(function(qn){var ok=checkedVals.includes(answers[qn]);tagHtml+=' '+(ok?'<span class="tag ok">Q'+qn+' \u2713</span>':'<span class="tag no">Q'+qn+' \u2718 correct: '+answers[qn]+'</span>')});container.insertAdjacentHTML('beforeend','<div style="margin-top:8px;">'+tagHtml+'</div>');var explAll='';qNums.forEach(function(qn){explAll+=explHTML(qn)});container.insertAdjacentHTML('afterend',explAll)}
function regradeCurrent(){var r=ranges[active];var doneGroups={};for(var n=r[0];n<=r[1];n++){if(multiGroups[n]){if(!doneGroups[multiGroups[n]]){markMulti(multiGroups[n]);doneGroups[multiGroups[n]]=true}continue}var g=document.getElementById('gap'+n),s=document.getElementById('sel'+n),rad=document.querySelector('input[name="q'+n+'"]');if(g)markGap(n);else if(s)markSel(n);else if(rad)markRadio(n)}}
function grade(){if(graded)return;save();var score=0;for(var n=1;n<=13;n++)if(correct(n,state[n]||''))score++;lastScore=score;graded=true;active=1;renderActive();submit.classList.remove('show')}
var drag=false;div.onmousedown=()=>{drag=true;document.body.style.userSelect='none'};window.onmouseup=()=>{drag=false;document.body.style.userSelect=''};window.onmousemove=e=>{if(!drag)return;var r=split.getBoundingClientRect();left.style.width=Math.max(220,Math.min(r.width-240,e.clientX-r.left))+'px'};
split.onmouseup=()=>setTimeout(()=>{var s=getSelection();if(!s||s.isCollapsed||!s.rangeCount){tools.style.display='none';return}var rg=s.getRangeAt(0);if(!split.contains(rg.commonAncestorContainer)){tools.style.display='none';return}var rc=rg.getBoundingClientRect();tools.style.display='flex';tools.style.left=(rc.left+scrollX)+'px';tools.style.top=Math.max(8,rc.top+scrollY-42)+'px'},1);
tools.onclick=e=>{var b=e.target.closest('button'),s=getSelection();if(!b||!s.rangeCount)return;var rg=s.getRangeAt(0);if(b.dataset.act==='hl'){try{var sp=document.createElement('span');sp.className='hl';rg.surroundContents(sp)}catch(_){document.execCommand('hiliteColor',false,'#ffe45c')}}else document.querySelectorAll('.hl').forEach(h=>h.replaceWith(document.createTextNode(h.textContent)));s.removeAllRanges();tools.style.display='none'};
render();
// ---- Bridge added for the mock exam orchestrator ----
window.__mockForceGrade = grade;
window.__mockGetResult = function () {
  if (!graded) return null;
  var answersOut = {}, key = {};
  for (var n = 1; n <= 13; n++) {
    answersOut[n] = state[n] || '';
    key[n] = DATA.answers[n];
  }
  return { score: lastScore, total: 13, answers: answersOut, key: key };
};
})();
</script></body></html>
