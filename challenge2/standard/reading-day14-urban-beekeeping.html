t:inherit;border:1px solid #999;border-radius:4px;background:#fff;padding:5px 8px;width:175px;text-align:center;margin:0 5px}.notes{font-size:17px;line-height:1.75}.note-row{margin:10px 0}.box{background:#f2f3f4;border:1px solid #ddd;border-radius:6px;padding:14px 18px;line-height:1.7;font-size:17px;margin:14px 0}.row{display:flex;gap:12px;align-items:flex-start;margin:16px 0}.txt{flex:1;font-size:17px;line-height:1.45}.select{font:inherit;border:1px solid #cfcfcf;border-radius:7px;background:#f7f8f9;padding:8px 28px 8px 14px;min-width:86px}.tools{position:absolute;z-index:50;display:none;background:#222;border-radius:6px;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.2)}.tools button{background:none;border:0;color:#fff;padding:6px 10px;font:inherit}.hl{background:#ffe45c}.bar{height:59px;border-top:1px solid #ddd;display:flex;align-items:center;gap:28px;padding:8px 18px;background:#fff;overflow-x:auto}.partnav{display:flex;align-items:center;gap:8px;white-space:nowrap}.partlabel{font-weight:700;border:0;background:#fff;font:inherit;cursor:pointer}.count{color:#555;font-size:14px}.tiles{display:flex;gap:4px}.tile{min-width:32px;height:32px;border:1px solid #bbb;background:#fff;border-radius:2px;cursor:pointer}.tile.answered{background:#2b2b2b;color:#fff}.review{margin-left:auto;min-width:42px;height:34px;background:#ddd;border:0;border-radius:4px;font-weight:700}.overlay{position:fixed;inset:0;background:white;z-index:100;display:none;flex-direction:column;overflow:auto}.overlay.show{display:flex}.ovh{position:relative;padding:22px}.ovh h2{text-align:center;margin:0}.close{position:absolute;right:24px;top:18px;border:0;background:none;font-size:26px}.ovlist{max-width:880px;width:90%;margin:10px auto}.ovrow{width:100%;padding:18px 22px;border:1px solid #ddd;background:white;font:inherit;text-align:left}.submit{background:#cf3e45;color:white;border-color:#cf3e45;border-radius:6px;margin-bottom:18px;font-weight:700}.score{background:#f2f3f4;border:1px solid #ddd;border- </style></head><body><header class="top"><button>|||</button><button>o</button><button>=</button></header><div class="banner"><h2 id="partTitle"></h2><p id="partSub"></p></div><div class="split" id="split"><section class="pane left" id="left"></section><div class="divider" id="div"></div><section class="pane right" id="right"></section></div><footer class="bar" id="footer"></footer><div class="tools" id="tools"><button data-act="hl">Highlight</button><button data-act="clear">Clear</button></div><div class="overlay" id="submit"><div class="ovh"><h2>Submission page</h2><button class="close" onclick="submit.classList.remove('show')">x</button></div><div class="ovlist" id="subwrap"></div></div><script>
(function(){
var active=1,graded=false,revealed=false,state={},ranges={1:[1,10]};
var DATA = {"passages": {"1": "<h1>Urban Beekeeping: A Buzz in the City</h1><p class=\"sub\">Why more city dwellers are choosing to keep bees on rooftops and in gardens.</p><div class=\"para\">A</div><p>For most of the twentieth century, beekeeping was seen as an activity for people living in the countryside, where bees could fly freely between orchards, meadows and fields of flowering crops. Over the last two decades, however, a very different picture has emerged. In cities such as London, New York, Paris and Tokyo, thousands of hobbyists and small businesses now keep beehives on rooftops, balconies, and in community gardens, producing honey just a few floors above busy streets.</p><div class=\"para\">B</div><p>One reason for this shift is that cities, somewhat surprisingly, can offer bees a wider variety of food than intensively farmed countryside. Modern farmland is often planted with a single crop across huge areas, which flowers for only a few weeks each year and offers bees little to eat for the rest of the season. Parks, gardens and even roadside verges in cities, by contrast, contain many different types of flowering plants that bloom at different times, providing a more constant and varied source of nectar and pollen throughout spring and summer.</p><div class=\"para\">C</div><p>Urban beekeeping is also credited with raising public awareness of the difficulties that bee populations face worldwide, including disease, loss of habitat, and the effects of certain pesticides. Community projects that place hives on the roofs of schools, libraries, and hotels often include educational programmes, allowing local residents and children to observe the bees at close range and learn about their vital role in pollinating the plants that produce roughly a third of the food humans eat.</p><div class=\"para\">D</div><p>Nevertheless, some scientists have expressed concern that urban beekeeping, if it grows too quickly, could actually harm rather than help local bee populations. Honeybees kept by beekeepers compete for nectar and pollen with wild bee species, many of which are already under greater pressure than honeybees and are less able to travel far to find food. In cities with a very high density of hives, researchers have observed reduced food available for these wild pollinators, some of which play an equally important, if less visible, role in the ecosystem.</p><div class=\"para\">E</div><p>For this reason, several city governments have begun to regulate urban beekeeping, requiring hobbyists to register their hives, limiting the number of hives allowed per building, and encouraging beekeepers to plant bee-friendly flowers nearby to increase the overall food supply. Advocates argue that, managed carefully, city beekeeping can continue to educate the public and produce excellent honey without placing unsustainable pressure on wild bee species.</p>"}, "answers": {"1": "B", "2": "C", "3": "B", "4": "B", "5": "B", "6": "E", "7": "D", "8": "flowering plants", "9": "food", "10": "wild bees"}, "alt": {"10": ["wild bee species", "wild pollinators"]}, "expl": {"1": {"loc": "Para A", "text": "'beekeeping was seen as an activity for people living in the countryside' → B."}, "2": {"loc": "Para B", "text": "'Modern farmland is often planted with a single crop... which flowers for only a few weeks' → C."}, "3": {"loc": "Para C", "text": "Hives on schools/libraries include 'educational programmes' → B."}, "4": {"loc": "Para D", "text": "'Honeybees kept by beekeepers compete for nectar and pollen with wild bee species' → B."}, "5": {"loc": "Para B", "text": "The variety of city flowers feeding bees for longer is described in paragraph B."}, "6": {"loc": "Para E", "text": "City governments regulating hive numbers is described in paragraph E."}, "7": {"loc": "Para D", "text": "Competition between managed and wild bees is described in paragraph D."}, "8": {"loc": "Para B", "text": "'many different types of flowering plants' → flowering plants."}, "9": {"loc": "Para C", "text": "'roughly a third of the food humans eat' → food."}, "10": {"loc": "Para D", "text": "'compete... with wild bee species' → wild bees."}}};

var passages=DATA.passages, answers=DATA.answers, alt=DATA.alt, EXPL=DATA.expl;
function tf(n,t,yn){var opts=yn?['YES','NO','NOT GIVEN']:['TRUE','FALSE','NOT GIVEN'];return '<div class="tf-row" id="q'+n+'"><div class="statement"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="options">'+opts.map(o=>'<label><input type="radio" name="q'+n+'" value="'+o+'"> '+o+'</label>').join('')+'</div></div>'}
function gap(n){return '<span class="qnum">'+n+'</span><input class="gap" id="gap'+n+'">'}
function sel(n,t,letters){return '<div class="row" id="q'+n+'"><span class="qnum">'+n+'</span><span class="txt">'+t+'</span><select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select></div>'}
function selInline(n,letters){return '<select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select>'}
function mcq(n,t,opts){return '<div class="mcq" id="q'+n+'"><div class="prompt"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="choice-options">'+opts.map((o,i)=>'<label class="choice-option"><input type="radio" name="q'+n+'" value="'+'ABCD'[i]+'"> <b>'+'ABCD'[i]+'</b> '+o+'</label>').join('')+'</div></div>'}
var multiGroups={}, groupQNums={};
function multiSel(qA,qB,promptText,options){var name='g'+qA+'_'+qB;multiGroups[qA]=name;multiGroups[qB]=name;groupQNums[name]=[qA,qB];return '<div id="q_'+name+'" class="tf-row"><div class="statement"><span class="qnum">'+qA+', '+qB+'</span><span>'+promptText+'</span></div><div class="options">'+options.map(o=>'<label><input type="checkbox" name="'+name+'" value="'+o.letter+'"> <b>'+o.letter+'</b> '+o.text+'</label>').join('')+'</div></div>'}

function qhtml(p){
return "<div class=\"qgroup\"><h3>Questions 1-4</h3><p><i>Choose the correct letter, A, B, C or D.</i></p>"+mcq(1,"According to the passage, traditional beekeeping was mainly associated with:",["large cities", "the countryside", "university research", "seaside towns"])+mcq(2,"Why can cities sometimes provide bees with better feeding conditions than farmland?",["Cities have fewer pesticides than farmland.", "City parks are usually larger than farms.", "Farmland is often planted with a single crop that flowers briefly.", "Farmland has no flowering plants at all."])+mcq(3,"What is one benefit of placing hives on schools and libraries, according to the passage?",["It reduces the cost of honey production.", "It helps educate the public about bees.", "It increases the number of wild bee species.", "It prevents the use of pesticides nearby."])+mcq(4,"What concern do some scientists have about urban beekeeping?",["Honeybees kept in cities produce less honey than those in the countryside.", "Too many hives can create competition for food with wild bees.", "City bees are more likely to carry disease.", "Urban honey is less safe to eat than rural honey."])+"</div><div class=\"qgroup\"><h3>Questions 5-7</h3><p><i>The passage has five paragraphs, A–E. Which paragraph contains the following information?</i></p><p><b><i>NB</i></b> <i>You may use any letter more than once.</i></p>"+sel(5,"A description of how city plants provide food for bees over a longer period than farm crops.",["A", "B", "C", "D", "E"])+sel(6,"A mention of official rules introduced to control the number of hives in a city.",["A", "B", "C", "D", "E"])+sel(7,"Reference to the competition between managed bees and wild bee species.",["A", "B", "C", "D", "E"])+"</div><div class=\"qgroup\"><h3>Questions 8-10</h3><p><i>Complete the summary below. Choose </i><b>NO MORE THAN TWO WORDS</b><i> from the passage for each answer.</i></p><div class=\"box\">Beekeeping was once considered a rural activity, but it has become increasingly common in cities. One advantage of city locations is that they offer bees a wider range of "+gap(8)+" than farmland, which is often covered with a single crop. Urban hives also help teach the public about the importance of bees, since pollination affects about a third of the "+gap(9)+" people eat. However, some experts worry that too many hives may reduce the food available to "+gap(10)+" in the area.</div></div>";
}

function render(){partTitle.textContent='Reading Passage';var r=ranges[active];partSub.textContent='Read the text and answer questions '+r[0]+'-'+r[1]+'.';left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();drawFooter();left.scrollTop=right.scrollTop=0}
function val(n){if(multiGroups[n]){var boxes=document.querySelectorAll('input[name="'+multiGroups[n]+'"]:checked');return Array.from(boxes).map(b=>b.value).join(',')}var g=document.getElementById('gap'+n);if(g)return g.value;var s=document.getElementById('sel'+n);if(s)return s.value;var r=document.querySelector('input[name="q'+n+'"]:checked');return r?r.value:''}
function save(){for(var n=1;n<=40;n++){var v=val(n);if(v)state[n]=v}}
function restore(){for(var n=1;n<=40;n++){if(!state[n])continue;if(multiGroups[n]){var vals=state[n].split(',');vals.forEach(function(v){var cb=document.querySelector('input[name="'+multiGroups[n]+'"][value="'+v+'"]');if(cb)cb.checked=true});continue}var g=document.getElementById('gap'+n);if(g)g.value=state[n];var s=document.getElementById('sel'+n);if(s)s.value=state[n];var r=document.querySelector('input[name="q'+n+'"][value="'+state[n]+'"]');if(r)r.checked=true}}
function answered(n){return !!state[n]||!!val(n)}
function count(p){var r=ranges[p],c=0;for(var i=r[0];i<=r[1];i++)if(answered(i))c++;return c}
function drawFooter(){save();var h='';[1].forEach(p=>{var r=ranges[p];h+='<div class="partnav"><button class="partlabel" data-part="'+p+'" disabled>Reading Passage</button>';if(p===active){h+='<div class="tiles">';for(var n=r[0];n<=r[1];n++)h+='<button class="tile '+(answered(n)?'answered':'')+'" data-q="'+n+'">'+n+'</button>';h+='</div>'}else h+='<span class="count">'+count(p)+' of '+(r[1]-r[0]+1)+'</span>';h+='</div>'});h+='<button class="review" id="review">OK</button>';footer.innerHTML=h}
document.addEventListener('change',()=>{save();drawFooter();checkAutoGrade();sendProgress();});document.addEventListener('input',()=>{save();drawFooter();sendProgress();});function checkAutoGrade(){if(graded)return;var r=ranges[1];for(var n=r[0];n<=r[1];n++)if(!answered(n))return;silentGrade();}function sendProgress(){if(graded)return;try{var r=ranges[1];var items=[];for(var n=r[0];n<=r[1];n++)items.push({n:n,value:state[n]||''});parent.postMessage({type:'cdi-reading-progress',items:items},'*');}catch(e){}}
var lastScore=null;
function renderActive(){left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();if(revealed){regradeCurrent();right.insertAdjacentHTML('afterbegin','<div class="score">Your score: <b>'+lastScore+' / 10</b></div><p style="margin:-8px 0 18px;color:#555">Explanations with the exact location in the passage are shown below each answer.</p>')}drawFooter();left.scrollTop=right.scrollTop=0}
footer.onclick=e=>{var p=e.target.closest('[data-part]');if(p){save();active=+p.dataset.part;renderActive();return}var q=e.target.closest('[data-q]');if(q){var n=+q.dataset.q;(document.getElementById('q'+n)||document.getElementById('gap'+n)||document.getElementById('sel'+n))?.scrollIntoView({behavior:'smooth',block:'center'});return}if(e.target.closest('#review'))review()};
function review(){save();var r=ranges[1];var a=0;for(var n=r[0];n<=r[1];n++)if(answered(n))a++;subwrap.innerHTML='<p>You have answered <b>'+a+'</b> of 10 questions.</p><p><button class="ovrow submit" id="final">Submit test</button></p>';final.onclick=grade;submit.classList.add('show')}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function correct(n,v){if(multiGroups[n]){var parts=(v||'').split(',').map(norm).filter(Boolean);return parts.includes(norm(answers[n]))}return [answers[n]].concat(alt[n]||[]).some(a=>norm(a)===norm(v))}
function explHTML(n){var e=EXPL[n];if(!e)return '';return '<div class="expl"><b>Q'+n+' — correct answer: '+answers[n]+'</b> &nbsp;<span class="expl-loc">('+e.loc+')</span><br>'+e.text+'</div>'}
function markGap(n){var x=document.getElementById('gap'+n);if(!x)return;var ok=correct(n,x.value);x.disabled=true;x.classList.add(ok?'ok':'no');x.insertAdjacentHTML('afterend',(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>')+explHTML(n));return ok}
function markSel(n){var s=document.getElementById('sel'+n);if(!s)return;var ok=correct(n,s.value);s.disabled=true;s.classList.add(ok?'ok':'no');var row=document.getElementById('q'+n);var tag=(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>');if(row){row.insertAdjacentHTML('beforeend',tag);row.insertAdjacentHTML('afterend',explHTML(n))}else{s.insertAdjacentHTML('afterend',tag);var host=s.closest('p')||s;host.insertAdjacentHTML('afterend',explHTML(n))}return ok}
function markRadio(n){var r=document.querySelector('input[name="q'+n+'"]:checked');var ok=r&&correct(n,r.value);document.querySelectorAll('input[name="q'+n+'"]').forEach(i=>i.disabled=true);var box=document.getElementById('q'+n);box.insertAdjacentHTML('beforeend',(ok?'<span class="tag ok">\u2713</span>':'<span class="tag no">\u2718 correct: '+answers[n]+'</span>'));box.insertAdjacentHTML('afterend',explHTML(n));return ok}
function markMulti(group){var qNums=groupQNums[group];var boxes=document.querySelectorAll('input[name="'+group+'"]');var checkedVals=Array.from(boxes).filter(function(b){return b.checked}).map(function(b){return b.value});boxes.forEach(function(b){b.disabled=true});var container=document.getElementById('q_'+group);var tagHtml='';qNums.forEach(function(qn){var ok=checkedVals.includes(answers[qn]);tagHtml+=' '+(ok?'<span class="tag ok">Q'+qn+' \u2713</span>':'<span class="tag no">Q'+qn+' \u2718 correct: '+answers[qn]+'</span>')});container.insertAdjacentHTML('beforeend','<div style="margin-top:8px;">'+tagHtml+'</div>');var explAll='';qNums.forEach(function(qn){explAll+=explHTML(qn)});container.insertAdjacentHTML('afterend',explAll)}
function regradeCurrent(){var r=ranges[active];var doneGroups={};for(var n=r[0];n<=r[1];n++){if(multiGroups[n]){if(!doneGroups[multiGroups[n]]){markMulti(multiGroups[n]);doneGroups[multiGroups[n]]=true}continue}var g=document.getElementById('gap'+n),s=document.getElementById('sel'+n),rad=document.querySelector('input[name="q'+n+'"]');if(g)markGap(n);else if(s)markSel(n);else if(rad)markRadio(n)}}
function silentGrade(){if(graded)return;save();var r=ranges[1];var score=0;for(var n=r[0];n<=r[1];n++)if(correct(n,state[n]||''))score++;lastScore=score;graded=true;try{parent.postMessage({type:'cdi-reading-result',score:lastScore,max:(r[1]-r[0]+1),items:(function(){var arr=[];for(var n=r[0];n<=r[1];n++)arr.push({n:n,value:state[n]||'',correct:correct(n,state[n]||'')});return arr;})()},'*');}catch(e){}}
function grade(){silentGrade();revealed=true;active=1;renderActive();submit.classList.remove('show')}
var drag=false;div.onmousedown=()=>{drag=true;document.body.style.userSelect='none'};window.onmouseup=()=>{drag=false;document.body.style.userSelect=''};window.onmousemove=e=>{if(!drag)return;var r=split.getBoundingClientRect();left.style.width=Math.max(220,Math.min(r.width-240,e.clientX-r.left))+'px'};
split.onmouseup=()=>setTimeout(()=>{var s=getSelection();if(!s||s.isCollapsed||!s.rangeCount){tools.style.display='none';return}var rg=s.getRangeAt(0);if(!split.contains(rg.commonAncestorContainer)){tools.style.display='none';return}var rc=rg.getBoundingClientRect();tools.style.display='flex';tools.style.left=(rc.left+scrollX)+'px';tools.style.top=Math.max(8,rc.top+scrollY-42)+'px'},1);
tools.onclick=e=>{var b=e.target.closest('button'),s=getSelection();if(!b||!s.rangeCount)return;var rg=s.getRangeAt(0);if(b.dataset.act==='hl'){try{var sp=document.createElement('span');sp.className='hl';rg.surroundContents(sp)}catch(_){document.execCommand('hiliteColor',false,'#ffe45c')}}else document.querySelectorAll('.hl').forEach(h=>h.replaceWith(document.createTextNode(h.textContent)));s.removeAllRanges();tools.style.display='none'};
render();
window.addEventListener('message',function(event){var d=event.data;if(!d||d.type!=='cdi-reading-restore')return;(d.items||[]).forEach(function(item){if(item.value)state[item.n]=item.value;});restore();drawFooter();});
})();
</script></body></html>
