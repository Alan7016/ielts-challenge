</style></head><body><header class="top"><button>|||</button><button>o</button><button>=</button></header><div class="banner"><h2 id="partTitle"></h2><p id="partSub"></p></div><div class="split" id="split"><section class="pane left" id="left"></section><div class="divider" id="div"></div><section class="pane right" id="right"></section></div><footer class="bar" id="footer"></footer><div class="tools" id="tools"><button data-act="hl">Highlight</button><button data-act="clear">Clear</button></div><div class="overlay" id="submit"><div class="ovh"><h2>Submission page</h2><button class="close" onclick="submit.classList.remove('show')">x</button></div><div class="ovlist" id="subwrap"></div></div><script>
(function(){
var active=1,graded=false,revealed=false,state={},ranges={1:[1,14]};
var DATA = {"passages": {"1": "<h1>Examining the Placebo Effect</h1>\n<p class=\"sub\">by Steve Silberman</p>\n<p>The fact that taking a fake drug can powerfully improve some people's health—the so-called placebo effect—was long considered an embarrassment to the serious practice of pharmacology, but now things have changed.</p>\n<p>Several years ago, Merck, a global pharmaceutical company, was falling behind its rivals in sales. To make matters worse, patents on five blockbuster drugs were about to expire, which would allow cheaper generic products to flood the market. In interviews with the press, Edward Scolnick, Merck's Research Director, presented his plan to restore the firm to pre-eminence. Key to his strategy was expanding the company's reach into the anti-depressant market, where Merck had trailed behind, while competitors like Pfizer and GlaxoSmithKline had created some of the best-selling drugs in the world. 'To remain dominant in the future,' he told one media company, 'we need to dominate the central nervous system.'</p>\n<p>His plan hinged on the success of an experimental anti-depressant codenamed MK-869. Still in clinical trials, it was a new kind of medication that exploited brain chemistry in innovative ways to promote feelings of well-being. The drug tested extremely well early on, with minimal side effects. Behind the scenes, however, MK-869 was starting to unravel. True, many test subjects treated with the medication felt their hopelessness and anxiety lift. But so did nearly the same number who took a placebo, a look-alike pill made of milk sugar or another inert substance given to groups of volunteers in subsequent clinical trials to gauge the effectiveness of the real drug by comparison. Ultimately, Merck's venture into the anti-depressant market failed. In the jargon of the industry, the trials crossed the 'futility boundary.'</p>\n<p>MK-869 has not been the only much-awaited medical breakthrough to be undone in recent years by the placebo effect. And it's not only trials of new drugs that are crossing the futility boundary. Some products that have been on the market for decades are faltering in more recent follow-up tests. It's not that the old medications are getting weaker, drug developers say. It's as if the placebo effect is somehow getting stronger. The fact that an increasing number of medications are unable to beat sugar pills has thrown the industry into crisis. The stakes could hardly be higher. To win FDA* approval, a new medication must beat placebo in at least two authenticated trials. In today's economy, the fate of a well-established company can hang on the outcome of a handful of tests.</p>\n<p>Why are fake pills suddenly overwhelming promising new drugs and established medicines alike? The reasons are only just beginning to be understood. A network of independent researchers is doggedly uncovering the inner workings and potential applications of the placebo effect.</p>\n<p>A psychiatrist, William Potter, who knew that some patients really do seem to get healthier for reasons that have more to do with a doctor's empathy than with the contents of a pill, was baffled by the fact that drugs he had been prescribing for years seemed to be struggling to prove their effectiveness. Thinking that a crucial factor may have been overlooked, Potter combed through his company's database of published and unpublished trials—including those that had been kept secret because of high placebo response. His team aggregated the findings from decades of anti-depressant trials, looking for patterns and trying to see what was changing over time. What they found challenged some of the industry's basic assumptions about its drug-vetting process.</p>\n<p>Assumption number one was that if a trial were managed correctly, a medication would perform as well or badly in a Phoenix hospital as in a Bangalore clinic. Potter discovered, however, that geographic location alone could determine the outcome. By the late 1990s, for example, the anti-anxiety drug Diazepam was still beating placebo in France and Belgium. But when the drug was tested in the U.S., it was likely to fail. Conversely, a similar drug, Prozac, performed better in America than it did in western Europe and South Africa. It was an unsettling prospect: FDA approval could hinge on where the company chose to conduct a trial.</p>\n<p>Mistaken assumption number two was that the standard tests used to gauge volunteers' improvement in trials yielded consistent results. Potter and his colleagues discovered that ratings by trial observers varied significantly from one testing site to another. It was like finding out that the judges in a tight race each had a different idea about the placement of the finish line.</p>\n<p>After some coercion by Potter and others, the National Institute of Health (NIH) focused on the issue in 2000, hosting a three-day conference in Washington, and this conference launched a new wave of placebo research in academic laboratories in the U.S. and Italy that would make significant progress toward solving the mystery of what was happening in clinical trials.</p>\n<p>In one study last year, Harvard Medical School researcher Ted Kaptchuk devised a clever strategy for testing his volunteers' response to varying levels of therapeutic ritual. The study focused on a common but painful medical condition that costs more than $40 billion a year worldwide to treat. First, the volunteers were placed randomly in one of three groups. One group was simply put on a waiting list; researchers know that some patients get better just because they sign up for a trial. Another group received placebo treatment from a clinician who declined to engage in small talk. Volunteers in the third group got the same fake treatment from a clinician who asked them questions about symptoms, outlined the causes of the illness, and displayed optimism about their condition.</p>\n<p>Not surprisingly, the health of those in the third group improved most. In fact, just by participating in the trial, volunteers in this high-interaction group got as much relief as did people taking the two leading prescription drugs for the condition. And the benefits of their 'bogus' treatment persisted for weeks afterward, contrary to the belief—widespread in the pharmaceutical industry—that the placebo response is short-lived.</p>\n<p>Studies like this open the door to hybrid treatment strategies that exploit the placebo effect to make real drugs safer and more effective. As Potter says, 'To really do the best for your patients, you want the best placebo response plus the best drug response.'</p>\n<p style=\"font-size:14px;color:#555;\">Adapted from Wired Magazine<br>* The Food and Drugs Administration (an agency in the United States responsible for protecting public health by assuring the safety of human drugs)</p>"}, "answers": {"1": "NO", "2": "YES", "3": "NOT GIVEN", "4": "YES", "5": "NO", "6": "H", "7": "A", "8": "C", "9": "G", "10": "E", "11": "C", "12": "B", "13": "C", "14": "A"}, "alt": {}, "expl": {"1": {"loc": "Para 4", "text": "'MK-869 has not been the only much-awaited medical breakthrough to be undone in recent years by the placebo effect' → NO."}, "2": {"loc": "Para 4", "text": "'In today's economy, the fate of a well-established company can hang on the outcome of a handful of tests' → YES."}, "3": {"loc": "Whole passage", "text": "No comparison is made between different medical conditions' responsiveness to placebo → NOT GIVEN."}, "4": {"loc": "Para 11", "text": "'Not surprisingly, the health of those in the third group improved most' → YES."}, "5": {"loc": "Final two paragraphs", "text": "'Studies like this open the door to hybrid treatment strategies that exploit the placebo effect to make real drugs safer and more effective' — the opposite of avoiding combination → NO."}, "6": {"loc": "Para 2", "text": "Merck 'was falling behind its rivals' while competitors like Pfizer and GlaxoSmithKline led the market → 'competition' (H)."}, "7": {"loc": "Para 2", "text": "'expanding the company's reach into the anti-depressant market' → 'activity' (A)."}, "8": {"loc": "Para 3", "text": "'The drug tested extremely well early on, with minimal side effects' → 'success' (C)."}, "9": {"loc": "Para 3", "text": "'many test subjects treated with the medication felt their hopelessness and anxiety lift' → 'symptoms' (G)."}, "10": {"loc": "Para 3", "text": "'the trials crossed the ‘futility boundary’' → 'tests' (E)."}, "11": {"loc": "Para 6", "text": "'Potter combed through his company's database of published and unpublished trials—including those that had been kept secret' → C."}, "12": {"loc": "Para 7", "text": "'geographic location alone could determine the outcome... Diazepam was still beating placebo in France and Belgium. But when tested in the U.S., it was likely to fail' → B."}, "13": {"loc": "Para 8", "text": "'ratings by trial observers varied significantly from one testing site to another. It was like finding out that the judges in a tight race each had a different idea about the placement of the finish line' → C."}, "14": {"loc": "Para 12", "text": "'the benefits of their ‘bogus’ treatment persisted for weeks afterward, contrary to the belief... that the placebo response is short-lived' → A."}}};
var passages=DATA.passages, answers=DATA.answers, alt=DATA.alt, EXPL=DATA.expl;
function tf(n,t,yn){var opts=yn?['YES','NO','NOT GIVEN']:['TRUE','FALSE','NOT GIVEN'];return '<div class="tf-row" id="q'+n+'"><div class="statement"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="options">'+opts.map(o=>'<label><input type="radio" name="q'+n+'" value="'+o+'"> '+o+'</label>').join('')+'</div></div>'}
function gap(n){return '<span class="qnum">'+n+'</span><input class="gap" id="gap'+n+'">'}
function sel(n,t,letters){return '<div class="row" id="q'+n+'"><span class="qnum">'+n+'</span><span class="txt">'+t+'</span><select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select></div>'}
function selInline(n,letters){return '<select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select>'}
function mcq(n,t,opts){return '<div class="mcq" id="q'+n+'"><div class="prompt"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="choice-options">'+opts.map((o,i)=>'<label class="choice-option"><input type="radio" name="q'+n+'" value="'+'ABCD'[i]+'"> <b>'+'ABCD'[i]+'</b> '+o+'</label>').join('')+'</div></div>'}
var multiGroups={}, groupQNums={};
function multiSel(qA,qB,promptText,options){var name='g'+qA+'_'+qB;multiGroups[qA]=name;multiGroups[qB]=name;groupQNums[name]=[qA,qB];return '<div id="q_'+name+'" class="tf-row"><div class="statement"><span class="qnum">'+qA+', '+qB+'</span><span>'+promptText+'</span></div><div class="options">'+options.map(o=>'<label><input type="checkbox" name="'+name+'" value="'+o.letter+'"> <b>'+o.letter+'</b> '+o.text+'</label>').join('')+'</div></div>'}

function qhtml(p){
return '<div class="qgroup"><h3>Questions 1-5</h3><p><i>Do the following statements agree with the claims of the writer? Write <b>YES / NO / NOT GIVEN</b>.</i></p>'+tf(1,'Merck’s experience with MK-869 was unique.',true)+tf(2,'These days, a small number of unsuccessful test results can ruin a well-established drugs company.',true)+tf(3,'Some medical conditions are more easily treated by a placebo than others.',true)+tf(4,'It was to be expected that the third group in Kaptchuk’s trial would do better than the other two groups.',true)+tf(5,'Kaptchuk’s research highlights the fact that combined drug and placebo treatments should be avoided.',true)+'</div><div class="qgroup"><h3>Questions 6-10</h3><p><i>Complete the summary using the list of words, A–I, below.</i></p><div class="box"><b>A</b> activity &nbsp; <b>B</b> prices &nbsp; <b>C</b> success &nbsp; <b>D</b> patients &nbsp; <b>E</b> tests<br><b>F</b> diseases &nbsp; <b>G</b> symptoms &nbsp; <b>H</b> competition &nbsp; <b>I</b> criticism</div><p class="summary-text"><b>Merck and MK-869</b><br>As a result of concerns about increasing '+selInline(6,['A','B','C','D','E','F','G','H','I'])+' in the drugs industry, the pharmaceutical company Merck decided to increase its '+selInline(7,['A','B','C','D','E','F','G','H','I'])+' in the anti-depressant market. The development of the drug MK-869 was seen as the way forward.<br><br>Initially, MK-869 had some '+selInline(8,['A','B','C','D','E','F','G','H','I'])+', but later trials revealed a different picture. Although key '+selInline(9,['A','B','C','D','E','F','G','H','I'])+' could be treated with the drug, a sugar pill was proving equally effective. In the end, the '+selInline(10,['A','B','C','D','E','F','G','H','I'])+' indicated that it was pointless continuing with the development of the drug.</p></div><div class="qgroup"><h3>Questions 11-14</h3><p>Choose the correct letter, A, B, C or D.</p>'+mcq(11,'Which of the following is true of William Potter’s research?',['It was based on recently developed drugs that he had recommended.','It included trial results from a range of drugs companies.','Some of the trial results he investigated had not been made public.','Some of his findings were not accepted by the drugs industry.'])+mcq(12,'What did William Potter’s research reveal about the location of drugs trials?',['The placebo effect was weakest in the US.','Results were not consistent around the world.','Results varied depending on the type of hospital.','The FDA preferred drugs to be tested in different countries.'])+mcq(13,'What does the tight race refer to in line 80?',['The standard tests','Consistent results','Ratings by trial observers','Testing sites'])+mcq(14,'What significant discovery was made by Ted Kaptchuk?',['The effects of a placebo can last longer than previously thought.','Patients’ health can improve while waiting to undergo a trial.','Patients respond better to a placebo if they are treated by the same clinician throughout the trial.','Those conducting a placebo trial need to know the subjects’ disorder well.'])+'</div>';
}

function render(){partTitle.textContent='Reading Passage 1';var r=ranges[active];partSub.textContent='Read the text and answer questions '+r[0]+'-'+r[1]+'.';left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();drawFooter();left.scrollTop=right.scrollTop=0}
function val(n){if(multiGroups[n]){var boxes=document.querySelectorAll('input[name="'+multiGroups[n]+'"]:checked');return Array.from(boxes).map(b=>b.value).join(',')}var g=document.getElementById('gap'+n);if(g)return g.value;var s=document.getElementById('sel'+n);if(s)return s.value;var r=document.querySelector('input[name="q'+n+'"]:checked');return r?r.value:''}
function save(){for(var n=1;n<=40;n++){var v=val(n);if(v)state[n]=v}}
function restore(){for(var n=1;n<=40;n++){if(!state[n])continue;if(multiGroups[n]){var vals=state[n].split(',');vals.forEach(function(v){var cb=document.querySelector('input[name="'+multiGroups[n]+'"][value="'+v+'"]');if(cb)cb.checked=true});continue}var g=document.getElementById('gap'+n);if(g)g.value=state[n];var s=document.getElementById('sel'+n);if(s)s.value=state[n];var r=document.querySelector('input[name="q'+n+'"][value="'+state[n]+'"]');if(r)r.checked=true}}
function answered(n){return !!state[n]||!!val(n)}
function count(p){var r=ranges[p],c=0;for(var i=r[0];i<=r[1];i++)if(answered(i))c++;return c}
function drawFooter(){save();var h='';[1].forEach(p=>{var r=ranges[p];h+='<div class="partnav"><button class="partlabel" data-part="'+p+'" disabled>Reading Passage 1</button>';if(p===active){h+='<div class="tiles">';for(var n=r[0];n<=r[1];n++)h+='<button class="tile '+(answered(n)?'answered':'')+'" data-q="'+n+'">'+n+'</button>';h+='</div>'}else h+='<span class="count">'+count(p)+' of '+(r[1]-r[0]+1)+'</span>';h+='</div>'});h+='<button class="review" id="review">OK</button>';footer.innerHTML=h}
document.addEventListener('change',()=>{save();drawFooter();checkAutoGrade();sendProgress();});document.addEventListener('input',()=>{save();drawFooter();sendProgress();});function checkAutoGrade(){if(graded)return;var r=ranges[1];for(var n=r[0];n<=r[1];n++)if(!answered(n))return;silentGrade();}function sendProgress(){if(graded)return;try{var r=ranges[1];var items=[];for(var n=r[0];n<=r[1];n++)items.push({n:n,value:state[n]||''});parent.postMessage({type:'cdi-reading-progress',items:items},'*');}catch(e){}}
var lastScore=null;
function renderActive(){left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();if(revealed){regradeCurrent();right.insertAdjacentHTML('afterbegin','<div class="score">Your score: <b>'+lastScore+' / 14</b></div><p style="margin:-8px 0 18px;color:#555">Explanations with the exact location in the passage are shown below each answer.</p>')}drawFooter();left.scrollTop=right.scrollTop=0}
footer.onclick=e=>{var p=e.target.closest('[data-part]');if(p){save();active=+p.dataset.part;renderActive();return}var q=e.target.closest('[data-q]');if(q){var n=+q.dataset.q;(document.getElementById('q'+n)||document.getElementById('gap'+n)||document.getElementById('sel'+n))?.scrollIntoView({behavior:'smooth',block:'center'});return}if(e.target.closest('#review'))review()};
function review(){save();var r=ranges[1];var a=0;for(var n=r[0];n<=r[1];n++)if(answered(n))a++;subwrap.innerHTML='<p>You have answered <b>'+a+'</b> of 14 questions.</p><p><button class="ovrow submit" id="final">Submit test</button></p>';final.onclick=grade;submit.classList.add('show')}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function correct(n,v){if(multiGroups[n]){var parts=(v||'').split(',').map(norm).filter(Boolean);return parts.includes(norm(answers[n]))}return [answers[n]].concat(alt[n]||[]).some(a=>norm(a)===norm(v))}
function explHTML(n){var e=EXPL[n];if(!e)return '';return '<div class="expl"><b>Q'+n+' — correct answer: '+answers[n]+'</b> &nbsp;<span class="expl-loc">('+e.loc+')</span><br>'+e.text+'</div>'}
function markGap(n){var x=document.getElementById('gap'+n);if(!x)return;var ok=correct(n,x.value);x.disabled=true;x.classList.add(ok?'ok':'no');x.insertAdjacentHTML('afterend',(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>')+explHTML(n));return ok}
function markSel(n){var s=document.getElementById('sel'+n);if(!s)return;var ok=correct(n,s.value);s.disabled=true;s.classList.add(ok?'ok':'no');var row=document.getElementById('q'+n);var tag=(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>');if(row){row.insertAdjacentHTML('beforeend',tag);row.insertAdjacentHTML('afterend',explHTML(n))}else{s.insertAdjacentHTML('afterend',tag);var host=s.closest('p')||s;host.insertAdjacentHTML('afterend',explHTML(n))}return ok}
function markRadio(n){var r=document.querySelector('input[name="q'+n+'"]:checked');var ok=r&&correct(n,r.value);document.querySelectorAll('input[name="q'+n+'"]').forEach(i=>i.disabled=true);var box=document.getElementById('q'+n);box.insertAdjacentHTML('beforeend',(ok?'<span class="tag ok">\u2713</span>':'<span class="tag no">\u2718 correct: '+answers[n]+'</span>'));box.insertAdjacentHTML('afterend',explHTML(n));return ok}
function markMulti(group){var qNums=groupQNums[group];var boxes=document.querySelectorAll('input[name="'+group+'"]');var checkedVals=Array.from(boxes).filter(function(b){return b.checked}).map(function(b){return b.value});boxes.forEach(function(b){b.disabled=true});var container=document.getElementById('q_'+group);var tagHtml='';qNums.forEach(function(qn){var ok=checkedVals.includes(answers[qn]);tagHtml+=' '+(ok?'<span class="tag ok">Q'+qn+' \u2713</span>':'<span class="tag no">Q'+qn+' \u2718 correct: '+answers[qn]+'</span>')});container.insertAdjacentHTML('beforeend','<div style="margin-top:8px;">'+tagHtml+'</div>');var explAll='';qNums.forEach(function(qn){explAll+=explHTML(qn)});container.insertAdjacentHTML('afterend',explAll)}
function regradeCurrent(){var r=ranges[active];var doneGroups={};for(var n=r[0];n<=r[1];n++){if(multiGroups[n]){if(!doneGroups[multiGroups[n]]){markMulti(multiGroups[n]);doneGroups[multiGroups[n]]=true}continue}var g=document.getElementById('gap'+n),s=document.getElementById('sel'+n),rad=document.querySelector('input[name="q'+n+'"]');if(g)markGap(n);else if(s)markSel(n);else if(rad)markRadio(n)}}
function silentGrade(){if(graded)return;save();var r=ranges[1];var score=0;for(var n=r[0];n<=r[1];n++)if(correct(n,state[n]||''))score++;lastScore=score;graded=true;try{parent.postMessage({type:'cdi-reading-result',score:lastScore,max:(r[1]-r[0]+1),items:(function(){var arr=[];for(var n=r[0];n<=r[1];n++)arr.push({n:n,value:state[n]||'',correct:correct(n,state[n]||'')});return arr;})()},'*');}catch(e){}}
function grade(){silentGrade();revealed=true;active=1;renderActive();submit.classList.remove('show')}
var drag=false;div.onmousedown=()=>{drag=true;document.body.style.userSelect='none'};window.onmouseup=()=>{drag=false;document.body.style.userSelect=''};window.onmousemove=e=>{if(!drag)return;var r=split.getBoundingClientRect();left.style.width=Math.max(220,Math.min(r.width-240,e.clientX-r.left))+'px'};
split.onmouseup=()=>setTimeout(()=>{var s=getSelection();if(!s||s.isCollapsed||!s.rangeCount){tools.style.display='none';return}var rg=s.getRangeAt(0);if(!split.contains(rg.commonAncestorContainer)){tools.style.display='none';return}var rc=rg.getBoundingClientRect();tools.style.display='flex';tools.style.left=(rc.left+scrollX)+'px';tools.style.top=Math.max(8,rc.top+scrollY-42)+'px'},1);
tools.onclick=e=>{var b=e.target.closest('button'),s=getSelection();if(!b||!s.rangeCount)return;var rg=s.getRangeAt(0);if(b.dataset.act==='hl'){try{var sp=document.createElement('span');sp.className='hl';rg.surroundContents(sp)}catch(_){document.execCommand('hiliteColor',false,'#ffe45c')}}else document.querySelectorAll('.hl').forEach(h=>h.replaceWith(document.createTextNode(h.textContent)));s.removeAllRanges();tools.style.display='none'};
render();
window.addEventListener('message',function(event){var d=event.data;if(!d||d.type!=='cdi-reading-restore')return;(d.items||[]).forEach(function(item){if(item.value)state[item.n]=item.value;});restore();drawFooter();});
})();
</script></body></html>
