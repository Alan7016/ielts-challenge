t:inherit;border:1px solid #999;border-radius:4px;background:#fff;padding:5px 8px;width:175px;text-align:center;margin:0 5px}.notes{font-size:17px;line-height:1.75}.note-row{margin:10px 0}.box{background:#f2f3f4;border:1px solid #ddd;border-radius:6px;padding:14px 18px;line-height:1.7;font-size:17px;margin:14px 0}.row{display:flex;gap:12px;align-items:flex-start;margin:16px 0}.txt{flex:1;font-size:17px;line-height:1.45}.select{font:inherit;border:1px solid #cfcfcf;border-radius:7px;background:#f7f8f9;padding:8px 28px 8px 14px;min-width:86px}.tools{position:absolute;z-index:50;display:none;background:#222;border-radius:6px;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.2)}.tools button{background:none;border:0;color:#fff;padding:6px 10px;font:inherit}.hl{background:#ffe45c}.bar{height:59px;border-top:1px solid #ddd;display:flex;align-items:center;gap:28px;padding:8px 18px;background:#fff;overflow-x:auto}.partnav{display:flex;align-items:center;gap:8px;white-space:nowrap}.partlabel{font-weight:700;border:0;background:#fff;font:inherit;cursor:pointer}.count{color:#555;font-size:14px}.tiles{display:flex;gap:4px}.tile{min-width:32px;height:32px;border:1px solid #bbb;background:#fff;border-radius:2px;cursor:pointer}.tile.answered{background:#2b2b2b;color:#fff}.review{margin-left:auto;min-width:42px;height:34px;background:#ddd;border:0;border-radius:4px;font-weight:700}.overlay{position:fixed;inset:0;background:white;z-index:100;display:none;flex-direction:column;overflow:auto}.overlay.show{display:flex}.ovh{position:relative;padding:22px}.ovh h2{text-align:center;margin:0}.close{position:absolute;right:24px;top:18px;border:0;background:none;font-size:26px}.ovlist{max-width:880px;width:90%;margin:10px auto}.ovrow{width:100%;padding:18px 22px;border:1px solid #ddd;background:white;font:inherit;text-align:left}.submit{background:#cf3e45;color:white;border-color:#cf3e45;border-radius:6px;margin-bottom:18px;font-weight:700}.score{background:#f2f3f4;border:1px solid #ddd;border- </style></head><body><header class="top"><button>|||</button><button>o</button><button>=</button></header><div class="banner"><h2 id="partTitle"></h2><p id="partSub"></p></div><div class="split" id="split"><section class="pane left" id="left"></section><div class="divider" id="div"></div><section class="pane right" id="right"></section></div><footer class="bar" id="footer"></footer><div class="tools" id="tools"><button data-act="hl">Highlight</button><button data-act="clear">Clear</button></div><div class="overlay" id="submit"><div class="ovh"><h2>Submission page</h2><button class="close" onclick="submit.classList.remove('show')">x</button></div><div class="ovlist" id="subwrap"></div></div><script>
(function(){
var active=1,graded=false,revealed=false,state={},ranges={1:[1,13]};
var DATA = {"passages": {"1": "<h1>The MIT Factor: celebrating 150 years of maverick genius</h1>\n<p class=\"sub\">by Ed Pilkington</p>\n<p>The Massachusetts Institute of Technology has led the world into the future for 150 years with scientific innovations.</p>\n<p>The musician Yo-Yo Ma's cello may not be the obvious starting point for a journey into one of the world's great universities. But, as you quickly realise when you step inside the Massachusetts Institute of Technology, there's precious little going on that you would normally see on a university campus. The cello, resting in a corner of MIT's celebrated media laboratory – a hub of creativity – looks like any other electric classical instrument. But it is much more.</p>\n<p>Machover, the composer, teacher and inventor responsible for its creation, calls it a 'hyperinstrument', a sort of thinking machine that allows Ma and his cello to interact with one another and make music together. 'The aim is to build an instrument worthy of a great musician like Yo-Yo Ma that can understand what he is trying to do and respond to it,' Machover says. The cello has numerous sensors across its body and by measuring the pressure, speed and angle of the virtuoso's performance it can interpret his mood and engage with it, producing extraordinary new sounds. The virtuoso cellist frequently performs on the instrument as he tours around the world.</p>\n<p>Machover's passion for pushing at the boundaries of the existing world to extend and unleash human potential is not a bad description of MIT as a whole. This unusual community brings highly gifted, highly motivated individuals together from a vast range of disciplines, united by a common desire: to leap into the dark and reach for the unknown.</p>\n<p>The result of that single unifying ambition is visible all around. For the past 150 years, MIT has been leading the world into the future. The discoveries of its teachers and students have become the common everyday objects that we now all take for granted. The telephone, electromagnets, radars, high-speed photography, office photocopiers, cancer treatments, pocket calculators, computers, the Internet, the decoding of the human genome, lasers, space travel … the list of innovations that involved essential contributions from MIT and its faculty goes on and on.</p>\n<p>From the moment MIT was founded by William Barton Rogers in 1861, it was clear what it was not. While Harvard stuck to the English model of a classical education, with its emphasis on Latin and Greek, MIT looked to the German system of learning based on research and hands-on experimentation. Knowledge was at a premium, but it had to be useful.</p>\n<p>This down-to-earth quality is enshrined in the school motto, Mens et manus – Mind and hand – as well as its logo, which shows a gowned scholar standing beside an ironmonger bearing a hammer and anvil. That symbiosis of intellect and craftsmanship still suffuses the institute's classrooms, where students are not so much taught as engaged and inspired.</p>\n<p>Take Christopher Merrill, 21, a third-year undergraduate in computer science. He is spending most of his time on a competition set in his robotics class. The contest is to see which student can most effectively program a robot to build a house out of blocks in under ten minutes. Merrill says he could have gone for the easiest route – designing a simple robot that would build the house quickly. But he wanted to try to master an area of robotics that remains unconquered – adaptability, the ability of the robot to rethink its plans as the environment around it changes, as would a human.</p>\n<p>'I like to take on things that have never been done before rather than to work in an iterative way just making small steps forward,' he explains.</p>\n<p>Merrill is already planning the start-up he wants to set up when he graduates in a year's time. He has an idea for an original version of a contact lens that would augment reality by allowing consumers to see additional visual information. He is fearful that he might be too late in taking his concept to market, as he has heard that a Silicon Valley firm is already developing something similar. As such, he might become one of many MIT graduates who go on to form companies that fail. Alternatively, he might become one of those who go on to succeed in spectacular fashion. And there are many of them. A survey of living MIT alumni* found that they have formed 25,800 companies, employing more than three million people, including about a quarter of the workforce of Silicon Valley.</p>\n<p>What MIT delights in is taking brilliant minds from around the world in vastly diverse disciplines and putting them together. You can see that in its sparkling new David Koch Institute for Integrative Cancer Research, which brings scientists, engineers and clinicians under one roof. Or in its Energy Initiative, which acts as a bridge for MIT's combined workforce across all its five schools, channelling huge resources into the search for a solution to global warming. It works to improve the efficiency of existing energy sources, including nuclear power. It is also forging ahead with alternative energies from solar to wind and geothermal, and has recently developed the use of viruses to synthesise batteries that could prove crucial in the advancement of electric cars.</p>\n<p>In the words of Tim Berners-Lee, the Briton who invented the World Wide Web, 'It's not just another university. Even though I spend my time with my head buried in the details of web technology, the nice thing is that when I do walk the corridors, I bump into people who are working in other fields with their students who are fascinating, and that keeps me intellectually alive.'</p>\n<p style=\"font-size:14px;color:#555;\">adapted from the Guardian<br>* people who have left a university or college after completing their studies there</p>"}, "answers": {"1": "FALSE", "2": "FALSE", "3": "NOT GIVEN", "4": "TRUE", "5": "NOT GIVEN", "6": "computer science", "7": "program", "8": "adaptability", "9": "contact lens", "10": "a quarter", "11": "global warming", "12": "electric cars", "13": "the corridors"}, "alt": {"7": ["programme", "programming"], "10": ["a quarter of"]}, "expl": {"1": {"loc": "Para 2", "text": "'there's precious little going on that you would normally see on a university campus' → FALSE."}, "2": {"loc": "Para 6", "text": "'While Harvard stuck to the English model of a classical education... MIT looked to the German system' → FALSE."}, "3": {"loc": "Para 7", "text": "No information is given about who suggested the motto → NOT GIVEN."}, "4": {"loc": "Para 7", "text": "'a gowned scholar standing beside an ironmonger bearing a hammer and anvil. That symbiosis of intellect and craftsmanship...' → TRUE."}, "5": {"loc": "Para 10", "text": "No mention of salaries paid to MIT graduates → NOT GIVEN."}, "6": {"loc": "Para 8", "text": "'a third-year undergraduate in computer science' → 'computer science'."}, "7": {"loc": "Para 8", "text": "'The contest is to see which student can most effectively program a robot to build a house' → 'program'."}, "8": {"loc": "Para 8", "text": "'he wanted to try to master an area of robotics that remains unconquered – adaptability' → 'adaptability'."}, "9": {"loc": "Para 10", "text": "'He has an idea for an original version of a contact lens that would augment reality' → 'contact lens'."}, "10": {"loc": "Para 10", "text": "'employing more than three million people, including about a quarter of the workforce of Silicon Valley' → 'a quarter'."}, "11": {"loc": "Para 11", "text": "'channelling huge resources into the search for a solution to global warming' → 'global warming'."}, "12": {"loc": "Para 11", "text": "'the use of viruses to synthesise batteries that could prove crucial in the advancement of electric cars' → 'electric cars'."}, "13": {"loc": "Final paragraph", "text": "'when I do walk the corridors, I bump into people who are working in other fields' → 'the corridors'."}}};
var passages=DATA.passages, answers=DATA.answers, alt=DATA.alt, EXPL=DATA.expl;
function tf(n,t,yn){var opts=yn?['YES','NO','NOT GIVEN']:['TRUE','FALSE','NOT GIVEN'];return '<div class="tf-row" id="q'+n+'"><div class="statement"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="options">'+opts.map(o=>'<label><input type="radio" name="q'+n+'" value="'+o+'"> '+o+'</label>').join('')+'</div></div>'}
function gap(n){return '<span class="qnum">'+n+'</span><input class="gap" id="gap'+n+'">'}
function sel(n,t,letters){return '<div class="row" id="q'+n+'"><span class="qnum">'+n+'</span><span class="txt">'+t+'</span><select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select></div>'}
function selInline(n,letters){return '<select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select>'}
function mcq(n,t,opts){return '<div class="mcq" id="q'+n+'"><div class="prompt"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="choice-options">'+opts.map((o,i)=>'<label class="choice-option"><input type="radio" name="q'+n+'" value="'+'ABCD'[i]+'"> <b>'+'ABCD'[i]+'</b> '+o+'</label>').join('')+'</div></div>'}
var multiGroups={}, groupQNums={};
function multiSel(qA,qB,promptText,options){var name='g'+qA+'_'+qB;multiGroups[qA]=name;multiGroups[qB]=name;groupQNums[name]=[qA,qB];return '<div id="q_'+name+'" class="tf-row"><div class="statement"><span class="qnum">'+qA+', '+qB+'</span><span>'+promptText+'</span></div><div class="options">'+options.map(o=>'<label><input type="checkbox" name="'+name+'" value="'+o.letter+'"> <b>'+o.letter+'</b> '+o.text+'</label>').join('')+'</div></div>'}

function qhtml(p){
return '<div class="qgroup"><h3>Questions 1-5</h3><p><i>Do the following statements agree with the information in the reading passage? Write <b>TRUE / FALSE / NOT GIVEN</b>.</i></p>'+tf(1,'The activities going on at the MIT campus are like those at any other university.')+tf(2,'Harvard and MIT shared a similar approach to education when they were founded.')+tf(3,'The school motto was suggested by a former MIT student.')+tf(4,'MIT’s logo reflects the belief that intellect and craftsmanship go together.')+tf(5,'Silicon Valley companies pay higher salaries to graduates from MIT.')+'</div><div class="qgroup"><h3>Questions 6-9</h3><p><i>Complete the notes below. Choose <b>NO MORE THAN TWO WORDS</b> from the passage for each answer.</i></p><div class="notes"><h3>Christopher Merrill – student at MIT</h3><div class="note-row"><b>Degree subject:</b><br>'+gap(6)+'</div><div class="note-row" style="margin-top:14px;"><b>Competition:</b><br>to '+gap(7)+' the automated construction of a house</div><div class="note-row" style="margin-top:14px;"><b>Special focus on:</b><br>the '+gap(8)+' of robots</div><div class="note-row" style="margin-top:14px;"><b>Future plans:</b><br>to develop new type of '+gap(9)+'</div></div></div><div class="qgroup"><h3>Questions 10-13</h3><p><i>Answer the questions below. Choose <b>NO MORE THAN TWO WORDS</b> from the passage for each answer.</i></p><p class="summary-text"><span class="qnum">10</span>What proportion of workers at Silicon Valley are employed in companies set up by MIT graduates? '+gap(10)+'</p><p class="summary-text"><span class="qnum">11</span>What problem does MIT’s Energy Initiative aim to solve? '+gap(11)+'</p><p class="summary-text"><span class="qnum">12</span>Which ‘green’ innovation might MIT’s work with viruses help improve? '+gap(12)+'</p><p class="summary-text"><span class="qnum">13</span>In which part of the university does Tim Berners-Lee enjoy stimulating conversations with other MIT staff? '+gap(13)+'</p></div>';
}

function render(){partTitle.textContent='Reading Passage 1';var r=ranges[active];partSub.textContent='Read the text and answer questions '+r[0]+'-'+r[1]+'.';left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();drawFooter();left.scrollTop=right.scrollTop=0}
function val(n){if(multiGroups[n]){var boxes=document.querySelectorAll('input[name="'+multiGroups[n]+'"]:checked');return Array.from(boxes).map(b=>b.value).join(',')}var g=document.getElementById('gap'+n);if(g)return g.value;var s=document.getElementById('sel'+n);if(s)return s.value;var r=document.querySelector('input[name="q'+n+'"]:checked');return r?r.value:''}
function save(){for(var n=1;n<=40;n++){var v=val(n);if(v)state[n]=v}}
function restore(){for(var n=1;n<=40;n++){if(!state[n])continue;if(multiGroups[n]){var vals=state[n].split(',');vals.forEach(function(v){var cb=document.querySelector('input[name="'+multiGroups[n]+'"][value="'+v+'"]');if(cb)cb.checked=true});continue}var g=document.getElementById('gap'+n);if(g)g.value=state[n];var s=document.getElementById('sel'+n);if(s)s.value=state[n];var r=document.querySelector('input[name="q'+n+'"][value="'+state[n]+'"]');if(r)r.checked=true}}
function answered(n){return !!state[n]||!!val(n)}
function count(p){var r=ranges[p],c=0;for(var i=r[0];i<=r[1];i++)if(answered(i))c++;return c}
function drawFooter(){save();var h='';[1].forEach(p=>{var r=ranges[p];h+='<div class="partnav"><button class="partlabel" data-part="'+p+'" disabled>Reading Passage 1</button>';if(p===active){h+='<div class="tiles">';for(var n=r[0];n<=r[1];n++)h+='<button class="tile '+(answered(n)?'answered':'')+'" data-q="'+n+'">'+n+'</button>';h+='</div>'}else h+='<span class="count">'+count(p)+' of '+(r[1]-r[0]+1)+'</span>';h+='</div>'});h+='<button class="review" id="review">OK</button>';footer.innerHTML=h}
var inputTimer=null;
function postProgress(){if(graded)return;var items=[];for(var n=1;n<=40;n++)if(state[n])items.push({n:n,value:state[n]});try{window.parent.postMessage({type:'cdi-reading-progress',items:items,active:active},'*')}catch(e){}}
function postProgressSoon(){clearTimeout(inputTimer);inputTimer=setTimeout(postProgress,500)}
function checkAutoGrade(){if(graded)return;for(var n=1;n<=13;n++){if(!state[n])return;}silentGrade();}
document.addEventListener('change',()=>{save();drawFooter();checkAutoGrade();postProgress()});
document.addEventListener('input',()=>{save();drawFooter();postProgressSoon()});
document.addEventListener('pagehide',()=>{clearTimeout(inputTimer);save();postProgress()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){clearTimeout(inputTimer);save();postProgress()}});
window.addEventListener('message',function(e){var d=e.data;if(!d||d.type!=='cdi-reading-restore')return;(d.items||[]).forEach(function(it){if(it.value)state[it.n]=it.value});active=d.active||1;if(d.graded){graded=true;revealed=true;var sc=0;for(var n=1;n<=13;n++)if(correct(n,state[n]||''))sc++;lastScore=sc}renderActive()});
var lastScore=null;
function renderActive(){left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();if(revealed){regradeCurrent();right.insertAdjacentHTML('afterbegin','<div class="score">Your score: <b>'+lastScore+' / 13</b></div><p style="margin:-8px 0 18px;color:#555">Explanations with the exact location in the passage are shown below each answer.</p>')}drawFooter();left.scrollTop=right.scrollTop=0}
footer.onclick=e=>{var p=e.target.closest('[data-part]');if(p){save();active=+p.dataset.part;renderActive();return}var q=e.target.closest('[data-q]');if(q){var n=+q.dataset.q;(document.getElementById('q'+n)||document.getElementById('gap'+n)||document.getElementById('sel'+n))?.scrollIntoView({behavior:'smooth',block:'center'});return}if(e.target.closest('#review'))review()};
function review(){save();var a=0;for(var n=1;n<=13;n++)if(answered(n))a++;subwrap.innerHTML='<p>You have answered <b>'+a+'</b> of 13 questions.</p><p><button class="ovrow submit" id="final">Submit test</button></p>';final.onclick=grade;submit.classList.add('show')}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function correct(n,v){if(multiGroups[n]){var parts=(v||'').split(',').map(norm).filter(Boolean);return parts.includes(norm(answers[n]))}return [answers[n]].concat(alt[n]||[]).some(a=>norm(a)===norm(v))}
function explHTML(n){var e=EXPL[n];if(!e)return '';return '<div class="expl"><b>Q'+n+' — correct answer: '+answers[n]+'</b> &nbsp;<span class="expl-loc">('+e.loc+')</span><br>'+e.text+'</div>'}
function markGap(n){var x=document.getElementById('gap'+n);if(!x)return;var ok=correct(n,x.value);x.disabled=true;x.classList.add(ok?'ok':'no');x.insertAdjacentHTML('afterend',(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>')+explHTML(n));return ok}
function markSel(n){var s=document.getElementById('sel'+n);if(!s)return;var ok=correct(n,s.value);s.disabled=true;s.classList.add(ok?'ok':'no');var row=document.getElementById('q'+n);var tag=(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>');if(row){row.insertAdjacentHTML('beforeend',tag);row.insertAdjacentHTML('afterend',explHTML(n))}else{s.insertAdjacentHTML('afterend',tag);var host=s.closest('p')||s;host.insertAdjacentHTML('afterend',explHTML(n))}return ok}
function markRadio(n){var r=document.querySelector('input[name="q'+n+'"]:checked');var ok=r&&correct(n,r.value);document.querySelectorAll('input[name="q'+n+'"]').forEach(i=>i.disabled=true);var box=document.getElementById('q'+n);box.insertAdjacentHTML('beforeend',(ok?'<span class="tag ok">\u2713</span>':'<span class="tag no">\u2718 correct: '+answers[n]+'</span>'));box.insertAdjacentHTML('afterend',explHTML(n));return ok}
function markMulti(group){var qNums=groupQNums[group];var boxes=document.querySelectorAll('input[name="'+group+'"]');var checkedVals=Array.from(boxes).filter(function(b){return b.checked}).map(function(b){return b.value});boxes.forEach(function(b){b.disabled=true});var container=document.getElementById('q_'+group);var tagHtml='';qNums.forEach(function(qn){var ok=checkedVals.includes(answers[qn]);tagHtml+=' '+(ok?'<span class="tag ok">Q'+qn+' \u2713</span>':'<span class="tag no">Q'+qn+' \u2718 correct: '+answers[qn]+'</span>')});container.insertAdjacentHTML('beforeend','<div style="margin-top:8px;">'+tagHtml+'</div>');var explAll='';qNums.forEach(function(qn){explAll+=explHTML(qn)});container.insertAdjacentHTML('afterend',explAll)}
function regradeCurrent(){var r=ranges[active];var doneGroups={};for(var n=r[0];n<=r[1];n++){if(multiGroups[n]){if(!doneGroups[multiGroups[n]]){markMulti(multiGroups[n]);doneGroups[multiGroups[n]]=true}continue}var g=document.getElementById('gap'+n),s=document.getElementById('sel'+n),rad=document.querySelector('input[name="q'+n+'"]');if(g)markGap(n);else if(s)markSel(n);else if(rad)markRadio(n)}}
function silentGrade(){if(graded)return;save();var score=0;for(var n=1;n<=13;n++)if(correct(n,state[n]||''))score++;var items=[];for(var m=1;m<=13;m++)items.push({n:m,value:state[m]||'',correct:correct(m,state[m]||'')});try{window.parent.postMessage({type:'cdi-reading-result',score:score,max:13,items:items},'*')}catch(e){}lastScore=score;graded=true}

var drag=false;div.onmousedown=()=>{drag=true;document.body.style.userSelect='none'};window.onmouseup=()=>{drag=false;document.body.style.userSelect=''};window.onmousemove=e=>{if(!drag)return;var r=split.getBoundingClientRect();left.style.width=Math.max(220,Math.min(r.width-240,e.clientX-r.left))+'px'};
