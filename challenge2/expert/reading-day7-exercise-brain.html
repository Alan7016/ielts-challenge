</style></head><body><header class="top"><button>|||</button><button>o</button><button>=</button></header><div class="banner"><h2 id="partTitle"></h2><p id="partSub"></p></div><div class="split" id="split"><section class="pane left" id="left"></section><div class="divider" id="div"></div><section class="pane right" id="right"></section></div><footer class="bar" id="footer"></footer><div class="tools" id="tools"><button data-act="hl">Highlight</button><button data-act="clear">Clear</button></div><div class="overlay" id="submit"><div class="ovh"><h2>Submission page</h2><button class="close" onclick="submit.classList.remove('show')">x</button></div><div class="ovlist" id="subwrap"></div></div><script>

var active=1,graded=false,revealed=false,state={},ranges={1:[1,13]};
var DATA = {"passages": {"1": "<h1>Scientific research reveals hidden benefits of regular exercise</h1>\n<p>Concerns that children in developed countries are leading increasingly sedentary lifestyles are growing. Recent research suggests that almost nine in ten children fail to get the 60 minutes of daily exercise which is the minimum recommended for good health, and a third completed less than an hour each week. In most cases, this is because they are spending hours every day glued to televisions, the Internet and games consoles. Alarmingly, there is evidence to suggest that this lack of exercise is not only having a negative physiological effect on them, but is also adversely affecting their academic performance at school.</p>\n<p>Psychologist Dr Aric Sigman believes that regular exercise can significantly improve pupils' academic ability, and suggests that access to high-quality PE lessons is just as likely to have a long-term impact on children's education as time spent in conventional classrooms. He also supports the long-held conviction that vigorous physical activity is much better than moderate activity. 'Children should spend at least an hour a day doing some form of vigorous exercise,' he says. And his message to schools and parents is obvious. 'Schools and parents should devise ways of increasing physical activity in and out of school time.' This, he believes, is the key to improved academic performance.</p>\n<p>For those who are sceptical about this, and no doubt there are many, he quotes two pieces of research that underline the link between physical activity and brain capacity. One study compared brain capacity and test scores among two groups of nine- and ten-year-olds, one with higher levels of physical fitness than the other. It revealed that fitter pupils had a twelve percent larger brain capacity than their peers, which was associated with better performance in cognitive tests. They were able to complete the test more quickly and got more answers correct. A second study of 1.2 million male teenagers in Sweden was perhaps even more revealing. It found that those who were fit were more likely to have a high IQ and go on to university.</p>\n<p>Dr Sigman says, 'Physical activity is thought to help a child's cognitive processes by increasing blood and oxygen flow to the brain. This increases levels of chemicals like endorphins in the brain which decrease stress and improve mood. It also increases growth factors that help create new nerve cells and support the connections between brain cell synapses that are the basis of learning.'</p>\n<p>According to other researchers, there is also evidence that suggests regular exercise can increase the size of crucial parts of the brain, and that children who are fit also tend to be better at multi-tasking and performing difficult mental tasks than their unfit friends. Professor Art Kramer, director of the Beckman Institute for Advanced Science and Technology at the University of Illinois, who led the research, said their findings could have important implications for improving children's performance at school. He said it could also be used to help people combat memory loss and retain problem-solving skills in old age.</p>\n<p>'It is a sad fact of ageing that our brain function decreases as we get older,' says Kramer. 'Increasingly, people are also living more sedentary lifestyles. While we know that exercise can have positive effects on cardiovascular disease and diabetes, we have found it can also bring about improvements in cognition and brain function. Aerobic exercise is best for this, so by starting off doing 15 minutes a day and working up to 45 minutes to an hour of continuous exercising, we can see some real improvements in cognition after six months to a year.'</p>\n<p>Professor Kramer's team did a lot of neuroimaging work alongside their studies, which provided visual evidence to show that brain networks and structures actually change with exercise. This, they say, is the reason why their aerobically-fit test subjects were found to exhibit superior cognitive control to those who were less fit, and that regular exercise helped to improve memory, attention and an increased ability to multi-task. The hippocampus, that part of the brain involved in memory, of elderly people who exercised regularly for more than six months increased by two percent, effectively reversing brain ageing by one to two years.</p>\n<p>Tests carried out on children also yielded some interesting results. One test involved them crossing a 'street' using a virtual reality simulation. Fitter children were better at crossing the street when distracted by music or holding a conversation on a hands-free mobile phone compared to those who were less fit. While both groups tended to walk at the same speed, the children who were less fit often misjudged the speed and distance of the computer-generated vehicles. 'The low fitness kids were just as good at crossing the street when it was the only thing they were doing,' says Kramer. 'If they were listening to music or talking on the headset, they performed badly. They often ended up with the screen going red to show they had been hit. One way to look at it is that fit children were more efficient and so are better at multi-tasking.'</p>\n<p>Professor Kramer presented his findings at the American Association for the Advancement of Science annual meeting in Vancouver, where other research presented showed that reducing the number of calories we consume could help to prevent brain disorders, especially in the elderly. Dr Mark Mattson, a neuroscientist from the National Institute of Ageing in Baltimore found that restricting people's diets to just 500 calories every other day increased production of proteins that are known to protect neurons from damage. 'There is considerable evidence that doing this is not only good for your heart, but is also good for your brain,' he said.</p>"}, "answers": {"1": "YES", "2": "NO", "3": "NO", "4": "YES", "5": "NOT GIVEN", "6": "B", "7": "I", "8": "E", "9": "C", "10": "D", "11": "C", "12": "A", "13": "D"}, "alt": {}, "expl": {"1": {"loc": "Para 1", "text": "'Alarmingly, there is evidence to suggest that this lack of exercise is not only having a negative physiological effect on them, but is also adversely affecting their academic performance at school' → YES."}, "2": {"loc": "Para 2", "text": "'He also supports the long-held conviction that vigorous physical activity is much better than moderate activity' — 'long-held', not a recent discovery → NO."}, "3": {"loc": "Para 2", "text": "'his message to schools and parents is obvious' — the opposite of unclear → NO."}, "4": {"loc": "Para 3", "text": "'For those who are sceptical about this, and no doubt there are many' → YES."}, "5": {"loc": "Para 3", "text": "No mention of researchers being surprised by the Swedish study's findings → NOT GIVEN."}, "6": {"loc": "Para 4", "text": "'This increases levels of chemicals like endorphins in the brain which decrease stress and improve mood' → 'anxiety' (B)."}, "7": {"loc": "Para 5", "text": "'there is also evidence that suggests regular exercise can increase the size of crucial parts of the brain' → 'proof' (I)."}, "8": {"loc": "Para 5", "text": "'children who are fit also tend to be better at multi-tasking and performing difficult mental tasks' → 'exercises' (E)."}, "9": {"loc": "Para 5", "text": "'their findings could have important implications for improving children's performance at school' → 'discoveries' (C)."}, "10": {"loc": "Para 5", "text": "'it could also be used to help people combat memory loss and retain problem-solving skills in old age' → 'elderly' (D)."}, "11": {"loc": "Para 6", "text": "'Aerobic exercise is best for this' → C, one particular type of exercise is more effective."}, "12": {"loc": "Para 7", "text": "'provided visual evidence to show that brain networks and structures actually change with exercise' → A."}, "13": {"loc": "Final paragraph", "text": "'restricting people's diets to just 500 calories every other day... ‘There is considerable evidence that doing this...’' → D, eating less on certain days."}}};
var passages=DATA.passages, answers=DATA.answers, alt=DATA.alt, EXPL=DATA.expl;
function tf(n,t,yn){var opts=yn?['YES','NO','NOT GIVEN']:['TRUE','FALSE','NOT GIVEN'];return '<div class="tf-row" id="q'+n+'"><div class="statement"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="options">'+opts.map(o=>'<label><input type="radio" name="q'+n+'" value="'+o+'"> '+o+'</label>').join('')+'</div></div>'}
function gap(n){return '<span class="qnum">'+n+'</span><input class="gap" id="gap'+n+'">'}
function sel(n,t,letters){return '<div class="row" id="q'+n+'"><span class="qnum">'+n+'</span><span class="txt">'+t+'</span><select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select></div>'}
function selInline(n,letters){return '<select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select>'}
function mcq(n,t,opts){return '<div class="mcq" id="q'+n+'"><div class="prompt"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="choice-options">'+opts.map((o,i)=>'<label class="choice-option"><input type="radio" name="q'+n+'" value="'+'ABCD'[i]+'"> <b>'+'ABCD'[i]+'</b> '+o+'</label>').join('')+'</div></div>'}
var multiGroups={}, groupQNums={};
function multiSel(qA,qB,promptText,options){var name='g'+qA+'_'+qB;multiGroups[qA]=name;multiGroups[qB]=name;groupQNums[name]=[qA,qB];return '<div id="q_'+name+'" class="tf-row"><div class="statement"><span class="qnum">'+qA+', '+qB+'</span><span>'+promptText+'</span></div><div class="options">'+options.map(o=>'<label><input type="checkbox" name="'+name+'" value="'+o.letter+'"> <b>'+o.letter+'</b> '+o.text+'</label>').join('')+'</div></div>'}

function qhtml(p){
return '<div class="qgroup"><h3>Questions 1-5</h3><p><i>Do the following statements agree with the claims of the writer? Write <b>YES / NO / NOT GIVEN</b>.</i></p>'+tf(1,'The possible impact of a sedentary lifestyle on the way children perform in the classroom is very worrying.',true)+tf(2,'It is only recently that people have discovered exercise is more beneficial for you when you put more effort into it.',true)+tf(3,'It is unclear what Dr Aric Sigman thinks schools and parents should do.',true)+tf(4,'There are probably a lot of people who disbelieve Dr Sigman’s theory.',true)+tf(5,'Researchers were surprised to discover a link between levels of fitness in Swedish teenagers and their IQ.',true)+'</div><div class="qgroup"><h3>Questions 6-10</h3><p><i>Complete the summary using the list of words, A–I, below.</i></p><div class="box"><b>A</b> ancients &nbsp; <b>B</b> anxiety &nbsp; <b>C</b> discoveries &nbsp; <b>D</b> elderly &nbsp; <b>E</b> exercises<br><b>F</b> anger &nbsp; <b>G</b> performances &nbsp; <b>H</b> possibility &nbsp; <b>I</b> proof</div><p class="summary-text">Dr Sigman believes that when children do physical exercise, they experience less '+selInline(6,['A','B','C','D','E','F','G','H','I'])+' as a result of a chemical change caused by increased blood and oxygen flow to the brain. Other researchers, such as Professor Art Kramer, think there is '+selInline(7,['A','B','C','D','E','F','G','H','I'])+' that some parts of the brain become bigger, and fit children are better than unfit children at doing complicated '+selInline(8,['A','B','C','D','E','F','G','H','I'])+' that require mental thought. Among other things, these scientific '+selInline(9,['A','B','C','D','E','F','G','H','I'])+' could be used to benefit the '+selInline(10,['A','B','C','D','E','F','G','H','I'])+' when it comes to fighting memory loss and keeping the skills that allow them to solve problems.</p></div><div class="qgroup"><h3>Questions 11-13</h3><p>Choose the correct letter, A, B, C or D.</p>'+mcq(11,'Which of the following is true, according to Professor Art Kramer?',['People become less active as they grow older.','Exercising is an effective way of preventing diseases like diabetes.','One particular type of exercise is more effective than others.','When exercising, you should take short breaks during the exercise period.'])+mcq(12,'What did Professor Kramer’s neuroimaging work show?',['Exercising physically alters the brain.','Unfit people have poor memories.','A particular part of the brain becomes more active during exercise.','Exercise can reduce ageing of the brain for up to two years.'])+mcq(13,'What does doing this on line 110 refer to in the final paragraph?',['changing the kinds of food we eat','eating no more than 500 calories a day','eating foods that are high in protein','eating less on certain days'])+'</div>';
}

function render(){partTitle.textContent='Reading Passage 1';var r=ranges[active];partSub.textContent='Read the text and answer questions '+r[0]+'-'+r[1]+'.';left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();drawFooter();left.scrollTop=right.scrollTop=0}
function val(n){if(multiGroups[n]){var boxes=document.querySelectorAll('input[name="'+multiGroups[n]+'"]:checked');return Array.from(boxes).map(b=>b.value).join(',')}var g=document.getElementById('gap'+n);if(g)return g.value;var s=document.getElementById('sel'+n);if(s)return s.value;var r=document.querySelector('input[name="q'+n+'"]:checked');return r?r.value:''}
function save(){for(var n=1;n<=40;n++){var v=val(n);if(v)state[n]=v}}
function restore(){for(var n=1;n<=40;n++){if(!state[n])continue;if(multiGroups[n]){var vals=state[n].split(',');vals.forEach(function(v){var cb=document.querySelector('input[name="'+multiGroups[n]+'"][value="'+v+'"]');if(cb)cb.checked=true});continue}var g=document.getElementById('gap'+n);if(g)g.value=state[n];var s=document.getElementById('sel'+n);if(s)s.value=state[n];var r=document.querySelector('input[name="q'+n+'"][value="'+state[n]+'"]');if(r)r.checked=true}}
function answered(n){return !!state[n]||!!val(n)}
function count(p){var r=ranges[p],c=0;for(var i=r[0];i<=r[1];i++)if(answered(i))c++;return c}
function drawFooter(){save();var h='';[1].forEach(p=>{var r=ranges[p];h+='<div class="partnav"><button class="partlabel" data-part="'+p+'" disabled>Reading Passage 1</button>';if(p===active){h+='<div class="tiles">';for(var n=r[0];n<=r[1];n++)h+='<button class="tile '+(answered(n)?'answered':'')+'" data-q="'+n+'">'+n+'</button>';h+='</div>'}else h+='<span class="count">'+count(p)+' of '+(r[1]-r[0]+1)+'</span>';h+='</div>'});h+='<button class="review" id="review">OK</button>';footer.innerHTML=h}
document.addEventListener('change',()=>{save();drawFooter();checkAutoGrade();sendProgress();});document.addEventListener('input',()=>{save();drawFooter();sendProgress();});function checkAutoGrade(){if(graded)return;var r=ranges[1];for(var n=r[0];n<=r[1];n++)if(!answered(n))return;silentGrade();}function sendProgress(){if(graded)return;try{var r=ranges[1];var items=[];for(var n=r[0];n<=r[1];n++)items.push({n:n,value:state[n]||''});parent.postMessage({type:'cdi-reading-progress',items:items},'*');}catch(e){}}
var lastScore=null;
function renderActive(){left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();if(revealed){regradeCurrent();right.insertAdjacentHTML('afterbegin','<div class="score">Your score: <b>'+lastScore+' / 13</b></div><p style="margin:-8px 0 18px;color:#555">Explanations with the exact location in the passage are shown below each answer.</p>')}drawFooter();left.scrollTop=right.scrollTop=0}
footer.onclick=e=>{var p=e.target.closest('[data-part]');if(p){save();active=+p.dataset.part;renderActive();return}var q=e.target.closest('[data-q]');if(q){var n=+q.dataset.q;(document.getElementById('q'+n)||document.getElementById('gap'+n)||document.getElementById('sel'+n))?.scrollIntoView({behavior:'smooth',block:'center'});return}if(e.target.closest('#review'))review()};
function review(){save();var r=ranges[1];var a=0;for(var n=r[0];n<=r[1];n++)if(answered(n))a++;subwrap.innerHTML='<p>You have answered <b>'+a+'</b> of 13 questions.</p><p><button class="ovrow submit" id="final">Submit test</button></p>';final.onclick=grade;submit.classList.add('show')}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function correct(n,v){if(multiGroups[n]){var parts=(v||'').split(',').map(norm).filter(Boolean);return parts.includes(norm(answers[n]))}return [answers[n]].concat(alt[n]||[]).some(a=>norm(a)===norm(v))}
function explHTML(n){var e=EXPL[n];if(!e)return '';return '<div class="expl"><b>Q'+n+' — correct answer: '+answers[n]+'</b> &nbsp;<span class="expl-loc">('+e.loc+')</span><br>'+e.text+'</div>'}
function markGap(n){var x=document.getElementById('gap'+n);if(!x)return;var ok=correct(n,x.value);x.disabled=true;x.classList.add(ok?'ok':'no');x.insertAdjacentHTML('afterend',(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>')+explHTML(n));return ok}
function markSel(n){var s=document.getElementById('sel'+n);if(!s)return;var ok=correct(n,s.value);s.disabled=true;s.classList.add(ok?'ok':'no');var row=document.getElementById('q'+n);var tag=(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>');if(row){row.insertAdjacentHTML('beforeend',tag);row.insertAdjacentHTML('afterend',explHTML(n))}else{s.insertAdjacentHTML('afterend',tag);var host=s.closest('p')||s;host.insertAdjacentHTML('afterend',explHTML(n))}return ok}
function markRadio(n){var r=document.querySelector('input[name="q'+n+'"]:checked');var ok=r&&correct(n,r.value);document.querySelectorAll('input[name="q'+n+'"]').forEach(i=>i.disabled=true);var box=document.getElementById('q'+n);box.insertAdjacentHTML('beforeend',(ok?'<span class="tag ok">\u2713</span>':'<span class="tag no">\u2718 correct: '+answers[n]+'</span>'));box.insertAdjacentHTML('afterend',explHTML(n));return ok}
function markMulti(group){var qNums=groupQNums[group];var boxes=document.querySelectorAll('input[name="'+group+'"]');var checkedVals=Array.from(boxes).filter(function(b){return b.checked}).map(function(b){return b.value});boxes.forEach(function(b){b.disabled=true});var container=document.getElementById('q_'+group);var tagHtml='';qNums.forEach(function(qn){var ok=checkedVals.includes(answers[qn]);tagHtml+=' '+(ok?'<span class="tag ok">Q'+qn+' \u2713</span>':'<span class="tag no">Q'+qn+' \u2718 correct: '+answers[qn]+'</span>')});container.insertAdjacentHTML('beforeend','<div style="margin-top:8px;">'+tagHtml+'</div>');var explAll='';qNums.forEach(function(qn){explAll+=explHTML(qn)});container.insertAdjacentHTML('afterend',explAll)}
function regradeCurrent(){var r=ranges[active];var doneGroups={};for(var n=r[0];n<=r[1];n++){if(multiGroups[n]){if(!doneGroups[multiGroups[n]]){markMulti(multiGroups[n]);doneGroups[multiGroups[n]]=true}continue}var g=document.getElementById('gap'+n),s=document.getElementById('sel'+n),rad=document.querySelector('input[name="q'+n+'"]');if(g)markGap(n);else if(s)markSel(n);else if(rad)markRadio(n)}}
function silentGrade(){if(graded)return;save();var r=ranges[1];var score=0;for(var n=r[0];n<=r[1];n++)if(correct(n,state[n]||''))score++;lastScore=score;graded=true;try{parent.postMessage({type:'cdi-reading-result',score:lastScore,max:(r[1]-r[0]+1),items:(function(){var arr=[];for(var n=r[0];n<=r[1];n++)arr.push({n:n,value:state[n]||'',correct:correct(n,state[n]||'')});return arr;})()},'*');}catch(e){}}
function grade(){silentGrade();revealed=true;active=1;renderActive();submit.classList.remove('show')}
var drag=false;div.onmousedown=()=>{drag=true;document.body.style.userSelect='none'};window.onmouseup=()=>{drag=false;document.body.style.userSelect=''};window.onmousemove=e=>{if(!drag)return;var r=split.getBoundingClientRect();left.style.width=Math.max(220,Math.min(r.width-240,e.clientX-r.left))+'px'};
split.onmouseup=()=>setTimeout(()=>{var s=getSelection();if(!s||s.isCollapsed||!s.rangeCount){tools.style.display='none';return}var rg=s.getRangeAt(0);if(!split.contains(rg.commonAncestorContainer)){tools.style.display='none';return}var rc=rg.getBoundingClientRect();tools.style.display='flex';tools.style.left=(rc.left+scrollX)+'px';tools.style.top=Math.max(8,rc.top+scrollY-42)+'px'},1);
tools.onclick=e=>{var b=e.target.closest('button'),s=getSelection();if(!b||!s.rangeCount)return;var rg=s.getRangeAt(0);if(b.dataset.act==='hl'){try{var sp=document.createElement('span');sp.className='hl';rg.surroundContents(sp)}catch(_){document.execCommand('hiliteColor',false,'#ffe45c')}}else document.querySelectorAll('.hl').forEach(h=>h.replaceWith(document.createTextNode(h.textContent)));s.removeAllRanges();tools.style.display='none'};
