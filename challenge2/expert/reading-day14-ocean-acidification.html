</style></head><body><header class="top"><button>|||</button><button>o</button><button>=</button></header><div class="banner"><h2 id="partTitle"></h2><p id="partSub"></p></div><div class="split" id="split"><section class="pane left" id="left"></section><div class="divider" id="div"></div><section class="pane right" id="right"></section></div><footer class="bar" id="footer"></footer><div class="tools" id="tools"><button data-act="hl">Highlight</button><button data-act="clear">Clear</button></div><div class="overlay" id="submit"><div class="ovh"><h2>Submission page</h2><button class="close" onclick="submit.classList.remove('show')">x</button></div><div class="ovlist" id="subwrap"></div></div><script>

var active=1,graded=false,revealed=false,state={},ranges={1:[1,13]};
var DATA = {"passages": {"1": "<h1>Ocean Acidification and the Future of Coral Reefs</h1><p class=\"sub\">Absorbing carbon dioxide has quietly reshaped ocean chemistry itself.</p><div class=\"para\">A</div><p>Roughly a quarter of the carbon dioxide that human activity releases into the atmosphere each year is eventually absorbed by the world’s oceans, a process that has, until recently, been described almost entirely as a benefit: an invisible service performed by seawater that slows the rate of atmospheric warming. Over the past two decades, however, chemists and marine biologists have documented a less welcome consequence of this absorption, one that unfolds not in the atmosphere but within the water itself.</p><div class=\"para\">B</div><p>When carbon dioxide dissolves in seawater, it reacts with water molecules to form carbonic acid, a weak acid that nonetheless measurably lowers the pH of the surrounding water when it accumulates in sufficient quantities. Since the beginning of the industrial era, average ocean surface pH is estimated to have fallen by roughly 0.1 units, a figure that sounds modest until it is understood that pH is measured on a logarithmic scale, meaning this apparently small shift actually represents an increase of around thirty percent in the concentration of hydrogen ions, the chemical signature of acidity, in seawater.</p><div class=\"para\">C</div><p>For coral reefs, this shift in chemistry poses a direct structural threat. Reef-building corals construct their skeletons from calcium carbonate, extracting the necessary calcium and carbonate ions from the surrounding seawater. As ocean water becomes more acidic, carbonate ions become less freely available, since many of them react instead with the additional hydrogen ions introduced by dissolved carbon dioxide. Laboratory experiments simulating projected future ocean chemistry have repeatedly shown corals growing their skeletons more slowly under these conditions, and in sufficiently acidic water, existing calcium carbonate structures can begin to dissolve outright rather than simply growing more slowly.</p><div class=\"para\">D</div><p>Acidification rarely acts alone. Coral reefs already under stress from rising sea temperatures, which trigger the phenomenon known as coral bleaching, appear considerably less able to tolerate the additional burden of a shifting chemical environment than reefs left otherwise undisturbed. Some coral species have shown a limited capacity to adjust their internal chemistry to partially compensate for more acidic surrounding water, an ability that varies considerably between species and that appears to come at a measurable energetic cost, leaving less energy available for growth or reproduction. This variation has led some researchers to suggest that future reefs may end up dominated by a smaller number of unusually tolerant species, rather than disappearing outright, though the resulting ecosystems would likely support considerably less biodiversity than reefs support at present.</p><div class=\"para\">E</div><p>The economic stakes of this decline are considerable. Coral reefs are estimated to support several hundred million people worldwide, directly or indirectly, through fisheries, tourism revenue, and protection from storm surges, despite covering a strikingly small fraction of the ocean floor. Policymakers attempting to address the problem face an unusual difficulty: unlike many localised forms of marine pollution, ocean acidification cannot be meaningfully addressed through local regulation alone, since it is driven by the same atmospheric carbon dioxide responsible for global climate change. Genuinely slowing the process, most researchers agree, would require exactly the kind of large-scale reduction in global emissions that has, to date, proved difficult to achieve.</p>"}, "answers": {"1": "A", "2": "B", "3": "C", "4": "D", "5": "E", "6": "B", "7": "C", "8": "A", "9": "B", "10": "A", "11": "C", "12": "0.1", "13": "storm surges"}, "alt": {"12": ["0.1 units"]}, "expl": {"1": {"loc": "Para A", "text": "The shift from viewing ocean CO2 absorption as purely beneficial to partly harmful is described in paragraph A."}, "2": {"loc": "Para B", "text": "The thirty-percent rise in hydrogen ion concentration is given in paragraph B."}, "3": {"loc": "Para C", "text": "The explanation of why coral skeletons form more slowly is given in paragraph C."}, "4": {"loc": "Para D", "text": "The suggestion that future reefs may have far fewer species is made in paragraph D."}, "5": {"loc": "Para E", "text": "The reason local regulation alone cannot solve the problem is given in paragraph E."}, "6": {"loc": "Para A", "text": "Ocean CO2 absorption was originally seen as something that 'slows the rate of atmospheric warming' → B."}, "7": {"loc": "Para C", "text": "'many of them react instead with the additional hydrogen ions' → C."}, "8": {"loc": "Para D", "text": "Adjusting internal chemistry 'appears to come at a measurable energetic cost, leaving less energy available for growth or reproduction' → A."}, "9": {"loc": "Para E", "text": "'it is driven by the same atmospheric carbon dioxide responsible for global climate change' → B."}, "10": {"loc": "Para E", "text": "Fisheries and tourism revenue are named as economic benefits → A correct."}, "11": {"loc": "Para E", "text": "Protection from storm surges is named as an economic benefit → C correct."}, "12": {"loc": "Para B", "text": "'average ocean surface pH is estimated to have fallen by roughly 0.1 units' → 0.1."}, "13": {"loc": "Para E", "text": "'protection from storm surges' → storm surges."}}};

var passages=DATA.passages, answers=DATA.answers, alt=DATA.alt, EXPL=DATA.expl;
function tf(n,t,yn){var opts=yn?['YES','NO','NOT GIVEN']:['TRUE','FALSE','NOT GIVEN'];return '<div class="tf-row" id="q'+n+'"><div class="statement"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="options">'+opts.map(o=>'<label><input type="radio" name="q'+n+'" value="'+o+'"> '+o+'</label>').join('')+'</div></div>'}
function gap(n){return '<span class="qnum">'+n+'</span><input class="gap" id="gap'+n+'">'}
function sel(n,t,letters){return '<div class="row" id="q'+n+'"><span class="qnum">'+n+'</span><span class="txt">'+t+'</span><select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select></div>'}
function selInline(n,letters){return '<select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select>'}
function mcq(n,t,opts){return '<div class="mcq" id="q'+n+'"><div class="prompt"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="choice-options">'+opts.map((o,i)=>'<label class="choice-option"><input type="radio" name="q'+n+'" value="'+'ABCD'[i]+'"> <b>'+'ABCD'[i]+'</b> '+o+'</label>').join('')+'</div></div>'}
var multiGroups={}, groupQNums={};
function multiSel(qA,qB,promptText,options){var name='g'+qA+'_'+qB;multiGroups[qA]=name;multiGroups[qB]=name;groupQNums[name]=[qA,qB];return '<div id="q_'+name+'" class="tf-row"><div class="statement"><span class="qnum">'+qA+', '+qB+'</span><span>'+promptText+'</span></div><div class="options">'+options.map(o=>'<label><input type="checkbox" name="'+name+'" value="'+o.letter+'"> <b>'+o.letter+'</b> '+o.text+'</label>').join('')+'</div></div>'}

function qhtml(p){
return "<div class=\"qgroup\"><h3>Questions 1-5</h3><p><i>The passage has five paragraphs, A–E. Which paragraph contains the following information?</i></p><p><b><i>NB</i></b> <i>You may use any letter more than once.</i></p>"+sel(1,"A shift in how a particular process has been perceived, from purely beneficial to partly harmful.",["A", "B", "C", "D", "E"])+sel(2,"A statistic showing that a seemingly small pH change actually represents a much larger change in acidity.",["A", "B", "C", "D", "E"])+sel(3,"An explanation of why coral skeletons may become harder to build as ocean chemistry changes.",["A", "B", "C", "D", "E"])+sel(4,"A suggestion that future reefs might survive with far fewer coral species than today.",["A", "B", "C", "D", "E"])+sel(5,"A reason why the problem cannot be solved through local action alone.",["A", "B", "C", "D", "E"])+"</div><div class=\"qgroup\"><h3>Questions 6-9</h3><p><i>Choose the correct letter, A, B, C or D.</i></p>"+mcq(6,"According to the passage, ocean absorption of carbon dioxide was originally regarded mainly as:",["a serious threat to marine ecosystems", "a beneficial process that reduces atmospheric warming", "an entirely new discovery made in the last two decades", "irrelevant to global climate change"])+mcq(7,"Why does increased ocean acidity make it harder for corals to obtain carbonate ions?",["Carbonate ions evaporate more quickly in warmer water.", "Corals stop producing calcium carbonate altogether.", "Additional hydrogen ions react with carbonate ions, making them less available.", "Carbonate ions are only found in freshwater environments."])+mcq(8,"What does the passage suggest about coral species that can adjust their internal chemistry?",["The adjustment costs them energy that could otherwise support growth or reproduction.", "They are immune to the effects of rising sea temperatures.", "They no longer need calcium carbonate to build skeletons.", "They have been observed only in laboratory conditions, never in the wild."])+mcq(9,"What makes ocean acidification particularly difficult for policymakers to address, according to the passage?",["Scientists disagree about whether it is actually happening.", "It is caused by global emissions, so local regulation alone cannot solve it.", "It affects only a small number of remote reefs.", "There is no accurate way to measure ocean pH."])+"</div><div class=\"qgroup\"><h3>Questions 10 and 11</h3><p><i>Choose </i><b>TWO</b><i> letters, A–E. Which </i><b>TWO</b><i> of the following are given in the passage as reasons coral reefs matter economically to people?</i></p>"+multiSel(10,11,"",[{"letter": "A", "text": "They provide direct income through fisheries and tourism."}, {"letter": "B", "text": "They are the primary source of the world's drinking water."}, {"letter": "C", "text": "They offer protection from storm surges."}, {"letter": "D", "text": "They are the main source of calcium carbonate for industry."}, {"letter": "E", "text": "They absorb a quarter of all global carbon dioxide emissions."}])+"</div><div class=\"qgroup\"><h3>Questions 12-13</h3><p><i>Complete the sentences below. Write </i><b>NO MORE THAN TWO WORDS</b><i> from the passage for each answer.</i></p><p>12. Since the industrial era began, average ocean surface pH has fallen by approximately "+gap(12)+" pH units.</p><p>13. Coral reefs are estimated to support several hundred million people through fisheries, tourism, and protection from "+gap(13)+".</p></div>";
}

function render(){partTitle.textContent='Reading Passage';var r=ranges[active];partSub.textContent='Read the text and answer questions '+r[0]+'-'+r[1]+'.';left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();drawFooter();left.scrollTop=right.scrollTop=0}
function val(n){if(multiGroups[n]){var boxes=document.querySelectorAll('input[name="'+multiGroups[n]+'"]:checked');return Array.from(boxes).map(b=>b.value).join(',')}var g=document.getElementById('gap'+n);if(g)return g.value;var s=document.getElementById('sel'+n);if(s)return s.value;var r=document.querySelector('input[name="q'+n+'"]:checked');return r?r.value:''}
function save(){for(var n=1;n<=40;n++){var v=val(n);if(v)state[n]=v}}
function restore(){for(var n=1;n<=40;n++){if(!state[n])continue;if(multiGroups[n]){var vals=state[n].split(',');vals.forEach(function(v){var cb=document.querySelector('input[name="'+multiGroups[n]+'"][value="'+v+'"]');if(cb)cb.checked=true});continue}var g=document.getElementById('gap'+n);if(g)g.value=state[n];var s=document.getElementById('sel'+n);if(s)s.value=state[n];var r=document.querySelector('input[name="q'+n+'"][value="'+state[n]+'"]');if(r)r.checked=true}}
function answered(n){return !!state[n]||!!val(n)}
function count(p){var r=ranges[p],c=0;for(var i=r[0];i<=r[1];i++)if(answered(i))c++;return c}
function drawFooter(){save();var h='';[1].forEach(p=>{var r=ranges[p];h+='<div class="partnav"><button class="partlabel" data-part="'+p+'" disabled>Reading Passage</button>';if(p===active){h+='<div class="tiles">';for(var n=r[0];n<=r[1];n++)h+='<button class="tile '+(answered(n)?'answered':'')+'" data-q="'+n+'">'+n+'</button>';h+='</div>'}else h+='<span class="count">'+count(p)+' of '+(r[1]-r[0]+1)+'</span>';h+='</div>'});h+='<button class="review" id="review">OK</button>';footer.innerHTML=h}
document.addEventListener('change',()=>{save();drawFooter();checkAutoGrade();sendProgress();});document.addEventListener('input',()=>{save();drawFooter();sendProgress();});function checkAutoGrade(){if(graded)return;var r=ranges[1];for(var n=r[0];n<=r[1];n++)if(!answered(n))return;silentGrade();}function sendProgress(){if(graded)return;try{var r=ranges[1];var items=[];for(var n=r[0];n<=r[1];n++)items.push({n:n,value:state[n]||''});parent.postMessage({type:'cdi-reading-progress',items:items},'*');}catch(e){}}
var lastScore=null;
function renderActive(){left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();if(revealed){regradeCurrent();right.insertAdjacentHTML('afterbegin','<div class="score">Your score: <b>'+lastScore+' / 13</b></div><p style="margin:-8px 0 18px;color:#555">Explanations with the exact location in the passage are shown below each answer.</p>')}drawFooter();left.scrollTop=right.scrollTop=0}
footer.onclick=e=>{var p=e.target.closest('[data-part]');if(p){save();active=+p.dataset.part;renderActive();return}var q=e.target.closest('[data-q]');if(q){var n=+q.dataset.q;(document.getElementById('q'+n)||document.getElementById('gap'+n)||document.getElementById('sel'+n))?.scrollIntoView({behavior:'smooth',block:'center'});return}if(e.target.closest('#review'))review()};
function review(){save();var r=ranges[1];var a=0;for(var n=r[0];n<=r[1];n++)if(answered(n))a++;subwrap.innerHTML='<p>You have answered <b>'+a+'</b> of 13 questions.</p><p><button class="ovrow submit" id="final">Submit test</button></p>';final.onclick=grade;submit.classList.add('show')}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function correct(n,v){if(multiGroups[n]){var parts=(v||'').split(',').map(norm).filter(Boolean);return parts.includes(norm(answers[n]))}return [answers[n]].concat(alt[n]||[]).some(a=>norm(a)===norm(v))}
function explHTML(n){var e=EXPL[n];if(!e)return '';return '<div class="expl"><b>Q'+n+' — correct answer: '+answers[n]+'</b> &nbsp;<span class="expl-loc">('+e.loc+')</span><br>'+e.text+'</div>'}
function markGap(n){var x=document.getElementById('gap'+n);if(!x)return;var ok=correct(n,x.value);x.disabled=true;x.classList.add(ok?'ok':'no');x.insertAdjacentHTML('afterend',(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>')+explHTML(n));return ok}
function markSel(n){var s=document.getElementById('sel'+n);if(!s)return;var ok=correct(n,s.value);s.disabled=true;s.classList.add(ok?'ok':'no');var row=document.getElementById('q'+n);var tag=(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>');if(row){row.insertAdjacentHTML('beforeend',tag);row.insertAdjacentHTML('afterend',explHTML(n))}else{s.insertAdjacentHTML('afterend',tag);var host=s.closest('p')||s;host.insertAdjacentHTML('afterend',explHTML(n))}return ok}
function markRadio(n){var r=document.querySelector('input[name="q'+n+'"]:checked');var ok=r&&correct(n,r.value);document.querySelectorAll('input[name="q'+n+'"]').forEach(i=>i.disabled=true);var box=document.getElementById('q'+n);box.insertAdjacentHTML('beforeend',(ok?'<span class="tag ok">\u2713</span>':'<span class="tag no">\u2718 correct: '+answers[n]+'</span>'));box.insertAdjacentHTML('afterend',explHTML(n));return ok}
function markMulti(group){var qNums=groupQNums[group];var boxes=document.querySelectorAll('input[name="'+group+'"]');var checkedVals=Array.from(boxes).filter(function(b){return b.checked}).map(function(b){return b.value});boxes.forEach(function(b){b.disabled=true});var container=document.getElementById('q_'+group);var tagHtml='';qNums.forEach(function(qn){var ok=checkedVals.includes(answers[qn]);tagHtml+=' '+(ok?'<span class="tag ok">Q'+qn+' \u2713</span>':'<span class="tag no">Q'+qn+' \u2718 correct: '+answers[qn]+'</span>')});container.insertAdjacentHTML('beforeend','<div style="margin-top:8px;">'+tagHtml+'</div>');var explAll='';qNums.forEach(function(qn){explAll+=explHTML(qn)});container.insertAdjacentHTML('afterend',explAll)}
function regradeCurrent(){var r=ranges[active];var doneGroups={};for(var n=r[0];n<=r[1];n++){if(multiGroups[n]){if(!doneGroups[multiGroups[n]]){markMulti(multiGroups[n]);doneGroups[multiGroups[n]]=true}continue}var g=document.getElementById('gap'+n),s=document.getElementById('sel'+n),rad=document.querySelector('input[name="q'+n+'"]');if(g)markGap(n);else if(s)markSel(n);else if(rad)markRadio(n)}}
function silentGrade(){if(graded)return;save();var r=ranges[1];var score=0;for(var n=r[0];n<=r[1];n++)if(correct(n,state[n]||''))score++;lastScore=score;graded=true;try{parent.postMessage({type:'cdi-reading-result',score:lastScore,max:(r[1]-r[0]+1),items:(function(){var arr=[];for(var n=r[0];n<=r[1];n++)arr.push({n:n,value:state[n]||'',correct:correct(n,state[n]||'')});return arr;})()},'*');}catch(e){}}
function grade(){silentGrade();revealed=true;active=1;renderActive();submit.classList.remove('show')}
var drag=false;div.onmousedown=()=>{drag=true;document.body.style.userSelect='none'};window.onmouseup=()=>{drag=false;document.body.style.userSelect=''};window.onmousemove=e=>{if(!drag)return;var r=split.getBoundingClientRect();left.style.width=Math.max(220,Math.min(r.width-240,e.clientX-r.left))+'px'};
split.onmouseup=()=>setTimeout(()=>{var s=getSelection();if(!s||s.isCollapsed||!s.rangeCount){tools.style.display='none';return}var rg=s.getRangeAt(0);if(!split.contains(rg.commonAncestorContainer)){tools.style.display='none';return}var rc=rg.getBoundingClientRect();tools.style.display='flex';tools.style.left=(rc.left+scrollX)+'px';tools.style.top=Math.max(8,rc.top+scrollY-42)+'px'},1);
tools.onclick=e=>{var b=e.target.closest('button'),s=getSelection();if(!b||!s.rangeCount)return;var rg=s.getRangeAt(0);if(b.dataset.act==='hl'){try{var sp=document.createElement('span');sp.className='hl';rg.surroundContents(sp)}catch(_){document.execCommand('hiliteColor',false,'#ffe45c')}}else document.querySelectorAll('.hl').forEach(h=>h.replaceWith(document.createTextNode(h.textContent)));s.removeAllRanges();tools.style.display='none'};
render();
window.addEventListener('message',function(event){var d=event.data;if(!d||d.type!=='cdi-reading-restore')return;(d.items||[]).forEach(function(item){if(item.value)state[item.n]=item.value;});restore();drawFooter();});
})();
