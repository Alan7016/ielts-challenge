</style></head><body><header class="top"><button>|||</button><button>o</button><button>=</button></header><div class="banner"><h2 id="partTitle"></h2><p id="partSub"></p></div><div class="split" id="split"><section class="pane left" id="left"></section><div class="divider" id="div"></div><section class="pane right" id="right"></section></div><footer class="bar" id="footer"></footer><div class="tools" id="tools"><button data-act="hl">Highlight</button><button data-act="clear">Clear</button></div><div class="overlay" id="submit"><div class="ovh"><h2>Submission page</h2><button class="close" onclick="submit.classList.remove('show')">x</button></div><div class="ovlist" id="subwrap"></div></div><script>

var active=1,graded=false,state={},ranges={1:[1,13]};
var DATA = {"passages": {"1": "<h1>Learning Color Words</h1>\n<p class=\"sub\">Young children struggle with color concepts, and the reason for this may have something to do with how we use the words that describe them.</p>\n<div class=\"para\">A</div>\n<p>In the course of the first few years of their lives, children who are brought up in English-speaking homes successfully master the use of hundreds of words. Words for objects, actions, emotions, and many other aspects of the physical world quickly become part of their infant repertoire. For some reason, however, when it comes to learning color words, the same children perform very badly. At the age of four months, babies can distinguish between basic color categories. Yet it turns out they do this much the same way as blind children. 'Blue' and 'yellow' appear in older children's expressive language in answer to questions such as 'What color is this?', but their mapping of objects to individual colors is haphazard and interchangeable. If shown a blue cup and asked about its color, typical two-year-olds seem as likely to come up with 'red' as 'blue.' Even after hundreds of training trials, children as old as four may still end up being unable to accurately sort objects by color.</p>\n<div class=\"para\">B</div>\n<p>In an effort to work out why this is, cognitive scientists at Stanford University in California hypothesized that children's incompetence at color-word learning may be directly linked to the way these words are used in English. While word order for color adjectives varies, they are used overwhelmingly in pre-nominal position (e.g. 'blue cup'); in other words, the adjective comes before the noun it is describing. This is in contrast to post-nominal position (e.g. 'The cup is blue') where the adjective comes after the noun. It seems that the difficulty children have may not be caused by any unique property of color, or indeed, of the world. Rather, it may simply come down to the challenge of having to make predictions from color words to the objects they refer to, instead of being able to make predictions from the world of objects to the color words.</p>\n<p>To illustrate, the word 'chair' has a meaning that applies to the somewhat varied set of entities in the world that people use for sitting on. Chairs have features, such as arms and legs and backs, that are combined to some degree in a systematic way; they turn up in a range of chairs of different shapes, sizes, and ages. It could be said that children learn to narrow down the set of cues that make up a chair and in this way they learn the concept associated with that word. On the other hand, color words tend to be unique and not bound to other specific co-occurring features; there is nothing systematic about color words to help cue their meaning. In the speech that adults direct at children, color adjectives occur pre-nominally ('blue cup') around 70 percent of the time. This suggests that most of what children hear from adults will, in fact, be unhelpful in learning what color words refer to.</p>\n<div class=\"para\">C</div>\n<p>To explore this idea further, the research team recruited 41 English children aged between 23 and 29 months and carried out a three-phase experiment. It consisted of a pre-test, followed by training in the use of color words, and finally a post-test that was identical to the pre-test. The pre- and post-test materials comprised six objects that were novel to the children. There were three examples of each object in each of three colors—red, yellow, and blue. The objects were presented on trays, and in both tests, the children were asked to pick out objects in response to requests in which the color word was either a prenominal ('Which is the red one?') or a post-nominal ('Which one is red?').</p>\n<p>In the training, the children were introduced to a 'magic bucket' containing five sets of items familiar to 26-month-olds (balls, cups, crayons, glasses, and toy bears) in each of the three colors. The training was set up so that half the children were presented with the items one by one and heard them labelled with color words used pre-nominally ('This is a red crayon'), while the other half were introduced to the same items described with a post-nominal color word ('This crayon is red'). After the training, the children repeated the selection task on the unknown items in the post-test. To assess the quality of children's understanding of color words, and the effect of each type of training, correct choices on items that were consistent across the pre- and post-tests were used to measure children's color knowledge.</p>\n<div class=\"para\">D</div>\n<p>Individual analysis of pre- and post-test data, which confirmed parental vocabulary reports, showed the children had at least some knowledge of the three colour words: they averaged two out of three correct choices in response to both pre- and post-nominal question types, which, it has been pointed out, is better than chance. When children's responses to the question types were assessed independently, performance was at its most consistent when children were both trained and tested on post-nominal adjectives, and worst when trained on pre-nominal adjectives and tested on post-nominal adjectives. Only children who had been trained with post-nominal color-word presentation and then tested with post-nominal question types were significantly more accurate than chance. Comparing the pre- and post-test scores across each condition revealed a significant decline in performance when children were both pre- and post-tested with questions that placed the color words pre-nominally.</p>\n<p>As predicted, when children are exposed to color adjectives in post-nominal position, they learn them rapidly (after just five training trials per color); when they are presented with them pre-nominally, as English overwhelmingly tends to do, children show no signs of learning.</p>"}, "answers": {"1": "iv", "2": "i", "3": "iii", "4": "vii", "5": "training trials", "6": "position", "7": "features", "8": "meaning", "9": "unhelpful", "10": "A", "11": "C", "12": "C", "13": "D"}, "alt": {"6": ["word order"], "8": ["concept"]}, "expl": {"1": {"loc": "Section A", "text": "Children master hundreds of words easily but do surprisingly badly with colour words, even by age four → iv, a curious state of affairs."}, "2": {"loc": "Section B", "text": "'cognitive scientists... hypothesized that children's incompetence at color-word learning may be directly linked to the way these words are used' → i, a possible explanation."}, "3": {"loc": "Section C", "text": "'the research team recruited 41 English children... and carried out a three-phase experiment' → iii, checking out the theory."}, "4": {"loc": "Section D", "text": "'As predicted, when children are exposed to color adjectives in post-nominal position, they learn them rapidly... pre-nominally... children show no signs of learning' — the results confirm what was expected → vii, some unsurprising data."}, "5": {"loc": "Section A", "text": "'Even after hundreds of training trials, children as old as four may still end up being unable to accurately sort objects by color' → 'training trials'."}, "6": {"loc": "Section B", "text": "'they are used overwhelmingly in pre-nominal position... in contrast to post-nominal position' → 'position'."}, "7": {"loc": "Section B", "text": "'Chairs have features, such as arms and legs and backs, that are combined to some degree in a systematic way' → 'features'."}, "8": {"loc": "Section B", "text": "'there is nothing systematic about color words to help cue their meaning' → 'meaning'."}, "9": {"loc": "Section B", "text": "'most of what children hear from adults will, in fact, be unhelpful in learning what color words refer to' → 'unhelpful'."}, "10": {"loc": "Section C", "text": "'The pre- and post-test materials comprised six objects that were novel to the children' → A."}, "11": {"loc": "Section C", "text": "'half the children were presented with the items... labelled with color words used pre-nominally... while the other half were introduced to the same items described with a post-nominal color word' → C, two training groups."}, "12": {"loc": "Section D", "text": "'performance was at its most consistent when children were both trained and tested on post-nominal adjectives... Only children who had been trained with post-nominal color-word presentation and then tested with post-nominal question types were significantly more accurate than chance' → C."}, "13": {"loc": "Section D", "text": "'a significant decline in performance when children were both pre- and post-tested with questions that placed the color words pre-nominally' → D."}}};
var passages=DATA.passages, answers=DATA.answers, alt=DATA.alt, EXPL=DATA.expl;
function tf(n,t,yn){var opts=yn?['YES','NO','NOT GIVEN']:['TRUE','FALSE','NOT GIVEN'];return '<div class="tf-row" id="q'+n+'"><div class="statement"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="options">'+opts.map(o=>'<label><input type="radio" name="q'+n+'" value="'+o+'"> '+o+'</label>').join('')+'</div></div>'}
function gap(n){return '<span class="qnum">'+n+'</span><input class="gap" id="gap'+n+'">'}
function sel(n,t,letters){return '<div class="row" id="q'+n+'"><span class="qnum">'+n+'</span><span class="txt">'+t+'</span><select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select></div>'}
function selInline(n,letters){return '<select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select>'}
function mcq(n,t,opts){return '<div class="mcq" id="q'+n+'"><div class="prompt"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="choice-options">'+opts.map((o,i)=>'<label class="choice-option"><input type="radio" name="q'+n+'" value="'+'ABCD'[i]+'"> <b>'+'ABCD'[i]+'</b> '+o+'</label>').join('')+'</div></div>'}
var multiGroups={}, groupQNums={};
function multiSel(qA,qB,promptText,options){var name='g'+qA+'_'+qB;multiGroups[qA]=name;multiGroups[qB]=name;groupQNums[name]=[qA,qB];return '<div id="q_'+name+'" class="tf-row"><div class="statement"><span class="qnum">'+qA+', '+qB+'</span><span>'+promptText+'</span></div><div class="options">'+options.map(o=>'<label><input type="checkbox" name="'+name+'" value="'+o.letter+'"> <b>'+o.letter+'</b> '+o.text+'</label>').join('')+'</div></div>'}

function qhtml(p){
return '<div class="qgroup"><h3>Questions 1-4</h3><p><i>The Reading Passage has four sections, A–D. Choose the correct heading for each section from the list of headings below.</i></p><div class="box"><b>i</b> A possible explanation<br><b>ii</b> Why names of objects are unhelpful<br><b>iii</b> Checking out the theory<br><b>iv</b> A curious state of affairs<br><b>v</b> The need to look at how words are formed<br><b>vi</b> How age impacts on learning colours<br><b>vii</b> Some unsurprising data</div>'+sel(1,'Section A',['i','ii','iii','iv','v','vi','vii'])+sel(2,'Section B',['i','ii','iii','iv','v','vi','vii'])+sel(3,'Section C',['i','ii','iii','iv','v','vi','vii'])+sel(4,'Section D',['i','ii','iii','iv','v','vi','vii'])+'</div><div class="qgroup"><h3>Questions 5-9</h3><p><i>Complete the summary below. Choose <b>NO MORE THAN TWO WORDS</b> from the passage for each answer.</i></p><p class="summary-text"><b>THE HYPOTHESIS</b><br>Children learn many words quite quickly, but their ability to learn colour words takes longer than expected. In fact, despite '+gap(5)+', many four-year-olds still struggle to arrange objects into colour categories. Scientists have hypothesised that this is due to the '+gap(6)+' of the adjectives in a phrase or sentence and the challenges this presents.<br><br>While objects consist of a number of '+gap(7)+' that can be used to recognise other similar objects, the '+gap(8)+' of a colour cannot be developed using the same approach. As a consequence, the way colour words tend to be used in English may be '+gap(9)+' to children.</p></div><div class="qgroup"><h3>Questions 10 and 11</h3><p>Choose <b>TWO</b> letters, A–E. Which <b>TWO</b> of the following statements about the experiment are true?</p>'+multiSel(10,11,'',[{letter:'A',text:'The children were unfamiliar with the objects used in the pre- and post-test.'},{letter:'B',text:'The children had to place the pre- and post-test objects onto coloured trays.'},{letter:'C',text:'The training was conducted by dividing the children into two groups.'},{letter:'D',text:'Pre-nominal questions were used less frequently than post-nominal questions in the training.'},{letter:'E',text:'The researchers were looking for inconsistencies in children’s knowledge of word order.'}])+'</div><div class="qgroup"><h3>Questions 12 and 13</h3><p>Choose <b>TWO</b> letters, A–E. Which <b>TWO</b> of the following outcomes are reported in the passage?</p>'+multiSel(12,13,'',[{letter:'A',text:'Average results contradicted parental assessment of children’s knowledge.'},{letter:'B',text:'Children who were post-tested using post-nominal adjectives performed well, regardless of the type of training.'},{letter:'C',text:'Greatest levels of improvement were achieved by children who were trained and post-tested using post-nominal adjectives.'},{letter:'D',text:'Some children performed less well in the post-test than in the pre-test.'},{letter:'E',text:'Some children were unable to accurately name any of the colours in the pre- and post-tests.'}])+'</div>';
}

function render(){partTitle.textContent='Reading Passage 1';var r=ranges[active];partSub.textContent='Read the text and answer questions '+r[0]+'-'+r[1]+'.';left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();drawFooter();left.scrollTop=right.scrollTop=0}
function val(n){if(multiGroups[n]){var boxes=document.querySelectorAll('input[name="'+multiGroups[n]+'"]:checked');return Array.from(boxes).map(b=>b.value).join(',')}var g=document.getElementById('gap'+n);if(g)return g.value;var s=document.getElementById('sel'+n);if(s)return s.value;var r=document.querySelector('input[name="q'+n+'"]:checked');return r?r.value:''}
function save(){for(var n=1;n<=40;n++){var v=val(n);if(v)state[n]=v}}
function restore(){for(var n=1;n<=40;n++){if(!state[n])continue;if(multiGroups[n]){var vals=state[n].split(',');vals.forEach(function(v){var cb=document.querySelector('input[name="'+multiGroups[n]+'"][value="'+v+'"]');if(cb)cb.checked=true});continue}var g=document.getElementById('gap'+n);if(g)g.value=state[n];var s=document.getElementById('sel'+n);if(s)s.value=state[n];var r=document.querySelector('input[name="q'+n+'"][value="'+state[n]+'"]');if(r)r.checked=true}}
function answered(n){return !!state[n]||!!val(n)}
function count(p){var r=ranges[p],c=0;for(var i=r[0];i<=r[1];i++)if(answered(i))c++;return c}
function drawFooter(){save();var h='';[1].forEach(p=>{var r=ranges[p];h+='<div class="partnav"><button class="partlabel" data-part="'+p+'" disabled>Reading Passage 1</button>';if(p===active){h+='<div class="tiles">';for(var n=r[0];n<=r[1];n++)h+='<button class="tile '+(answered(n)?'answered':'')+'" data-q="'+n+'">'+n+'</button>';h+='</div>'}else h+='<span class="count">'+count(p)+' of '+(r[1]-r[0]+1)+'</span>';h+='</div>'});h+='<button class="review" id="review">OK</button>';footer.innerHTML=h}
var inputTimer=null;
function postProgress(){if(graded)return;var items=[];for(var n=1;n<=40;n++)if(state[n])items.push({n:n,value:state[n]});try{window.parent.postMessage({type:'cdi-reading-progress',items:items,active:active},'*')}catch(e){}}
function postProgressSoon(){clearTimeout(inputTimer);inputTimer=setTimeout(postProgress,500)}
document.addEventListener('change',()=>{save();drawFooter();postProgress()});
document.addEventListener('input',()=>{save();drawFooter();postProgressSoon()});
document.addEventListener('pagehide',()=>{clearTimeout(inputTimer);save();postProgress()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){clearTimeout(inputTimer);save();postProgress()}});
window.addEventListener('message',function(e){var d=e.data;if(!d||d.type!=='cdi-reading-restore')return;(d.items||[]).forEach(function(it){if(it.value)state[it.n]=it.value});active=d.active||1;if(d.graded){graded=true;var sc=0;for(var n=1;n<=13;n++)if(correct(n,state[n]||''))sc++;lastScore=sc}renderActive()});
var lastScore=null;
function renderActive(){left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();if(graded){regradeCurrent();right.insertAdjacentHTML('afterbegin','<div class="score">Your score: <b>'+lastScore+' / 13</b></div><p style="margin:-8px 0 18px;color:#555">Explanations with the exact location in the passage are shown below each answer.</p>')}drawFooter();left.scrollTop=right.scrollTop=0}
footer.onclick=e=>{var p=e.target.closest('[data-part]');if(p){save();active=+p.dataset.part;renderActive();return}var q=e.target.closest('[data-q]');if(q){var n=+q.dataset.q;(document.getElementById('q'+n)||document.getElementById('gap'+n)||document.getElementById('sel'+n))?.scrollIntoView({behavior:'smooth',block:'center'});return}if(e.target.closest('#review'))review()};
function review(){save();var a=0;for(var n=1;n<=13;n++)if(answered(n))a++;subwrap.innerHTML='<p>You have answered <b>'+a+'</b> of 13 questions.</p><p><button class="ovrow submit" id="final">Submit test</button></p>';final.onclick=grade;submit.classList.add('show')}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function correct(n,v){if(multiGroups[n]){var parts=(v||'').split(',').map(norm).filter(Boolean);return parts.includes(norm(answers[n]))}return [answers[n]].concat(alt[n]||[]).some(a=>norm(a)===norm(v))}
function explHTML(n){var e=EXPL[n];if(!e)return '';return '<div class="expl"><b>Q'+n+' — correct answer: '+answers[n]+'</b> &nbsp;<span class="expl-loc">('+e.loc+')</span><br>'+e.text+'</div>'}
function markGap(n){var x=document.getElementById('gap'+n);if(!x)return;var ok=correct(n,x.value);x.disabled=true;x.classList.add(ok?'ok':'no');x.insertAdjacentHTML('afterend',(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>')+explHTML(n));return ok}
function markSel(n){var s=document.getElementById('sel'+n);if(!s)return;var ok=correct(n,s.value);s.disabled=true;s.classList.add(ok?'ok':'no');var row=document.getElementById('q'+n);var tag=(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>');if(row){row.insertAdjacentHTML('beforeend',tag);row.insertAdjacentHTML('afterend',explHTML(n))}else{s.insertAdjacentHTML('afterend',tag);var host=s.closest('p')||s;host.insertAdjacentHTML('afterend',explHTML(n))}return ok}
function markRadio(n){var r=document.querySelector('input[name="q'+n+'"]:checked');var ok=r&&correct(n,r.value);document.querySelectorAll('input[name="q'+n+'"]').forEach(i=>i.disabled=true);var box=document.getElementById('q'+n);box.insertAdjacentHTML('beforeend',(ok?'<span class="tag ok">\u2713</span>':'<span class="tag no">\u2718 correct: '+answers[n]+'</span>'));box.insertAdjacentHTML('afterend',explHTML(n));return ok}
function markMulti(group){var qNums=groupQNums[group];var boxes=document.querySelectorAll('input[name="'+group+'"]');var checkedVals=Array.from(boxes).filter(function(b){return b.checked}).map(function(b){return b.value});boxes.forEach(function(b){b.disabled=true});var container=document.getElementById('q_'+group);var tagHtml='';qNums.forEach(function(qn){var ok=checkedVals.includes(answers[qn]);tagHtml+=' '+(ok?'<span class="tag ok">Q'+qn+' \u2713</span>':'<span class="tag no">Q'+qn+' \u2718 correct: '+answers[qn]+'</span>')});container.insertAdjacentHTML('beforeend','<div style="margin-top:8px;">'+tagHtml+'</div>');var explAll='';qNums.forEach(function(qn){explAll+=explHTML(qn)});container.insertAdjacentHTML('afterend',explAll)}
function regradeCurrent(){var r=ranges[active];var doneGroups={};for(var n=r[0];n<=r[1];n++){if(multiGroups[n]){if(!doneGroups[multiGroups[n]]){markMulti(multiGroups[n]);doneGroups[multiGroups[n]]=true}continue}var g=document.getElementById('gap'+n),s=document.getElementById('sel'+n),rad=document.querySelector('input[name="q'+n+'"]');if(g)markGap(n);else if(s)markSel(n);else if(rad)markRadio(n)}}
function grade(){if(graded)return;save();var score=0;for(var n=1;n<=13;n++)if(correct(n,state[n]||''))score++;var items=[];for(var m=1;m<=13;m++)items.push({n:m,value:state[m]||'',correct:correct(m,state[m]||'')});try{window.parent.postMessage({type:'cdi-reading-result',score:score,max:13,items:items},'*')}catch(e){}lastScore=score;graded=true;active=1;renderActive();submit.classList.remove('show')}
var drag=false;div.onmousedown=()=>{drag=true;document.body.style.userSelect='none'};window.onmouseup=()=>{drag=false;document.body.style.userSelect=''};window.onmousemove=e=>{if(!drag)return;var r=split.getBoundingClientRect();left.style.width=Math.max(220,Math.min(r.width-240,e.clientX-r.left))+'px'};
split.onmouseup=()=>setTimeout(()=>{var s=getSelection();if(!s||s.isCollapsed||!s.rangeCount){tools.style.display='none';return}var rg=s.getRangeAt(0);if(!split.contains(rg.commonAncestorContainer)){tools.style.display='none';return}var rc=rg.getBoundingClientRect();tools.style.display='flex';tools.style.left=(rc.left+scrollX)+'px';tools.style.top=Math.max(8,rc.top+scrollY-42)+'px'},1);
tools.onclick=e=>{var b=e.target.closest('button'),s=getSelection();if(!b||!s.rangeCount)return;var rg=s.getRangeAt(0);if(b.dataset.act==='hl'){try{var sp=document.createElement('span');sp.className='hl';rg.surroundContents(sp)}catch(_){document.execCommand('hiliteColor',false,'#ffe45c')}}else document.querySelectorAll('.hl').forEach(h=>h.replaceWith(document.createTextNode(h.textContent)));s.removeAllRanges();tools.style.display='none'};
render();
})();
</script></body></html>
