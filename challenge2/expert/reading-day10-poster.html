</style></head><body><header class="top"><button>|||</button><button>o</button><button>=</button></header><div class="banner"><h2 id="partTitle"></h2><p id="partSub"></p></div><div class="split" id="split"><section class="pane left" id="left"></section><div class="divider" id="div"></div><section class="pane right" id="right"></section></div><footer class="bar" id="footer"></footer><div class="tools" id="tools"><button data-act="hl">Highlight</button><button data-act="clear">Clear</button></div><div class="overlay" id="submit"><div class="ovh"><h2>Submission page</h2><button class="close" onclick="submit.classList.remove('show')">x</button></div><div class="ovlist" id="subwrap"></div></div><script>
(function(){
var active=1,graded=false,revealed=false,state={},ranges={1:[1,13]};
var DATA = {"passages": {"1": "<h1>The History of the Poster</h1>\n<p class=\"sub\">The appearance of the poster has changed continuously over the past two centuries.</p>\n<p>The first posters were known as 'broadsides' and were used for public and commercial announcements. Printed on one side only using metal type, they were quickly and crudely produced in large quantities. As they were meant to be read at a distance, they required large lettering.</p>\n<p>There were a number of negative aspects of large metal type. It was expensive, required a large amount of storage space and was extremely heavy. If a printer did have a collection of large metal type, it was likely that there were not enough letters. So printers did their best by mixing and matching styles.</p>\n<p>Commercial pressure for large type was answered with the invention of a system for wood type production. In 1827, Darius Wells invented a special wood drill – the lateral router – capable of cutting letters on wood blocks. The router was used in combination with William Leavenworth's pantograph (1834) to create decorative wooden letters of all shapes and sizes. The first posters began to appear, but they had little colour and design; often wooden type was mixed with metal type in a conglomeration of styles.</p>\n<p>A major development in poster design was the application of lithography, invented by Alois Senefelder in 1796, which allowed artists to hand-draw letters, opening the field of type design to endless styles. The method involved drawing with a greasy crayon onto finely surfaced Bavarian limestone and offsetting that image onto paper. This direct process captured the artist's true intention; however, the final printed image was in reverse. The images and lettering needed to be drawn backwards, often reflected in a mirror or traced on transparent paper.</p>\n<p>As a result of this technical difficulty, the invention of the lithographic process had little impact on posters until the 1860s, when Jules Cheret came up with his 'three-stone lithographic process'. This gave artists the opportunity to experiment with a wide spectrum of colours. Although the process was difficult, the result was remarkable, with nuances of colour impossible in other media even to this day. The ability to mix words and images in such an attractive and economical format finally made the lithographic poster a powerful innovation.</p>\n<p>Starting in the 1870s, posters became the main vehicle for advertising prior to the magazine era and the dominant means of mass communication in the rapidly growing cities of Europe and America. Yet in the streets of Paris, Milan and Berlin, these artistic prints were so popular that they were stolen off walls almost as soon as they were hung. Cheret, later known as 'the father of the modern poster', organised the first exhibition of posters in 1884 and two years later published the first book on poster art. He quickly took advantage of the public interest by arranging for artists to create posters, at a reduced size, that were suitable for in-home display.</p>\n<p>Thanks to Cheret, the poster slowly took hold in other countries in the 1890s and came to celebrate each society's unique cultural institutions: the café in France, the opera and fashion in Italy, festivals in Spain, literature in Holland and trade fairs in Germany. The first poster shows were held in Great Britain and Italy in 1894, Germany in 1896 and Russia in 1897. The most important poster show ever, to many observers, was held in Reims, France, in 1896 and featured an unbelievable 1,690 posters arranged by country.</p>\n<p>In the early 20th century, the poster continued to play a large communication role and to go through a range of styles. By the 1950s, however, it had begun to share the spotlight with other media, mainly radio and print. By this time, most posters were printed using the mass production technique of photo offset, which resulted in the familiar dot pattern seen in newspapers and magazines. In addition, the use of photography in posters, begun in Russia in the twenties, started to become as common as illustration.</p>\n<p>In the late fifties, a new graphic style that had strong reliance on typographic elements in black and white appeared. The new style came to be known as the International Typographic Style. It made use of a mathematical grid, strict graphic rules and black-and-white photography to provide a clear and logical structure. It became the predominant style in the world in the 1970s and continues to exert its influence today.</p>\n<p>It was perfectly suited to the increasingly international post-war marketplace, where there was a strong demand for clarity. This meant that the accessibility of words and symbols had to be taken into account. Corporations wanted international identification, and events such as the Olympics called for universal solutions, which the Typographic Style could provide.</p>\n<p>However, the International Typographic Style began to lose its energy in the late 1970s. Many criticised it for being cold, formal and dogmatic. A young teacher in Basel, Wolfgang Weingart, experimented with the offset printing process to produce posters that appeared complex and chaotic, playful and spontaneous – all in stark contrast to what had gone before. Weingart's liberation of typography was an important foundation for several new styles. These ranged from Memphis and Retro to the advances now being made in computer graphics.</p>\n<p style=\"font-size:14px;color:#555;\">adapted from www.internationalposter.com</p>"}, "answers": {"1": "storage", "2": "pantograph", "3": "colour and design", "4": "crayon", "5": "transparent paper", "6": "words and images", "7": "mass communication", "8": "exhibition", "9": "cultural institutions", "10": "FALSE", "11": "TRUE", "12": "TRUE", "13": "NOT GIVEN"}, "alt": {"4": ["greasy crayon"]}, "expl": {"1": {"loc": "Para 2", "text": "'It was expensive, required a large amount of storage space and was extremely heavy' → 'storage'."}, "2": {"loc": "Para 3", "text": "'The router was used in combination with William Leavenworth's pantograph (1834)' → 'pantograph'."}, "3": {"loc": "Para 3", "text": "'they had little colour and design' → 'colour and design'."}, "4": {"loc": "Para 4", "text": "'drawing with a greasy crayon onto finely surfaced Bavarian limestone' → 'crayon'."}, "5": {"loc": "Para 4", "text": "'often reflected in a mirror or traced on transparent paper' → 'transparent paper'."}, "6": {"loc": "Para 5", "text": "'The ability to mix words and images in such an attractive and economical format' → 'words and images'."}, "7": {"loc": "Para 6", "text": "'posters became the main vehicle for advertising... and the dominant means of mass communication' → 'mass communication'."}, "8": {"loc": "Para 6", "text": "'Cheret... organised the first exhibition of posters in 1884' → 'exhibition'."}, "9": {"loc": "Para 7", "text": "'came to celebrate each society's unique cultural institutions' → 'cultural institutions'."}, "10": {"loc": "Para 9", "text": "'the use of photography in posters... started to become as common as illustration' — equally common, not more widely seen → FALSE."}, "11": {"loc": "Para 10", "text": "'It became the predominant style in the world in the 1970s and continues to exert its influence today' → TRUE."}, "12": {"loc": "Para 11", "text": "'It was perfectly suited to the increasingly international post-war marketplace, where there was a strong demand for clarity' → TRUE."}, "13": {"loc": "Para 12", "text": "No mention of Weingart's students or where his ideas came from → NOT GIVEN."}}};
var passages=DATA.passages, answers=DATA.answers, alt=DATA.alt, EXPL=DATA.expl;
function tf(n,t,yn){var opts=yn?['YES','NO','NOT GIVEN']:['TRUE','FALSE','NOT GIVEN'];return '<div class="tf-row" id="q'+n+'"><div class="statement"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="options">'+opts.map(o=>'<label><input type="radio" name="q'+n+'" value="'+o+'"> '+o+'</label>').join('')+'</div></div>'}
function gap(n){return '<span class="qnum">'+n+'</span><input class="gap" id="gap'+n+'">'}
function sel(n,t,letters){return '<div class="row" id="q'+n+'"><span class="qnum">'+n+'</span><span class="txt">'+t+'</span><select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select></div>'}
function selInline(n,letters){return '<select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select>'}
function mcq(n,t,opts){return '<div class="mcq" id="q'+n+'"><div class="prompt"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="choice-options">'+opts.map((o,i)=>'<label class="choice-option"><input type="radio" name="q'+n+'" value="'+'ABCD'[i]+'"> <b>'+'ABCD'[i]+'</b> '+o+'</label>').join('')+'</div></div>'}
var multiGroups={}, groupQNums={};
function multiSel(qA,qB,promptText,options){var name='g'+qA+'_'+qB;multiGroups[qA]=name;multiGroups[qB]=name;groupQNums[name]=[qA,qB];return '<div id="q_'+name+'" class="tf-row"><div class="statement"><span class="qnum">'+qA+', '+qB+'</span><span>'+promptText+'</span></div><div class="options">'+options.map(o=>'<label><input type="checkbox" name="'+name+'" value="'+o.letter+'"> <b>'+o.letter+'</b> '+o.text+'</label>').join('')+'</div></div>'}

function qhtml(p){
return '<div class="qgroup"><h3>Questions 1-5</h3><p><i>Complete the table below. Choose <b>NO MORE THAN THREE WORDS</b> from the passage for each answer.</i></p><div style="border:1px solid #ccc;border-radius:5px;padding:20px;background:#fafafa;"><p class="centered-title">Early Printing Methods</p><table style="width:100%;font-size:15px;border-collapse:collapse;"><tr style="background:#eee;"><th style="padding:8px;text-align:left;border:1px solid #ddd;width:20%;"></th><th style="padding:8px;text-align:left;border:1px solid #ddd;width:40%;">Features</th><th style="padding:8px;text-align:left;border:1px solid #ddd;">Problems</th></tr><tr><td style="padding:8px;border:1px solid #ddd;font-weight:600;">Metal type</td><td style="padding:8px;border:1px solid #ddd;">produced large print</td><td style="padding:8px;border:1px solid #ddd;">cost, weight and '+gap(1)+' difficulties<br>mixed styles</td></tr><tr><td style="padding:8px;border:1px solid #ddd;font-weight:600;">Wood type</td><td style="padding:8px;border:1px solid #ddd;">Darius’s wood drill used in connection with another '+gap(2)+'<br>produced a range of letters</td><td style="padding:8px;border:1px solid #ddd;">lacked both '+gap(3)+'<br>mixed type</td></tr><tr><td style="padding:8px;border:1px solid #ddd;font-weight:600;">Lithography</td><td style="padding:8px;border:1px solid #ddd;">letters drawn by hand<br>design tool – a '+gap(4)+'</td><td style="padding:8px;border:1px solid #ddd;">had to use a mirror or '+gap(5)+' to achieve correct image</td></tr></table></div></div><div class="qgroup"><h3>Questions 6-9</h3><p><i>Complete the flow chart below. Choose <b>NO MORE THAN THREE WORDS</b> from the passage for each answer.</i></p><div style="border:1px solid #ccc;border-radius:5px;padding:20px;background:#fafafa;"><div style="text-align:center;line-height:2.2;"><p style="font-weight:700;">Jules Cheret</p><p>1860s – invention of ‘three-stone lithographic process’</p><p style="font-size:22px;margin:0;">&#8595;</p><p>combination of both '+gap(6)+' on coloured posters</p><p style="font-size:22px;margin:0;">&#8595;</p><p>1870s – posters used for advertising and '+gap(7)+' in Europe</p><p style="font-size:22px;margin:0;">&#8595;</p><p>1884–86 – Cheret’s poster '+gap(8)+' and book on poster art</p><p style="font-size:22px;margin:0;">&#8595;</p><p>1890s – posters represent '+gap(9)+' around the world</p></div></div></div><div class="qgroup"><h3>Questions 10-13</h3><p><i>Do the following statements agree with the information in the passage? Write <b>TRUE / FALSE / NOT GIVEN</b>.</i></p>'+tf(10,'By the 1950s, photographs were more widely seen than artists’ illustrations on posters.')+tf(11,'Features of the Typographic Style can be seen in modern-day posters.')+tf(12,'The Typographic Style met a global need at a particular time in history.')+tf(13,'Weingart got many of his ideas from his students in Basel.')+'</div>';
}

function render(){partTitle.textContent='Reading Passage 1';var r=ranges[active];partSub.textContent='Read the text and answer questions '+r[0]+'-'+r[1]+'.';left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();drawFooter();left.scrollTop=right.scrollTop=0}
function val(n){if(multiGroups[n]){var boxes=document.querySelectorAll('input[name="'+multiGroups[n]+'"]:checked');return Array.from(boxes).map(b=>b.value).join(',')}var g=document.getElementById('gap'+n);if(g)return g.value;var s=document.getElementById('sel'+n);if(s)return s.value;var r=document.querySelector('input[name="q'+n+'"]:checked');return r?r.value:''}
function save(){for(var n=1;n<=40;n++){var v=val(n);if(v)state[n]=v}}
function restore(){for(var n=1;n<=40;n++){if(!state[n])continue;if(multiGroups[n]){var vals=state[n].split(',');vals.forEach(function(v){var cb=document.querySelector('input[name="'+multiGroups[n]+'"][value="'+v+'"]');if(cb)cb.checked=true});continue}var g=document.getElementById('gap'+n);if(g)g.value=state[n];var s=document.getElementById('sel'+n);if(s)s.value=state[n];var r=document.querySelector('input[name="q'+n+'"][value="'+state[n]+'"]');if(r)r.checked=true}}
function answered(n){return !!state[n]||!!val(n)}
function count(p){var r=ranges[p],c=0;for(var i=r[0];i<=r[1];i++)if(answered(i))c++;return c}
function drawFooter(){save();var h='';[1].forEach(p=>{var r=ranges[p];h+='<div class="partnav"><button class="partlabel" data-part="'+p+'" disabled>Reading Passage 1</button>';if(p===active){h+='<div class="tiles">';for(var n=r[0];n<=r[1];n++)h+='<button class="tile '+(answered(n)?'answered':'')+'" data-q="'+n+'">'+n+'</button>';h+='</div>'}else h+='<span class="count">'+count(p)+' of '+(r[1]-r[0]+1)+'</span>';h+='</div>'});h+='<button class="review" id="review">OK</button>';footer.innerHTML=h}
document.addEventListener('change',()=>{save();drawFooter();checkAutoGrade();sendProgress();});document.addEventListener('input',()=>{save();drawFooter();sendProgress();});function checkAutoGrade(){if(graded)return;var r=ranges[1];for(var n=r[0];n<=r[1];n++)if(!answered(n))return;silentGrade();}function sendProgress(){if(graded)return;try{var r=ranges[1];var items=[];for(var n=r[0];n<=r[1];n++)items.push({n:n,value:state[n]||''});parent.postMessage({type:'cdi-reading-progress',items:items},'*');}catch(e){}}
var lastScore=null;
function renderActive(){left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();if(revealed){regradeCurrent();right.insertAdjacentHTML('afterbegin','<div class="score">Your score: <b>'+lastScore+' / 13</b></div><p style="margin:-8px 0 18px;color:#555">Explanations with the exact location in the passage are shown below each answer.</p>')}drawFooter();left.scrollTop=right.scrollTop=0}
footer.onclick=e=>{var p=e.target.closest('[data-part]');if(p){save();active=+p.dataset.part;renderActive();return}var q=e.target.closest('[data-q]');if(q){var n=+q.dataset.q;(document.getElementById('q'+n)||document.getElementById('gap'+n)||document.getElementById('sel'+n))?.scrollIntoView({behavior:'smooth',block:'center'});return}if(e.target.closest('#review'))review()};
function review(){save();var r=ranges[1];var a=0;for(var n=r[0];n<=r[1];n++)if(answered(n))a++;subwrap.innerHTML='<p>You have answered <b>'+a+'</b> of 13 questions.</p><p><button class="ovrow submit" id="final">Submit test</button></p>';final.onclick=grade;submit.classList.add('show')}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function correct(n,v){if(multiGroups[n]){var parts=(v||'').split(',').map(norm).filter(Boolean);return parts.includes(norm(answers[n]))}return [answers[n]].concat(alt[n]||[]).some(a=>norm(a)===norm(v))}
function explHTML(n){var e=EXPL[n];if(!e)return '';return '<div class="expl"><b>Q'+n+' — correct answer: '+answers[n]+'</b> &nbsp;<span class="expl-loc">('+e.loc+')</span><br>'+e.text+'</div>'}
function markGap(n){var x=document.getElementById('gap'+n);if(!x)return;var ok=correct(n,x.value);x.disabled=true;x.classList.add(ok?'ok':'no');x.insertAdjacentHTML('afterend',(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>')+explHTML(n));return ok}
function markSel(n){var s=document.getElementById('sel'+n);if(!s)return;var ok=correct(n,s.value);s.disabled=true;s.classList.add(ok?'ok':'no');var row=document.getElementById('q'+n);var tag=(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>');if(row){row.insertAdjacentHTML('beforeend',tag);row.insertAdjacentHTML('afterend',explHTML(n))}else{s.insertAdjacentHTML('afterend',tag);var host=s.closest('p')||s;host.insertAdjacentHTML('afterend',explHTML(n))}return ok}
function markRadio(n){var r=document.querySelector('input[name="q'+n+'"]:checked');var ok=r&&correct(n,r.value);document.querySelectorAll('input[name="q'+n+'"]').forEach(i=>i.disabled=true);var box=document.getElementById('q'+n);box.insertAdjacentHTML('beforeend',(ok?'<span class="tag ok">\u2713</span>':'<span class="tag no">\u2718 correct: '+answers[n]+'</span>'));box.insertAdjacentHTML('afterend',explHTML(n));return ok}
function markMulti(group){var qNums=groupQNums[group];var boxes=document.querySelectorAll('input[name="'+group+'"]');var checkedVals=Array.from(boxes).filter(function(b){return b.checked}).map(function(b){return b.value});boxes.forEach(function(b){b.disabled=true});var container=document.getElementById('q_'+group);var tagHtml='';qNums.forEach(function(qn){var ok=checkedVals.includes(answers[qn]);tagHtml+=' '+(ok?'<span class="tag ok">Q'+qn+' \u2713</span>':'<span class="tag no">Q'+qn+' \u2718 correct: '+answers[qn]+'</span>')});container.insertAdjacentHTML('beforeend','<div style="margin-top:8px;">'+tagHtml+'</div>');var explAll='';qNums.forEach(function(qn){explAll+=explHTML(qn)});container.insertAdjacentHTML('afterend',explAll)}
function regradeCurrent(){var r=ranges[active];var doneGroups={};for(var n=r[0];n<=r[1];n++){if(multiGroups[n]){if(!doneGroups[multiGroups[n]]){markMulti(multiGroups[n]);doneGroups[multiGroups[n]]=true}continue}var g=document.getElementById('gap'+n),s=document.getElementById('sel'+n),rad=document.querySelector('input[name="q'+n+'"]');if(g)markGap(n);else if(s)markSel(n);else if(rad)markRadio(n)}}
function silentGrade(){if(graded)return;save();var r=ranges[1];var score=0;for(var n=r[0];n<=r[1];n++)if(correct(n,state[n]||''))score++;lastScore=score;graded=true;try{parent.postMessage({type:'cdi-reading-result',score:lastScore,max:(r[1]-r[0]+1),items:(function(){var arr=[];for(var n=r[0];n<=r[1];n++)arr.push({n:n,value:state[n]||'',correct:correct(n,state[n]||'')});return arr;})()},'*');}catch(e){}}function grade(){silentGrade();revealed=true;active=1;renderActive();submit.classList.remove('show')}
var drag=false;div.onmousedown=()=>{drag=true;document.body.style.userSelect='none'};window.onmouseup=()=>{drag=false;document.body.style.userSelect=''};window.onmousemove=e=>{if(!drag)return;var r=split.getBoundingClientRect();left.style.width=Math.max(220,Math.min(r.width-240,e.clientX-r.left))+'px'};
split.onmouseup=()=>setTimeout(()=>{var s=getSelection();if(!s||s.isCollapsed||!s.rangeCount){tools.style.display='none';return}var rg=s.getRangeAt(0);if(!split.contains(rg.commonAncestorContainer)){tools.style.display='none';return}var rc=rg.getBoundingClientRect();tools.style.display='flex';tools.style.left=(rc.left+scrollX)+'px';tools.style.top=Math.max(8,rc.top+scrollY-42)+'px'},1);
tools.onclick=e=>{var b=e.target.closest('button'),s=getSelection();if(!b||!s.rangeCount)return;var rg=s.getRangeAt(0);if(b.dataset.act==='hl'){try{var sp=document.createElement('span');sp.className='hl';rg.surroundContents(sp)}catch(_){document.execCommand('hiliteColor',false,'#ffe45c')}}else document.querySelectorAll('.hl').forEach(h=>h.replaceWith(document.createTextNode(h.textContent)));s.removeAllRanges();tools.style.display='none'};
render();
window.addEventListener('message',function(event){var d=event.data;if(!d||d.type!=='cdi-reading-restore')return;(d.items||[]).forEach(function(item){if(item.value)state[item.n]=item.value;});restore();drawFooter();});
})();
</script></body></html>
