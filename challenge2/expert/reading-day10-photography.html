var DATA = {"passages": {"1": "<h1>A Brief History of Photography in Advertising</h1>\n<p>Commercial photography has long had a significant place in the history of photography, and the advertising industry has been its largest benefactor.</p>\n<p>In the late 19th century, photography was used only rarely to advertise products or businesses. Photographs occasionally appeared on business cards or as small informative pictures in catalogues and magazines, but it wasn't until the early 20th century that advertisers began to realise the enormous potential of this relatively new medium. At first, most preferred to use a 'reason why' strategy, with the result that their photograph just showed consumers the benefits of the product. However, when advertising psychologists in the early 20th century demonstrated that consumers were open to suggestion, they provided support for a new suggestive advertising strategy, often called 'atmosphere advertising'. Some more adventurous advertisers had already been experimenting with this, arguing that photographs did not need to show what a product could do, but could instead create a mood or feeling that people would associate with that product.</p>\n<p>One of the inspirations for this was American illustrator and photographer John Hiller who, in the early 1900s, was illustrating stories in women's magazines with photographs. He employed a soft focus technique, and used dramatic lighting and complex stage sets to create visually stunning pictures. His style was revolutionary for the time, and it gradually occurred to advertisers that this type of picture would be ideal for illustrative advertisements. As a result, photographs in advertisements suddenly became very popular. In 1920, fewer than 15 percent of illustrated advertisements in mass-circulated magazines employed photographs. By the end of the decade, this figure had soared to about 80 percent.</p>\n<p>The tremendous new market for advertising photography provided a wealth of business opportunities for professional photographers. Clarence White, a successful pictorial photographer, led the way in training commercial photographers at his school in New York. He encouraged his students to apply a fine-art style of photography to industrial and commercial design, combining (as he put it) 'beauty and utility'. Some of his students went on to become New York's top commercial photographers. They practised a modernist style based on close-up views, spare geometric compositions, unusual vantage points and sharp focus that dominated advertising photography for the next twenty years. It was also at this time that images of real-life situations began to be used in advertising, a trend that became especially popular in the 1930s when the economic effects of the Great Depression prompted advertisers to adopt the qualities of sincerity and realism in advertising imagery. The 1930s also saw technological progress in colour photography, and when commercial colour film went on sale for the first time in 1935, the widespread use of colour in advertising photography suddenly became much more affordable.</p>\n<p>The dominant and most highly paid commercial photographer of the 1920s and 1930s was Edward Steichen. Like Clarence White, Steichen had been a specialist art photographer who turned to commerce. In 1923 he landed two commercial photography contracts – to produce fashion and celebrity portrait photographs for Conde Nast periodicals, and to produce advertising photographs for J. Walter Thompson, a major advertising agency. Over the next twenty years, he built up a huge client list, which included makers of beauty products, packaged foods, cars, jewellery and soaps. He was one of the first commercial photographers who took in close collaboration with his art directors, convincing them to look beyond conventional uses of photography in advertising (pictorialism for romance and suggestion; photography for information and reason-why). During his long career, he evolved a persuasive photography style that projected ideals, aspirations and obvious fantasies, but made them seem attainable.</p>\n<p>By the 1940s, advertising was seriously big business, and vastly increased budgets meant that photographers working for the business could be more and more ambitious and experimental. The two best-known commercial photographers at this time were Irving Penn and Richard Avedon. While both continued to use photographic modernism in their advertising photography, they developed highly personal styles. Penn's pictures were characterised by a minimalist style which projected an image of calm elegance. Avedon's photographs were much more dynamic and conveyed an important message: the world was changing, and it was changing very quickly. His work, perhaps more than any other, was to influence future commercial photographers, and his style is still very popular today.</p>\n<p>Commercial photography in the 1960s was less stylistically unified than in previous decades. It also saw a greater emphasis on internationalism and greater collaboration with art directors. Furthermore, there were huge changes in beliefs and attitudes, especially with regard to the way we behaved, or the way we saw ourselves and others. The advertising industry could not ignore this, with the result that newer representations of things like gender roles took their place alongside traditional ones. This set the tone for advertising photography in the remaining decades of the 20th century.</p>\n<p>Advertising around the turn of the 21st century provoked new content-based controversies. Where mid-20th century advertising photography was often criticised for promoting overly traditional visions of life or unrealistic material aspirations, criticism of today's advertising has targeted images that glamorise unhealthy lifestyles. Criticism has also been directed at advertisements that appear to be trying to shock, offend or provoke rather than sell a product. One well-known clothing company, for example, received a lot of negative attention when it used powerful images of prisoners, refugees and a blood-covered T-shirt in a series of advertisements. These became notorious for their provocative content and led to a re-evaluation of what should and shouldn't be acceptable in advertising.</p>"}, "answers": {"1": "soft focus", "2": "real-life situations", "3": "commercial colour film", "4": "ambitious and experimental", "5": "gender roles", "6": "major advertising agency", "7": "twenty years", "8": "conventional", "9": "persuasive photography style", "10": "FALSE", "11": "FALSE", "12": "TRUE", "13": "NOT GIVEN"}, "alt": {"3": ["colour film"]}, "expl": {"1": {"loc": "Para 3", "text": "'He employed a soft focus technique... it gradually occurred to advertisers that this type of picture would be ideal for illustrative advertisements' → 'soft focus'."}, "2": {"loc": "Para 4", "text": "'images of real-life situations began to be used in advertising, a trend that became especially popular in the 1930s' → 'real-life situations'."}, "3": {"loc": "Para 4", "text": "'when commercial colour film went on sale for the first time in 1935' → 'commercial colour film'."}, "4": {"loc": "Para 6", "text": "'photographers working for the business could be more and more ambitious and experimental' → 'ambitious and experimental'."}, "5": {"loc": "Para 7", "text": "'newer representations of things like gender roles took their place alongside traditional ones' → 'gender roles'."}, "6": {"loc": "Para 5", "text": "'to produce advertising photographs for J. Walter Thompson, a major advertising agency' → 'major advertising agency'."}, "7": {"loc": "Para 5", "text": "'Over the next twenty years, he built up a huge client list' → 'twenty years'."}, "8": {"loc": "Para 5", "text": "'convincing them to look beyond conventional uses of photography in advertising' → 'conventional'."}, "9": {"loc": "Para 5", "text": "'he evolved a persuasive photography style that projected ideals, aspirations and obvious fantasies, but made them seem attainable' → 'persuasive photography style'."}, "10": {"loc": "Para 2", "text": "'Some more adventurous advertisers had already been experimenting with this' before psychologists provided support for it — the strategy predates the psychologists → FALSE."}, "11": {"loc": "Para 3", "text": "Hiller 'was illustrating stories in women's magazines with photographs' — his photos illustrated stories, not advertisements; it was his style that advertisers later adopted → FALSE."}, "12": {"loc": "Para 6", "text": "'While both continued to use photographic modernism... they developed highly personal styles' — similarity and difference → TRUE."}, "13": {"loc": "Final paragraph", "text": "The passage describes criticism of provocative ads but doesn't state advertisers' belief that provocation increases attention → NOT GIVEN."}}};

function tf(n,t,yn){var opts=yn?['YES','NO','NOT GIVEN']:['TRUE','FALSE','NOT GIVEN'];return '<div class="tf-row" id="q'+n+'"><div class="statement"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="options">'+opts.map(o=>'<label><input type="radio" name="q'+n+'" value="'+o+'"> '+o+'</label>').join('')+'</div></div>'}

function qhtml(p){
return '<div class="qgroup"><h3>Questions 1-5</h3><p><i>Complete the table below. Choose <b>NO MORE THAN THREE WORDS</b> from the passage for each answer.</i></p><div style="border:1px solid #ccc;border-radius:5px;padding:20px;background:#fafafa;"><p class="centered-title">Significant moments in photographic advertising</p><table style="width:100%;font-size:15px;border-collapse:collapse;"><tr style="background:#eee;"><th style="padding:8px;text-align:left;border:1px solid #ddd;width:12%;"></th><th style="padding:8px;text-align:left;border:1px solid #ddd;width:44%;">Event</th><th style="padding:8px;text-align:left;border:1px solid #ddd;">Reason or cause</th></tr><tr><td style="padding:8px;border:1px solid #ddd;font-weight:600;">1920s</td><td style="padding:8px;border:1px solid #ddd;">Huge increase in number of illustrated advertisements using photographs</td><td style="padding:8px;border:1px solid #ddd;">Advertisers begin to realise that '+gap(1)+' photographs are perfect for advertising purposes.</td></tr><tr><td style="padding:8px;border:1px solid #ddd;font-weight:600;">1930s</td><td style="padding:8px;border:1px solid #ddd;">Popularity of pictures showing '+gap(2)+'<br>Colour in advertising photography becomes more widespread.</td><td style="padding:8px;border:1px solid #ddd;">Advertisers respond to a serious financial crisis.<br>'+gap(3)+' becomes available.</td></tr><tr><td style="padding:8px;border:1px solid #ddd;font-weight:600;">1940s</td><td style="padding:8px;border:1px solid #ddd;">Commercial photographers become increasingly '+gap(4)+'</td><td style="padding:8px;border:1px solid #ddd;">More money is available for advertising.</td></tr><tr><td style="padding:8px;border:1px solid #ddd;font-weight:600;">1960s</td><td style="padding:8px;border:1px solid #ddd;">'+gap(5)+' are portrayed in a new way in advertisements.</td><td style="padding:8px;border:1px solid #ddd;">Changes in beliefs and attitudes.</td></tr></table></div></div><div class="qgroup"><h3>Questions 6-9</h3><p><i>Complete the flow chart below. Choose <b>NO MORE THAN THREE WORDS</b> from the passage for each answer.</i></p><div style="border:1px solid #ccc;border-radius:5px;padding:20px;background:#fafafa;"><div style="text-align:center;line-height:2.2;"><p style="font-weight:700;">Edward Steichen</p><p>Turned to commercial photography after illustrating stories.</p><p style="font-size:22px;margin:0;">&#8595;</p><p>In 1923, began taking pictures for magazines and a '+gap(6)+'</p><p style="font-size:22px;margin:0;">&#8595;</p><p>Spent '+gap(7)+' working with many different companies.</p><p style="font-size:22px;margin:0;">&#8595;</p><p>Persuaded art directors that they should be less '+gap(8)+' in the way they used photographs.</p><p style="font-size:22px;margin:0;">&#8595;</p><p>Developed a '+gap(9)+' which made difficult or impossible dreams seem achievable.</p></div></div></div><div class="qgroup"><h3>Questions 10-13</h3><p><i>Do the following statements agree with the information in the passage? Write <b>TRUE / FALSE / NOT GIVEN</b>.</i></p>'+tf(10,'Advertising psychologists in the early 20th century came up with the idea for a new advertising strategy known as ‘atmosphere advertising’.')+tf(11,'John Hiller’s photographs were often used to illustrate advertisements.')+tf(12,'Photographs by Irving Penn and Richard Avedon contained similar ideas and differences.')+tf(13,'Some modern advertisers believe that people pay more attention to an advertisement if it contains deliberately provocative images.')+'</div>';

function val(n){if(multiGroups[n]){var boxes=document.querySelectorAll('input[name="'+multiGroups[n]+'"]:checked');return Array.from(boxes).map(b=>b.value).join(',')}var g=document.getElementById('gap'+n);if(g)return g.value;var s=document.getElementById('sel'+n);if(s)return s.value;var r=document.querySelector('input[name="q'+n+'"]:checked');return r?r.value:''}
function save(){for(var n=1;n<=40;n++){var v=val(n);if(v)state[n]=v}}
function restore(){for(var n=1;n<=40;n++){if(!state[n])continue;if(multiGroups[n]){var vals=state[n].split(',');vals.forEach(function(v){var cb=document.querySelector('input[name="'+multiGroups[n]+'"][value="'+v+'"]');if(cb)cb.checked=true});continue}var g=document.getElementById('gap'+n);if(g)g.value=state[n];var s=document.getElementById('sel'+n);if(s)s.value=state[n];var r=document.querySelector('input[name="q'+n+'"][value="'+state[n]+'"]');if(r)r.checked=true}}
function answered(n){return !!state[n]||!!val(n)}
function count(p){var r=ranges[p],c=0;for(var i=r[0];i<=r[1];i++)if(answered(i))c++;return c}
function drawFooter(){save();var h='';[1].forEach(p=>{var r=ranges[p];h+='<div class="partnav"><button class="partlabel" data-part="'+p+'" disabled>Reading Passage 1</button>';if(p===active){h+='<div class="tiles">';for(var n=r[0];n<=r[1];n++)h+='<button class="tile '+(answered(n)?'answered':'')+'" data-q="'+n+'">'+n+'</button>';h+='</div>'}else h+='<span class="count">'+count(p)+' of '+(r[1]-r[0]+1)+'</span>';h+='</div>'});h+='<button class="review" id="review">OK</button>';footer.innerHTML=h}
document.addEventListener('change',()=>{save();drawFooter();checkAutoGrade();sendProgress();});document.addEventListener('input',()=>{save();drawFooter();sendProgress();});function checkAutoGrade(){if(graded)return;var r=ranges[1];for(var n=r[0];n<=r[1];n++)if(!answered(n))return;silentGrade();}function sendProgress(){if(graded)return;try{var r=ranges[1];var items=[];for(var n=r[0];n<=r[1];n++)items.push({n:n,value:state[n]||''});parent.postMessage({type:'cdi-reading-progress',items:items},'*');}catch(e){}}

function renderActive(){left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();if(revealed){regradeCurrent();right.insertAdjacentHTML('afterbegin','<div class="score">Your score: <b>'+lastScore+' / 13</b></div><p style="margin:-8px 0 18px;color:#555">Explanations with the exact location in the passage are shown below each answer.</p>')}drawFooter();left.scrollTop=right.scrollTop=0}
footer.onclick=e=>{var p=e.target.closest('[data-part]');if(p){save();active=+p.dataset.part;renderActive();return}var q=e.target.closest('[data-q]');if(q){var n=+q.dataset.q;(document.getElementById('q'+n)||document.getElementById('gap'+n)||document.getElementById('sel'+n))?.scrollIntoView({behavior:'smooth',block:'center'});return}if(e.target.closest('#review'))review()};

function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function correct(n,v){if(multiGroups[n]){var parts=(v||'').split(',').map(norm).filter(Boolean);return parts.includes(norm(answers[n]))}return [answers[n]].concat(alt[n]||[]).some(a=>norm(a)===norm(v))}
function explHTML(n){var e=EXPL[n];if(!e)return '';return '<div class="expl"><b>Q'+n+' — correct answer: '+answers[n]+'</b> &nbsp;<span class="expl-loc">('+e.loc+')</span><br>'+e.text+'</div>'}
function markGap(n){var x=document.getElementById('gap'+n);if(!x)return;var ok=correct(n,x.value);x.disabled=true;x.classList.add(ok?'ok':'no');x.insertAdjacentHTML('afterend',(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>')+explHTML(n));return ok}
function markSel(n){var s=document.getElementById('sel'+n);if(!s)return;var ok=correct(n,s.value);s.disabled=true;s.classList.add(ok?'ok':'no');var row=document.getElementById('q'+n);var tag=(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>');if(row){row.insertAdjacentHTML('beforeend',tag);row.insertAdjacentHTML('afterend',explHTML(n))}else{s.insertAdjacentHTML('afterend',tag);var host=s.closest('p')||s;host.insertAdjacentHTML('afterend',explHTML(n))}return ok}
function markRadio(n){var r=document.querySelector('input[name="q'+n+'"]:checked');var ok=r&&correct(n,r.value);document.querySelectorAll('input[name="q'+n+'"]').forEach(i=>i.disabled=true);var box=document.getElementById('q'+n);box.insertAdjacentHTML('beforeend',(ok?'<span class="tag ok">\u2713</span>':'<span class="tag no">\u2718 correct: '+answers[n]+'</span>'));box.insertAdjacentHTML('afterend',explHTML(n));return ok}
function markMulti(group){var qNums=groupQNums[group];var boxes=document.querySelectorAll('input[name="'+group+'"]');var checkedVals=Array.from(boxes).filter(function(b){return b.checked}).map(function(b){return b.value});boxes.forEach(function(b){b.disabled=true});var container=document.getElementById('q_'+group);var tagHtml='';qNums.forEach(function(qn){var ok=checkedVals.includes(answers[qn]);tagHtml+=' '+(ok?'<span class="tag ok">Q'+qn+' \u2713</span>':'<span class="tag no">Q'+qn+' \u2718 correct: '+answers[qn]+'</span>')});container.insertAdjacentHTML('beforeend','<div style="margin-top:8px;">'+tagHtml+'</div>');var explAll='';qNums.forEach(function(qn){explAll+=explHTML(qn)});container.insertAdjacentHTML('afterend',explAll)}
function regradeCurrent(){var r=ranges[active];var doneGroups={};for(var n=r[0];n<=r[1];n++){if(multiGroups[n]){if(!doneGroups[multiGroups[n]]){markMulti(multiGroups[n]);doneGroups[multiGroups[n]]=true}continue}var g=document.getElementById('gap'+n),s=document.getElementById('sel'+n),rad=document.querySelector('input[name="q'+n+'"]');if(g)markGap(n);else if(s)markSel(n);else if(rad)markRadio(n)}}
function silentGrade(){if(graded)return;save();var r=ranges[1];var score=0;for(var n=r[0];n<=r[1];n++)if(correct(n,state[n]||''))score++;lastScore=score;graded=true;try{parent.postMessage({type:'cdi-reading-result',score:lastScore,max:(r[1]-r[0]+1),items:(function(){var arr=[];for(var n=r[0];n<=r[1];n++)arr.push({n:n,value:state[n]||'',correct:correct(n,state[n]||'')});return arr;})()},'*');}catch(e){}}function grade(){silentGrade();revealed=true;active=1;renderActive();submit.classList.remove('show')}
var drag=false;div.onmousedown=()=>{drag=true;document.body.style.userSelect='none'};window.onmouseup=()=>{drag=false;document.body.style.userSelect=''};window.onmousemove=e=>{if(!drag)return;var r=split.getBoundingClientRect();left.style.width=Math.max(220,Math.min(r.width-240,e.clientX-r.left))+'px'};
split.onmouseup=()=>setTimeout(()=>{var s=getSelection();if(!s||s.isCollapsed||!s.rangeCount){tools.style.display='none';return}var rg=s.getRangeAt(0);if(!split.contains(rg.commonAncestorContainer)){tools.style.display='none';return}var rc=rg.getBoundingClientRect();tools.style.display='flex';tools.style.left=(rc.left+scrollX)+'px';tools.style.top=Math.max(8,rc.top+scrollY-42)+'px'},1);
tools.onclick=e=>{var b=e.target.closest('button'),s=getSelection();if(!b||!s.rangeCount)return;var rg=s.getRangeAt(0);if(b.dataset.act==='hl'){try{var sp=document.createElement('span');sp.className='hl';rg.surroundContents(sp)}catch(_){document.execCommand('hiliteColor',false,'#ffe45c')}}else document.querySelectorAll('.hl').forEach(h=>h.replaceWith(document.createTextNode(h.textContent)));s.removeAllRanges();tools.style.display='none'};
render();
window.addEventListener('message',function(event){var d=event.data;if(!d||d.type!=='cdi-reading-restore')return;(d.items||[]).forEach(function(item){if(item.value)state[item.n]=item.value;});restore();drawFooter();});
})();
</script></body></html>
