var DATA = {"passages": {"1": "<h1>A survivor's story</h1><p class=\"sub\">One native bird in New Zealand that has managed to survive the introduction of non-native species</p><p>As an island country with a fauna dominated by birds, New Zealand was once home to an owl species which is now extinct, the laughing owl, named for its distinctive cry. This bird was widespread throughout the islands when European settlers arrived in the middle of the 19th century and it remained in good numbers for some years thereafter. Where other native birds suffered from predation by the Polynesian rat, the laughing owl turned the tables and adapted its diet to include the rodent. It was also capable of catching and killing the other New Zealand owl, the morepork, and even larger birds, such as the weka. However, the laughing owl was wiped out around the beginning of the 20th century. Its demise was caused by specimen collectors, habitat changes, and non-native predators including cats and stoats. Surprisingly, it is the smaller owl, the morepork, that has managed to survive until this day.</p><p>Speckled dark brown, with yellow eyes and long tails, they are around 29 centimeters long from head to tail and 175 grams in weight. Moreporks have fringes on the edge of their feathers, so they can fly almost silently and not alert potential prey. They have acute hearing and their large eyes are very sensitive to light.</p><p>Moreporks nest in tree hollows, in clumps of plants, or in cavities among rocks and roots. In the wild, moreporks usually start nesting in October, although zoo specimens have been recorded nesting in midwinter, possibly stimulated by an ample food supply. The female lays up to three white eggs, which she incubates for 20 to 30 days. During this time, she rarely hunts, and the male brings food to her. Once the chicks hatch, she stays mainly on the nest until the young owls are fully feathered. When hatched, chicks are covered in light grey down, and have their eyes closed. The eyes do not open until the eighth day after hatching. They can fly at around 35 days.</p><p>By day, moreporks sleep in roosts. By night, they hunt a variety of animals &mdash; mainly large invertebrates including scarab and huhu beetles, moths, caterpillars and spiders. They also take small birds and mice. They can find suitable food in pine forests as well as native forest. A morepork uses its sharp talons to catch or stun its prey, which it then carries away in its bill. Moreporks are clever hunters, and birds such as robins, grey warblers and fantails can end up as their prey. In the day, these small birds sometimes mob drowsy moreporks and chase them away from their roosts. They force the sleepy predators to search for a more peaceful spot.</p><p>Moreporks have proved to be ungracious hosts. Scientists trying to establish a population of plovers on Motuora island in New Zealand's Hauraki Gulf were mystified as to why only two birds survived out of 75 placed there. The culprits turned out to be five pairs of moreporks that ate or chased away the new arrivals.</p><p>Although moreporks are still considered to be relatively common, it is likely that numbers are in gradual decline due to predation and loss of habitat. As the female is a hole-nester, she is vulnerable to predators such as stoats and possums during the breeding season, and eggs and chicks will also be at risk from rats. The use of pesticides is another possible threat to the owls though not a direct one. As moreporks are at the top of the food chain, they could be affected by an accumulative poison by consuming prey that has ingested poison.</p><p>The New Zealand Department of Conservation is taking steps to ensure the preservation of New Zealand's only native owl. The department is involved in measuring the population of moreporks and has put transmitters on a number of birds to determine survival and mortality. As well as being New Zealand's only native owl, the morepork has symbolic and spiritual importance, so in monitoring the birds it is hoped that the morepork will continue to survive and thrive.</p><p>At dusk, the melancholy sound of the morepork can be heard in forests and parks as it calls to other moreporks and claims territory. Its Maori name (ruru) echoes its two-part cry. In the tradition of the Maori people of New Zealand, the morepork, or ruru, was often seen as a careful guardian. A number of sayings referred to the bird's alertness. As a bird of the night, it was associated with the spirit world. Moreporks were believed to act as messengers to the gods in the heavens, flying along spiritual paths in the sky. They were the mediums used to communicate with the gods. The occasional high, piercing call of the morepork signified bad news, but the lower-pitched and more common 'ruru' call heralded good news.</p>", "2": "<h1>Ideal Homes</h1>\n<p class=\"sub\">New ideas and some old ones</p>\n<div class=\"para\">A</div>\n<p>The traditional kampung houses of Malaysia do not need air-conditioning. Built on stilts and with steep roofs, they have year-round ventilation. The raised structure ensures a cooling breeze comes up through the floorboards, while the high roof acts as a chimney to release hot air. The airtight, concrete boxes of modern city construction, in contrast, are heat traps, says Muhammad Peter Davis of University Putra Malaysia. He has calculated that typical modern Malaysian houses are 5°C hotter than the air outside. The builders of kampung houses 'had no knowledge of modern science or engineering but they came up with the perfect design,' says Davis.</p>\n<div class=\"para\">B</div>\n<p>This story of ancient architectural sophistication and modern insanity is repeated around the world. In the name of modernism, people have thrown away architecture designed to cope with the environment in which they live, and adopted house designs originating from cold, northern environments, where the idea is to keep heat in.</p>\n<div class=\"para\">C</div>\n<p>Once, the aim of architectural modernists was to build structures that kept nature out and to replace it with air-conditioning. Now they are learning that they cannot do that effectively. Slowly, they are seeing the benefit of working with nature, rather than against it. In California, they probably use more power for air-conditioning than anywhere else on Earth. According to Arthur Rosenfeld from the University of California, what California needs is white paint. If Los Angeles painted its roofs white, planted trees to shade buildings, and chose lighter-colored paving, it could reduce city temperatures by 3°C and cut the annual air-conditioning bill by $US 170 million a year.</p>\n<div class=\"para\">D</div>\n<p>Modern buildings are greedy in their use of energy. Much is made of the contribution of transportation to global warming, through its emissions of greenhouse gases. But globally, transportation is responsible for just 22 per cent of carbon dioxide emissions. The building sector is responsible for 31 per cent, mostly the result of heating and air-conditioning systems. In developing countries, where demand for electricity for buildings is rising by 5 per cent a year, the biggest demand is for air-conditioning in modern buildings which are often designed to cope with every different climatic condition.</p>\n<div class=\"para\">E</div>\n<p>Before air-conditioning, much of the Arab world kept cool through thoughtful building design; many buildings were built according to the principles of the wind tower, a tall structure with vertical vents at the top that open in all directions to catch any passing breeze. Typically, these wind-tower buildings were made of local materials such as stone, mud brick, wood and palm-tree fronds. The buildings were inward-looking, which served the dual function of focusing attention on the courtyard, where family members spend time together, and protecting living areas from the rays of the sun.</p>\n<div class=\"para\">F</div>\n<p>Throughout the Middle East today, wind towers are often little more than museum pieces. But there are exceptions. Jordan has won awards for the architecture of a village on the shores of the Red Sea, which is designed to conserve energy. Made of rough, local stone in a traditional style, it combines the ventilation system of the wind towers for summer coolness with up-to-date heating and floor insulation to protect against the desert cold in winter.</p>\n<div class=\"para\">G</div>\n<p>Traditional building materials, like traditional building designs, are being rediscovered by those looking for low-energy solutions to the current construction needs. Clay is one such material. As the Dutch housing contractor R van der Ley has argued in promoting a series of clay housing projects in developing countries, clay has many benefits over its industrialized version, brick. Clay blocks cost only half as much as ordinary bricks. Clay also generates work because people can find it, mold it, bake it and work it themselves. Two hundred clay bricks can be made with the fuel oil that makes just one ordinary brick. Moreover, clay is an excellent insulator against both cold and heat outside, and can easily be recycled.</p>\n<div class=\"para\">H</div>\n<p>But although traditional methods and materials can be revived in appropriate settings, new green, low-energy technologies are needed, especially in urban environments. The thermal insulation of homes in cold countries is an example. In 1983, Sweden adopted a national standard, requiring the country's homes to lose no more than 60 kilowatt-hours per square meter over the year. To meet that standard, windows were double glazed, and walls and roofs insulated. Every home became a fortress against the cold air outside. Unfortunately, the rest of Europe has not followed the lead.</p>\n<div class=\"para\">I</div>\n<p>In the United States, Amory Lovins has promoted a range of low-energy technologies: 'super-windows', for example, which let in invisible light but can be 'tuned' to either allow in, or reflect away, infrared solar radiation — the stuff that heats. Buildings with large expanses of window (and big energy bills) can be designed to achieve optimum temperatures.</p>\n<div class=\"para\">J</div>\n<p>As well as more efficient use of energy, the world also needs new sources of renewable power. Solar energy is being tried out in the developing world, in villages often far from electricity grids. The world's biggest solar power installation got underway in the Philippines, in 2001, where a project commenced to install solar panels for 400,000 people in 150 villages. Such projects are demonstrating that countries, whether developing or developed, no longer need huge national grids to supply electricity. Every home can do its own thing with the help of a solar panel and a storage battery.</p>\n<div class=\"para\">K</div>\n<p>Houses, of course, are more than machines for living in. They are social and psychological spaces, too. Future houses may not look exactly like kampungs or wind towers or any other traditional models. But to work for us and for our environment, they will have to suit us as well as these traditional forms did.</p>", "3": "<h1>Conformity</h1><p class=\"sub\">A review of conformity and some of the studies that have been done on it</p><p>During your childhood, there will have been some kind of craze which affected all the people in your school. It may have been to do with a particular toy or possibly a must-have item of clothing. It may have been something as simple as a type of pen or as expensive as an electronic games console. Fashion designers, toy manufacturers and anyone else involved in the retail trade love conformity. Set up a craze, especially in the young, and everyone will go for it. In fact, it's an ideal way to sell huge quantities of merchandise. The levels of conformity in consumerism are phenomenal. When you actually stand back and consider how easily we are persuaded that having certain items is the only way we can ensure peace of mind, you see what an important concept conformity is.</p><p>Conformity has been described as 'yielding to group pressure' (Crutchfield 1962). However, this implies that other people put pressure on us to make us conform and this is not always the case. A better definition is given by Aronson (1976) who said it was a 'change in a person's behaviour or opinions as a result of real or imagined pressure from a person or group of people.' This would make more sense, as often the pressure we feel is imagined. The person or group he refers to would have to be important to us at the time, regardless of their status.</p><p>There has been considerable research on conformity. One of the first studies looked at the answers people gave when asked to estimate the number of beans in a bottle (Jennes, 1932). If you have ever entered a 'guess the number' competition, you probably looked at the previous estimates made and based your judgment on what other people had guessed. This is more or less what happened in the Jennes study. First of all, he asked the respondents to give their own estimates, and then he asked them to decide a group estimate. Finally, he asked them alone again and discovered that they had stayed with the group answer.</p><p>Probably the most famous study on conformity was undertaken by Asch (1951) when he created a situation where many of his subjects gave answers which were blatantly untrue, rather than contradict the people they were with. He did this by getting his subject to sit round a table with six stooges (colleagues of the experimenter) so that the subject was second to last. He showed them all a large card which had three lines of different lengths drawn on it, labelled A, B and C. He then gave them a card with a single line and asked them to match this in terms of length to one of the lines A, B or C.</p><p>The stooges gave untrue responses in a number of the trials and the subjects were left in the situation where they either reported what they saw with their own eyes or conformed to the norm of the group. When the results were assessed, Asch found that in one out of every three trials where the wrong answer was given, the subject gave the same wrong answer as the stooges. This led to an average level of conformity of 32 per cent. Asch interviewed his subjects after the trials to try to find out why they conformed to an answer which was so obviously wrong. Most of them said that they did not want to cause problems within the group, although they also admitted that when they did give wrong answers it made them anxious. (Asch found that when there was just one other person present who did not go along with the majority, no matter how many others there were, it was sufficient to make the subject give the right answer.)</p><p>Kelman (1953) outlined three processes which can explain social conformity. The first is compliance, where subjects go along with the crowd to prevent any in-group hostility or bad feeling and to maintain group harmony. However, they do not change their own private belief. If we look back to the Asch study, we can see that the subjects were simply complying with the demands of the experimental situation but hadn't actually internalized the group's norms. They agreed in public, but dissented in private. In a process known as internalization, however, subjects do actually see the view of the group as the more valid one. They may be able to do this, for example, by convincing themselves that their eyesight is poor. Sometimes, however, subjects actually seem to change their beliefs because they want to become more like their heroes. If they really want to become part of an in-group, they will start to identify with that group and take on the group's values and beliefs, even if they are different to their own. Kelman calls this identification. It frequently happens with teenagers who want to become more like a peer group in order to be accepted, and suddenly seem to go against all the values and beliefs of their parents.</p><p>So why is it that we have to conform? Some people feel confident most of the time, have high self-esteem and do not have to go along with the majority. For most of us, though, how confident we feel varies from day to day, depending on the situation we are in, and this can influence behaviour.</p>"}, "answers": {"1": "NOT GIVEN", "2": "FALSE", "3": "TRUE", "4": "TRUE", "5": "FALSE", "6": "FALSE", "7": "FALSE", "8": "29 centimeters", "9": "rocks", "10": "bill", "11": "day", "12": "plovers", "13": "poison", "14": "G", "15": "E", "16": "A", "17": "J", "18": "C", "19": "D", "20": "G", "21": "A", "22": "E", "23": "FALSE", "24": "TRUE", "25": "FALSE", "26": "NOT GIVEN", "27": "YES", "28": "NOT GIVEN", "29": "NOT GIVEN", "30": "NO", "31": "beans", "32": "group", "33": "match", "34": "untrue", "35": "anxious", "36": "Asch", "37": "Internalization", "38": "valid", "39": "Identification", "40": "teenagers"}, "alt": {"8": ["29 centimetres", "29cm"], "34": ["false", "incorrect"]}, "expl": {"1": {"loc": "Para 1", "text": "The passage only says the laughing owl 'was widespread... when European settlers arrived' \u2014 there is no mention of settlers studying the morepork itself \u2192 NOT GIVEN."}, "2": {"loc": "Para 1", "text": "'Where other native birds suffered from predation by the Polynesian rat, the laughing owl turned the tables and adapted its diet to include the rodent' \u2014 the laughing owl preyed on the rat rather than being harmed by it \u2192 FALSE."}, "3": {"loc": "Para 1", "text": "The laughing owl 'was also capable of catching and killing the other New Zealand owl, the morepork' \u2014 implying it was the larger predator \u2192 TRUE."}, "4": {"loc": "Para 6", "text": "'eggs and chicks will also be at risk from rats' \u2192 TRUE."}, "5": {"loc": "Para 7", "text": "The Department is 'taking steps to ensure the preservation' and hopes the morepork 'will c ery home can do its own thing with the help of a solar panel' \u2192 J."}, "18": {"loc": "Paragraph C", "text": "'painted its roofs white, planted trees to shade buildings, and chose lighter-colored paving, it could reduce city temperatures by 3\u00b0C' \u2192 C."}, "19": {"loc": "Paragraph A, Davis", "text": "Kampung builders 'had no knowledge of modern science or engineering but they came up with the perfect design' \u2192 D."}, "20": {"loc": "Paragraph C, Rosenfeld", "text": "'what California needs is white paint' \u2014 a very simple solution \u2192 G."}, "21": {"loc": "Paragraph G, van der Ley", "text": "'Clay also generates work because people can find it, mold it, bake it and work it themselves' \u2014 socio-economic impact \u2192 A."}, "22": {"loc": "Paragraph I, Lovins", "text": "'super-windows'... can be 'tuned' to either allow in, or reflect away, infrared solar radiation' \u2014 saves on both cooling and heating \u2192 E."}, "23": {"loc": "Paragraph A", "text": "'typical modern Malaysian houses are 5\u00b0C hotter than the air outside' \u2014 the opposite of lower \u2192 FALSE."}, "24": {"loc": "Paragraph D", "text": "'transportation is responsible for just 22 per cent... The building sector is responsible for 31 per cent' \u2192 TRUE."}, "25": {"loc": "Paragraph F", "text": "'Throughout the Middle East today, wind towers are often little more than museum pieces' \u2192 FALSE."}, "26": {"loc": "Paragraph I", "text": "No mention of the cost of installing super-windows \u2192 NOT GIVEN."}}};

function tf(n,t,yn){var opts=yn?['YES','NO','NOT GIVEN']:['TRUE','FALSE','NOT GIVEN'];return '<div class="tf-row" id="q'+n+'"><div class="statement"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="options">'+opts.map(o=>'<label><input type="radio" name="q'+n+'" value="'+o+'"> '+o+'</label>').join('')+'</div></div>'}
function gap(n){return '<span class="qnum">'+n+'</span><input class="gap" id="gap'+n+'">'}
function sel(n,t,letters){return '<div class="row" id="q'+n+'"><span class="qnum">'+n+'</span><span class="txt">'+t+'</span><select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select></div>'}
function selInline(n,letters){return '<select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select>'}
function mcq(n,t,opts){return '<div class="mcq" id="q'+n+'"><div class="prompt"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="choice-options">'+opts.map((o,i)=>'<label class="choice-option"><input type="radio" name="q'+n+'" value="'+'ABCD'[i]+'"> <b>'+'ABCD'[i]+'</b> '+o+'</label>').join('')+'</div></div>'}
function qhtml(p){
if(p===1)return '<div class="qgroup"><h3>Questions 1-7</h3><p><i>Do the following statements agree with the information given in Reading Passage 1? Write <b>TRUE / FALSE / NOT GIVEN</b>.</i></p>'+tf(1,'Early European settlers made detailed studies of the morepork.')+tf(2,'The Polynesian rat had a negative effect on the number of laughing owls.')+tf(3,'The laughing owl was larger than the morepork.')+tf(4,'Rats pose a risk to young moreporks.')+tf(5,'The New Zealand Department of Conservation is hoping to limit the population of moreporks.')+tf(6,'Other bird species are frightened away when they hear the morepork\'s cry.')+tf(7,'In Maori tradition, the low call of the morepork had negative associations.')+'</div><div class="qgroup"><h3>Questions 8-13</h3><p><i>Complete the notes below. Choose <b>ONE WORD AND/OR A NUMBER</b> from the passage for each answer.</i></p><p class="para">The Morepork</p><p class="notes"><b>Appearance</b><br>&#8226; approximately '+gap(8)+' in length<br>&#8226; large yellow eyes<br>&#8226; feathers with fringes to enable quiet flight</p><p class="notes"><b>Nesting</b><br>&#8226; nests in trees, plants or spaces in roots and '+gap(9)+'<br>&#8226; after about 35 days, baby moreporks are capable of leaving the nest</p><p class="notes"><b>Hunting</b><br>&#8226; transports its prey using its '+gap(10)+'<br>&#8226; can be chased away by other birds during the '+gap(11)+'<br>&#8226; attacked '+gap(12)+' that had been introduced to Motuora island</p><p class="notes"><b>Threats</b><br>&#8226; may be exposed to '+gap(13)+' in their prey</p></div>';
if(p===2)return '<div class="qgroup"><h3>Questions 14-18</h3><p><i>Reading Passage 2 has eleven paragraphs, A–K. Which paragraph contains the following information?</i></p>'+sel(14,'reasons why a particular construction material is advantageous',['A','B','C','D','E','F','G','H','I','J','K'])+sel(15,'an example of a construction design which benefits domestic interaction',['A','B','C','D','E','F','G','H','I','J','K'])+sel(16,'a description of a house that is ventilated from below',['A','B','C','D','E','F','G','H','I','J','K'])+sel(17,'an example of self-sufficient energy supply',['A','B','C','D','E','F','G','H','I','J','K'])+sel(18,'suggested methods of reducing temperatures in a city',['A','B','C','D','E','F','G','H','I','J','K'])+'</div><div class="qgroup"><h3>Questions 19-22</h3><p>Look at the following people and the list of ideas below. Match each person with the correct idea.</p><div class="box"><b>A</b> The choice of a certain construction material can have a socio-economic impact<br><b>B</b> Throughout the world, people are rejecting traditional housing design in order to appear modern.<br><b>C</b> Houses should not only meet people’s physical needs but also their social and psychological needs.<br><b>D</b> Traditional knowledge can be superior to modern knowledge.<br><b>E</b> There is an innovation that can save costs on both air-conditioning and heating.<br><b>F</b> Solar energy can meet the energy needs of people living in villages in developing countries.<br><b>G</b> There is a very simple solution that can save on the cost of air-conditioning</div>'+sel(19,'Muhammad Peter Davis',['A','B','C','D','E','F','G'])+sel(20,'Arthur Rosenfeld',['A','B','C','D','E','F','G'])+sel(21,'R van der Ley',['A','B','C','D','E','F','G'])+sel(22,'Amory Lovins',['A','B','C','D','E','F','G'])+'</div><div class="qgroup"><h3>Questions 23-26</h3><p><i>Do the following statements agree with the information given in the passage? Write <b>TRUE / FALSE / NOT GIVEN</b>.</i></p>'+tf(23,'The air temperature in modern Malaysian houses is lower than the air temperature outside.')+tf(24,'The construction industry is more to blame than transport for global warming.')+tf(25,'The use of wind towers for cooling is widespread in the Middle East today.')+tf(26,'The ‘super-windows’ promoted by Amory Lovins can be installed at low cost.')+'</div>';
if(p===3)return '<div class="qgroup"><h3>Questions 27-30</h3><p><i>Do the following statements agree with the claims of the writer in Reading Passage 3? Write <b>YES / NO / NOT GIVEN</b>.</i></p>'+tf(27,'Childhood crazes can center on items of any value.',true)+tf(28,'Children are more vulnerable to crazes now than they used to be.',true)+tf(29,'Consumers make too many quick decisions in shops.',true)+tf(30,'Crutchfield\'s definition of conformity is the most reliable.',true)+'</div><div class="qgroup"><h3>Questions 31-35</h3><p><i>Complete the summary below. Choose <b>ONE WORD ONLY</b> from the passage for each answer.</i></p><p class="para">Studies on conformity</p><p class="summary-text">In the Jennes study, people had to guess how many '+gap(31)+' were in a container. Jennes found that, in most cases, people opted for an estimate given by a '+gap(32)+'. Asch asked his subjects to '+gap(33)+' line lengths. To test the extent to which people would conform, he placed his subjects with colleagues who gave '+gap(34)+' responses. He found that his subjects agreed with his colleagues 32% of the time, although they admitted to feeling '+gap(35)+' about giving their answer.</p></div><div class="qgroup"><h3>Questions 36-40</h3><p><i>Complete the notes below. Choose <b>ONE WORD ONLY</b> from the passage for each answer.</i></p><p class="para">Kelman\'s processes of social conformity</p><p class="notes"><b>Compliance</b><br>&#8226; people support the majority view despite their own ideas<br>&#8226; social harmony is maintained<br>&#8226; illustrated by the results of the research conducted by '+gap(36)+'</p><p class="notes">&#8226; '+gap(37)+'<br>&#8226; majority view is considered most '+gap(38)+' view<br>&#8226; people persuade themselves despite their own ideas</p><p class="notes">&#8226; '+gap(39)+'<br>&#8226; people change their ideas to those of the majority<br>&#8226; typical of '+gap(40)+'</p></div>';
}

function render(){partTitle.textContent='Part '+active;var r=ranges[active];partSub.textContent='Read the text and answer questions '+r[0]+'-'+r[1]+'.';left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();drawFooter();left.scrollTop=right.scrollTop=0}
function val(n){var g=document.getElementById('gap'+n);if(g)return g.value;var s=document.getElementById('sel'+n);if(s)return s.value;var r=document.querySelector('input[name="q'+n+'"]:checked');return r?r.value:''}
function save(){for(var n=1;n<=40;n++){var v=val(n);if(v)state[n]=v}}
function restore(){for(var n=1;n<=40;n++){if(!state[n])continue;var g=document.getElementById('gap'+n);if(g)g.value=state[n];var s=document.getElementById('sel'+n);if(s)s.value=state[n];var r=document.querySelector('input[name="q'+n+'"][value="'+state[n]+'"]');if(r)r.checked=true}}
function answered(n){return !!state[n]||!!val(n)}
function count(p){var r=ranges[p],c=0;for(var i=r[0];i<=r[1];i++)if(answered(i))c++;return c}
function drawFooter(){save();var h='';[1,2,3].forEach(p=>{var r=ranges[p];h+='<div class="partnav"><button class="partlabel" data-part="'+p+'">Part '+p+'</button>';if(p===active){h+='<div class="tiles">';for(var n=r[0];n<=r[1];n++)h+='<button class="tile '+(answered(n)?'answered':'')+'" data-q="'+n+'">'+n+'</button>';h+='</div>'}else h+='<span class="count">'+count(p)+' of '+(r[1]-r[0]+1)+'</span>';h+='</div>'});h+='<button class="review" id="review">OK</button>';footer.innerHTML=h}
document.addEventListener('change',()=>{save();drawFooter()});document.addEventListener('input',()=>{save();drawFooter()});
var lastScore=null;
function renderActive(){left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();if(revealed){regradeCurrent();right.insertAdjacentHTML('afterbegin','<div class="score">Your score: <b>'+lastScore+' / 40</b></div><p style="margin:-8px 0 18px;color:#555">Explanations with the exact location in the passage are shown below each answer. Switch Part 1/2/3 tabs to review the rest.</p>')}drawFooter();left.scrollTop=right.scrollTop=0}
footer.onclick=e=>{var p=e.target.closest('[data-part]');if(p){save();active=+p.dataset.part;renderActive();return}var q=e.target.closest('[data-q]');if(q){var n=+q.dataset.q;(document.getElementById('q'+n)||document.getElementById('gap'+n)||document.getElementById('sel'+n))?.scrollIntoView({behavior:'smooth',block:'center'});return}if(e.target.closest('#review'))review()};
function review(){save();var a=0;for(var n=1;n<=40;n++)if(answered(n))a++;subwrap.innerHTML='<p>You have answered <b>'+a+'</b> of 40 questions.</p><p><button class="ovrow submit" id="final">Submit test</button></p>';final.onclick=grade;submit.classList.add('show')}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function correct(n,v){return [answers[n]].concat(alt[n]||[]).some(a=>norm(a)===norm(v))}
function explHTML(n){var e=EXPL[n];if(!e)return '';return '<div class="expl"><b>Q'+n+' — correct answer: '+answers[n]+'</b> &nbsp;<span class="expl-loc">('+e.loc+')</span><br>'+e.text+'</div>'}
function markGap(n){var x=document.getElementById('gap'+n);if(!x)return;var ok=correct(n,x.value);x.disabled=true;x.classList.add(ok?'ok':'no');x.insertAdjacentHTML('afterend',(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>')+explHTML(n));return ok}
function markSel(n){var s=document.getElementById('sel'+n);if(!s)return;var ok=correct(n,s.value);s.disabled=true;s.classList.add(ok?'ok':'no');var row=document.getElementById('q'+n);var tag=(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>');if(row){row.insertAdjacentHTML('beforeend',tag);row.insertAdjacentHTML('afterend',explHTML(n))}else{s.insertAdjacentHTML('afterend',tag);var host=s.closest('p')||s;host.insertAdjacentHTML('afterend',explHTML(n))}return ok}
function markRadio(n){var r=document.querySelector('input[name="q'+n+'"]:checked');var ok=r&&correct(n,r.value);document.querySelectorAll('input[name="q'+n+'"]').forEach(i=>i.disabled=true);var box=document.getElementById('q'+n);box.insertAdjacentHTML('beforeend',(ok?'<span class="tag ok">\u2713</span>':'<span class="tag no">\u2718 correct: '+answers[n]+'</span>'));box.insertAdjacentHTML('afterend',explHTML(n));return ok}
function regradeCurrent(){var r=ranges[active];for(var n=r[0];n<=r[1];n++){var g=document.getElementById('gap'+n),s=document.getElementById('sel'+n),rad=document.querySelector('input[name="q'+n+'"]');if(g)markGap(n);else if(s)markSel(n);else if(rad)markRadio(n)}}
function silentGrade(){if(graded)return;save();var score=0;for(var n=1;n<=40;n++)if(correct(n,state[n]||''))score++;lastScore=score;graded=true}
function grade(){silentGrade();revealed=true;active=1;renderActive();submit.classList.remove('show')}
var drag=false;div.onmousedown=()=>{drag=true;document.body.style.userSelect='none'};window.onmouseup=()=>{drag=false;document.body.style.userSelect=''};window.onmousemove=e=>{if(!drag)return;var r=split.getBoundingClientRect();left.style.width=Math.max(220,Math.min(r.width-240,e.clientX-r.left))+'px'};
split.onmouseup=()=>setTimeout(()=>{var s=getSelection();if(!s||s.isCollapsed||!s.rangeCount){tools.style.display='none';return}var rg=s.getRangeAt(0);if(!split.contains(rg.commonAncestorContainer)){tools.style.display='none';return}var rc=rg.getBoundingClientRect();tools.style.display='flex';tools.style.left=(rc.left+scrollX)+'px';tools.style.top=Math.max(8,rc.top+scrollY-42)+'px'},1);
tools.onclick=e=>{var b=e.target.closest('button'),s=getSelection();if(!b||!s.rangeCount)return;var rg=s.getRangeAt(0);if(b.dataset.act==='hl'){try{var sp=document.createElement('span');sp.className='hl';rg.surroundContents(sp)}catch(_){document.execCommand('hiliteColor',false,'#ffe45c')}}else document.querySelectorAll('.hl').forEach(h=>h.replaceWith(document.createTextNode(h.textContent)));s.removeAllRanges();tools.style.display='none'};
render();
// ---- Bridge added for the mock exam orchestrator ----
window.__mockForceGrade = silentGrade;
window.__mockGetResult = function () {
  if (!graded) return null;
  var answersOut = {}, key = {};
  for (var n = 1; n <= 40; n++) {
    answersOut[n] = state[n] || '';
    key[n] = DATA.answers[n];
  }
  return { score: lastScore, total: 40, answers: answersOut, key: key };
};
})();
</script></body></html>
