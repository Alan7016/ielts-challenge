</style></head><body><header class="top"><button>|||</button><button>o</button><button>=</button></header><div class="banner"><h2 id="partTitle"></h2><p id="partSub"></p></div><div class="split" id="split"><section class="pane left" id="left"></section><div class="divider" id="div"></div><section class="pane right" id="right"></section></div><footer class="bar" id="footer"></footer><div class="tools" id="tools"><button data-act="hl">Highlight</button><button data-act="clear">Clear</button></div><div class="overlay" id="submit"><div class="ovh"><h2>Submission page</h2><button class="close" onclick="submit.classList.remove('show')">x</button></div><div class="ovlist" id="subwrap"></div></div><script>
(function(){
var active=1,graded=false,revealed=false,state={},ranges={1:[1,13]};
var DATA = {"passages": {"1": "<h1>Is Constant Use of Electronic Media Changing Our Minds?</h1>\n<p>The power of modern electronic media – the net, mobile phones and video games – to capture the attention of the human mind, particularly the young mind, and then distract it, has lately become a subject of concern. We are, say the worriers, losing the ability to apply ourselves properly to a single task, like reading a book in its entirety or mastering a piece of music on an instrument, with the result that our thinking is becoming shallower.</p>\n<p>Nicholas Carr, the American science writer, has explored this theme for his new book, The Shallows, in which he argues that new media are not just changing our habits but our brain too. It turns out that the mature human brain is not an immutable seat of personality and intellect but a changeable thing, subject to 'neuroplasticity'. When our activities alter, so does the architecture of our brain. 'I'm not thinking the way I used to think,' writes Carr. 'I feel it most strongly when I'm reading.' Years of internet use have, he suspects, dented his ability to read deeply, to absorb himself in books: 'My brain wasn't just drifting. It was hungry. It was demanding to be fed the way the net fed it.' He describes getting fidgety when faced with a long text: 'When we go online, we enter an environment that promotes cursory reading, hurried and distracted thinking, and superficial learning.'</p>\n<p>Carr cites research by Gary Small, a professor of psychiatry at UCLA, who concluded that constant exposure to modern media strengthens new neural pathways while weakening older ones. Just five hours of internet use is enough to awaken previously dormant parts of the brain's pre-frontal cortex, concluded Small. For Carr, this is proof that the net can rewire the mind. He sees dangers. Deep thought, the ability to immerse oneself in an area of study, to follow a narrative, to understand an argument and develop a critique, is giving way to skimming. Young users of the Internet are good at drawing together information for a school project, for example, but that does not mean they have digested it.</p>\n<p>But is a changing mind a more stupid one? Jake Vigdor and Helen Ladd are researchers at Duke University, North Carolina. In a study spanning five years and involving more than 100,000 children, they discovered a correlation between declining test scores in both mathematics and reading and the spread of home computers and broadband. 'The decline in scores was in the order of one or two percent but it was statistically significant,' says Vigdor. 'The drop may not be that great, but one can say that the increase in computer use was certainly not positive.' The cut-off year for the study was 2005, when social networking was still in its infancy. Since then, social networking sites have become enormously powerful consumers of young people's time. Vigdor and Ladd concluded that the educational value of home computing was best realised when youngsters were actively supervised by parents.</p>\n<p>This tendency to skim is compounded by the temptation of new media users to 'multi-task'. Watch a youngster on a computer and he could be Facebook-ing while burning a CD or Tweeting on his mobile phone. Modern management tends to promote multi-tasking as an expression of increased efficiency. Science, on the other hand, does not. The human brain is, it seems, not at all good at multitasking — unless it involves a highly developed skill like driving. David Meyer, at the University of Michigan, says: 'The bottom line is that you can't simultaneously be thinking about your tax return and reading an essay, just as you can't talk to yourself about two things at once. People may think otherwise but it's a myth. With complicated tasks, you'll never, ever be able to overcome the inherent limitations in the brain.'</p>\n<p>Paying attention is the prerequisite of memory: the sharper the attention, the sharper the memory. Cursory study born of the knowledge that information is easily available online results, say the worriers, in a failure to digest it. In addition, the brain needs rest and recovery time to consolidate thoughts. Teenagers who fill every moment with a text or Tweet are not allowing their minds necessary downtime. All rather worrying, but is it that bad?</p>\n<p>We have been here before, of course. The Ancient Greeks lamented the replacement of the oral tradition with written text, and the explosion in book ownership resulting from the printing press was, for some, a disaster. In the 18th century, a French statesman railed against a new device that turned people into 'dispersed' individuals, isolated in 'sullen silence'. He was talking about the newspaper.</p>\n<p>The net is supposed to consume the lives of young people, yet the only reliable studies about the time spent online, collated by the World Health Organization, suggest children spend between two and four hours in front of screens, including television screens, and not six or seven, as often suggested. Moreover, there is evidence that youngsters who use social networking sites have more rewarding offline social lives than those who do not.</p>\n<p>A study on children and new technology in the UK included a 'study of studies' by Professor David Buckingham of the University of London's Institute of Education. He concluded: 'Broadly speaking, the evidence about the effects of new media is weak and inconclusive – and this applies to both positive and negative effects.'</p>\n<p>Certainly the 'old' media don't seem to be doing that badly. An annual survey that shows that sales of children's books this year were 4.9 per cent greater than last year, with more than 60 million sold. The damage, if any, done by excessive computer time may not be so much to do with what is being done online as what is being missed – time spent with family or playing in trees with friends.</p>"}, "answers": {"1": "TRUE", "2": "NOT GIVEN", "3": "TRUE", "4": "TRUE", "5": "FALSE", "6": "NOT GIVEN", "7": "100,000 children", "8": "test scores", "9": "positive", "10": "parents", "11": "newspaper", "12": "four hours", "13": "children's books"}, "alt": {}, "expl": {"1": {"loc": "Para 1", "text": "The concerns described — losing the ability to focus, shallower thinking — are framed as entirely negative effects → TRUE."}, "2": {"loc": "Para 2", "text": "No sales figures or bestseller status is mentioned for Carr's book → NOT GIVEN."}, "3": {"loc": "Para 2", "text": "'Years of internet use have, he suspects, dented his ability to read deeply, to absorb himself in books' → TRUE."}, "4": {"loc": "Para 3", "text": "'For Carr, this is proof that the net can rewire the mind' — Carr uses Small's research to support his own view → TRUE."}, "5": {"loc": "Para 4", "text": "'People may think otherwise but it's a myth' — Meyer's research contradicts the common (e.g. management) belief that multitasking works → FALSE."}, "6": {"loc": "Para 4", "text": "No mention of controversy surrounding Meyer's views → NOT GIVEN."}, "7": {"loc": "Vigdor/Ladd paragraph", "text": "'a study spanning five years and involving more than 100,000 children' → '100,000 children'."}, "8": {"loc": "Vigdor/Ladd paragraph", "text": "'a correlation between declining test scores in both mathematics and reading and the spread of home computers' → 'test scores'."}, "9": {"loc": "Vigdor/Ladd paragraph", "text": "'one can say that the increase in computer use was certainly not positive' → 'positive'."}, "10": {"loc": "Vigdor/Ladd paragraph", "text": "'best realised when youngsters were actively supervised by parents' → 'parents'."}, "11": {"loc": "Para 6", "text": "'a French statesman railed against a new device... He was talking about the newspaper' → 'newspaper'."}, "12": {"loc": "Para 7", "text": "'children spend between two and four hours in front of screens... and not six or seven' → 'four hours'."}, "13": {"loc": "Final paragraph", "text": "'sales of children's books this year were 4.9 per cent greater than last year' → 'children's books'."}}};
var passages=DATA.passages, answers=DATA.answers, alt=DATA.alt, EXPL=DATA.expl;
function tf(n,t,yn){var opts=yn?['YES','NO','NOT GIVEN']:['TRUE','FALSE','NOT GIVEN'];return '<div class="tf-row" id="q'+n+'"><div class="statement"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="options">'+opts.map(o=>'<label><input type="radio" name="q'+n+'" value="'+o+'"> '+o+'</label>').join('')+'</div></div>'}
function gap(n){return '<span class="qnum">'+n+'</span><input class="gap" id="gap'+n+'">'}
function sel(n,t,letters){return '<div class="row" id="q'+n+'"><span class="qnum">'+n+'</span><span class="txt">'+t+'</span><select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select></div>'}
function selInline(n,letters){return '<select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select>'}
function mcq(n,t,opts){return '<div class="mcq" id="q'+n+'"><div class="prompt"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="choice-options">'+opts.map((o,i)=>'<label class="choice-option"><input type="radio" name="q'+n+'" value="'+'ABCD'[i]+'"> <b>'+'ABCD'[i]+'</b> '+o+'</label>').join('')+'</div></div>'}
var multiGroups={}, groupQNums={};
function multiSel(qA,qB,promptText,options){var name='g'+qA+'_'+qB;multiGroups[qA]=name;multiGroups[qB]=name;groupQNums[name]=[qA,qB];return '<div id="q_'+name+'" class="tf-row"><div class="statement"><span class="qnum">'+qA+', '+qB+'</span><span>'+promptText+'</span></div><div class="options">'+options.map(o=>'<label><input type="checkbox" name="'+name+'" value="'+o.letter+'"> <b>'+o.letter+'</b> '+o.text+'</label>').join('')+'</div></div>'}

function qhtml(p){
return '<div class="qgroup"><h3>Questions 1-6</h3><p><i>Do the following statements agree with the information given in the passage? Write <b>TRUE / FALSE / NOT GIVEN</b>.</i></p>'+tf(1,'Some people believe that modern electronic media only have a negative effect on young people.')+tf(2,'Nicholas Carr’s book on the subject is a bestseller.')+tf(3,'Nicholas Carr believes that electronic media have affected his enjoyment of reading books.')+tf(4,'Gary Small’s research supports Nicholas Carr’s beliefs.')+tf(5,'Management beliefs on multi-tasking are proved correct by scientific research.')+tf(6,'David Meyer’s views on the limitations of the brain have caused controversy.')+'</div><div class="qgroup"><h3>Questions 7-10</h3><p><i>Complete the notes below. Choose <b>NO MORE THAN TWO WORDS AND/OR A NUMBER</b> from the passage for each answer.</i></p><div class="notes"><h3>Vigdor and Ladd’s research</h3><div class="note-row">&bull; looked at over '+gap(7)+'</div><div class="note-row">&bull; found that lower '+gap(8)+' and home computer use were linked</div><div class="note-row">&bull; indicated that the effects of greater home computer use could not be described as '+gap(9)+'</div><div class="note-row">&bull; concluded that '+gap(10)+' should be involved in home computer use</div></div></div><div class="qgroup"><h3>Questions 11-13</h3><p><i>Answer the questions below. Choose <b>NO MORE THAN TWO WORDS AND/OR A NUMBER</b> from the passage for each answer.</i></p><p class="summary-text"><span class="qnum">11</span>Which invention was criticised by an 18th century French politician? '+gap(11)+'</p><p class="summary-text"><span class="qnum">12</span>According to studies that can be trusted, what is the maximum amount of time per day that children spend looking at screens? '+gap(12)+'</p><p class="summary-text"><span class="qnum">13</span>Which products have become more popular recently? '+gap(13)+'</p></div>';
}

function render(){partTitle.textContent='Reading Passage 1';var r=ranges[active];partSub.textContent='Read the text and answer questions '+r[0]+'-'+r[1]+'.';left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();drawFooter();left.scrollTop=right.scrollTop=0}
function val(n){if(multiGroups[n]){var boxes=document.querySelectorAll('input[name="'+multiGroups[n]+'"]:checked');return Array.from(boxes).map(b=>b.value).join(',')}var g=document.getElementById('gap'+n);if(g)return g.value;var s=document.getElementById('sel'+n);if(s)return s.value;var r=document.querySelector('input[name="q'+n+'"]:checked');return r?r.value:''}
function save(){for(var n=1;n<=40;n++){var v=val(n);if(v)state[n]=v}}
function restore(){for(var n=1;n<=40;n++){if(!state[n])continue;if(multiGroups[n]){var vals=state[n].split(',');vals.forEach(function(v){var cb=document.querySelector('input[name="'+multiGroups[n]+'"][value="'+v+'"]');if(cb)cb.checked=true});continue}var g=document.getElementById('gap'+n);if(g)g.value=state[n];var s=document.getElementById('sel'+n);if(s)s.value=state[n];var r=document.querySelector('input[name="q'+n+'"][value="'+state[n]+'"]');if(r)r.checked=true}}
function answered(n){return !!state[n]||!!val(n)}
function count(p){var r=ranges[p],c=0;for(var i=r[0];i<=r[1];i++)if(answered(i))c++;return c}
function drawFooter(){save();var h='';[1].forEach(p=>{var r=ranges[p];h+='<div class="partnav"><button class="partlabel" data-part="'+p+'" disabled>Reading Passage 1</button>';if(p===active){h+='<div class="tiles">';for(var n=r[0];n<=r[1];n++)h+='<button class="tile '+(answered(n)?'answered':'')+'" data-q="'+n+'">'+n+'</button>';h+='</div>'}else h+='<span class="count">'+count(p)+' of '+(r[1]-r[0]+1)+'</span>';h+='</div>'});h+='<button class="review" id="review">OK</button>';footer.innerHTML=h}
document.addEventListener('change',()=>{save();drawFooter();checkAutoGrade();sendProgress();});document.addEventListener('input',()=>{save();drawFooter();sendProgress();});function checkAutoGrade(){if(graded)return;var r=ranges[1];for(var n=r[0];n<=r[1];n++)if(!answered(n))return;silentGrade();}function sendProgress(){if(graded)return;try{var r=ranges[1];var items=[];for(var n=r[0];n<=r[1];n++)items.push({n:n,value:state[n]||''});parent.postMessage({type:'cdi-reading-progress',items:items},'*');}catch(e){}}
var lastScore=null;
function renderActive(){left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();if(revealed){regradeCurrent();right.insertAdjacentHTML('afterbegin','<div class="score">Your score: <b>'+lastScore+' / 13</b></div><p style="margin:-8px 0 18px;color:#555">Explanations with the exact location in the passage are shown below each answer.</p>')}drawFooter();left.scrollTop=right.scrollTop=0}
footer.onclick=e=>{var p=e.target.closest('[data-part]');if(p){save();active=+p.dataset.part;renderActive();return}var q=e.target.closest('[data-q]');if(q){var n=+q.dataset.q;(document.getElementById('q'+n)||document.getElementById('gap'+n)||document.getElementById('sel'+n))?.scrollIntoView({behavior:'smooth',block:'center'});return}if(e.target.closest('#review'))review()};
function review(){save();var r=ranges[1];var a=0;for(var n=r[0];n<=r[1];n++)if(answered(n))a++;subwrap.innerHTML='<p>You have answered <b>'+a+'</b> of 13 questions.</p><p><button class="ovrow submit" id="final">Submit test</button></p>';final.onclick=grade;submit.classList.add('show')}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function correct(n,v){if(multiGroups[n]){var parts=(v||'').split(',').map(norm).filter(Boolean);return parts.includes(norm(answers[n]))}return [answers[n]].concat(alt[n]||[]).some(a=>norm(a)===norm(v))}
function explHTML(n){var e=EXPL[n];if(!e)return '';return '<div class="expl"><b>Q'+n+' — correct answer: '+answers[n]+'</b> &nbsp;<span class="expl-loc">('+e.loc+')</span><br>'+e.text+'</div>'}
function markGap(n){var x=document.getElementById('gap'+n);if(!x)return;var ok=correct(n,x.value);x.disabled=true;x.classList.add(ok?'ok':'no');x.insertAdjacentHTML('afterend',(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>')+explHTML(n));return ok}
function markSel(n){var s=document.getElementById('sel'+n);if(!s)return;var ok=correct(n,s.value);s.disabled=true;s.classList.add(ok?'ok':'no');var row=document.getElementById('q'+n);var tag=(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>');if(row){row.insertAdjacentHTML('beforeend',tag);row.insertAdjacentHTML('afterend',explHTML(n))}else{s.insertAdjacentHTML('afterend',tag);var host=s.closest('p')||s;host.insertAdjacentHTML('afterend',explHTML(n))}return ok}
function markRadio(n){var r=document.querySelector('input[name="q'+n+'"]:checked');var ok=r&&correct(n,r.value);document.querySelectorAll('input[name="q'+n+'"]').forEach(i=>i.disabled=true);var box=document.getElementById('q'+n);box.insertAdjacentHTML('beforeend',(ok?'<span class="tag ok">\u2713</span>':'<span class="tag no">\u2718 correct: '+answers[n]+'</span>'));box.insertAdjacentHTML('afterend',explHTML(n));return ok}
function markMulti(group){var qNums=groupQNums[group];var boxes=document.querySelectorAll('input[name="'+group+'"]');var checkedVals=Array.from(boxes).filter(function(b){return b.checked}).map(function(b){return b.value});boxes.forEach(function(b){b.disabled=true});var container=document.getElementById('q_'+group);var tagHtml='';qNums.forEach(function(qn){var ok=checkedVals.includes(answers[qn]);tagHtml+=' '+(ok?'<span class="tag ok">Q'+qn+' \u2713</span>':'<span class="tag no">Q'+qn+' \u2718 correct: '+answers[qn]+'</span>')});container.insertAdjacentHTML('beforeend','<div style="margin-top:8px;">'+tagHtml+'</div>');var explAll='';qNums.forEach(function(qn){explAll+=explHTML(qn)});container.insertAdjacentHTML('afterend',explAll)}
function regradeCurrent(){var r=ranges[active];var doneGroups={};for(var n=r[0];n<=r[1];n++){if(multiGroups[n]){if(!doneGroups[multiGroups[n]]){markMulti(multiGroups[n]);doneGroups[multiGroups[n]]=true}continue}var g=document.getElementById('gap'+n),s=document.getElementById('sel'+n),rad=document.querySelector('input[name="q'+n+'"]');if(g)markGap(n);else if(s)markSel(n);else if(rad)markRadio(n)}}
function silentGrade(){if(graded)return;save();var r=ranges[1];var score=0;for(var n=r[0];n<=r[1];n++)if(correct(n,state[n]||''))score++;lastScore=score;graded=true;try{parent.postMessage({type:'cdi-reading-result',score:lastScore,max:(r[1]-r[0]+1),items:(function(){var arr=[];for(var n=r[0];n<=r[1];n++)arr.push({n:n,value:state[n]||'',correct:correct(n,state[n]||'')});return arr;})()},'*');}catch(e){}}function grade(){silentGrade();revealed=true;active=1;renderActive();submit.classList.remove('show')}
var drag=false;div.onmousedown=()=>{drag=true;document.body.style.userSelect='none'};window.onmouseup=()=>{drag=false;document.body.style.userSelect=''};window.onmousemove=e=>{if(!drag)return;var r=split.getBoundingClientRect();left.style.width=Math.max(220,Math.min(r.width-240,e.clientX-r.left))+'px'};
split.onmouseup=()=>setTimeout(()=>{var s=getSelection();if(!s||s.isCollapsed||!s.rangeCount){tools.style.display='none';return}var rg=s.getRangeAt(0);if(!split.contains(rg.commonAncestorContainer)){tools.style.display='none';return}var rc=rg.getBoundingClientRect();tools.style.display='flex';tools.style.left=(rc.left+scrollX)+'px';tools.style.top=Math.max(8,rc.top+scrollY-42)+'px'},1);
tools.onclick=e=>{var b=e.target.closest('button'),s=getSelection();if(!b||!s.rangeCount)return;var rg=s.getRangeAt(0);if(b.dataset.act==='hl'){try{var sp=document.createElement('span');sp.className='hl';rg.surroundContents(sp)}catch(_){document.execCommand('hiliteColor',false,'#ffe45c')}}else document.querySelectorAll('.hl').forEach(h=>h.replaceWith(document.createTextNode(h.textContent)));s.removeAllRanges();tools.style.display='none'};
render();
window.addEventListener('message',function(event){var d=event.data;if(!d||d.type!=='cdi-reading-restore')return;(d.items||[]).forEach(function(item){if(item.value)state[item.n]=item.value;});restore();drawFooter();});
})();
</script></body></html>
