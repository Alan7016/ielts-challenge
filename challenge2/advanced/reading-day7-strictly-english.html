var active=1,graded=false,revealed=false,state={},ranges={1:[5,14]};
var DATA = {"passages": {"1": "<h1>Strictly English</h1>\n<p class=\"sub\">British newspaper columnist Simon Heffer talks about his new book, 'Strictly English: the Correct Way to Write ... and Why It Matters', aimed at native speakers</p>\n<p>For the last couple of years I have sent a round-robin email to my colleagues at this newspaper every few weeks pointing out to them mistakes that we make in our use of the English language. Happily, these are reasonably rare. The emails have been circulated on the Internet – and are now available on the paper's website – and one of them ended up in the inbox of a publisher at Random House about this time last year.</p>\n<p>He asked me whether I would write a book not just on what constituted correct English, but also why it matters. The former is relatively easy to do, once one has armed oneself with the Oxford English Dictionary (OED) and some reputable grammar books by way of research materials. The latter, being a matter for debate, is less straightforward.</p>\n<p>I suppose my own interest in language started at school. Having studied French, Latin and Greek, I saw clearly how those languages had exported words into our own. When I studied German later on, I could see even more clearly why it was the sister tongue and what an enormous impact it had had on English. I saw that words had specific meanings and that, for the avoidance of doubt, it was best to use them in the correct way. Most of all, I became fascinated by grammar, and especially by the logic that drove it and that was common to all the other languages I knew. I did not intend in those days to earn a living by writing; but I was keen to ensure that my use of English was, as far as possible, correct.</p>\n<p>Studying English at university forced me to focus even more intently on what words actually meant: why would a writer choose that noun rather than another and why that adjective – or, in George Orwell's case, often no adjective at all. Was the ambiguity in a certain order of words deliberate or accidental? The whole question of communication is rooted in such things. For the second part of my degree I specialised in the history of the English language, studying how words had changed their meaning and how grammar had evolved. Language had become not just a tool for me, but something of a hobby.</p>\n<p>Can English, though, ever be fixed? Of course not: if you read a passage from Chaucer you will see that the meaning of words and the framework of grammar has shifted over the centuries, and both will continue to evolve. But we have had a standard dictionary now ever since the OED was completed in 1928, and learned men, many of whom contributed to the OED, wrote grammars a century ago that settled a pattern of language that was logical and free from the danger of ambiguity.</p>\n<p>It is to these standards that I hope Strictly English is looking. Our language is to a great extent settled and codified, and to a standard that people recognise and are comfortable with. All my book does is describe and commend that standard, and help people towards a capable grasp of the English tongue. We shall always need new words to describe new things; but we don't need the wrong word to describe the right thing, when the right word exists. Also, English grammar shouldn't be a matter for debate. It has a coherent and logical structure and we should stick to it.</p>\n<p>Some groups of people – state officials, academics, lawyers, certain breeds of scientist – talk to each other in a private language. Some official documents make little sense to lay people because they have to be written in a language that combines avoidance of the politically incorrect with constant use of the contemporary jargon of the profession. Some articles written by academics in particular are almost incomprehensible to those outside their circle. This is not because the outsiders are stupid. It is because the academics feel they have to write in a certain stilted, dense way in order to be taken seriously by their peers.</p>\n<p>Many officials seem to have lost the knack of communicating with people outside their closed world.</p>\n<p>Some academics, however, are bilingual. If asked to write for a publication outside the circle – such as a newspaper – they can rediscover the knack of writing reasonably plain English. They do not indulge themselves in such a fashion when they write for learned journals. It is almost as though the purpose of such writing is not to be clear: that the writer is recording research in order to prove to peers or superiors that he has discovered something.</p>\n<p>It does not seem to bother such people that their style is considered ugly and barbaric by anyone of discernment. It is repetitious, long-winded, abstract and abstruse. Those who write in such a way probably will not easily be discouraged, unless what is considered acceptable within their disciplines changes.</p>\n<p>The ideal style is one comprehensible to any intelligent person. If you make a conscious decision to communicate with a select group, so be it: but in trying to appeal to a large audience, or even a small one that you wish to be sure will understand your meaning, writing of the sort mentioned above will not do. This sort of writing used to be kept from the general public thanks to the need to find someone to publish it. The advent of the Internet means that it is now much more widespread than it used to be; and the fact that it is now so common and so accessible means that this sort of writing is having a harmful effect on the language and causing it to be corrupted.</p>"}, "answers": {"5": "D", "6": "E", "7": "B", "8": "H", "9": "C", "10": "C", "11": "A", "12": "D", "13": "C", "14": "B"}, "alt": {}, "expl": {"5": {"loc": "Para 5", "text": "'Can English, though, ever be fixed? Of course not... both will continue to evolve' → 'permanent' (D)."}, "6": {"loc": "Para 5", "text": "'learned men, many of whom contributed to the OED, wrote grammars a century ago' → 'knowledgeable' (E)."}, "7": {"loc": "Para 6", "text": "'Our language is to a great extent settled and codified, and to a standard that people recognise and are comfortable with' → 'general' (B)."}, "8": {"loc": "Para 6", "text": "'help people towards a capable grasp of the English tongue' → 'useful' (H)."}, "9": {"loc": "Para 6", "text": "'English grammar shouldn't be a matter for debate' → 'controversial' (C)."}, "10": {"loc": "Para 7", "text": "'the academics feel they have to write in a certain stilted, dense way in order to be taken seriously by their peers' → C, to impress other members of their group."}, "11": {"loc": "Para 9", "text": "'Some academics, however, are bilingual. If asked to write for a publication outside the circle... they can rediscover the knack of writing reasonably plain English' → A."}, "12": {"loc": "Para 10", "text": "'It does not seem to bother such people that their style is considered ugly and barbaric... It is repetitious, long-winded, abstract and abstruse' → D, the writer's dislike for the style."}, "13": {"loc": "Para 10", "text": "'Those who write in such a way probably will not easily be discouraged, unless what is considered acceptable within their disciplines changes' → C."}, "14": {"loc": "Final paragraph", "text": "'this sort of writing is having a harmful effect on the language and causing it to be corrupted' → B."}}};
var passages=DATA.passages, answers=DATA.answers, alt=DATA.alt, EXPL=DATA.expl;
function tf(n,t,yn){var opts=yn?['YES','NO','NOT GIVEN']:['TRUE','FALSE','NOT GIVEN'];return '<div class="tf-row" id="q'+n+'"><div class="statement"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="options">'+opts.map(o=>'<label><input type="radio" name="q'+n+'" value="'+o+'"> '+o+'</label>').join('')+'</div></div>'}
function gap(n){return '<span class="qnum">'+n+'</span><input class="gap" id="gap'+n+'">'}
function sel(n,t,letters){return '<div class="row" id="q'+n+'"><span class="qnum">'+n+'</span><span class="txt">'+t+'</span><select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select></div>'}
function selInline(n,letters){return '<select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select>'}
function mcq(n,t,opts){return '<div class="mcq" id="q'+n+'"><div class="prompt"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="choice-options">'+opts.map((o,i)=>'<label class="choice-option"><input type="radio" name="q'+n+'" value="'+'ABCD'[i]+'"> <b>'+'ABCD'[i]+'</b> '+o+'</label>').join('')+'</div></div>'}
var multiGroups={}, groupQNums={};
function multiSel(qA,qB,promptText,options){var name='g'+qA+'_'+qB;multiGroups[qA]=name;multiGroups[qB]=name;groupQNums[name]=[qA,qB];return '<div id="q_'+name+'" class="tf-row"><div class="statement"><span class="qnum">'+qA+', '+qB+'</span><span>'+promptText+'</span></div><div class="options">'+options.map(o=>'<label><input type="checkbox" name="'+name+'" value="'+o.letter+'"> <b>'+o.letter+'</b> '+o.text+'</label>').join('')+'</div></div>'}

function qhtml(p){
return '<div class="qgroup"><h3>Questions 5-9</h3><p><i>Complete the summary using the list of words, A–H, below.</i></p><div class="box"><b>A</b> simple &nbsp; <b>B</b> general &nbsp; <b>C</b> controversial &nbsp; <b>D</b> permanent<br><b>E</b> knowledgeable &nbsp; <b>F</b> compulsory &nbsp; <b>G</b> historic &nbsp; <b>H</b> useful</div><p class="summary-text"><b>THE RULES OF ENGLISH</b><br>According to the writer, the English language should not be considered something '+selInline(5,['A','B','C','D','E','F','G','H'])+', and this will always be the case. However, there have been accepted reference books for over a century that were produced by '+selInline(6,['A','B','C','D','E','F','G','H'])+' people, and these have established a system for the language that enables people to express themselves in a completely clear way. In his own book, the writer aims to describe and support the established rules of the language that are '+selInline(7,['A','B','C','D','E','F','G','H'])+' use and that people are accustomed to. He also wants his book to be '+selInline(8,['A','B','C','D','E','F','G','H'])+' as a way of improving people’s ability at the language. He believes that there is no reason why someone’s use of vocabulary should not be correct and that grammar should not be a '+selInline(9,['A','B','C','D','E','F','G','H'])+' subject. In his view, a system of grammar rules exists and people should always obey those rules.</p></div><div class="qgroup"><h3>Questions 10-14</h3><p>Choose the correct letter, A, B, C or D.</p>'+mcq(10,'The writer says that some groups of people use a ‘private language’ because',['they do not want outsiders to be able to understand them.','they want to show their superiority over other groups.','they want to impress other members of their group.','they do not want to use the same language as other groups.'])+mcq(11,'According to the writer, some academics are capable of',['making sense to people outside their group.','writing very clearly for learned journals.','changing the way they communicate within their own group.','explaining other people’s work to the general public.'])+mcq(12,'When discussing the writing of academics about their research, the writer emphasises',['his own lack of knowledge of the academic world.','his desire to understand what they describe.','his sympathy for some of the academics.','his dislike for the style used in their writing.'])+mcq(13,'The writer says that the kind of language used by academics in journals',['is becoming more widely understood by non-academics.','is attracting a lot of criticism from other academics.','will only change if they are forced to change it.','appeals only to highly intelligent people.'])+mcq(14,'The writer’s opinion of the Internet is that',['it is making people more aware of the poor use of language.','it is encouraging standards of language use to fall.','it is enabling people to compare good and poor use of language.','it is making it harder for good writing to get published.'])+'</div>';
}

function render(){partTitle.textContent='Reading Passage 1';var r=ranges[active];partSub.textContent='Read the text and answer questions '+r[0]+'-'+r[1]+'.';left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();drawFooter();left.scrollTop=right.scrollTop=0}
function val(n){if(multiGroups[n]){var boxes=document.querySelectorAll('input[name="'+multiGroups[n]+'"]:checked');return Array.from(boxes).map(b=>b.value).join(',')}var g=document.getElementById('gap'+n);if(g)return g.value;var s=document.getElementById('sel'+n);if(s)return s.value;var r=document.querySelector('input[name="q'+n+'"]:checked');return r?r.value:''}
function save(){for(var n=1;n<=40;n++){var v=val(n);if(v)state[n]=v}}
function restore(){for(var n=1;n<=40;n++){if(!state[n])continue;if(multiGroups[n]){var vals=state[n].split(',');vals.forEach(function(v){var cb=document.querySelector('input[name="'+multiGroups[n]+'"][value="'+v+'"]');if(cb)cb.checked=true});continue}var g=document.getElementById('gap'+n);if(g)g.value=state[n];var s=document.getElementById('sel'+n);if(s)s.value=state[n];var r=document.querySelector('input[name="q'+n+'"][value="'+state[n]+'"]');if(r)r.checked=true}}
function answered(n){return !!state[n]||!!val(n)}
function count(p){var r=ranges[p],c=0;for(var i=r[0];i<=r[1];i++)if(answered(i))c++;return c}
function drawFooter(){save();var h='';[1].forEach(p=>{var r=ranges[p];h+='<div class="partnav"><button class="partlabel" data-part="'+p+'" disabled>Reading Passage 1</button>';if(p===active){h+='<div class="tiles">';for(var n=r[0];n<=r[1];n++)h+='<button class="tile '+(answered(n)?'answered':'')+'" data-q="'+n+'">'+n+'</button>';h+='</div>'}else h+='<span class="count">'+count(p)+' of '+(r[1]-r[0]+1)+'</span>';h+='</div>'});h+='<button class="review" id="review">OK</button>';footer.innerHTML=h}
document.addEventListener('change',()=>{save();drawFooter();checkAutoGrade();sendProgress();});document.addEventListener('input',()=>{save();drawFooter();sendProgress();});function checkAutoGrade(){if(graded)return;var r=ranges[1];for(var n=r[0];n<=r[1];n++)if(!answered(n))return;silentGrade();}function sendProgress(){if(graded)return;try{var r=ranges[1];var items=[];for(var n=r[0];n<=r[1];n++)items.push({n:n,value:state[n]||''});parent.postMessage({type:'cdi-reading-progress',items:items},'*');}catch(e){}}
var lastScore=null;
function renderActive(){left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();if(revealed){regradeCurrent();right.insertAdjacentHTML('afterbegin','<div class="score">Your score: <b>'+lastScore+' / 10</b></div><p style="margin:-8px 0 18px;color:#555">Explanations with the exact location in the passage are shown below each answer.</p>')}drawFooter();left.scrollTop=right.scrollTop=0}
footer.onclick=e=>{var p=e.target.closest('[data-part]');if(p){save();active=+p.dataset.part;renderActive();return}var q=e.target.closest('[data-q]');if(q){var n=+q.dataset.q;(document.getElementById('q'+n)||document.getElementById('gap'+n)||document.getElementById('sel'+n))?.scrollIntoView({behavior:'smooth',block:'center'});return}if(e.target.closest('#review'))review()};
function review(){save();var r=ranges[1];var a=0;for(var n=r[0];n<=r[1];n++)if(answered(n))a++;subwrap.innerHTML='<p>You have answered <b>'+a+'</b> of 10 questions.</p><p><button class="ovrow submit" id="final">Submit test</button></p>';final.onclick=grade;submit.classList.add('show')}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function correct(n,v){if(multiGroups[n]){var parts=(v||'').split(',').map(norm).filter(Boolean);return parts.includes(norm(answers[n]))}return [answers[n]].concat(alt[n]||[]).some(a=>norm(a)===norm(v))}
function explHTML(n){var e=EXPL[n];if(!e)return '';return '<div class="expl"><b>Q'+n+' — correct answer: '+answers[n]+'</b> &nbsp;<span class="expl-loc">('+e.loc+')</span><br>'+e.text+'</div>'}
function markGap(n){var x=document.getElementById('gap'+n);if(!x)return;var ok=correct(n,x.value);x.disabled=true;x.classList.add(ok?'ok':'no');x.insertAdjacentHTML('afterend',(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>')+explHTML(n));return ok}
function markSel(n){var s=document.getElementById('sel'+n);if(!s)return;var ok=correct(n,s.value);s.disabled=true;s.classList.add(ok?'ok':'no');var row=document.getElementById('q'+n);var tag=(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>');if(row){row.insertAdjacentHTML('beforeend',tag);row.insertAdjacentHTML('afterend',explHTML(n))}else{s.insertAdjacentHTML('afterend',tag);var host=s.closest('p')||s;host.insertAdjacentHTML('afterend',explHTML(n))}return ok}
function markRadio(n){var r=document.querySelector('input[name="q'+n+'"]:checked');var ok=r&&correct(n,r.value);document.querySelectorAll('input[name="q'+n+'"]').forEach(i=>i.disabled=true);var box=document.getElementById('q'+n);box.insertAdjacentHTML('beforeend',(ok?'<span class="tag ok">\u2713</span>':'<span class="tag no">\u2718 correct: '+answers[n]+'</span>'));box.insertAdjacentHTML('afterend',explHTML(n));return ok}
function markMulti(group){var qNums=groupQNums[group];var boxes=document.querySelectorAll('input[name="'+group+'"]');var checkedVals=Array.from(boxes).filter(function(b){return b.checked}).map(function(b){return b.value});boxes.forEach(function(b){b.disabled=true});var container=document.getElementById('q_'+group);var tagHtml='';qNums.forEach(function(qn){var ok=checkedVals.includes(answers[qn]);tagHtml+=' '+(ok?'<span class="tag ok">Q'+qn+' \u2713</span>':'<span class="tag no">Q'+qn+' \u2718 correct: '+answers[qn]+'</span>')});container.insertAdjacentHTML('beforeend','<div style="margin-top:8px;">'+tagHtml+'</div>');var explAll='';qNums.forEach(function(qn){explAll+=explHTML(qn)});container.insertAdjacentHTML('afterend',explAll)}
function regradeCurrent(){var r=ranges[active];var doneGroups={};for(var n=r[0];n<=r[1];n++){if(multiGroups[n]){if(!doneGroups[multiGroups[n]]){markMulti(multiGroups[n]);doneGroups[multiGroups[n]]=true}continue}var g=document.getElementById('gap'+n),s=document.getElementById('sel'+n),rad=document.querySelector('input[name="q'+n+'"]');if(g)markGap(n);else if(s)markSel(n);else if(rad)markRadio(n)}}
function silentGrade(){if(graded)return;save();var r=ranges[1];var score=0;for(var n=r[0];n<=r[1];n++)if(correct(n,state[n]||''))score++;lastScore=score;graded=true;try{parent.postMessage({type:'cdi-reading-result',score:lastScore,max:(r[1]-r[0]+1),items:(function(){var arr=[];for(var n=r[0];n<=r[1];n++)arr.push({n:n,value:state[n]||'',correct:correct(n,state[n]||'')});return arr;})()},'*');}catch(e){}}
function grade(){silentGrade();revealed=true;active=1;renderActive();submit.classList.remove('show')}
var drag=false;div.onmousedown=()=>{drag=true;document.body.style.userSelect='none'};window.onmouseup=()=>{drag=false;document.body.style.userSelect=''};window.onmousemove=e=>{if(!drag)return;var r=split.getBoundingClientRect();left.style.width=Math.max(220,Math.min(r.width-240,e.clientX-r.left))+'px'};
split.onmouseup=()=>setTimeout(()=>{var s=getSelection();if(!s||s.isCollapsed||!s.rangeCount){tools.style.display='none';return}var rg=s.getRangeAt(0);if(!split.contains(rg.commonAncestorContainer)){tools.style.display='none';return}var rc=rg.getBoundingClientRect();tools.style.display='flex';tools.style.left=(rc.left+scrollX)+'px';tools.style.top=Math.max(8,rc.top+scrollY-42)+'px'},1);
tools.onclick=e=>{var b=e.target.closest('button'),s=getSelection();if(!b||!s.rangeCount)return;var rg=s.getRangeAt(0);if(b.dataset.act==='hl'){try{var sp=document.createElement('span');sp.className='hl';rg.surroundContents(sp)}catch(_){document.execCommand('hiliteColor',false,'#ffe45c')}}else document.querySelectorAll('.hl').forEach(h=>h.replaceWith(document.createTextNode(h.textContent)));s.removeAllRanges();tools.style.display='none'};
render();
window.addEventListener('message',function(event){var d=event.data;if(!d||d.type!=='cdi-reading-restore')return;(d.items||[]).forEach(function(item){if(item.value)state[item.n]=item.value;});restore();drawFooter();});
})();
</script></body></html>
