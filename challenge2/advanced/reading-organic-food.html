</style></head><body><header class="top"><button>|||</button><button>o</button><button>=</button></header><div class="banner"><h2 id="partTitle"></h2><p id="partSub"></p></div><div class="split" id="split"><section class="pane left" id="left"></section><div class="divider" id="div"></div><section class="pane right" id="right"></section></div><footer class="bar" id="footer"></footer><div class="tools" id="tools"><button data-act="hl">Highlight</button><button data-act="clear">Clear</button></div><div class="overlay" id="submit"><div class="ovh"><h2>Submission page</h2><button class="close" onclick="submit.classList.remove('show')">x</button></div><div class="ovlist" id="subwrap"></div></div><script>

var active=1,graded=false,state={},ranges={1:[1,13]};
var DATA = {"passages": {"1": "<h1>Organic Food: Why?</h1>\n<p class=\"sub\">by Rob Lyons and Jan Bowman</p>\n<p>Today, many governments are promoting organic or natural farming methods that avoid the use of pesticides and other artificial products. The aim is to show that they care about the environment and about people's health. But is this the right approach?</p>\n<div class=\"para\">A</div>\n<p>Europe is now the biggest market for organic food in the world, expanding by 25 percent a year over the past 10 years. So what is the attraction of organic food for some people? The really important thing is that organic sounds more 'natural'. Eating organic is a way of defining oneself as natural, good, caring, different from the junk-food-scoffing masses. As one journalist puts it: 'It feels closer to the source, the beginning, the start of things.' The real desire is to be somehow close to the soil, to Mother Nature.</p>\n<div class=\"para\">B</div>\n<p>Unlike conventional farming, the organic approach means farming with natural, rather than man-made, fertilisers and pesticides. Techniques such as crop rotation improve soil quality and help organic farmers compensate for the absence of man-made chemicals. As a method of food production, organic is, however, inefficient in its use of labour and land; there are severe limits to how much food can be produced. Also, the environmental benefits of not using artificial fertiliser are tiny compared with the amount of carbon dioxide emitted by transporting food (a great deal of Britain's organic produce is shipped in from other countries and transported from shop to home by car).</p>\n<div class=\"para\">C</div>\n<p>Organic farming is often claimed to be safer than conventional farming – for the environment and for consumers. Yet studies into organic farming worldwide continue to reject this claim. An extensive review by the UK Food Standards Agency found that there was no statistically significant difference between organic and conventional crops. Even where results indicated there was evidence of a difference, the reviewers found no sign that these differences would have any noticeable effect on health.</p>\n<div class=\"para\">D</div>\n<p>The simplistic claim that organic food is more nutritious than conventional food was always likely to be misleading. Food is a natural product, and the health value of different foods will vary for a number of reasons, including freshness, the way the food is cooked, the type of soil it is grown in, the amount of sunlight and rain crops have received, and so on. Likewise, the flavour of a carrot has less to do with whether it was fertilised with manure or something out of a plastic sack than with the variety of carrot and how long ago it was dug up. The differences created by these things are likely to be greater than any differences brought about by using an organic or non-organic system of production. Indeed, even some 'organic' farms are quite different from one another.</p>\n<div class=\"para\">E</div>\n<p>The notion that organic food is safer than 'normal' food is also contradicted by the fact that many of our most common foods are full of natural toxins. Parsnips cause blisters on the skin of agricultural workers. Toasting bread creates carcinogens. As one research expert says: 'People think that the more natural something is, the better it is for them. That is simply not the case. In fact, it is the opposite that is true: the closer a plant is to its natural state, the more likely it is that it will poison you. Naturally, many plants do not want to be eaten, so we have spent 10,000 years developing agriculture and breeding out harmful traits from crops.'</p>\n<div class=\"para\">F</div>\n<p>Yet educated Europeans are more scared of eating traces of a few, strictly regulated, man-made chemicals than they are of eating the ones that nature created directly. Surrounded by plentiful food, it's not nature they worry about, but technology. Our obsessions with the ethics and safety of what we eat – concerns about antibiotics in animals, additives in food, GM crops and so on – are symptomatic of a highly technological society that has little faith in its ability to use this technology wisely. In this context, the less something is touched by the human hand, the healthier people assume it must be.</p>\n<div class=\"para\">G</div>\n<p>Ultimately, the organic farming movement is an expensive luxury for shoppers in well-manicured Europe. For developing parts of the world, it is irrelevant. To European environmentalists, the fact that organic methods require more labour and land than conventional ones to get the same yields is a good thing; to a farmer in rural Africa, it is a disaster. Here, land tends to be so starved and crop yields so low that there simply is not enough organic matter to put back into the soil. Perhaps the focus should be on helping these countries to gain access to the most advanced farming techniques, rather than going back to basics.</p>\n<p style=\"font-size:14px;color:#555;\">adapted from articles in Spiked</p>"}, "answers": {"1": "viii", "2": "v", "3": "i", "4": "iii", "5": "ix", "6": "vii", "7": "iv", "8": "B", "9": "E", "10": "B", "11": "D", "12": "B", "13": "E"}, "alt": {}, "expl": {"1": {"loc": "Paragraph A", "text": "'The real desire is to be somehow close to the soil, to Mother Nature' — explains why organic food is popular → viii."}, "2": {"loc": "Paragraph B", "text": "'the organic approach means farming with natural... fertilisers and pesticides. Techniques such as crop rotation...' → v, a description of organic farming."}, "3": {"loc": "Paragraph C", "text": "'studies into organic farming worldwide continue to reject this claim. An extensive review by the UK Food Standards Agency found...' → i, research into whether organic food is better for us."}, "4": {"loc": "Paragraph D", "text": "'the health value of different foods will vary for a number of reasons, including freshness, the way the food is cooked, the type of soil...' → iii, factors that affect food quality."}, "5": {"loc": "Paragraph E", "text": "Discusses natural toxins hidden in ordinary foods (parsnips, toasted bread) → ix, the need to remove hidden dangers from food."}, "6": {"loc": "Paragraph F", "text": "'educated Europeans are more scared of eating traces of... man-made chemicals... it's not nature they worry about, but technology' → vii, fear of science created the organic trend."}, "7": {"loc": "Paragraph G", "text": "'To European environmentalists... a good thing; to a farmer in rural Africa, it is a disaster' → iv, the rich and poor see things differently."}, "8": {"loc": "Paragraph B", "text": "'Techniques such as crop rotation' — using the same field for different crops over time → B."}, "9": {"loc": "Paragraph B", "text": "'the amount of carbon dioxide emitted by transporting food' → E, production of greenhouse gases."}, "10": {"loc": "Paragraph D", "text": "'the amount of sunlight and rain crops have received' → B, weather conditions during growth."}, "11": {"loc": "Paragraph D", "text": "'how long ago it was dug up' → D, when the plants were removed from the earth."}, "12": {"loc": "Paragraph E", "text": "'the closer a plant is to its natural state, the more likely it is that it will poison you' — organic food, being closer to a natural state, is implicated in this risk → B."}, "13": {"loc": "Paragraph G", "text": "'For developing parts of the world, it is irrelevant... there simply is not enough organic matter to put back into the soil' → E, not possible in some countries."}}};

function tf(n,t,yn){var opts=yn?['YES','NO','NOT GIVEN']:['TRUE','FALSE','NOT GIVEN'];return '<div class="tf-row" id="q'+n+'"><div class="statement"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="options">'+opts.map(o=>'<label><input type="radio" name="q'+n+'" value="'+o+'"> '+o+'</label>').join('')+'</div></div>'}
function gap(n){return '<span class="qnum">'+n+'</span><input class="gap" id="gap'+n+'">'}
function sel(n,t,letters){return '<div class="row" id="q'+n+'"><span class="qnum">'+n+'</span><span class="txt">'+t+'</span><select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select></div>'}
function selInline(n,letters){return '<select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select>'}
function mcq(n,t,opts){return '<div class="mcq" id="q'+n+'"><div class="prompt"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="choice-options">'+opts.map((o,i)=>'<label class="choice-option"><input type="radio" name="q'+n+'" value="'+'ABCD'[i]+'"> <b>'+'ABCD'[i]+'</b> '+o+'</label>').join('')+'</div></div>'}
var multiGroups={}, groupQNums={};
function multiSel(qA,qB,promptText,options){var name='g'+qA+'_'+qB;multiGroups[qA]=name;multiGroups[qB]=name;groupQNums[name]=[qA,qB];return '<div id="q_'+name+'" class="tf-row"><div class="statement"><span class="qnum">'+qA+', '+qB+'</span><span>'+promptText+'</span></div><div class="options">'+options.map(o=>'<label><input type="checkbox" name="'+name+'" value="'+o.letter+'"> <b>'+o.letter+'</b> '+o.text+'</label>').join('')+'</div></div>'}

function qhtml(p){
return '<div class="qgroup"><h3>Questions 1-7</h3><p><i>The reading passage has seven paragraphs, A–G. Choose the correct heading for paragraphs B–G from the list of headings below.</i></p><div class="box"><b>i</b> Research into whether organic food is better for us<br><b>ii</b> Adding up the cost of organic food<br><b>iii</b> The factors that can affect food quality<br><b>iv</b> The rich and poor see things differently<br><b>v</b> A description of organic farming<br><b>vi</b> Testing the taste of organic food<br><b>vii</b> Fear of science has created the organic trend<br><b>viii</b> The main reason for the popularity of organic food<br><b>ix</b> The need to remove hidden dangers from food</div>'+sel(1,'Paragraph A',['i','ii','iii','iv','v','vi','vii','viii','ix'])+sel(2,'Paragraph B',['i','ii','iii','iv','v','vi','vii','viii','ix'])+sel(3,'Paragraph C',['i','ii','iii','iv','v','vi','vii','viii','ix'])+sel(4,'Paragraph D',['i','ii','iii','iv','v','vi','vii','viii','ix'])+sel(5,'Paragraph E',['i','ii','iii','iv','v','vi','vii','viii','ix'])+sel(6,'Paragraph F',['i','ii','iii','iv','v','vi','vii','viii','ix'])+sel(7,'Paragraph G',['i','ii','iii','iv','v','vi','vii','viii','ix'])+'</div><div class="qgroup"><h3>Questions 8 and 9</h3><p>Choose <b>TWO</b> letters, A–E. Which <b>TWO</b> of the following points does the writer mention in connection with organic farming?</p>'+multiSel(8,9,'',[{letter:'A',text:'the occasional use of pesticides'},{letter:'B',text:'using the same field for different crops'},{letter:'C',text:'testing soil quality'},{letter:'D',text:'reducing the number of farm workers'},{letter:'E',text:'the production of greenhouse gases'}])+'</div><div class="qgroup"><h3>Questions 10 and 11</h3><p>Choose <b>TWO</b> letters, A–E. According to the writer, which <b>TWO</b> factors affect the nutritional content of food?</p>'+multiSel(10,11,'',[{letter:'A',text:'who prepares the food'},{letter:'B',text:'the weather conditions during growth'},{letter:'C',text:'where the food has been stored'},{letter:'D',text:'when the plants were removed from the earth'},{letter:'E',text:'the type of farm the food was grown on'}])+'</div><div class="qgroup"><h3>Questions 12 and 13</h3><p>Choose <b>TWO</b> letters, A–E. Which <b>TWO</b> negative aspects of organic farming does the writer mention?</p>'+multiSel(12,13,'',[{letter:'A',text:'Consumers complain about the extra cost.'},{letter:'B',text:'Organic food may make people ill.'},{letter:'C',text:'Farm workers have to be specially trained.'},{letter:'D',text:'It requires too much technological expertise.'},{letter:'E',text:'It is not possible in some countries.'}])+'</div>';
}

function render(){partTitle.textContent='Reading Passage 1';var r=ranges[active];partSub.textContent='Read the text and answer questions '+r[0]+'-'+r[1]+'.';left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();drawFooter();left.scrollTop=right.scrollTop=0}
function val(n){if(multiGroups[n]){var boxes=document.querySelectorAll('input[name="'+multiGroups[n]+'"]:checked');return Array.from(boxes).map(b=>b.value).join(',')}var g=document.getElementById('gap'+n);if(g)return g.value;var s=document.getElementById('sel'+n);if(s)return s.value;var r=document.querySelector('input[name="q'+n+'"]:checked');return r?r.value:''}
function save(){for(var n=1;n<=40;n++){var v=val(n);if(v)state[n]=v}}
function restore(){for(var n=1;n<=40;n++){if(!state[n])continue;if(multiGroups[n]){var vals=state[n].split(',');vals.forEach(function(v){var cb=document.querySelector('input[name="'+multiGroups[n]+'"][value="'+v+'"]');if(cb)cb.checked=true});continue}var g=document.getElementById('gap'+n);if(g)g.value=state[n];var s=document.getElementById('sel'+n);if(s)s.value=state[n];var r=document.querySelector('input[name="q'+n+'"][value="'+state[n]+'"]');if(r)r.checked=true}}
function answered(n){return !!state[n]||!!val(n)}
function count(p){var r=ranges[p],c=0;for(var i=r[0];i<=r[1];i++)if(answered(i))c++;return c}
function drawFooter(){save();var h='';[1].forEach(p=>{var r=ranges[p];h+='<div class="partnav"><button class="partlabel" data-part="'+p+'" disabled>Reading Passage 1</button>';if(p===active){h+='<div class="tiles">';for(var n=r[0];n<=r[1];n++)h+='<button class="tile '+(answered(n)?'answered':'')+'" data-q="'+n+'">'+n+'</button>';h+='</div>'}else h+='<span class="count">'+count(p)+' of '+(r[1]-r[0]+1)+'</span>';h+='</div>'});h+='<button class="review" id="review">OK</button>';footer.innerHTML=h}
document.addEventListener('change',()=>{save();drawFooter()});document.addEventListener('input',()=>{save();drawFooter()});
var lastScore=null;
function renderActive(){left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();if(graded){regradeCurrent();right.insertAdjacentHTML('afterbegin','<div class="score">Your score: <b>'+lastScore+' / 13</b></div><p style="margin:-8px 0 18px;color:#555">Explanations with the exact location in the passage are shown below each answer.</p>')}drawFooter();left.scrollTop=right.scrollTop=0}
footer.onclick=e=>{var p=e.target.closest('[data-part]');if(p){save();active=+p.dataset.part;renderActive();return}var q=e.target.closest('[data-q]');if(q){var n=+q.dataset.q;(document.getElementById('q'+n)||document.getElementById('gap'+n)||document.getElementById('sel'+n))?.scrollIntoView({behavior:'smooth',block:'center'});return}if(e.target.closest('#review'))review()};
function review(){save();var a=0;for(var n=1;n<=13;n++)if(answered(n))a++;subwrap.innerHTML='<p>You have answered <b>'+a+'</b> of 13 questions.</p><p><button class="ovrow submit" id="final">Submit test</button></p>';final.onclick=grade;submit.classList.add('show')}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function correct(n,v){if(multiGroups[n]){var parts=(v||'').split(',').map(norm).filter(Boolean);return parts.includes(norm(answers[n]))}return [answers[n]].concat(alt[n]||[]).some(a=>norm(a)===norm(v))}
function explHTML(n){var e=EXPL[n];if(!e)return '';return '<div class="expl"><b>Q'+n+' — correct answer: '+answers[n]+'</b> &nbsp;<span class="expl-loc">('+e.loc+')</span><br>'+e.text+'</div>'}
function markGap(n){var x=document.getElementById('gap'+n);if(!x)return;var ok=correct(n,x.value);x.disabled=true;x.classList.add(ok?'ok':'no');x.insertAdjacentHTML('afterend',(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>')+explHTML(n));return ok}
function markSel(n){var s=document.getElementById('sel'+n);if(!s)return;var ok=correct(n,s.value);s.disabled=true;s.classList.add(ok?'ok':'no');var row=document.getElementById('q'+n);var tag=(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>');if(row){row.insertAdjacentHTML('beforeend',tag);row.insertAdjacentHTML('afterend',explHTML(n))}else{s.insertAdjacentHTML('afterend',tag);var host=s.closest('p')||s;host.insertAdjacentHTML('afterend',explHTML(n))}return ok}
function markRadio(n){var r=document.querySelector('input[name="q'+n+'"]:checked');var ok=r&&correct(n,r.value);document.querySelectorAll('input[name="q'+n+'"]').forEach(i=>i.disabled=true);var box=document.getElementById('q'+n);box.insertAdjacentHTML('beforeend',(ok?'<span class="tag ok">\u2713</span>':'<span class="tag no">\u2718 correct: '+answers[n]+'</span>'));box.insertAdjacentHTML('afterend',explHTML(n));return ok}
function markMulti(group){var qNums=groupQNums[group];var boxes=document.querySelectorAll('input[name="'+group+'"]');var checkedVals=Array.from(boxes).filter(function(b){return b.checked}).map(function(b){return b.value});boxes.forEach(function(b){b.disabled=true});var container=document.getElementById('q_'+group);var tagHtml='';qNums.forEach(function(qn){var ok=checkedVals.includes(answers[qn]);tagHtml+=' '+(ok?'<span class="tag ok">Q'+qn+' \u2713</span>':'<span class="tag no">Q'+qn+' \u2718 correct: '+answers[qn]+'</span>')});container.insertAdjacentHTML('beforeend','<div style="margin-top:8px;">'+tagHtml+'</div>');var explAll='';qNums.forEach(function(qn){explAll+=explHTML(qn)});container.insertAdjacentHTML('afterend',explAll)}
function regradeCurrent(){var r=ranges[active];var doneGroups={};for(var n=r[0];n<=r[1];n++){if(multiGroups[n]){if(!doneGroups[multiGroups[n]]){markMulti(multiGroups[n]);doneGroups[multiGroups[n]]=true}continue}var g=document.getElementById('gap'+n),s=document.getElementById('sel'+n),rad=document.querySelector('input[name="q'+n+'"]');if(g)markGap(n);else if(s)markSel(n);else if(rad)markRadio(n)}}
function grade(){if(graded)return;save();var score=0;for(var n=1;n<=13;n++)if(correct(n,state[n]||''))score++;var items=[];for(var m=1;m<=13;m++)items.push({n:m,value:state[m]||'',correct:correct(m,state[m]||'')});try{window.parent.postMessage({type:'cdi-reading-result',score:score,max:13,items:items},'*')}catch(e){}lastScore=score;graded=true;active=1;renderActive();submit.classList.remove('show')}
var drag=false;div.onmousedown=()=>{drag=true;document.body.style.userSelect='none'};window.onmouseup=()=>{drag=false;document.body.style.userSelect=''};window.onmousemove=e=>{if(!drag)return;var r=split.getBoundingClientRect();left.style.width=Math.max(220,Math.min(r.width-240,e.clientX-r.left))+'px'};
split.onmouseup=()=>setTimeout(()=>{var s=getSelection();if(!s||s.isCollapsed||!s.rangeCount){tools.style.display='none';return}var rg=s.getRangeAt(0);if(!split.contains(rg.commonAncestorContainer)){tools.style.display='none';return}var rc=rg.getBoundingClientRect();tools.style.display='flex';tools.style.left=(rc.left+scrollX)+'px';tools.style.top=Math.max(8,rc.top+scrollY-42)+'px'},1);
tools.onclick=e=>{var b=e.target.closest('button'),s=getSelection();if(!b||!s.rangeCount)return;var rg=s.getRangeAt(0);if(b.dataset.act==='hl'){try{var sp=document.createElement('span');sp.className='hl';rg.surroundContents(sp)}catch(_){document.execCommand('hiliteColor',false,'#ffe45c')}}else document.querySelectorAll('.hl').forEach(h=>h.replaceWith(document.createTextNode(h.textContent)));s.removeAllRanges();tools.style.display='none'};
render();
})();
