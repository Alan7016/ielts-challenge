var active=1,graded=false,revealed=false,state={},ranges={1:[1,13],2:[14,26]};
var DATA = {"passages": {"1": "<h1>Domestic Robots</h1>\n<p class=\"sub\">Machines that look after your home are getting cleverer, but they still need care and attention if they are to perform as intended.</p>\n<p>Floor-cleaning machines capable of responding to their environment were among the first commercially available domestic products worthy of being called robots. The best known is the Roomba, made by iRobot, an American company which has sold more than three million of the disc-shaped, frisbee-sized vacuuming robots. The latest, the fifth version of the Roomba, has more sensors and cleverer software than its predecessors. Press the 'Clean' button and the robot glides out of its docking station and sets off across the floor.</p>\n<p>Domestic robots are supposed to free up time so that you can do other things, but watching how the Roomba deals with obstacles is strangely compelling. It is capable of sensing its surroundings, and does not simply try to adhere to a pre-planned route, so it is not upset if furniture is moved, or if it is picked up and taken to clean another room. Its infra-red sensors enable it to slow down before reaching an obstacle – such as a door by cat – changing direction and setting off again.</p>\n<p>It steadily works its way around the room, figuring out how to get out from under the television stand or untangle itself from a stray Game Boy recharging lead. Watch it for long enough, and you can sometimes predict its next move. The machine has a 'dirt sensor' and flashes a blue light when it finds things to clean up. Only when it detects no more dirt does it stop going over the same area and, eventually, conclude that the whole room is clean. It then trundles back to its recharging station.</p>\n<p>So the first observation of life with a domestic robot is that you will keep watching it before you trust it completely. Perhaps it's not surprising: after all, when automatic washing machines first appeared, people used to draw up a chair and sit and watch them complete their wash, rinse and spin cycles. Now they just load them, switch them on and leave them to it.</p>\n<p>The second observation is that, despite their current level of intelligence, certain allowances must be made to get the best out of a domestic robot. Roomba can be set up to clean at particular times, and to clean more than one room (small infra-red 'lighthouses' can be positioned in doorways, creating an invisible barrier between one room and the next that is only removed when the first room has been cleaned). A 'drop-off' sensor underneath the robot prevents it from falling down stairs. All very clever, but the Roomba will not do its job if it is not picking up toys, shoes and other things lying around. Rooms cared for by robots must be kept tidy. To start with, children will happily put things away in order to watch the robot set off, but unfortunately the novelty soon wears off.</p>\n<p>Similar allowances must be made for other domestic robots. Sweden's Husqvarna recently launched a new version of its Automower lawn mowing robot. Before it can be used, a wire must be placed around the perimeter of the lawn to define the part to be cut. If toys and other obstacles are not cleared from the lawn before it starts work, the robot will steer around them, leaving uncut areas. However, the latest version can top up its batteries with solar power, and sets its own timer a text message if it gets into trouble trying to climb a mole-hill.</p>\n<p>But there is still only a limited range of domestic robots. Machines that mop the floor, clean a swimming pool and clear muck from guttering are made by iRobot. Several surveillance robots are also on offer. The Rovio, made by WowWee of Hong Kong, is a wi-fi-enabled webcam, mounted on an extending arm, which rides along smoothly on a nimble set of three wheels. Its movement can be remotely operated over the Internet via a laptop or mobile phone. The idea is that Rovio can patrol the home when its owner is away, either automatically or under manual control: in the latter case, two-way communication allows the operator to see and talk via the machine. So you could, for instance, shout at the cat if it is sleeping on your best sofa.</p>\n<p>Some machines are called robots even though they cannot move around. There is the ironing robot, for instance, an inflatable dummy: put a damp shirt on it, and it puffs up to remove the creases. Similarly, there are elaborate trouser presses that aspire to be robots. But do these devices really count as robots? If so, then surely dishwashers and washing machines do, too.</p>\n<p>Yet whatever shape or size robots come in, many will be adored. Another important observation from living with a robot is that it tends to become part of the family. 'People give them names, and if they have to be sent back for repair, they carefully add a mark to them to ensure they get the same machine back,' says Nancy Dassault Smith of iRobot.</p>", "2": "<h1>Deforestation in the 21st Century</h1>\n<p class=\"sub\">When it comes to cutting down trees, satellite data reveals a shift from the patterns of the past.</p>\n<div class=\"para\">A</div>\n<p>Globally, roughly 13 million hectares of forest are destroyed each year. Such deforestation has long been driven by farmers desperate to earn a living or by loggers building new roads into pristine forest. But now new data appears to show that big, block clearings that reflect industrial deforestation have come to dominate, rather than these smaller-scale efforts that leave behind long, narrow swaths of cleared land. Geographer Ruth DeFries of Columbia University and her colleagues used satellite images to analyse tree-clearing in countries ringing the tropics, representing 98 per cent of all remaining tropical forest. Instead of the usual 'fish bone' signature of deforestation from small-scale operations, large, chunky blocks of cleared land reveal a new motive for cutting down woods.</p>\n<div class=\"para\">B</div>\n<p>In fact, a statistical analysis of 41 countries showed that forest loss rates were most closely linked with urban population growth and agricultural exports in the early part of the 21st century – even overall population growth was not as strong an influence. 'In previous decades, deforestation was associated with planned colonisation, resettlement schemes in local areas and farmers clearing land to grow food for subsistence,' DeFries says. 'What we're seeing now is a shift from small-scale farmers driving deforestation to distant demands from urban growth, agricultural trade and exports being more important drivers.'</p>\n<div class=\"para\">C</div>\n<p>In other words, the increasing urbanisation of the developing world, as populations leave rural areas to concentrate in booming cities, is driving deforestation, rather than containing it. Coupled with this there is an ongoing increase in consumption in the developed world of products that have an impact on forests, whether furniture, shoe leather or chicken feed. 'One of the really striking characteristics of this century is urbanisation and rapid urban growth in the developing world,' DeFries says. 'People in cities need to eat.' 'There's no surprise there,' observes Scott Poynton, executive director of the Tropical Forest Trust, a Switzerland-based organisation that helps businesses implement and manage sustainable forestry in countries such as Brazil, Congo and Indonesia. 'It's not about people chopping down trees. It's all the people in New York, Europe and elsewhere who want cheap products, primarily food.'</p>\n<div class=\"para\">D</div>\n<p>DeFries argues that in order to help sustain this increasing urban and global demand, agricultural productivity will need to be increased on lands that have already been cleared. This means that better crop varieties or better management techniques will need to be used on the many degraded and abandoned lands in the tropics. And the Tropical Forest Trust is building management systems to keep illegally harvested wood from ending up in, for example, deck chairs, as well as expanding its efforts to look at how to reduce the 'forest footprint' of agricultural products such as palm oil. Poynton says, 'The point is to give forests value as forests, to keep them as forests and give them a use as forests. They're not going to be locked away as national parks. That's not going to happen.'</p>\n<div class=\"para\">E</div>\n<p>But it is not all bad news. Halts in tropical deforestation have resulted in forest regrowth in some areas where tropical lands were previously cleared. And forest clearing in the Amazon, the world's largest tropical forest, dropped from roughly 1.9 million hectares a year in the 1990s to 1.6 million hectares a year over the last decade, according to the Brazilian government. 'We know that deforestation has slowed down in at least the Brazilian Amazon,' DeFries says. 'Every place is different. Every country has its own particular situation, circumstances and driving forces.'</p>\n<div class=\"para\">F</div>\n<p>Regardless of this, deforestation continues, and cutting down forests is one of the largest sources of greenhouse gas emissions from human activity – a double blow that both eliminates a biological system to suck up CO₂ and creates a new source of greenhouse gases in the form of decaying plants. The United Nations Environment Programme estimates that slowing such deforestation could reduce some 50 billion metric tons of CO₂, or more than a year of global emissions. Indeed, international climate negotiations are attempting to set up a system to encourage this, known as the UN Development Programme's fund for reducing emissions from deforestation and forest degradation in developing countries (REDD). If policies like REDD are to be effective, we need to understand what the driving forces are behind deforestation, DeFries argues. This is particularly important in the light of new pressures that are on the horizon: the need to reduce our dependence on fossil fuels and find alternative power sources, particularly for private cars, is forcing governments to make products such as biofuels more readily accessible. This will only exacerbate the pressures on tropical forests.</p>\n<div class=\"para\">G</div>\n<p>But millions of hectares of pristine forest remain to protect, according to this new analysis from Columbia University. Approximately 60 percent of the remaining tropical forests are in countries or areas that currently have little agricultural trade or urban growth. The amount of forest area in places like central Africa, Guyana and Suriname, DeFries notes, is huge. 'There's a lot of forest that has not yet faced these pressures.'</p>"}, "answers": {"1": "TRUE", "2": "FALSE", "3": "TRUE", "4": "TRUE", "5": "NOT GIVEN", "6": "FALSE", "7": "a wire", "8": "solar power", "9": "an inflatable dummy", "10": "a mark", "11": "an extending arm", "12": "movement", "13": "two-way communication", "14": "D", "15": "E", "16": "A", "17": "F", "18": "A", "19": "G", "20": "C", "21": "D", "22": "B", "23": "C", "24": "forest footprint", "25": "decaying plants", "26": "60 percent"}, "alt": {"7": ["wire"], "9": ["inflatable dummy"], "10": ["mark"], "11": ["extending arm"], "12": ["smooth movement", "manoeuvring", "maneuvering"], "26": ["60%"]}, "expl": {"1": {"loc": "Para 1", "text": "'The latest, the fifth version of the Roomba, has more sensors and cleverer software than its predecessors' → TRUE."}, "2": {"loc": "Para 2", "text": "'It is capable of sensing its surroundings... so it is not upset if furniture is moved' — it works around obstacles rather than requiring their removal → FALSE."}, "3": {"loc": "Para 3", "text": "'Only when it detects no more dirt does it stop going over the same area' → TRUE."}, "4": {"loc": "Para 4", "text": "'people used to draw up a chair and sit and watch them complete their wash, rinse and spin cycles' → TRUE."}, "5": {"loc": "Whole passage", "text": "No comparative studies on domestic robot intelligence are mentioned → NOT GIVEN."}, "6": {"loc": "Para 5", "text": "'the Roomba will not do its job if it is not picking up toys, shoes and other things lying around. Rooms cared for by robots must be kept tidy' — the room must already be tidy, the robot doesn't tidy it → FALSE."}, "7": {"loc": "Para 6", "text": "'a wire must be placed around the perimeter of the lawn to define the part to be cut' → 'a wire'."}, "8": {"loc": "Para 6", "text": "'the latest version can top up its batteries with solar power' → 'solar power'."}, "9": {"loc": "Para 8", "text": "'There is the ironing robot, for instance, an inflatable dummy' → 'an inflatable dummy'."}, "10": {"loc": "Final paragraph", "text": "'they carefully add a mark to them to ensure they get the same machine back' → 'a mark'."}, "11": {"loc": "Para 7", "text": "'a wi-fi-enabled webcam, mounted on an extending arm' → 'an extending arm'."}, "12": {"loc": "Para 7", "text": "'rides along smoothly on a nimble set of three wheels. Its movement can be remotely operated' → 'movement'."}, "13": {"loc": "Para 7", "text": "'in the latter case, two-way communication allows the operator to see and talk via the machine' → 'two-way communication'."}, "14": {"loc": "Paragraph D", "text": "'better crop varieties or better management techniques will need to be used' → D."}, "15": {"loc": "Paragraph E", "text": "'forest clearing in the Amazon... dropped from roughly 1.9 million hectares a year in the 1990s to 1.6 million hectares a year over the last decade' → E."}, "16": {"loc": "Paragraph A", "text": "'roughly 13 million hectares of forest are destroyed each year' → A."}, "17": {"loc": "Paragraph F", "text": "'the need to... find alternative power sources, particularly for private cars, is forcing governments to make products such as biofuels more readily accessible. This will only exacerbate the pressures on tropical forests' → F."}, "18": {"loc": "Paragraph A", "text": "'the usual ‘fish bone’ signature of deforestation from small-scale operations' → A."}, "19": {"loc": "Paragraph G", "text": "'Approximately 60 percent of the remaining tropical forests are in countries or areas that currently have little agricultural trade or urban growth' → G."}, "20": {"loc": "Paragraph C", "text": "'People in cities need to eat' → C."}, "21": {"loc": "Paragraph C", "text": "'all the people in New York, Europe and elsewhere who want cheap products' → D, low-budget consumer items."}, "22": {"loc": "Paragraph D", "text": "'agricultural productivity will need to be increased on lands that have already been cleared... the many degraded and abandoned lands in the tropics' → B, soil becomes less fertile."}, "23": {"loc": "Paragraph E", "text": "'Halts in tropical deforestation have resulted in forest regrowth in some areas' → C."}, "24": {"loc": "Paragraph D", "text": "'reduce the ‘forest footprint’ of agricultural products such as palm oil' → 'forest footprint'."}, "25": {"loc": "Paragraph F", "text": "'creates a new source of greenhouse gases in the form of decaying plants' → 'decaying plants'."}, "26": {"loc": "Paragraph G", "text": "'Approximately 60 percent of the remaining tropical forests are in countries or areas that currently have little agricultural trade or urban growth' → '60 percent'."}}};

function tf(n,t,yn){var opts=yn?['YES','NO','NOT GIVEN']:['TRUE','FALSE','NOT GIVEN'];return '<div class="tf-row" id="q'+n+'"><div class="statement"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="options">'+opts.map(o=>'<label><input type="radio" name="q'+n+'" value="'+o+'"> '+o+'</label>').join('')+'</div></div>'}

function multiSel(qA,qB,promptText,options){var name='g'+qA+'_'+qB;multiGroups[qA]=name;multiGroups[qB]=name;groupQNums[name]=[qA,qB];return '<div id="q_'+name+'" class="tf-row"><div class="statement"><span class="qnum">'+qA+', '+qB+'</span><span>'+promptText+'</span></div><div class="options">'+options.map(o=>'<label><input type="checkbox" name="'+name+'" value="'+o.letter+'"> <b>'+o.letter+'</b> '+o.text+'</label>').join('')+'</div></div>'}

return '<div class="qgroup"><h3>Questions 14-19</h3><p><i>Reading Passage 2 has seven paragraphs, A–G. Which paragraph contains the following information?</i></p><p><b><i>NB</i></b> <i>You may use any letter more than once.</i></p>'+sel(14,'Two ways that farming activity might be improved in the future.',['A','B','C','D','E','F','G'])+sel(15,'Reference to a fall in the rate of deforestation in one area.',['A','B','C','D','E','F','G'])+sel(16,'The amount of forest cut down annually.',['A','B','C','D','E','F','G'])+sel(17,'How future transport requirements may increase deforestation levels.',['A','B','C','D','E','F','G'])+sel(18,'A reference to the typical shape of early deforested areas.',['A','B','C','D','E','F','G'])+sel(19,'Key reasons why forests in some areas have not been cut down.',['A','B','C','D','E','F','G'])+'</div><div class="qgroup"><h3>Questions 20 and 21</h3><p>Choose <b>TWO</b> letters, A–E. Which <b>TWO</b> of these reasons do experts give for current patterns of deforestation?</p>'+multiSel(20,21,'',[{letter:'A',text:'To provide jobs'},{letter:'B',text:'To create transport routes'},{letter:'C',text:'To feed city dwellers'},{letter:'D',text:'To manufacture low-budget consumer items'},{letter:'E',text:'To meet government targets'}])+'</div><div class="qgroup"><h3>Questions 22 and 23</h3><p>Choose <b>TWO</b> letters, A–E. The list below gives some of the impacts of tropical deforestation. Which <b>TWO</b> of these results are mentioned by the writer of the text?</p>'+multiSel(22,23,'',[{letter:'A',text:'Local food supplies fall'},{letter:'B',text:'Soil becomes less fertile'},{letter:'C',text:'Some areas have new forest growth'},{letter:'D',text:'Some regions become uninhabitable'},{letter:'E',text:'Local economies suffer'}])+'</div><div class="qgroup"><h3>Questions 24-26</h3><p><i>Complete the sentences below. Choose <b>NO MORE THAN TWO WORDS and/or A NUMBER</b> from the passage for each answer.</i></p><p class="summary-text"><span class="qnum">24</span>The expression ‘'+gap(24)+'’ is used to assess the amount of wood used in certain types of production.</p><p class="summary-text"><span class="qnum">25</span>Greenhouse gases result from the '+gap(25)+' that remain after trees have been cut down.</p><p class="summary-text"><span class="qnum">26</span>About '+gap(26)+' of the world’s tropical forests have not experienced deforestation yet.</p></div>';

function render(){partTitle.textContent='Passage '+active;var r=ranges[active];partSub.textContent='Read the text and answer questions '+r[0]+'-'+r[1]+'.';left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();drawFooter();left.scrollTop=right.scrollTop=0}
function val(n){if(multiGroups[n]){var boxes=document.querySelectorAll('input[name="'+multiGroups[n]+'"]:checked');return Array.from(boxes).map(b=>b.value).join(',')}var g=document.getElementById('gap'+n);if(g)return g.value;var s=document.getElementById('sel'+n);if(s)return s.value;var r=document.querySelector('input[name="q'+n+'"]:checked');return r?r.value:''}
function save(){for(var n=1;n<=40;n++){var v=val(n);if(v)state[n]=v}}
function restore(){for(var n=1;n<=40;n++){if(!state[n])continue;if(multiGroups[n]){var vals=state[n].split(',');vals.forEach(function(v){var cb=document.querySelector('input[name="'+multiGroups[n]+'"][value="'+v+'"]');if(cb)cb.checked=true});continue}var g=document.getElementById('gap'+n);if(g)g.value=state[n];var s=document.getElementById('sel'+n);if(s)s.value=state[n];var r=document.querySelector('input[name="q'+n+'"][value="'+state[n]+'"]');if(r)r.checked=true}}
function answered(n){return !!state[n]||!!val(n)}
function count(p){var r=ranges[p],c=0;for(var i=r[0];i<=r[1];i++)if(answered(i))c++;return c}
function drawFooter(){save();var h='';[1,2].forEach(p=>{var r=ranges[p];h+='<div class="partnav"><button class="partlabel" data-part="'+p+'">Passage '+p+'</button>';if(p===active){h+='<div class="tiles">';for(var n=r[0];n<=r[1];n++)h+='<button class="tile '+(answered(n)?'answered':'')+'" data-q="'+n+'">'+n+'</button>';h+='</div>'}else h+='<span class="count">'+count(p)+' of '+(r[1]-r[0]+1)+'</span>';h+='</div>'});h+='<button class="review" id="review">OK</button>';footer.innerHTML=h}
document.addEventListener('change',()=>{save();drawFooter()});document.addEventListener('input',()=>{save();drawFooter()});
var lastScore=null;
function renderActive(){left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();if(revealed){regradeCurrent();right.insertAdjacentHTML('afterbegin','<div class="score">Your score: <b>'+lastScore+' / 26</b></div><p style="margin:-8px 0 18px;color:#555">Explanations with the exact location in the passage are shown below each answer. Switch Passage 1/2 tabs to review the rest.</p>')}drawFooter();left.scrollTop=right.scrollTop=0}
footer.onclick=e=>{var p=e.target.closest('[data-part]');if(p){save();active=+p.dataset.part;renderActive();return}var q=e.target.closest('[data-q]');if(q){var n=+q.dataset.q;(document.getElementById('q'+n)||document.getElementById('gap'+n)||document.getElementById('sel'+n))?.scrollIntoView({behavior:'smooth',block:'center'});return}if(e.target.closest('#review'))review()};
function review(){save();var a=0;for(var n=1;n<=26;n++)if(answered(n))a++;subwrap.innerHTML='<p>You have answered <b>'+a+'</b> of 26 questions.</p><p><button class="ovrow submit" id="final">Submit test</button></p>';final.onclick=grade;submit.classList.add('show')}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function correct(n,v){if(multiGroups[n]){var parts=(v||'').split(',').map(norm).filter(Boolean);return parts.includes(norm(answers[n]))}return [answers[n]].concat(alt[n]||[]).some(a=>norm(a)===norm(v))}
function explHTML(n){var e=EXPL[n];if(!e)return '';return '<div class="expl"><b>Q'+n+' — correct answer: '+answers[n]+'</b> &nbsp;<span class="expl-loc">('+e.loc+')</span><br>'+e.text+'</div>'}
function markGap(n){var x=document.getElementById('gap'+n);if(!x)return;var ok=correct(n,x.value);x.disabled=true;x.classList.add(ok?'ok':'no');x.insertAdjacentHTML('afterend',(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>')+explHTML(n));return ok}
function markSel(n){var s=document.getElementById('sel'+n);if(!s)return;var ok=correct(n,s.value);s.disabled=true;s.classList.add(ok?'ok':'no');var row=document.getElementById('q'+n);var tag=(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>');if(row){row.insertAdjacentHTML('beforeend',tag);row.insertAdjacentHTML('afterend',explHTML(n))}else{s.insertAdjacentHTML('afterend',tag);var host=s.closest('p')||s;host.insertAdjacentHTML('afterend',explHTML(n))}return ok}
function markRadio(n){var r=document.querySelector('input[name="q'+n+'"]:checked');var ok=r&&correct(n,r.value);document.querySelectorAll('input[name="q'+n+'"]').forEach(i=>i.disabled=true);var box=document.getElementById('q'+n);box.insertAdjacentHTML('beforeend',(ok?'<span class="tag ok">\u2713</span>':'<span class="tag no">\u2718 correct: '+answers[n]+'</span>'));box.insertAdjacentHTML('afterend',explHTML(n));return ok}
function markMulti(group){var qNums=groupQNums[group];var boxes=document.querySelectorAll('input[name="'+group+'"]');var checkedVals=Array.from(boxes).filter(function(b){return b.checked}).map(function(b){return b.value});boxes.forEach(function(b){b.disabled=true});var container=document.getElementById('q_'+group);var tagHtml='';qNums.forEach(function(qn){var ok=checkedVals.includes(answers[qn]);tagHtml+=' '+(ok?'<span class="tag ok">Q'+qn+' \u2713</span>':'<span class="tag no">Q'+qn+' \u2718 correct: '+answers[qn]+'</span>')});container.insertAdjacentHTML('beforeend','<div style="margin-top:8px;">'+tagHtml+'</div>');var explAll='';qNums.forEach(function(qn){explAll+=explHTML(qn)});container.insertAdjacentHTML('afterend',explAll)}
function regradeCurrent(){var r=ranges[active];var doneGroups={};for(var n=r[0];n<=r[1];n++){if(multiGroups[n]){if(!doneGroups[multiGroups[n]]){markMulti(multiGroups[n]);doneGroups[multiGroups[n]]=true}continue}var g=document.getElementById('gap'+n),s=document.getElementById('sel'+n),rad=document.querySelector('input[name="q'+n+'"]');if(g)markGap(n);else if(s)markSel(n);else if(rad)markRadio(n)}}
function silentGrade(){if(graded)return;save();var score=0;for(var n=1;n<=26;n++)if(correct(n,state[n]||''))score++;lastScore=score;graded=true}
function grade(){silentGrade();revealed=true;active=1;renderActive();submit.classList.remove('show')}
