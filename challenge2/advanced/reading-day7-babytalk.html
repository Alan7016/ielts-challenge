</style></head><body><header class="top"><button>|||</button><button>o</button><button>=</button></header><div class="banner"><h2 id="partTitle"></h2><p id="partSub"></p></div><div class="split" id="split"><section class="pane left" id="left"></section><div class="divider" id="div"></div><section class="pane right" id="right"></section></div><footer class="bar" id="footer"></footer><div class="tools" id="tools"><button data-act="hl">Highlight</button><button data-act="clear">Clear</button></div><div class="overlay" id="submit"><div class="ovh"><h2>Submission page</h2><button class="close" onclick="submit.classList.remove('show')">x</button></div><div class="ovlist" id="subwrap"></div></div><script>
(function(){
var active=1,graded=false,revealed=false,state={},ranges={1:[1,14]};
var DATA = {"passages": {"1": "<h1>Why Don't Babies Talk Like Adults?</h1>\n<p class=\"sub\">Kids go from 'goo-goo' to talkative one step at a time</p>\n<p style=\"font-size:14px;color:#555;\">By Joshua Hartshorne</p>\n<p>A recent e-trade advertisement shows a baby speaking directly to the camera: 'Look at this,' he says, 'I'm a free man. I go anywhere I want now.' He describes his stock-buying activities, and then his phone rings. This advertisement proves what comedians have known for years: few things are as funny as a baby who talks like an adult. But it also raises an important question: Why don't young children express themselves clearly like adults?</p>\n<p>Many people assume children learn to talk by copying what they hear. In other words, they listen to the words adults use and the situations in which they use them and imitate accordingly. Behaviourism, the scientific approach that dominated American cognitive science for the first half of the 20th century, made exactly this argument.</p>\n<p>However, this 'copycat' theory can't explain why toddlers aren't as conversational as adults. After all, you never hear literate adults express themselves in one-word sentences like 'bottle' or 'doggie'. In fact, it's easy for scientists to show that a copycat theory of language acquisition can't explain children's first words. What is hard for them to do is explain these first words, and how they fit into the language acquisition pattern.</p>\n<p>Over the past half-century, scientists have settled on two reasonable possibilities. The first of these is called the 'mental-developmental hypothesis'. It states that one-year-olds speak in baby talk because their immature brains can't handle adult speech. Children don't learn to walk until their bodies are ready. Likewise, they don't speak multi-word sentences or use word endings and function words ('Mummy opened the boxes') before their brains are ready.</p>\n<p>The second is called the 'stages-of-language hypothesis', which states that the stages of progress in child speech are necessary stages in language development.</p>\n<p>A basketball player can't perfect his or her jump shot before learning to (1) jump and (2) shoot. Similarly, children learn to multiply after they have learned to add. This is the order in which children are taught – not the reverse. There's evidence, for instance, that children don't usually begin speaking in two-word sentences until they've learned a certain number of single words. In other words, until they've crossed that linguistic threshold, the word-combination process doesn't get going.</p>\n<p>The difference between these theories is this: under the mental-development hypothesis, language learning should depend on the child's age and level of mental development when he or she starts learning a language. Under the stages-of-language hypothesis, however, ...</p>\n<p>Neuroscientists Jesse Snedeker, Joy Geren and Carissa Shafto studied the language development of 27 children adopted from China between the ages of two and five years. These children began learning English at an older age than US natives and had more mature brains with which to tackle the task. Even so, just as with American-born infants, their first English sentences consisted of single words and were largely bereft of function words, word endings and verbs. The adoptees then went through the same stages as typical American-born children, albeit at a faster clip. The adoptees and native children started combining words in sentences when their vocabulary reached the same sizes, further suggesting that what matters is not how old you are or how mature your brain is, but the number of words you know.</p>\n<p>This finding – that having more mature brains did not help the adoptees avoid the toddler-talk stage – suggests that babies speak in babytalk not because they have baby brains, but because they have only just started learning and need time to gain enough vocabulary to be able to expand their conversations. Before long, the one-word stage will give way to the two-word stage and so on. Learning how to chat like an adult is a gradual process.</p>\n<p>But this potential answer also raises an even older and more difficult question. Adult immigrants who learn a second language rarely achieve the same proficiency in a foreign language as the average child raised as a native speaker. Researchers have long suspected there is a 'critical period' for language development, after which it cannot proceed with full success to fluency. Yet we still do not understand this critical period or know why it ends.</p>"}, "answers": {"1": "YES", "2": "YES", "3": "NOT GIVEN", "4": "NO", "5": "C", "6": "B", "7": "A", "8": "F", "9": "E", "10": "D", "11": "C", "12": "C", "13": "B", "14": "D"}, "alt": {}, "expl": {"1": {"loc": "Para 1", "text": "'few things are as funny as a baby who talks like an adult' → YES."}, "2": {"loc": "Para 2", "text": "'Behaviourism... made exactly this argument' (that children learn by copying adults) → YES."}, "3": {"loc": "Whole passage", "text": "No comparison is made between children's conversations with adults versus other children → NOT GIVEN."}, "4": {"loc": "Para 3", "text": "'it's easy for scientists to show that a copycat theory... can't explain children's first words. What is hard for them to do is explain these first words' — the opposite of easy → NO."}, "5": {"loc": "Para 4", "text": "'they don't speak multi-word sentences... before their brains are ready' — implies needing time to develop → 'time' (C)."}, "6": {"loc": "Para 4", "text": "'Children don't learn to walk until their bodies are ready' → 'physical movement' (B)."}, "7": {"loc": "Para 8", "text": "'what matters is not how old you are or how mature your brain is, but the number of words you know' → 'vocabulary level' (A)."}, "8": {"loc": "Para 6", "text": "'children don't usually begin speaking in two-word sentences until they've learned a certain number of single words' — sentence formation follows the vocabulary threshold → 'sentence formation' (F)."}, "9": {"loc": "Para 6", "text": "'children learn to multiply after they have learned to add' → 'mathematical knowledge' (E), paralleling the staged development of language."}, "10": {"loc": "Para 7", "text": "The study of adopted children is used as evidence to support the stages/vocabulary-based account of language learning → D."}, "11": {"loc": "Para 7", "text": "'These children began learning English at an older age than US natives' → C."}, "12": {"loc": "Para 7", "text": "'The adoptees then went through the same stages as typical American-born children, albeit at a faster clip' → C, the rate of acquisition."}, "13": {"loc": "Para 8", "text": "'having more mature brains did not help the adoptees avoid the toddler-talk stage' supports the idea that language develops in fixed steps → B."}, "14": {"loc": "Final paragraph", "text": "'there is a ‘critical period’ for language development, after which it cannot proceed with full success to fluency' → D."}}};
var passages=DATA.passages, answers=DATA.answers, alt=DATA.alt, EXPL=DATA.expl;
function tf(n,t,yn){var opts=yn?['YES','NO','NOT GIVEN']:['TRUE','FALSE','NOT GIVEN'];return '<div class="tf-row" id="q'+n+'"><div class="statement"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="options">'+opts.map(o=>'<label><input type="radio" name="q'+n+'" value="'+o+'"> '+o+'</label>').join('')+'</div></div>'}
function gap(n){return '<span class="qnum">'+n+'</span><input class="gap" id="gap'+n+'">'}
function sel(n,t,letters){return '<div class="row" id="q'+n+'"><span class="qnum">'+n+'</span><span class="txt">'+t+'</span><select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select></div>'}
function selInline(n,letters){return '<select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select>'}
function mcq(n,t,opts){return '<div class="mcq" id="q'+n+'"><div class="prompt"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="choice-options">'+opts.map((o,i)=>'<label class="choice-option"><input type="radio" name="q'+n+'" value="'+'ABCD'[i]+'"> <b>'+'ABCD'[i]+'</b> '+o+'</label>').join('')+'</div></div>'}
var multiGroups={}, groupQNums={};
function multiSel(qA,qB,promptText,options){var name='g'+qA+'_'+qB;multiGroups[qA]=name;multiGroups[qB]=name;groupQNums[name]=[qA,qB];return '<div id="q_'+name+'" class="tf-row"><div class="statement"><span class="qnum">'+qA+', '+qB+'</span><span>'+promptText+'</span></div><div class="options">'+options.map(o=>'<label><input type="checkbox" name="'+name+'" value="'+o.letter+'"> <b>'+o.letter+'</b> '+o.text+'</label>').join('')+'</div></div>'}

function qhtml(p){
return '<div class="qgroup"><h3>Questions 1-4</h3><p><i>Do the following statements agree with the claims of the writer in the passage? Write <b>YES / NO / NOT GIVEN</b>.</i></p>'+tf(1,'People are extremely amused when they see a baby talk like an adult.',true)+tf(2,'Behaviourists of the early 20th century argued that children learn to speak by copying adults.',true)+tf(3,'Children have more conversations with adults than with other children.',true)+tf(4,'Scientists have found it easy to work out why babies use one-word sentences.',true)+'</div><div class="qgroup"><h3>Questions 5-9</h3><p><i>Complete the summary using the list of words and phrases, A–H, below.</i></p><div class="box"><b>A</b> vocabulary level &nbsp; <b>B</b> physical movement &nbsp; <b>C</b> time &nbsp; <b>D</b> attention<br><b>E</b> mathematical knowledge &nbsp; <b>F</b> sentence formation &nbsp; <b>G</b> learning &nbsp; <b>H</b> teaching</div><p class="summary-text"><b>Two theories about babytalk</b><br>According to the writer, there are two main theories related to babytalk. One states that a young child’s brain needs '+selInline(5,['A','B','C','D','E','F','G','H'])+' to master language, in the same way that it does to master other abilities such as '+selInline(6,['A','B','C','D','E','F','G','H'])+'.<br><br>The second theory states that a child’s '+selInline(7,['A','B','C','D','E','F','G','H'])+' is the key factor. According to this theory, some key steps have to occur in a logical sequence before '+selInline(8,['A','B','C','D','E','F','G','H'])+' occurs. Children’s '+selInline(9,['A','B','C','D','E','F','G','H'])+' develops in the same way.</p></div><div class="qgroup"><h3>Questions 10-14</h3><p>Choose the correct letter, A, B, C or D.</p>'+mcq(10,'What is the writer’s main purpose in the seventh paragraph?',['to give reasons why adopted children were used in the study','to reject the view that adopted children need two languages','to argue that culture affects the way children learn a language','to justify a particular approach to language learning'])+mcq(11,'Snedeker, Geren and Shafto based their study on children who',['were finding it difficult to learn English.','had come from a number of language backgrounds.','were learning English at a later age than US children.','had taken English lessons in China.'])+mcq(12,'What aspect of the adopted children’s language development differed from that of US-born children?',['their first words','the way they learnt English','the rate at which they acquired language','the point at which they started producing sentences'])+mcq(13,'What did the Harvard finding show?',['Not all toddlers use babytalk.','Language learning takes place in ordered steps.','Some children need more conversation than others.','Not all brains work in the same way.'])+mcq(14,'When the writer says ‘critical period’, he means a period when',['studies produce useful results.','adults need to be taught like children.','immigrants want to learn another language.','language learning takes place effectively.'])+'</div>';
}

function render(){partTitle.textContent='Reading Passage 1';var r=ranges[active];partSub.textContent='Read the text and answer questions '+r[0]+'-'+r[1]+'.';left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();drawFooter();left.scrollTop=right.scrollTop=0}
function val(n){if(multiGroups[n]){var boxes=document.querySelectorAll('input[name="'+multiGroups[n]+'"]:checked');return Array.from(boxes).map(b=>b.value).join(',')}var g=document.getElementById('gap'+n);if(g)return g.value;var s=document.getElementById('sel'+n);if(s)return s.value;var r=document.querySelector('input[name="q'+n+'"]:checked');return r?r.value:''}
function save(){for(var n=1;n<=40;n++){var v=val(n);if(v)state[n]=v}}
function restore(){for(var n=1;n<=40;n++){if(!state[n])continue;if(multiGroups[n]){var vals=state[n].split(',');vals.forEach(function(v){var cb=document.querySelector('input[name="'+multiGroups[n]+'"][value="'+v+'"]');if(cb)cb.checked=true});continue}var g=document.getElementById('gap'+n);if(g)g.value=state[n];var s=document.getElementById('sel'+n);if(s)s.value=state[n];var r=document.querySelector('input[name="q'+n+'"][value="'+state[n]+'"]');if(r)r.checked=true}}
function answered(n){return !!state[n]||!!val(n)}
function count(p){var r=ranges[p],c=0;for(var i=r[0];i<=r[1];i++)if(answered(i))c++;return c}
function drawFooter(){save();var h='';[1].forEach(p=>{var r=ranges[p];h+='<div class="partnav"><button class="partlabel" data-part="'+p+'" disabled>Reading Passage 1</button>';if(p===active){h+='<div class="tiles">';for(var n=r[0];n<=r[1];n++)h+='<button class="tile '+(answered(n)?'answered':'')+'" data-q="'+n+'">'+n+'</button>';h+='</div>'}else h+='<span class="count">'+count(p)+' of '+(r[1]-r[0]+1)+'</span>';h+='</div>'});h+='<button class="review" id="review">OK</button>';footer.innerHTML=h}
document.addEventListener('change',()=>{save();drawFooter();checkAutoGrade();sendProgress();});document.addEventListener('input',()=>{save();drawFooter();sendProgress();});function checkAutoGrade(){if(graded)return;var r=ranges[1];for(var n=r[0];n<=r[1];n++)if(!answered(n))return;silentGrade();}function sendProgress(){if(graded)return;try{var r=ranges[1];var items=[];for(var n=r[0];n<=r[1];n++)items.push({n:n,value:state[n]||''});parent.postMessage({type:'cdi-reading-progress',items:items},'*');}catch(e){}}
var lastScore=null;
function renderActive(){left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();if(revealed){regradeCurrent();right.insertAdjacentHTML('afterbegin','<div class="score">Your score: <b>'+lastScore+' / 14</b></div><p style="margin:-8px 0 18px;color:#555">Explanations with the exact location in the passage are shown below each answer.</p>')}drawFooter();left.scrollTop=right.scrollTop=0}
footer.onclick=e=>{var p=e.target.closest('[data-part]');if(p){save();active=+p.dataset.part;renderActive();return}var q=e.target.closest('[data-q]');if(q){var n=+q.dataset.q;(document.getElementById('q'+n)||document.getElementById('gap'+n)||document.getElementById('sel'+n))?.scrollIntoView({behavior:'smooth',block:'center'});return}if(e.target.closest('#review'))review()};
function review(){save();var r=ranges[1];var a=0;for(var n=r[0];n<=r[1];n++)if(answered(n))a++;subwrap.innerHTML='<p>You have answered <b>'+a+'</b> of 14 questions.</p><p><button class="ovrow submit" id="final">Submit test</button></p>';final.onclick=grade;submit.classList.add('show')}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function correct(n,v){if(multiGroups[n]){var parts=(v||'').split(',').map(norm).filter(Boolean);return parts.includes(norm(answers[n]))}return [answers[n]].concat(alt[n]||[]).some(a=>norm(a)===norm(v))}
function explHTML(n){var e=EXPL[n];if(!e)return '';return '<div class="expl"><b>Q'+n+' — correct answer: '+answers[n]+'</b> &nbsp;<span class="expl-loc">('+e.loc+')</span><br>'+e.text+'</div>'}
function markGap(n){var x=document.getElementById('gap'+n);if(!x)return;var ok=correct(n,x.value);x.disabled=true;x.classList.add(ok?'ok':'no');x.insertAdjacentHTML('afterend',(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>')+explHTML(n));return ok}
function markSel(n){var s=document.getElementById('sel'+n);if(!s)return;var ok=correct(n,s.value);s.disabled=true;s.classList.add(ok?'ok':'no');var row=document.getElementById('q'+n);var tag=(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>');if(row){row.insertAdjacentHTML('beforeend',tag);row.insertAdjacentHTML('afterend',explHTML(n))}else{s.insertAdjacentHTML('afterend',tag);var host=s.closest('p')||s;host.insertAdjacentHTML('afterend',explHTML(n))}return ok}
function markRadio(n){var r=document.querySelector('input[name="q'+n+'"]:checked');var ok=r&&correct(n,r.value);document.querySelectorAll('input[name="q'+n+'"]').forEach(i=>i.disabled=true);var box=document.getElementById('q'+n);box.insertAdjacentHTML('beforeend',(ok?'<span class="tag ok">\u2713</span>':'<span class="tag no">\u2718 correct: '+answers[n]+'</span>'));box.insertAdjacentHTML('afterend',explHTML(n));return ok}
function markMulti(group){var qNums=groupQNums[group];var boxes=document.querySelectorAll('input[name="'+group+'"]');var checkedVals=Array.from(boxes).filter(function(b){return b.checked}).map(function(b){return b.value});boxes.forEach(function(b){b.disabled=true});var container=document.getElementById('q_'+group);var tagHtml='';qNums.forEach(function(qn){var ok=checkedVals.includes(answers[qn]);tagHtml+=' '+(ok?'<span class="tag ok">Q'+qn+' \u2713</span>':'<span class="tag no">Q'+qn+' \u2718 correct: '+answers[qn]+'</span>')});container.insertAdjacentHTML('beforeend','<div style="margin-top:8px;">'+tagHtml+'</div>');var explAll='';qNums.forEach(function(qn){explAll+=explHTML(qn)});container.insertAdjacentHTML('afterend',explAll)}
function regradeCurrent(){var r=ranges[active];var doneGroups={};for(var n=r[0];n<=r[1];n++){if(multiGroups[n]){if(!doneGroups[multiGroups[n]]){markMulti(multiGroups[n]);doneGroups[multiGroups[n]]=true}continue}var g=document.getElementById('gap'+n),s=document.getElementById('sel'+n),rad=document.querySelector('input[name="q'+n+'"]');if(g)markGap(n);else if(s)markSel(n);else if(rad)markRadio(n)}}
function silentGrade(){if(graded)return;save();var r=ranges[1];var score=0;for(var n=r[0];n<=r[1];n++)if(correct(n,state[n]||''))score++;lastScore=score;graded=true;try{parent.postMessage({type:'cdi-reading-result',score:lastScore,max:(r[1]-r[0]+1),items:(function(){var arr=[];for(var n=r[0];n<=r[1];n++)arr.push({n:n,value:state[n]||'',correct:correct(n,state[n]||'')});return arr;})()},'*');}catch(e){}}
function grade(){silentGrade();revealed=true;active=1;renderActive();submit.classList.remove('show')}
var drag=false;div.onmousedown=()=>{drag=true;document.body.style.userSelect='none'};window.onmouseup=()=>{drag=false;document.body.style.userSelect=''};window.onmousemove=e=>{if(!drag)return;var r=split.getBoundingClientRect();left.style.width=Math.max(220,Math.min(r.width-240,e.clientX-r.left))+'px'};
split.onmouseup=()=>setTimeout(()=>{var s=getSelection();if(!s||s.isCollapsed||!s.rangeCount){tools.style.display='none';return}var rg=s.getRangeAt(0);if(!split.contains(rg.commonAncestorContainer)){tools.style.display='none';return}var rc=rg.getBoundingClientRect();tools.style.display='flex';tools.style.left=(rc.left+scrollX)+'px';tools.style.top=Math.max(8,rc.top+scrollY-42)+'px'},1);
tools.onclick=e=>{var b=e.target.closest('button'),s=getSelection();if(!b||!s.rangeCount)return;var rg=s.getRangeAt(0);if(b.dataset.act==='hl'){try{var sp=document.createElement('span');sp.className='hl';rg.surroundContents(sp)}catch(_){document.execCommand('hiliteColor',false,'#ffe45c')}}else document.querySelectorAll('.hl').forEach(h=>h.replaceWith(document.createTextNode(h.textContent)));s.removeAllRanges();tools.style.display='none'};
