t:inherit;border:1px solid #999;border-radius:4px;background:#fff;padding:5px 8px;width:175px;text-align:center;margin:0 5px}.notes{font-size:17px;line-height:1.75}.note-row{margin:10px 0}.box{background:#f2f3f4;border:1px solid #ddd;border-radius:6px;padding:14px 18px;line-height:1.7;font-size:17px;margin:14px 0}.row{display:flex;gap:12px;align-items:flex-start;margin:16px 0}.txt{flex:1;font-size:17px;line-height:1.45}.select{font:inherit;border:1px solid #cfcfcf;border-radius:7px;background:#f7f8f9;padding:8px 28px 8px 14px;min-width:86px}.tools{position:absolute;z-index:50;display:none;background:#222;border-radius:6px;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.2)}.tools button{background:none;border:0;color:#fff;padding:6px 10px;font:inherit}.hl{background:#ffe45c}.bar{height:59px;border-top:1px solid #ddd;display:flex;align-items:center;gap:28px;padding:8px 18px;background:#fff;overflow-x:auto}.partnav{display:flex;align-items:center;gap:8px;white-space:nowrap}.partlabel{font-weight:700;border:0;background:#fff;font:inherit;cursor:pointer}.count{color:#555;font-size:14px}.tiles{display:flex;gap:4px}.tile{min-width:32px;height:32px;border:1px solid #bbb;background:#fff;border-radius:2px;cursor:pointer}.tile.answered{background:#2b2b2b;color:#fff}.review{margin-left:auto;min-width:42px;height:34px;background:#ddd;border:0;border-radius:4px;font-weight:700}.overlay{position:fixed;inset:0;background:white;z-index:100;display:none;flex-direction:column;overflow:auto}.overlay.show{display:flex}.ovh{position:relative;padding:22px}.ovh h2{text-align:center;margin:0}.close{position:absolute;right:24px;top:18px;border:0;background:none;font-size:26px}.ovlist{max-width:880px;width:90%;margin:10px auto}.ovrow{width:100%;padding:18px 22px;border:1px solid #ddd;background:white;font:inherit;text-align:left}.submit{background:#cf3e45;color:white;border-color:#cf3e45;border-radius:6px;margin-bottom:18px;font-weight:700}.score{background:#f2f3f4;border:1px solid #ddd;border- </style></head><body><header class="top"><button>|||</button><button>o</button><button>=</button></header><div class="banner"><h2 id="partTitle"></h2><p id="partSub"></p></div><div class="split" id="split"><section class="pane left" id="left"></section><div class="divider" id="div"></div><section class="pane right" id="right"></section></div><footer class="bar" id="footer"></footer><div class="tools" id="tools"><button data-act="hl">Highlight</button><button data-act="clear">Clear</button></div><div class="overlay" id="submit"><div class="ovh"><h2>Submission page</h2><button class="close" onclick="submit.classList.remove('show')">x</button></div><div class="ovlist" id="subwrap"></div></div><script>
(function(){
var active=1,graded=false,state={},ranges={1:[1,13]};
var DATA = {"passages": {"1": "<h1>Third Culture Kids</h1>\n<p>In a world where international careers are becoming commonplace, the phenomenon of third culture kids (TCKs) – children who spend a significant portion of their developmental years in a culture outside their parents' passport culture(s) – is increasing exponentially. Not only is their number increasing, but the cultural complexity and relevance of their experience and the adult TCKs (ATCKs) they become, is also growing.</p>\n<p>When Ruth Hill Useem, a sociologist, first coined this term in the 1950s, she spent a year researching expatriates in India. She discovered that folks who came from their home (or first) culture and moved to a host (or second) culture, had, in reality, formed a culture, or lifestyle, different from either the first or second cultures. She called this the third culture and the children who grew up in this lifestyle 'third culture kids'. At that time, most expatriate families had parents from the same culture and they often remained in one host culture while overseas.</p>\n<p>This is no longer the case. Take, for example, Brice Royer, the founder of TCKid.com. His father is a half-French/half-Vietnamese UN peacekeeper, while his mom is Ethiopian. Brice lived in seven countries before he was eighteen including France, Mayotte, La Réunion, Ethiopia, Egypt, Canada and England. He writes, 'When people ask me “Where are you from?” I just joke around and say, “My mom says I'm from heaven...” What other answer can he give?'</p>\n<p>ATCK Elizabeth Dunbar's father, Roy, moved from Jamaica to Britain as a young boy. Her mother, Hortense, was born in Britain as the child of Jamaican immigrants who always planned to repatriate 'one day'. While Elizabeth began life in Britain, her dad's international career took the family to the United States, then to Venezuela and back to living in three different cities in the U.S. She soon realised that while racial diversity may be recognised, the hidden cultural diversity of her life remained invisible.</p>\n<p>Despite such complexities, however, most ATCKs say their experience of growing up among different cultural worlds has given them many priceless gifts. They have seen the world and often learnt several languages. More importantly, through friendships that cross the usual racial, national or social barriers, they have also learned the very different ways people see life. This offers a great opportunity to become social and cultural bridges between worlds that traditionally would never connect. ATCK Mikel Jentzsch, author of a best-selling book in Germany, Bloodbrothers – Our Friendship in Liberia, has a German passport but grew up in Niger and then Liberia. Before the Liberian civil war forced his family to leave, Mikel played daily with those who were later forced to become soldiers for that war. Through his eyes, the stories of those we would otherwise overlook come to life for the rest of us.</p>\n<p>Understanding the TCK experience is also important for other reasons. Many ATCKs are now in positions of influence and power. Their capacity to often think 'outside the box' can offer new and creative thinking for doing business and living in our globalising world. But that same thinking can create fear for those who see the world from a more traditional world view. Neither the non-ATCKs nor the ATCKs may recognise that there may be a cultural clash going on because, by traditional measures of diversity such as race or gender, they are alike.</p>\n<p>In addition, many people hear the benefits and challenges of the TCK profile described and wonder why they relate to it when they never lived overseas because of a parent's career. Usually, however, they have grown up cross-culturally in another way, perhaps as children of immigrants, refugees, bi-racial or bi-cultural unions, international adoptees, even children of minorities. If we see the TCK experience as a Petri dish of sorts – a place where the effects of growing up among many cultural worlds accompanied by a high degree of mobility have been studied – then we can look for what lessons may also be relevant to helping us understand issues other cross-cultural kids (CCKs) may also face. It is possible we may discover that we rethink our traditional ways of defining diversity and identity. For some, as for TCKs, 'culture' may be something defined by shared experience rather than shared nationality or ethnicity. In telling their stories and developing new models for our changing world, many will be able to recognise and use well the great gifts of a cross-cultural childhood and deal successfully with the challenges for their personal, communal and corporate good.</p>"}, "answers": {"1": "TRUE", "2": "TRUE", "3": "FALSE", "4": "FALSE", "5": "NOT GIVEN", "6": "TRUE", "7": "see life", "8": "fear", "9": "a cultural clash", "10": "mobility", "11": "cross-cultural kids", "12": "diversity and identity", "13": "shared experience"}, "alt": {"9": ["cultural clash"]}, "expl": {"1": {"loc": "Para 1", "text": "'In a world where international careers are becoming commonplace, the phenomenon of third culture kids (TCKs)... is increasing exponentially' → TRUE."}, "2": {"loc": "Para 1", "text": "'Not only is their number increasing, but the cultural complexity and relevance of their experience... is also growing' → TRUE."}, "3": {"loc": "Para 2", "text": "'she spent a year researching expatriates in India' — only one country → FALSE."}, "4": {"loc": "Para 2", "text": "the resulting culture is described as 'different from either the first or second cultures', not a mixture of them → FALSE."}, "5": {"loc": "Para 3", "text": "Brice's quote is a joke about not having a simple answer to 'where are you from' — his own feelings about benefiting are not stated → NOT GIVEN."}, "6": {"loc": "Para 4", "text": "'while racial diversity may be recognised, the hidden cultural diversity of her life remained invisible' → TRUE."}, "7": {"loc": "Para 5", "text": "'they have also learned the very different ways people see life' → 'see life'."}, "8": {"loc": "Para 6", "text": "'that same thinking can create fear for those who see the world from a more traditional world view' → 'fear'."}, "9": {"loc": "Para 6", "text": "'there may be a cultural clash going on because, by traditional measures of diversity such as race or gender, they are alike' → 'a cultural clash'."}, "10": {"loc": "Para 7", "text": "'a place where the effects of growing up among many cultural worlds accompanied by a high degree of mobility have been studied' → 'mobility'."}, "11": {"loc": "Para 7", "text": "'helping us understand issues other cross-cultural kids (CCKs) may also face' → 'cross-cultural kids'."}, "12": {"loc": "Para 7", "text": "'we rethink our traditional ways of defining diversity and identity' → 'diversity and identity'."}, "13": {"loc": "Para 7", "text": "'‘culture’ may be something defined by shared experience rather than shared nationality or ethnicity' → 'shared experience'."}}};
var passages=DATA.passages, answers=DATA.answers, alt=DATA.alt, EXPL=DATA.expl;
function tf(n,t,yn){var opts=yn?['YES','NO','NOT GIVEN']:['TRUE','FALSE','NOT GIVEN'];return '<div class="tf-row" id="q'+n+'"><div class="statement"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="options">'+opts.map(o=>'<label><input type="radio" name="q'+n+'" value="'+o+'"> '+o+'</label>').join('')+'</div></div>'}
function gap(n){return '<span class="qnum">'+n+'</span><input class="gap" id="gap'+n+'">'}
function sel(n,t,letters){return '<div class="row" id="q'+n+'"><span class="qnum">'+n+'</span><span class="txt">'+t+'</span><select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select></div>'}
function selInline(n,letters){return '<select class="select" id="sel'+n+'"><option value="">'+n+'</option>'+letters.map(l=>'<option>'+l+'</option>').join('')+'</select>'}
function mcq(n,t,opts){return '<div class="mcq" id="q'+n+'"><div class="prompt"><span class="qnum">'+n+'</span><span>'+t+'</span></div><div class="choice-options">'+opts.map((o,i)=>'<label class="choice-option"><input type="radio" name="q'+n+'" value="'+'ABCD'[i]+'"> <b>'+'ABCD'[i]+'</b> '+o+'</label>').join('')+'</div></div>'}
var multiGroups={}, groupQNums={};
function multiSel(qA,qB,promptText,options){var name='g'+qA+'_'+qB;multiGroups[qA]=name;multiGroups[qB]=name;groupQNums[name]=[qA,qB];return '<div id="q_'+name+'" class="tf-row"><div class="statement"><span class="qnum">'+qA+', '+qB+'</span><span>'+promptText+'</span></div><div class="options">'+options.map(o=>'<label><input type="checkbox" name="'+name+'" value="'+o.letter+'"> <b>'+o.letter+'</b> '+o.text+'</label>').join('')+'</div></div>'}

function qhtml(p){
return '<div class="qgroup"><h3>Questions 1-6</h3><p><i>Do the following statements agree with the information given in the reading passage? Write <b>TRUE / FALSE / NOT GIVEN</b>.</i></p>'+tf(1,'There is a close connection between careers and the number of TCKs.')+tf(2,'An increasing number of people describe themselves as TCKs.')+tf(3,'Ruth Hill Useem studied children in several countries.')+tf(4,'Ruth Hill Useem defined the third culture as a mixture of two parents’ original cultures.')+tf(5,'Brice Royer feels that he has benefited greatly from living in many different countries.')+tf(6,'Elizabeth Dunbar felt that she had a culture that was different from most people’s.')+'</div><div class="qgroup"><h3>Questions 7-13</h3><p><i>Complete the table below. Choose <b>NO MORE THAN THREE WORDS</b> from the passage for each answer.</i></p><div style="border:1px solid #ccc;border-radius:5px;padding:20px;background:#fafafa;"><p class="centered-title" style="color:#a0409e;font-weight:700;">THIRD CULTURE KIDS – ADVANTAGES AND RESULTS</p><table style="width:100%;border-collapse:collapse;font-size:15px;"><tr style="background:#f2d9f0;"><th style="padding:8px;text-align:left;border:1px solid #ddd;width:16%;">Area</th><th style="padding:8px;text-align:left;border:1px solid #ddd;width:32%;">Advantage for ATCKs</th><th style="padding:8px;text-align:left;border:1px solid #ddd;">Possible result</th></tr><tr><td style="padding:8px;border:1px solid #ddd;font-weight:600;">Friendships</td><td style="padding:8px;border:1px solid #ddd;">know how different people '+gap(7)+'</td><td style="padding:8px;border:1px solid #ddd;">can act as bridges between worlds that are usually separate</td></tr><tr><td style="padding:8px;border:1px solid #ddd;font-weight:600;">Business</td><td style="padding:8px;border:1px solid #ddd;">creative thinking</td><td style="padding:8px;border:1px solid #ddd;">may cause '+gap(8)+' among certain people<br><br>can lead to '+gap(9)+' despite similarities</td></tr><tr><td style="padding:8px;border:1px solid #ddd;font-weight:600;">Whole experience</td><td style="padding:8px;border:1px solid #ddd;">knowledge of many cultural worlds and a great deal of '+gap(10)+'</td><td style="padding:8px;border:1px solid #ddd;">can teach us about problems faced by '+gap(11)+' of all kinds<br><br>current ideas of what both '+gap(12)+' mean may be considered wrong<br><br>belief that culture depends on '+gap(13)+'</td></tr></table></div></div>';
}

function render(){partTitle.textContent='Reading Passage 1';var r=ranges[active];partSub.textContent='Read the text and answer questions '+r[0]+'-'+r[1]+'.';left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();drawFooter();left.scrollTop=right.scrollTop=0}
function val(n){if(multiGroups[n]){var boxes=document.querySelectorAll('input[name="'+multiGroups[n]+'"]:checked');return Array.from(boxes).map(b=>b.value).join(',')}var g=document.getElementById('gap'+n);if(g)return g.value;var s=document.getElementById('sel'+n);if(s)return s.value;var r=document.querySelector('input[name="q'+n+'"]:checked');return r?r.value:''}
function save(){for(var n=1;n<=40;n++){var v=val(n);if(v)state[n]=v}}
function restore(){for(var n=1;n<=40;n++){if(!state[n])continue;if(multiGroups[n]){var vals=state[n].split(',');vals.forEach(function(v){var cb=document.querySelector('input[name="'+multiGroups[n]+'"][value="'+v+'"]');if(cb)cb.checked=true});continue}var g=document.getElementById('gap'+n);if(g)g.value=state[n];var s=document.getElementById('sel'+n);if(s)s.value=state[n];var r=document.querySelector('input[name="q'+n+'"][value="'+state[n]+'"]');if(r)r.checked=true}}
function answered(n){return !!state[n]||!!val(n)}
function count(p){var r=ranges[p],c=0;for(var i=r[0];i<=r[1];i++)if(answered(i))c++;return c}
function drawFooter(){save();var h='';[1].forEach(p=>{var r=ranges[p];h+='<div class="partnav"><button class="partlabel" data-part="'+p+'" disabled>Reading Passage 1</button>';if(p===active){h+='<div class="tiles">';for(var n=r[0];n<=r[1];n++)h+='<button class="tile '+(answered(n)?'answered':'')+'" data-q="'+n+'">'+n+'</button>';h+='</div>'}else h+='<span class="count">'+count(p)+' of '+(r[1]-r[0]+1)+'</span>';h+='</div>'});h+='<button class="review" id="review">OK</button>';footer.innerHTML=h}
document.addEventListener('change',()=>{save();drawFooter()});document.addEventListener('input',()=>{save();drawFooter()});
var lastScore=null;
function renderActive(){left.innerHTML=passages[active];right.innerHTML=qhtml(active);restore();if(graded){regradeCurrent();right.insertAdjacentHTML('afterbegin','<div class="score">Your score: <b>'+lastScore+' / 13</b></div><p style="margin:-8px 0 18px;color:#555">Explanations with the exact location in the passage are shown below each answer.</p>')}drawFooter();left.scrollTop=right.scrollTop=0}
footer.onclick=e=>{var p=e.target.closest('[data-part]');if(p){save();active=+p.dataset.part;renderActive();return}var q=e.target.closest('[data-q]');if(q){var n=+q.dataset.q;(document.getElementById('q'+n)||document.getElementById('gap'+n)||document.getElementById('sel'+n))?.scrollIntoView({behavior:'smooth',block:'center'});return}if(e.target.closest('#review'))review()};
function review(){save();var a=0;for(var n=1;n<=13;n++)if(answered(n))a++;subwrap.innerHTML='<p>You have answered <b>'+a+'</b> of 13 questions.</p><p><button class="ovrow submit" id="final">Submit test</button></p>';final.onclick=grade;submit.classList.add('show')}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function correct(n,v){if(multiGroups[n]){var parts=(v||'').split(',').map(norm).filter(Boolean);return parts.includes(norm(answers[n]))}return [answers[n]].concat(alt[n]||[]).some(a=>norm(a)===norm(v))}
function explHTML(n){var e=EXPL[n];if(!e)return '';return '<div class="expl"><b>Q'+n+' — correct answer: '+answers[n]+'</b> &nbsp;<span class="expl-loc">('+e.loc+')</span><br>'+e.text+'</div>'}
function markGap(n){var x=document.getElementById('gap'+n);if(!x)return;var ok=correct(n,x.value);x.disabled=true;x.classList.add(ok?'ok':'no');x.insertAdjacentHTML('afterend',(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>')+explHTML(n));return ok}
function markSel(n){var s=document.getElementById('sel'+n);if(!s)return;var ok=correct(n,s.value);s.disabled=true;s.classList.add(ok?'ok':'no');var row=document.getElementById('q'+n);var tag=(ok?' <span class="tag ok">\u2713</span>':' <span class="tag no">\u2718 correct: '+answers[n]+'</span>');if(row){row.insertAdjacentHTML('beforeend',tag);row.insertAdjacentHTML('afterend',explHTML(n))}else{s.insertAdjacentHTML('afterend',tag);var host=s.closest('p')||s;host.insertAdjacentHTML('afterend',explHTML(n))}return ok}
function markRadio(n){var r=document.querySelector('input[name="q'+n+'"]:checked');var ok=r&&correct(n,r.value);document.querySelectorAll('input[name="q'+n+'"]').forEach(i=>i.disabled=true);var box=document.getElementById('q'+n);box.insertAdjacentHTML('beforeend',(ok?'<span class="tag ok">\u2713</span>':'<span class="tag no">\u2718 correct: '+answers[n]+'</span>'));box.insertAdjacentHTML('afterend',explHTML(n));return ok}
function markMulti(group){var qNums=groupQNums[group];var boxes=document.querySelectorAll('input[name="'+group+'"]');var checkedVals=Array.from(boxes).filter(function(b){return b.checked}).map(function(b){return b.value});boxes.forEach(function(b){b.disabled=true});var container=document.getElementById('q_'+group);var tagHtml='';qNums.forEach(function(qn){var ok=checkedVals.includes(answers[qn]);tagHtml+=' '+(ok?'<span class="tag ok">Q'+qn+' \u2713</span>':'<span class="tag no">Q'+qn+' \u2718 correct: '+answers[qn]+'</span>')});container.insertAdjacentHTML('beforeend','<div style="margin-top:8px;">'+tagHtml+'</div>');var explAll='';qNums.forEach(function(qn){explAll+=explHTML(qn)});container.insertAdjacentHTML('afterend',explAll)}
function regradeCurrent(){var r=ranges[active];var doneGroups={};for(var n=r[0];n<=r[1];n++){if(multiGroups[n]){if(!doneGroups[multiGroups[n]]){markMulti(multiGroups[n]);doneGroups[multiGroups[n]]=true}continue}var g=document.getElementById('gap'+n),s=document.getElementById('sel'+n),rad=document.querySelector('input[name="q'+n+'"]');if(g)markGap(n);else if(s)markSel(n);else if(rad)markRadio(n)}}
function grade(){if(graded)return;save();var score=0;for(var n=1;n<=13;n++)if(correct(n,state[n]||''))score++;lastScore=score;graded=true;active=1;renderActive();submit.classList.remove('show')}
var drag=false;div.onmousedown=()=>{drag=true;document.body.style.userSelect='none'};window.onmouseup=()=>{drag=false;document.body.style.userSelect=''};window.onmousemove=e=>{if(!drag)return;var r=split.getBoundingClientRect();left.style.width=Math.max(220,Math.min(r.width-240,e.clientX-r.left))+'px'};
split.onmouseup=()=>setTimeout(()=>{var s=getSelection();if(!s||s.isCollapsed||!s.rangeCount){tools.style.display='none';return}var rg=s.getRangeAt(0);if(!split.contains(rg.commonAncestorContainer)){tools.style.display='none';return}var rc=rg.getBoundingClientRect();tools.style.display='flex';tools.style.left=(rc.left+scrollX)+'px';tools.style.top=Math.max(8,rc.top+scrollY-42)+'px'},1);
tools.onclick=e=>{var b=e.target.closest('button'),s=getSelection();if(!b||!s.rangeCount)return;var rg=s.getRangeAt(0);if(b.dataset.act==='hl'){try{var sp=document.createElement('span');sp.className='hl';rg.surroundContents(sp)}catch(_){document.execCommand('hiliteColor',false,'#ffe45c')}}else document.querySelectorAll('.hl').forEach(h=>h.replaceWith(document.createTextNode(h.textContent)));s.removeAllRanges();tools.style.display='none'};
render();
})();
</script></body></html>
